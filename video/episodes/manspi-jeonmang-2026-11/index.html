<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"manspi-jeonmang-2026-11","topic":"stock","duration":476.23,"audio":"../../../stock/source/manspi-jeonmang-2026-11/narration.mp3","thumb":null,"synced":"2026-11-11T15:46:42Z","tts":"2026-11-11T15:28:44","script_sha1":"9150a7e205ca9486","sent":[{"n":1,"part":"도입","text":"코스피 1만 간다는 전문가 말을 믿고, 전 재산을 주식에 넣으신 분들도 계실 겁니다.","start":0.3,"end":5.664},{"n":2,"part":"도입","text":"은퇴 자금까지 끌어다 넣었는데 주가가 곤두박질치니, 밤마다 계좌를 열어 보셨겠죠.","start":6.044,"end":11.463},{"n":3,"part":"도입","text":"실제로 코스피는 6월 고점에서, 11월 6일까지 44.5% 하락했습니다.","start":11.843,"end":17.517},{"n":4,"part":"도입","text":"그런데 손실이 나도, 그 말을 한 사람은 내 돈을 책임져 주지 않습니다.","start":17.897,"end":22.167},{"n":5,"part":"도입","text":"그래도 또 이런 고민이 드시죠.","start":22.547,"end":24.48},{"n":6,"part":"도입","text":"\"코스피 1만 간다는데, 지금이라도 매수해야 할까요?\"","start":24.86,"end":28.118},{"n":7,"part":"도입","text":"\"유명한 전문가가 찍어 준 종목인데, 믿어도 될까요?\"","start":28.498,"end":31.83},{"n":8,"part":"도입","text":"그래서 오늘은 걸러야 할 말과 참고해도 되는 말을, 실제 예시로 딱 나눠 드리겠습니다.","start":32.21,"end":37.306},{"n":9,"part":"도입","text":"특히 다섯 번째 걸러야 할 말은, 이미 손실을 보신 분들이라면 꼭 아셔야 합니다.","start":37.686,"end":42.834},{"n":10,"part":"걸러야 할 말","text":"걸러야 할 말 다섯 가지에는, 공통점이 하나 있습니다.","start":43.834,"end":47.181},{"n":11,"part":"걸러야 할 말","text":"전문가도 미리 알 수 없는 미래를, 아는 것처럼 말한다는 겁니다.","start":47.561,"end":51.29},{"n":12,"part":"걸러야 할 말","text":"첫 번째, 날짜와 숫자를 못 박는 말입니다.","start":51.67,"end":54.526},{"n":13,"part":"걸러야 할 말","text":"\"올해 12월에는 코스피가 반드시 1만을 찍습니다.\"","start":54.906,"end":57.806},{"n":14,"part":"걸러야 할 말","text":"\"이 종목은 석 달 안에 정확히 10만 원까지 갑니다.\"","start":58.186,"end":61.364},{"n":15,"part":"걸러야 할 말","text":"그럼 이런 전문가는 무슨 자신감으로 날짜와 숫자까지 딱 잘라 말할까요?","start":61.744,"end":66.112},{"n":16,"part":"걸러야 할 말","text":"전문가들은 보통 기업 이익과 금리, 환율을 먼저 예상해서 목표치를 계산합니다.","start":66.492,"end":71.831},{"n":17,"part":"걸러야 할 말","text":"문제는 그 예상값이 모두, 아직 일어나지 않은 미래라는 겁니다.","start":72.211,"end":76.147},{"n":18,"part":"걸러야 할 말","text":"예상 하나만 빗나가도, 목표치는 크게 달라지죠.","start":76.527,"end":79.618},{"n":19,"part":"걸러야 할 말","text":"2022년을 앞두고, 코스피를 가장 낮게 본 증권사도 2,610이었습니다.","start":79.998,"end":85.089},{"n":20,"part":"걸러야 할 말","text":"그런데 그해 코스피는 24.9% 하락해, 그보다도 낮게 끝났습니다.","start":85.469,"end":90.363},{"n":21,"part":"걸러야 할 말","text":"반대로 2026년을 앞두고는, 가장 높게 본 증권사가 5,500이었는데요.","start":90.743,"end":96.082},{"n":22,"part":"걸러야 할 말","text":"6월에 코스피는 9,114까지 올라, 그보다 65.7% 높았습니다.","start":96.462,"end":101.639},{"n":23,"part":"걸러야 할 말","text":"코스피가 내려갈 때도, 오를 때도 증권사 전망은 크게 빗나간 거죠.","start":102.019,"end":105.972},{"n":24,"part":"걸러야 할 말","text":"숫자를 계산했다는 것과, 그 숫자를 맞힌다는 건 전혀 다른 이야기입니다.","start":106.352,"end":111.06},{"n":25,"part":"걸러야 할 말","text":"그래서 \"반드시\", \"정확히\", \"몇 월까지\"라는 말이 붙으면 일단 거르세요.","start":111.44,"end":116.03},{"n":26,"part":"걸러야 할 말","text":"두 번째, 한 종목을 정답처럼 찍어 주는 말입니다.","start":116.41,"end":119.584},{"n":27,"part":"걸러야 할 말","text":"\"다른 건 볼 필요 없이, 이 종목 하나만 매수하세요.\"","start":119.964,"end":123.835},{"n":28,"part":"걸러야 할 말","text":"\"다음 대장주는 이 회사라서, 지금 매수하면 두 배 갑니다.\"","start":124.215,"end":127.891},{"n":29,"part":"걸러야 할 말","text":"이런 말은 방송이나 단톡방에서 자주 들으셨을 겁니다.","start":128.271,"end":131.441},{"n":30,"part":"걸러야 할 말","text":"전문가가 회사의 매출과 기술력을 우리보다 자세히 볼 수는 있습니다.","start":131.821,"end":136.171},{"n":31,"part":"걸러야 할 말","text":"하지만 좋은 회사를 알아보는 것과, 주가가 언제 오를지 맞히는 건 다른 문제입니다.","start":136.551,"end":141.677},{"n":32,"part":"걸러야 할 말","text":"좋은 소식이 이미 알려져, 주가가 먼저 올라 있을 수도 있고요.","start":142.057,"end":146.044},{"n":33,"part":"걸러야 할 말","text":"경쟁사 발표나 규제, 환율처럼 회사 밖의 일로 주가가 급락하기도 합니다.","start":146.424,"end":150.866},{"n":34,"part":"걸러야 할 말","text":"그런데도 전문가들은 왜 한 종목을 이렇게 강하게 추천할까요?","start":151.246,"end":155.034},{"n":35,"part":"걸러야 할 말","text":"확실하게 들리는 말일수록 눈길을 끌기 쉽습니다.","start":155.414,"end":158.404},{"n":36,"part":"걸러야 할 말","text":"하지만 확실하게 들린다고, 맞는다는 뜻은 아니죠.","start":158.784,"end":161.704},{"n":37,"part":"걸러야 할 말","text":"증권사 보고서를 봐도, 거의 다 매수 의견입니다.","start":162.084,"end":165.267},{"n":38,"part":"걸러야 할 말","text":"2025년 상반기 상위 20개 증권사 평균, 매도 의견은 0.1%였습니다.","start":165.647,"end":171.318},{"n":39,"part":"걸러야 할 말","text":"천 건에 한 건꼴이죠.","start":171.698,"end":173.037},{"n":40,"part":"걸러야 할 말","text":"매도 의견이 없다고, 그 종목이 안전하다는 뜻은 아닙니다.","start":173.417,"end":177.166},{"n":41,"part":"걸러야 할 말","text":"전문가가 종목 이름만 말하고 틀릴 때의 위험을 말하지 않으면, 거르세요.","start":177.546,"end":181.816},{"n":42,"part":"걸러야 할 말","text":"세 번째, 바닥과 꼭대기를 안다고 말하는 말입니다.","start":182.196,"end":185.336},{"n":43,"part":"걸러야 할 말","text":"\"지금이 마지막 매수 기회입니다.\"","start":185.716,"end":187.615},{"n":44,"part":"걸러야 할 말","text":"\"여기서 더 떨어질 일은 없습니다.\"","start":187.995,"end":190.025},{"n":45,"part":"걸러야 할 말","text":"\"오늘이 고점이니 지금 전부 매도하세요.\"","start":190.405,"end":192.573},{"n":46,"part":"걸러야 할 말","text":"바닥과 꼭대기는 지나고 나서야 알 수 있습니다.","start":192.953,"end":195.703},{"n":47,"part":"걸러야 할 말","text":"전문가도 모든 사람의 심리와 갑작스러운 사건을 미리 알 수는 없죠.","start":196.083,"end":199.923},{"n":48,"part":"걸러야 할 말","text":"2000년 이후 코스피가 30% 넘게 하락한 네 번 모두, 그날 매수해도 더 하락했습니다.","start":200.303,"end":206.103},{"n":49,"part":"걸러야 할 말","text":"많게는 매수한 가격에서 33.8%가 더 하락했죠.","start":206.483,"end":210.483},{"n":50,"part":"걸러야 할 말","text":"30% 하락했다고, 바닥이라는 보장은 없다는 뜻입니다.","start":210.863,"end":214.673},{"n":51,"part":"걸러야 할 말","text":"그래서 미리 정한 대로 나눠 매수하는 계획이 필요한 거죠.","start":215.053,"end":218.008},{"n":52,"part":"걸러야 할 말","text":"\"마지막 기회\"라는 말을 들으면, 지금 매수하지 않으면 손해 볼 것 같죠.","start":218.388,"end":222.522},{"n":53,"part":"걸러야 할 말","text":"계획 없이 매수하고 싶어질 때는, 먼저 멈추고 계획부터 세우세요.","start":222.902,"end":227.002},{"n":54,"part":"걸러야 할 말","text":"네 번째, 손실이 없다고 장담하는 말입니다.","start":227.382,"end":230.221},{"n":55,"part":"걸러야 할 말","text":"\"장기 투자하면 원금은 반드시 회복합니다.\"","start":230.601,"end":233.225},{"n":56,"part":"걸러야 할 말","text":"\"이 가격에서는 절대 손해 볼 수 없습니다.\"","start":233.605,"end":236.135},{"n":57,"part":"걸러야 할 말","text":"장기 투자가 틀린 게 아니라, '반드시'라는 장담이 문제입니다.","start":236.515,"end":240.418},{"n":58,"part":"걸러야 할 말","text":"우량 기업도 경쟁력을 잃을 수 있고, 시장 전체가 오래 부진할 수도 있습니다.","start":240.798,"end":245.578},{"n":59,"part":"걸러야 할 말","text":"주식을 오래 보유해도, 원금을 찾기까지 몇 년이 걸릴 수 있습니다.","start":245.958,"end":250.218},{"n":60,"part":"걸러야 할 말","text":"2000년 이후 코스피가 최고점에서 30% 넘게 하락했다 회복한 네 번을 보면요.","start":250.598,"end":255.808},{"n":61,"part":"걸러야 할 말","text":"고점에 매수한 돈이 원금을 찾는 데, 길게는 5년 반 걸렸습니다.","start":256.188,"end":260.358},{"n":62,"part":"걸러야 할 말","text":"2007년 고점에 매수했다면, 12.6년 뒤에도 원금보다 낮은 날이 있었습니다.","start":260.738,"end":266.048},{"n":63,"part":"걸러야 할 말","text":"그 사이에 은퇴 자금이 필요했다면, 손실을 그대로 확정할 수밖에 없었겠죠.","start":266.428,"end":270.892},{"n":64,"part":"걸러야 할 말","text":"주가가 언제 회복할지 모르는데, '반드시'라고 하는 게 문제인 거죠.","start":271.272,"end":275.317},{"n":65,"part":"걸러야 할 말","text":"손실 가능성을 지운 말은 전망이 아니라, 보장처럼 꾸민 말이니 믿지 마세요.","start":275.697,"end":280.099},{"n":66,"part":"걸러야 할 말","text":"다섯 번째가 앞에서 말씀드린, 손실 중인 분들이 꼭 아셔야 할 말입니다.","start":280.479,"end":284.899},{"n":67,"part":"걸러야 할 말","text":"전망이 틀린 뒤에도 이유는 말하지 않고, 같은 확신만 반복하는 말이죠.","start":285.279,"end":289.947},{"n":68,"part":"걸러야 할 말","text":"손실 중일수록, '더 매수하라'는 말에 마음이 흔들리기 쉽습니다.","start":290.327,"end":294.163},{"n":69,"part":"걸러야 할 말","text":"이런 전문가는 처음에 \"올해 코스피 1만 갑니다\"라고 말합니다.","start":294.543,"end":298.706},{"n":70,"part":"걸러야 할 말","text":"그런데 주가가 하락하면, \"오히려 지금 더 매수해야 합니다\"라고만 하죠.","start":299.086,"end":303.135},{"n":71,"part":"걸러야 할 말","text":"이건 하락 전에 미리 정해 둔 계획대로 나눠 매수하는 것과 다릅니다.","start":303.515,"end":307.141},{"n":72,"part":"걸러야 할 말","text":"그 전문가는 이익 전망과 금리, 환율이 어떻게 달라졌는지 말하지 않죠.","start":307.521,"end":312.01},{"n":73,"part":"걸러야 할 말","text":"전망은 틀릴 수 있습니다.","start":312.39,"end":313.797},{"n":74,"part":"걸러야 할 말","text":"하지만 틀린 이유를 말하지 않으면, 다음 전망도 믿을 근거가 없습니다.","start":314.177,"end":318.557},{"n":75,"part":"걸러야 할 말","text":"그러니 더 매수하기 전에, 전문가가 틀린 이유부터 말했는지 확인하세요.","start":318.937,"end":323.497},{"n":76,"part":"걸러야 할 말","text":"여기까지 들으면, 전문가 말은 다 쓸모없나 싶으실 겁니다.","start":323.877,"end":327.614},{"n":77,"part":"걸러야 할 말","text":"그런데 전문가가 근거를 가지고 할 수 있는 일도 분명히 있습니다.","start":327.994,"end":331.653},{"n":78,"part":"걸러야 할 말","text":"미래의 숫자를 맞히는 게 아니라, 지금 나온 자료로 시장의 상태를 진단하는 일이죠.","start":332.033,"end":336.948},{"n":79,"part":"걸러야 할 말","text":"그럼 어떤 말이 그런 말일까요?","start":337.328,"end":339.069},{"n":80,"part":"참고해도 되는 말","text":"참고해도 되는 말 네 가지는, 모두 확인하거나 따져 볼 근거를 줍니다.","start":340.069,"end":344.129},{"n":81,"part":"참고해도 되는 말","text":"첫 번째, 경제 지표로 지금 시장의 상태를 설명하는 말입니다.","start":344.509,"end":348.139},{"n":82,"part":"참고해도 되는 말","text":"\"금리가 높은 채로 이어지고 기업 이익이 줄어서, 시장에 부담이 큽니다.\"","start":348.519,"end":352.669},{"n":83,"part":"참고해도 되는 말","text":"\"물가 오름세가 꺾이고 수출이 살아나는 건, 시장 전체에 좋은 신호입니다.\"","start":353.049,"end":357.874},{"n":84,"part":"참고해도 되는 말","text":"이런 말은 다음 달 지수를 맞히는 게 아니라, 발표된 숫자로 지금을 봅니다.","start":358.254,"end":362.914},{"n":85,"part":"참고해도 되는 말","text":"다만 좋은 신호라도, 오른다는 보장은 아닙니다.","start":363.294,"end":366.101},{"n":86,"part":"참고해도 되는 말","text":"두 번째, 회사의 지금 실적과 빚을 근거로 말하는 경우입니다.","start":366.481,"end":370.481},{"n":87,"part":"참고해도 되는 말","text":"\"이 회사는 매출은 늘었지만, 실제로 들어온 현금은 줄고 빚이 늘었습니다.\"","start":370.861,"end":375.466},{"n":88,"part":"참고해도 되는 말","text":"\"이익은 늘었지만, 주가가 1년 이익의 몇 배인지 보면 비싼 편입니다.\"","start":375.846,"end":379.916},{"n":89,"part":"참고해도 되는 말","text":"회사가 공개한 실적은, 누구나 확인할 수 있는 사실입니다.","start":380.296,"end":384.106},{"n":90,"part":"참고해도 되는 말","text":"중요한 건 전문가가 좋은 점과 위험한 점을 함께 말하는지입니다.","start":384.486,"end":388.276},{"n":91,"part":"참고해도 되는 말","text":"세 번째, 조건에 따라 경우를 나눠 말하는 경우입니다.","start":388.656,"end":392.166},{"n":92,"part":"참고해도 되는 말","text":"\"이익이 늘고 금리가 내려가면, 시장은 오를 힘을 받을 수 있습니다.\"","start":392.546,"end":396.508},{"n":93,"part":"참고해도 되는 말","text":"\"반대로 이익이 줄고 환율이 급등하면, 하락 위험이 커집니다.\"","start":396.888,"end":400.831},{"n":94,"part":"참고해도 되는 말","text":"이런 말을 들으면, 앞으로 무엇을 확인할지 알 수 있습니다.","start":401.211,"end":404.834},{"n":95,"part":"참고해도 되는 말","text":"믿을 것은 오른다는 결과가 아니라, 조건과 위험을 보여 주는 방식입니다.","start":405.214,"end":409.493},{"n":96,"part":"참고해도 되는 말","text":"네 번째, 전망을 바꿀 기준과 모르는 것을 밝히는 경우입니다.","start":409.873,"end":413.676},{"n":97,"part":"참고해도 되는 말","text":"\"기업 이익 전망이 지금보다 크게 낮아지면, 제 전망도 내려야 합니다.\"","start":414.056,"end":418.346},{"n":98,"part":"참고해도 되는 말","text":"\"길게 보면 오를 여지는 있지만, 다음 달 지수는 알 수 없습니다.\"","start":418.726,"end":422.726},{"n":99,"part":"참고해도 되는 말","text":"이런 말도 오히려 참고할 만합니다.","start":423.106,"end":425.111},{"n":100,"part":"참고해도 되는 말","text":"답답하게 들려도, 모르는 걸 모른다고 하는 게 가장 현실적인 태도입니다.","start":425.491,"end":429.95},{"n":101,"part":"참고해도 되는 말","text":"전문가의 일은 예언이 아니라, 확인된 정보와 위험을 쉽게 설명하는 거니까요.","start":430.33,"end":434.758},{"n":102,"part":"참고해도 되는 말","text":"그럼 다음에 전문가 전망을 들을 때, 무엇부터 확인하면 될까요?","start":435.138,"end":439.088},{"n":103,"part":"마무리","text":"딱 세 가지만 확인하세요.","start":440.088,"end":441.492},{"n":104,"part":"마무리","text":"첫째, 전문가가 날짜와 숫자를 못 박는지 봅니다.","start":441.872,"end":445.042},{"n":105,"part":"마무리","text":"둘째, 금리와 실적처럼 이미 발표된 숫자를 근거로 드는지 봅니다.","start":445.422,"end":449.76},{"n":106,"part":"마무리","text":"셋째, 틀리면 어떻게 되는지, 언제 전망을 바꿀지 말하는지 봅니다.","start":450.14,"end":454.48},{"n":107,"part":"마무리","text":"전문가는 내 돈을 책임지지 않으니, 이 세 가지로 직접 걸러 들으세요.","start":454.86,"end":459.31},{"n":108,"part":"마무리","text":"이 영상의 말도, 같은 기준으로 걸러 들으시면 됩니다.","start":459.69,"end":463.106},{"n":109,"part":"마무리","text":"좋은 전문가는 크게 외치는 사람이 아니라, 조건과 위험을 솔직하게 보여 주는 사람입니다.","start":463.486,"end":468.834},{"n":110,"part":"마무리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":469.214,"end":471.424},{"n":111,"part":"마무리","text":"시청해주셔서 감사합니다.","start":471.804,"end":473.334}],"subs":[[0.2,6.044,"코스피 1만 간다는 전문가 말을 믿고,\n전 재산을 주식에 넣으신 분들도 계실 겁니다."],[6.044,11.843,"은퇴 자금까지 끌어다 넣었는데 주가가 곤두박질치니,\n밤마다 계좌를 열어 보셨겠죠."],[11.843,17.897,"실제로 코스피는 6월 고점에서, 11월 6일까지 44.5% 하락했습니다."],[17.897,22.547,"그런데 손실이 나도, 그 말을 한 사람은 내 돈을 책임져 주지 않습니다."],[22.547,24.86,"그래도 또 이런 고민이 드시죠."],[24.86,28.498,"\"코스피 1만 간다는데, 지금이라도 매수해야 할까요?\""],[28.498,32.21,"\"유명한 전문가가 찍어 준 종목인데, 믿어도 될까요?\""],[32.21,37.686,"그래서 오늘은 걸러야 할 말과 참고해도 되는 말을,\n실제 예시로 딱 나눠 드리겠습니다."],[37.686,43.834,"특히 다섯 번째 걸러야 할 말은,\n이미 손실을 보신 분들이라면 꼭 아셔야 합니다."],[43.834,47.561,"걸러야 할 말 다섯 가지에는, 공통점이 하나 있습니다."],[47.561,51.67,"전문가도 미리 알 수 없는 미래를, 아는 것처럼 말한다는 겁니다."],[51.67,54.906,"첫 번째, 날짜와 숫자를 못 박는 말입니다."],[54.906,58.186,"\"올해 12월에는 코스피가 반드시 1만을 찍습니다.\""],[58.186,61.744,"\"이 종목은 석 달 안에 정확히 10만 원까지 갑니다.\""],[61.744,66.492,"그럼 이런 전문가는 무슨 자신감으로\n날짜와 숫자까지 딱 잘라 말할까요?"],[66.492,72.211,"전문가들은 보통 기업 이익과 금리,\n환율을 먼저 예상해서 목표치를 계산합니다."],[72.211,76.527,"문제는 그 예상값이 모두, 아직 일어나지 않은 미래라는 겁니다."],[76.527,79.998,"예상 하나만 빗나가도, 목표치는 크게 달라지죠."],[79.998,85.469,"2022년을 앞두고, 코스피를 가장 낮게 본 증권사도 2,610이었습니다."],[85.469,90.743,"그런데 그해 코스피는 24.9% 하락해, 그보다도 낮게 끝났습니다."],[90.743,96.462,"반대로 2026년을 앞두고는, 가장 높게 본 증권사가 5,500이었는데요."],[96.462,102.019,"6월에 코스피는 9,114까지 올라, 그보다 65.7% 높았습니다."],[102.019,106.352,"코스피가 내려갈 때도, 오를 때도 증권사 전망은 크게 빗나간 거죠."],[106.352,111.44,"숫자를 계산했다는 것과,\n그 숫자를 맞힌다는 건 전혀 다른 이야기입니다."],[111.44,116.41,"그래서 \"반드시\", \"정확히\",\n\"몇 월까지\"라는 말이 붙으면 일단 거르세요."],[116.41,119.964,"두 번째, 한 종목을 정답처럼 찍어 주는 말입니다."],[119.964,124.215,"\"다른 건 볼 필요 없이, 이 종목 하나만 매수하세요.\""],[124.215,128.271,"\"다음 대장주는 이 회사라서, 지금 매수하면 두 배 갑니다.\""],[128.271,131.821,"이런 말은 방송이나 단톡방에서 자주 들으셨을 겁니다."],[131.821,136.551,"전문가가 회사의 매출과 기술력을 우리보다 자세히 볼 수는 있습니다."],[136.551,142.057,"하지만 좋은 회사를 알아보는 것과,\n주가가 언제 오를지 맞히는 건 다른 문제입니다."],[142.057,146.424,"좋은 소식이 이미 알려져, 주가가 먼저 올라 있을 수도 있고요."],[146.424,151.246,"경쟁사 발표나 규제,\n환율처럼 회사 밖의 일로 주가가 급락하기도 합니다."],[151.246,155.414,"그런데도 전문가들은 왜 한 종목을 이렇게 강하게 추천할까요?"],[155.414,158.784,"확실하게 들리는 말일수록 눈길을 끌기 쉽습니다."],[158.784,162.084,"하지만 확실하게 들린다고, 맞는다는 뜻은 아니죠."],[162.084,165.647,"증권사 보고서를 봐도, 거의 다 매수 의견입니다."],[165.647,171.698,"2025년 상반기 상위 20개 증권사 평균, 매도 의견은 0.1%였습니다."],[171.698,173.417,"천 건에 한 건꼴이죠."],[173.417,177.546,"매도 의견이 없다고, 그 종목이 안전하다는 뜻은 아닙니다."],[177.546,182.196,"전문가가 종목 이름만 말하고\n틀릴 때의 위험을 말하지 않으면, 거르세요."],[182.196,185.716,"세 번째, 바닥과 꼭대기를 안다고 말하는 말입니다."],[185.716,187.995,"\"지금이 마지막 매수 기회입니다.\""],[187.995,190.405,"\"여기서 더 떨어질 일은 없습니다.\""],[190.405,192.953,"\"오늘이 고점이니 지금 전부 매도하세요.\""],[192.953,196.083,"바닥과 꼭대기는 지나고 나서야 알 수 있습니다."],[196.083,200.303,"전문가도 모든 사람의 심리와 갑작스러운 사건을 미리 알 수는 없죠."],[200.303,206.483,"2000년 이후 코스피가 30% 넘게 하락한 네 번 모두,\ function headOf(A, f) {                              // 원화 f 의 머리 상자 (세계 좌표) [x0, y0, x1, y1]
  const m = MAN[f], h = m.pt.head;
  const cx = A.x + (h[0] - m.ax) * A.s, cy = A.y + (h[1] - m.ay) * A.s, w = h[2] * A.s, hh = h[3] * A.s;
  return [cx - w / 2, cy - hh / 2, cx + w / 2, cy + hh / 2];
}
function thinkBubble(W_, A, f, html, t, out, w, side) {   // 시청자 머리 옆 생각 말풍선 (머리를 가리지 않게 — 옆으로)
  w = w || 400;
  const hb = headOf(A, f), dir = side || -1;
  const bx = dir < 0 ? hb[0] - w / 2 - 30 : hb[2] + w / 2 + 30, by = hb[1] + 40;
  const b = bubble(W_.L.fly, "round", html, 42, w);
  gsap.set(b, { x: bx, y: by, transformOrigin: dir < 0 ? "100% 100%" : "0% 100%" });
  tl.fromTo(b, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.2)", immediateRender: false }, t);

}
function air(n) { return Z(n, "AIR"); }
function phoneInsert(W_, bg) {                      // 휴대전화 가까이 — 뒤 방은 흐리게 · 화면 상자를 돌려줌

}
function wallPanel(wb, x, w, yr, band, color) {     // 뒤 화면 안 그래프 판 (x·w = 화면 안 좌표) — 값→y 함수를 돌려줌

  return { p, bnd, Y };
}
function dotGrid(parent, x, y, cols, rows, gap, r, t, dur) {   // 점 cols×rows 개가 차례로 (BUY 의견 = 빨강)
  const g = K.el(`<div class="box" style="left:${x}px;top:${y}px;width:${cols * gap}px;height:${rows * gap}px"></div>`, parent);
