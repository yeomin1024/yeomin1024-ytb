     (사용자 지시 2026-11-02 "주제 탐색(…)도 평가 아티팩트 만들고 통과된것만 대본 평가 아티팩트로 넘겨 그리고 피드백 삭제 버튼도 있어야 할듯
      그리고 처음 평가판에 올라가기 전에는 일반, 반론 페르소나로 점검은 거쳐야해").
     주제 글 = 아래 TOPICS 칸 (tools/topic_board.py 가 stock/topics/board/topics_*.json 에서 채움 — 손으로 고치지 않음 · 점검 = tools/board_check.py package).
     db: verdicts/<주제 id> {id, batch, verdict: pass|hold|fail, note, updatedAt} · feedback {topic, batch, field, text, createdAt, updatedAt, status(new|done), reply}.
     통과(pass) → Claude 가 대본(롱폼·쇼츠)을 쓰고 board_check script 통과 뒤 대본 피드백판(https://claude.ai/artifact/7UQobTs4TU45V4GCMqWCZz)에 올림.
     연구·교육용 — 투자 권유가 아님. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 위 = 걸러 보기 · 아래 = 주제 카드 한 줄에 하나(넓으면 롱폼·쇼츠 두 칸) · 칸마다 피드백 · 카드 아래 판정 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1B2320; --muted:#5C6A65; --line:#DCE3E0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --pass:#2B7A55; --hold:#8A6A00; --fail:#B83227; --mark:#E0A800; --thumb:#141A2B; --thumb-ink:#FFFFFF; --thumb-y:#FFD400; --thumb-r:#FF5A4A;
  --shadow:0 10px 30px -18px rgba(20,40,35,.45);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --ink:#E6ECE9; --muted:#9AA8A3; --line:#2A3431;
  --accent:#3FC1AC; --accent-ink:#05221D; --accent-soft:#16352F;
  --pass:#62C793; --hold:#E2C15A; --fail:#FF6E5E; --mark:#E8BC34; --thumb:#0B0F1A; --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --ink:#E6ECE9; --muted:#9AA8A3; --line:#2A3431;
  --accent:#3FC1AC; --accent-ink:#05221D; --accent-soft:#16352F;
  --pass:#62C793; --hold:#E2C15A; --fail:#FF6E5E; --mark:#E8BC34; --thumb:#0B0F1A; --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header.top{display:grid;gap:6px}
header.top h1{font-size:clamp(20px,2.4vw,26px);margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--pass)} .status.bad .dot{background:var(--fail)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 13px var(--f-body);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn .c{font-family:var(--f-mono);margin-left:6px;opacity:.8}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:grid;min-width:0}
.card .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .id{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.card h2{margin:0;font-size:17px;flex:1 1 280px;min-width:0;text-wrap:balance}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.pass{color:var(--pass)} .chip.hold{color:var(--hold)} .chip.fail{color:var(--fail)} .chip.none{color:var(--muted)} .chip.chk{color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.col{padding:12px 18px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.col + .col{border-left:1px solid var(--line)}
.col h3{margin:4px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-family:var(--f-mono)}
.mock{background:var(--thumb);color:var(--thumb-ink);border-radius:12px;padding:14px 16px;display:grid;gap:4px;margin-bottom:6px;aspect-ratio:16/7;align-content:end;max-width:100%}
.mock.v{aspect-ratio:9/12;max-width:220px;align-content:center;text-align:center}
.mock .l{font-weight:700;font-size:clamp(16px,2.2vw,22px);line-height:1.2;text-wrap:balance}
.mock .l:first-child{color:var(--thumb-y)}
.mock .s{font-size:13px;color:#C9D2E2;order:-1}
.mock.v .s{order:0}
.f{border-top:1px dashed var(--line);padding:8px 0 6px;display:grid;gap:4px}
.f:first-of-type{border-top:0}
.f .lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.f .val{word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.f.big .val{font-weight:700;font-size:16px}
.addfb{border:0;background:none;color:var(--accent);font:600 12px var(--f-body);cursor:pointer;padding:2px 4px}
.fblist{display:grid;gap:6px}
.fb{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-size:13.5px;display:grid;gap:4px}
.fb .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb .when{font-size:11.5px;color:var(--muted);margin-right:auto}
.fb .reply{font-size:12.5px;color:var(--muted)}
.fb.done{opacity:.75}
.ed{display:grid;gap:6px}
textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px/1.5 var(--f-body);color:var(--ink);background:var(--bg)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.del{color:var(--fail);border-color:var(--fail);padding:2px 10px;font-size:12px}
.btn.v{min-width:96px}
.btn.v.pass[aria-pressed="true"]{background:var(--pass);border-color:var(--pass);color:#fff}
.btn.v.hold[aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#1B2320}
.btn.v.fail[aria-pressed="true"]{background:var(--fail);border-color:var(--fail);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.foot{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:8px}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:var(--muted)}
details.chk summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.chk ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30}
.btn:focus-visible,.fbtn:focus-visible,.addfb:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)} .col + .col{border-left:0;border-top:1px solid var(--line)}}
</style>

</div>

(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const T = DATA.batches.flatMap(b => b.packages.map(p => Object.assign({ batch: b.name }, p)));
  const st = { db: null, canWrite: true, verdicts: {}, fb: [], filter: "all", open: null, delAsk: null, busy: false };

  const SHORT = [["s_title", "쇼츠 제목", "big"], ["s_thumb_main", "쇼츠 썸네일 문구"], ["s_thumb_sub", "쇼츠 썸네일 보조 문구"], ["s_message", "쇼츠 전달 내용·방식"]];
  const VLAB = { pass: "통과 (대본으로)", hold: "보류", fail: "탈락" };
  const txt = v => Array.isArray(v) ? v.join("\n") : (v || "");
  const when = iso => { try { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; } catch (e) { return ""; } };
  let toastT; const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); };
  const ro = () => !st.db || !st.canWrite;
  const vOf = id => (st.verdicts[id] || {}).verdict || "";

  function renderFilters() {
    const n = k => k === "all" ? T.length : k === "none" ? T.filter(t => !vOf(t.id)).length : T.filter(t => vOf(t.id) === k).length;
    $("filters").innerHTML = [["all", "전체"], ["none", "평가 전"], ["pass", "통과"], ["hold", "보류"], ["fail", "탈락"]]
      .map(([k, l]) => `<button class="fbtn" type="button" data-k="${k}" aria-pressed="${st.filter === k}">${l}<span class="c">${n(k)}</span></button>`).join("");
  }
  $("filters").addEventListener("click", e => { const b = e.target.closest(".fbtn"); if (b) { st.filter = b.dataset.k; renderAll(); } });

  function field(t, key, lab, big) {
    const items = st.fb.filter(f => f.topic === t.id && f.field === key).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    const open = st.open === t.id + "|" + key;
    return `<div class="f ${big ? "big" : ""}"><div class="lab"><span>${esc(lab)}</span>${ro() ? "" : `<button class="addfb" type="button" data-act="open" data-id="${t.id}" data-k="${key}">${open ? "닫기" : "피드백"}</button>`}</div>
      <div class="val">${esc(txt(t[key]))}</div>
      <div class="fblist">${items.map(f => `<div class="fb ${f.status === "done" ? "done" : ""}"><div class="row"><span class="when">${when(f.updatedAt || f.createdAt)}${f.status === "done" ? " · 반영함" : ""}</span>${ro() ? "" : st.delAsk === f.id ? `<button class="btn del" type="button" data-act="delok" data-fid="${esc(f.id)}">정말 삭제</button><button class="btn" type="button" data-act="delno">취소</button>` : `<button class="btn del" type="button" data-act="del" data-fid="${esc(f.id)}">삭제</button>`}</div><div>${esc(f.text)}</div>${f.reply ? `<div class="reply"><b>Claude</b> ${esc(f.reply)}</div>` : ""}</div>`).join("")}</div>
      ${open ? `<div class="ed"><textarea id="ta-${t.id}-${key}" aria-label="${esc(lab)} 피드백" placeholder="이 칸에 대한 의견"></textarea><div class="row" style="display:flex;gap:8px"><button class="btn pri" type="button" data-act="save" data-id="${t.id}" data-k="${key}">피드백 저장</button></div></div>` : ""}
    </div>`;
  }
  function mock(lines, sub, v) { return `<div class="mock ${v ? "v" : ""}" aria-hidden="true">${(lines || []).map(l => `<div class="l">${esc(l)}</div>`).join("")}<div class="s">${esc(sub)}</div></div>`; }
  function card(t) {
    const v = vOf(t.id), note = (st.verdicts[t.id] || {}).note || "", ck = t.check || {};
    return `<article class="card" data-id="${t.id}">
      <div class="hd"><span class="id">${esc(t.id)} · ${esc(t.batch)}</span><h2>${esc(t.theme)}</h2>
        <span class="chip chk" title="tools/board_check.py">점검 ${ck.pass ? "통과" : "—"}${ck.warn && ck.warn.length ? ` · 확인 ${ck.warn.length}` : ""}</span>
        <span class="chip ${v || "none"}">${v ? esc(VLAB[v]) : "평가 전"}</span></div>
      <div class="cols">
        <div class="col"><h3>롱폼</h3>${mock(t.thumb_main, t.thumb_sub)}${LONG.map(([k, l, b]) => field(t, k, l, b)).join("")}</div>
        <div class="col"><h3>쇼츠</h3>${mock(t.s_thumb_main, t.s_thumb_sub, true)}${SHORT.map(([k, l, b]) => field(t, k, l, b)).join("")}</div>
      </div>
      <div class="foot">
        <div class="small">정답 확인 방법: ${esc(t.verify)}${t.basis ? ` · 분석 근거: ${esc(t.basis)}` : ""}</div>
        <details class="chk"><summary>평가판 전 점검 결과 (일반·반론 페르소나)</summary><ul>${[...(ck.fail || []).map(x => "❌ " + x), ...(ck.warn || []).map(x => "⚠ " + x), ...(ck.ok || []).map(x => "✅ " + x)].map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
        <div class="row">${["pass", "hold", "fail"].map(k => `<button class="btn v ${k}" type="button" data-act="verdict" data-id="${t.id}" data-v="${k}" aria-pressed="${v === k}" ${ro() ? "disabled" : ""}>${VLAB[k]}</button>`).join("")}
          ${v && !ro() ? `<button class="btn" type="button" data-act="unset" data-id="${t.id}">평가 지우기</button>` : ""}</div>
        ${v && v !== "pass" && note ? `<div class="small">메모: ${esc(note)}</div>` : ""}
      </div></article>`;
  }
  function renderCards() {
    const list = T.filter(t => st.filter === "all" || (st.filter === "none" ? !vOf(t.id) : vOf(t.id) === st.filter));
    $("cards").innerHTML = list.length ? list.map(card).join("") : `<p class="small">이 조건에 맞는 주제가 없습니다.</p>`;
  }
  function renderAll() { renderFilters(); renderCards(); }

  $("cards").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b || st.busy) return;
    const act = b.dataset.act, id = b.dataset.id, key = b.dataset.k;
    if (act === "open") { st.open = st.open === id + "|" + key ? null : id + "|" + key; renderCards(); const ta = $(`ta-${id}-${key}`); if (ta) ta.focus(); return; }
    if (act === "del") { st.delAsk = b.dataset.fid; renderCards(); return; }
    if (act === "delno") { st.delAsk = null; renderCards(); return; }
    st.busy = true; b.disabled = true;
    const t = T.find(x => x.id === id), now = new Date().toISOString();
    try {
      if (act === "save") {
        const v = ($(`ta-${id}-${key}`).value || "").trim(); if (!v) { st.busy = false; b.disabled = false; return; }
        await st.db.collection("feedback").add({ topic: id, batch: t.batch, field: key, text: v, createdAt: now, updatedAt: now, status: "new", reply: "" });
        st.open = null; toast("피드백을 저장했습니다");
      } else if (act === "delok") {
        await st.db.doc("feedback/" + b.dataset.fid).delete(); st.delAsk = null; toast("피드백을 삭제했습니다");
      } else if (act === "verdict") {
        await st.db.doc("verdicts/" + id).set({ id, batch: t.batch, verdict: b.dataset.v, note: "", updatedAt: now }); toast(VLAB[b.dataset.v] + "(으)로 저장했습니다");
      } else if (act === "unset") {
        await st.db.doc("verdicts/" + id).delete(); toast("평가를 지웠습니다");
      }
    } catch (err) { toast(err && err.code === "invalid_argument" ? "이 화면에서는 저장할 권한이 없습니다" : "저장하지 못했습니다. 다시 눌러 주세요."); }
    st.busy = false; renderAll();
  });

  renderAll();
  (async () => {
    const use = window.claude && window.claude.use ? n => window.claude.use(n) : () => Promise.resolve(null);
    let db = null, user = null;
    try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (e) { db = null; }
    if (!db) { $("status").className = "status bad"; $("status-t").textContent = "저장소에 연결하지 못했습니다 — 주제는 볼 수 있지만 평가·피드백은 저장되지 않습니다."; return; }
    st.db = db;
    try { if (user && user.can && (await user.can("data.write")) === false) st.canWrite = false; } catch (e) { /* 모름 */ }
    $("status").className = "status " + (st.canWrite ? "ok" : ""); $("status-t").textContent = st.canWrite ? "저장소 연결됨 — 평가·피드백은 바로 저장되고 Claude 가 읽습니다." : "보기 전용 — 이 화면에서는 저장할 수 없습니다.";
    db.collection("verdicts").onSnapshot(s => { st.verdicts = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, () => {});
    db.collection("feedback").onSnapshot(s => { st.fb = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") renderAll(); }, () => {});
    renderAll();
  })();
})();
</script>
