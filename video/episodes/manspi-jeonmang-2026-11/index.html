  SUM_L: [60, 120, 760, 700], SUM_R: [1100, 120, 760, 700],
};
window.LAYOUT_ALLOW = [["CARD", "TITLE"], ["CARD", "SIDE"], ["TAG_R", "ACT_R"], ["TAG_L", "ACT_L"], ["CHART", "ACT_C"], ["TAG_R", "ACT_C"], ["TAG_L", "ACT_C"]];

/* ─────────── 배경 층 (장면 .sc 밖) ─────────── */
const BGS = {};
for (const k of ["NIGHT", "STUDIO", "OFFICE", "SIEVE", "MORNING"]) BGS[k] = K.el(`<div class="bg" id="bg-${k}"><img src="${IMG}BG-${k}.jpg" alt=""></div>`);
function bgSpan(key, a, b, keep) {
  tl.fromTo(BGS[key], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none", immediateRender: false }, Math.max(0, a));
  if (!keep) tl.to(BGS[key], { opacity: 0, duration: 0.35, ease: "none" }, b - 0.35);
}

/* ─────────── 인물·소품 (bandoche 쇼츠 v1.0 과 같은 부품) ─────────── */
function sprite(key, s) {
  const m = MAN[key];
  if (!m) throw new Error(`그림 없음: ${key}`);
  return { key, w: m.w * s, h: m.h * s, ax: m.ax * s, ay: m.ay * s };
}
function actor(parent, slot, keys, x, y, s) {    // 발 선 가운데 (x, y) 에 서는 상자 — 자세 그림을 겹쳐 두고 보이는 것만 바꿈
  const sp = keys.map(k => sprite(k, s));
  const L = Math.max(...sp.map(p => p.ax)), R = Math.max(...sp.map(p => p.w - p.ax)), H = Math.max(...sp.map(p => p.ay)) + 6;
  const box = K.el(`<div class="act"${slot ? ` data-slot="${slot}"` : ""} style="left:${(x - L).toFixed(0)}px;top:${(y - H).toFixed(0)}px;width:${(L + R).toFixed(0)}px;height:${H.toFixed(0)}px"></div>`, parent);
  const imgs = {};
  for (const p of sp) imgs[p.key] = K.el(`<img src="${IMG}cut/${p.key}.png" alt="" style="left:${(L - p.ax).toFixed(0)}px;top:${(H - 6 - p.ay).toFixed(0)}px;width:${p.w.toFixed(0)}px;height:${p.h.toFixed(0)}px">`, box);
  gsap.set(box, { transformOrigin: `${(L / (L + R) * 100).toFixed(1)}% 100%` });
  return { box, imgs };
}
function pose(a, key, at, squash) {
  if (!a.imgs[key]) throw new Error(`자세 없음: ${key}`);
  for (const [k, im] of Object.entries(a.imgs)) tl.to(im, { opacity: k === key ? 1 : 0, duration: 0.14, ease: "none" }, at);
  if (squash !== false) tl.fromTo(a.box, { scaleY: 0.95, scaleX: 1.03 }, { scaleY: 1, scaleX: 1, duration: 0.32, ease: "back.out(3)", immediateRender: false }, at);
}
function idle(a, from, to) {
  const per = 1.1, n = Math.max(1, Math.floor((to - from) / per) - 1);
  tl.fromTo(a.box, { scaleY: 1 }, { scaleY: 1.012, duration: per / 2, ease: "sine.inOut", repeat: n, yoyo: true, immediateRender: false }, from);
}
function later(html, parent) { const n = K.el(html, parent); gsap.set(n, { opacity: 0 }); return n; }
function prop(parent, slot, key, cx, cy, s) {
  const p = sprite(key, s);
  return later(`<img class="pr"${slot ? ` data-slot="${slot}"` : ""} src="${IMG}cut/${key}.png" alt="" style="left:${(cx - p.w / 2).toFixed(0)}px;top:${(cy - p.h / 2).toFixed(0)}px;width:${p.w.toFixed(0)}px;height:${p.h.toFixed(0)}px">`, parent);
}
const pop = (n, at, from) => tl.fromTo(n, Object.assign({ opacity: 0, scale: 0.6 }, from), { opacity: 1, scale: 1, y: 0, x: 0, rotate: 0, duration: 0.45, ease: "back.out(2.2)", immediateRender: false }, at);
const popT = (n, at) => tl.fromTo(n, { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, at);   // 이름표 — 튀지 않게 (칸을 넘지 않음)
const hide = (n, at, d) => tl.to(n, { opacity: 0, duration: d || 0.3, ease: "none" }, at);
function tag(parent, slot, text, x, y, size, cls) {   // 짧은 한국어 칸
  return later(`<div class="tag ${cls || ""}" data-slot="${slot}" ${KO} style="left:${x}px;top:${y}px;font-size:${size || 56}px">${text}</div>`, parent);
}
function title(parent, no, text, cls) {           // 장·항목 이름표 (TITLE 칸 가운데)
  const [x, y, w, h] = LAY.TITLE;
  return later(`<div class="ttl ${cls || ""}" data-slot="TITLE" ${KO} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${no ? `<span class="no">${no}</span>` : ""}<span>${text}</span></div>`, parent);
}

/* ─────────── 거름망 무대 부품 ─────────── */
function tvBox(parent) {                           // 왼쪽 위 TV 화면 — 방송 스튜디오 배경 + 전문가 (무릎 위만 보임)
  const [x, y, w, h] = LAY.TV;
  const box = K.el(`<div class="tv" data-slot="TV" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img class="bgi" src="${IMG}BG-STUDIO.jpg" alt=""><span class="live"></span></div>`, parent);
  const keys = ["E-HYPE-1", "E-HYPE-2", "E-HYPE-3", "E-PUSH-1", "E-PUSH-2", "E-PUSH-3", "E-DODGE-1", "E-DODGE-2", "E-CALM-1", "E-CALM-2", "E-CALM-3", "E-DESK-3"];
  const ex = actor(box, null, keys, w / 2, h + 205, 0.85);   // 머리부터 허리까지 보이게
  return { box, ex };
}
const CARD_CX = 1010, CARD_REST = 470;            // 말 카드가 체에 걸려 쉬는 자리 (가운데)
function qcard(parent, bubble, text, size) {       // 말 카드: 빈 말풍선 그림 + 한국어 짧은 말 + 도장(나중)
  const m = MAN[bubble], s = 520 / m.w, w = m.w * s, h = m.h * s;
  const pad = bubble === "P-QUOTE-2" ? [0.2, 0.26] : [0.12, 0.16];
  const box = later(`<div class="card" data-slot="CARD" style="left:${(CARD_CX - w / 2).toFixed(0)}px;top:${(CARD_REST - h / 2).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px">
    <img src="${IMG}cut/${bubble}.png" alt="">
    <div class="qt" ${KO} style="left:${(w * pad[0]).toFixed(0)}px;top:${(h * pad[1]).toFixed(0)}px;width:${(w * (1 - 2 * pad[0])).toFixed(0)}px;height:${(h * (1 - 2 * pad[1]) - (bubble === "P-QUOTE-1" ? h * 0.08 : 0)).toFixed(0)}px;font-size:${size || 58}px">${text}</div></div>`, parent);
  return { box, w, h };
}
function stampOn(card, key, at) {                  // 카드 오른쪽 위에 도장
  const p = sprite(key, 0.62);
  const st = K.el(`<img class="stamp" src="${IMG}cut/${key}.png" alt="" style="left:${(card.w - p.w * 0.75).toFixed(0)}px;top:${(-p.h * 0.25).toFixed(0)}px;width:${p.w.toFixed(0)}px;height:${p.h.toFixed(0)}px">`, card.box);
  tl.fromTo(st, { opacity: 0, scale: 2.2, rotate: -18 }, { opacity: 1, scale: 1, rotate: -8, duration: 0.35, ease: "back.out(2)", immediateRender: false }, at);
}
function dropIn(card, at) {                        // 위에서 떨어져 체에 걸림
  tl.fromTo(card.box, { opacity: 0, y: -340, rotate: -6 }, { opacity: 1, y: 0, rotate: 0, duration: 0.7, ease: "bounce.out", immediateRender: false }, at);
}
function toBin(card, at) {                         // 걸러진 말 → 왼쪽 버리는 통
  tl.to(card.box, { x: 243 - CARD_CX, y: 700 - CARD_REST, scale: 0.34, rotate: -35, duration: 0.7, ease: "power2.in" }, at);
  tl.to(card.box, { opacity: 0, duration: 0.2, ease: "none" }, at + 0.62);
}
function toKeep(card, at) {                        // 통과한 말 → 체 아래 쟁반 → 오른쪽 보관함
  tl.to(card.box, { y: 840 - CARD_REST, scale: 0.42, duration: 0.55, ease: "power2.in" }, at);
  tl.to(card.box, { x: 1680 - CARD_CX, y: 700 - CARD_REST, scale: 0.34, duration: 0.6, ease: "power2.inOut" }, at + 0.6);
  tl.to(card.box, { opacity: 0, duration: 0.25, ease: "none" }, at + 1.1);
}
function glow(x, y, w, h, c, at, parent) {         // 통·보관함 반짝 (칸 안)
  const n = later(`<div class="a" data-slot="${x < 900 ? "BIN" : "KEEP"}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:30px;box-shadow:0 0 0 8px ${c},0 0 50px ${c}"></div>`, parent);
  tl.fromTo(n, { opacity: 0 }, { opacity: 0.9, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at);
  return n;
}

/* ═════════════ 거름망 항목 (3·4장) ═════════════ */
// it = {no, name, cls, from, to, quotes:[[문장, 말풍선, 글, 크기, 전문가 자세]], verdict: 판정 문장, keep: 통과, poses:[[시각, 자세]], side:(sc)=>…}
function item(it) {
  const a = BEGIN(it.from), b = END(it.to);
  bgSpan("SIEVE", a, b);
  const sc = K.scene(a, b);
  const t = title(sc, it.no, it.name, it.cls); popT(t, S(it.from) + 0.1);
  const tv = tvBox(sc);
  pose(tv.ex, it.poses[0][1], a, false);
  for (const [at, k] of it.poses.slice(1)) pose(tv.ex, k, at);
  idle(tv.ex, a, b);
  const cards = it.quotes.map(([n, bub, txt, size], i) => {
    const c = qcard(sc, bub, txt, size);
    dropIn(c, S(n) + 0.15);
    return { c, n, i };
  });
  // 여러 말이면 앞 말은 다음 말이 떨어질 때 옆으로 비켜 섬 (같은 칸 안)
  cards.forEach(({ c }, i) => {
    if (i < cards.length - 1) tl.to(c.box, { x: -305, y: -50, scale: 0.6, duration: 0.45, ease: "power2.out" }, S(cards[i + 1].n) - 0.1);
    if (i > 0) tl.set(c.box, { x: 0 }, S(cards[i].n));
  });
  const vt = it.verdictAt || S(it.verdict) + 0.15;
  cards.forEach(({ c }, i) => {
    stampOn(c, it.keep ? "P-MARKS-2" : "P-MARKS-1", vt + 0.12 * i);
    if (it.keep) toKeep(c, vt + 0.9 + 0.25 * i); else toBin(c, vt + 0.9 + 0.25 * i);
  });
  if (it.keep) glow(1460, 560, 440, 380, TL, vt + 1.6, sc); else glow(60, 560, 380, 380, RD, vt + 1.3, sc);
  if (it.side) it.side(sc);
  K.cut(vt + 0.4, `${it.cls === "g" ? "믿어도" : "걸러야"} ${it.no} 판정`);
