# =====================================================================================================
# 새 채널 분야 후보 — 주제: 새 주제 탐색 (폴더 new)
# VERSION: v1.1 — 2026-10-18 — '28. 수학 퀴즈' 더함 (사용자 지시 2026-10-18: "수학문제 띄워놓고 시청자가 맞춰보는 영상이 조회수 잘 나오고 구독자 많이
#          모을 수 있는지 탐색해볼래?") — 같은 잣대(한국어 롱폼)로 27개 분야와 견주려고. 쇼츠·영어(세계) 시장은 math/ 폴더 (math/README.md)
# (v1.0 — 2026-10-16 — 새로 만듦 (사용자 지시 2026-10-16: "이외에도 내가 어떤 채널을 만들어야 조회수 높은 영상 만들고 구독자 많이
#          모을 수 있을지 전체적으로 탐색해봐 저장소에 디렉토리 new로 만들어서 새로운 주제 탐색하기 위한 세팅해서 탐색해봐")
#
# 이 파일이 원본이다. 아래 두 파일은 이 파일에서 만든다 (손으로 고치지 않음):
#   new/keywords.txt   — 탐색 검색어 (분야마다 1~2개, '돌아가며' 순서 — 할당량이 중간에 끝나도 모든 분야가 검색어 1개씩은 먼저 검색됨)
#   new/tag_rules.toml — TAG_THEMES (분석 tools/success_analysis.py 가 제목 낱말로 '주제 묶음'을 가를 때)
#   → python3 tools/niche_scan.py new sync
# 분야 비교 표: python3 tools/niche_scan.py new report  (할당량 0 — 탐색 목록·캐시만 읽음) → new/result/niche/niche_scan.md
#
# 칸:
#   name     = 분야 이름 (표·주제 묶음 이름 — 번호를 붙여 순서를 고정)
#   group    = "A" 지금 제작 방식(얼굴 없음·AI 내레이션·HTML 애니메이션)으로 만들 수 있는 분야 — 검색어 2개
#              "B" 촬영이 필요한 분야 (비교용 — 검색어 1개)
#              "기준" 지금 채널 (재테크·주식) — 같은 방법으로 잰 기준선 (검색어 1개씩)
#   keywords = 탐색 검색어 (검색어 1개 = 4~20분·20분 넘음 검색 2번 = 200단위, 7일~ 캐시)
#   words    = 제목 낱말 → 이 분야 (분석의 주제 묶음 — 제목에서 가장 긴 낱말이 맞는 분야, 없으면 태그로).
#              한 글자 낱말(왕·국·달)과 아무 제목에나 나오는 말(이유·사실·수익)은 넣지 않음 — 다른 분야 제목을 잘못 끌어옴
#   make     = 지금 제작 방식으로 만들기 (상·중·하) — ⚠️ 측정이 아니라 판단 (Claude, 2026-10-16). 표에 '판단'으로 따로 적음
#   make_why = 그 판단의 까닭 한 줄
#
# 검색어를 고른 법: 분야마다 사람들이 그 분야를 찾을 때 쓰는 넓은 말 1~2개 (분야를 '찔러 보는' 검색어 — 한 주제 안의 태그를 고르는
#   tools/tag_keywords.py 는 분야를 넘나드는 비교에 맞지 않아 쓰지 않음). 결과가 좋은 분야는 그 분야만의 폴더를 따로 만들어 태그로 다시 고른다.
# 뺀 분야와 까닭: 게임·연예·스포츠·음악(저작권·얼굴·중계 — 지금 제작 방식과 멂), 정치·시사 뉴스(금방 낡음), 부동산·코인(재테크에서
#   사용자가 지운 묶음 — 2026-10-13), 재테크·주식 자체(이미 채널 있음 — '기준'으로만).
# ※ 연구·교육용 분석. 투자·의료·법률 권유가 아니다.
# =====================================================================================================

