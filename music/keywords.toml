# 관련어·제외어 — 주제: 음악 (폴더 music)
# VERSION: v1.0 — 2026-10-16 — 새로 만듦 (사용자 지시 2026-10-16 "이 환경은 이제 저장소에 있는 음악 주제 (music 경로 없으면 폴더 만들것)를
#          유튜브 분석 코드 실행해서 분석하는 환경이야 …"). 검색어 목록은 이 파일이 아니라 keywords.txt (한 줄에 하나 — tools/tag_keywords.py 가
#          실제 영상 태그로 고름). 관련어는 장르·쓰임새(수면·카페·공부)·모양(플레이리스트·커버·연주) 낱말.
#          ⚖️ 판단: 영어 관련어는 '글자 포함'으로 맞춰서 짧은 말은 다른 낱말 속에 걸림 — 'ost'(most·post·cost)·'cover'(discover)·'mv'(MVP)·
#          'song'(배우 이름 Song)은 강한 관련어에 넣지 않음. 한국어도 '가요'('어떤가요' 같은 물음 끝말)·'연주'(사람 이름)·'클래식'(클래식카)·
#          '인디'(인디언)·'밴드'(헤어밴드)는 약한 관련어로만. '노래'는 사연 제목('노래를 시켰다')에 많아 약한 관련어 — 대신 '노래모음' 같은 꼴은 강한.
#          'No BGM'(배경음 없는 강연)·'노래방'·'플리마켓'·'가사도우미'·'언더커버' 같은 다른 뜻은 RELEVANCE_EXCLUDE 로 먼저 지움.
#          new/ 캐시 4,037개로 시험해 고침 (README '규칙을 정한 근거').
#
# 이 파일을 읽는 코드: youtube_topic_analyzer.py (분석기) · tools/outlier_research.py (성공 사례) · tools/tag_keywords.py — 주제 관련 영상 가르기
#   규칙 (outlier_research.relevant): 제목·태그에 강한 관련어 1개 · 또는 설명(앞 1500자)에 강한 관련어 2번 · 또는 제목에 약한 관련어 1개 +
#   (설명에 강한 관련어 1번 또는 제목에 약한 관련어 2개). 영어는 대소문자 상관없이 글자 포함. 지우는 표현은 대소문자를 가림 (그대로 지움).
# 고치는 법: 메모장(또는 GitHub)으로 열어 "따옴표" 안의 글자만 바꾸고 저장.
# =====================================================================================================

