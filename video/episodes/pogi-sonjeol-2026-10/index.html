<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"pogi-sonjeol-2026-10","topic":"stock","duration":406.57,"audio":"../../../stock/source/pogi-sonjeol-2026-10/narration.mp3","thumb":null,"synced":"2026-10-23T10:05:18Z","tts":"2026-10-23T09:14:47","script_sha1":"1269d032551c3aa1","sent":[{"n":1,"part":"도입","text":"올해 반도체 주식 종목에 투자했다가, 전재산의 70%인 2억 5천만 원을 손해 봤어요.","start":0.3,"end":6.414},{"n":2,"part":"도입","text":"빚까지 냈다가, 7월 폭락에 빌린 돈부터 강제로 빠져나갔죠.","start":6.794,"end":10.802},{"n":3,"part":"도입","text":"이제 마흔넷인데, 회사는 언제까지 다닐지 모르고, 딸 학원비는 매달 나가요.","start":11.182,"end":16.187},{"n":4,"part":"도입","text":"노후 자금은 1억 원 남았는데, 아내에게는 아직 말도 못 했어요.","start":16.567,"end":20.394},{"n":5,"part":"도입","text":"주식에서 손을 떼야겠다 싶었죠.","start":20.774,"end":22.601},{"n":6,"part":"도입","text":"하지만 매도만 안하면 손실이 아니듯이","start":22.981,"end":25.354},{"n":7,"part":"도입","text":"주식시장을 떠나지 않으면 아직 손해가 아니라고 생각했어요.","start":25.734,"end":28.924},{"n":8,"part":"도입","text":"그래서 원금 복구를 위해 제대로 공부하기로 마음먹고 지켜야할 5가지를 알아보았어요.","start":29.304,"end":34.384},{"n":9,"part":"방법1","text":"첫 번째는, 국장 대신 미장으로 옮기는 거예요.","start":35.384,"end":38.293},{"n":10,"part":"방법1","text":"국장은 한국 주식, 미장은 미국 주식을 말해요.","start":38.673,"end":41.808},{"n":11,"part":"방법1","text":"많은 개미가 익숙한 국장에서만 투자하죠.","start":42.188,"end":44.678},{"n":12,"part":"방법1","text":"그런데 지금 코스피는, 삼성전자와 SK하이닉스 두 회사가 시가총액의 절반을 넘어요.","start":45.058,"end":50.998},{"n":13,"part":"방법1","text":"코스피를 산다는 건, 사실상 반도체 한 업종에 몰빵하는 거예요.","start":51.378,"end":55.437},{"n":14,"part":"방법1","text":"저는 거기서도, 반도체에만 돈을 넣었고요.","start":55.817,"end":58.661},{"n":15,"part":"방법1","text":"그러니 반도체가 흔들리면, 시장 전체가 같이 흔들려요.","start":59.041,"end":62.511},{"n":16,"part":"방법1","text":"7월 13일에는 코스피가 하루에 8.95% 떨어져서, 거래가 20분 동안 멈추기도 했어요.","start":62.891,"end":68.596},{"n":17,"part":"방법1","text":"그리고 7월 한 달 동안, 34% 넘게 떨어졌죠.","start":68.976,"end":72.486},{"n":18,"part":"방법1","text":"저처럼 반도체만 들고 있던 사람은, 그 충격을 그대로 맞았어요.","start":72.866,"end":76.795},{"n":19,"part":"방법1","text":"길게 봐도 비슷했어요.","start":77.175,"end":78.483},{"n":20,"part":"방법1","text":"코스피는 2007년에 처음 2,000을 넘었지만, 2,000을 되찾는 데 3년이 넘게 걸렸어요.","start":78.863,"end":84.54},{"n":21,"part":"방법1","text":"그 뒤로도 2016년까지 6년 넘게, 1,900에서 2,000대에 머물렀죠.","start":84.92,"end":89.588},{"n":22,"part":"방법1","text":"그래서 박스피라는 별명까지 붙었어요.","start":89.968,"end":92.072},{"n":23,"part":"방법1","text":"같은 기간, 미국 대표 회사 500개를 묶은 S&P 500은 81% 올랐고요.","start":92.452,"end":97.969},{"n":24,"part":"방법1","text":"물론 국장이 늘 진 건 아니에요.","start":98.349,"end":100.154},{"n":25,"part":"방법1","text":"작년 가을 4,000을 넘은 코스피는, 올해 6월 9,000까지 올랐으니까요.","start":100.534,"end":105.044},{"n":26,"part":"방법1","text":"미장도 2022년에는 20% 넘게 떨어졌고, 환율이 움직이는 위험도 있어요.","start":105.424,"end":111.011},{"n":27,"part":"방법1","text":"그래도 저는, 한 나라 한 업종에 몰리지 않으려고 미장으로 옮기기로 했어요.","start":111.391,"end":115.767},{"n":28,"part":"방법1","text":"그것도 한 종목이 아니라, 500개 회사를 나눠 담은 지수 S&P 500으로요.","start":116.147,"end":120.747},{"n":29,"part":"방법2","text":"두 번째는, 크게 잃었다고 시장을 떠나지 않는 거예요.","start":121.747,"end":124.777},{"n":30,"part":"방법2","text":"크게 잃으면, 주식은 도박이라며 다 정리하고 떠나는 분이 많아요.","start":125.157,"end":129.247},{"n":31,"part":"방법2","text":"저도 지난주까지는, 주식 앱을 지울 생각만 했어요.","start":129.627,"end":132.957},{"n":32,"part":"방법2","text":"그런데 떠나는 그 순간, 손실은 영원히 확정돼요.","start":133.337,"end":136.512},{"n":33,"part":"방법2","text":"그래서 저는 떠나는 대신, 매매만 멈추기로 했어요.","start":136.892,"end":140.172},{"n":34,"part":"방법2","text":"계좌는 두고, 공부가 끝날 때까지 새로 매수하지 않는 거예요.","start":140.552,"end":144.456},{"n":35,"part":"방법2","text":"S&P 500에서, 2000년 이후 크게 떨어졌던 네 번을 봤어요.","start":144.836,"end":148.608},{"n":36,"part":"방법2","text":"배당은 빼고 가격만 봤으니, 실제보다 조금 적게 나온 값이에요.","start":148.988,"end":153.166},{"n":37,"part":"방법2","text":"2007년 10월 고점에 1억 원을 넣었다면, 2009년 3월 바닥에는 약 4,900만 원이 됐어요.","start":153.546,"end":159.816},{"n":38,"part":"방법2","text":"여기서 떠났다면, 그게 끝이었을 거예요.","start":160.196,"end":162.866},{"n":39,"part":"방법2","text":"그런데 남아 있었다면, 4년 뒤에 1억 원을 되찾았어요.","start":163.246,"end":166.716},{"n":40,"part":"방법2","text":"지금까지 들고 있었다면, 약 5억 원이 됐고요.","start":167.096,"end":170.098},{"n":41,"part":"방법2","text":"닷컴 폭락도, 코로나 폭락도, 2022년 하락장도 마찬가지였어요.","start":170.478,"end":175.227},{"n":42,"part":"방법2","text":"네 번 모두, 남아 있던 사람은 고점을 되찾았어요.","start":175.607,"end":178.657},{"n":43,"part":"방법2","text":"짧게는 5개월, 길게는 4년 3개월이 걸렸죠.","start":179.037,"end":182.213},{"n":44,"part":"방법2","text":"다만 이건 500개 회사를 나눠 담은 지수 이야기예요.","start":182.593,"end":185.853},{"n":45,"part":"방법2","text":"한 종목은, 끝내 회복하지 못할 수도 있어요.","start":186.233,"end":189.073},{"n":46,"part":"방법3","text":"세 번째는, 종목 뉴스만 보지 말고 거시 경제를 보는 공부를 하는 거예요.","start":190.073,"end":194.5},{"n":47,"part":"방법3","text":"거시 경제는 금리처럼 시장 전체를 움직이는 큰 흐름이에요.","start":194.88,"end":198.57},{"n":48,"part":"방법3","text":"많은 개미가, 종목 뉴스와 차트만 봐요.","start":198.95,"end":201.467},{"n":49,"part":"방법3","text":"저도 반도체 호재 기사만 골라 읽었어요.","start":201.847,"end":204.157},{"n":50,"part":"방법3","text":"그런데 7월 폭락은, 회사 하나의 문제가 아니었어요.","start":204.537,"end":207.827},{"n":51,"part":"방법3","text":"반도체와 레버리지 상품에 돈이 쏠린 상태였어요.","start":208.207,"end":211.367},{"n":52,"part":"방법3","text":"거기에 미국 금리 인상 우려와 AI 수익성 우려, 지정학 불안이 한꺼번에 덮쳤다는 분석이 나왔죠.","start":211.747,"end":217.797},{"n":53,"part":"방법3","text":"금리가 오르면 예금 이자가 좋아지니, 주식으로 오던 돈이 줄기 쉬워요.","start":218.177,"end":222.214},{"n":54,"part":"방법3","text":"환율이 급하게 뛰면, 외국인 투자자가 한국 주식을 매도하고 나가기 쉽고요.","start":222.594,"end":227.215},{"n":55,"part":"방법3","text":"시장의 빚도 신호였어요.","start":227.595,"end":229.205},{"n":56,"part":"방법3","text":"증권사에서 빌린 신용 잔고는 6월 24일, 38조 6천억 원으로 올해 가장 많았어요.","start":229.585,"end":235.322},{"n":57,"part":"방법3","text":"코스피가 9,000을 처음 넘은 지, 엿새 뒤였죠.","start":235.702,"end":238.54},{"n":58,"part":"방법3","text":"시장 전체가 빚으로 달리고 있었던 거예요.","start":238.92,"end":241.22},{"n":59,"part":"방법3","text":"그래서 매수하기 전 장단기 금리차, 채권 등 경제 관련 지표를 확인하기로 했어요.","start":241.6,"end":246.57},{"n":60,"part":"방법3","text":"이걸로 매수, 매도 시점을 맞히려는 게 아니에요.","start":246.95,"end":249.76},{"n":61,"part":"방법3","text":"제가 지금 무리하고 있는지, 점검하는 거예요.","start":250.14,"end":252.89},{"n":62,"part":"방법4","text":"네 번째는, 공부한 걸로 본인만의 원칙을 만들고, 남의 말에 휘둘리지 않는 거예요.","start":253.89,"end":259.236},{"n":63,"part":"방법4","text":"많은 개미가 리딩방, 유튜브, 단톡방에서 들은 종목을 따라 매수해요.","start":259.616,"end":264.118},{"n":64,"part":"방법4","text":"리딩방은 종목을 찍어 준다는 유료 대화방이에요.","start":264.498,"end":267.442},{"n":65,"part":"방법4","text":"저도 2년 동안 리딩방 회비를 냈고, 올해 6월엔 단톡방 수익 인증을 보고 빚까지 냈어요.","start":267.822,"end":273.473},{"n":66,"part":"방법4","text":"이건 저만의 일이 아니었어요.","start":273.853,"end":275.513},{"n":67,"part":"방법4","text":"올해 6월과 7월, 서학개미가 가장 많이 순매수한 종목은 반도체 3배 레버리지 ETF인 SOXL이었어요.","start":275.893,"end":283.179},{"n":68,"part":"방법4","text":"그 ETF는 5월 말부터 7월 30일까지, 48.9%가 떨어졌죠.","start":283.559,"end":288.679},{"n":69,"part":"방법4","text":"자본시장연구원은 잦은 매매와 지나친 확신을, 낮은 수익의 원인으로 짚었어요.","start":289.059,"end":294.329},{"n":70,"part":"방법4","text":"2020년에 새로 시작한 개인 투자자의 62%가, 손실을 봤고요.","start":294.709,"end":299.309},{"n":71,"part":"방법4","text":"미국 모닝스타도, 펀드 투자자가 사고파는 시점 때문에 해마다 1.2%포인트를 덜 벌었다고 분석했어요.","start":299.689,"end":305.979},{"n":72,"part":"방법4","text":"그래서 저는 제 원칙을 노트에 적었어요.","start":306.359,"end":308.603},{"n":73,"part":"방법4","text":"빚은 내지 않기,","start":308.983,"end":309.983},{"n":74,"part":"방법4","text":"한 종목에는, 계좌의 10%까지만 넣기,","start":310.363,"end":313.2},{"n":75,"part":"방법4","text":"매수하기 전에는, 이유를 세 줄로 적기 , 일단 이렇게 생각해봤어요.","start":313.58,"end":317.915},{"n":76,"part":"방법4","text":"남이 추천한 종목은, 그 세 줄을 제가 직접 못 쓰면 매수하지 않아요.","start":318.295,"end":322.383},{"n":77,"part":"방법4","text":"원칙이 있으면, 남의 수익 인증을 봐도 흔들릴 이유가 줄어요.","start":322.763,"end":326.723},{"n":78,"part":"방법4","text":"제 원칙에 맞지 않으면, 그냥 지나가면 되니까요.","start":327.103,"end":330.156},{"n":79,"part":"방법5","text":"다섯 번째는, 리스크를 최대한 줄이면서 천천히 수익을 내는 거예요.","start":331.156,"end":335.426},{"n":80,"part":"방법5","text":"잃은 돈을 빨리 메우려고, 레버리지와 몰빵에 다시 손을 대는 분이 많아요.","start":335.806,"end":340.336},{"n":81,"part":"방법5","text":"저도 그 유혹이 제일 커요.","start":340.716,"end":342.346},{"n":82,"part":"방법5","text":"그래서 월급날 다음 날, 정해진 금액 안에서만 매수하도록 했어요.","start":342.726,"end":346.924},{"n":83,"part":"방법5","text":"매달 100만 원씩 10년을 넣었다면 어땠는지, S&P 500으로 계산해 봤어요.","start":347.304,"end":351.723},{"n":84,"part":"방법5","text":"2000년부터 2016년까지, 아무 달에나 시작한 202번을 봤어요.","start":352.103,"end":356.703},{"n":85,"part":"방법5","text":"손실로 끝난 경우는, 8번이었어요.","start":357.083,"end":359.503},{"n":86,"part":"방법5","text":"202번 중 194번은, 넣은 돈보다 많이 남았다는 뜻이죠.","start":359.883,"end":363.913},{"n":87,"part":"방법5","text":"평균 수익 배수는, 넣은 돈의 1.6배였고요.","start":364.293,"end":367.431},{"n":88,"part":"방법5","text":"가장 나빴을 때도, 넣은 돈의 0.95배였어요.","start":367.811,"end":371.001},{"n":89,"part":"방법5","text":"물론 과거 결과가 앞으로를 보장하지는 않아요.","start":371.381,"end":374.043},{"n":90,"part":"방법5","text":"반대로 3배 레버리지로 빨리 메우려 했다면, 2020년 3월 한 달에만 76.7%가 떨어졌어요.","start":374.423,"end":381.003},{"n":91,"part":"방법5","text":"빨리 가려다, 아예 못 가게 되는 거죠.","start":381.383,"end":383.728},{"n":92,"part":"방법5","text":"천천히라도 쌓아 가다 보면, 언젠가 잃었던 돈을 다시 찾을 수 있을 거라고 믿어요.","start":384.108,"end":388.758},{"n":93,"part":"마무리","text":"주식으로 전재산을 날렸어도, 포기하지 않으면 아직 진짜 손해는 아니라고 믿어요.","start":389.758,"end":394.778},{"n":94,"part":"마무리","text":"저는 오늘부터 매매를 잠시 멈추고, 앞서 말한 방법들을 지키도록 노력할 거예요.","start":395.158,"end":400.407},{"n":95,"part":"마무리","text":"여러분의 투자도 꼭 성공하길 바랄게요.","start":400.787,"end":403.256},{"n":96,"part":"마무리","text":"시청해주셔서 감사합니다.","start":403.636,"end":405.166}],"subs":[[0.2,3.087,"올해 반도체 주식 종목에 투자했다가,"],[3.087,6.794,"전재산의 70%인 2억 5천만 원을 손해 봤어요."],[6.794,11.182,"빚까지 냈다가, 7월 폭락에 빌린 돈부터 강제로 빠져나갔죠."],[11.182,16.567,"이제 마흔넷인데, 회사는 언제까지 다닐지 모르고, 딸 학원비는 매달 나가요."],[16.567,20.774,"노후 자금은 1억 원 남았는데, 아내에게는 아직 말도 못 했어요."],[20.774,22.981,"주식에서 손을 떼야겠다 싶었죠."],[22.981,25.734,"하지만 매도만 안하면 손실이 아니듯이"],[25.734,29.304,"주식시장을 떠나지 않으면 아직 손해가 아니라고 생각했어요."],[29.304,31.426,"그래서 원금 복구를 위해 제대로 공부하기로"],[31.426,35.384,"마음먹고 지켜야할 5가지를 알아보았어요."],[35.384,38.673,"첫 번째는, 국장 대신 미장으로 옮기는 거예요."],[38.673,42.188,"국장은 한국 주식, 미장은 미국 주식을 말해요."],[42.188,45.058,"많은 개미가 익숙한 국장에서만 투자하죠."],[45.058,46.827,"그런데 지금 코스피는,"],[46.827,51.378,"삼성전자와 SK하이닉스 두 회사가 시가총액의 절반을 넘어요."],[51.378,55.817,"코스피를 산다는 건, 사실상 반도체 한 업종에 몰빵하는 거예요."],[55.817,59.041,"저는 거기서도, 반도체에만 돈을 넣었고요."],[59.041,62.891,"그러니 반도체가 흔들리면, 시장 전체가 같이 흔들려요."],[62.891,66.701,"7월 13일에는 코스피가 하루에 8.95% 떨어져서,"],[66.701,68.976,"거래가 20분 동안 멈추기도 했어요."],[68.976,72.866,"그리고 7월 한 달 동안, 34% 넘게 떨어졌죠."],[72.866,77.175,"저처럼 반도체만 들고 있던 사람은, 그 충격을 그대로 맞았어요."],[77.175,78.863,"길게 봐도 비슷했어요."],[78.863,82.11,"코스피는 2007년에 처음 2,000을 넘었지만,"],[82.11,84.92,"2,000을 되찾는 데 3년이 넘게 걸렸어요."],[84.92,89.968,"그 뒤로도 2016년까지 6년 넘게, 1,900에서 2,000대에 머물렀죠."],[89.968,92.452,"그래서 박스피라는 별명까지 붙었어요."],[92.452,98.349,"같은 기간, 미국 대표 회사 500개를 묶은 S&P 500은 81% 올랐고요."],[98.349,100.534,"물론 국장이 늘 진 건 아니에요."],[100.534,105.424,"작년 가을 4,000을 넘은 코스피는, 올해 6월 9,000까지 올랐으니까요."],[105.424,111.391,"미장도 2022년에는 20% 넘게 떨어졌고, 환율이 움직이는 위험도 있어요."],[111.391,116.147,"그래도 저는, 한 나라 한 업종에 몰리지 않으려고 미장으로 옮기기로 했어요."],[116.147,121.747,"그것도 한 종목이 아니라, 500개 회사를 나눠 담은 지수 S&P 500으로요."],[121.747,125.157,"두 번째는, 크게 잃었다고 시장을 떠나지 않는 거예요."],[125.157,129.627,"크게 잃으면, 주식은 도박이라며 다 정리하고 떠나는 분이 많아요."],[129.627,133.337,"저도 지난주까지는, 주식 앱을 지울 생각만 했어요."],[133.337,136.892,"그런데 떠나는 그 순간, 손실은 영원히 확정돼요."],[136.892,140.552,"그래서 저는 떠나는 대신, 매매만 멈추기로 했어요."],[140.552,144.836,"계좌는 두고, 공부가 끝날 때까지 새로 매수하지 않는 거예요."],[144.836,148.988,"S&P 500에서, 2000년 이후 크게 떨어졌던 네 번을 봤어요."],[148.988,153.546,"배당은 빼고 가격만 봤으니, 실제보다 조금 적게 나온 값이에요."],[153.546,156.6,"2007년 10월 고점에 1억 원을 넣었다면,"],[156.6,160.196,"2009년 3월 바닥에는 약 4,900만 원이 됐어요."],[160.196,163.246,"여기서 떠났다면, 그게 끝이었을 거예요."],[163.246,167.096,"그런데 남아 있었다면, 4년 뒤에 1억 원을 되찾았어요."],[167.096,170.478,"지금까지 들고 있었다면, 약 5억 원이 됐고요."],[170.478,175.607,"닷컴 폭락도, 코로나 폭락도, 2022년 하락장도 마찬가지였어요."],[175.607,179.037,"네 번 모두, 남아 있던 사람은 고점을 되찾았어요."],[179.037,182.593,"짧게는 5개월, 길게는 4년 3개월이 걸렸죠."],[182.593,186.233,"다만 이건 500개 회사를 나눠 담은 지수 이야기예요."],[186.233,190.073,"한 종목은, 끝내 회복하지 못할 수도 있어요."],[190.073,194.88,"세 번째는, 종목 뉴스만 보지 말고 거시 경제를 보는 공부를 하는 거예요."],[194.88,198.95,"거시 경제는 금리처럼 시장 전체를 움직이는 큰 흐름이에요."],[198.95,201.847,"많은 개미가, 종목 뉴스와 차트만 봐요."],[201.847,204.537,"저도 반도체 호재 기사만 골라 읽었어요."],[204.537,208.207,"그런데 7월 폭락은, 회사 하나의 문제가 아니었어요."],[208.207,211.747,"반도체와 레버리지 상품에 돈이 쏠린 상태였어요."],[211.747,215.186,"거기에 미국 금리 인상 우려와 AI 수익성 우려,"],[215.186,218.177,"지정학 불안이 한꺼번에 덮쳤다는 분석이 나왔죠."],[218.177,222.594,"금리가 오르면 예금 이자가 좋아지니, 주식으로 오던 돈이 줄기 쉬워요."],[222.594,227.595,"환율이 급하게 뛰면, 외국인 투자자가 한국 주식을 매도하고 나가기 쉽고요."],[227.595,229.585,"시장의 빚도 신호였어요."],[229.585,232.496,"증권사에서 빌린 신용 잔고는 6월 24일,"],[232.496,235.702,"38조 6천억 원으로 올해 가장 많았어요."],[235.702,238.92,"코스피가 9,000을 처음 넘은 지, 엿새 뒤였죠."],[238.92,241.6,"시장 전체가 빚으로 달리고 있었던 거예요."],[241.6,244.001,"그래서 매수하기 전 장단기 금리차,"],[244.001,246.95,"채권 등 경제 관련 지표를 확인하기로 했어요."],[246.95,250.14,"이걸로 매수, 매도 시점을 맞히려는 게 아니에요."],[250.14,253.89,"제가 지금 무리하고 있는지, 점검하는 거예요."],[253.89,257.597,"네 번째는, 공부한 걸로 본인만의 원칙을 만들고,"],[257.597,259.616,"남의 말에 휘둘리지 않는 거예요."],[259.616,264.498,"많은 개미가 리딩방, 유튜브, 단톡방에서 들은 종목을 따라 매수해요."],[264.498,267.822,"리딩방은 종목을 찍어 준다는 유료 대화방이에요."],[267.822,270.432,"저도 2년 동안 리딩방 회비를 냈고,"],[270.432,273.853,"올해 6월엔 단톡방 수익 인증을 보고 빚까지 냈어요."],[273.853,275.893,"이건 저만의 일이 아니었어요."],[275.893,279.967,"올해 6월과 7월, 서학개미가 가장 많이 순매수한 종목은"],[279.967,283.559,"반도체 3배 레버리지 ETF인 SOXL이었어요."],[283.559,289.059,"그 ETF는 5월 말부터 7월 30일까지, 48.9%가 떨어졌죠."],[289.059,292.44,"자본시장연구원은 잦은 매매와 지나친 확신을,"],[292.44,294.709,"낮은 수익의 원인으로 짚었어요."],[294.709,299.689,"2020년에 새로 시작한 개인 투자자의 62%가, 손실을 봤고요."],[299.689,302.623,"미국 모닝스타도, 펀드 투자자가 사고파는 시점 때문에"],[302.623,306.359,"해마다 1.2%포인트를 덜 벌었다고 분석했어요."],[306.359,308.983,"그래서 저는 제 원칙을 노트에 적었어요."],[308.983,310.363,"빚은 내지 않기,"],[310.363,313.58,"한 종목에는, 계좌의 10%까지만 넣기,"],[313.58,318.295,"매수하기 전에는, 이유를 세 줄로 적기 , 일단 이렇게 생각해봤어요."],[318.295,322.763,"남이 추천한 종목은, 그 세 줄을 제가 직접 못 쓰면 매수하지 않아요."],[322.763,327.103,"원칙이 있으면, 남의 수익 인증을 봐도 흔들릴 이유가 줄어요."],[327.103,331.156,"제 원칙에 맞지 않으면, 그냥 지나가면 되니까요."],[331.156,335.806,"다섯 번째는, 리스크를 최대한 줄이면서 천천히 수익을 내는 거예요."],[335.806,340.716,"잃은 돈을 빨리 메우려고, 레버리지와 몰빵에 다시 손을 대는 분이 많아요."],[340.716,342.726,"저도 그 유혹이 제일 커요."],[342.726,347.304,"그래서 월급날 다음 날, 정해진 금액 안에서만 매수하도록 했어요."],[347.304,352.103,"매달 100만 원씩 10년을 넣었다면 어땠는지, S&P 500으로 계산해 봤어요."],[352.103,357.083,"2000년부터 2016년까지, 아무 달에나 시작한 202번을 봤어요."],[357.083,359.883,"손실로 끝난 경우는, 8번이었어요."],[359.883,364.293,"202번 중 194번은, 넣은 돈보다 많이 남았다는 뜻이죠."],[364.293,367.811,"평균 수익 배수는, 넣은 돈의 1.6배였고요."],[367.811,371.381,"가장 나빴을 때도, 넣은 돈의 0.95배였어요."],[371.381,374.423,"물론 과거 결과가 앞으로를 보장하지는 않아요."],[374.423,377.33,"반대로 3배 레버리지로 빨리 메우려 했다면,"],[377.33,381.383,"2020년 3월 한 달에만 76.7%가 떨어졌어요."],[381.383,384.108,"빨리 가려다, 아예 못 가게 되는 거죠."],[384.108,386.017,"천천히라도 쌓아 가다 보면,"],[386.017,389.758,"언젠가 잃었던 돈을 다시 찾을 수 있을 거라고 믿어요."],[389.758,391.804,"주식으로 전재산을 날렸어도,"],[391.804,395.158,"포기하지 않으면 아직 진짜 손해는 아니라고 믿어요."],[395.158,397.792,"저는 오늘부터 매매를 잠시 멈추고,"],[397.792,400.787,"앞서 말한 방법들을 지키도록 노력할 거예요."],[400.787,403.636,"여러분의 투자도 꼭 성공하길 바랄게요."],[403.636,405.566,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>
