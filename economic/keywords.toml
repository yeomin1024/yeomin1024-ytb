# 검색어·관련어 목록 — 주제: 재테크 (폴더 economic)
# VERSION: v1.1 — 2026-10-13 — 경제는 빼고 재테크로 (사용자 지시: "경제는 빼고 재테크 관련 검색어로 설정"): 7번 그룹 '경제 뉴스 해설'(금리·환율·
#          경기 침체·물가·경제 위기) → '재테크 습관·자산관리', 관련어에서 경제·경기·물가·인플레이션·환율을 빼고 금리는 약한 관련어로.
#          잘된 영상의 태그로 고른 검색어는 따로 result/outliers/tag_keywords.json (tools/outlier_research.py v1.6 — 여기에 적지 않아도 됨)
# (v1.0 — 2026-10-13 — 새로 만듦 (사용자 지시: "경제, 재테크(economic) 폴더만 하나 만들고 코드 분석기에서 사용한
#          검색어 목록 같은거는 따로 빼놓고"). 그 밖의 설정은 analyzer_config.toml.)
#
# 이 파일을 읽는 코드:
#   - youtube_topic_analyzer.py  (분석기 — 모든 검색어를 검색, 하루 할당량을 넘는 검색어는 다음 날로 이월)
#   - tools/outlier_research.py  (작은 채널 성공 사례 — 그룹마다 앞에서부터 --per-group 개만 검색 → 그룹의 첫 검색어를 가장 대표적인 말로)
# 고치는 법: 메모장으로 열어 "따옴표" 안의 글자만 바꾸고 저장. 그룹을 늘리면 하루 할당량도 늘어난다 (검색 1번 = 100단위).
# =====================================================================================================

