    const o = build(k); o.g.visible = true;
    const cur = clamp(Math.floor(fi), 0, N - 1);
    gF.setDrawRange(0, cur * 6); gR.setDrawRange(0, cur * 6);
    mEdge.geometry.setDrawRange(0, edge.cnt[cur]);
    for (const l of o.lines) l.m.geometry.setDrawRange(0, l.cnt[cur]);
    for (const p of o.pins) { p.b.visible = p.t.b <= cur; p.s.visible = !p.t.open && p.t.s <= cur; }

    // ---- 글자 (오버레이)
    PLACED = [];
    const cp = proj(xs[cur], YH + 0.6, HZ + 0.02);
    const cl = ovEl(`<span class="tab">$${f2(AN.close[cur])}</span>`, cp[0], cp[1] - 4, "cur");
    { const b0 = boxOf(cl), dx = b0.l < 46 ? 46 - b0.l : b0.r > 1270 ? 1270 - b0.r : 0; if (dx) cl.style.left = (cp[0] + dx) + "px"; }
    PLACED.push(boxOf(cl));
    const axEls = [];                                        // 축 글자는 움직이는 글자(꼬리표·핀)와 겹치면 그 프레임만 숨김
    for (let p = 200; p <= 800; p += 100) { const q = proj(XW / 2 + 0.25, Y(p), HZ); axEls.push(ovEl(`$${p}`, q[0] + 54, q[1], "lab ax")); }
    for (const [i, yy] of YEARS) { const q = proj(X(i), 0, 2.2); axEls.push(ovEl(yy, q[0] + 34, q[1], "lab ax")); }
    if (k === "dip10" || k === "dip20") {
      const q = k === "dip10" ? 0.9 : 0.8, pp = proj(xs[cur] + 0.18, Y(AN.lines.ath[cur] * q), HZ);
      const e = thrEl(`★ −${k === "dip10" ? 10 : 20}%`, pp); PLACED.push(boxOf(e));
    }
    if (k === "ma200" || k === "gc") { const pp = proj(xs[cur] + 0.18, Y(AN.lines.sma200[cur]), HZ); const e = thrEl("200", pp); if (!hit(boxOf(e))) PLACED.push(boxOf(e)); else e.remove(); }
    if (k === "gc") { const pp = proj(xs[cur] + 0.18, Y(AN.lines.sma50[cur]), HZ); const e = thrEl("50", pp, "color:#7FD4FF"); if (!hit(boxOf(e))) PLACED.push(boxOf(e)); else e.remove(); }
    const BOX = { l: 40, t: 205, r: 1270, b: 905 };
    const tries = (dir) => (dir > 0 ? [[1, 1.0], [1, 1.6], [1, 2.2], [-1, 1.0], [-1, 1.6]] : [[-1, 1.0], [-1, 1.6], [-1, 2.2], [1, 1.0], [1, 1.6]]);
    const place = (html, x, y0, dir, color) => {
      const base = proj(x, y0, HZ + 0.06);
      for (const [d, off] of tries(dir)) {
        const ly = y0 + d * off;
        if (d < 0 && ly < 0.75) continue;
        const pt = proj(x, ly, HZ + 0.06);
        const e = ovEl(html, pt[0], pt[1] + (d > 0 ? -22 : 22), "lab");
        const b = boxOf(e);
        if (!hit(b) && bounds(b, BOX)) { PLACED.push(b); stemEl(base[0], base[1], d > 0 ? b.b : b.t, color); return true; }
        e.remove();
      }
      return false;
    };
    const shown = R(k).trades.filter(t => t.b <= cur).slice().reverse();
    for (const t of shown) {
      if (!t.open && t.s <= cur) place(`<div class="pin"><span class="tag s">SELL</span><span class="v ${t.r >= 0 ? "up" : "dn"} tab">${pc(t.r)}</span></div>`, xs[t.s], ysP[t.s], 1, "#FF8A3D");

    }
    for (const e of axEls) if (hit(boxOf(e))) e.style.visibility = "hidden";
    if (hdr) hdr(cur);
    return cur;
  }
  return { draw, VP };
})();

// 경주 DOM (머리·카드) — 규칙마다 장면 안에 만들고, 프레임마다 값만 바꿈
function raceDom(k, sc) {
  const hd = el(`<div class="a row" style="left:44px;top:34px;gap:18px"><div class="no">${VNO(k)}</div><div class="rule">${HEAD[k]()}</div><div class="lv tab row" style="gap:8px;margin-left:6px;font:900 40px/1 'Noto Sans KR';color:#C9D2E2"></div></div>`, sc);
  const dt = el(`<div class="date tab"></div>`, sc);
  const live = hd.querySelector(".lv");
  const side = el(`<div class="side"><div class="card c1"></div><div class="card c2"></div></div>`, sc);
  el(`<div class="legend"><span class="sw" style="background:linear-gradient(180deg,#22C79A,#0B3D33)"></span><span class="tag b">BUY</span><span>~</span><span class="tag s">SELL</span><span class="sw" style="margin-left:26px;background:linear-gradient(180deg,#4A5875,#1A2336)"></span><span>$</span><span style="margin-left:26px;display:inline-block;width:46px;border-top:5px dashed #FF5A5A"></span><span class="tag s">SELL</span></div>`, sc);
  const c1 = side.children[0], c2 = side.children[1];
  const T = R(k).trades, ROWS = 5;
  return cur => {
    dt.textContent = ymd(cur);
    // 지표 지금 값
    const L = AN.lines;
    const lv = {
      dip10: () => `★ ${pcu(AN.close[cur] / L.ath[cur] - 1)}`, dip20: () => `★ ${pcu(AN.close[cur] / L.ath[cur] - 1)}`,
      rsi30: () => `RSI ${L.rsi14[cur].toFixed(1)}`, vix30: () => (L.vix[cur] == null ? "" : `VIX ${L.vix[cur].toFixed(1)}`),
      drop2: () => `${IC.cal(40)} ${pc(L.ret1[cur] / 100, 1)}`, mom12: () => `−1Y ${pc(AN.close[cur] / L.close_252ago[cur] - 1)}`,
    }[k];
    live.innerHTML = lv ? lv() : "";
    // 카드 1: 계좌 + BUY & HOLD (첫날 매수하고 그대로 둔 계좌)
    const v = R(k).value[cur], bv = AN.bh[cur];
    c1.innerHTML = `<div class="ch">${IC.wallet}<span class="tab">$${f0(CAP)} →</span></div>
      <div class="acc"><span class="rb">${VNO(k)}</span><span class="vv"><span class="bigv tab">$${f0(v)}</span><span class="midv tab ${v >= CAP ? "up" : "dn"}">${pc(v / CAP - 1)}</span></span></div>
      <div class="acc bh"><span class="tag h">BUY &amp; HOLD</span><span class="vv"><span class="bhv tab">$${f0(bv)}</span><span class="midv tab" style="color:#D6E0EF">${pc(bv / CAP - 1)}</span></span></div>`;
    // 카드 2: 거래 기록 (최근 ROWS개, 한 줄에 하나) + 합계 (▲ 번 거래 · ▼ 잃은 거래 · ⌛ 들고 있는 거래 · Σ = 계좌 − $10,000)
    const done = T.filter(t => t.b <= cur);
    const isOpen = t => t.open || t.s > cur;
    const pnl = t => (isOpen(t) ? v - t.bc : t.sc - t.bc);
    const rows = done.slice(-ROWS).map(t => {
      const op = isOpen(t), r = op ? v / t.bc - 1 : t.r;
      return `<div class="tr ${op ? "open" : ""}"><span class="tab">${ymd2(t.b)}</span><span style="color:var(--GR)">→</span>${op ? `<span>${IC.hour(40)}</span>` : `<span class="tab">${ymd2(t.s)}</span>`}<span class="pct tab ${r >= 0 ? "up" : "dn"}">${pc(r)}</span></div>`;
    }).join("");
    const closed = done.filter(t => !isOpen(t)), openT = done.filter(isOpen);
    const W_ = closed.filter(t => t.r > 0), L_ = closed.filter(t => t.r <= 0);
    const sum = a => a.reduce((s, t) => s + pnl(t), 0);
    c2.innerHTML = `<div class="ch">${IC.log}<span class="tab">${done.length}</span>${done.length > ROWS ? `<span class="tab" style="margin-left:auto">${done.length - ROWS} ↑</span>` : ""}</div>
      <div class="tr hd"><span class="tag b">BUY</span><span></span><span class="tag s">SELL</span><span></span></div>${rows}
      <div class="foot"><div class="r1 tab"><span class="up">▲ ${W_.length} ${susd(sum(W_))}</span><span class="dn">▼ ${L_.length} ${susd(sum(L_))}</span></div>
      <div class="r2 tab">${openT.length ? `<span class="row" style="gap:6px;margin-right:auto;font-size:36px">${IC.hour(40)}<span class="${sum(openT) >= 0 ? "up" : "dn"}">${susd(sum(openT))}</span></span>` : ""}<span style="color:var(--GR)">Σ</span><span class="${v - CAP >= 0 ? "up" : "dn"}">${susd(v - CAP)}</span></div></div>`;
  };
}

function makeZoom(opt) {
  // opt: {i0, i1, lines:[[array, color, dash]], low:{arr, thr, max}, stop:{buyI}, sig, buyI, hl:[i,j] }
  const VP = { x: 140, y: 150, w: 1640, h: 820 };
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, VP.w / VP.h, 0.1, 200);
  const n = opt.i1 - opt.i0 + 1;
  const pr = AN.close.slice(opt.i0, opt.i1 + 1);
  const extra = (opt.lines || []).flatMap(([a]) => a.slice(opt.i0, opt.i1 + 1).filter(v => v != null));
  const stopVals = [];
  let lo = Math.min(...pr, ...extra), hi = Math.max(...pr, ...extra);
  if (opt.stop) { let pk = Math.max(...AN.close.slice(opt.stop.buyI, opt.i0 + 1)); for (let i = opt.i0; i <= opt.i1; i++) { pk = Math.max(pk, AN.close[i]); stopVals.push(pk * (1 - TRAIL)); } lo = Math.min(lo, ...stopVals); }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const top = opt.low ? 6.2 : 5.6, base = opt.low ? 1.4 : 0;
  const X = j => -8 + 16 * j / (n - 1), Y = p => base + (p - lo) / (hi - lo) * (top - base);
  const xs = Array.from({ length: n }, (_, j) => X(j));
  const yP = pr.map(Y);

  const panel = new THREE.Mesh(new THREE.PlaneGeometry(17.4, top - base + 0.8), mat("#13213C", 0.55)); panel.position.set(0, (top + base) / 2, -0.4); scene.add(panel);
  // 가격 관 (3D)
  const pts = xs.map((x, j) => new THREE.Vector3(x, yP[j], 0));
  const curve = new THREE.CatmullRomCurve3(pts);
  const SEG = n * 3;
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, SEG, 0.075, 10, false), new THREE.MeshStandardMaterial({ color: "#F4F8FF", emissive: "#4F6A99", emissiveIntensity: 0.5, roughness: 0.35, metalness: 0.2 }));
  scene.add(tube);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55)); const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(3, 6, 8); scene.add(dl);
  // 그림자 띠 (관 아래)
  const shp = []; for (let j = 0; j < n - 1; j++) shp.push(xs[j], base, -0.05, xs[j], yP[j], -0.05, xs[j + 1], yP[j + 1], -0.05, xs[j], base, -0.05, xs[j + 1], yP[j + 1], -0.05, xs[j + 1], base, -0.05);
  const gS = new THREE.BufferGeometry(); gS.setAttribute("position", new THREE.Float32BufferAttribute(shp, 3));
  const mS = new THREE.Mesh(gS, mat("#22C79A", 0.16)); scene.add(mS);
  const lines = [];
  for (const [arr, color, dash, w] of opt.lines || []) {
    const r = ribbonGeo(xs, arr.slice(opt.i0, opt.i1 + 1).map(v => (v == null ? null : Y(v))), null, w || 0.06, 0.05, dash);
    const m = new THREE.Mesh(r.g, mat(color, 0.95)); scene.add(m); lines.push({ m, cnt: r.cnt });
  }
  let stopL = null;
  if (opt.stop) { const r = ribbonGeo(xs, stopVals.map(Y), null, 0.07, 0.06, 0.2); stopL = { m: new THREE.Mesh(r.g, mat("#FF5A5A", 1)), cnt: r.cnt }; scene.add(stopL.m); }
  let low = null;
  if (opt.low) {
    const a = opt.low.arr.slice(opt.i0, opt.i1 + 1), LY = v => -2.6 + (v / opt.low.max) * 3.2;
    const r = ribbonGeo(xs, a.map(v => (v == null ? null : LY(v))), null, 0.07, 0.05);
    const m = new THREE.Mesh(r.g, mat(opt.low.color || "#7FD4FF", 1)); scene.add(m);
    const th = ribbonGeo([-8.2, 8.2], [LY(opt.low.thr), LY(opt.low.thr)], null, 0.05, 0.04, 0.3); scene.add(new THREE.Mesh(th.g, mat("#FFD400", 0.95)));
    const zone = new THREE.Mesh(new THREE.PlaneGeometry(16.4, Math.abs(LY(opt.low.thr) - LY(opt.low.zoneEnd))), mat(opt.low.zoneColor || "#2BE0A0", 0.12));

    low = { m, cnt: r.cnt, LY };
  }

  const buy = sphere(0.18, "#2BE0A0"); scene.add(buy);
  const sell = opt.sellI != null ? sphere(0.18, "#FF8A3D") : null; if (sell) scene.add(sell);
  const peak = opt.stop ? sphere(0.15, "#FFD400") : null; if (peak) scene.add(peak);

    PLACED = [];

      PLACED.push(boxOf(e)); stemEl(p[0], p[1], boxOf(e).t, "#2BE0A0");
    }
    if (sell && show.sell && j >= opt.sellI - opt.i0) {
      const sj = opt.sellI - opt.i0, p = proj(xs[sj], yP[sj], 0.1);
      const e = ovEl(`<div class="pin"><span class="tag s" style="font-size:44px">SELL</span><span class="v tab" style="font-size:40px">$${f0(AN.close[opt.sellI])}</span></div>`, p[0] + 40, p[1] + 80, "lab");
      PLACED.push(boxOf(e)); stemEl(p[0], p[1], boxOf(e).t, "#FF8A3D");
    }
    if (peak && show.labels) { const e = put(`<span class="tab" style="font:900 40px/1 'Noto Sans KR';color:#FFD400">★ $${f0(pr[pkj])}</span>`, xs[pkj], yP[pkj] + 0.5, 0.1, -10); }
    if (stopL && show.labels) put(`<span class="tab" style="font:900 40px/1 'Noto Sans KR';color:#FF6B6B">★ × 0.9</span>`, xs[j], Y(stopVals[j]) - 0.45, 0.1, 10);
    for (const lab of opt.labels || []) if (j >= lab.from - opt.i0 && show.labels) {
      const jj = clamp(j, 0, n - 1);
      const y = lab.arr ? Y(lab.arr[opt.i0 + jj] * (lab.mul || 1)) : low.LY(lab.y);
      put(`<span class="tab" style="font:900 40px/1 'Noto Sans KR';color:${lab.color || "#FFD400"}">${lab.html}</span>`, lab.x != null ? lab.x : xs[jj] + 0.3, y, 0.1, lab.dy || 0, "lab");
    }
    if (low && show.labels) {
      const v = opt.low.arr[opt.i0 + j]; if (v != null) put(`<span class="tab" style="font:900 40px/1 'Noto Sans KR';color:${opt.low.color || "#7FD4FF"}">${opt.low.name} ${v.toFixed(1)}</span>`, xs[j] + 0.3, low.LY(v), 0.1, -40);
    }
  }
  return { draw };
}

// ---------- 시각 → 날짜 (조각 직선) ----------
function timeMap(anchors) {                                  // [[t, i]] → t → 실수 날짜 위치
  const A = anchors.slice().sort((x, y) => x[0] - y[0]);
  for (let q = 1; q < A.length; q++) if (A[q][1] < A[q - 1][1]) A[q][1] = A[q - 1][1];
  return t => {
    if (t <= A[0][0]) return A[0][1];
    for (let q = 1; q < A.length; q++) if (t <= A[q][0]) { const u = (t - A[q - 1][0]) / Math.max(1e-6, A[q][0] - A[q - 1][0]); return lerp(A[q - 1][1], A[q][1], u); }
    return A[A.length - 1][1];
  };
}
