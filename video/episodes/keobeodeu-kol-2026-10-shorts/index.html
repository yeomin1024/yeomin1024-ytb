// 3·4. NASDAQ 100 · QYLD(커버드콜) · QQQ(커버드콜 없이) (s3·s4)
{ const a = S(B3), sc = K.scene(a - 0.3, S(B5) - 0.1);
  const head = el(`<div class="a cx row" style="left:${CX}px;top:370px;gap:22px">${IC.up(76, "#C9D2E2")}<span class="big" style="font-size:84px">NASDAQ 100</span></div>`, sc);
  pop(head, W(B3, "나스닥100"));
  const c1 = el(`<div class="card" style="left:70px;top:540px">${TK("QYLD", "o", 104)}${IC.cap(130)}</div>`, sc);
  pop(c1, W(B3, "QYLD예요") - 0.2);
  const c2 = el(`<div class="card" style="left:580px;top:540px">${TK("QQQ", "b", 104)}${IC.line(130)}</div>`, sc);
  pop(c2, W(B4, "QQQ입니다") - 0.2);
  K.cut(E(B3) - 0.2, "QYLD = NASDAQ 100 커버드콜");
  K.cut(E(B4) - 0.2, "QQQ = NASDAQ 100 그대로");
}

// 5~11. 경주 2013.12 → 2026.10.15 (s5~s11) — s5 원금(노란 점선) · s6 부터 날짜가 흐름 · 꺼낸 날마다 두 선 끝에서 동전
const tR0 = S(B5) - 0.3, tR1 = S(A8) - 0.1;
const tGo = S(B6) - 0.1, tEnd = W(A4, "11만") - 0.15;
const pace = R2.warp([[tGo, 0], [tEnd, K1]], "쇼츠 경주 QYLD·QQQ 끝까지", 700);
const yearsT = []; for (let i = 1; i < N; i++) if (CC.dates[i].slice(0, 4) !== CC.dates[i - 1].slice(0, 4)) yearsT.push([i, CC.dates[i].slice(0, 4)]);
const ch = new R2.Chart({ x: 200, y: 290, w: 740, h: 690, n: N, years: yearsT, yearGap: 150, mode: "lin", min: 0, maxMin: 160000, pad: 1.1,
  labelSize: 34, baselines: [{ v: I0, color: YE, dash: [16, 10], width: 4 }],
  series: [{ vals: CC.b, color: BL, width: 7, glow: true }, { vals: CC.a, color: OR, width: 7, glow: true }] });
const EV = CC.ev.map(([i, amt]) => ({ i, amt, t: pace.tOf(i) }));     // 분배금 꺼낸 날 (anim.js ev = [날, 금액]) — QQQ 도 같은 날 같은 돈을 매도
const rr = (x, y, w, h, r) => R2.rr(ctx, x, y, w, h, r);
const ROW = { a: 1090, b: 1170, o: 1250 };          // 아래 칸 (위 y — 높이 56)
const tP = W(B5, "10만"), tS = W(B7, "매도해서"), tSame = W(B7, "같은 금액을");
const tO = W(A4, "11만"), tA = W(A5, "25.3%"), tAv = W(A5, "7만"), tBv = W(A6, "51만"), tX = W(A6, "6.83배"), tQ = S(A7);
const tag = (x, y, s, c, ink) => { ctx.font = `900 38px ${R2.FONT}`; const w = ctx.measureText(s).width + 30; ctx.fillStyle = c; rr(x, y, w, 56, 12); ctx.fill(); ctx.fillStyle = ink; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, x + w / 2, y + 30); return w; };
const flash = (t, t0, y) => { if (t < t0 - 0.1 || t > t0 + 1.6) return; const u = clamp((t - t0 + 0.1) / 0.25, 0, 1) * clamp((t0 + 1.6 - t) / 0.4, 0, 1); ctx.fillStyle = `rgba(232,184,0,${0.2 * u})`; rr(66, y - 8, 948, 72, 16); ctx.fill(); };
add(tR0, tR1, t => {
  const al = clamp((t - tR0) / 0.35, 0, 1) * clamp((tR1 - t) / 0.35, 0, 1);
  const d = pace(t), k = Math.floor(d);
  ctx.save(); ctx.globalAlpha = al;
  // 날짜 (왼쪽 위)
  ctx.font = `900 72px ${R2.FONT}`; ctx.fillStyle = "#F4F6FA"; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(ymd(CC.dates[k]), 80, 168);
  // ⑦ 두 선 사이 (왜?) — 선 아래에 먼저
  if (t >= tQ - 0.2) {
    const u = clamp((t - tQ + 0.2) / 0.5, 0, 1), Y = ch.Yf(d);
    ctx.save(); ctx.globalAlpha = al * u * 0.22; ctx.fillStyle = YE; ctx.beginPath();
    for (let i = 0; i <= k; i += 3) { const xx = ch.X(i), yy = Y(CC.b[i]); i === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); }
    ctx.lineTo(ch.X(k), Y(CC.b[k]));
    for (let i = k; i >= 0; i -= 3) ctx.lineTo(ch.X(i), Y(CC.a[i]));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // ⑤ 원금(노란 점선) 아래로 내려간 QYLD 날은 빨간 띠로 (s5 부터 — 선 아래에 먼저)
  if (t >= tA - 0.2) {
    const u = clamp((t - tA + 0.2) / 0.45, 0, 1), Yb = ch.Yf(d), y0 = Yb(I0);
    ctx.save(); ctx.globalAlpha = al * u * 0.55; ctx.fillStyle = RD; ctx.beginPath(); ctx.moveTo(ch.X(0), y0);
    for (let i = 0; i <= k; i += 2) ctx.lineTo(ch.X(i), Math.max(y0, Yb(CC.a[i])));
    ctx.lineTo(ch.X(k), Math.max(y0, Yb(CC.a[k]))); ctx.lineTo(ch.X(k), y0); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  const heads = ch.draw(ctx, d);
  // 선 끝 이름표 (QQQ 위 · QYLD 아래)
  const hB = heads.find(h => h.j === 0), hA = heads.find(h => h.j === 1);
  ctx.font = `900 34px ${R2.FONT}`;
  // 선 끝 왼쪽 이름표 (떨어지는 동전과 겹치지 않게 — 처음 왼쪽 끝에서는 숨김)
  const lab = (h, s, c, ink, below, a2) => { if (a2 <= 0) return; const w = ctx.measureText(s).width + 24, x = clamp(h.x - w - 36, 200, 1014 - w), y = below ? h.y + 18 : h.y - 70; ctx.globalAlpha = al * a2 * clamp((h.x - w - 36 - 200) / 40, 0, 1); ctx.fillStyle = c; rr(x, y, w, 50, 11); ctx.fill(); ctx.fillStyle = ink; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s, x + w / 2, y + 27); ctx.globalAlpha = al; };
  if (hB.y < hA.y - 60) { lab(hB, "QQQ", BL, "#03152A", false, 1); lab(hA, "QYLD", OR, "#140A00", true, clamp((tA - 0.2 - t) / 0.3, 0, 1)); }   // QYLD 이름표는 −25.3% 칩이 나오기 전까지
  // 꺼낸 동전: 꺼낸 날마다 두 선 끝에서 동전이 떨어져 사라짐 (0.5초 · 120px — 아래 숫자 칸을 가리지 않게) → '꺼낸 돈' 칸 값이 늘어남
  for (const e of EV) { const u = (t - e.t) / 0.5; if (u < 0 || u > 1 || e.i > k) continue;
    for (const h of [hA, hB]) R2.coin(ctx, h.x + 14 * u, h.y + 18 + 120 * u * u, 15, al * (1 - u)); }
  // ⑤ QYLD 끝: 원금 아래 빨간 틈 · −25.3%
  const Y = ch.Y;
  if (t >= tA - 0.2) {
    const u = ease((t - tA + 0.2) / 0.45), xg = ch.X(K1) + 30, y0 = Y(I0), y1 = Y(endA);
    ctx.globalAlpha = al * u; ctx.strokeStyle = RD; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(xg, y0); ctx.lineTo(xg, y0 + (y1 - y0) * u); ctx.stroke();
    R2.pin(ctx, xg, y1, pcs(rA), RD, u, false, 42, [200, 1014]);
    ctx.globalAlpha = al;
  }
  // ⑥ QQQ 끝: ×6.83 (QYLD 끝 → QQQ 끝)
  if (t >= tX - 0.25) {
    const u = ease((t - tX + 0.25) / 0.5), xg = ch.X(K1) + 30, y0 = Y(endA), y1 = Y(endB);
    ctx.globalAlpha = al * u; ctx.strokeStyle = YE; ctx.lineWidth = 6; ctx.setLineDash([14, 10]);
    ctx.beginPath(); ctx.moveTo(xg, y0); ctx.lineTo(xg, y0 + (y1 - y0) * u); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `900 130px ${R2.FONT}`; ctx.fillStyle = YE; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(255,212,0,.55)"; ctx.shadowBlur = 24; ctx.fillText("×" + xAB.toFixed(2), 240, 400); ctx.shadowBlur = 0;
    ctx.globalAlpha = al;
  }
  // ⑦ 왜? — 두 선 사이 가운데에 '?'
  if (t >= tQ - 0.2) {
    const u = clamp((t - tQ + 0.2) / 0.4, 0, 1), q = 0.75 + 0.25 * Math.abs(Math.sin((t - tQ) * 3.2));
    const xi = Math.round(K1 * 0.78), xm = ch.X(xi), ym = (Y(CC.a[xi]) + Y(CC.b[xi])) / 2;
    ctx.globalAlpha = al * u * q; ctx.font = `900 170px ${R2.FONT}`; ctx.fillStyle = YE; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(255,212,0,.6)"; ctx.shadowBlur = 30; ctx.fillText("?", xm, ym); ctx.shadowBlur = 0; ctx.globalAlpha = al;
  }
  // s5 원금 $100,000 칩 (노란 점선) — 경주 시작 전
  if (t >= tP - 0.2 && t < tGo + 0.6) R2.pin(ctx, ch.X(0) + 60, ch.Y(I0), money(I0), YE, clamp((t - tP + 0.2) / 0.3, 0, 1) * clamp((tGo + 0.6 - t) / 0.4, 0, 1), true, 44, [200, 1014]);
  // s7 QQQ 도 같은 날 같은 금액을 SELL
  if (t >= tS - 0.2 && t < E(B7) + 0.6) { const u = clamp((t - tS + 0.2) / 0.3, 0, 1) * clamp((E(B7) + 0.6 - t) / 0.4, 0, 1); ctx.globalAlpha = al * u;
    ctx.font = `900 40px ${R2.FONT}`; const w = ctx.measureText("SELL").width + 28, x = clamp(hB.x + 26, 200, 1014 - w), y = hB.y - 30; ctx.fillStyle = RD; rr(x, y, w, 52, 12); ctx.fill(); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("SELL", x + w / 2, y + 28); ctx.globalAlpha = al; }
  // 아래 칸: QYLD 값 · 원금 대비 / QQQ 값 / 꺼낸 돈 (QYLD = QQQ) — 날짜가 흐르기 시작할 때부터
  const ra = clamp((t - tGo + 0.2) / 0.4, 0, 1); if (ra <= 0) { ctx.restore(); return; } ctx.globalAlpha = al * ra;
  const v = CC.a[k], r = v / I0 - 1, vb = CC.b[k];
  flash(t, tAv, ROW.a); flash(t, tBv, ROW.b); flash(t, tO, ROW.o); flash(t, tSame, ROW.o);
  tag(80, ROW.a, "QYLD", OR, "#140A00");
  ctx.font = `900 50px ${R2.FONT}`; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#F4F6FA"; ctx.fillText(money(v), 690, ROW.a + 30);
  ctx.fillStyle = r < 0 ? "#FF6B78" : MI; ctx.fillText(pcs(r), 1000, ROW.a + 30);
  tag(80, ROW.b, "QQQ", BL, "#03152A");
  ctx.font = `900 50px ${R2.FONT}`; ctx.textAlign = "right"; ctx.fillStyle = "#F4F6FA"; ctx.fillText(money(vb), 690, ROW.b + 30);
  if (t >= tX - 0.25) { ctx.globalAlpha = al * ra * clamp((t - tX + 0.25) / 0.4, 0, 1); ctx.fillStyle = YE; ctx.fillText("×" + xAB.toFixed(2), 1000, ROW.b + 30); ctx.globalAlpha = al * ra; }
  // 꺼낸 돈: 동전 둘(두 계좌) = → 합
  R2.coin(ctx, 104, ROW.o + 28, 24, al * ra, OR); R2.coin(ctx, 196, ROW.o + 28, 24, al * ra, BL);
  ctx.font = `900 50px ${R2.FONT}`; ctx.fillStyle = "#C9D2E2"; ctx.textAlign = "center"; ctx.fillText("=", 150, ROW.o + 30); ctx.textAlign = "left"; ctx.fillText("→", 240, ROW.o + 30);
  ctx.fillStyle = "#FFD86B"; ctx.textAlign = "right"; ctx.fillText(money(CC.out[k]), 1000, ROW.o + 30);
  ctx.restore();
});
{ K.cut(E(B5) - 0.2, "2013.12 · 원금 $100,000");
  K.cut(E(B6) - 0.2, "경주 시작 · 두 선 끝에서 동전");
  K.cut(tS + 0.4, "QQQ 도 같은 금액 SELL");
  K.cut((tGo + tEnd) / 2, "경주 중간");
  K.cut(E(A4) - 0.15, "2026.10.15 · 꺼낸 돈 $112,980");
  K.cut(E(A5) - 0.15, "QYLD $74,653 · −25.3%");
  K.cut(E(A6) - 0.15, "QQQ $510,215 · ×6.83");
  K.cut(E(A7) - 0.15, "두 선 사이 · ?");
}

// 12. 끝 화면 (s12) — 롱폼에 있는 것: 그 이유(오를 때·떨어질 때) · 다른 달에 시작한 계좌 + ⬇
{ const a = S(A8), sc = K.scene(a - 0.3, K.D, { keep: true });
  const tk = el(`<div class="a cx row" style="left:${CX}px;top:300px;gap:30px">${TK("QYLD", "o", 76)}${TK("QQQ", "b", 76)}</div>`, sc);
  pop(tk, a);
  const t2 = el(`<div class="a tease" style="left:220px;top:490px;width:300px;height:330px">${IC.updown()}</div>`, sc);
  pop(t2, W(A8, "이유와"));
  const t3 = el(`<div class="a tease" style="left:560px;top:490px;width:300px;height:330px">${IC.cals()}</div>`, sc);
  pop(t3, W(A8, "다른 달에"));
  const ar = el(`<svg class="arrow" viewBox="0 0 120 160" width="150" height="200" style="left:${CX - 75}px;top:1000px" aria-hidden="true">
    <path d="M60 6 L60 120 M14 78 L60 124 L106 78" fill="none" stroke="${YE}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>`, sc);
  pop(ar, W(A8, "아래"));
  tl.fromTo(ar, { y: 0 }, { y: 60, duration: 0.45, ease: "sine.inOut", repeat: 7, yoyo: true }, W(A8, "아래") + 0.6);
  K.cut(E(A8) - 0.1, "끝 화면 ⬇");
}

K.done();
})();
