<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"simri-test-2026-10","topic":"stock","duration":475.85,"audio":"../../../stock/source/simri-test-2026-10/narration.mp3","thumb":null,"synced":"2026-10-27T10:25:48Z","tts":"2026-10-27T09:27:08","script_sha1":"2b8c4a431b85f3a0","sent":[{"n":1,"part":"도입","text":"최근 중동 긴장과 미국 금리 상승 등으로 주가가 출렁이며, 손실 본 개인이 늘고 있습니다.","start":0.3,"end":5.9},{"n":2,"part":"도입","text":"한국은 빚으로 강제 매도된 주식이, 10월 보름 만에 9월 한 달보다 78% 많았습니다.","start":6.28,"end":12.09},{"n":3,"part":"도입","text":"이렇게 손해 보는 투자자들에겐, 공통된 행동과 생각이 있습니다.","start":12.47,"end":16.74},{"n":4,"part":"도입","text":"그것을 바탕으로, 투자로 손해 볼 수밖에 없는지 점검하는 테스트를 만들어 보았습니다.","start":17.12,"end":21.779},{"n":5,"part":"도입","text":"항목마다 본인의 답을 고르고, 그 점수를 모두 더해 주세요.","start":22.159,"end":25.846},{"n":6,"part":"도입","text":"그럼 시작하겠습니다.","start":26.226,"end":27.423},{"n":7,"part":"항목 1","text":"첫 번째 항목입니다.","start":28.423,"end":29.593},{"n":8,"part":"항목 1","text":"주식 커뮤니티에는 수익 인증 글이 하루에도 수십 개씩 올라옵니다.","start":29.973,"end":33.787},{"n":9,"part":"항목 1","text":"뉴스마다 주식을 처음 시작하는 사람이 몰린다는 이야기입니다.","start":34.167,"end":37.657},{"n":10,"part":"항목 1","text":"점심시간에는 동료가, 일주일 만에 30% 오른 종목으로 돈을 번 계좌를 보여 줍니다.","start":38.037,"end":43.84},{"n":11,"part":"항목 1","text":"그 회사에 대해 내가 아는 것은, 동료가 한 말뿐입니다.","start":44.22,"end":47.526},{"n":12,"part":"항목 1","text":"어떻게 하시겠습니까?","start":47.906,"end":49.096},{"n":13,"part":"항목 1","text":"A번, 오늘 바로 그 종목을 매수합니다.","start":49.476,"end":52.156},{"n":14,"part":"항목 1","text":"B번, 그 회사가 무엇으로 돈을 버는지부터 알아봅니다.","start":52.536,"end":56.213},{"n":15,"part":"항목 1","text":"C번, 일단 조금만 매수해 봅니다.","start":56.593,"end":59.163},{"n":16,"part":"항목 1","text":"A번은 0점, B번은 10점, C번은 5점입니다.","start":59.543,"end":63.203},{"n":17,"part":"항목 2","text":"두 번째 항목입니다.","start":64.203,"end":65.309},{"n":18,"part":"항목 2","text":"그날 밤, 모르는 사람이 메신저로 수익률 300%를 인증한 화면을 보내옵니다.","start":65.689,"end":70.717},{"n":19,"part":"항목 2","text":"회비만 내면 무조건 오를 종목을 매일 알려 주겠다며, 단체 대화방에 초대합니다.","start":71.097,"end":75.81},{"n":20,"part":"항목 2","text":"이 초대에 어떻게 하시겠습니까?","start":76.19,"end":77.978},{"n":21,"part":"항목 2","text":"A번, 무조건 오른다는 말을 듣자마자 대화를 끝냅니다.","start":78.358,"end":82.088},{"n":22,"part":"항목 2","text":"B번, 회비를 내고 들어갑니다.","start":82.468,"end":84.478},{"n":23,"part":"항목 2","text":"C번, 무료 체험 기간에만 들어가 봅니다.","start":84.858,"end":87.538},{"n":24,"part":"항목 2","text":"A번은 10점, B번은 0점, C번은 5점입니다.","start":87.918,"end":91.561},{"n":25,"part":"항목 3","text":"세 번째 항목입니다.","start":92.561,"end":93.791},{"n":26,"part":"항목 3","text":"얼마 뒤, 내가 매수한 주식이 한 달 만에 50% 올랐습니다.","start":94.171,"end":98.164},{"n":27,"part":"항목 3","text":"주변에서는 주식 고수라는 말까지 듣습니다.","start":98.544,"end":100.86},{"n":28,"part":"항목 3","text":"가장 먼저 드는 생각은 무엇입니까?","start":101.24,"end":103.278},{"n":29,"part":"항목 3","text":"A번, 같은 기간 그 주식이 속한 시장의 대표 지수와 먼저 비교해 봅니다.","start":103.658,"end":108.265},{"n":30,"part":"항목 3","text":"B번, 이번에는 운이 좋았다고 생각합니다.","start":108.645,"end":111.485},{"n":31,"part":"항목 3","text":"C번, 나는 주식에 재능이 있다고 확신합니다.","start":111.865,"end":114.879},{"n":32,"part":"항목 3","text":"A번은 10점, B번은 5점, C번은 0점입니다.","start":115.259,"end":118.979},{"n":33,"part":"항목 4","text":"네 번째 항목입니다.","start":119.979,"end":121.08},{"n":34,"part":"항목 4","text":"이제 그 종목이라면, 앞으로도 오를 거라는 확신이 듭니다.","start":121.46,"end":125.046},{"n":35,"part":"항목 4","text":"주식 계좌 전체에서, 그 한 종목을 얼마나 보유하시겠습니까?","start":125.426,"end":129.43},{"n":36,"part":"항목 4","text":"A번, 계좌의 4분의 1에서 절반까지 보유합니다.","start":129.81,"end":133.319},{"n":37,"part":"항목 4","text":"B번, 다른 종목을 모두 매도하고, 계좌의 절반 넘게 보유합니다.","start":133.699,"end":138.061},{"n":38,"part":"항목 4","text":"C번, 계좌의 4분의 1보다 적게 보유하고, 나머지는 여러 종목에 나눕니다.","start":138.441,"end":143.454},{"n":39,"part":"항목 4","text":"A번은 5점, B번은 0점, C번은 10점입니다.","start":143.834,"end":147.573},{"n":40,"part":"항목 5","text":"다섯 번째 항목입니다.","start":148.573,"end":149.873},{"n":41,"part":"항목 5","text":"그 뒤로 주식 앱 알림이 하루에 수십 번 울립니다.","start":150.253,"end":153.222},{"n":42,"part":"항목 5","text":"주가가 1%만 움직여도 매매하고 싶어집니다.","start":153.602,"end":156.539},{"n":43,"part":"항목 5","text":"정해진 날 정기적으로 매수하는 것은 빼고, 평소 한 달에 몇 번 매매하십니까?","start":156.919,"end":161.483},{"n":44,"part":"항목 5","text":"A번, 한 달에 한두 번 이하로 매매합니다.","start":161.863,"end":164.69},{"n":45,"part":"항목 5","text":"B번, 거의 매일 하루에도 여러 번 매매합니다.","start":165.07,"end":168.066},{"n":46,"part":"항목 5","text":"C번, 일주일에 한두 번 매매합니다.","start":168.446,"end":170.937},{"n":47,"part":"항목 5","text":"A번은 10점, B번은 0점, C번은 5점입니다.","start":171.317,"end":174.959},{"n":48,"part":"항목 6","text":"여섯 번째 항목입니다.","start":175.959,"end":177.216},{"n":49,"part":"항목 6","text":"그러다 꼭 매수하고 싶은 종목이 생겨, 모아 둔 1,200만 원을 넣으려 합니다.","start":177.596,"end":182.268},{"n":50,"part":"항목 6","text":"매수와 매도를 언제 얼마씩 할지, 미리 정해 두셨습니까?","start":182.648,"end":186.317},{"n":51,"part":"항목 6","text":"A번, 매수는 몇 번에 나누지만, 매도는 그때 가서 정합니다.","start":186.697,"end":190.918},{"n":52,"part":"항목 6","text":"B번, 몇 번에 나눠 매수하고 매도할지, 가격과 금액을 미리 정해 두었습니다.","start":191.298,"end":196.298},{"n":53,"part":"항목 6","text":"C번, 느낌이 오는 날 한 번에 다 매수하고, 오르면 한 번에 다 매도합니다.","start":196.678,"end":201.343},{"n":54,"part":"항목 6","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":201.723,"end":205.713},{"n":55,"part":"항목 7","text":"일곱 번째 항목입니다.","start":206.713,"end":208.201},{"n":56,"part":"항목 7","text":"1,200만 원을 넣기 전에, 내 계좌 전체를 다시 들여다봅니다.","start":208.581,"end":212.461},{"n":57,"part":"항목 7","text":"현금은 하나도 없고, 보유 종목은 모두 한 업종입니다.","start":212.841,"end":216.354},{"n":58,"part":"항목 7","text":"투자한 나라의 지수가 오르내릴 때, 현금과 업종 비중을 어떻게 할지 정해 두셨습니까?","start":216.734,"end":221.894},{"n":59,"part":"항목 7","text":"A번, 현금 비중만 대충 정해 두었습니다.","start":222.274,"end":225.114},{"n":60,"part":"항목 7","text":"B번, 오를 때와 떨어질 때의 현금 비중과 업종 배분을 미리 정해 두었습니다.","start":225.494,"end":230.492},{"n":61,"part":"항목 7","text":"C번, 정해 둔 것 없이 그때그때 오르는 업종에 모두 넣습니다.","start":230.872,"end":235},{"n":62,"part":"항목 7","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":235.38,"end":239.37},{"n":63,"part":"항목 8","text":"여덟 번째 항목입니다.","start":240.37,"end":241.683},{"n":64,"part":"항목 8","text":"보유한 종목 하나가 매수 가격의 절반이 됐고, 회사 실적이 나빠졌다는 뉴스도 나옵니다.","start":242.063,"end":247.452},{"n":65,"part":"항목 8","text":"이 종목을 어떻게 하시겠습니까?","start":247.832,"end":249.668},{"n":66,"part":"항목 8","text":"A번, 처음 매수한 이유를 다시 확인해서, 맞으면 보유하고 틀렸으면 매도합니다.","start":250.048,"end":255.547},{"n":67,"part":"항목 8","text":"B번, 이유는 따져 보지 않고 절반만 매도합니다.","start":255.927,"end":259.104},{"n":68,"part":"항목 8","text":"C번, 이유는 따져 보지 않고, 매수 가격이 될 때까지 보유하거나 더 매수합니다.","start":259.484,"end":264.658},{"n":69,"part":"항목 8","text":"A번은 10점, B번은 5점, C번은 0점입니다.","start":265.038,"end":268.758},{"n":70,"part":"항목 9","text":"아홉 번째 항목입니다.","start":269.758,"end":271.068},{"n":71,"part":"항목 9","text":"얼마 뒤 내가 투자한 나라의 대표 지수가 크게 떨어지자, 바닥이라는 글이 쏟아집니다.","start":271.448,"end":276.691},{"n":72,"part":"항목 9","text":"증권사 앱에는 내 돈만큼 빌려서 두 배로 매수할 수 있다는 안내가 뜹니다.","start":277.071,"end":281.335},{"n":73,"part":"항목 9","text":"이때 어떻게 하시겠습니까?","start":281.715,"end":283.21},{"n":74,"part":"항목 9","text":"A번, 조금만 빌려서 매수합니다.","start":283.59,"end":285.915},{"n":75,"part":"항목 9","text":"B번, 빌리지 않고 내 돈으로만 매수합니다.","start":286.295,"end":289.135},{"n":76,"part":"항목 9","text":"C번, 내 돈만큼 빌려서 두 배로 매수합니다.","start":289.515,"end":292.405},{"n":77,"part":"항목 9","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":292.785,"end":296.775},{"n":78,"part":"항목 10","text":"마지막 열 번째 항목입니다.","start":297.775,"end":299.625},{"n":79,"part":"항목 10","text":"결국 큰 손실을 본 날, 레버리지 ETF로 손실을 한 달 만에 되찾았다는 영상이 보입니다.","start":300.005,"end":305.27},{"n":80,"part":"항목 10","text":"남은 돈을 어떻게 하시겠습니까?","start":305.65,"end":307.43},{"n":81,"part":"항목 10","text":"A번, 남은 돈을 모두, 하루에 주가의 두 배만큼 움직이는 레버리지 ETF에 넣습니다.","start":307.81,"end":313.65},{"n":82,"part":"항목 10","text":"B번, 남은 돈의 일부만 그 레버리지 ETF에 넣습니다.","start":314.03,"end":317.847},{"n":83,"part":"항목 10","text":"C번, 손실은 받아들이고, 남은 돈을 여러 곳에 나눠서 다시 시작합니다.","start":318.227,"end":322.878},{"n":84,"part":"항목 10","text":"A번은 0점, B번은 5점, C번은 10점입니다.","start":323.258,"end":327.228},{"n":85,"part":"통과 기준","text":"점수를 모두 더하셨다면, 이제 통과 기준을 알려 드리겠습니다.","start":328.228,"end":332.128},{"n":86,"part":"통과 기준","text":"먼저, 아홉 번째나 열 번째 항목이 0점이라면, 총점과 상관없이 불통과입니다.","start":332.508,"end":337.678},{"n":87,"part":"통과 기준","text":"빌린 돈과 레버리지 상품은, 한 번의 폭락으로 계좌 대부분을 잃게 할 수 있기 때문입니다.","start":338.058,"end":343.294},{"n":88,"part":"통과 기준","text":"이 두 항목에 0점이 없다면, 70점 이상은 통과입니다.","start":343.674,"end":347.342},{"n":89,"part":"통과 기준","text":"40점에서 65점은 주의, 35점 이하는 불통과입니다.","start":347.722,"end":351.682},{"n":90,"part":"통과 기준","text":"통과는, 남의 말이나 그날 기분이 아니라 내 계획대로 매수하고 매도하는 사람입니다.","start":352.062,"end":357.376},{"n":91,"part":"통과 기준","text":"주의는, 원칙은 있지만 흔들리는 순간에는 감정대로 움직이는 사람입니다.","start":357.756,"end":362.346},{"n":92,"part":"통과 기준","text":"0점과 5점을 받은 습관 몇 개만 고치면, 통과할 수 있습니다.","start":362.726,"end":366.726},{"n":93,"part":"통과 기준","text":"불통과는, 손실을 본 사람들과 같은 행동을 많이 하는 사람입니다.","start":367.106,"end":371.056},{"n":94,"part":"통과 기준","text":"그럼 0점인 항목들을 묶어서 살펴보겠습니다.","start":371.436,"end":374.192},{"n":95,"part":"해설","text":"첫 번째와 두 번째 항목에서, 동료 말만 듣고 매수했거나 회비를 냈다면 0점입니다.","start":375.192,"end":380.496},{"n":96,"part":"해설","text":"공통된 문제는, 종목을 직접 공부하지 않아 내 판단을 믿을 근거가 없다는 것입니다.","start":380.876,"end":386.109},{"n":97,"part":"해설","text":"그래서 남의 말보다, 그 회사가 무엇으로 돈을 버는지부터 알아봐야 합니다.","start":386.489,"end":390.621},{"n":98,"part":"해설","text":"세 번째부터 여섯 번째 항목에서, 재능을 확신했거나 한 종목에 몰았다면 0점입니다.","start":391.001,"end":396.381},{"n":99,"part":"해설","text":"거의 매일 매매했거나, 느낌이 오는 날 한 번에 다 매수했어도 0점입니다.","start":396.761,"end":401.597},{"n":100,"part":"해설","text":"공통된 문제는, 내 느낌과 실력을 믿고 틀릴 때를 대비하지 않았다는 것입니다.","start":401.977,"end":407.145},{"n":101,"part":"해설","text":"그래서 수익은 대표 지수와 비교해 보고, 돈은 여러 종목에 여러 번 나눠 넣어야 합니다.","start":407.525,"end":412.793},{"n":102,"part":"해설","text":"일곱 번째와 여덟 번째에서, 오르는 업종에 다 넣었거나 매수 가격만 기다렸다면 0점입니다.","start":413.173,"end":419.193},{"n":103,"part":"해설","text":"공통된 문제는, 미리 정한 기준 없이 그때그때 감정대로 결정했다는 것입니다.","start":419.573,"end":424.452},{"n":104,"part":"해설","text":"그래서 현금과 업종 비중은 미리 정하고, 보유와 매도는 처음 매수한 이유로 판단합니다.","start":424.832,"en function groupSo(a, b, ns, ats) {
  let HP;
  const { sc, st } = stage(a, b, "PAPER", s => { HP = act(s, "H_PLAN", "HERO_L", 5.2).ro(4); });
  st.update = t => { enter(HP, t, a + 0.1); idle(HP, t); };
  const four = ns.length > 2;
  ns.forEach((n, i) => optCard(sc, n, tenIdx(n), four ? `Q${i + 1}` : `ROW${i + 2}`, ats[i], ats[i] + 0.4, { num: true }));
  headMark(st, sc, "HEAD_L", () => HP, `<span class="G">✓</span>`, ats[ats.length - 1] + 0.5);
  return { sc, st };
}
/* L-23 1·2번 — 남의 말만 듣고 (문장 95~97) */
{
  groupHead(ch(95), until(96), [1, 2], 95, [[1, W(95, "동료")], [2, W(95, "회비를")]]);
  K.cut(E(95) - 0.1, "L-23 1·2번 0점");
}
{ // 96 공통된 문제 — 내 머리 속 회사는 '?' · 남의 빈 말풍선만 커짐 — HERO · HEAD · MATE · HEAD_M · BACK · HEAD_B
  let HT, CO, SM;
  const { sc, st } = stage(until(96), until(97), "PAPER", s => { HT = act(s, "H_THINK", "HERO", 5.0).ro(4); CO = act(s, "W_COL", "MATE", 4.3).ro(3); SM = act(s, "W_SCAM", "BACK", 4.8).ro(3); });
  st.update = t => { idle(HT, t); idle(CO, t, 1); idle(SM, t, 2); };
  headMark(st, sc, "HEAD", () => HT, ICON.bldg().replace(/width="120" height="120"/, 'width="160" height="160"'), S(96) + 0.1);
  [["HEAD_M", () => CO], ["HEAD_B", () => SM]].forEach(([slot, get], i) => {
    const bb = headMark(st, sc, slot, get, ICON.bubble());
    gsap.set(bb, { transformOrigin: "50% 100%" });                   // 위로만 커짐 (머리 위 칸 안)
    tl.fromTo(bb, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.5, duration: 2.2, ease: "power1.out" }, W(96, "공부") - 0.4 + i * 0.3);
  });
  K.cut(E(96) - 0.1, "L-23 공통된 문제");
}
{ // 97 그래서 — 회사가 무엇으로 돈을 버는지 (건물 안 톱니·동전 — ROW1) · 10점 1번 B · 2번 A
  const { sc } = groupSo(until(97), until(98), [1, 2], [W(97, "회사가"), W(97, "회사가") + 0.35]);
  boxC(sc, "ROW1", ICON.bldg(ICON.gearCoin()).replace(/width="120" height="120"/, 'width="190" height="190"'), W(97, "무엇으로"));
  K.cut(E(97) - 0.1, "L-23 그래서");
}
/* L-24 3~6번 — 내 느낌과 실력만 믿고 (문장 98~101) */
{
  const h = groupHead(until(98), until(100), [3, 4], 98, [[3, W(98, "재능을")], [4, W(98, "한 종목에")]]);
  tl.to(h.cards, { opacity: 0, duration: 0.25, ease: "none" }, S(99) - 0.2);
  redCells(h.row, [5, 6], S(99) + 0.1);
  [[5, W(99, "거의")], [6, W(99, "느낌이")]].forEach(([n, at], i) => optCard(h.sc, n, zeroIdx(n), `ROW${i + 2}`, at, at + 0.4, { num: true }));
  K.cut(E(98) - 0.1, "L-24 3·4번 0점"); K.cut(E(99) - 0.1, "L-24 5·6번 0점");
}
{ // 100 공통된 문제 — 왕관 쓴 나 · 달걀을 한 바구니에 → 기울어 깨짐 — HERO · HEAD · BASKET_M · EGGS
  let HP, BK;
  const { sc, st } = stage(until(100), until(101), "PAPER", s => { HP = act(s, "H_PROUD", "HERO", 5.2).ro(4); BK = act(s, "BASKET", "BASKET_M", 3.0).ro(5); });
  const tB = W(100, "틀릴");
  st.update = t => { idle(HP, t); const k = sm(lin(t, tB - 0.2, tB + 0.5)); BK.g.rotation.z = -0.35 * k; BK.g.position.y = BK.home.y + 0.6 * k; };   // 기울며 들림 — 아래 귀퉁이가 자막 띠로 내려가지 않게
  headMark(st, sc, "HEAD", () => HP, ICON.crown().replace(/width="120" height="120"/, 'width="150" height="150"'), S(100) + 0.1);
  const eg = box(sc, "EGGS");
  for (let i = 0; i < 4; i++) {                                     // 쏟아진 달걀 → 깨짐 (칸 EGGS 안)
    const egg = inBox(eg, `<div class="a" style="width:58px;height:74px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:#FBF6EA;border:4px solid #C8BFA8;opacity:0"></div>`, 1330 + i * 90, 620);
    tl.set(egg, { opacity: 1 }, tB + 0.35 + i * 0.08);
    tl.fromTo(egg, { y: 0, rotate: 0 }, { y: 130 + (i % 2) * 14, rotate: 80 + i * 30, duration: 0.45, ease: "power2.in" }, tB + 0.35 + i * 0.08);
    tl.to(egg, { scaleY: 0.45, scaleX: 1.5, backgroundColor: Y, borderColor: "#FFFFFF", duration: 0.15 }, tB + 0.8 + i * 0.08);
  }
  K.cut(E(100) - 0.1, "L-24 공통된 문제");
}
{ // 101 그래서 — 10점 3번 A · 4번 C · 5번 A · 6번 B (Q1~Q4)
  groupSo(until(101), until(102), [3, 4, 5, 6], [W(101, "수익은"), W(101, "여러 종목에"), W(101, "여러 번"), W(101, "여러 번") + 0.3]);
  K.cut(E(101) - 0.1, "L-24 그래서");
}
/* L-25 7·8번 — 정한 기준 없이 감정대로 (문장 102~104) */
{
  groupHead(until(102), until(103), [7, 8], 102, [[7, W(102, "오르는")], [8, W(102, "매수 가격만")]]);
  K.cut(E(102) - 0.1, "L-25 7·8번 0점");
}
{ // 103 공통된 문제 — 기분 ▲·▼ 따라 계좌 상자가 이리저리 끌려감 — HERO · HEAD · MYBOX
  let HT;
  const { sc, st } = stage(until(103), until(104), "PAPER", s => { HT = act(s, "H_THINK", "HERO", 5.0).ro(4); });
  st.update = t => { HT.sway(t, 0.06, 1.4); };
  const up = headMark(st, sc, "HEAD", () => HT, `<span class="G">▲</span>`), dn = headMark(st, sc, "HEAD", () => HT, `<span class="R">▼</span>`);
  gsap.set([up, dn], { opacity: 0 });
  const mb = box(sc, "MYBOX"); pop(mb, S(103) + 0.1);
  const bx = inBox(mb, `<div class="a w9 c" style="width:400px;height:260px;border-radius:24px;background:#5B7DB8;border:6px solid #F2E6CF;box-sizing:border-box;font-size:76px;line-height:248px;color:#F2E6CF">MY</div>`, 1100, 290);
  const t0 = S(103) + 0.5, n = Math.max(2, Math.floor((E(103) - t0) / 0.7));
  for (let i = 0; i < n; i++) {
    const u = i % 2 === 0, at = t0 + i * 0.7;
    tl.set(up, { opacity: u ? 1 : 0 }, at); tl.set(dn, { opacity: u ? 0 : 1 }, at);
    tl.to(bx, { x: u ? 250 : -250, rotate: u ? 4 : -4, duration: 0.45, ease: "power2.inOut" }, at);
  }
  K.cut(E(103) - 0.1, "L-25 공통된 문제");
}
{ // 104 그래서 — 10점 7번 B · 8번 A
  groupSo(until(104), until(105), [7, 8], [W(104, "현금과"), W(104, "보유와")]);
  K.cut(E(104) - 0.1, "L-25 그래서");
}
/* L-26 9·10번 — 과락 (문장 105~109) */
{
  const h = groupHead(until(105), until(106), [9, 10], 105, [[9, W(105, "빚을")], [10, W(105, "레버리지")]]);
  stampIn(h.sc, "STAMP_HL", "FAIL ✕", R, W(105, "과락"), -8);
  K.cut(E(105) - 0.1, "L-26 9·10번 과락");
}
{ // 106 공통된 문제 — MY + LOAN·2X 로 두 배 → 손실 막대도 두 배 — DEBT · LOSS
  const { sc } = stage(until(106), until(107), "PAPER", null);
  const d = box(sc, "DEBT");
  inBox(d, `<div class="a w9 c" style="width:300px;height:220px;border-radius:20px;background:${G};font-size:68px;line-height:220px;color:#06231F">MY</div>`, 300, 320, S(106) + 0.1);
  inBox(d, `<div class="a w9 c" style="width:300px;height:220px;border-radius:20px;background:#C9D2E2;font-size:60px;line-height:220px;color:#0C1424">LOAN</div>`, 620, 320, W(106, "크게"), { from: { x: 200, y: 0 } });
  const t2x = inBox(d, tag("2X", R), 700, 180, W(106, "크게") + 0.2); t2x.style.position = "absolute";
  const l = box(sc, "LOSS"), base = 740;
  inBox(l, `<div class="a" style="width:220px;height:200px;border-radius:4px 4px 16px 16px;border:6px dashed rgba(255,255,255,.55);box-sizing:border-box"></div>`, 1180, base - 200, W(106, "손실까지") - 0.2);
  const two = inBox(l, `<div class="bar" style="width:220px;height:400px;background:${R}"></div>`, 1460, base - 400);
  tl.fromTo(two, { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power2.out" }, W(106, "두 배로") - 0.2);
  inBox(l, `<div class="a w9 nw ts R" style="width:220px;text-align:center;font-size:90px;line-height:1">×2</div>`, 1460, base - 520, W(106, "두 배로") + 0.3);
  K.cut(E(106) - 0.1, "L-26 공통된 문제 ×2");
}
{ // 107 MY 1 + LOAN 1 → 주가 −20% → MY −40% (calc Q9) — CALC_L · CALC_R
  const { sc } = stage(until(107), until(108), "PAPER", null);
  const c = box(sc, "CALC_L");
  const my = inBox(c, `<div class="a" style="width:360px;height:220px;border-radius:20px;background:${G};display:grid;place-items:center;font-weight:900;font-size:72px;color:#06231F">MY</div>`, 510, 300, S(107) + 0.1);
  inBox(c, `<div class="a" style="width:360px;height:220px;border-radius:20px;background:#C9D2E2;display:grid;place-items:center;font-weight:900;font-size:72px;color:#0C1424">LOAN</div>`, 510, 530, W(107, "빌려") + 0.1);
  tl.to(my, { height: 132, top: 300 - 280 + 88, backgroundColor: R, duration: 0.8 }, W(107, "40%") - 0.4);
  const r2 = box(sc, "CALC_R");
  inBox(r2, `<div class="a w9 nw ts R" style="font-size:100px;line-height:1">−20%</div>`, 1000, 300, W(107, "20%만"));
  inBox(r2, `<div class="a w9 nw ts R" style="font-size:100px;line-height:1">MY −40%</div>`, 1000, 520, W(107, "40%"));
  K.cut(E(107) - 0.1, "L-26 MY −40%");
}
{ // 108 더 떨어지면 MARGIN CALL → 다시 올라도 빈 계좌 — STAMP_T · CHART · GRAB_C · EMPTY
  let GR;
  const tG = W(108, "강제로");
  const { sc, st } = stage(until(108), until(109), "PAPER", s => { GR = act(s, "GRAB", "GRAB_C", 3.0).ro(5); });
  st.update = t => { enter(GR, t, tG - 0.4); GR.g.position.y = GR.home.y + 0.3 * (1 - sm(lin(t, tG - 0.4, tG + 0.2))); };
  const c = box(sc, "CHART");
  lineIn(c, [[260, 300], [460, 430], [640, 560], [760, 680]], WH, S(108) + 0.05, 0.9, 9);
  lineIn(c, [[760, 680], [980, 540], [1200, 400], [1420, 300]], G, W(108, "다시"), 0.9, 12);
  stampIn(sc, "STAMP_T", "MARGIN CALL", R, tG, -6);
  const e2 = box(sc, "EMPTY", `<div class="w9 nw N" style="font-size:90px">₩0</div>`, CEN + "border-radius:22px;border:7px dashed #8A93A6;box-sizing:border-box"); pop(e2, W(108, "되찾을") - 0.2);
  K.cut(E(108) - 0.1, "L-26 MARGIN CALL · 빈 계좌");
}
{ // 109 그래서 — 10점 9번 B · 10번 C
  groupSo(until(109), ch(partFirst("정리")), [9, 10], [W(109, "내 돈으로만"), W(109, "나눠서")]);
  K.cut(E(109) - 0.1, "L-26 그래서");
}

/* ═════════════ 정리 · 마무리 (문장 110~113) — 제작안 L-27 · L-29 ═════════════ */
{ // L-27 공식 시험 아님 '?' · 최근 통계와 연구 · 점검용 ✓ — HERO_L · SHEET
  const a = ch(110), b = until(112);
  let HP;
  const { sc, st } = stage(a, b, "PAPER", s => { HP = act(s, "H_PLAN", "HERO_L", 5.0).ro(4); });
  st.update = t => { enter(HP, t, S(111) + 0.05); idle(HP, t); };
  const { sh, cells } = testSheet(sc, S(110) + 0.05);
  tl.fromTo(cells, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.05, duration: 0.3 }, S(110) + 0.2);
  pop(el(`<div class="a w9 c" style="left:300px;top:40px;width:96px;height:96px;border-radius:50%;background:${Y};color:#0C1424;font-size:66px;line-height:96px">?</div>`, sh), W(110, "공식"), { from: { scale: 0.3, y: 0 } });
  [ICON.bars2(), ICON.paper()].forEach((ic, i) => pop(el(`<div class="a" style="left:${560 + i * 150}px;top:20px">${ic}</div>`, sh), W(110, i ? "연구로" : "통계와")));
  pop(el(`<div class="a w9 G" style="right:60px;top:20px;font-size:150px;line-height:1">✓</div>`, sh), W(111, "점검"), { from: { scale: 0.3, y: 0 } });
  K.cut(E(110) - 0.1, "L-27 TEST ?"); K.cut(E(111) - 0.1, "L-27 점검 ✓");
}
{ // L-29 인사 — HERO_C
  const a = until(112), b = K.D;
  let HB;
  const { st } = stage(a, b, "PAPER", s => { HB = act(s, "H_BOW", "HERO_C", 4.6).ro(4); }, { keep: true });
  st.update = t => { enter(HB, t, S(112) + 0.1); const k = sm(lin(t, S(113), S(113) + 0.6)); HB.g.rotation.z = 0.15 * Math.sin(k * Math.PI); };
  st.part(Puppet.floaters({ n: 80, x: [-11, 11], z: [-6, 4], hgt: 12, speed: [0.4, 1.0], size: 0.28, inner: "rgba(255,226,160,1)", outer: "rgba(255,180,90,0)" }));
  K.cut(E(113) - 0.1, "L-29 인사");
}
K.done();
})();
