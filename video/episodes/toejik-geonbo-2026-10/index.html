art":232.241,"end":236.79},{"n":52,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그래서 퇴직 직후에는 이미 끊긴 월급이 소득으로 잡힙니다.","start":237.24,"end":240.784},{"n":53,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이때 월급은 절반만 소득으로 봅니다.","start":241.234,"end":243.419},{"n":54,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"예시 남편은 연봉 6,000만 원의 절반인 3,000만 원이 잡혀요.","start":243.869,"end":247.762},{"n":55,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"집까지 합치면 한 달 약 30만 원이고, 이 금액이 처음 13개월 동안 나옵니다.","start":248.212,"end":253.063},{"n":56,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그다음 1년은 올해 9개월치 월급이 잡혀 약 26만 원이에요.","start":253.513,"end":257.51},{"n":57,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이럴 때는 건강보험공단에 퇴직을 증명하고, 끊긴 월급을 빼 달라고 소득 조정을 신청하세요.","start":257.96,"end":263.717},{"n":58,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"피부양자 신고 때 끊긴 월급 때문에 안 되면, 이 조정부터 신청하세요.","start":264.167,"end":268.414},{"n":59,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"또 하나는 기한입니다.","start":268.864,"end":270.143},{"n":60,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"임의계속가입은 첫 지역 고지서의 납부기한에서 2개월이 지나기 전에 신청해야 합니다.","start":270.593,"end":275.949},{"n":61,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"예를 들어 첫 고지서의 납부기한이 11월 10일이라면, 1월 10일까지 신청하세요.","start":276.399,"end":281.552},{"n":62,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이 기한이 지나면 신청할 수 없지만, 가입한 뒤 그만두는 건 언제든 됩니다.","start":282.002,"end":286.551},{"n":63,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"한마디로, 첫 고지서를 받으면 금액부터 보고 임의계속은 2개월 안에 정하세요.","start":287.001,"end":292.003},{"n":64,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그럼 이 세 가지 원칙으로 고르는 순서를 정해 보겠습니다.","start":292.453,"end":295.846},{"n":65,"part":"고르는 순서, 피부양자부터","text":"1단계, 퇴직하고 90일 안에 가족의 피부양자가 되는지 보고 신고합니다.","start":296.846,"end":301.546},{"n":66,"part":"고르는 순서, 피부양자부터","text":"피부양자가 되면 여기서 끝이에요.","start":301.996,"end":304.03},{"n":67,"part":"고르는 순서, 피부양자부터","text":"2단계, 안 되면 첫 지역 고지서를 받는 대로 퇴직을 증명해 소득 조정을 신청합니다.","start":304.48,"end":309.633},{"n":68,"part":"고르는 순서, 피부양자부터","text":"3단계, 조정한 지역 보험료가 내 몫 건보료보다 비싸면, 기한 안에 임의계속가입을 신청합니다.","start":310.083,"end":316.241},{"n":69,"part":"고르는 순서, 피부양자부터","text":"이렇게 고르면 예시 부부의 건보료는 얼마나 달라질까요?","start":316.691,"end":320.084},{"n":70,"part":"예시 부부의 결과","text":"예시 부부의 한 달 건보료는 피부양자가 되면 0원입니다.","start":321.084,"end":324.477},{"n":71,"part":"예시 부부의 결과","text":"조정한 지역은 약 14만 4천 원, 임의계속은 약 18만 원이에요.","start":324.927,"end":329.023},{"n":72,"part":"예시 부부의 결과","text":"3년, 36개월을 합치면 아무 신청도 안 했을 때가 약 860만 원입니다.","start":329.473,"end":334.475},{"n":73,"part":"예시 부부의 결과","text":"임의계속은 약 650만 원, 조정한 지역은 약 520만 원이에요.","start":334.925,"end":339.323},{"n":74,"part":"예시 부부의 결과","text":"장기요양보험료는 넣지 않은 숫자입니다.","start":339.773,"end":342.26},{"n":75,"part":"예시 부부의 결과","text":"이 부부는 집에 비해 월급이 높아서, 지역이 임의계속보다 한 달에 약 3만 6천 원 쌉니다.","start":342.71,"end":348.165},{"n":76,"part":"예시 부부의 결과","text":"같은 집에 월급이 400만 원이면 둘이 비슷하고, 그보다 낮으면 임의계속이 쌉니다.","start":348.615,"end":353.768},{"n":77,"part":"예시 부부의 결과","text":"그런데 이미 지역 보험료를 내고 계신 분들도 계실 텐데요.","start":354.218,"end":357.611},{"n":78,"part":"예시 부부의 결과","text":"그럼 어떻게 해야 할까요?","start":358.061,"end":359.491},{"n":79,"part":"이미 지역가입자가 되었다면","text":"늦지 않았습니다.","start":360.491,"end":361.468},{"n":80,"part":"이미 지역가입자가 되었다면","text":"첫째, 고지서에 끊긴 월급이 잡혀 있다면, 지금이라도 소득 조정을 신청하세요.","start":361.918,"end":367.019},{"n":81,"part":"이미 지역가입자가 되었다면","text":"조정은 신청한 뒤 보험료부터 줄어서, 늦을수록 덜 줄어요.","start":367.469,"end":371.112},{"n":82,"part":"이미 지역가입자가 되었다면","text":"예시 부부가 1년 늦게 조정하면, 3년 동안 약 710만 원을 냅니다.","start":371.562,"end":375.809},{"n":83,"part":"이미 지역가입자가 되었다면","text":"바로 할 때보다 약 190만 원을 더 내요.","start":376.259,"end":378.595},{"n":84,"part":"이미 지역가입자가 되었다면","text":"둘째, 첫 고지서 납부기한에서 2개월이 안 지났다면, 임의계속가입도 아직 신청할 수 있습니다.","start":379.045,"end":385.203},{"n":85,"part":"이미 지역가입자가 되었다면","text":"셋째, 그 기한이 지났어도 피부양자 신고는 할 수 있습니다.","start":385.653,"end":389.296},{"n":86,"part":"이미 지역가입자가 되었다면","text":"다만 퇴직하고 90일이 지나면 신고한 날부터 인정되니, 하루라도 빨리 하세요.","start":389.746,"end":394.748},{"n":87,"part":"이미 지역가입자가 되었다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.
