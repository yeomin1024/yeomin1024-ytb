strong = true
ko = '(저는|저도|제가|나는|나도)\s?(주부|전업\s?주부|살림\s?\d+\s?년)|주부\s?(\d+\s?년|입니다|인데|라서|로서|생활)|살림\s?(\d+\s?년|경력|초보|고수)|결혼\s?\d+\s?년|(\d+)\s?년\s?차\s?주부|집안일\s?(하면서|할\s?때)'

