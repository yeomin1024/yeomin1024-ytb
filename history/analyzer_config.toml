# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 역사 (폴더 history)
# VERSION: v1.1 — 2026-10-16 — 다른 세션(session_01Nd9n…)이 같은 지시로 먼저 올린 v1.0(설정만)과 합침 — 첫 회차 자료(태그 고르기·추천·analysis.md)가 이 세션 규칙으로 만들어져 이 세션 값을 남기고 그쪽의 좋은 규칙을 더함 (값은 두 v1.0 이 같음 — 머리글만)
# (v1.0 — 2026-10-16 — 새로 만듦 (사용자 지시 2026-10-16: "이 환경은 이제 저장소에 있는 역사 주제 (history 경로 없으면 폴더 만들것)를
#          유튜브 분석 코드 실행해서 분석하는 환경이야 기존 분석 결과에 이어서 한번 해보고 사용량 초기화 될때마다 분석을 계속 이어서하면 돼
#          캐시를 저장소에 남겨서 분석 이어서 할 수 있게 하고").
#          값은 new/analyzer_config.toml v1.0 (= stock v3.2) 과 같고 다른 것: 주제 이름·폴더만.
#          외국 영상 꺼짐 (기본 — 한국어 시장. new/channel_ideas.md 5-4 '전 세계 대상'은 사용자가 정하면 켬 — 4번 칸 [외국 영상도] 또는 아래 값).
#          FRESH_START 없음 (이 폴더로 PC 에서 돌린 예전 자료가 없음).
#          '기존 분석 결과' = new/ 분야 탐색(2026-10-16)의 역사 분야 — 그 검색('역사 이야기'·'세계사')·영상 정보 캐시를 이어 받아 씀 (history/README.md).)
#
# ▶ 클라우드 (이 환경): python3 tools/cloud_run.py history <status|explore|list|approve|baseline|analyze|resume> (history/README.md)
# ▶ PC (웹 화면): ⚠️ 켜지 않음 — 클라우드가 분석 중 (PC 가 켜면 자기 결과로 GitHub 의 history/result/outliers/ 를 바꿈)
# ※ 연구·교육용 분석 — 투자·의료·법률 권유가 아니다.
# =====================================================================================================

[topic]
TOPIC = "역사"
PROJECT_FOLDER = "history"           # 결과 상위 폴더 → PC: output/history/result/, GitHub: history/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"
INCLUDE_FOREIGN = false              # 한국어 영상만 (기본). 세계 시장까지 보려면 true + keywords_foreign.txt — 그때는 검색이 언어 지정 없이 새로

[keywords]
KEYWORD_MODE = "curated"
KEYWORDS_FILE = "keywords.toml"      # 관련어·제외어 목록 파일. 검색어는 keywords.txt (tools/tag_keywords.py 가 실제 영상 태그로 고름)

[ads]
AD_SUSPECT_FILTER = true             # 조회수는 많은데 좋아요·댓글이 거의 없는 영상(광고로 조회수를 산 것으로 의심) 제외
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
QUOTA_BUDGET = 6000                  # ⚠️ 비용 관련 (분석기 youtube_topic_analyzer.py 몫 — 클라우드 탐색은 cloud_run 이 남은 만큼)
DOWNLOAD_VIDEOS = false              # ⚠️ 성공사례 영상 파일은 받지 않음 (사용자 지시 2026-10-13) — 자막·썸네일·댓글·메타데이터만
