# 다음 재테크 영상 주제 탐색 설정 — tools/next_topic.py 가 읽음 (역사 history/next_topic.toml 과 같은 꼴)
# VERSION: v1.0 — 2026-11-25 — 새로 (사용자 지시 2026-11-25 "역사 주제에서 한 것 처럼 재테크 하위 주제(경제, 주식 등등) 키워드들을 모두 찾아서 트렌드 코드 실행 명령 알려줘").
#   하위 주제 = economic·stock 분석의 주제 묶음(compare.csv theme — 재테크 일반·돈 모으기·주식·ETF·노후·연금·절세·빚·대출·부업·금융 사기 / 주식 기초·지수·배당·미국·국내…)
#     + 사용자가 말한 '경제' + 보험·금·채권. 낱말 = 두 주제의 실제 영상 태그(tag_candidates.csv)·제목에 나온 말 — 제목 수·태그 영상 수는 economic/result/next_topic/keywords.md.
#   유튜브 자동완성(suggest)은 이 클라우드 환경에서 막힘(suggestqueries.google.com 프록시 403 — 2026-11-25) → 낱말은 우리 자료에서만 고름.
#   ⚠ 부동산·청약·비트코인·코인 = 사용자가 2026-10-13 재테크 검색어에서 지운 분야 — 비교용으로만 맨 끝 묶음 하나 (빼려면 WORDS 끝 4개를 지움).
#   ⚠ '경제' 묶음(금리·환율·물가 …)은 재테크 채널 설명(경제 뉴스·금리·환율 해설은 뺌)과 다름 — 관심도 비교용.
# 주제 묶음 = 제목 낱말 규칙 (형태소 분석 아님 — 한 영상이 여러 묶음에 들 수 있음).

name = "재테크"
anchor_desc = "재테크 채널"

[big]
MIN_SUBS = 100000            # 3번 '구독자 많은 채널' = 10만 이상 (역사·심리와 같음)
MIN_TOPIC_VIDEOS = 3
SHARE = 0.15                 # 최근 1년 롱폼 중 STRICT 낱말 제목 15%+ = '재테크 큰 채널'
DAYS = 365

[filter]
NOISE_TITLE = "음악|music|playlist|플레이리스트|노래|bgm|asmr|브이로그|vlog|게임|웹드라마|자장가|백색소음|kpop|리액션"
NOISE_CHANNEL = "게임|game|music|뮤직|노래|영화|무비|movie"
BROADCAST = "tvn|jtbc|mbc|sbs|kbs|ebs|채널a|mbn|tv조선|drama|개그|예능"
# 재테크 채널 가려내기용 (좁게 — 제목만) = economic/keywords.toml 강한 관련어 중 다른 뜻이 적은 것
STRICT = "재테크|주식|증시|코스피|나스닥|etf|s&p500|배당|적금|예금|연금|irp|퇴직금|노후|은퇴|절세|연말정산|isa|건강보험료|신용점수|부업|자산관리|짠테크|내집마련"
EXTRA_RELATED = "재테크|주식|투자|연금|절세|적금|배당"

# 주제 묶음 — 이름 · 낱말 규칙 (제목, 소문자). 순서 = 표 순서 = [trends] WORDS 묶음 순서.
