<script>
"use strict";
const Q = new URLSearchParams(location.search);
const RULE = Q.get("rule") || "m1", DATE = Q.get("date") || "2022-09-13";
const R = AN.rules[RULE], BASE = AN.rules.any, N = AN.dates.length;
const NO = AN.order.indexOf(RULE) + 1;
let cur = AN.dates.findIndex(d => d >= DATE); if (cur < 0) cur = N - 1;
const M = AN.m, NN = AN.n;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f0 = n => Math.round(n).toLocaleString("en-US"), f2 = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc = (r, d = 1) => { const s = (Math.abs(r * 100)).toFixed(d); return (+s === 0 ? "" : r >= 0 ? "+" : "−") + s + "%"; };
const ds = i => AN.dates[i].slice(2).replace(/-/g, ".");

// 그날(cur) 종가까지 알 수 있는 것만: 판정은 h ≤ cur 일 때만 '난 것'
const judged = (t, c) => t.h != null && t.h <= c && t.res != null;
const tally = (rule, c) => { let w = 0, l = 0; for (const t of rule.trades) if (t.b <= c && judged(t, c)) t.res === "w" ? w++ : l++; return { w, l, rate: w + l ? w / (w + l) : null }; };

// ---------- 3D (에피소드 v3.0 RACE 와 같은 카메라·창) ----------
const W = 1330, H = 950;
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setPixelRatio(1); ren.setSize(W, H, false);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(27, W / H, 0.1, 200);
cam.position.set(2.0, 7.4, 27.5); cam.lookAt(0.15, 4.0, 0); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const XW = 15.6, HZ = 0.7, XL = -XW / 2 - 0.55, XR = XW / 2 + 0.2;
const WIN = 504, FR = 0.78, YB = 1.25, YT = 7.6;
const i0 = Math.max(0, cur - FR * WIN), a0 = Math.max(0, Math.floor(i0));
const X = i => XL + XW * (i - i0) / WIN;
// 판정 전 거래 (오늘 들고 있고 아직 +5%·−5% 어느 쪽에도 안 닿음)
const openT = R.trades.find(t => t.b <= cur && !(judged(t, cur)) && (t.open || t.s > cur));
// 값 범위: 보이는 지난 날 + 판정 전 거래의 목표·실패선 (미래 값 없음)
let lo = Infinity, hi = -Infinity;
for (let i = a0; i <= cur; i++) { lo = Math.min(lo, AN.close[i]); hi = Math.max(hi, AN.close[i]); }
if (openT) { lo = Math.min(lo, openT.sl); hi = Math.max(hi, openT.tg); }
{ const sp = hi - lo; lo -= 0.04 * sp; hi += 0.06 * sp; }
const Y = p => YB + (p - lo) / (hi - lo) * (YT - YB);
const mat = (c, op) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false });

// 날마다 벽 색: 그 구간(b ≤ i < s)의 거래가 그날까지 판정 났으면 초록/빨강, 아니면 파랑, 거래 밖은 회색(현금)
const COL = { w: ["#0B3D33", "#22C79A"], l: ["#3D0F18", "#E0475A"], o: ["#0D2A4A", "#3E8FE0"], n: ["#1A2336", "#4A5875"] };
const state = new Array(N).fill("n");
for (const t of R.trades) { if (t.b > cur) break; const end = t.open ? cur + 1 : Math.min(t.s, cur + 1), st = judged(t, cur) ? t.res : "o"; for (let i = t.b; i < end; i++) state[i] = st; }   // b ≤ i < s = 주식을 든 구간
{
  const pos = [], col = [];
  for (let i = a0; i < cur; i++) {
    const x0 = X(i), x1 = X(i + 1), y0 = Y(AN.close[i]), y1 = Y(AN.close[i + 1]);
    const c = COL[state[i]].map(h => new THREE.Color(h)), t0 = Math.min(1, y0 / YT * 1.15), t1 = Math.min(1, y1 / YT * 1.15);
    for (const [x, y, t] of [[x0, 0, 0], [x0, y0, t0], [x1, y1, t1], [x0, 0, 0], [x1, y1, t1], [x1, 0, 0]]) {
      pos.push(x, y, HZ); const k = c[0].clone().lerp(c[1], t); col.push(k.r, k.g, k.b);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.93, side: THREE.DoubleSide })); m.renderOrder = 0; scene.add(m);
  const rf = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.13, depthWrite: false, side: THREE.DoubleSide }));
  rf.scale.y = -0.32; rf.position.y = -0.02; rf.renderOrder = 0; scene.add(rf);
}
const fl = new THREE.Mesh(new THREE.PlaneGeometry(XW + 2.4, 4), new THREE.MeshBasicMaterial({ color: "#0E1A31", transparent: true, opacity: .85 }));
fl.rotation.x = -Math.PI / 2; fl.position.set(0, -0.01, 1.0); scene.add(fl);
function ribbon(pts, w, color, z, dash, op, order) {         // pts = [[x, y]] — 굵기는 선에 수직, dash = 점 하나 길이(장면 단위)
  const pos = []; let acc = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const [ax, ay] = pts[k], [bx, by] = pts[k + 1], L = Math.hypot(bx - ax, by - ay) || 1e-6;
    const on = !dash || Math.floor(acc / dash) % 2 === 0; acc += L; if (!on) continue;
    const nx = -(by - ay) / L * w / 2, ny = (bx - ax) / L * w / 2;
    pos.push(ax - nx, ay - ny, z, ax + nx, ay + ny, z, bx + nx, by + ny, z, ax - nx, ay - ny, z, bx + nx, by + ny, z, bx - nx, by - ny, z);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.Mesh(g, mat(color, op ?? 1)); m.renderOrder = order ?? 3; scene.add(m); return m;
}
const dashed = (x0, x1, y, step) => { const o = []; for (let x = x0; x <= x1 + 1e-9; x += step) o.push([Math.min(x, x1), y]); return o; };
// 값 격자 · 분기 바닥 선
const niceStep = raw => { const e = Math.pow(10, Math.floor(Math.log10(raw))); for (const f of [1, 2, 2.5, 5, 10]) if (f * e >= raw) return f * e; return 10 * e; };
const step = niceStep((hi - lo) / 5), ticks = [];
for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) ticks.push(p);
for (const p of ticks) ribbon([[XL - 0.05, Y(p)], [XR, Y(p)]], 0.022, "#5A6C90", HZ + 0.012, 0, 0.5, 1);
const YRS = [];
for (let i = Math.max(1, a0); i <= cur; i++) {
  const m0 = AN.dates[i - 1].slice(5, 7), m1 = AN.dates[i].slice(5, 7);
  if (m0 === m1 || !["01", "04", "07", "10"].includes(m1)) continue;
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(X(i), 0, -HZ), new THREE.Vector3(X(i), 0, 2.6)]);
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: "#2A3958", transparent: true, opacity: .9 })));
  if (m1 === "01") YRS.push([X(i), AN.dates[i].slice(0, 4)]);
}
// 가격 선 하나 (흰)
{ const pts = []; for (let i = a0; i <= cur; i++) pts.push([X(i), Y(AN.close[i])]); ribbon(pts, 0.05, "#FFFFFF", HZ + 0.01, 0, 0.95, 4); }
// 판정 전 거래: 목표선 +5% (초록 점선) · 실패선 −5% (빨간 점선) · 산 값 (흰 가는 선) — 산 날부터 오늘 막대 조금 오른쪽까지
if (openT) {
  const xa = X(openT.b), xb = X(cur) + 0.35;
  ribbon(dashed(xa, xb, Y(openT.tg), 0.12), 0.05, "#2BE0A0", HZ + 0.04, 0.12, 0.95, 3);
  ribbon(dashed(xa, xb, Y(openT.sl), 0.12), 0.05, "#FF4D5E", HZ + 0.04, 0.12, 0.95, 3);
  ribbon([[xa, Y(openT.bp)], [xb, Y(openT.bp)]], 0.018, "#FFFFFF", HZ + 0.035, 0, 0.45, 3);
}
// 매수 = 작은 흰 고리 · 판정 = 작은 점 (초록 성공 · 빨강 실패)
const disc = (x, y, r, c, z, order, op) => { const m = new THREE.Mesh(new THREE.CircleGeometry(r, 32), op == null ? new THREE.MeshBasicMaterial({ color: c, depthWrite: false }) : mat(c, op));
  m.position.set(x, y, z); m.renderOrder = order; scene.add(m); };
const ring = (x, y) => { disc(x, y, 0.2, "#05080F", HZ + 0.064, 5); disc(x, y, 0.165, "#FFFFFF", HZ + 0.066, 6); disc(x, y, 0.095, "#0B1428", HZ + 0.068, 7); };   // 매수 = 흰 고리 (검은 테)
const dot = (x, y, c) => { disc(x, y, 0.3, c, HZ + 0.062, 5, 0.22); disc(x, y, 0.19, "#05080F", HZ + 0.064, 6); disc(x, y, 0.15, c, HZ + 0.066, 7); };                // 판정 = 색 점 (검은 테 + 번짐)
let nMarks = 0;
for (const t of R.trades) {
  if (t.b > cur) break;
  if (t.b >= a0) { ring(X(t.b), Y(AN.close[t.b])); nMarks++; }
  if (judged(t, cur) && t.h >= a0) { dot(X(t.h), Y(AN.close[t.h]), t.res === "w" ? "#2BE0A0" : "#FF4D5E"); nMarks++; }
}
// 오늘 막대 · 점
{ const pl = new THREE.Mesh(new THREE.PlaneGeometry(0.05, YT + 1.2), mat("#FFD400", 0.45)); pl.position.set(X(cur), (YT + 1.2) / 2, HZ + 0.02); pl.renderOrder = 7; scene.add(pl);
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 16), new THREE.MeshBasicMaterial({ color: "#FFFFFF" })); d.position.set(X(cur), Y(AN.close[cur]), HZ + 0.08); d.renderOrder = 8; scene.add(d); }

// ---------- 글자 (오버레이) ----------
const ov = document.getElementById("ov");
const ovEl = (html, x, y, cls, style) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.left = x + "px"; e.style.top = y + "px"; if (style) e.style.cssText += style; ov.appendChild(e); return e; };
const boxOf = el => { const r = el.getBoundingClientRect(), o = ov.getBoundingClientRect(); return { l: r.left - o.left, t: r.top - o.top, r: r.right - o.left, b: r.bottom - o.top }; };
const PLACED = [], hit = a => PLACED.some(b => !(a.r + 6 < b.l || a.l - 6 > b.r || a.b + 6 < b.t || a.t - 6 > b.b));
{ const cp = proj(X(cur), YT + 1.2, HZ + 0.02), e = ovEl(`<span class="tab">$${f2(AN.close[cur])}</span>`, cp[0], cp[1] - 4, "cur"); PLACED.push(boxOf(e)); }
if (openT) {                                                 // 목표·실패선 이름 — 오늘 막대 오른쪽
  for (const [v, txt, c] of [[openT.tg, `+${Math.round(NN * 100)}%`, "#2BE0A0"], [openT.sl, `−${Math.round(M * 100)}%`, "#FF6B78"]]) {
    const pp = proj(X(cur) + 0.42, Y(v), HZ + 0.04), e = ovEl(txt, pp[0], pp[1], "thl tab", `color:${c};border:2px solid ${c}55`); PLACED.push(boxOf(e));
  }
}
// 가장 최근 판정 하나만 작은 칩 (영상: 판정 순간 나타났다가 약 1.5초 뒤 흐려짐)
{
  const last = R.trades.filter(t => t.b <= cur && judged(t, cur) && t.h >= a0).pop();
  if (last) {
    const w = last.res === "w", c = w ? "#2BE0A0" : "#FF4D5E";
    // 칩은 그 점 앞뒤(지난 날만 — 판정 10일 전 ~ 오늘)의 가장 높은 종가보다 위에 두고 가는 막대로 점과 잇는다 → 가격 선을 가리지 않음
    let top = AN.close[last.h]; for (let i = Math.max(a0, last.h - 10); i <= Math.min(cur, last.h + 25); i++) top = Math.max(top, AN.close[i]);
    const pp = proj(X(last.h), Y(AN.close[last.h]), HZ + 0.07), pt = proj(X(last.h), Y(top) + 0.75, HZ + 0.07);
    const e = ovEl(`<span style="color:${c}">${w ? "✓" : "✗"}</span><span class="tab" style="color:${c}">${pc(last.r)}</span>`, pt[0], pt[1], "chip", `border-color:${c}88`);
    const b = boxOf(e);
    const st = document.createElement("div"); st.style.cssText = `position:absolute;left:${pp[0] - 1.5}px;top:${b.b}px;width:3px;height:${Math.max(0, pp[1] - 14 - b.b)}px;background:${c};opacity:.7`; ov.appendChild(st);
    PLACED.push(b);
  }
}
const axEls = [];
for (const p of ticks) { const q = proj(XR + 0.05, Y(p), HZ); axEls.push(ovEl(`$${f0(p)}`, q[0] + 34, q[1], "lab ax")); }
for (const [x, yy] of YRS) { const q = proj(x, 0, 2.2), e = ovEl(yy, q[0] + 34, q[1], "lab ax"); if (boxOf(e).l < 46) e.remove(); else axEls.push(e); }
for (const e of axEls) if (hit(boxOf(e))) e.style.visibility = "hidden";
// 범례: 초록 ✓ · 빨강 ✗ · 파랑 … (판정 전) · 회색 $ (현금) · 흰 고리 BUY
{
  const lg = document.createElement("div"); lg.className = "legend"; lg.style.left = "48px"; lg.style.top = "898px";
  lg.innerHTML = `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="8" fill="#0B1428" stroke="#fff" stroke-width="4"/></svg><span class="tag b" style="font-size:19px;padding:6px 9px">BUY</span>
    <span class="sw" style="margin-left:22px;background:linear-gradient(180deg,#22C79A,#0B3D33)"></span><span class="up">✓</span>
    <span class="sw" style="margin-left:16px;background:linear-gradient(180deg,#E0475A,#3D0F18)"></span><span class="dn">✗</span>
    <span class="sw" style="margin-left:16px;background:linear-gradient(180deg,#3E8FE0,#0D2A4A)"></span><span style="color:#8CC8FF">…</span>
    <span class="sw" style="margin-left:16px;background:linear-gradient(180deg,#4A5875,#1A2336)"></span><span>$</span>`;
  ov.appendChild(lg);
}

// ---------- 머리 ----------
const ICON = {
  cal1: `<svg viewBox="0 0 48 48" width="48" height="48"><rect x="5" y="9" width="38" height="34" rx="7" fill="none" stroke="#fff" stroke-width="4"/><path d="M5 19h38M15 5v8M33 5v8" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M21 26 l4-3 v14" fill="none" stroke="#FFD400" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  target: `<svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#9FB1CF" stroke-width="3.5"/><circle cx="24" cy="24" r="10" fill="none" stroke="#9FB1CF" stroke-width="3.5"/><circle cx="24" cy="24" r="3.5" fill="#FFD400"/></svg>`,
  log: `<svg class="ic" viewBox="0 0 48 48"><rect x="8" y="5" width="32" height="38" rx="6" fill="none" stroke="#9FB1CF" stroke-width="3.5"/><path d="M15 16h18M15 24h18M15 32h11" stroke="#9FB1CF" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  again: `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1.5 6" fill="none" stroke="#D6E0EF" stroke-width="3" stroke-linecap="round"/><path d="M20 3v6h-6" fill="none" stroke="#D6E0EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const HEAD = { m1: () => `${ICON.cal1}<span style="color:var(--N)">→</span><span class="tag b">BUY</span>` };
document.getElementById("hd").innerHTML = `<div class="no">${NO}</div><div class="rule">${(HEAD[RULE] || (() => `<span class="tag b">BUY</span>`))()}</div>`;
const D = AN.dates[cur];
document.getElementById("date").innerHTML = `<span class="tab">${D.slice(0, 4)}.${D.slice(5, 7)}.${D.slice(8, 10)}</span>`;

// ---------- 오른쪽 카드 ① 성공률 ② 거래 기록 ----------
const A = tally(R, cur), B = tally(BASE, cur);
const spark = (() => {                                       // 그날까지 판정 난 거래로 센 성공률 (이 신호 = 초록 · ↻ = 회색), 판정 5개 이후부터
  const w = 480, h = 96, pts = [[], []];
  for (let c = 0; c <= cur; c += 2) [R, BASE].forEach((rr, j) => { const s = tally(rr, c); if (s.w + s.l >= 5) pts[j].push([c, s.rate]); });
  [R, BASE].forEach((rr, j) => { const s = tally(rr, cur); if (s.w + s.l >= 5) pts[j].push([cur, s.rate]); });
  const all = pts[0].concat(pts[1]).map(p => p[1]); const vlo = Math.min(...all) - 0.03, vhi = Math.max(...all) + 0.03;
  const sx = c => c / Math.max(1, N - 1) * w, sy = v => h - 6 - (v - vlo) / (vhi - vlo) * (h - 12);
  const path = a => a.map((p, q) => (q ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:14px">
    <path d="${path(pts[1])}" fill="none" stroke="#AFC0DA" stroke-width="3" stroke-linejoin="round" opacity=".75"/>
    <path d="${path(pts[0])}" fill="none" stroke="#2BE0A0" stroke-width="4" stroke-linejoin="round"/>
    ${B.rate != null ? `<circle cx="${sx(cur)}" cy="${sy(B.rate)}" r="6" fill="#AFC0DA"/>` : ""}${A.rate != null ? `<circle cx="${sx(cur)}" cy="${sy(A.rate)}" r="7" fill="#fff"/>` : ""}</svg>`;
})();
const done = R.trades.filter(t => t.b <= cur);
const SHOW = 6, skip = Math.max(0, done.length - SHOW);
const rows = done.slice(skip).map((t, kk) => {
  const k = kk + skip, op = !judged(t, cur);
  const buy = `<div class="cl"><b class="b">BUY</b><span class="dt tab">${ds(t.b)}</span><span class="px tab">$${f0(t.bp)}</span></div>`;
  if (op) {                                                  // 판정 전: −5% ~ +5% 막대 위 지금 자리 (산 값 대비 종가 — 판정과 같은 잣대)
    const now = AN.close[cur] / t.bp - 1, u = clamp((now + M) / (M + NN), 0, 1);
    return `<div class="t2 open"><span class="k">${k + 1}</span>${buy}<span class="ar">→</span>
      <div class="gauge"><span class="e dn" style="left:0">✗</span><span class="e up" style="right:0">✓</span><div class="bx"><div class="tr"></div><div class="z"></div><div class="m" style="left:${(u * 100).toFixed(1)}%"></div></div></div>
      <span class="r tab" style="color:#8CC8FF">${pc(now)}</span></div>`;
  }
  const w = t.res === "w";
  return `<div class="t2"><span class="k">${k + 1}</span>${buy}<span class="ar">→</span>
    <div class="cl"><b class="${w ? "w" : "l"}">${w ? "✓" : "✗"}</b><span class="dt tab">${ds(t.s)}</span><span class="px tab">$${f0(t.sp)}</span></div>
    <span class="r tab ${t.r >= 0 ? "up" : "dn"}">${pc(t.r)}</span></div>`;
}).join("");
const rate = s => s.rate == null ? "—" : (s.rate * 100).toFixed(1) + "%";
document.getElementById("side").innerHTML = `
  <div class="card"><div class="ch">${ICON.target}<span class="cri w">▲ +${Math.round(NN * 100)}% ✓</span><span class="cri l">▼ −${Math.round(M * 100)}% ✗</span></div>
    <div class="acc"><span class="rb">${NO}</span><span class="big tab">${rate(A)}</span><span class="wl tab"><span class="up">✓ ${A.w}</span><span class="dn">✗ ${A.l}</span></span></div>
    <div class="acc bh"><span class="bhp">${ICON.again}<span>BUY</span></span><span class="bv tab">${rate(B)}</span><span class="wl tab"><span>✓ ${B.w}</span><span>✗ ${B.l}</span></span></div>${spark}</div>
  <div class="card"><div class="ch">${ICON.log}<span class="tab">${done.length}</span>${skip ? `<span class="tab" style="margin-left:auto;font-size:20px">1~${skip} ↑</span>` : ""}</div>${rows}</div>`;
console.log(`[STILL] ${new Date().toISOString()} rule=${RULE} date=${D} window=${AN.dates[a0]}~${D} marks=${nMarks} open=${openT ? ds(openT.b) + " now=" + pc(AN.close[cur] / openT.bp - 1) : "none"} rate=${rate(A)} (${A.w}/${A.w + A.l}) base=${rate(B)} (${B.w}/${B.w + B.l})`);
document.fonts.ready.then(() => { ren.render(scene, cam); window.READY = true; });
</script></body></html>
