# 다음 쇼핑(생활) 영상 주제 탐색 설정 — tools/next_topic.py 가 읽음 (guides/topic_guide.md 1-0 네 단계 — 심리·역사·재테크와 같음)
# VERSION: v1.0 — 2026-11-27 — 새로 (사용자 지시 2026-11-27 "심리 주제 때 했던 주체 탐색 방법 … 그 방법대로 생활 관련 주제 영상들 분석해서 그 영상들과
#   관련된 물건들을 고르고 그 물건들로 어떤 이득을 얻을 수 있는지에 대해 영상을 만드는게 좋을것 같아" · "요즘 생활 관련해서 유행하고 있는것도 찾아봐도 좋아").
#   ⚖️ 판단: 주제 묶음 = 물건 갈래가 아니라 **생활 문제**(난방비·곰팡이·건조·빨래·식비…) — 영상이 '이 물건으로 무엇을 얻나(돈·시간·건강·편함)'를 말하므로
#   문제 쪽으로 묶어야 물건이 따라옴. 낱말은 shopping/result/outliers/compare.csv 제목과 item_scan.md 를 보고 Claude 가 고름 (제목 낱말 규칙 — 한 영상이 여러 묶음에 듦).

name = "쇼핑·생활"
anchor_desc = "살림·쇼핑 채널"

[big]
MIN_SUBS = 100000            # 3번 '구독자 많은 채널' = 10만 이상 (심리·역사·재테크와 같음)
MIN_TOPIC_VIDEOS = 3
SHARE = 0.15                 # 최근 1년 롱폼 중 STRICT 낱말 제목 15%+ = '살림·쇼핑 큰 채널'
DAYS = 365

[filter]
NOISE_TITLE = "음악|music|playlist|플레이리스트|노래|bgm|asmr|게임|웹드라마|자장가|백색소음|kpop|리액션|사연|참교육|막장|충격 근황|스타 부부|먹방|골프|캠핑|낚시|자동차|아이돌"
NOISE_CHANNEL = "게임|game|music|뮤직|노래|영화|무비|movie|뉴스|news"
BROADCAST = "tvn|jtbc|mbc|sbs|kbs|ebs|채널a|mbn|tv조선|drama|개그|예능"
# 살림·쇼핑 채널 가려내기용 (제목만 — 좁게)
STRICT = "살림|추천템|꿀템|살림템|주방|정리|수납|청소|다이소|쿠팡|이케아|코스트코|내돈내산|하울|언박싱|생활용품|가성비|필수템|인생템|코디|중년패션"
EXTRA_RELATED = "살림|추천템|꿀템|주방|정리|청소|다이소|쿠팡"

# 주제 묶음 = 생활 문제 — 이름 · 낱말 규칙 (제목, 소문자). 순서 = 표 순서.
[[topics]]
name = "난방비·겨울 추위"
rx = "난방|보일러|외풍|웃풍|뽁뽁이|문풍지|단열|추위|겨울철|한파|온수매트|전기요|전기장판|히터|온풍기"
[[topics]]
name = "전기·가스·수도 요금"
rx = "전기\\s?(요금|세|료)|절전|대기전력|누진|가스\\s?(비|요금)|수도\\s?요금|관리비|공과금"
[[topics]]
name = "곰팡이·결로·습기"
rx = "곰팡이|결로|습기|제습|물방울|창문 물"
[[topics]]
name = "건조·가습·정전기"
rx = "건조(?!기|대)|가습|정전기|보습|실내 습도"
[[topics]]
name = "빨래·세탁·얼룩"
rx = "빨래|세탁|건조기|얼룩|세제|수건|섬유유연제|드럼"
[[topics]]
name = "청소·화장실·물때"
rx = "청소|화장실|욕실|물때|찌든|기름때|먼지|변기|배수구|곰팡"
[[topics]]
name = "설거지·주방 일"
rx = "설거지|싱크대|수세미|행주|식세기|식기세척기|주방 일|칼|도마"
[[topics]]
name = "정리·수납·비우기"
rx = "정리|수납|미니멀|비우|버리|버렸|옷장|팬트리|냉장고 정리"
[[topics]]
name = "음식 보관·신선함"
rx = "보관|소분|냉동|냉장|싱싱|신선|오래 두|유통기한"
[[topics]]
name = "식비 절약·장보기"
rx = "식비|장보기|장바구니|냉파|마트|코스트코|트레이더스|이마트|쿠팡 식품|가성비 식품|밀키트"
[[topics]]
name = "요리 시간 줄이기"
rx = "에어프라이어|전자레인지|초간단|간편|\\d+\\s?분|밥솥|찜기|초퍼|채칼"
[[topics]]
name = "냄새·탈취"
rx = "냄새|탈취|악취|방향제|홀애비"
[[topics]]
name = "잠·피로·몸 편함"
rx = "수면|숙면|잠이|베개|매트리스|허리|무릎|어깨|피로|족욕|안마"
[[topics]]
name = "옷 관리·4050 옷"
rx = "옷|패딩|니트|보풀|코트|청바지|코디|중년패션|4050|5060"
[[topics]]
name = "피부·4050 뷰티"
rx = "피부|화장품|주름|기초|선크림|크림|메이크업|탈모|두피"
[[topics]]
name = "김장·명절·연말"
rx = "김장|명절|추석|설날|제사|연말|크리스마스|선물"
[[topics]]
name = "다이소·가성비"
rx = "다이소|가성비|저렴|싸게|천원|최저가"
[[topics]]
name = "여행 준비"
rx = "여행|캐리어|기내|해외|일본|짐 싸"

[trends]
ANCHOR = "살림"              # 묶음마다 같이 넣는 기준 낱말 (PC 구글 트렌드 받기 — tools/pc_trends.py)
WORDS = [
  # 겨울 생활 문제 (지금 철)
  "난방비 절약", "외풍 차단", "뽁뽁이", "결로 곰팡이",
  "가습기", "정전기", "전기요금 절약", "온수매트",
  # 집안일
  "빨래 꿀팁", "세탁기 청소", "화장실 청소", "설거지 꿀팁",
  "정리 수납", "냉장고 정리", "음식 보관", "식비 절약",
  # 쇼핑
  "쿠팡 추천템", "살림템", "다이소 꿀템", "겨울 필수템",
  "생활꿀팁", "살림꿀팁", "주방템", "자취템",
]

