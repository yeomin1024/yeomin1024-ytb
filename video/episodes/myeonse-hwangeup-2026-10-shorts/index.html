  tl.fromTo(c.querySelector(".hand"), { rotation: 0, svgOrigin: "100 100" }, { rotation: 300, svgOrigin: "100 100", duration: 1.6, ease: "power2.inOut" }, W(9, "5시간에서"));
  const p = plane(sc, 820, 920, 300); tl.fromTo(p, { opacity: 0, x: -80, y: 30 }, { opacity: 1, x: 40, y: -20, duration: 1.2, ease: "power2.out" }, W(9, "공항에"));
  const l = el(`<div class="a cx c w9 nw" style="left:540px;top:1200px;font-size:52px">공항에 도착할 생각</div>`, sc); pop(l, W(9, "생각이라고까지"));
  K.cut(E(9) - 0.1, "가이드 5~6시간 전");

/* S-10 놓치면 못 받는 세 가지? (문장 10) */
{ const sc = midScene(until(10), until(11));

}
/* S-11 답은 아래 영상 → 관련 동영상 버튼 (문장 11) */
{ const sc = midScene(until(11), K.D, { keep: true });
