start":67.462,"end":71.105},{"n":18,"part":"예시 부부의 조건","text":"집은 남편 이름의 아파트 한 채이고, 재산세 과세표준이 3억 원입니다.","start":71.555,"end":75.953},{"n":19,"part":"예시 부부의 조건","text":"과세표준은 재산세를 매기는 금액인데, 이 집은 나라가 정한 집값인 공시가격으로 5억에서 7억 원쯤이에요.","start":76.403,"end":83.217},{"n":20,"part":"예시 부부의 조건","text":"예금 이자는 1년에 1,000만 원이 안 되고, 국민연금은 아직 받지 않아요.","start":83.667,"end":88.164},{"n":21,"part":"예시 부부의 조건","text":"아들은 회사에 다니는 직장가입자입니다.","start":88.614,"end":91.101},{"n":22,"part":"예시 부부의 조건","text":"고를 수 있는 길은 세 가지입니다.","start":91.551,"end":93.434},{"n":23,"part":"예시 부부의 조건","text":"아들의 피부양자, 직장 건강보험을 이어 가는 임의계속가입, 그리고 따로 내는 지역가입자예요.","start":93.884,"end":100.042},{"n":24,"part":"예시 부부의 조건","text":"어느 쪽이 나은지는 세 가지 원칙으로 정해집니다.","start":100.492,"end":103.432},{"n":25,"part":"예시 부부의 조건","text":"하나씩 보겠습니다.","start":103.882,"end":105.01},{"n":26,"part":"원칙 하나, 피부양자가 되면 0원","text":"첫 번째 원칙은, 피부양자가 되면 건보료를 한 푼도 내지 않는다는 것입니다.","start":106.01,"end":110.71},{"n":27,"part":"원칙 하나, 피부양자가 되면 0원","text":"피부양자는 직장에 다니는 자녀나 배우자의 건강보험에 함께 올라가는 거예요.","start":111.16,"end":115.912},{"n":28,"part":"원칙 하나, 피부양자가 되면 0원","text":"피부양자 소득 기준은 1년에 2,000만 원 이하이고, 받는 국민연금은 전부 이 소득에 넣어 셉니다.","start":116.362,"end":122.52},{"n":29,"part":"원칙 하나, 피부양자가 되면 0원","text":"피부양자 재산 기준은 과세표준 5억 4천만 원 이하입니다.","start":122.97,"end":126.514},{"n":30,"part":"원칙 하나, 피부양자가 되면 0원","text":"과세표준이 5억 4천만 원을 넘고 9억 원 이하라면, 소득이 1년에 1,000만 원 이하여야 합니다.","start":126.964,"end":132.971},{"n":31,"part":"원칙 하나, 피부양자가 되면 0원","text":"예를 들어 과세표준이 6억 원이어도, 소득이 1년에 900만 원이면 피부양자가 될 수 있습니다.","start":133.421,"end":139.329},{"n":32,"part":"원칙 하나, 피부양자가 되면 0원","text":"소득 기준 2,000만 원은 부부 둘 다 넘지 않아야 해서, 한 사람이라도 넘으면 둘 다 피부양자가 안 됩니다.","start":139.779,"end":146.239},{"n":33,"part":"원칙 하나, 피부양자가 되면 0원","text":"예시 부부는 소득이 없고 과세표준도 3억 원이라서, 둘 다 아들의 피부양자가 될 수 있습니다.","start":146.689,"end":152.446},{"n":34,"part":"원칙 하나, 피부양자가 되면 0원","text":"신고는 아들이 하는데, 퇴직하고 90일 안에 하면 퇴직한 다음 날부터 피부양자로 인정됩니다.","start":152.896,"end":158.804},{"n":35,"part":"원칙 하나, 피부양자가 되면 0원","text":"한마디로, 직장에 다니는 가족이 있다면 피부양자가 될 수 있는지부터 확인하세요.","start":159.254,"end":164.407},{"n":36,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"두 번째 원칙은, 임의계속가입은 퇴직 전 월급으로, 지역 보험료는 소득과 집으로 매긴다는 것입니다.","start":165.407,"end":171.867},{"n":37,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"임의계속가입은 퇴직한 다음 날부터 최대 36개월 동안 직장가입자로 남는 제도입니다.","start":172.317,"end":177.975},{"n":38,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"퇴직 전 18개월 가운데 직장가입자였던 기간이 합쳐서 1년 이상이면 신청할 수 있습니다.","start":178.425,"end":184.083},{"n":39,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"보험료는 퇴직 전 12개월 평균 월급으로 매기고, 회사 몫까지 혼자 내지만 전체의 절반을 깎아 줍니다.","start":184.533,"end":190.894},{"n":40,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"그래서 회사 다닐 때 월급에서 빠지던 건보료와 같고, 예시 남편은 한 달에 약 18만 원이에요.","start":191.344,"end":197.101},{"n":41,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"임의계속가입을 하면 아내를 남편의 피부양자로 올릴 수 있어요.","start":197.551,"end":201.397},{"n":42,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"반대로 지역 보험료는 집에 매기는 몫과 소득에 매기는 몫을 더한 금액입니다.","start":201.847,"end":206.448},{"n":43,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"집 몫은 과세표준에서 1억 원을 빼고, 남은 금액에 따라 정해집니다.","start":206.898,"end":211.145},{"n":44,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"예시 부부의 집은 3억 원에서 1억 원을 빼면 2억 원입니다.","start":211.595,"end":215.139},{"n":45,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"그러면 집 몫만 한 달 약 12만 4천 원이 나와요.","start":215.589,"end":218.378},{"n":46,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"소득이 거의 없어도 소득 몫으로 최소 약 2만 원을 내서, 집 몫과 합치면 약 14만 4천 원입니다.","start":218.828,"end":224.736},{"n":47,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"임의계속이 무조건 싸다고 생각하시는 분이 많은데, 꼭 그렇지 않습니다.","start":225.186,"end":229.735},{"n":48,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"월급이 같아도 집의 과세표준이 6억 원이면, 지역 보험료가 약 19만 2천 원으로 더 비싸요.","start":230.185,"end":235.942},{"n":49,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"한마디로, 회사 다닐 때 내던 건보료와 지역 보험료를 나란히 놓고 싼 쪽을 고르세요.","start":236.392,"end":241.545},{"n":50,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"세 번째 원칙은, 지역 보험료는 지난 소득으로 매기고, 임의계속가입은 신청 기한이 짧다는 것입니다.","start":242.545,"end":249.005},{"n":51,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"지역 보험료에 쓰는 소득은 올해 소득이 아니라, 1년이나 2년 전 소득입니다.","start":249.455,"end":254.306},{"n":52,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"그래서 퇴직 직후에는 이미 끊긴 월급이 소득으로 잡힙니다.","start":254.756,"end":258.3},{"n":53,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"이때 월급은 절반만 소득으로 봅니다.","start":258.75,"end":260.935},{"n":54,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"예시 남편은 연봉 6,000만 원의 절반인 3,000만 원이 잡혀요.","start":261.385,"end":265.278},{"n":55,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"집 몫까지 합치면 한 달 약 30만 원이고, 이 금액이 처음 13개월 동안 나옵니다.","start":265.728,"end":270.73},{"n":56,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"그다음 1년은 올해 9개월치 월급이 잡혀 약 26만 원이에요.","start":271.18,"end":275.177},{"n":57,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"끊긴 월급이 소득으로 잡혔다면, 건강보험공단에 퇴직을 증명하고 그 월급을 빼 달라고 소득 조정을 신청하세요.","start":275.627,"end":282.592},{"n":58,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"피부양자 신고 때 끊긴 월급 때문에 소득 기준 2,000만 원을 넘는다면, 소득 조정부터 신청하세요.","start":283.042,"end":289.2},{"n":59,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"또 하나는 임의계속가입 신청 기한입니다.","start":289.65,"end":292.137},{"n":60,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"임의계속가입은 첫 지역 보험료 고지서의 납부기한에서 2개월이 지나기 전에 신청해야 합니다.","start":292.587,"end":298.396},{"n":61,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"예를 들어 첫 고지서의 납부기한이 11월 10일이라면, 1월 10일까지 신청하세요.","start":298.846,"end":303.999},{"n":62,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"이 기한을 넘기면 나중에는 신청할 수 없지만, 가입한 뒤 그만두는 건 언제든 할 수 있습니다.","start":304.449,"end":310.055},{"n":63,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"한마디로, 첫 고지서를 받으면 금액부터 보고, 임의계속가입은 2개월 안에 정하세요.","start":310.505,"end":316.059},{"n":64,"part":"원칙 셋, 지역은 지난 소득으로, 임의계속은 기한이 짧다","text":"그럼 이 세 가지 원칙으로 고르는 순서를 정해 보겠습니다.","start":316.509,"end":319.902},{"n":65,"part":"고르는 순서, 피부양자부터","text":"1단계, 퇴직하고 90일 안에 직장 다니는 가족의 피부양자가 되는지 보고 신고합니다.","start":320.902,"end":326.357},{"n":66,"part":"고르는 순서, 피부양자부터","text":"피부양자가 되면 다음 단계는 필요 없어요.","start":326.807,"end":329.294},{"n":67,"part":"고르는 순서, 피부양자부터","text":"2단계, 안 되면 첫 지역 보험료 고지서를 받는 대로, 끊긴 월급을 빼 달라고 소득 조정을 신청합니다.","start":329.744,"end":336.053},{"n":68,"part":"고르는 순서, 피부양자부터","text":"3단계, 조정한 뒤에도 지역 보험료가 회사 다닐 때 내던 건보료보다 비싸면, 2개월 기한 안에 임의계속가입을 신청합니다.","start":336.503,"end":344.322},{"n":69,"part":"고르는 순서, 피부양자부터","text":"이 순서대로 고르면 예시 부부의 건보료는 얼마나 달라질까요?","start":344.772,"end":348.467},{"n":70,"part":"예시 부부의 결과","text":"예시 부부의 한 달 건보료는 피부양자가 되면 0원입니다.","start":349.467,"end":352.86},{"n":71,"part":"예시 부부의 결과","text":"끊긴 월급을 뺀 지역 보험료는 약 14만 4천 원, 임의계속가입은 약 18만 원이에요.","start":353.31,"end":358.614},{"n":72,"part":"예시 부부의 결과","text":"퇴직 후 3년, 36개월을 합치면, 아무 신청도 안 했을 때가 약 860만 원입니다.","start":359.064,"end":364.769},{"n":73,"part":"예시 부부의 결과","text":"임의계속가입은 약 650만 원, 끊긴 월급을 뺀 지역 보험료는 약 520만 원이에요.","start":365.219,"end":370.825},{"n":74,"part":"예시 부부의 결과","text":"건보료와 함께 내는 장기요양보험료는 넣지 않은 숫자입니다.","start":371.275,"end":374.97},{"n":75,"part":"예시 부부의 결과","text":"예시 부부는 집에 비해 월급이 높아서, 지역 보험료가 임의계속가입보다 한 달에 약 3만 6천 원 쌉니다.","start":375.42,"end":381.781},{"n":76,"part":"예시 부부의 결과","text":"같은 집에 월급이 400만 원이면 두 보험료가 비슷하고, 그보다 낮으면 임의계속가입이 쌉니다.","start":382.231,"end":388.139},{"n":77,"part":"예시 부부의 결과","text":"그런데 이미 지역 보험료를 내고 계신 분들도 계실 텐데요.","start":388.589,"end":391.982},{"n":78,"part":"예시 부부의 결과","text":"그럼 어떻게 해야 할까요?","start":392.432,"end":393.862},{"n":79,"part":"이미 지역가입자가 되었다면","text":"늦지 않았습니다.","start":394.862,"end":395.839},{"n":80,"part":"이미 지역가입자가 되었다면","text":"첫째, 고지서에 끊긴 월급이 잡혀 있다면, 지금이라도 소득 조정을 신청하세요.","start":396.289,"end":401.39},{"n":81,"part":"이미 지역가입자가 되었다면","text":"소득 조정은 신청한 다음에 나오는 보험료부터 줄어서, 늦게 신청할수록 아끼는 돈이 적어요.","start":401.84,"end":407.597},{"n":82,"part":"이미 지역가입자가 되었다면","text":"예시 부부가 소득 조정을 1년 늦게 신청하면, 3년 동안 약 710만 원을 냅니다.","start":408.047,"end":413.049},{"n":83,"part":"이미 지역가입자가 되었다면","text":"바로 신청할 때보다 약 190만 원이 많아요.","start":413.499,"end":416.137},{"n":84,"part":"이미 지역가입자가 되었다면","text":
