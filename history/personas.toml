#   같은 날 '주식만'으로 줄이며 지웠던 v1.0 을 그대로 되살림 — 커밋 4e5f0838). 값 바꾸지 않음.
# (v1.0 — 2026-10-28 — 새로 (사용자 지시 2026-10-28 "시청자 페르소나 파일 생성하도록 해").)
#   묶음(stage) = 보는 사람의 처지(학생·부모·듣는 직장인·옛일을 기억하는 어르신·역사 애호가) · 처지(state) = 보는 때·까닭.
#   한국어 댓글만. 역사 댓글은 나이를 밝히는 일이 드묾(약 0.2%) → 나이 칸은 '밝힌 사람' 기준으로만 읽는다.
#   감사 2026-10-28 (audit 무작위 — Claude 가 읽음): 나이 느슨한 규칙 6/12 → 엄격(AGE_STRICT) 약 15/20 · '옛일을 기억하는 6070' 10/12 · '듣는 사람' 10/12 · '학생'은 나이 범위를 빼기 전 4/12 (반려동물·역사 인물 나이).

[personas]
VERSION = "v1.1"
RECENT_DAYS = 180
LANGS = ["한국어"]
MIN_SHARE = 0.08
COVER = 0.80
MIN_PERSONAS = 2
MAX_PERSONAS = 6
MIN_N = 30
NEED_SELF = true
AGE_STRICT = true    # 역사 댓글의 나이는 대개 역사 인물·남의 나이 (v1.0 감사: 느슨한 규칙은 12개 중 6개만 맞음) → 자기소개 꼴만
