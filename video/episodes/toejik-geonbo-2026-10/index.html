t":"예시 부부의 조건","text":"과세표준은 재산세를 매기는 금액인데, 이 집은 공시가격으로 5억에서 7억 원쯤이에요.","start":71.66,"end":77.26},{"n":19,"part":"예시 부부의 조건","text":"예금 이자는 1년에 1,000만 원이 안 되고, 국민연금은 아직 받지 않아요.","start":77.71,"end":82.29},{"n":20,"part":"예시 부부의 조건","text":"아들은 회사에 다니는 직장가입자입니다.","start":82.74,"end":84.9},{"n":21,"part":"예시 부부의 조건","text":"고를 수 있는 길은 세 가지입니다.","start":85.35,"end":87.27},{"n":22,"part":"예시 부부의 조건","text":"아들의 피부양자, 직장 건강보험을 이어 가는 임의계속가입, 그리고 따로 내는 지역가입자예요.","start":87.72,"end":93.83},{"n":23,"part":"예시 부부의 조건","text":"어느 쪽이 나은지는 세 가지 원칙으로 정해집니다.","start":94.28,"end":96.9},{"n":24,"part":"예시 부부의 조건","text":"하나씩 보겠습니다.","start":97.35,"end":98.58},{"n":25,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"첫 번째 원칙은, 피부양자가 되면 건보료를 한 푼도 내지 않는다는 것입니다.","start":99.58,"end":104.3},{"n":26,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"직장에 다니는 자녀나 배우자의 건강보험에 함께 올라가는 거예요.","start":104.75,"end":108.74},{"n":27,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"피부양자 소득 기준은 1년에 2,000만 원 이하이고, 국민연금은 전부 소득에 들어갑니다.","start":109.19,"end":114.55},{"n":28,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"피부양자 재산 기준은 과세표준 5억 4천만 원 이하입니다.","start":115,"end":118.74},{"n":29,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"과세표준이 5억 4천만 원을 넘고 9억 원 이하라면, 소득이 1년에 1,000만 원 이하여야 합니다.","start":119.19,"end":125.03},{"n":30,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"예를 들어 과세표준이 6억 원이어도, 소득이 1년에 900만 원이면 됩니다.","start":125.48,"end":129.89},{"n":31,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"소득 기준 2,000만 원은 부부가 둘 다 지켜야 해서, 한 사람이 넘으면 둘 다 안 됩니다.","start":130.34,"end":135.7},{"n":32,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"예시 부부는 소득이 없고 과세표준도 3억 원이라서, 둘 다 아들의 피부양자가 될 수 있습니다.","start":136.15,"end":141.75},{"n":33,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"신고는 아들이 하는데, 퇴직하고 90일 안에 하면 퇴직한 다음 날부터 인정됩니다.","start":142.2,"end":147.64},{"n":34,"part":"원칙 하나, 피부양자가 되면 건보료 0원","text":"한마디로, 직장에 다니는 가족이 있다면 피부양자부터 확인하세요.","start":148.09,"end":152.01},{"n":35,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"두 번째 원칙은, 임의계속가입은 월급으로, 지역 보험료는 소득과 집으로 매긴다는 것입니다.","start":153.01,"end":158.76},{"n":36,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"임의계속가입은 퇴직한 다음 날부터 최대 36개월 동안 직장가입자로 남는 제도입니다.","start":159.21,"end":164.64},{"n":37,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"퇴직 전 18개월 가운데 직장가입자였던 기간이 합쳐서 1년 이상이면 신청할 수 있습니다.","start":165.09,"end":170.53},{"n":38,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"보험료는 퇴직 전 12개월 평균 월급으로 매기고, 회사 몫까지 혼자 내지만 절반을 깎아 줍니다.","start":170.98,"end":177.25},{"n":39,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"그래서 월급에서 빠지던 내 몫과 같고, 예시 남편은 한 달에 약 18만 원이에요.","start":177.7,"end":182.94},{"n":40,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"아내는 남편의 피부양자로 올릴 수 있어요.","start":183.39,"end":185.63},{"n":41,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"반대로 지역 보험료는 월급과 상관없이 소득과 집에 붙습니다.","start":186.08,"end":189.91},{"n":42,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"집은 과세표준에서 1억 원을 빼고, 남은 금액으로 점수를 매깁니다.","start":190.36,"end":194.52},{"n":43,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"예시 부부는 3억 원에서 1억 원을 빼면 2억 원입니다.","start":194.97,"end":198.46},{"n":44,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"이 집에만 한 달 약 12만 4천 원이 붙어요.","start":198.91,"end":201.65},{"n":45,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"소득이 거의 없어도 소득 몫으로 약 2만 원을 내서, 합치면 약 14만 4천 원입니다.","start":202.1,"end":207.22},{"n":46,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"임의계속이 무조건 싸다고 생각하시는 분이 많은데, 꼭 그렇지 않습니다.","start":207.67,"end":212.05},{"n":47,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"월급이 같아도 과세표준이 6억 원이면, 지역이 약 19만 2천 원으로 더 비싸요.","start":212.5,"end":217.92},{"n":48,"part":"원칙 둘, 임의계속은 월급으로, 지역은 집으로","text":"한마디로, 퇴직 전 내 몫 건보료와 지역 보험료를 나란히 놓고 싼 쪽을 고르세요.","start":218.37,"end":223.04},{"n":49,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"세 번째 원칙은, 지역 보험료의 소득은 늦게 잡히고, 임의계속은 신청 기한이 짧다는 것입니다.","start":224.04,"end":230.34},{"n":50,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"지역 보험료의 소득은 올해 소득이 아니라, 고지 시점에 따라 1년이나 2년 전 소득입니다.","start":230.79,"end":235.84},{"n":51,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그래서 퇴직 직후에는 이미 끊긴 월급이 소득으로 잡힙니다.","start":236.29,"end":239.73},{"n":52,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이때 월급은 절반만 소득으로 봅니다.","start":240.18,"end":242.33},{"n":53,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"예시 남편은 연봉 6,000만 원의 절반인 3,000만 원이 잡혀요.","start":242.78,"end":246.48},{"n":54,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"집까지 합치면 한 달 약 30만 원이고, 이 금액이 처음 13개월 동안 나옵니다.","start":246.93,"end":251.65},{"n":55,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그다음 1년은 올해 9개월치 월급이 잡혀 약 26만 원이에요.","start":252.1,"end":256.39},{"n":56,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이럴 때는 건강보험공단에 퇴직을 증명하고, 끊긴 월급을 빼 달라고 소득 조정을 신청하세요.","start":256.84,"end":262.83},{"n":57,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"피부양자 신고 때 끊긴 월급 때문에 안 되면, 이 조정부터 신청하세요.","start":263.28,"end":268},{"n":58,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"또 하나는 기한입니다.","start":268.45,"end":269.66},{"n":59,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"임의계속가입은 늦어도 첫 지역 고지서의 납부기한 2개월 뒤까지 신청해야 합니다.","start":270.11,"end":275.18},{"n":60,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"예를 들어 첫 고지서의 납부기한이 11월 10일이라면, 1월 10일까지 신청하세요.","start":275.63,"end":280.91},{"n":61,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"이 기한이 지나면 신청할 수 없지만, 가입한 뒤 그만두는 건 언제든 됩니다.","start":281.36,"end":286.16},{"n":62,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"한마디로, 첫 고지서를 받으면 금액부터 보고 임의계속은 2개월 안에 정하세요.","start":286.61,"end":291.88},{"n":63,"part":"원칙 셋, 소득은 늦게 잡히고 신청 기한은 짧다","text":"그럼 이 세 가지 원칙으로 고르는 순서를 정해 보겠습니다.","start":292.33,"end":295.33},{"n":64,"part":"고르는 순서, 피부양자부터","text":"1단계, 퇴직하고 90일 안에 가족의 피부양자가 되는지 보고 신고합니다.","start":296.33,"end":301.88},{"n":65,"part":"고르는 순서, 피부양자부터","text":"피부양자가 되면 여기서 끝이에요.","start":302.33,"end":304.18},{"n":66,"part":"고르는 순서, 피부양자부터","text":"2단계, 안 되면 첫 지역 고지서를 받는 대로 퇴직을 증명해 소득 조정을 신청합니다.","start":304.63,"end":309.99},{"n":67,"part":"고르는 순서, 피부양자부터","text":"3단계, 조정한 지역 보험료가 내 몫 건보료보다 비싸면, 기한 안에 임의계속가입을 신청합니다.","start":310.44,"end":317.32},{"n":68,"part":"고르는 순서, 피부양자부터","text":"이렇게 고르면 예시 부부의 건보료는 얼마나 달라질까요?","start":317.77,"end":321.37},{"n":69,"part":"예시 부부의 결과","text":"예시 부부의 한 달 건보료는 피부양자가 되면 0원입니다.","start":322.37,"end":325.4},{"n":70,"part":"예시 부부의 결과","text":"조정한 지역은 약 14만 4천 원, 임의계속은 약 18만 원이에요.","start":325.85,"end":329.88},{"n":71,"part":"예시 부부의 결과","text":"3년, 36개월을 합치면 아무 신청도 안 했을 때가 약 860만 원입니다.","start":330.33,"end":336.1},{"n":72,"part":"예시 부부의 결과","text":"임의계속은 약 650만 원, 조정한 지역은 약 520만 원이에요.","start":336.55,"end":341.67},{"n":73,"part":"예시 부부의 결과","text":"앞에서 말한 건보료에는 장기요양보험료를 넣지 않았습니다.","start":342.12,"end":345.96},{"n":74,"part":"예시 부부의 결과","text":"이 부부는 집에 비해 월급이 높아서, 지역이 임의계속보다 한 달에 약 3만 6천 원 쌉니다.","start":346.41,"end":352.62},{"n":75,"part":"예시 부부의 결과","text":"같은 집에 월급이 400만 원이면 둘이 비슷하고, 그보다 낮으면 임의계속이 쌉니다.","start":353.07,"end":357.82},{"n":76,"part":"예시 부부의 결과","text":"그런데 이미 지역 보험료를 내고 계신 분들도 계실 텐데요.","start":358.27,"end":361.33},{"n":77,"part":"예시 부부의 결과","text":"그럼 어떻게 해야 할까요?","start":361.78,"end":363.11},{"n":78,"part":"이미 지역가입자가 되었다면","text":"늦지 않았습니다.","start":364.11,"end":365.06},{"n":79,"part":"이미 지역가입자가 되었다면","text":"첫째, 고지서에 끊긴 월급이 잡혀 있다면, 지금이라도 소득 조정을 신청하세요.","start":365.51,"end":370.67},{"n":80,"part":"이미 지역가입자가 되었다면","text":"조정은 신청한 뒤 보험료부터 줄어서, 늦을수록 덜 줄어요.","start":371.12,"end":375.25},{"n":81,"part":"이미 지역가입자가 되었다면","text":"예시 부부가 1년 늦게 조정하면, 3년 동안 약 710만 원을 냅니다.","start":375.7,"end":380.1},{"n":82,"part":"이미 지역가입자가 되었다면","text":"바로 할 때보다 약 190만 원을 더 내요.","start":380.55,"end":383.64},{"n":83,"part":"이미 지역가입자가 되었다면","text":"둘째, 첫 고지서 납부기한 2개월 뒤가 아직 안 지났다면, 임의계속가입도 신청할 수 있습니다.","start":384.09,"end":390.41},{"n":84,"part":"이미 지역가입자가 되었다면","text":"셋째, 그 기한이 지났어도 피부양자 신고는 할 수 있습니다.","start":390.86,"end":394.73},{"n":85,"part":"이미 지역가입자가 되었다면","text":"다만 퇴직하고 90일이 지나면 신고한 날부터 인정되니, 하루라도 빨리 하세요.","start":395.18,"end":399.82},{"n":86,"part":"이미 지역가입자가 되었다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":400.27,"end":403.24},{"n":87,"part":"정리, 바뀌어도 그대로인 것","text":"보험료율과 피부양자 기준 금액, 임의계속 할인 비율은 앞으로 바뀔 수 있습니다.","start":404.24,"end":408.54},{"n":88,"part":"정리, 바뀌어도 그대로인 것","text":"그래도 이 세 가지는 그대로입니다.","start":408.99,"end":410.88},{"n":89,"part":"정리, 바뀌어도 그대로인 것","text":"첫째, 피부양자가 되면 0원이니, 퇴직하고 90일 안에 먼저 확인하세요.","start":411.33,"end":416.13},{"n":90,"part":"정리, 바뀌어도 그대로인 것","text":"둘째, 임의계속은 월급으로, 지역은 소득과 집으로 매기니, 두 금액을 비교하세요.","start":416.58,"end":422.06},{"n":91,"part":"정리, 바뀌어도 그대로인 것","text":"셋째, 끊긴 월급은 조정으로 빼고, 임의계속은 2개월 안에 정하세요.","start":422.51,"end":427.09},{"n":92,"part":"정리, 바뀌어도 그대로인 것","text":"오늘 급여명세서에서 매달 빠지는 건보료부터 확인해 보세요.","start":427.54,"end":431.23},{"n":93,"part":"정리, 바뀌어도 그대로인 것","text":"시청해주셔서 감사합니다.","start":431.68,"end":433.23}],"subs":[[0.2,3.42,"퇴직을 앞두고 계시다면, 이 숫자부터 보세요."],[3.42,10.27,"남편이 60세에 퇴직한 한 부부가 아무 신청도 안 하면,\n건보료가 처음 1년 넘게 한 달 약 30만 원입니다."],[10.27,13.52,"같은 부부가 자녀의 피부양자가 되면 0원입니다."],[13.52,15.31,"왜 이렇게 차이가 날까요?"],[15.31,22.05,"퇴직하면 저절로 따로 내는 지역가입자가 되는데,\n보험료에 끊긴 월급과 집이 잡히기 때문입니다."],[22.05,26.67,"아무 신청도 안 하면 퇴직 후 3년 동안 약 860만 원을 냅니다."],[26.67,28.94,"결론부터 말씀드리겠습니다."],[28.94,32.04,"먼저 자녀의 피부양자가 되는지 본다."],[32.04,39.21,"안 되면 건강보험공단에 끊긴 월급부터 빼 달라고 하고,\n지역 보험료와 퇴직 전에 내던 건보료 중 싼 쪽을 고른다."],[39.21,43.56,"고르는 건 늦어도 첫 지역 고지서의 납부기한 2개월 뒤까지 끝낸다."],[43.56,45.03,"이 세 가지입니다."],[45.03,48.59,"이미 지역 보험료를 내는 분이 할 일도 끝까지 보여드릴게요."],[48.59,51.99,"먼저 예시 부부의 경우를 통해 알아보겠습니다."],[51.99,56.3,"남편은 60세이고, 올해 9월 30일에 정년퇴직했습니다."],[56.3,62.43,"퇴직 전 1년 평균 월급은 500만 원이었고,\n건보료로 매달 약 18만 원이 빠졌어요."],[62.43,66.75,"아내도 60세이고, 소득 없이 남편의 피부양자였습니다."],[66.75,71.66,"집은 남편 이름의 아파트 한 채이고, 재산세 과세표준이 3억 원입니다."],[71.66,77.71,"과세표준은 재산세를 매기는 금액인데,\n이 집은 공시가격으로 5억에서 7억 원쯤이에요."],[77.71,82.74,"예금 이자는 1년에 1,000만 원이 안 되고,\n국민연금은 아직 받지 않아요."],[82.74,85.35,"아들은 회사에 다니는 직장가입자입니다."],[85.35,87.72,"고를 수 있는 길은 세 가지입니다."],[87.72,94.28,"아들의 피부양자, 직장 건강보험을 이어 가는 임의계속가입,\n그리고 따로 내는 지역가입자예요."],[94.28,97.35,"어느 쪽이 나은지는 세 가지 원칙으로 정해집니다."],[97.35,99.58,"하나씩 보겠습니다."],[99.58,104.75,"첫 번째 원칙은,\n피부양자가 되면 건보료를 한 푼도 내지 않는다는 것입니다."],[104.75,109.19,"직장에 다니는 자녀나 배우자의 건강보험에 함께 올라가는 거예요."],[109.19,115,"피부양자 소득 기준은 1년에 2,000만 원 이하이고,\n국민연금은 전부 소득에 들어갑니다."],[115,119.19,"피부양자 재산 기준은 과세표준 5억 4천만 원 이하입니다."],[119.19,125.48,"과세표준이 5억 4천만 원을 넘고 9억 원 이하라면,\n소득이 1년에 1,000만 원 이하여야 합니다."],[125.48,130.34,"예를 들어 과세표준이 6억 원이어도,\n소득이 1년에 900만 원이면 됩니다."],[130.34,136.15,"소득 기준 2,000만 원은 부부가 둘 다 지켜야 해서,\n한 사람이 넘으면 둘 다 안 됩니다."],[136.15,142.2,"예시 부부는 소득이 없고 과세표준도 3억 원이라서,\n둘 다 아들의 피부양자가 될 수 있습니다."],[142.2,148.09,"신고는 아들이 하는데,\n퇴직하고 90일 안에 하면 퇴직한 다음 날부터 인정됩니다."],[148.09,153.01,"한마디로, 직장에 다니는 가족이 있다면 피부양자부터 확인하세요."],[153.01,159.21,"두 번째 원칙은, 임의계속가입은 월급으로,\n지역 보험료는 소득과 집으로 매긴다는 것입니다."],[159.21,165.09,"임의계속가입은 퇴직한 다음 날부터\n최대 36개월 동안 직장가입자로 남는 제도입니다."],[165.09,170.98,"퇴직 전 18개월 가운데 직장가입자였던 기간이 합쳐서\n1년 이상이면 신청할 수 있습니다."],[170.98,177.7,"보험료는 퇴직 전 12개월 평균 월급으로 매기고,\n회사 몫까지 혼자 내지만 절반을 깎아 줍니다."],[177.7,183.39,"그래서 월급에서 빠지던 내 몫과 같고,\n예시 남편은 한 달에 약 18만 원이에요."],[183.39,186.08,"아내는 남편의 피부양자로 올릴 수 있어요."],[186.08,190.36,"반대로 지역 보험료는 월급과 상관없이 소득과 집에 붙습니다."],[190.36,194.97,"집은 과세표준에서 1억 원을 빼고, 남은 금액으로 점수를 매깁니다."],[194.97,198.91,"예시 부부는 3억 원에서 1억 원을 빼면 2억 원입니다."],[198.91,202.1,"이 집에만 한 달 약 12만 4천 원이 붙어요."],[202.1,207.67,"소득이 거의 없어도 소득 몫으로 약 2만 원을 내서,\n합치면 약 14만 4천 원입니다."],[207.67,212.5,"임의계속이 무조건 싸다고 생각하시는 분이 많은데,\n꼭 그렇지 않습니다."],[212.5,218.37,"월급이 같아도 과세표준이 6억 원이면,\n지역이 약 19만 2천 원으로 더 비싸요."],[218.37,224.04,"한마디로,\n퇴직 전 내 몫 건보료와 지역 보험료를 나란히 놓고 싼 쪽을 고르세요."],[224.04,230.79,"세 번째 원칙은, 지역 보험료의 소득은 늦게 잡히고,\n임의계속은 신청 기한이 짧다는 것입니다."],[230.79,236.29,"지역 보험료의 소득은 올해 소득이 아니라,\n고지 시점에 따라 1년이나 2년 전 소득입니다."],[236.29,240.18,"그래서 퇴직 직후에는 이미 끊긴 월급이 소득으로 잡힙니다."],[240.18,242.78,"이때 월급은 절반만 소득으로 봅니다."],[242.78,246.93,"예시 남편은 연봉 6,000만 원의 절반인 3,000만 원이 잡혀요."],[246.93,252.1,"집까지 합치면 한 달 약 30만 원이고,\n이 금액이 처음 13개월 동안 나옵니다."],[252.1,256.84,"그다음 1년은 올해 9개월치 월급이 잡혀 약 26만 원이에요."],[256.84,263.28,"이럴 때는 건강보험공단에 퇴직을 증명하고,\n끊긴 월급을 빼 달라고 소득 조정을 신청하세요."],[263.28,268.45,"피부양자 신고 때 끊긴 월급 때문에 안 되면, 이 조정부터 신청하세요."],[268.45,270.11,"또 하나는 기한입니다."],[270.11,275.63,"임의계속가입은 늦어도\n첫 지역 고지서의 납부기한 2개월 뒤까지 신청해야 합니다."],[275.63,281.36,"예를 들어 첫 고지서의 납부기한이 11월 10일이라면,\n1월 10일까지 신청하세요."],[281.36,286.61,"이 기한이 지나면 신청할 수 없지만,\n가입한 뒤 그만두는 건 언제든 됩니다."],[286.61,292.33,"한마디로, 첫 고지서를 받으면 금액부터 보고\n임의계속은 2개월 안에 정하세요."],[292.33,296.33,"그럼 이 세 가지 원칙으로 고르는 순서를 정해 보겠습니다."],[296.33,302.33,"1단계,\n퇴직하고 90일 안에 가족의 피부양자가 되는지 보고 신고합니다."],[302.33,304.63,"피부양자가 되면 여기서 끝이에요."],[304.63,310.44,"2단계, 안 되면 첫 지역 고지서를 받는 대로\n퇴직을 증명해 소득 조정을 신청합니다."],[310.44,317.77,"3단계, 조정한 지역 보험료가 내 몫 건보료보다 비싸면,\n기한 안에 임의계속가입을 신청합니다."],[317.77,322.37,"이렇게 고르면 예시 부부의 건보료는 얼마나 달라질까요?"],[322.37,325.85,"예시 부부의 한 달 건보료는 피부양자가 되면 0원입니다."],[325.85,330.33,"조정한 지역은 약 14만 4천 원, 임의계속은 약 18만 원이에요."],[330.33,336.55,"3년, 36개월을 합치면 아무 신청도 안 했을 때가 약 860만 원입니다."],[336.55,342.12,"임의계속은 약 650만 원, 조정한 지역은 약 520만 원이에요."],[342.12,346.41,"앞에서 말한 건보료에는 장기요양보험료를 넣지 않았습니다."],[346.41,353.07,"이 부부는 집에 비해 월급이 높아서,\n지역이 임의계속보다 한 달에 약 3만 6천 원 쌉니다."],[353.07,358.27,"같은 집에 월급이 400만 원이면 둘이 비슷하고,\n그보다 낮으면 임의계속이 쌉니다."],[358.27,361.78,"그런데 이미 지역 보험료를 내고 계신 분들도 계실 텐데요."],[361.78,364.11,"그럼 어떻게 해야 할까요?"],[364.11,365.51,"늦지 않았습니다."],[365.51,371.12,"첫째, 고지서에 끊긴 월급이 잡혀 있다면,\n지금이라도 소득 조정을 신청하세요."],[371.12,375.7,"조정은 신청한 뒤 보험료부터 줄어서, 늦을수록 덜 줄어요."],[375.7,380.55,"예시 부부가 1년 늦게 조정하면, 3년 동안 약 710만 원을 냅니다."],[380.55,384.09,"바로 할 때보다 약 190만 원을 더 내요."],[384.09,390.86,"둘째, 첫 고지서 납부기한 2개월 뒤가 아직 안 지났다면,\n임의계속가입도 신청할 수 있습니다."],[390.86,395.18,"셋째, 그 기한이 지났어도 피부양자 신고는 할 수 있습니다."],[395.18,400.27,"다만 퇴직하고 90일이 지나면 신고한 날부터 인정되니,\n하루라도 빨리 하세요."],[400.27,404.24,"자, 마지막으로 오늘 내용을 정리하겠습니다."],[404.24,408.99,"보험료율과 피부양자 기준 금액,\n임의계속 할인 비율은 앞으로 바뀔 수 있습니다."],[408.99,411.33,"그래도 이 세 가지는 그대로입니다."],[411.33,416.58,"첫째, 피부양자가 되면 0원이니, 퇴직하고 90일 안에 먼저 확인하세요."],[416.58,422.51,"둘째, 임의계속은 월급으로,\n지역은 소득과 집으로 매기니, 두 금액을 비교하세요."],[422.51,427.54,"셋째, 끊긴 월급은 조정으로 빼고, 임의계속은 2개월 안에 정하세요."],[427.54,431.68,"오늘 급여명세서에서 매달 빠지는 건보료부터 확인해 보세요."],[431.68,433.63,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>
