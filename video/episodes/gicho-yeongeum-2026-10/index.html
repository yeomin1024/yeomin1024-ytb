수 없습니다.","start":221.986,"end":228.446},{"n":52,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"한마디로, 국민연금이 많아도 기초연금은 절반까지만 깎입니다.","start":228.896,"end":232.992},{"n":53,"part":"원칙 셋, 신청한 달부터 나온다","text":"세 번째 원칙은, 기초연금은 신청한 달부터 나온다는 것입니다.","start":233.992,"end":237.937},{"n":54,"part":"원칙 셋, 신청한 달부터 나온다","text":"나라에서 알아서 넣어 주지 않고, 본인이나 가족이 신청해야 합니다.","start":238.387,"end":242.634},{"n":55,"part":"원칙 셋, 신청한 달부터 나온다","text":"늦게 신청하면, 지나간 달 몫은 돌려받지 못해요.","start":243.084,"end":246.123},{"n":56,"part":"원칙 셋, 신청한 달부터 나온다","text":"이 부부라면 한 달 늦을 때마다 최소 41만 9,640원이 사라집니다.","start":246.573,"end":251.424},{"n":57,"part":"원칙 셋, 신청한 달부터 나온다","text":"신청은 주민센터나 국민연금공단 지사에서 합니다.","start":251.874,"end":254.965},{"n":58,"part":"원칙 셋, 신청한 달부터 나온다","text":"한마디로, 받을 수 있을지 애매하면 먼저 신청하는 게 낫습니다.","start":255.415,"end":259.36},{"n":59,"part":"원칙 셋, 신청한 달부터 나온다","text":"그럼 이 원칙으로 받을 수 있는지 직접 계산해 보겠습니다.","start":259.81,"end":263.203},{"n":60,"part":"직접 계산하는 세 단계","text":"1단계, 재산을 한 달 소득으로 바꿉니다.","start":264.203,"end":266.789},{"n":61,"part":"직접 계산하는 세 단계","text":"이 부부는 집과 차를 합친 5억 1,000만 원에서 기본재산액 1억 3,500만 원을 뺍니다.","start":267.239,"end":272.793},{"n":62,"part":"직접 계산하는 세 단계","text":"그러면 3억 7,500만 원이 남아요.","start":273.243,"end":275.678},{"n":63,"part":"직접 계산하는 세 단계","text":"예금은 4,000만 원에서 2,000만 원을 빼서, 2,000만 원이 남습니다.","start":276.128,"end":280.823},{"n":64,"part":"직접 계산하는 세 단계","text":"남은 3억 9,500만 원의 4%를 12로 나누면, 한 달 소득으로 약 132만 원이 잡힙니다.","start":281.273,"end":287.733},{"n":65,"part":"직접 계산하는 세 단계","text":"2단계, 한 달 소득을 더합니다.","start":288.183,"end":290.165},{"n":66,"part":"직접 계산하는 세 단계","text":"예금 이자는 한 달 4만 원을 넘는 만큼만 잡힙니다.","start":290.615,"end":293.555},{"n":67,"part":"직접 계산하는 세 단계","text":"이 부부는 이자 약 11만 7천 원 중 7만 7천 원이 잡힙니다.","start":294.005,"end":297.549},{"n":68,"part":"직접 계산하는 세 단계","text":"국민연금 170만 원을 더하면 약 178만 원이에요.","start":297.999,"end":301.392},{"n":69,"part":"직접 계산하는 세 단계","text":"3단계, 두 숫자를 더해서 선정기준액과 비교합니다.","start":301.842,"end":305.183},{"n":70,"part":"직접 계산하는 세 단계","text":"재산 몫 132만 원과 소득 178만 원을 더한 소득인정액은 약 309만 원입니다.","start":305.633,"end":310.989},{"n":71,"part":"직접 계산하는 세 단계","text":"부부 선정기준액 395만 2천 원보다 약 86만 원 낮으니, 두 사람 모두 받을 수 있습니다.","start":311.439,"end":317.498},{"n":72,"part":"직접 계산하는 세 단계","text":"그럼 이 부부는 얼마를 받을까요?","start":317.948,"end":319.831},{"n":73,"part":"이 부부의 결과","text":"부부 감액 20%까지 빼면, 아내는 27만 9,760원, 남편은 최소 13만 9,880원입니다.","start":320.831,"end":328.546},{"n":74,"part":"이 부부의 결과","text":"합쳐서 한 달 최소 41만 9,640원이고, 12개월이면 503만 5,680원이에요.","start":328.996,"end":335.706},{"n":75,"part":"이 부부의 결과","text":"남편 몫은 국민연금 가입 이력에 따라 더 많을 수 있습니다.","start":336.156,"end":339.549},{"n":76,"part":"이 부부의 결과","text":"그럼 집이 더 비싸면 어떨까요?","start":339.999,"end":341.731},{"n":77,"part":"이 부부의 결과","text":"다른 조건이 같다면, 이 부부는 집 공시가격이 약 7억 5천만 원이어도 받을 수 있습니다.","start":342.181,"end":347.636},{"n":78,"part":"이 부부의 결과","text":"다만 기초연금을 받아서 기준 395만 2천 원을 넘게 되면, 넘는 만큼 빼고 줍니다.","start":348.086,"end":353.541},{"n":79,"part":"이 부부의 결과","text":"그럼 이미 떨어졌거나 신청을 안 했다면, 어떻게 해야 할까요?","start":353.991,"end":357.785},{"n":80,"part":"이미 떨어졌거나 신청하지 않았다면","text":"늦지 않았습니다.","start":358.785,"end":359.762},{"n":81,"part":"이미 떨어졌거나 신청하지 않았다면","text":"이번 달에 신청하면, 이번 달부터 받아요.","start":360.212,"end":362.798},{"n":82,"part":"이미 떨어졌거나 신청하지 않았다면","text":"예전에 떨어졌다면, 올해 숫자로 다시 계산해 보세요.","start":363.248,"end":366.589},{"n":83,"part":"이미 떨어졌거나 신청하지 않았다면","text":"혼자 사는 사람의 선정기준액은 작년 228만 원에서 올해 247만 원으로 올랐습니다.","start":367.039,"end":372.999},{"n":84,"part":"이미 떨어졌거나 신청하지 않았다면","text":"결과가 틀렸다고 생각되면, 결과를 안 날부터 90일 안에 이의신청을 할 수 있어요.","start":373.449,"end":378.602},{"n":85,"part":"이미 떨어졌거나 신청하지 않았다면","text":"그리고 떨어졌을 때는, 주민센터에서 수급희망 이력관리를 꼭 신청해 두세요.","start":379.052,"end":383.903},{"n":86,"part":"이미 떨어졌거나 신청하지 않았다면","text":"그러면 5년 동안, 선정기준액이나 내 소득·재산 자료가 바뀔 때마다 다시 확인해 줍니다.","start":384.353,"end":389.808},{"n":87,"part":"이미 떨어졌거나 신청하지 않았다면","text":"2026년 7월 30일부터는, 받을 수 있다고 확인된 날에 신청한 것으로 봐 줍니다.","start":390.258,"end":395.713},{"n":88,"part":"이미 떨어졌거나 신청하지 않았다면","text":"다시 신청하러 가지 않아도, 확인된 그달부터 받는다는 뜻이에요.","start":396.163,"end":400.259},{"n":89,"part":"이미 떨어졌거나 신청하지 않았다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":400.709,"end":403.597},{"n":90,"part":"정리, 바뀌어도 그대로인 것","text":"선정기준액과 기준연금액은 해마다 바뀌고, 부부 감액 20%를 줄이는 안도 논의되고 있습니다.","start":404.597,"end":410.958},{"n":91,"part":"정리, 바뀌어도 그대로인 것","text":"그래도 이 세 가지는 그대로입니다.","start":411.408,"end":413.442},{"n":92,"part":"정리, 바뀌어도 그대로인 것","text":"첫째, 소득인정액은 한 달 소득에 재산의 일부만 더한 숫자입니다.","start":413.892,"end":417.988},{"n":93,"part":"정리, 바뀌어도 그대로인 것","text":"집 한 채가 있다고 미리 포기하지 마세요.","start":418.438,"end":420.774},{"n":94,"part":"정리, 바뀌어도 그대로인 것","text":"둘째, 대상이 되면 국민연금이 많아도 기초연금은 절반까지만 깎입니다.","start":421.224,"end":425.773},{"n":95,"part":"정리, 바뀌어도 그대로인 것","text":"셋째, 기초연금은 신청한 달부터 나옵니다.","start":426.223,"end":428.96},{"n":96,"part":"정리, 바뀌어도 그대로인 것","text":"오늘 우리 집 공시가격과 국민연금으로, 소득인정액부터 계산해 보세요.","start":429.41,"end":433.959},{"n":97,"part":"정리, 바뀌어도 그대로인 것","text":"시청해주셔서 감사합니다.","start":434.409,"end":435.99}],"subs":[[0.3,4.094,"집 한 채에 국민연금까지 받고 계시다면, 이 숫자부터 보세요."],[4.544,8.541,"서울에 공시가격 5억 원 아파트가 있는 67세 부부가 있습니다."],[8.991,11.78,"국민연금은 둘이 합쳐 한 달 170만 원이에요."],[12.23,17.232,"이 부부도 기초연금을 한 달에 최소 41만 9,640원 받을 수 있습니다."],[17.682,18.482,"왜 그럴까요?"],[18.932,24.085,"집값을 그대로 보지 않고,\n소득인정액이라는 한 달 소득으로 바꿔 보기 때문입니다."],[24.535,30.542,"신청하지 않으면 한 달 41만 9,640원씩,\n12개월이면 약 500만 원을 놓칩니다."],[30.992,32.724,"결론부터 말씀드리겠습니다."],[33.174,35.661,"집은 공시가격의 일부만 소득으로 봅니다."],[36.111,39.353,"국민연금이 많아도 기초연금은 절반까지만 깎입니다."],[39.803,41.988,"기초연금은 신청한 달부터 나옵니다."],[42.438,45.326,"직접 계산해 보고, 대상이면 바로 신청하세요."],[45.776,48.716,"이미 떨어지신 분이 할 일도 끝까지 보여드릴게요."],[49.166,51.351,"먼저 이 부부의 형편부터 보겠습니다."],[52.351,55.692,"두 사람은 67세 동갑이고, 서울 아파트에 살아요."],[56.142,59.181,"아파트 공시가격은 5억 원이고, 대출은 없어요."],[59.631,64.279,"차는 10년이 안 된 승용차 한 대이고,\n차량가액은 1,000만 원으로 봤습니다."],[64.729,69.075,"예금은 둘이 합쳐 4,000만 원이고, 금리는 3.5%로 봤어요."],[69.525,74.928,"국민연금은 남편이 한 달 120만 원,\n아내가 50만 원이고, 둘 다 일은 하지 않아요."],[75.378,78.016,"이 정도면 기초연금은 어렵다고 생각하시죠?"],[78.466,80.802,"그런데 답은 세
