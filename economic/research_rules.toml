# tools/content_research.py 규칙 — 재테크(economic) 주제
# VERSION: v1.0 — 2026-10-14 — 최초: 2026-10-14 대화(은퇴 후 꺼내 쓰는 순서 영상)에서 쓴 낱말 규칙을 파일로 (guides/topic_guide.md·title_guide.md·script_guide.md)
# 정규식은 작은따옴표(문자 그대로)로 쓴다. 다른 주제는 이 파일을 복사해 낱말만 바꾼다 (다른 주제 결과를 빌려 쓰지 않음).

# 제목 분석에서 '주제를 좁힌' 비교 집단 — analysis.json 의 theme 이름 그대로
NARROW_THEMES = ["4. 노후·연금", "6. 절세·제도"]

# 시청자 질문 중 '핵심 시청자' 질문: 이 주제 묶음 영상에 달렸거나, 아래 말(나이·은퇴 맥락)이 든 질문
CORE_THEME_PREFIX = "4."
CORE_CONTEXT = '(?:[5-8]\d)\s*(?:세|살)|[5-8]0\s*대|은퇴|퇴직|정년|노후|연금\s?생활|손주'

# 대본 분석에서 따로 보는 묶음 (theme 접두어)
STYLE_THEME_PREFIX = "4."

# 질문 묶음 — 한 질문이 여러 묶음에 들 수 있다. 가장 많이 묻는 묶음(합집합)이 '시청자가 가장 원하는 정보' 후보
[NEED_CLUSTERS]
"연금계좌" = '연금\s?저축|IRP|irp|ISA|isa|세액\s?공제|연금\s?계좌|퇴직\s?연금|퇴직금'
"배당현금" = '배당|ETF|etf|커버드콜|분배금|월\s?배당'
"건보료세금" = '건보료|건강\s?보험|피부양자|세금|종합\s?소득|금융\s?소득|과세'
"생활비" = '노후\s?자금|생활비|얼마\s?(있어야|면|가\s?있어야|정도|필요)|몇\s?억|충분|평균|상위\s?몇'
"국민연금" = '국민\s?연금|노령연금|조기\s?수령|연기\s?연금|추납|임의\s?가입|기초\s?연금'
"주식" = '삼성|하이닉스|종목|주가|코스피|나스닥|S&P|s&p|주식'
"부업" = '부업|일자리|알바|재취업|경비|일\s?하'
"자녀" = '자식|자녀|아들|딸|증여|상속'

# 묶음을 합쳐 볼 때 (예: 꺼내 쓰기 = 연금계좌+배당현금+건보료세금+생활비)
[NEED_UNIONS]
"꺼내 쓰기(연금계좌·배당·건보료·생활비)" = ["연금계좌", "배당현금", "건보료세금", "생활비"]

