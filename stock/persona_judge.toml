# ---------------------------------------------------------------- 제목 특징 (정규식 — 거칠다, 방향만)
[[title_feature]]
name = "권위 인용(대표·교수·박사·존리)"
re = '대표|교수|박사|이사|회계사|펀드매니저|작가|존리|버핏|단장|위원|소장'
[[title_feature]]
name = "두 사람·같은 돈"
re = '두 사람|한 사람|한 명은|같은 (돈|날|1억|원금)|산 사람|넣은 사람'
[[title_feature]]
name = "실제 데이터·백테스트·계산"
re = '백테스트|실제 데이터|데이터|계산|돌려보|뒤져|직접 (비교|계산)|년치'
[[title_feature]]
name = "테스트·퀴즈·자가진단"
re = '테스트|퀴즈|체크리스트|자가 ?진단|맞히|맞춰 ?보'
[[title_feature]]
name = "충격·소름·무서운"
re = '충격|소름|무서|경악|난리|미친|역대급|초유'
[[title_feature]]
name = "종목(삼전·하닉·현대차…)"
re = '삼성전자|하이닉스|삼전|닉스|현대차|아이렌|아이온큐|테슬라|엔비디아|팔란티어'
[[title_feature]]
name = "배당"
re = '배당'
[[title_feature]]
name = "ETF 티커(QLD·TQQQ·SCHD·JEPQ)"
re = 'QLD|TQQQ|SCHD|JEPQ|SOXL|QQQ|슈드|VOO|SPY'
[[title_feature]]
name = "지수 낱말(S&P·나스닥·코스피)"
re = 'S&P|나스닥|코스피|코스닥'
[[title_feature]]
name = "금액(억·만 원)"
re = '\d+ ?(억|만 ?원|천만|백만|조)'
[[title_feature]]
