# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 우주 (space)
# VERSION: v1.0 — 2026-10-09 — 최초 작성: YouTube 자동완성으로 검색 수요를 확인한 검색어 48개
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 형식은 stock/analyzer_config.toml 과 같습니다.
# ▶ 실행:  python youtube_topic_analyzer.py --config space/analyzer_config.toml
#          Windows 실행기: .\run_analyzer.ps1 -Folder space
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#
# 📝 이 주제에서 검색어를 고른 기준
#   ⚠️ '우주' 단독 자동완성 9개 중 우주 과학은 0개다 (우주하마·우주소녀·우주를 줄게·우주떡집 …). '블랙홀'은 노래(아이브·윤하),
#     '우주비행사'는 게임 스킨, '다이슨 구'는 다이슨 드라이기, '스페이스x'는 주식, '빅뱅 이론'은 미국 시트콤이 위에 나온다.
#   → 단독 단어 대신 '우주 미스터리 다큐', '챌린저호 폭발사고'처럼 뜻이 하나로 정해지는 검색어만 넣었다.
#   사연형(사건 → 설명 → 교훈) 영상에 가장 맞는 것은 1번 '사고·실화' 카테고리다.
# =====================================================================================================

[topic]
TOPIC = "우주"                        # 분석 주제 (관련어가 비었을 때의 기본 관련어, 자동완성 씨앗)
PROJECT_FOLDER = "space"                # 결과 폴더 → PC: output/space/result/, GitHub: space/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
# "curated" = 아래 KEYWORD_GROUPS만 검색. 이 주제는 단독 주제어의 자동완성에 무관한 것(채널·노래·게임)이 많아 curated로 둔다.
# "both"로 바꾸면 자동완성 상위 AUTOCOMPLETE_TOP_N개를 더 검색한다 → 그때는 EXCLUDE_KEYWORDS가 걸러 준다.
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = [
  "우주소녀", "우주를 줄게", "우주하마", "우주떡집", "우주메리미", "노래", "게임", "제라스",
  "노틸러스", "케넨", "코르키", "피즈", "티모", "이무진", "아이브", "윤하",
  "다이슨", "관련주", "주가", "공모주", "상장", "이준석", "시트콤", "쉘든",
  "동요", "주니토니",
]   # (autocomplete/both 모드) 자동완성에서 뺄 단어 — 2026-10-09 자동완성에서 확인한 무관한 것
AUTOCOMPLETE_TOP_N = 10

# 🔎 카테고리별 검색어 6개 × 8개 = 48개. 모두 2026-10-09 YouTube 자동완성에 나온 표현이거나, 입력하면 자동완성이 이어지는(검색 수요가 있는) 검색어다.
# 💡 키워드 1개 = 검색 1회(100유닛). 하루 한도를 넘으면 다음 날 실행 때 이어서 수집한다 (검색 결과 7일 캐시).
[KEYWORD_GROUPS]
"1. 우주 사고·실화" = [
  "챌린저호 폭발사고", "챌린저호 원인", "컬럼비아호 폭발사고", "아폴로 13호 사고",
  "아폴로 13호 귀환", "우주비행사 사망", "우주인 사고", "우주 비행 사고",
]
"2. 미스터리·외계 생명체" = [
  "우주 미스터리 다큐", "우주 미스터리 사건", "우주 미스터리 모음", "화성 탐사선이 포착한 수상한 흔적",
  "외계 생명체 존재 가능성", "외계 생명체 징후 발견", "페르미 역설", "우주 공포증",
]
"3. 우주의 크기·끝·탄생" = [
  "우주의 끝은 어디일까", "우주의 크기 비교", "우주의 크기 체감", "우주 탄생 과정",
  "우주 탄생 이전", "우주의 나이와 크기", "블랙홀 생성 원리", "블랙홀 빨려들어가면",
]
"4. 탐사·우주망원경" = [
  "보이저1호 위치", "보이저호 근황", "제임스웹 우주망원경", "화성 탐사 로버",
  "우주 탐사의 역사", "국제우주정거장 생활", "달 착륙 과정", "화성 이주 가능성",
]
"5. 뉴스·위험 (누리호·소행성·우주 쓰레기)" = [
  "누리호 발사", "누리호 해외반응", "소행성 충돌 확률", "소행성 충돌 2032",
  "우주 쓰레기 추락", "우주 쓰레기 문제", "태양계 행성 크기 비교", "태양계 행성 실제 모습",
]
"6. 다큐·수면용 포맷" = [
  "우주 다큐멘터리", "우주 다큐 수면", "우주 다큐멘터리 더빙", "신비한 우주 이야기",
  "우주 신비 소름썰", "우주 다큐 최신", "아폴로 11호 달 착륙 영상", "달 착륙 미공개 영상",
]

[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞인 무관한 영상을 분석·성공사례에서 뺀다 (글자가 '포함'되면 맞는 것으로 봄)
# 판정: ① 제목·태그에 강한 관련어  ② 제목에 약한 관련어 + (설명란 강한 관련어 또는 제목 약한 관련어 2개)  ③ 설명란에 강한 관련어 2번 이상
RELEVANCE_TERMS = [
  "우주", "블랙홀", "태양계", "행성", "소행성", "혜성", "천문", "천체",
  "외계", "우주비행사", "우주인", "우주선", "제임스웹", "허블", "보이저", "아폴로",
  "챌린저호", "컬럼비아호", "누리호", "달 착륙", "광년", "중성자별", "초신성", "은하수",
  "페르미 역설", "화성 탐사", "화성 이주", "NASA",
]
# 약한 관련어 (혼자서는 인정 안 함) — '화성'은 경기 화성시, '나사'는 볼트·너트, '빅뱅'은 가수, '은하'·'성운'은 사람 이름, '스페이스X'는 주식 영상에도 쓰인다. '달'은 '달러·한달'에 걸려서 아예 넣지 않았다.
RELEVANCE_WEAK_TERMS = [
  "화성", "로켓", "나사", "스페이스X", "빅뱅", "은하", "성운", "망원경", "탐사", "다큐",
  "미스터리", "지구",
]
# 관련어를 품고 있지만 무관한 표현 — 판정 전에 지운다
RELEVANCE_EXCLUDE = [
  "우주소녀", "우주를 줄게", "우주하마", "우주 하마", "우주떡집", "우주메리미", "소우주", "우주최강",
  "우주 최강", "우주대스타", "우주 대스타", "로켓배송", "보이저스 오브 네라", "보이저엑스", "화성시",
]

[ads]
# 📢 광고로 조회수를 산 것으로 의심되는 영상 제외 (조회수 많은데 좋아요·댓글이 거의 없음). 값은 주식 데이터 기준 — 광고 영상은 적은 편이다. 대신 해외 다큐 무단 재업로드 채널이 성공사례에 섞일 수 있으니 리포트에서 채널을 확인한다.
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# (선택) 기본값을 바꿀 때만 '#'을 지우고 고친다. 전체 목록은 stock/analyzer_config.toml [advanced] 참고
# ANALYSIS_DAYS = 365
# QUOTA_BUDGET = 9000
