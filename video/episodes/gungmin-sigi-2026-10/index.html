물었습니다.","start":68.31,"end":71.5},{"n":19,"part":"원래대로 돌아올 줄 알았다","text":"너, 그거 평생 30% 깎이는 거 알고 신청했어?","start":71.95,"end":75.27},{"n":20,"part":"원래대로 돌아올 줄 알았다","text":"친구 말이 맞았습니다.","start":75.72,"end":76.96},{"n":21,"part":"원래대로 돌아올 줄 알았다","text":"당겨 받은 비율은 64세가 돼도, 80세가 돼도 그대로입니다.","start":77.41,"end":81.44},{"n":22,"part":"원래대로 돌아올 줄 알았다","text":"그 뒤로는 63만 원에서 물가만큼만 오릅니다.","start":81.89,"end":84.77},{"n":23,"part":"원래대로 돌아올 줄 알았다","text":"집에 온 김 씨는 계산기를 꺼냈어요.","start":85.22,"end":87.19},{"n":24,"part":"원래대로 돌아올 줄 알았다","text":"84세까지 20년 동안, 매달 27만 원씩 덜 받으면 6,480만 원입니다.","start":87.64,"end":93.11},{"n":25,"part":"원래대로 돌아올 줄 알았다","text":"신청서 한 장에 6,480만 원이 날아간 거예요.","start":93.56,"end":96.76},{"n":26,"part":"원래대로 돌아올 줄 알았다","text":"그런데 이 숫자를 본 아들이, 고개를 갸웃했습니다.","start":97.21,"end":100.49},{"n":27,"part":"원래대로 돌아올 줄 알았다","text":"아빠, 이거 반만 계산하신 것 같은데요?","start":100.94,"end":103.65},{"n":28,"part":"아들이 찾은 구멍","text":"아들이 짚은 건, 김 씨가 이미 받고 있는 돈이었습니다.","start":104.65,"end":108.14},{"n":29,"part":"아들이 찾은 구멍","text":"김 씨는 59세부터 5년 동안, 남들보다 먼저 연금을 받습니다.","start":108.59,"end":113.11},{"n":30,"part":"아들이 찾은 구멍","text":"월 63만 원씩 60개월이면, 3,780만 원이에요.","start":113.56,"end":117.78},{"n":31,"part":"아들이 찾은 구멍","text":"공정하게 비교하려면, 이 돈도 같이 세야 합니다.","start":118.23,"end":121.19},{"n":32,"part":"아들이 찾은 구멍","text":"두 사람은 5년 당긴 경우와, 64세에 제때 받는 경우를 나란히 놓았습니다.","start":121.64,"end":126.44},{"n":33,"part":"아들이 찾은 구멍","text":"국민연금법의 비율로, 금액은 모두 지금 돈 가치로 계산했어요.","start":126.89,"end":130.73},{"n":34,"part":"아들이 찾은 구멍","text":"64세부터는 제때 받는 쪽이 매달 27만 원씩 더 받습니다.","start":131.18,"end":135.05},{"n":35,"part":"아들이 찾은 구멍","text":"그만큼, 김 씨가 먼저 받은 3,780만 원의 차이가 줄어들어요.","start":135.5,"end":139.67},{"n":36,"part":"아들이 찾은 구멍","text":"다 따라잡히는 데 11년 8개월이 걸립니다.","start":140.12,"end":142.6},{"n":37,"part":"아들이 찾은 구멍","text":"김 씨가 75세 8개월이 되는 때예요.","start":143.05,"end":145.42},{"n":38,"part":"아들이 찾은 구멍","text":"그 전에 세상을 떠나면, 오히려 일찍 받은 김 씨가 이득입니다.","start":145.87,"end":149.25},{"n":39,"part":"아들이 찾은 구멍","text":"김 씨가 걱정한 84세까지로 다시 셈해 봤어요.","start":149.7,"end":152.65},{"n":40,"part":"아들이 찾은 구멍","text":"손해는 6,480만 원이 아니라 2,700만 원이었습니다.","start":153.1,"end":157.02},{"n":41,"part":"아들이 찾은 구멍","text":"아들이 한 가지를 더 찾아냈습니다.","start":157.47,"end":159.6},{"n":42,"part":"아들이 찾은 구멍","text":"이 기준은 연금이 얼마든, 몇 년을 당기든 똑같다는 겁니다.","start":160.05,"end":163.62},{"n":43,"part":"아들이 찾은 구멍","text":"받기 시작하고 16년 8개월이 지나야, 그때부터 손해가 됩니다.","start":164.07,"end":167.91},{"n":44,"part":"아들이 찾은 구멍","text":"한마디로, 평생 손해인지는 몇 살까지 사느냐에 달려 있습니다.","start":168.36,"end":172.3},{"n":45,"part":"아들이 찾은 구멍","text":"조금 마음이 놓인 김 씨에게, 친구가 한 말이 하나 더 남아 있었습니다.","start":172.75,"end":177.01},{"n":46,"part":"아들이 찾은 구멍","text":"연금 받으면, 건보료 폭탄 맞는다더라.","start":177.46,"end":180.18},{"n":47,"part":"건보료 폭탄의 정체","text":"김 씨는 퇴직하면서 회사 건강보험에서 나와, 지역가입자가 됐습니다.","start":181.18,"end":185.22},{"n":48,"part":"건보료 폭탄의 정체","text":"아들은 아직 취업을 준비하고 있어서, 피부양자로 들어갈 곳도 없었죠.","start":185.67,"end":190.38},{"n":49,"part":"건보료 폭탄의 정체","text":"두 사람은 건보료가 어떻게 매겨지는지부터 찾아봤어요.","start":190.83,"end":194.51},{"n":50,"part":"건보료 폭탄의 정체","text":"지역가입자 건보료는 소득 몫과 재산 몫을 더해서 냅니다.","start":194.96,"end":198.55},{"n":51,"part":"건보료 폭탄의 정체","text":"집 같은 재산 몫은, 연금을 언제 받든 똑같습니다.","start":199,"end":202.23},{"n":52,"part":"건보료 폭탄의 정체","text":"달라지는 건 소득 몫뿐이에요.","start":202.68,"end":204.44},{"n":53,"part":"건보료 폭탄의 정체","text":"그리고 국민연금은, 이 소득 몫에 절반만 잡힙니다.","start":204.89,"end":208.38},{"n":54,"part":"건보료 폭탄의 정체","text":"1년 756만 원 가운데, 378만 원만 소득이 되는 거죠.","start":208.83,"end":213.55},{"n":55,"part":"건보료 폭탄의 정체","text":"그런데 연금이 없을 때도, 소득 몫에는 최저 금액 월 2만 160원이 붙어 있었습니다.","start":214,"end":219.4},{"n":56,"part":"건보료 폭탄의 정체","text":"연금을 받은 뒤 김 씨의 소득 몫은 2만 2,640원입니다.","start":219.85,"end":223.69},{"n":57,"part":"건보료 폭탄의 정체","text":"장기요양보험료까지 더해도, 연금 때문에 늘어난 건보료는 한 달에 2,810원이었어요.","start":224.14,"end":229.94},{"n":58,"part":"건보료 폭탄의 정체","text":"아들이 취업해 아들의 피부양자가 되면, 이마저도 0원입니다.","start":230.39,"end":234.1},{"n":59,"part":"건보료 폭탄의 정체","text":"연금이 1년 756만 원이라, 피부양자 소득 기준 2,000만 원보다 적기 때문이에요.","start":234.55,"end":239.74},{"n":60,"part":"건보료 폭탄의 정체","text":"건보료율과 최저 금액은 해마다 바뀌지만, 연금이 절반만 잡히는 규칙은 그대로입니다.","start":240.19,"end":245.38},{"n":61,"part":"건보료 폭탄의 정체","text":"건보료 폭탄은, 김 씨의 연금 이야기가 아니었습니다.","start":245.83,"end":249.11},{"n":62,"part":"건보료 폭탄의 정체","text":"그렇다면 김 씨를 손해 보게 만든 진짜 범인은, 도대체 뭘까요?","start":249.56,"end":253.12},{"n":63,"part":"건보료 폭탄의 정체","text":"답은 같은 해에 퇴직한, 동창 박 씨의 통장에 있었습니다.","start":253.57,"end":257.06},{"n":64,"part":"동창 박 씨의 통장","text":"박 씨도 1966년생이고, 64세부터 받을 연금도 김 씨와 같은 월 90만 원입니다.","start":258.06,"end":264.23},{"n":65,"part":"동창 박 씨의 통장","text":"박 씨도 59세에 퇴직했어요.","start":264.68,"end":266.43},{"n":66,"part":"동창 박 씨의 통장","text":"그런데 박 씨는 연금을 바로 신청하지 않았습니다.","start":266.88,"end":269.63},{"n":67,"part":"동창 박 씨의 통장","text":"퇴직금에서 매달 63만 원씩, 3년을 꺼내 썼거든요.","start":270.08,"end":273.99},{"n":68,"part":"동창 박 씨의 통장","text":"김 씨가 받은 연금과 같은 금액이라, 두 사람의 생활비는 똑같습니다.","start":274.44,"end":278.68},{"n":69,"part":"동창 박 씨의 통장","text":"3년이면 2,268만 원이에요.","start":279.13,"end":281.18},{"n":70,"part":"동창 박 씨의 통장","text":"그리고 62세에, 2년만 당겨 신청했습니다.","start":281.63,"end":284.35},{"n":71,"part":"동창 박 씨의 통장","text":"12%만 덜 받아서, 월 79만 2천 원입니다.","start":284.8,"end":288.16},{"n":72,"part":"동창 박 씨의 통장","text":"김 씨보다 매달 16만 2천 원 많아요.","start":288.61,"end":290.95},{"n":73,"part":"동창 박 씨의 통장","text":"85세까지 계산하면, 박 씨가 받는 국민연금이 김 씨보다 2,203만 원 더 많습니다.","start":291.4,"end":297.41},{"n":74,"part":"동창 박 씨의 통장","text":"73세 8개월이 지나면, 그때부터 박 씨가 앞서기 시작하는 거예요.","start":297.86,"end":301.94},{"n":75,"part":"동창 박 씨의 통장","text":"두 사람을 가른 건 신청서가 아니었습니다.","start":302.39,"end":304.55},{"n":76,"part":"동창 박 씨의 통장","text":"퇴직하기 전에, 받는 나이까지 버틸 돈을 정해 뒀느냐였습니다.","start":305,"end":308.72},{"n":77,"part":"동창 박 씨의 통장","text":"한마디로, 연금을 얼마나 당길지는 버틸 돈이 정합니다.","start":309.17,"end":312.53},{"n":78,"part":"동창 박 씨의 통장","text":"1년을 덜 당길 때마다, 평생 덜 받는 비율이 6%씩 줄어들어요.","start":312.98,"end":317.37},{"n":79,"part":"동창 박 씨의 통장","text":"이 사실을 안 김 씨는, 마지막으로 국민연금공단을 찾아갔습니다.","start":317.82,"end":321.83},{"n":80,"part":"동창 박 씨의 통장","text":"이미 낸 신청서, 정말 되돌릴 방법이 없을까요?","start":322.28,"end":325.51},{"n":81,"part":"공단 창구에서 들은 말","text":"상담 직원의 대답은 뜻밖이었습니다.","start":326.51,"end":328.43},{"n":82,"part":"공단 창구에서 들은 말","text":"원래 받을 나이 전이라면, 연금을 멈출 수 있다는 거예요.","start":328.88,"end":332.12},{"n":83,"part":"공단 창구에서 들은 말","text":"지급 정지를 신청하면, 연금은 원래 받을 나이인 64세에 다시 나옵니다.","start":332.57,"end":336.89},{"n":84,"part":"공단 창구에서 들은 말","text":"이때는 이미 받은 달 수만큼만, 한 달에 0.5%씩 깎습니다.","start":337.34,"end":341.78},{"n":85,"part":"공단 창구에서 들은 말","text":"김 씨는 1년을 받았으니, 6%만 덜 받게 됩니다.","start":342.23,"end":345.27},{"n":86,"part":"공단 창구에서 들은 말","text":"64세부터 월 84만 6천 원, 지금보다 21만 6천 원 많아요.","start":345.72,"end":350.6},{"n":87,"part":"공단 창구에서 들은 말","text":"대신 멈춘 4년 동안은 연금이 나오지 않습니다.","start":351.05,"end":353.64},{"n":88,"part":"공단 창구에서 들은 말","text":"4년 동안 못 받는 연금은 3,024만 원입니다.","start":354.09,"end":357.18},{"n":89,"part":"공단 창구에서 들은 말","text":"이 돈을 다 메우는 때는, 이번에도 75세 8개월이었어요.","start":357.63,"end":361.39},{"n":90,"part":"공단 창구에서 들은 말","text":"90세까지 산다면, 멈춘 쪽이 3,715만 원 더 받습니다.","start":361.84,"end":365.76},{"n":91,"part":"공단 창구에서 들은 말","text":"김 씨는 집에 와서 두 가지를 따져 봤습니다.","start":366.21,"end":368.53},{"n":92,"part":"공단 창구에서 들은 말","text":"집안 어른들은 대부분 90세 넘게 사셨어요.","start":368.98,"end":371.79},{"n":93,"part":"공단 창구에서 들은 말","text":"그리고 아껴 둔 퇴직금으로, 4년은 버틸 수 있었습니다.","start":372.24,"end":375.36},{"n":94,"part":"공단 창구에서 들은 말","text":"김 씨는 다음 날, 지급 정지를 신청했습니다.","start":375.81,"end":378.61},{"n":95,"part":"공단 창구에서 들은 말","text":"64세가 지나면, 더는 멈출 수 없기 때문입니다.","start":379.06,"end":382.42},{"n":96,"part":"공단 창구에서 들은 말","text":"김 씨가 알아낸 것을, 짧게 정리하겠습니다.","start":382.87,"end":385.55},{"n":97,"part":"정리","text":"김 씨를 손해 보게 한 건 신청서 한 장이 아니라, 버틸 돈 없이 맞은 5년이었습니다.","start":386.55,"end":391.57},{"n":98,"part":"정리","text":"신청서를 내기 전에도, 낸 뒤에도 이 세 가지를 꼭 보세요.","start":392.02,"end":395.7},{"n":99,"part":"정리","text":"첫째, 받기 시작하고 16년 8개월보다 오래 살 것 같다면 덜 당기세요.","start":396.15,"end":401.29},{"n":100,"part":"정리","text":"둘째, 버틸 // ── 받은 돈 합계의 차이 그림 (2장·4장·5장): 나이(가로) + 가운데 선, 선 위 = up 색, 아래 = dn 색. pts = [[나이, 만 원]] (0을 지나는 점은 꼭 넣음) ──
let CLIP = 0;
function curve(sc, o) {
  const X = a => o.x0 + (a - o.a0) * o.px, Yv = v => o.y0 - v * o.k;
  const P = o.pts.map(([a, v]) => [X(a), Yv(v)]);
  const poly = f => [[P[0][0], o.y0], ...o.pts.map(([a, v]) => [X(a), Yv(f(v))]), [P[P.length - 1][0], o.y0]].map(p => p.map(q => q.toFixed(1)).join(",")).join(" ");
  const id = "rv" + (++CLIP);
  const svg = el(`<svg class="a" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs><clipPath id="${id}"><rect x="${P[0][0] - 8}" y="0" width="0" height="1080"/></clipPath></defs>
    <g clip-path="url(#${id})">
      <polygon points="${poly(v => Math.max(v, 0))}" fill="${o.up}" fill-opacity=".40"/>
      <polygon points="${poly(v => Math.min(v, 0))}" fill="${o.dn}" fill-opacity=".40"/>
      <polyline points="${P.map(p => p.map(q => q.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#F4F6FA" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    </g></svg>`, sc);
  const rect = svg.querySelector("rect");
  const zero = hline(sc, o.x0 - 24, o.x1 + 24, o.y0, "rgba(255,255,255,.45)", 4);
  const tick = (a, top, cls) => {   // 나이 눈금 (가운데 선 위 또는 아래)
    const m = el(`<div class="a" style="left:${X(a) - 2}px;top:${o.y0 - 12}px;width:4px;height:24px;background:rgba(255,255,255,.55)"></div>`, sc);
    const t = text(sc, X(a), top, `${Math.floor(a)}세`, 42, cls || "w7 N");
    return [m, t];
  };
  return { X, Yv, svg, zero, tick, reveal: (a, at, dur) => tl.to(rect, { attr: { width: X(a) - P[0][0] + 16 }, duration: dur || 1.2, ease: "power1.inOut" }, at) };
}
