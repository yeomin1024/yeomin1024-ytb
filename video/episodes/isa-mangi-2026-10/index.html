.81,"end":75.656},{"n":17,"part":"두 사람의 ISA","text":"A 씨는 만기 돈을 연금계좌로 안 옮기고 찾아서 정기예금에 넣습니다.","start":76.106,"end":80.405},{"n":18,"part":"두 사람의 ISA","text":"B 씨는 3,000만 원을 연금저축으로 옮기고, 나머지로 ISA를 새로 만듭니다.","start":80.855,"end":86.409},{"n":19,"part":"두 사람의 ISA","text":"두 사람의 차이는 세 가지 원칙에서 나옵니다.","start":86.859,"end":89.497},{"n":20,"part":"두 사람의 ISA","text":"하나씩 보겠습니다.","start":89.947,"end":91.075},{"n":21,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"첫 번째 원칙은, 연금계좌 공제는 그해 낸 세금에서 돌려받는 돈이라는 것입니다.","start":92.075,"end":97.077},{"n":22,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"ISA 만기 돈을 60일 안에 연금계좌로 옮기면, 옮긴 돈의 10%를 공제 대상에 더해 줍니다.","start":97.527,"end":104.039},{"n":23,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"이 추가 공제 기준 300만 원은 평소 연금 공제 기준 900만 원에 따로 더해집니다.","start":104.489,"end":109.241},{"n":24,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"3,000만 원만 옮겨도 그 10%가 300만 원이라 다 채워요.","start":109.691,"end":113.485},{"n":25,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"공제율은 연봉이 5,500만 원을 넘으면 13.2%입니다.","start":113.935,"end":118.182},{"n":26,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"그래서 B 씨는 300만 원의 13.2%인 39만 6천 원을 돌려받아요.","start":118.632,"end":123.384},{"n":27,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"연봉이 5,500만 원 이하라면 16.5%라서 49만 5천 원입니다.","start":123.834,"end":128.836},{"n":28,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"그런데 돌려받는 돈은 그해 낸 소득세보다 많을 수 없습니다.","start":129.286,"end":132.83},{"n":29,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"예를 들어 국민연금만 한 달 110만 원이면, 1년 세금이 30만 원도 안 돼 다 못 돌려받아요.","start":133.28,"end":138.886},{"n":30,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"공제는 세금을 내야 쓸 수 있는 할인 쿠폰이라고 보시면 됩니다.","start":139.336,"end":143.031},{"n":31,"part":"원칙 하나, 공제는 낸 세금에서 돌려받는 돈","text":"한마디로, 연금계좌로 옮기는 건 세금을 내는 동안 해야 돌려받습니다.","start":143.481,"end":147.879},{"n":32,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"두 번째 원칙은, 공제받은 돈은 나중에 연금으로 받아야 이득이라는 것입니다.","start":148.879,"end":153.73},{"n":33,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"옮긴 3,000만 원 중 연말정산 혜택을 받지 않은 2,700만 원은, 언제든 세금 없이 꺼낼 수 있어요.","start":154.18,"end":160.588},{"n":34,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"하지만 공제받은 300만 원과 불어난 이익은 꺼낼 때 세금을 냅니다.","start":161.038,"end":165.035},{"n":35,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"55세가 넘어 연금으로 받으면 세금이 5.5%에서 3.3%이고, 한꺼번에 찾으면 16.5%예요.","start":165.485,"end":173.054},{"n":36,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"300만 원을 한꺼번에 찾으면 49만 5천 원을 내서, 돌려받은 39만 6천 원보다 많습니다.","start":173.504,"end":179.563},{"n":37,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"70세 전에 연금으로 받으면 16만 5천 원만 내서, 23만 1천 원이 이득으로 남아요.","start":180.013,"end":185.619},{"n":38,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"한마디로, 공제받은 돈은 연금으로 받아야 이득입니다.","start":186.069,"end":189.561},{"n":39,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"세 번째 원칙은, ISA는 해지하고 다시 열 때마다 비과세 한도가 새로 생긴다는 것입니다.","start":190.561,"end":196.62},{"n":40,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"ISA 이익은 비과세 기준 200만 원까지 세금이 없습니다.","start":197.07,"end":201.067},{"n":41,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"연봉 5,000만 원 이하 같은 서민형은 400만 원까지예요.","start":201.517,"end":205.009},{"n":42,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"넘는 이익에는 9.9%만 붙어서, 예금 이자에 붙는 15.4%보다 낮아요.","start":205.459,"end":210.914},{"n":43,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"두 사람도 첫 ISA 이익 800만 원 중, 200만 원을 넘는 600만 원에만 9.9%를 냈어요.","start":211.364,"end":217.725},{"n":44,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"세금 59만 4천 원을 빼고 손에 쥔 돈은 6,740만 원입니다.","start":218.175,"end":222.573},{"n":45,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"연장하면 비과세 기준은 기존 200만 원 하나뿐입니다.","start":223.023,"end":226.265},{"n":46,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"3년마다 새로 열면, 세금 없는 바구니가 하나씩 더 생기는 셈이죠.","start":226.715,"end":230.811},{"n":47,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"다만 새 ISA에는 1년에 2,000만 원까지 넣을 수 있어요.","start":231.261,"end":235.357},{"n":48,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"그래서 B 씨는 남은 3,740만 원 중 2,000만 원은 지금, 나머지는 내년에 넣습니다.","start":235.807,"end":241.762},{"n":49,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"반대로 A 씨는 예금 6,740만 원에서 1년 이자가 236만 원 나옵니다.","start":242.212,"end":247.667},{"n":50,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"여기서 해마다 약 36만 원을 세금으로 냅니다.","start":248.117,"end":251.057},{"n":51,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"연장해서 계속 굴리는 게 낫다고 생각하시는 분도 계실 거예요.","start":251.507,"end":255.202},{"n":52,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"이 예에서는 연장만 할 때보다 B 씨가 3년 동안 세금이 약 57만 원 적어요.","start":255.652,"end":260.253},{"n":53,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"한마디로, ISA는 3년마다 새로 열고, 만기 돈은 예금에 두지 않습니다.","start":260.703,"end":265.955},{"n":54,"part":"원칙 셋, ISA는 다시 열면 비과세 한도가 새로","text":"그럼 이 세 가지 원칙으로 만기 때 할 일을 순서대로 정해 보겠습니다.","start":266.405,"end":270.402},{"n":55,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"1단계, 만기 한 달 전에 연금저축 계좌부터 확인합니다.","start":271.402,"end":274.894},{"n":56,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"이미 연금을 받기 시작한 계좌에는 돈을 더 넣을 수 없습니다.","start":275.344,"end":278.888},{"n":57,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"계좌가 없으면 새로 만들어도 되지만, 연금으로 받으려면 만든 지 5년이 지나야 합니다.","start":279.338,"end":284.793},{"n":58,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"2단계, 만기 뒤 60일 안에 3,000만 원을 연금저축으로 옮깁니다.","start":285.243,"end":289.589},{"n":59,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"1년 1,800만 원인 연금계좌 납입 기준과 따로라서, 한 번에 넣을 수 있어요.","start":290.039,"end":294.989},{"n":60,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"3단계, 같은 때 ISA를 새로 만들어 2,000만 원을 넣습니다.","start":295.439,"end":299.936},{"n":61,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"다음 해 연말정산에서 공제도 꼭 확인하세요.","start":300.386,"end":303.024},{"n":62,"part":"만기 때 할 일, 계좌 확인 → 연금저축 → 새 ISA","text":"그럼 두 사람의 결과는 얼마나 달라졌을까요?","start":303.474,"end":306.112},{"n":63,"part":"두 사람의 결과","text":"3년 뒤 다음 만기까지 따져 보면, A 씨의 세금은 약 172만 원, B 씨는 약 76만 원입니다.","start":307.112,"end":313.421},{"n":64,"part":"두 사람의 결과","text":"두 사람 모두 첫 ISA에서 낸 세금 59만 4천 원이 들어 있어요.","start":313.871,"end":318.321},{"n":65,"part":"두 사람의 결과","text":"A 씨는 여기에 3년 동안 예금 이자 세금 112만 원을 더 냈습니다.","start":318.771,"end":322.919},{"n":66,"part":"두 사람의 결과","text":"B 씨는 이 세금을 거의 내지 않았고, 공제로 39만 6천 원을 돌려받았어요.","start":323.369,"end":328.22},{"n":67,"part":"두 사람의 결과","text":"앞에서 말한 B 씨의 76만 원에는 새 ISA와 연금저축에서 나중에 낼 세금 약 53만 원까지 들어 있습니다.","start":328.67,"end":335.989},{"n":68,"part":"두 사람의 결과","text":"그래서 3년 동안의 차이는 96만 원입니다.","start":336.439,"end":339.228},{"n":69,"part":"두 사람의 결과","text":"64세 만기 때도 연금저축으로 옮기면, 6년 동안의 차이는 약 2백만 원이 됩니다.","start":339.678,"end":344.982},{"n":70,"part":"두 사람의 결과","text":"두 사람이 이미 은퇴해서 낼 세금이 없다면, 공제는 0원이에요.","start":345.432,"end":349.377},{"n":71,"part":"두 사람의 결과","text":"그래도 B 씨는 예금 이자 세금을 덜 내서, 3년 동안 약 73만 원 차이가 납니다.","start":349.827,"end":354.829},{"n":72,"part":"두 사람의 결과","text":"그런데 이미 만기가 지났거나, 연금계좌로 안 옮기고 찾으신 분들도 계실 텐데요.","start":355.279,"end":360.281},{"n":73,"part":"두 사람의 결과","text":"그럼 어떻게 해야 할까요?","start":360.731,"end":362.161},{"n":74,"part":"이미 만기가 지났다면","text":"늦지 않았습니다.","start":363.161,"end":364.138},{"n":75,"part":"이미 만기가 지났다면","text":"만기 뒤 60일이 안 지났다면, 지금이라도 연금계좌로 옮길 수 있어요.","start":364.588,"end":368.986},{"n":76,"part":"이미 만기가 지났다면","text":"혹시 만기를 연장하셨나요?","start":369.436,"end":371.017},{"n":77,"part":"이미 만기가 지났다면","text":"가입한 지 3년이 지났다면 언제든 옮길 수 있습니다.","start":371.467,"end":374.558},{"n":78,"part":"이미 만기가 지났다면","text":"옮기는 날을 만기로 봐서, 똑같이 추가 공제를 받아요.","start":375.008,"end":378.349},{"n":79,"part":"이미 만기가 지났다면","text":"60일이 지나서 이미 찾으셨다면, 이번 ISA로는 추가 공제를 받을 수 없어요.","start":378.799,"end":384.254},{"n":80,"part":"이미 만기가 지났다면","text":"대신 오늘 ISA를 새로 만들어서, 찾은 돈을 1년에 2,000만 원씩 옮기세요.","start":384.704,"end":390.107},{"n":81,"part":"이미 만기가 지났다면","text":"3년 뒤에 추가 공제 기회가 다시 옵니다.","start":390.557,"end":392.893},{"n":82,"part":"이미 만기가 지났다면","text":"새 ISA를 미룰수록 예금 이자 세금만 더 나갑니다.","start":393.343,"end":396.887},{"n":83,"part":"이미 만기가 지났다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":397.337,"end":400.225},{"n":84,"part":"정리, 바뀌어도 그대로인 것","text":"비과세 기준 200만 원과 공제 비율은 바뀔 수 있습니다.","start":401.225,"end":404.467},{"n":85,"part":"정리, 바뀌어도 그대로인 것","text":"국회에 올라간 ISA 개편안도 아직 정해지지 않았어요.","start":404.917,"end":408.763},{"n":86,"
