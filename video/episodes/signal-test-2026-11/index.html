<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"signal-test-2026-11","topic":"stock","duration":529.96,"audio":"../../../stock/source/signal-test-2026-11/narration.mp3","thumb":null,"synced":"2026-11-04T16:29:02Z","tts":"2026-11-04T16:03:10","script_sha1":"59168f7a472c5b4e","sent":[{"n":1,"part":"도입","text":"금리와 유가, 일자리 같은 경제 지표는 주식 시장의 일기예보와 같습니다.","start":0.3,"end":5.14},{"n":2,"part":"도입","text":"이 예보를 거꾸로 읽은 박씨의 1억 원은, 4년 만에 3천1백만 원이 됐는데요.","start":5.52,"end":10.685},{"n":3,"part":"도입","text":"같은 4년 동안 S&P 500 지수는 40% 넘게 올랐습니다.","start":11.065,"end":15.434},{"n":4,"part":"도입","text":"박씨가 놓친 건 폭락의 날짜가 아니라, 시장이 어떤 국면에 들어섰는지였습니다.","start":15.814,"end":20.67},{"n":5,"part":"도입","text":"지금부터 박씨 앞에 나타난 지표 다섯 개를 보고, 그때가 어떤 국면인지 골라 보세요.","start":21.05,"end":25.86},{"n":6,"part":"도입","text":"몇 개의 국면을 맞히는지 세면서 보시면 됩니다.","start":26.24,"end":29.023},{"n":7,"part":"도입","text":"이제 당신이 박씨라고 생각하고, 처음 주식을 산 날로 가 보겠습니다.","start":29.403,"end":33.492},{"n":8,"part":"선택 1","text":"당신은 그동안 모은 1억 원으로 투자를 시작했습니다.","start":34.492,"end":37.684},{"n":9,"part":"선택 1","text":"그 가운데 8천만 원은 한 성장주에, 2천만 원은 S&P 500 지수에 넣었습니다.","start":38.064,"end":42.999},{"n":10,"part":"선택 1","text":"그 성장주는 코로나 뒤 온라인 쇼핑이 늘며, 2년 만에 3배 넘게 오른 회사입니다.","start":43.379,"end":48.611},{"n":11,"part":"선택 1","text":"S&P 500 지수도 마침 최고가를 기록했는데요.","start":48.991,"end":52.218},{"n":12,"part":"선택 1","text":"그런데 뉴스에선, 미국 중앙은행이 올해 금리를 올리겠다고 예고했습니다.","start":52.598,"end":56.928},{"n":13,"part":"선택 1","text":"국채란 나라가 돈을 빌리며 내주는 증서이고, 그 이자율이 국채 금리입니다.","start":57.308,"end":62.308},{"n":14,"part":"선택 1","text":"그 가운데 10년짜리 국채 금리는, 이미 바닥의 3배가 넘었습니다.","start":62.688,"end":66.678},{"n":15,"part":"선택 1","text":"주변에선 주가가 최고가인데 무슨 걱정이냐고들 합니다.","start":67.058,"end":70.416},{"n":16,"part":"선택 1","text":"지금 당신은 아직 상승 국면이니, 성장주를 그대로 두시겠습니까?","start":70.796,"end":74.788},{"n":17,"part":"선택 1","text":"아니면 금리가 오르는 국면이니, 성장주 비중을 줄이시겠습니까?","start":75.168,"end":79.148},{"n":18,"part":"선택 1","text":"선택해 보세요.","start":79.528,"end":80.468},{"n":19,"part":"선택 1","text":"3, 2, 1.","start":80.848,"end":83.028},{"n":20,"part":"선택 1","text":"이 국면에서는 성장주 비중을 줄이는 것이 옳은 선택입니다.","start":83.408,"end":86.968},{"n":21,"part":"선택 1","text":"날짜는 2022년 1월 3일, 그 성장주는 쇼핑몰 프로그램 회사 쇼피파이였습니다.","start":87.348,"end":92.544},{"n":22,"part":"선택 1","text":"박씨처럼 그대로 뒀다면, 그 뒤 81%까지 하락했을 것입니다.","start":92.924,"end":97.023},{"n":23,"part":"선택 1","text":"원금을 되찾는 데에도 3년 7개월이 걸렸을 겁니다.","start":97.403,"end":100.642},{"n":24,"part":"선택 1","text":"예를 들어 성장주는 계좌의 20%만 남기고, 나머지를 지수로 옮겼다고 하겠습니다.","start":101.022,"end":106.182},{"n":25,"part":"선택 1","text":"지수로 옮긴 돈은 가장 나쁠 때 24% 하락했다가, 2년이 안 돼 원금을 되찾았을 겁니다.","start":106.562,"end":112.577},{"n":26,"part":"선택 1","text":"물론 1994년 이후로 보면, 금리가 오른다고 주가가 늘 크게 하락하진 않았습니다.","start":112.957,"end":118.187},{"n":27,"part":"선택 1","text":"금리 인상이 시작된 다섯 번, 지수는 1년 반 안에 많아야 18% 하락했습니다.","start":118.567,"end":124.067},{"n":28,"part":"선택 1","text":"하지만 같은 때 기술주가 많은 나스닥 100은, 네 번 중 세 번 더 깊이 하락했습니다.","start":124.447,"end":129.597},{"n":29,"part":"선택 1","text":"앞으로 벌 돈을 비싸게 쳐주던 성장주일수록, 금리가 오르면 값이 크게 흔들립니다.","start":129.977,"end":135.094},{"n":30,"part":"선택 1","text":"따라서 옳은 선택은 금리가 오를 때, 비싼 성장주의 비중부터 줄이는 것입니다.","start":135.474,"end":140.406},{"n":31,"part":"선택 2","text":"두 달 뒤, 국제 유가가 13년여 만에 가장 높은 값까지 치솟았습니다.","start":141.406,"end":145.906},{"n":32,"part":"선택 2","text":"석유 한 통 값이, 두 달 만에 60% 넘게 오른 건데요.","start":146.286,"end":149.964},{"n":33,"part":"선택 2","text":"국제 유가는 물건값과 경기의 앞날을 함께 보여 주는 지표입니다.","start":150.344,"end":154.402},{"n":34,"part":"선택 2","text":"그사이 S&P 500 지수는 13%, 당신의 성장주는 62% 하락했습니다.","start":154.782,"end":160.737},{"n":35,"part":"선택 2","text":"주변에선 이렇게 싸게 살 기회는 다시 없다며, 대출까지 받아 산다는 사람이 늘어납니다.","start":161.117,"end":166.449},{"n":36,"part":"선택 2","text":"지금 당신은 유가가 물가를 밀어 올리는 국면이니, 빚 없이 현금을 늘리시겠습니까?","start":166.829,"end":172.054},{"n":37,"part":"선택 2","text":"아니면 이미 많이 하락했으니, 대출을 받아 성장주를 더 매수하시겠습니까?","start":172.434,"end":177.174},{"n":38,"part":"선택 2","text":"선택해 보세요.","start":177.554,"end":178.494},{"n":39,"part":"선택 2","text":"3, 2, 1.","start":178.874,"end":181.054},{"n":40,"part":"선택 2","text":"이 국면에서는 빚 없이 현금을 늘리는 것이 옳은 선택입니다.","start":181.434,"end":184.824},{"n":41,"part":"선택 2","text":"날짜는 2022년 3월 8일, 국제 유가가 한 통에 123달러를 넘은 날이었습니다.","start":185.204,"end":191.099},{"n":42,"part":"선택 2","text":"박씨처럼 대출로 성장주를 더 샀다면, 그 돈은 일곱 달 뒤 반 토막이 났을 것입니다.","start":191.479,"end":196.594},{"n":43,"part":"선택 2","text":"대출 이자와 같이 움직이는 3개월 국채 금리도, 여덟 달 새 0.4%에서 4%로 올랐죠.","start":196.974,"end":203.196},{"n":44,"part":"선택 2","text":"물론 그 뒤 한 달 동안은, 주가가 11% 다시 오르기도 했습니다.","start":203.576,"end":207.638},{"n":45,"part":"선택 2","text":"하지만 기름값이 물가를 밀어 올리면, 금리는 더 빨리 오르기 쉽습니다.","start":208.018,"end":212.378},{"n":46,"part":"선택 2","text":"그런 때 빚을 내면, 늘어나는 이자와 손실을 함께 떠안게 됩니다.","start":212.758,"end":216.628},{"n":47,"part":"선택 2","text":"따라서 옳은 선택은 유가가 치솟으면 금리도 오른다고 보고, 현금을 늘리는 것입니다.","start":217.008,"end":222.048},{"n":48,"part":"선택 3","text":"여덟 달 뒤, 이번에는 채권 시장에서 신호가 나왔습니다.","start":223.048,"end":226.726},{"n":49,"part":"선택 3","text":"10년 동안 빌려주는 국채의 금리가, 석 달만 빌려주는 국채보다 낮아진 겁니다.","start":227.106,"end":231.985},{"n":50,"part":"선택 3","text":"보통은 오래 빌려줄수록 이자를 더 받는데요.","start":232.365,"end":235.015},{"n":51,"part":"선택 3","text":"이를 장단기 금리차가 역전됐다고 하고, 경기 침체의 신호로 많이 봅니다.","start":235.395,"end":240.015},{"n":52,"part":"선택 3","text":"S&P 500 지수는 최고가보다 18% 아래입니다.","start":240.395,"end":243.915},{"n":53,"part":"선택 3","text":"뉴스는 곧 침체가 온다는 이야기뿐이고, 주변에선 다 팔았다는 사람이 늘어납니다.","start":244.295,"end":249.255},{"n":54,"part":"선택 3","text":"지금 당신은 금리차가 역전됐으니 침체가 확실하다며, 모두 매도하고 기다리시겠습니까?","start":249.635,"end":255.405},{"n":55,"part":"선택 3","text":"아니면 위험이 커졌다는 경고로만 보고, 정해 둔 비중대로 보유하시겠습니까?","start":255.785,"end":260.402},{"n":56,"part":"선택 3","text":"선택해 보세요.","start":260.782,"end":261.722},{"n":57,"part":"선택 3","text":"3, 2, 1.","start":262.102,"end":264.282},{"n":58,"part":"선택 3","text":"이 국면에서는 경고로만 보고, 정해 둔 비중대로 보유하는 것이 옳은 선택입니다.","start":264.662,"end":269.652},{"n":59,"part":"선택 3","text":"날짜는 2022년 11월 10일, 장단기 금리차가 역전된 날이었습니다.","start":270.032,"end":275.042},{"n":60,"part":"선택 3","text":"박씨처럼 모두 매도하고 기다렸다면, 2년 동안 이자로 10% 느는 데 그쳤을 것입니다.","start":275.422,"end":280.968},{"n":61,"part":"선택 3","text":"지수를 그대로 뒀다면 4% 더 하락하기도 했겠지만, 2년 뒤엔 56% 올라 있었을 겁니다.","start":281.348,"end":287.698},{"n":62,"part":"선택 3","text":"물론 이 신호 뒤에 정말 큰 하락장이 온 적도 많습니다.","start":288.078,"end":291.418},{"n":63,"part":"선택 3","text":"1990년 이후 역전 네 번 가운데 세 번은, 그 뒤 하락장이 왔습니다.","start":291.798,"end":296.451},{"n":64,"part":"선택 3","text":"하지만 하락이 시작된 때는, 한 달 뒤부터 14개월 뒤까지 제각각이었습니다.","start":296.831,"end":301.581},{"n":65,"part":"선택 3","text":"2022년의 역전 뒤에는, 하락장이 오지 않았고요.","start":301.961,"end":305.357},{"n":66,"part":"선택 3","text":"금리차 역전은 하락이 오는 날짜가 아니라, 위험이 커졌다는 경고일 뿐인 거죠.","start":305.737,"end":310.425},{"n":67,"part":"선택 3","text":"따라서 옳은 선택은 금리차 역전을 매도 신호가 아닌 경고로 읽고, 비중을 지키는 것입니다.","start":310.805,"end":316.131},{"n":68,"part":"선택 4","text":"다시 여덟 달쯤 뒤, 국제 유가는 고점보다 36% 내려왔습니다.","start":317.131,"end":321.539},{"n":69,"part":"선택 4","text":"1년 새 크게 오른 3개월 국채 금리도, 최근 석 달은 조금밖에 오르지 않았습니다.","start":321.919,"end":327.259},{"n":70,"part":"선택 4","text":"하지만 장단기 금리차는 여전히 역전된 채라, 침체 신호는 꺼지지 않았습니다.","start":327.639,"end":332.749},{"n":71,"part":"선택 4","text":"주가는 바닥에서 28% 올랐지만, 아직 최고가보다는 5% 아래입니다.","start":333.129,"end":338.248},{"n":72,"part":"선택 4","text":"당신의 계좌에는 아직 주식에 넣지 않은 현금이 있습니다.","start":338.628,"end":341.985},{"n":73,"part":"선택 4","text":"지금 당신은 침체 신호가 꺼질 때까지, 현금으로 기다리시겠습니까?","start":342.365,"end":346.695},{"n":74,"part":"선택 4","text":"아니면 금리와 유가가 진정된 국면이니, 정한 비중만큼 다시 매수하시겠습니까?","start":347.075,"end":352.307},{"n":75,"part":"선택 4","text":"선택해 보세요.","start":352.687,"end":353.627},{"n":76,"part":"선택 4","text":"3, 2, 1.","start":354.007,"end":356.187},{"n":77,"part":"선택 4","text":"이 국면에서는 정한 비중만큼 다시 매수하는 것이 옳은 선택입니다.","start":356.567,"end":360.847},{"n":78,"part":"선택 4","text":"날짜는 2023년 7월 26일, 이번 금리 인상기의 마지막 인상 날이었습니다.","start":361.227,"end":366.891},{"n":79,"part":"선택 4","text":"박씨처럼 1년 동안 현금으로 기다렸다면, 이자로 5% 느는 데 그쳤을 것입니다.","start":367.271,"end":372.36},{"n":80,"part":"선택 4","text":"다시 산 돈은 석 달 뒤 10% 가까이 하락했다가, 1년 뒤엔 20% 늘었을 겁니다.","start":372.74,"end":378.22},{"n":81,"part":"선택 4","text":"장단기 금리차 역전은, 그 뒤로도 1년 넘게 이어졌습니다.","start":378.6,"end":382.54},{"n":82,"part":"선택 4","text":"물론 침체 신호가 아직 켜져 있는데 다시 사기는 불안합니다.","start":382.92,"end":386.394},{"n":83,"part":"선택 4","text":"하지만 1995년 이후 금리 인상이 멈춘 다섯 번 중 네 번, 1년 뒤 주가가 올랐습니다.","start":386.774,"end":392.787},{"n":84,"part":"선택 4","text":"역전이 풀리길 기다리기보다, 금리와 유가가 진정되는 흐름을 보는 게 중요합니다.","start":393.167,"end":397.976},{"n":85,"part":"선택 4","text":"따라서 옳은 선택은 금리 인상이 멈추고 유가가 진정되면, 정한 비중으로 돌아가는 것입니다.","start":398.356,"end":404.181},{"n":86,"part":"선택 5","text":"1년 뒤, 당신의 돈은 대부분 S&P 500 지수에 있습니다.","start":405.181,"end":409.19},{"n":87,"part":"선택 5","text":"그런데 미국 실업률이 4.3%로 올랐다는 발표가 나왔는데요.","start":409.57,"end":413.407},{"n":88,"part":"선택 5","text":"일자리가 줄면 소비도 줄어, 경기 침체가 시작됐다는 뉴스가 쏟아집니다.","start":413.787,"end":418.361},{"n":89,"part":"선택 5","text":"주가는 3주 만에 8% 넘게 하락했습니다.","start":418.741,"end":421.448},{"n":90,"part":"선택 5","text":"지금 당신은 여러 지표를 함께 살펴보고, 계획대로 보유하시겠습니까?","start":421.828,"end":426.072},{"n":91,"part":"선택 5","text":"아니면 침체가 시작된 국면이니, 모두 매도하시겠습니까?","start":426.452,"end":430.221},{"n":92,"part":"선택 5","text":"선택해 보세요.","start":430.601,"end":431.541},{"n":93,"part":"선택 5","text":"3, 2, 1.","start":431.921,"end":434.101},{"n":94,"part":"선택 5","text":"이 국면에서는 여러 지표를 함께 보고 계획대로 보유하는 것이 옳은 선택입니다.","start":434.481,"end":439.429},{"n":95,"part":"선택 5","text":"날짜는 2024년 8월 5일, 실업률 발표 뒤 주가가 크게 하락한 날이었습니다.","start":439.809,"end":445.233},{"n":96,"part":"선택 5","text":"그날 다른 지표를 보면, 국제 유가는 2022년 고점보다 41% 낮았습니다.","start":445.613,"end":451.103},{"n":97,"part":"선택 5","text":"10년 국채 금리도 3주 새 4.2%에서 3.8%로 내려가고 있었습니다.","start":451.483,"end":457.035},{"n":98,"part":"선택 5","text":"박씨처럼 모두 매도했다면, 1년 5개월 동안 이자로 6% 느는 데 그쳤을 것입니다.","start":457.415,"end":462.893},{"n":99,"part":"선택 5","text":"보유했다면 45일 만에 최고가를 되찾고, 1년 5개월 뒤엔 34% 올라 있었을 겁니다.","start":463.273,"end":469.458},{"n":100,"part":"선택 5","text":"물론 이번이 진짜 침체의 시작일 수도 있었습니다.","start":469.838,"end":472.668},{"n":101,"part":"선택 5","text":"하지만 1990년 이후, 최고가 근처에서 한 달 새 8% 넘게 하락한 건 열여덟 번입니다.","start":473.048,"end":479.299},{"n":102,"part":"선택 5","text":"그 가운데 열네 번은, 20% 넘는 하락장으로 이어지지 않았습니다.","start":479.679,"end":483.794},{"n":103,"part":"선택 5","text":"따라서 옳은 선택은 실업률 하나에 놀라 팔지 않고, 유가와 금리까지 함께 보는 것입니다.","start":484.174,"end":489.195},{"n":104,"part":"결과","text":"이 테스트에서 당신은 몇 개의 국면을 맞히셨나요?","start":490.195,"end":493.274},{"n":105,"part":"결과","text":"다섯 개를 맞혔다면 지표로 국면을 읽고 위험에 맞춰 비중을 조절하는 사람으로, 통과입니다.","start":493.654,"end":498.953},{"n":106,"part":"결과","text":"서너 개를 맞혔다면 신호를 무시하거나 신호 하나에 지나치게 반응하는 사람으로, 주의입니다.","start":499.333,"end":504.513},{"n":107,"part":"결과","text":"두 개 이하라면 박씨처럼 위험 신호를 몰라 손실을 볼 확률이 높은 사람으로, 불통과입니다.","start":504.893,"end":510.78},{"n":108,"part":"정리","text":"이 테스트에서 알 수 있듯이, 소 잃고 외양간 고치지 않으려면 지표로 날짜가 아닌 국면을 읽고 미리 위험을 줄이는 쪽이 주식으로 부자가 되는 길이라는 것을 알아두세요.","start":511.78,"end":522.56},{"n":109,"part":"정리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":522.94,"end":525.15},{"n":110,"part":"정리","text":"시청해주셔서 감사합니다.","start":525.53,"end":527.06}],"subs":[[0.2,5.52,"금리와 유가,\n일자리 같은 경제 지표는 주식 시장의 일기예보와 같습니다."],[5.52,11.065,"이 예보를 거꾸로 읽은 박씨의 1억 원은,\n4년 만에 3천1백만 원이 됐는데요."],[11.065,15.814,"같은 4년 동안 S&P 500 지수는 40% 넘게 올랐습니다."],[15.814,21.05,"박씨가 놓친 건 폭락의 날짜가 아니라,\n시장이 어떤 국면에 들어섰는지였습니다."],[21.05,26.24,"지금부터 박씨 앞에 나타난 지표 다섯 개를 보고,\n그때가 어떤 국면인지 골라 보세요."],[26.24,29.403,"몇 개의 국면을 맞히는지 세면서 보시면 됩니다."],[29.403,34.492,"이제 당신이 박씨라고 생각하고, 처음 주식을 산 날로 가 보겠습니다."],[34.492,38.064,"당신은 그동안 모은 1억 원으로 투자를 시작했습니다."],[38.064,43.379,"그 가운데 8천만 원은 한 성장주에,\n2천만 원은 S&P 500 지수에 넣었습니다."],[43.379,48.991,"그 성장주는 코로나 뒤 온라인 쇼핑이 늘며,\n2년 만에 3배 넘게 오른 회사입니다."],[48.991,52.598,"S&P 500 지수도 마침 최고가를 기록했는데요."],[52.598,57.308,"그런데 뉴스에선,\n미국 중앙은행이 올해 금리를 올리겠다고 예고했습니다."],[57.308,62.688,"국채란 나라가 돈을 빌리며 내주는 증서이고,\n그 이자율이 국채 금리입니다."],[62.688,67.058,"그 가운데 10년짜리 국채 금리는, 이미 바닥의 3배가 넘었습니다."],[67.058,70.796,"주변에선 주가가 최고가인데 무슨 걱정이냐고들 합니다."],[70.796,75.168,"지금 당신은 아직 상승 국면이니, 성장주를 그대로 두시겠습니까?"],[75.168,79.528,"아니면 금리가 오르는 국면이니, 성장주 비중을 줄이시겠습니까?"],[79.528,80.848,"선택해 보세요."],[80.848,83.408,"3, 2, 1."],[83.408,87.348,"이 국면에서는 성장주 비중을 줄이는 것이 옳은 선택입니다."],[87.348,92.924,"날짜는 2022년 1월 3일,\n그 성장주는 쇼핑몰 프로그램 회사 쇼피파이였습니다."],[92.924,97.403,"박씨처럼 그대로 뒀다면, 그 뒤 81%까지 하락했을 것입니다."],[97.403,101.022,"원금을 되찾는 데에도 3년 7개월이 걸렸을 겁니다."],[101.022,106.562,"예를 들어 성장주는 계좌의 20%만 남기고,\n나머지를 지수로 옮겼다고 하겠습니다."],[106.562,112.957,"지수로 옮긴 돈은 가장 나쁠 때 24% 하락했다가,\n2년이 안 돼 원금을 되찾았을 겁니다."],[112.957,118.567,"물론 1994년 이후로 보면,\n금리가 오른다고 주가가 늘 크게 하락하진 않았습니다."],[118.567,124.447,"금리 인상이 시작된 다섯 번,\n지수는 1년 반 안에 많아야 18% 하락했습니다."],[124.447,129.977,"하지만 같은 때 기술주가 많은 나스닥 100은,\n네 번 중 세 번 더 깊이 하락했습니다."],[129.977,135.474,"앞으로 벌 돈을 비싸게 쳐주던 성장주일수록,\n금리가 오르면 값이 크게 흔들립니다."],[135.474,141.406,"따라서 옳은 선택은 금리가 오를 때,\n비싼 성장주의 비중부터 줄이는 것입니다."],[141.406,146.286,"두 달 뒤, 국제 유가가 13년여 만에 가장 높은 값까지 치솟았습니다."],[146.286,150.344,"석유 한 통 값이, 두 달 만에 60% 넘게 오른 건데요."],[150.344,154.782,"국제 유가는 물건값과 경기의 앞날을 함께 보여 주는 지표입니다."],[154.782,161.117,"그사이 S&P 500 지수는 13%, 당신의 성장주는 62% 하락했습니다."],[161.117,166.829,"주변에선 이렇게 싸게 살 기회는 다시 없다며,\n대출까지 받아 산다는 사람이 늘어납니다."],[166.829,172.434,"지금 당신은 유가가 물가를 밀어 올리는 국면이니,\n빚 없이 현금을 늘리시겠습니까?"],[172.434,177.554,"아니면 이미 많이 하락했으니,\n대출을 받아 성장주를 더 매수하시겠습니까?"],[177.554,178.874,"선택해 보세요."],[178.874,181.434,"3, 2, 1."],[181.434,185.204,"이 국면에서는 빚 없이 현금을 늘리는 것이 옳은 선택입니다."],[185.204,191.479,"날짜는 2022년 3월 8일,\n국제 유가가 한 통에 123달러를 넘은 날이었습니다."],[191.479,196.974,"박씨처럼 대출로 성장주를 더 샀다면,\n그 돈은 일곱 달 뒤 반 토막이 났을 것입니다."],[196.974,203.576,"대출 이자와 같이 움직이는 3개월 국채 금리도,\n여덟 달 새 0.4%에서 4%로 올랐죠."],[203.576,208.018,"물론 그 뒤 한 달 동안은, 주가가 11% 다시 오르기도 했습니다."],[208.018,212.758,"하지만 기름값이 물가를 밀어 올리면, 금리는 더 빨리 오르기 쉽습니다."],[212.758,217.008,"그런 때 빚을 내면, 늘어나는 이자와 손실을 함께 떠안게 됩니다."],[217.008,223.048,"따라서 옳은 선택은 유가가 치솟으면 금리도 오른다고 보고,\n현금을 늘리는 것입니다."],[223.048,227.106,"여덟 달 뒤, 이번에는 채권 시장에서 신호가 나왔습니다."],[227.106,232.365,"10년 동안 빌려주는 국채의 금리가,\n석 달만 빌려주는 국채보다 낮아진 겁니다."],[232.365,235.395,"보통은 오래 빌려줄수록 이자를 더 받는데요."],[235.395,240.395,"이를 장단기 금리차가 역전됐다고 하고,\n경기 침체의 신호로 많이 봅니다."],[240.395,244.295,"S&P 500 지수는 최고가보다 18% 아래입니다."],[244.295,249.635,"뉴스는 곧 침체가 온다는 이야기뿐이고,\n주변에선 다 팔았다는 사람이 늘어납니다."],[249.635,255.785,"지금 당신은 금리차가 역전됐으니 침체가 확실하다며,\n모두 매도하고 기다리시겠습니까?"],[255.785,260.782,"아니면 위험이 커졌다는 경고로만 보고,\n정해 둔 비중대로 보유하시겠습니까?"],[260.782,262.102,"선택해 보세요."],[262.102,264.662,"3, 2, 1."],[264.662,270.032,"이 국면에서는 경고로만 보고,\n정해 둔 비중대로 보유하는 것이 옳은 선택입니다."],[270.032,275.422,"날짜는 2022년 11월 10일, 장단기 금리차가 역전된 날이었습니다."],[275.422,281.348,"박씨처럼 모두 매도하고 기다렸다면,\n2년 동안 이자로 10% 느는 데 그쳤을 것입니다."],[281.348,288.078,"지수를 그대로 뒀다면 4% 더 하락하기도 했겠지만,\n2년 뒤엔 56% 올라 있었을 겁니다."],[288.078,291.798,"물론 이 신호 뒤에 정말 큰 하락장이 온 적도 많습니다."],[291.798,296.831,"1990년 이후 역전 네 번 가운데 세 번은, 그 뒤 하락장이 왔습니다."],[296.831,301.961,"하지만 하락이 시작된 때는,\n한 달 뒤부터 14개월 뒤까지 제각각이었습니다."],[301.961,305.737,"2022년의 역전 뒤에는, 하락장이 오지 않았고요."],[305.737,310.805,"금리차 역전은 하락이 오는 날짜가 아니라,\n위험이 커졌다는 경고일 뿐인 거죠."],[310.805,317.131,"따라서 옳은 선택은 금리차 역전을 매도 신호가 아닌 경고로 읽고,\n비중을 지키는 것입니다."],[317.131,321.919,"다시 여덟 달쯤 뒤, 국제 유가는 고점보다 36% 내려왔습니다."],[321.919,327.639,"1년 새 크게 오른 3개월 국채 금리도,\n최근 석 달은 조금밖에 오르지 않았습니다."],[327.639,333.129,"하지만 장단기 금리차는 여전히 역전된 채라,\n침체 신호는 꺼지지 않았습니다."],[333.129,338.628,"주가는 바닥에서 28% 올랐지만, 아직 최고가보다는 5% 아래입니다."],[338.628,342.365,"당신의 계좌에는 아직 주식에 넣지 않은 현금이 있습니다."],[342.365,347.075,"지금 당신은 침체 신호가 꺼질 때까지, 현금으로 기다리시겠습니까?"],[347.075,352.687,"아니면 금리와 유가가 진정된 국면이니,\n정한 비중만큼 다시 매수하시겠습니까?"],[352.687,354.007,"선택해 보세요."],[354.007,356.567,"3, 2, 1."],[356.567,361.227,"이 국면에서는 정한 비중만큼 다시 매수하는 것이 옳은 선택입니다."],[361.227,367.271,"날짜는 2023년 7월 26일,\n이번 금리 인상기의 마지막 인상 날이었습니다."],[367.271,372.74,"박씨처럼 1년 동안 현금으로 기다렸다면,\n이자로 5% 느는 데 그쳤을 것입니다."],[372.74,378.6,"다시 산 돈은 석 달 뒤 10% 가까이 하락했다가,\n1년 뒤엔 20% 늘었을 겁니다."],[378.6,382.92,"장단기 금리차 역전은, 그 뒤로도 1년 넘게 이어졌습니다."],[382.92,386.774,"물론 침체 신호가 아직 켜져 있는데 다시 사기는 불안합니다."],[386.774,393.167,"하지만 1995년 이후 금리 인상이 멈춘 다섯 번 중 네 번,\n1년 뒤 주가가 올랐습니다."],[393.167,398.356,"역전이 풀리길 기다리기보다,\n금리와 유가가 진정되는 흐름을 보는 게 중요합니다."],[398.356,405.181,"따라서 옳은 선택은 금리 인상이 멈추고 유가가 진정되면,\n정한 비중으로 돌아가는 것입니다."],[405.181,409.57,"1년 뒤, 당신의 돈은 대부분 S&P 500 지수에 있습니다."],[409.57,413.787,"그런데 미국 실업률이 4.3%로 올랐다는 발표가 나왔는데요."],[413.787,418.741,"일자리가 줄면 소비도 줄어,\n경기 침체가 시작됐다는 뉴스가 쏟아집니다."],[418.741,421.828,"주가는 3주 만에 8% 넘게 하락했습니다."],[421.828,426.452,"지금 당신은 여러 지표를 함께 살펴보고, 계획대로 보유하시겠습니까?"],[426.452,430.601,"아니면 침체가 시작된 국면이니, 모두 매도하시겠습니까?"],[430.601,431.921,"선택해 보세요."],[431.921,434.481,"3, 2, 1."],[434.481,439.809,"이 국면에서는 여러 지표를 함께 보고\n계획대로 보유하는 것이 옳은 선택입니다."],[439.809,445.613,"날짜는 2024년 8월 5일,\n실업률 발표 뒤 주가가 크게 하락한 날이었습니다."],[445.613,451.483,"그날 다른 지표를 보면,\n국제 유가는 2022년 고점보다 41% 낮았습니다."],[451.483,457.415,"10년 국채 금리도 3주 새 4.2%에서 3.8%로 내려가고 있었습니다."],[457.415,463.273,"박씨처럼 모두 매도했다면,\n1년 5개월 동안 이자로 6% 느는 데 그쳤을 것입니다."],[463.273,469.838,"보유했다면 45일 만에 최고가를 되찾고,\n1년 5개월 뒤엔 34% 올라 있었을 겁니다."],[469.838,473.048,"물론 이번이 진짜 침체의 시작일 수도 있었습니다."],[473.048,479.679,"하지만 1990년 이후,\n최고가 근처에서 한 달 새 8% 넘게 하락한 건 열여덟 번입니다."],[479.679,484.174,"그 가운데 열네 번은, 20% 넘는 하락장으로 이어지지 않았습니다."],[484.174,490.195,"따라서 옳은 선택은 실업률 하나에 놀라 팔지 않고,\n유가와 금리까지 함께 보는 것입니다."],[490.195,493.654,"이 테스트에서 당신은 몇 개의 국면을 맞히셨나요?"],[493.654,499.333,"다섯 개를 맞혔다면 지표로 국면을 읽고\n위험에 맞춰 비중을 조절하는 사람으로, 통과입니다."],[499.333,504.893,"서너 개를 맞혔다면 신호를 무시하거나 신호 하나에\n지나치게 반응하는 사람으로, 주의입니다."],[504.893,511.78,"두 개 이하라면 박씨처럼 위험 신호를\n몰라 손실을 볼 확률이 높은 사람으로, 불통과입니다."],[511.78,518.469,"이 테스트에서 알 수 있듯이,\n소 잃고 외양간 고치지 않으려면 지표로 날짜가 아닌 국면을 읽고"],[518.469,522.94,"미리 위험을 줄이는 쪽이 주식으로\n부자가 되는 길이라는 것을 알아두세요."],[522.94,525.53,"그럼 모두 성공 투자 하시기 바랍니다."],[525.53,527.46,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>
