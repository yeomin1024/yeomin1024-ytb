# 성공 사례 분석 규칙 — 재테크 (tools/success_analysis.py 가 읽음)
# VERSION: v1.2 — 2026-10-14 — [format] 형식(포맷) 규칙 새로 · [exclude] OFF_TOPIC 에 도박·스포츠·괴담 (2026-10-14 실제 결과: 성공 사례에
#          스포츠토토·여자배구 구단 소식·폐건물 괴담이 '재테크'로 들어 있었음) (사용자 지시: "결과 올라갔는데 문제가 부분 수정하고 분석결과로
#          내가 말한 거 할수 있는지 판단해 개선 필요하면 더 개선하고")
# (v1.1 — 2026-10-14 — [demand] AC_EXCLUDE · [growth] MAX_SUBS·MIN_TOPIC_VIDEOS · [baseline] 같은 채널 기준선 추가 (사용자 지시:
#          "결과 올라왔는데 문제가 부분 수정하고 분석결과로 내가 말한 거 할수 있는지 판단해 개선 필요하면 더 개선하고"))
# (v1.0 — 2026-10-14 — 새로 만듦 (사용자 지시: "성공 사례 영상의 정보와 시청자들의 니즈(댓글을 통해 영상의 좋은점,
#          뭐를 더 알고 싶은지, 영상의 아쉬운점이 뭔지 등)를 분석해서 어떤 주제, 어떤 제목, 어떤 썸네일, 내용을 어떻게 구성해야하는지 …
#          올바른 분석 결과까지만 내도록 수정해"))
# 값을 바꾸면 결과(analysis.md)의 성공 사례·비교 숫자가 바뀐다 — 바꾼 까닭을 CHANGELOG 에 적는다.
# ※ 연구·교육용 분석 규칙. 투자 권유가 아니다.

[success]                 # 성공 사례 = 자료(설명·자막·댓글·썸네일)를 받은 영상 중 이 기준을 모두 넘는 것 (CLAUDE.md 지시사항 근거 기준)
MAX_AGE_DAYS = 180        # 올린 지 180일 안
MAX_SUBS = 50000          # 구독자 5만 이하 (작은 채널)
MIN_RATIO = 3.0           # 조회수 ≥ 구독자 × 3 (구독자 100 미만은 100 으로 셈)
MIN_VIEWS = 10000         # 조회수 1만 이상
MIN_MINUTES = 4.0         # 4분 이상 (쇼츠 제외)
CASES_PER_CHANNEL = 2     # 한 채널은 배수가 큰 2개까지 (한 채널이 성공 사례를 덮지 않게)

[compare]                 # 비교 집단 = 탐색에서 찾은 영상 전부(.cache) 중 이 조건 — '성공 vs 나머지' 성공 비율을 셈
MAX_AGE_DAYS = 365
MAX_SUBS = 50000
MIN_MINUTES = 4.0
PER_CHANNEL = 5           # 한 채널은 최근 영상 5개까지 (채널을 통째로 추가하면 그 채널이 비교를 덮던 것 — 2026-10-14 경제해적단 45/88)
MIN_GROUP = 15            # 이보다 적은 묶음은 '표본 적음' 으로 표시
NOTABLE_DIFF = 0.10       # 성공 비율 차이가 이만큼(10%p) 넘고 양쪽 다 MIN_GROUP 이상이면 '눈에 띔' 표시 (규칙이 아니라 표시)

[demand]                  # 수요와 공급 (analysis.md 3번)
RECENT_DAYS = 90          # '시장' = 최근 90일에 올라온 영상 (채널 크기 상관없음) — 수요 = 하루 조회수, 공급 = 영상 수
AUTOCOMPLETE_TOP = 30     # 자동완성 말 중 '틈'(수요 점수 ÷ (1 + 최근 영상)) 큰 순으로 몇 개를 보일지
GAP_VERIFY_N = 10         # 웹 화면 [공급 확인]이 한 번에 검색할 말 수 (말 하나 = 검색 1번 = 100단위, ⚠️ 할당량)
# 자동완성 말 중 '찾는 주제'가 아닌 것 (이 글자가 들면 뺌) — 채널 이름도 저절로 뺌 (2026-10-14 결과: 롤체·실시간·전망이 위에 있었음)
AC_EXCLUDE = ["실시간", "라이브", "전망", "시황", "속보", "뉴스", "롤체", "자격증", "운용사", "주가"]

[growth]                  # 구독자 — 빨리 크는 작은 채널 (analysis.md 7번)
NEW_CHANNEL_MONTHS = 24   # 개설 24개월 안
MIN_SUBS = 1000           # 구독자 1,000 이상
MAX_SUBS = 200000         # 구독자 20만 이하 (작은 채널 — 연예인·방송사 채널이 위를 덮던 것)
MIN_TOPIC_VIDEOS = 2      # 제목에 주제 낱말이 든 영상을 2개 이상 본 채널만 (아이돌·가족 사연 채널이 한 영상으로 끼던 것)
TOP = 25                  # 월 구독자 증가 순 몇 곳

[baseline]                # 같은 채널 기준선 (analysis.md 1-2번) — 웹 화면이 승인·켤 때 채널 최근 영상 50개를 받음 (채널 하나 약 2단위)
MIN_VIDEOS = 5            # 채널 평소 영상이 이만큼 있어야 '채널 평소 대비'를 셈
MIN_AGE_DAYS = 7          # 올린 지 7일 안 된 영상은 조회수가 아직 덜 쌓여 뺌
MAX_AGE_DAYS = 365
HIT = 3.0                 # 채널 중앙값의 ×3 넘으면 '잘된 영상'
NORMAL_LO = 0.5           # ×0.5~1.5 는 '평소 영상'
NORMAL_HI = 1.5
PER_CHANNEL = 5           # 채널마다 잘된 영상·평소 영상 몇 개까지 (한 채널이 덮지 않게)
PAIRS = 20                # 성공 사례와 같은 채널 평소 영상 짝 (제목·썸네일) 몇 개

[format]                  # 형식(포맷) — 제목·채널 이름·태그(없으면 설명 앞 150자) 낱말로, 위에서부터 먼저 맞는 것 하나. 어디에도 안 맞으면 '정보·해설 (그 밖)'
# (analysis.md 2-2번·성공 사례 표 '형식' 칸) 원인이 아니라 '어떤 모양의 영상인가' 묶음 — 대본이 없어도 내용 구성을 가늠하려고
"사연·드라마" = '사연|참교육|복수극|며느리|시어머니|시댁|재벌|실화|막장|독백|드라마'
"오디오북·낭독 (명언·인생조언)" = '오디오북|명언|인생 ?조언|낭독|인생 ?수업|지혜|심리학|철학|라디오'
"인터뷰·강연·대담" = '인터뷰|대담|특강|강연|강의|토론|전문가 ?초대|풀영상|통합본|\(\d부\)|ft\.|feat|(교수|박사|소장|단장|부사장|애널리스트|위원|머니트레이너)(님)?(\s|$|\)|\]|ㅣ|∣|\|)|\[[^\]]{1,12}(대표|이사|본부장|센터장)\]|[가-힣]{2,4} (대표|이사|본부장|센터장)(님)?\s*($|\)|ㅣ|∣|\|)'
"브이로그·직접 해본 이야기" = '브이로그|vlog|직접 ?해(보|봤)|해봤|모아봤|후기|일상|가계부|살림|(월급|수익|계좌|포트폴리오|자산) ?공개'

[exclude]                 # 성공 사례·비교 집단에서 뺄 영상
# 사용자가 뺀 주제 (2026-10-13 — tag_rules.toml 의 부동산·코인 묶음) + 땅·전원주택 매물. 제목에 있으면 뺌
OFF_TOPIC = ["부동산", "아파트", "청약", "전세", "월세", "집값", "갭투자", "재건축", "빌라", "전원주택", "토지", "매물", "분양", "내집마련", "내 집 마련", "집 마련",
             "비트코인", "코인", "가상자산", "암호화폐",
             # v1.2: 재테크가 아닌 것 — 도박(제목에 '재테크'를 붙인 토토)·스포츠 소식(구단 이름의 '저축은행')·괴담
             "토토", "프로토", "카지노", "바카라", "배구", "야구", "축구", "괴담"]
# 주제 묶음(tag_rules.toml TAG_THEMES)이 이것이면 뺌 — 제목엔 없고 태그로만 그 주제인 영상까지
OFF_TOPIC_THEMES = ["5. 부동산", "9. 코인"]
# 광고 의심 = 조회수가 이만큼 넘는데 좋아요·댓글이 거의 없음 (분석기 AD_SUSPECT_* 와 같은 값 — 두 조건 모두)
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025      # 좋아요/조회수 < 0.25%
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005  # 댓글/조회수 < 0.005%
