<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"jakku-juneun-2026-11-25","topic":"psychology","duration":476.35,"audio":"../../../psychology/source/jakku-juneun-2026-11-25/narration.mp3","thumb":null,"synced":"2026-11-26T11:05:12Z","tts":"2026-11-26T11:04:02","script_sha1":"5e6e255ac11e8836","sent":[{"n":1,"part":"도입","text":"필요 없다는데도 '너 주려고 챙겼지' 하면서, 자꾸 선물을 쥐여 주는 사람 있으시죠?","start":0.3,"end":5.642},{"n":2,"part":"도입","text":"마음은 고마운데, 집에 오면 이걸 어디에 둘지부터 고민됩니다.","start":6.022,"end":9.879},{"n":3,"part":"도입","text":"그런데 거절까지 했는데, 왜 자꾸 줄까요?","start":10.259,"end":12.913},{"n":4,"part":"도입","text":"여기에는 겉으로 잘 드러나지 않는 심리가 있을 수 있습니다.","start":13.293,"end":16.353},{"n":5,"part":"도입","text":"오늘은 자꾸 주는 사람의 심리 세 가지와, 받는 쪽은 왜 불편한지를 하나씩 짚어 보겠습니다.","start":16.733,"end":22.567},{"n":6,"part":"도입","text":"그리고 상대 마음은 지키면서, 편하게 거절하려면 어떻게 말해야 하는지도 짚어 보겠습니다.","start":22.947,"end":28.462},{"n":7,"part":"이유 1. 버리기 아까워서","text":"첫 번째 이유는, 버리기 아까워서입니다.","start":29.462,"end":32.14},{"n":8,"part":"이유 1. 버리기 아까워서","text":"물론 자꾸 준다고 해서, 나쁜 마음으로 주는 건 아닙니다.","start":32.52,"end":35.882},{"n":9,"part":"이유 1. 버리기 아까워서","text":"정으로, 나누며 살라고 배운 습관으로, 또 이웃과 말 한마디 나누고 싶어서 주는 분도 많습니다.","start":36.262,"end":42.363},{"n":10,"part":"이유 1. 버리기 아까워서","text":"가족이라면, 잘 챙겨 먹는지 걱정돼서 주는 분도 많습니다.","start":42.743,"end":46.583},{"n":11,"part":"이유 1. 버리기 아까워서","text":"그런데 집에 있던 음식이나 물건을 자꾸 준다면, 그 밑에는 버리기 아까운 마음이 있을 수 있습니다.","start":46.963,"end":53.04},{"n":12,"part":"이유 1. 버리기 아까워서","text":"예를 들어, 명절을 앞두고 냉동실을 정리하는 사람이 있다고 해 볼까요.","start":53.42,"end":57.689},{"n":13,"part":"이유 1. 버리기 아까워서","text":"작년에 얼려 둔 떡과, 언제 넣었는지 모를 생선이 나옵니다.","start":58.069,"end":61.649},{"n":14,"part":"이유 1. 버리기 아까워서","text":"먹을 것 같지는 않은데, 버리자니 아깝습니다.","start":62.029,"end":64.983},{"n":15,"part":"이유 1. 버리기 아까워서","text":"이때 '옆집에 주면 되겠다' 하는 생각이 들면, 마음이 한결 가벼워집니다.","start":65.363,"end":69.78},{"n":16,"part":"이유 1. 버리기 아까워서","text":"버리면 낭비지만, 주면 나눔이 되니까요.","start":70.16,"end":72.82},{"n":17,"part":"이유 1. 버리기 아까워서","text":"2019년 네덜란드 연구팀은, 아직 쓸 수 있는 물건을 버릴 때 드는 마음을 세 번의 실험으로 살펴봤습니다.","start":73.2,"end":79.75},{"n":18,"part":"이유 1. 버리기 아까워서","text":"그런 물건을 버리는 상황에서, 사람들은 불편함을 느꼈습니다.","start":80.13,"end":84.11},{"n":19,"part":"이유 1. 버리기 아까워서","text":"연구팀은, '아깝다'는 마음과 '버린다'는 행동이 부딪혀서 불편해진다고 봤습니다.","start":84.49,"end":89.42},{"n":20,"part":"이유 1. 버리기 아까워서","text":"연구가 직접 본 것은 아니지만, 남에게 주면 버리지 않아도 되니 이 불편함을 피하는 길이 될 수 있습니다.","start":89.8,"end":95.646},{"n":21,"part":"이유 1. 버리기 아까워서","text":"실제로 음식을 버리는 게 죄스러워서, 차라리 남에게 주는 분도 있습니다.","start":96.026,"end":100.437},{"n":22,"part":"이유 1. 버리기 아까워서","text":"그런데 받은 사람도 먹지 않는다면, 버리는 일이 받는 집으로 옮겨 갈 뿐일 수 있습니다.","start":100.817,"end":105.617},{"n":23,"part":"이유 1. 버리기 아까워서","text":"그러면 받은 사람도 같은 불편함을 겪게 됩니다.","start":105.997,"end":108.445},{"n":24,"part":"이유 1. 버리기 아까워서","text":"그리고 버리지 않고 둘 곳을 찾다 보니, 한 번 사양해도 다른 날 또 권하게 될 수 있습니다.","start":108.825,"end":114.259},{"n":25,"part":"이유 1. 버리기 아까워서","text":"버리기 아까운 마음, 이것이 자꾸 주는 첫 번째 이유일 수 있습니다.","start":114.639,"end":118.664},{"n":26,"part":"이유 1. 버리기 아까워서","text":"그런데 받는 사람이 이렇게 불편해한다는 걸, 주는 사람은 왜 잘 모를까요?","start":119.044,"end":123.884},{"n":27,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"두 번째 이유는, 받은 뒤의 일이 주는 사람에게는 잘 안 보이기 쉬워서입니다.","start":124.884,"end":129.517},{"n":28,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"2016년 미국 연구자들은 선물에 관한 여러 연구를 모아 정리했습니다.","start":129.897,"end":134.265},{"n":29,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"주는 사람은 선물을 건네는 그 순간, 상대가 반가워할 얼굴을 떠올립니다.","start":134.645,"end":139.233},{"n":30,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"반면 받는 사람은 그 물건을 집에 가져간 뒤, 얼마나 쓸모 있을지를 더 따집니다.","start":139.613,"end":144.783},{"n":31,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"그래서 주는 사람에게는 '고마워요' 하는 얼굴이 남습니다.","start":145.163,"end":148.403},{"n":32,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"하지만 필요 없는 물건이라면, 받는 사람에게는 냉장고 자리와 버리는 일이 남습니다.","start":148.783,"end":154.103},{"n":33,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"2011년 미국 연구팀의 실험에서는, 받는 사람은 자기가 부탁한 선물을 더 고마워했습니다.","start":154.483,"end":160.263},{"n":34,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"그런데 주는 쪽은 거꾸로, 말 안 해도 알아서 챙겨 줘야 더 감동할 거라고 생각했습니다.","start":160.643,"end":166.157},{"n":35,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"이건 선물 실험이지만, 일상에서도 비슷한 일이 생길 수 있습니다.","start":166.537,"end":170.692},{"n":36,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"말 안 해도 챙겨 주는 게 정이라고 생각하면, 필요 없다는 사람에게도 자꾸 챙겨 주게 되기 쉽습니다.","start":171.072,"end":176.68},{"n":37,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"게다가 우리말 '괜찮아요'는 예의로 사양할 때도 쓰다 보니, 주는 쪽에는 진짜 거절로 들리지 않을 수 있습니다.","start":177.06,"end":183.481},{"n":38,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"정리하면, 주는 사람은 상대가 웃으며 받는 모습을 먼저 보게 되고, 그 물건이 집에 가서 어떻게 되는지는 모르기 쉽습니다.","start":183.861,"end":191.399},{"n":39,"part":"이유 2. 받은 뒤의 일은 안 보여서","text":"그렇다면 상대가 '괜찮아요' 하고 사양해도, 왜 또 주고 싶어질까요?","start":191.779,"end":196.092},{"n":40,"part":"이유 3. 주고 나면 기분이 좋아서","text":"세 번째 이유는, 주고 나면 기분이 좋아서일 수 있습니다.","start":197.092,"end":200.532},{"n":41,"part":"이유 3. 주고 나면 기분이 좋아서","text":"2020년 캐나다와 미국 실험에서는, 남을 위해 돈을 쓰게 한 사람이 대체로 조금 더 행복하다고 답했습니다.","start":200.912,"end":207.007},{"n":42,"part":"이유 3. 주고 나면 기분이 좋아서","text":"돈을 쓴 실험이라 똑같지는 않지만, 반찬을 건네고 돌아서는 길이 뿌듯한 것도 비슷한 마음일 수 있습니다.","start":207.387,"end":213.574},{"n":43,"part":"이유 3. 주고 나면 기분이 좋아서","text":"특별한 이유 없이, 그냥 주고 싶어서 주는 분도 많습니다.","start":213.954,"end":217.414},{"n":44,"part":"이유 3. 주고 나면 기분이 좋아서","text":"이런 마음이 나쁜 것은 아닙니다.","start":217.794,"end":219.564},{"n":45,"part":"이유 3. 주고 나면 기분이 좋아서","text":"다만 기쁨이 주는 쪽에서 생기다 보니, 상대가 사양해도 또 주고 싶어질 수 있습니다.","start":219.944,"end":224.985},{"n":46,"part":"이유 3. 주고 나면 기분이 좋아서","text":"주는 사람은 뿌듯해도, 필요 없는 걸 갑자기 받는 사람은 불편할 수 있습니다.","start":225.365,"end":230.318},{"n":47,"part":"이유 3. 주고 나면 기분이 좋아서","text":"주고 나면 내 기분이 좋아진다는 것, 이것이 세 번째 이유일 수 있습니다.","start":230.698,"end":235.039},{"n":48,"part":"이유 3. 주고 나면 기분이 좋아서","text":"그런데 주는 쪽은 이렇게 기분이 좋은데, 받는 쪽은 왜 이렇게까지 불편할까요?","start":235.419,"end":240.209},{"n":49,"part":"받는 쪽이 불편한 이유","text":"받는 쪽이 불편한 이유는, 크게 세 가지로 나눠 볼 수 있습니다.","start":241.209,"end":244.779},{"n":50,"part":"받는 쪽이 불편한 이유","text":"첫째, 받았으니 뭔가 돌려줘야 할 것 같은 부담입니다.","start":245.159,"end":248.657},{"n":51,"part":"받는 쪽이 불편한 이유","text":"필요 없는 걸 받았는데, 답례하느라 내 돈이 나가기도 합니다.","start":249.037,"end":252.745},{"n":52,"part":"받는 쪽이 불편한 이유","text":"둘째, 먹지도 쓰지도 않을 것을 버리는 죄책감입니다.","start":253.125,"end":256.872},{"n":53,"part":"받는 쪽이 불편한 이유","text":"셋째, 거절하면 상대가 서운해할까 봐 보게 되는 눈치입니다.","start":257.252,"end":261.062},{"n":54,"part":"받는 쪽이 불편한 이유","text":"식단을 조절하거나, 물건을 줄이며 사는 분에게는 이 부담이 더 클 수 있습니다.","start":261.442,"end":266.256},{"n":55,"part":"받는 쪽이 불편한 이유","text":"그리고 소비기한이 지난 음식은, 마음의 문제가 아니라 안전의 문제입니다.","start":266.636,"end":271.166},{"n":56,"part":"받는 쪽이 불편한 이유","text":"소비기한은 보관 방법을 지켰을 때, 먹어도 되는 기한입니다.","start":271.546,"end":275.346},{"n":57,"part":"받는 쪽이 불편한 이유","text":"그래서 소비기한이 지난 음식은, 아깝더라도 먹지 않는 것이 안전합니다.","start":275.726,"end":279.967},{"n":58,"part":"받는 쪽이 불편한 이유","text":"그렇다면 상대 마음은 다치지 않게, 어떻게 거절하면 좋을까요?","start":280.347,"end":284.243},{"n":59,"part":"서운하지 않게 거절하는 말","text":"서운하지 않게 거절하는 말, 첫째는 물건 말고 내 사정을 이유로 대는 겁니다.","start":285.243,"end":290.163},{"n":60,"part":"서운하지 않게 거절하는 말","text":"'이게 별로예요'가 아니라, 실제 내 사정을 말하는 겁니다.","start":290.543,"end":294.143},{"n":61,"part":"서운하지 않게 거절하는 말","text":"그리고 사양으로만 들릴 수 있는 '괜찮아요'보다는, 분명하게 말하는 게 좋습니다.","start":294.523,"end":299.023},{"n":62,"part":"서운하지 않게 거절하는 말","text":"'마음은 정말 고마워요. 그런데 이건 사양할게요'처럼 말한 뒤 사정을 붙이면 됩니다.","start":299.403,"end":304.907},{"n":63,"part":"서운하지 않게 거절하는 말","text":"예를 들어 '요즘 식단을 조절하고 있어서요', '집에 둘 자리가 없어서요'처럼요.","start":305.287,"end":310.196},{"n":64,"part":"서운하지 않게 거절하는 말","text":"그러면 상대의 마음을 탓하지 않고도 거절할 수 있습니다.","start":310.576,"end":313.532},{"n":65,"part":"서운하지 않게 거절하는 말","text":"둘째, 계속 주고받는 사이라 받고 싶은 것이 하나라도 있다면, 그것 하나만 콕 집어 말합니다.","start":313.912,"end":319.92},{"n":66,"part":"서운하지 않게 거절하는 말","text":"앞에서 본 2011년 연구에는 이런 결과도 있었습니다.","start":320.3,"end":323.894},{"n":67,"part":"서운하지 않게 거절하는 말","text":"받는 사람이 원하는 걸 하나만 콕 집어 말해 줬을 때, 주는 사람은 상대가 얼마나 반가워할지 더 잘 알아맞혔습니다.","start":324.274,"end":331.573},{"n":68,"part":"서운하지 않게 거절하는 말","text":"여러 개를 늘어놓았을 때보다요.","start":331.953,"end":333.623},{"n":69,"part":"서운하지 않게 거절하는 말","text":"'주시려면, 저는 귤 두세 개가 제일 반가워요'처럼, 반가운 것을 하나만 정해 주는 겁니다.","start":334.003,"end":339.673},{"n":70,"part":"서운하지 않게 거절하는 말","text":"여기에 하나 더 하자면, '두세 개'처럼 양까지 말해 두면 나머지를 사양하기도 편합니다.","start":340.053,"end":345.232},{"n":71,"part":"서운하지 않게 거절하는 말","text":"아무것도 필요 없다면, 첫째처럼 내 사정만 말해도 충분합니다.","start":345.612,"end":349.791},{"n":72,"part":"서운하지 않게 거절하는 말","text":"말 한마디 나누고 싶어서 주시는 분이라면, 물건은 사양해도 안부와 이야기는 반갑게 받아 주세요.","start":350.171,"end":355.745},{"n":73,"part":"서운하지 않게 거절하는 말","text":"셋째, 소비기한이 지난 음식은 안전 문제라, 짧고 분명하게 말합니다.","start":356.125,"end":360.652},{"n":74,"part":"서운하지 않게 거절하는 말","text":"'소비기한이 지나서 저는 못 먹어요. 마음만 받을게요.'","start":361.032,"end":364.731},{"n":75,"part":"서운하지 않게 거절하는 말","text":"날짜를 모르는 냉동 음식이라면, '언제 얼린 건지 몰라서 저는 못 먹겠어요'라고 하면 됩니다.","start":365.111,"end":370.59},{"n":76,"part":"서운하지 않게 거절하는 말","text":"넷째, 그래도 계속 주시면, 같은 말을 같은 말투로 짧게 되풀이합니다.","start":370.97,"end":375.514},{"n":77,"part":"서운하지 않게 거절하는 말","text":"이유를 매번 새로 대면, 그 이유만 피해서 다시 권하는 경우가 있기 때문입니다.","start":375.894,"end":380.916},{"n":78,"part":"서운하지 않게 거절하는 말","text":"이미 받아 왔다면, 억지로 먹거나 쌓아 둘 필요는 없습니다.","start":381.296,"end":385.127},{"n":79,"part":"서운하지 않게 거절하는 말","text":"아직 쓸 만한 물건이라면, 원하는 사람이 직접 골라 가는 나눔 장터에 내놓아도 됩니다.","start":385.507,"end":390.978},{"n":80,"part":"서운하지 않게 거절하는 말","text":"먹을 수 있는 음식이라면 먹겠다는 사람에게 물어보고 나누고, 그래도 남으면 버려도 괜찮습니다.","start":391.358,"end":397.228},{"n":81,"part":"서운하지 않게 거절하는 말","text":"준 사람의 마음은 고맙다는 인사로 받았고, 물건까지 다 떠안을 의무는 없으니까요.","start":397.608,"end":402.578},{"n":82,"part":"서운하지 않게 거절하는 말","text":"그런데 혹시, 여기까지 들으면서 '어, 이거 내 얘긴가?' 싶었던 분도 계시지 않나요?","start":402.958,"end":408.387},{"n":83,"part":"내가 주는 쪽이라면","text":"내가 주는 쪽이라면, 그 마음은 소중합니다.","start":409.387,"end":412.2},{"n":84,"part":"내가 주는 쪽이라면","text":"다만 건네기 전에, 세 가지만 확인해 보세요.","start":412.58,"end":415.23},{"n":85,"part":"내가 주는 쪽이라면","text":"첫째, 상대에게 먼저 물어봤나요?","start":415.61,"end":417.784},{"n":86,"part":"내가 주는 쪽이라면","text":"'이거 쓰실래요?' 한마디면 됩니다.","start":418.164,"end":420.334},{"n":87,"part":"내가 주는 쪽이라면","text":"상대가 '괜찮아요' 하면, 예의로 하는 말이라 여기지 말고 한 번에 거절로 들어 주세요.","start":420.714,"end":426.108},{"n":88,"part":"내가 주는 쪽이라면","text":"'그럼 필요하실 때 말씀해 주세요' 하고 거두면, 서운할 일도 줄어듭니다.","start":426.488,"end":430.808},{"n":89,"part":"내가 주는 쪽이라면","text":"둘째, 상대가 요즘 쓰거나 먹는 물건인가요?","start":431.188,"end":434.092},{"n":90,"part":"내가 주는 쪽이라면","text":"셋째, 내가 받아도 반가울 만큼 상태가 좋은가요?","start":434.472,"end":437.634},{"n":91,"part":"내가 주는 쪽이라면","text":"남에게 줄 때는 제일 좋은 걸 주라는, 어른들 말씀도 있지요.","start":438.014,"end":441.794},{"n":92,"part":"내가 주는 쪽이라면","text":"셋 다 그렇다면, 적어도 상대가 곤란해할 일은 줄어듭니다.","start":442.174,"end":445.942},{"n":93,"part":"내가 주는 쪽이라면","text":"그리고 상대가 거절한다면, 그건 내 마음을 거절한 게 아니라 물건 하나를 사양한 것뿐입니다.","start":446.322,"end":452.172},{"n":94,"part":"내가 주는 쪽이라면","text":"물어봤는데 받을 사람이 없다면, 쓸 만한 물건은 나눔 장터나 기부하는 곳을 찾아보는 것도 방법입니다.","start":452.552,"end":458.645},{"n":95,"part":"내가 주는 쪽이라면","text":"다만 소비기한이 지난 음식은, 나누지 말고 버리는 것이 맞습니다.","start":459.025,"end":463.015},{"n":96,"part":"마무리","text":"주는 쪽이라면, 건네기 전에 한 번만 물어봐 주세요.","start":464.015,"end":467.202},{"n":97,"part":"마무리","text":"받는 쪽이라면, 내 사정을 이유로 짧게 거절해도 괜찮습니다.","start":467.582,"end":471.542},{"n":98,"part":"마무리","text":"시청해주셔서 감사합니다.","start":471.922,"end":473.452}],"subs":[[0.2,6.022,"필요 없다는데도 '너 주려고 챙겼지' 하면서,\n자꾸 선물을 쥐여 주는 사람 있으시죠?"],[6.022,10.259,"마음은 고마운데, 집에 오면 이걸 어디에 둘지부터 고민됩니다."],[10.259,13.293,"그런데 거절까지 했는데, 왜 자꾸 줄까요?"],[13.293,16.733,"여기에는 겉으로 잘 드러나지 않는 심리가 있을 수 있습니다."],[16.733,22.947,"오늘은 자꾸 주는 사람의 심리 세 가지와,\n받는 쪽은 왜 불편한지를 하나씩 짚어 보겠습니다."],[22.947,29.462,"그리고 상대 마음은 지키면서,\n편하게 거절하려면 어떻게 말해야 하는지도 짚어 보겠습니다."],[29.462,32.52,"첫 번째 이유는, 버리기 아까워서입니다."],[32.52,36.262,"물론 자꾸 준다고 해서, 나쁜 마음으로 주는 건 아닙니다."],[36.262,42.743,"정으로, 나누며 살라고 배운 습관으로,\n또 이웃과 말 한마디 나누고 싶어서 주는 분도 많습니다."],[42.743,46.963,"가족이라면, 잘 챙겨 먹는지 걱정돼서 주는 분도 많습니다."],[46.963,53.42,"그런데 집에 있던 음식이나 물건을 자꾸 준다면,\n그 밑에는 버리기 아까운 마음이 있을 수 있습니다."],[53.42,58.069,"예를 들어, 명절을 앞두고 냉동실을 정리하는 사람이 있다고 해 볼까요."],[58.069,62.029,"작년에 얼려 둔 떡과, 언제 넣었는지 모를 생선이 나옵니다."],[62.029,65.363,"먹을 것 같지는 않은데, 버리자니 아깝습니다."],[65.363,70.16,"이때 '옆집에 주면 되겠다' 하는 생각이 들면,\n마음이 한결 가벼워집니다."],[70.16,73.2,"버리면 낭비지만, 주면 나눔이 되니까요."],[73.2,80.13,"2019년 네덜란드 연구팀은, 아직 쓸 수 있는 물건을\n버릴 때 드는 마음을 세 번의 실험으로 살펴봤습니다."],[80.13,84.49,"그런 물건을 버리는 상황에서, 사람들은 불편함을 느꼈습니다."],[84.49,89.8,"연구팀은,\n'아깝다'는 마음과 '버린다'는 행동이 부딪혀서 불편해진다고 봤습니다."],[89.8,96.026,"연구가 직접 본 것은 아니지만, 남에게 주면 버리지 않아도\n되니 이 불편함을 피하는 길이 될 수 있습니다."],[96.026,100.817,"실제로 음식을 버리는 게 죄스러워서,\n차라리 남에게 주는 분도 있습니다."],[100.817,105.997,"그런데 받은 사람도 먹지 않는다면,\n버리는 일이 받는 집으로 옮겨 갈 뿐일 수 있습니다."],[105.997,108.825,"그러면 받은 사람도 같은 불편함을 겪게 됩니다."],[108.825,114.639,"그리고 버리지 않고 둘 곳을 찾다 보니,\n한 번 사양해도 다른 날 또 권하게 될 수 있습니다."],[114.639,119.044,"버리기 아까운 마음, 이것이 자꾸 주는 첫 번째 이유일 수 있습니다."],[119.044,124.884,"그런데 받는 사람이 이렇게 불편해한다는 걸,\n주는 사람은 왜 잘 모를까요?"],[124.884,129.897,"두 번째 이유는,\n받은 뒤의 일이 주는 사람에게는 잘 안 보이기 쉬워서입니다."],[129.897,134.645,"2016년 미국 연구자들은 선물에 관한 여러 연구를 모아 정리했습니다."],[134.645,139.613,"주는 사람은 선물을 건네는 그 순간,\n상대가 반가워할 얼굴을 떠올립니다."],[139.613,145.163,"반면 받는 사람은 그 물건을 집에 가져간 뒤,\n얼마나 쓸모 있을지를 더 따집니다."],[145.163,148.783,"그래서 주는 사람에게는 '고마워요' 하는 얼굴이 남습니다."],[148.783,154.483,"하지만 필요 없는 물건이라면,\n받는 사람에게는 냉장고 자리와 버리는 일이 남습니다."],[154.483,160.643,"2011년 미국 연구팀의 실험에서는,\n받는 사람은 자기가 부탁한 선물을 더 고마워했습니다."],[160.643,166.537,"그런데 주는 쪽은 거꾸로,\n말 안 해도 알아서 챙겨 줘야 더 감동할 거라고 생각했습니다."],[166.537,171.072,"이건 선물 실험이지만, 일상에서도 비슷한 일이 생길 수 있습니다."],[171.072,177.06,"말 안 해도 챙겨 주는 게 정이라고 생각하면,\n필요 없다는 사람에게도 자꾸 챙겨 주게 되기 쉽습니다."],[177.06,183.861,"게다가 우리말 '괜찮아요'는 예의로 사양할 때도 쓰다 보니,\n주는 쪽에는 진짜 거절로 들리지 않을 수 있습니다."],[183.861,191.779,"정리하면, 주는 사람은 상대가 웃으며 받는 모습을 먼저 보게 되고,\n그 물건이 집에 가서 어떻게 되는지는 모르기 쉽습니다."],[191.779,197.092,"그렇다면 상대가 '괜찮아요' 하고 사양해도, 왜 또 주고 싶어질까요?"],[197.092,200.912,"세 번째 이유는, 주고 나면 기분이 좋아서일 수 있습니다."],[200.912,207.387,"2020년 캐나다와 미국 실험에서는,\n남을 위해 돈을 쓰게 한 사람이 대체로 조금 더 행복하다고 답했습니다."],[207.387,213.954,"돈을 쓴 실험이라 똑같지는 않지만,\n반찬을 건네고 돌아서는 길이 뿌듯한 것도 비슷한 마음일 수 있습니다."],[213.954,217.794,"특별한 이유 없이, 그냥 주고 싶어서 주는 분도 많습니다."],[217.794,219.944,"이런 마음이 나쁜 것은 아닙니다."],[219.944,225.365,"다만 기쁨이 주는 쪽에서 생기다 보니,\n상대가 사양해도 또 주고 싶어질 수 있습니다."],[225.365,230.698,"주는 사람은 뿌듯해도,\n필요 없는 걸 갑자기 받는 사람은 불편할 수 있습니다."],[230.698,235.419,"주고 나면 내 기분이 좋아진다는 것,\n이것이 세 번째 이유일 수 있습니다."],[235.419,241.209,"그런데 주는 쪽은 이렇게 기분이 좋은데,\n받는 쪽은 왜 이렇게까지 불편할까요?"],[241.209,245.159,"받는 쪽이 불편한 이유는, 크게 세 가지로 나눠 볼 수 있습니다."],[245.159,249.037,"첫째, 받았으니 뭔가 돌려줘야 할 것 같은 부담입니다."],[249.037,253.125,"필요 없는 걸 받았는데, 답례하느라 내 돈이 나가기도 합니다."],[253.125,257.252,"둘째, 먹지도 쓰지도 않을 것을 버리는 죄책감입니다."],[257.252,261.442,"셋째, 거절하면 상대가 서운해할까 봐 보게 되는 눈치입니다."],[261.442,266.636,"식단을 조절하거나,\n물건을 줄이며 사는 분에게는 이 부담이 더 클 수 있습니다."],[266.636,271.546,"그리고 소비기한이 지난 음식은,\n마음의 문제가 아니라 안전의 문제입니다."],[271.546,275.726,"소비기한은 보관 방법을 지켰을 때, 먹어도 되는 기한입니다."],[275.726,280.347,"그래서 소비기한이 지난 음식은,\n아깝더라도 먹지 않는 것이 안전합니다."],[280.347,285.243,"그렇다면 상대 마음은 다치지 않게, 어떻게 거절하면 좋을까요?"],[285.243,290.543,"서운하지 않게 거절하는 말,\n첫째는 물건 말고 내 사정을 이유로 대는 겁니다."],[290.543,294.523,"'이게 별로예요'가 아니라, 실제 내 사정을 말하는 겁니다."],[294.523,299.403,"그리고 사양으로만 들릴 수 있는 '괜찮아요'보다는,\n분명하게 말하는 게 좋습니다."],[299.403,305.287,"'마음은 정말 고마워요. 그런데\n이건 사양할게요'처럼 말한 뒤 사정을 붙이면 됩니다."],[305.287,310.576,"예를 들어 '요즘 식단을 조절하고 있어서요',\n'집에 둘 자리가 없어서요'처럼요."],[310.576,313.912,"그러면 상대의 마음을 탓하지 않고도 거절할 수 있습니다."],[313.912,320.3,"둘째, 계속 주고받는 사이라 받고 싶은 것이 하나라도 있다면,\n그것 하나만 콕 집어 말합니다."],[320.3,324.274,"앞에서 본 2011년 연구에는 이런 결과도 있었습니다."],[324.274,331.953,"받는 사람이 원하는 걸 하나만 콕 집어 말해 줬을 때,\n주는 사람은 상대가 얼마나 반가워할지 더 잘 알아맞혔습니다."],[331.953,334.003,"여러 개를 늘어놓았을 때보다요."],[334.003,340.053,"'주시려면, 저는 귤 두세 개가 제일 반가워요'처럼,\n반가운 것을 하나만 정해 주는 겁니다."],[340.053,345.612,"여기에 하나 더 하자면,\n'두세 개'처럼 양까지 말해 두면 나머지를 사양하기도 편합니다."],[345.612,350.171,"아무것도 필요 없다면, 첫째처럼 내 사정만 말해도 충분합니다."],[350.171,356.125,"말 한마디 나누고 싶어서 주시는 분이라면,\n물건은 사양해도 안부와 이야기는 반갑게 받아 주세요."],[356.125,361.032,"셋째, 소비기한이 지난 음식은 안전 문제라, 짧고 분명하게 말합니다."],[361.032,365.111,"'소비기한이 지나서 저는 못 먹어요. 마음만 받을게요.'"],[365.111,370.97,"날짜를 모르는 냉동 음식이라면,\n'언제 얼린 건지 몰라서 저는 못 먹겠어요'라고 하면 됩니다."],[370.97,375.894,"넷째, 그래도 계속 주시면, 같은 말을 같은 말투로 짧게 되풀이합니다."],[375.894,381.296,"이유를 매번 새로 대면,\n그 이유만 피해서 다시 권하는 경우가 있기 때문입니다."],[381.296,385.507,"
