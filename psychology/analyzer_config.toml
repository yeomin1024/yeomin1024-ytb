# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 심리 (폴더 psychology)
# VERSION: v1.0 — 2026-11-11 — 새로 만듦 (사용자 지시 2026-11-11: "가장 최근에 주식 주제에서 했던 것처럼 심리 주제로 분석 코드 돌려서
#          해당 주제 유튜브 분석에 필요한 자료 받고 페르소나 구성해서 내가 어떤 제목, 썸네일 문구, 보조문구로 영상 만들어야 하는지 하나 알려줘봐").
#          값은 history/analyzer_config.toml v1.1 과 같고 주제 이름·폴더만 다름 (성공 사례 영상 파일은 받지 않음 · 외국 영상 꺼짐 = 한국어 시장).
#          검색어 = 같은 폴더 keywords.txt (한 줄에 하나 — tools/tag_keywords.py 가 실제 영상 태그로 고름), 관련어·제외어 = keywords.toml.
#          ⚖️ 판단 (Claude): '심리 주제' = 새 채널 분야 탐색 new/channel_ideas.md 3순위 '심리·인간관계' (심리학·인간관계·자존감·감정·성격) —
#          주식 투자 심리(stock/ 심리 테스트 편)가 아님. 사용자가 다른 범위를 말하면 keywords.toml·tag_rules.toml 을 고쳐 다시 탐색.
#
# ▶ 클라우드에서 (CLAUDE.md '분석' — 이 주제는 PC 웹 화면 탭을 켜지 않는다):
#      python3 tools/cloud_run.py psychology status | explore --weeks 26 | list --checked | uncheck ID… | approve | analyze | resume
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값 (우선순위: 코드 기본값 < 이 파일 < keywords.toml(목록만) < 명령줄)
# ※ 연구·교육용 분석 — 의료·심리 치료 권유가 아니다.
# =====================================================================================================

[topic]
TOPIC = "심리"
PROJECT_FOLDER = "psychology"        # 결과 상위 폴더 → GitHub: psychology/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"
INCLUDE_FOREIGN = false              # 한국어 영상만 (기본). 세계 시장까지 보려면 true + keywords_foreign.txt — 그때는 검색이 언어 지정 없이 새로

[keywords]
KEYWORD_MODE = "curated"
KEYWORDS_FILE = "keywords.toml"      # 관련어·제외어 목록 파일. 검색어는 keywords.txt (tools/tag_keywords.py 가 실제 영상 태그로 고름)

[ads]
AD_SUSPECT_FILTER = true             # 조회수는 많은데 좋아요·댓글이 거의 없는 영상(광고로 조회수를 산 것으로 의심) 제외
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
QUOTA_BUDGET = 6000                  # ⚠️ 비용 관련 (분석기 youtube_topic_analyzer.py 몫 — 클라우드 탐색은 cloud_run 이 남은 만큼)
DOWNLOAD_VIDEOS = false              # ⚠️ 성공사례 영상 파일은 받지 않음 (사용자 지시 2026-10-13) — 자막·썸네일·댓글·메타데이터만
