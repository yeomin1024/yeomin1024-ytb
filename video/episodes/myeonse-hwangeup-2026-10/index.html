77.062},{"n":19,"part":"첫째, 무엇이 바뀌나","text":"예를 들어 세금 포함 1만 1천 엔짜리를 사면, 그중 1천 엔이 소비세입니다.","start":77.512,"end":82.212},{"n":20,"part":"첫째, 무엇이 바뀌나","text":"매장은 이 구매 기록을 일본 국세청 시스템으로 보냅니다.","start":82.662,"end":86.055},{"n":21,"part":"첫째, 무엇이 바뀌나","text":"출국하는 날에는 공항 출발 로비의 면세 수속 단말기에 여권을 댑니다.","start":86.505,"end":90.653},{"n":22,"part":"첫째, 무엇이 바뀌나","text":"화면에 초록색이 뜨면 확인이 끝나요.","start":91.103,"end":93.288},{"n":23,"part":"첫째, 무엇이 바뀌나","text":"빨간색이 뜨면 세관 검사장에서 산 물건을 직접 보여 줘야 합니다.","start":93.738,"end":97.584},{"n":24,"part":"첫째, 무엇이 바뀌나","text":"나리타, 하네다, 간사이 등 일곱 개 공항에서는 휴대전화로도 수속할 수 있습니다.","start":98.034,"end":103.286},{"n":25,"part":"첫째, 무엇이 바뀌나","text":"공항 안 전용 와이파이 구역에서 비지트 재팬 웹에 접속하는 방식이에요.","start":103.736,"end":108.035},{"n":26,"part":"첫째, 무엇이 바뀌나","text":"세관 확인이 끝나면, 물건을 산 매장이나 매장이 맡긴 환급 업체가 돈을 돌려줍니다.","start":108.485,"end":113.638},{"n":27,"part":"첫째, 무엇이 바뀌나","text":"돌려받는 방법은 카드, 계좌 송금, 앱, 공항 현금 등 매장마다 다릅니다.","start":114.088,"end":118.835},{"n":28,"part":"첫째, 무엇이 바뀌나","text":"일본 정부는 수수료를 받지 않지만, 환급 업체의 수수료는 법으로 정해져 있지 않습니다.","start":119.285,"end":124.74},{"n":29,"part":"첫째, 무엇이 바뀌나","text":"그래서 수수료를 떼고 나면, 돌려받는 돈이 낸 세금보다 적을 수 있습니다.","start":125.19,"end":129.739},{"n":30,"part":"첫째, 무엇이 바뀌나","text":"오히려 편해지는 점도 있습니다.","start":130.189,"end":132.072},{"n":31,"part":"첫째, 무엇이 바뀌나","text":"같은 매장에서 하루에 세금 빼고 5,000엔 이상 사야 한다는 기준은 그대로입니다.","start":132.522,"end":137.524},{"n":32,"part":"첫째, 무엇이 바뀌나","text":"대신 과자나 화장품 같은 소모품과, 옷이나 가전 같은 일반 물품의 구분이 사라집니다.","start":137.974,"end":143.278},{"n":33,"part":"첫째, 무엇이 바뀌나","text":"그래서 둘을 합쳐 5,000엔 이상이면 돼요.","start":143.728,"end":146.314},{"n":34,"part":"첫째, 무엇이 바뀌나","text":"소모품은 50만 엔까지만 면세되던 상한도 없어집니다.","start":146.764,"end":150.157},{"n":35,"part":"첫째, 무엇이 바뀌나","text":"소모품을 밀봉 봉투에 담아 주던 특수 포장도 사라지고요.","start":150.607,"end":154},{"n":36,"part":"첫째, 무엇이 바뀌나","text":"다만 한 개에 세금 빼고 100만 엔 이상인 물건은 따로 기록합니다.","start":154.45,"end":158.145},{"n":37,"part":"첫째, 무엇이 바뀌나","text":"시리얼 번호처럼 그 물건을 알아볼 수 있는 정보를 남기는 거죠.","start":158.595,"end":162.29},{"n":38,"part":"첫째, 무엇이 바뀌나","text":"그렇다면 일본은 왜 이렇게 번거로운 방식으로 바꾸는 걸까요?","start":162.74,"end":166.435},{"n":39,"part":"둘째, 왜 바꾸나","text":"두 번째는 바꾸는 이유입니다.","start":167.435,"end":169.167},{"n":40,"part":"둘째, 왜 바꾸나","text":"일본 재무성은 면세로 산 물건을 일본 안에서 되파는 부정을 막기 위해서라고 설명합니다.","start":169.617,"end":174.973},{"n":41,"part":"둘째, 왜 바꾸나","text":"재무성이 2022년 4월부터 2년 동안의 기록을 정리한 자료가 있습니다.","start":175.423,"end":180.175},{"n":42,"part":"둘째, 왜 바꾸나","text":"그 기간에 한 번 입국해 1억 엔 이상 산 사람이 690명이었습니다.","start":180.625,"end":184.773},{"n":43,"part":"둘째, 왜 바꾸나","text":"이들이 산 금액은 합계 2,332억 엔입니다.","start":185.223,"end":188.564},{"n":44,"part":"둘째, 왜 바꾸나","text":"세관은 이 가운데 9할 가까이를 출국할 때 확인하지 못했습니다.","start":189.014,"end":192.86},{"n":45,"part":"둘째, 왜 바꾸나","text":"확인한 사람들은 거의 모두 물건을 가지고 있지 않아 세금이 매겨졌습니다.","start":193.31,"end":197.76},{"n":46,"part":"둘째, 왜 바꾸나","text":"하지만 거의 전부가 그 세금을 내지 않고 출국했습니다.","start":198.21,"end":201.452},{"n":47,"part":"둘째, 왜 바꾸나","text":"다만 자료에도 이들 모두가 부정이라고 할 수는 없다고 적혀 있습니다.","start":201.902,"end":206.05},{"n":48,"part":"둘째, 왜 바꾸나","text":"지금 방식은 세금을 빼고 먼저 팔기 때문에, 떠난 뒤에는 세금을 받아 내기 어렵습니다.","start":206.5,"end":211.804},{"n":49,"part":"둘째, 왜 바꾸나","text":"새 방식은 세금을 먼저 받아 두고, 물건을 가지고 나가는 게 확인된 사람에게만 돌려줍니다.","start":212.254,"end":217.86},{"n":50,"part":"둘째, 왜 바꾸나","text":"그럼 이 방식으로 정말 부정을 막을 수 있을까요?","start":218.31,"end":221.099},{"n":51,"part":"셋째, 정말 효과가 있을까","text":"세 번째는 효과입니다.","start":222.099,"end":223.378},{"n":52,"part":"셋째, 정말 효과가 있을까","text":"새 방식에서는 물건 없이 출국하면, 처음부터 환급이 되지 않습니다.","start":223.828,"end":228.075},{"n":53,"part":"셋째, 정말 효과가 있을까","text":"세금이 이미 걷혀 있으니, 떠난 사람을 쫓아가 세금을 받아 낼 일이 없어지는 거죠.","start":228.525,"end":233.527},{"n":54,"part":"셋째, 정말 효과가 있을까","text":"구조로만 보면, 자료에 나온 방식의 부정은 하기 어려워집니다.","start":233.977,"end":237.922},{"n":55,"part":"셋째, 정말 효과가 있을까","text":"다만 실제로 얼마나 줄었는지는 11월 이후의 자료가 나와야 알 수 있습니다.","start":238.372,"end":242.973},{"n":56,"part":"셋째, 정말 효과가 있을까","text":"걱정도 있습니다.","start":243.423,"end":244.4},{"n":57,"part":"셋째, 정말 효과가 있을까","text":"댓글처럼, 공항에서 수속하는 사람이 몰리면 줄이 길어질 수 있다는 겁니다.","start":244.85,"end":249.55},{"n":58,"part":"셋째, 정말 효과가 있을까","text":"이런 걱정 끝에 아예 면세를 없앤 나라도 있습니다.","start":250,"end":252.94},{"n":59,"part":"셋째, 정말 효과가 있을까","text":"영국은 2021년 1월, 관광객에게 매장 부가세를 돌려주던 제도를 없앴습니다.","start":253.39,"end":258.694},{"n":60,"part":"셋째, 정말 효과가 있을까","text":"영국 정부는 유지 비용이 크고 경제 효과가 분명하지 않다고 설명했습니다.","start":259.144,"end":263.594},{"n":61,"part":"셋째, 정말 효과가 있을까","text":"출국 지점의 업무 부담도 이유로 들었고요.","start":264.044,"end":266.531},{"n":62,"part":"셋째, 정말 효과가 있을까","text":"반면 소매업계는 씀씀이가 큰 관광객이 유럽 다른 나라로 간다며 반발했습니다.","start":266.981,"end":271.733},{"n":63,"part":"셋째, 정말 효과가 있을까","text":"일본은 면세를 없애지 않고, 돌려주는 방식만 바꾼 쪽입니다.","start":272.183,"end":275.977},{"n":64,"part":"셋째, 정말 효과가 있을까","text":"그럼 11월부터 공항과 매장에서는 실제로 어떤 일이 벌어질까요?","start":276.427,"end":280.424},{"n":65,"part":"넷째, 실제로 벌어질 상황","text":"네 번째는 실제로 벌어질 상황입니다.","start":281.424,"end":283.609},{"n":66,"part":"넷째, 실제로 벌어질 상황","text":"먼저 놓치면 환급을 못 받는 세 가지가 있습니다.","start":284.059,"end":286.848},{"n":67,"part":"넷째, 실제로 벌어질 상황","text":"하나, 짐을 맡기기 전에 세관 확인을 받아야 합니다.","start":287.298,"end":290.488},{"n":68,"part":"넷째, 실제로 벌어질 상황","text":"산 물건을 캐리어에 넣어 먼저 부치면, 세관 확인을 받을 수 없습니다.","start":290.938,"end":295.185},{"n":69,"part":"넷째, 실제로 벌어질 상황","text":"한 번 맡긴 짐은 되찾아 올 수도 없습니다.","start":295.635,"end":297.971},{"n":70,"part":"넷째, 실제로 벌어질 상황","text":"둘, 확인은 영수증 단위로 합니다.","start":298.421,"end":300.554},{"n":71,"part":"넷째, 실제로 벌어질 상황","text":"한 영수증에 든 물건 가운데 하나라도 없으면, 그 영수증 전체가 환급되지 않습니다.","start":301.004,"end":306.157},{"n":72,"part":"넷째, 실제로 벌어질 상황","text":"일본에서 먹거나 써 버린 물건도 환급받을 수 없습니다.","start":306.607,"end":309.849},{"n":73,"part":"넷째, 실제로 벌어질 상황","text":"일부라도 썼다면, 단말기 대신 세관 창구에 신고해야 합니다.","start":310.299,"end":314.093},{"n":74,"part":"넷째, 실제로 벌어질 상황","text":"셋, 산 날부터 90일 안에 출국하면서 확인을 받아야 합니다.","start":314.543,"end":318.337},{"n":75,"part":"넷째, 실제로 벌어질 상황","text":"수속을 하다가 중간에 그만두면, 확인을 받지 않은 것으로 봅니다.","start":318.787,"end":322.883},{"n":76,"part":"넷째, 실제로 벌어질 상황","text":"그럼 공항에는 몇 시간 전에 가야 할까요?","start":323.333,"end":325.669},{"n":77,"part":"넷째, 실제로 벌어질 상황","text":"한 여행 가이드는 5시간에서 6시간 전에 도착할 생각이라고까지 말했습니다.","start":326.119,"end":331.173},{"n":78,"part":"넷째, 실제로 벌어질 상황","text":"하지만 일본 정부가 정한 기준 시간은 없습니다.","start":331.623,"end":334.412},{"n":79,"part":"넷째, 실제로 벌어질 상황","text":"관광청은 시간에 여유를 두고 공항에 도착하라고 안내합니다.","start":334.862,"end":338.557},{"n":80,"part":"넷째, 실제로 벌어질 상황","text":"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않는다고 밝혔습니다.","start":339.007,"end":344.16},{"n":81,"part":"넷째, 실제로 벌어질 상황","text":"공항들도 준비하고 있습니다.","start":344.61,"end":346.342},{"n":82,"part":"넷째, 실제로 벌어질 상황","text":"업계 보도에 따르면, 하네다·나리타·나하 공항에는 현금 환급 단말기가 생깁니다.","start":346.792,"end":351.794},{"n":83,"part":"넷째, 실제로 벌어질 상황","text":"약 1분이면 엔화 현금으로 받을 수 있다는 설명입니다.","start":352.244,"end":355.486},{"n":84,"part":"넷째, 실제로 벌어질 상황","text":"그리고 우리나라로 돌아올 때의 한도는 그대로라는 점도 기억해야 합니다.","start":355.936,"end":360.386},{"n":85,"part":"넷째, 실제로 벌어질 상황","text":"일본의 50만 엔 상한이 없어져도, 우리나라 입국 면세 한도는 미화 800달러입니다.","start":360.836,"end":366.14},{"n":86,"part":"넷째, 실제로 벌어질 상황","text":"술은 따로 2리터 이하, 400달러 이하까지예요.","start":366.59,"end":369.629},{"n":87,"part":"넷째, 실제로 벌어질 상황","text":"그렇다면 다른 나라들은 어떤 방식으로 세금을 돌려줄까요?","start":370.079,"end":373.623},{"n":88,"part":"다섯째, 우리나라와 다른 나라는","text":"다섯 번째는 다른 나라와의 비교입니다.","start":374.623,"end":376.959},{"n":89,"part":"다섯째, 우리나라와 다른 나라는","text":"먼저 우리나라입니다.","start":377.409,"end":378.688},{"n":90,"part":"다섯째, 우리나라와 다른 나라는","text":"외국인 관광객은 사후면세점에서 한 번에 1만 5천 원 이상 사면 대상입니다.","start":379.138,"end":383.739},{"n":91,"part":"다섯째, 우리나라와 다른 나라는","text":"한 번에 100만 원 미만이면, 매장이 바로 세금을 뺀 값으로 팔 수 있어요.","start":384.189,"end":388.436},{"n":92,"part":"다섯째, 우리나라와 다른 나라는","text":"입국 뒤 이렇게 산 금액은 모두 합쳐 500만 원까지입니다.","start":388.886,"end":392.279},{"n":93,"part":"다섯째, 우리나라와 다른 나라는","text":"그보다 크면, 산 날부터 3개월 안에 출국하면서 세관 확인을 받고 돌려받습니다.","start":392.729,"end":397.731},{"n":94,"part":"다섯째, 우리나라와 다른 나라는","text":"환급 수수료는 국세청장이 승인한 금액만 뗄 수 있습니다.","start":398.181,"end":401.574},{"n":95,"part":"다섯째, 우리나라와 다른 나라는","text":"일본이 없애는 매장 즉시 면세를, 우리나라는 금액 한도를 두고 남겨 둔 셈입니다.","start":402.024,"end":407.026},{"n":96,"part":"다섯째, 우리나라와 다른 나라는","text":"싱가포르는 같은 매장에서 100싱가포르달러 이상 사면 대상입니다.","start":407.476,"end":411.473},{"n":97,"part":"다섯째, 우리나라와 다른 나라는","text":"산 날부터 2개월 안에, 공항 단말기에 여권을 대고 신청합니다.","start":411.923,"end":415.868},{"n":98,"part":"다섯째, 우리나라와 다른 나라는","text":"돌려받는 돈은 수수료를 뺀 금액이라 낸 세금보다 적습니다.","start":416.318,"end":419.862},{"n":99,"part":"다섯째, 우리나라와 다른 나라는","text":"프랑스는 한 매장에서 하루 100유로를 조금 넘게 사면 대상입니다.","start":420.312,"end":424.158},{"n":100,"part":"다섯째, 우리나라와 다른 나라는","text":"공항 단말기에 서류를 읽혀 확인 메시지가 뜨면, 세관 도장을 대신합니다.","start":424.608,"end":429.157},{"n":101,"part":"다섯째, 우리나라와 다른 나라는","text":"세관은 여권과 탑승권, 산 물건을 확인할 수 있습니다.","start":429.607,"end":432.948},{"n":102,"part":"다섯째, 우리나라와 다른 나라는","text":"일본의 새 방식은 싱가포르, 프랑스처럼 떠날 때 확인받는 방식에 가깝습니다.","start":433.398,"end":438.249},{"n":103,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":439.249,"end":442.137},{"n":104,"part":"정리","text":"11월 1일부터 산 물건은 세금을 포함해 결제하고, 출국할 때 확인을 받아 돌려받습니다.","start":442.587,"end":448.193},{"n":105,"part":"정리","text":"일본은 면세품을 되파는 부정을 막으려고, 세금을 먼저 받는 방식으로 바꿉니다.","start":448.643,"end":453.645},{"n":106,"part":"정리","text":"효과는 11월 이후 자료로 확인해야 하고, 공항 혼잡은 걱정거리로 남아 있습니다.","start":454.095,"end":459.248},{"n":107,"part":"정리","text":"짐을 맡기기 전에, 영수증의 물건을 빠짐없이, 90일 안에 확인을 받으세요.","start":459.698,"end":464.648},{"n":108,"part":"정리","text":"우리나라는 소액이면 매장에서 바로 세금을 빼 주고, 싱가포르와 프랑스는 일본과 비슷합니다.","start":465.098,"end":471.006},{"n":109,"part":"정리","text":"돌려받는 방법과 수수료는 매장마다 다르니, 살 때 먼저 물어보세요.","start":471.456,"end":475.703},{"n":110,"part":"정리","text":"시청해주셔서 감사합니다.","start":476.153,"end":477.734}],"subs":[[0.3,3.995,"11월 1일부터 일본의 외국인 여행자 면세 방식이 바뀝니다."],[4.445,8.442,"지금처럼 매장 계산대에서 바로 세금을 빼 주는 방식이 사라집니다."],[8.892,11.983,"이 소식을 다룬 영상에는 걱정하는 댓글이 많았어요."],[12.433,17.888,"가장 많은 공감을 받은 댓글은,\n환급액을 그냥 챙기겠다는 속셈 아니냐는 말이었습니다."],[18.338,23.543,"공항에 사람이 몰리면\n결국 면세를 안 해 주겠다는 소리라는 댓글도 많은 공감을 받았죠."],[23.993,27.386,"반대로 우리나라도 이렇게 해야 한다는 댓글도 있었어요."],[27.836,29.87,"그럼 일본 면세가 없어지는 걸까요?"],[30.32,32.906,"결론부터 말하면, 면세는 그대로입니다."],[33.356,38.509,"다만 세금을 먼저 내고,\n출국할 때 세관 확인을 받아야 돌려받는 방식으로 바뀝니다."],[38.959,42.201,"이 확인을 받지 못하면 낸 세금은 돌려받을 수 없습니다."],[42.651,47.299,"무엇이 바뀌는지, 왜 바꾸는지, 정말 효과가 있을지 차례로 보겠습니다."],[47.749,53.204,"그리고 실제로 벌어질 상황과,\n우리나라를 포함한 다른 나라의 방식도 비교하겠습니다."],[54.204,56.238,"첫 번째는 무엇이 바뀌는가입니다."],[56.688,60.836,"새 방식은 2026년 11월 1일 이후에 산 물건부터 적용됩니다."],[61.286,64.226,"기준은 출국하는 날이 아니라 물건을 산 날이에요."],[64.676,68.673,"10월 31일까지 산 물건은 지금처럼 매장에서 바로 면세됩니다."],[69.123,71.459,"두 방식을 함께 쓰는 기간은 따로 없어요."],[71.909,77.062,"11월부터는 매장에서 여권을 보여 주고,\n소비세를 포함한 가격으로 결제합니다."],[77.512,82.212,"예를 들어 세금 포함 1만 1천 엔짜리를 사면,\n그중 1천 엔이 소비세입니다."],[82.662,86.055,"매장은 이 구매 기록을 일본 국세청 시스템으로 보냅니다."],[86.505,90.653,"출국하는 날에는 공항 출발 로비의 면세 수속 단말기에 여권을 댑니다."],[91.103,93.288,"화면에 초록색이 뜨면 확인이 끝나요."],[93.738,97.584,"빨간색이 뜨면 세관 검사장에서 산 물건을 직접 보여 줘야 합니다."],[98.034,103.286,"나리타, 하네다,\n간사이 등 일곱 개 공항에서는 휴대전화로도 수속할 수 있습니다."],[103.736,108.035,"공항 안 전용 와이파이 구역에서\n비지트 재팬 웹에 접속하는 방식이에요."],[108.485,113.638,"세관 확인이 끝나면,\n물건을 산 매장이나 매장이 맡긴 환급 업체가 돈을 돌려줍니다."],[114.088,118.835,"돌려받는 방법은 카드, 계좌 송금, 앱, 공항 현금 등 매장마다 다릅니다."],[119.285,124.74,"일본 정부는 수수료를 받지 않지만,\n환급 업체의 수수료는 법으로 정해져 있지 않습니다."],[125.19,129.739,"그래서 수수료를 떼고 나면,\n돌려받는 돈이 낸 세금보다 적을 수 있습니다."],[130.189,132.072,"오히려 편해지는 점도 있습니다."],[132.522,137.524,"같은 매장에서 하루에 세금 빼고\n5,000엔 이상 사야 한다는 기준은 그대로입니다."],[137.974,143.278,"대신 과자나 화장품 같은 소모품과,\n옷이나 가전 같은 일반 물품의 구분이 사라집니다."],[143.728,146.314,"그래서 둘을 합쳐 5,000엔 이상이면 돼요."],[146.764,150.157,"소모품은 50만 엔까지만 면세되던 상한도 없어집니다."],[150.607,154,"소모품을 밀봉 봉투에 담아 주던 특수 포장도 사라지고요."],[154.45,158.145,"다만 한 개에 세금 빼고 100만 엔 이상인 물건은 따로 기록합니다."],[158.595,162.29,"시리얼 번호처럼 그 물건을 알아볼 수 있는 정보를 남기는 거죠."],[162.74,166.435,"그렇다면 일본은 왜 이렇게 번거로운 방식으로 바꾸는 걸까요?"],[167.435,169.167,"두 번째는 바꾸는 이유입니다."],[169.617,174.973,"일본 재무성은 면세로 산 물건을 일본 안에서\n되파는 부정을 막기 위해서라고 설명합니다."],[175.423,180.175,"재무성이 2022년 4월부터 2년 동안의 기록을 정리한 자료가 있습니다."],[180.625,184.773,"그 기간에 한 번 입국해
