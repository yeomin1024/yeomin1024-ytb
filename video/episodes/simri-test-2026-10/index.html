종목을 매일 알려 주겠다며, 단체 대화방에 초대합니다.","start":70.859,"end":75.573},{"n":21,"part":"항목 2","text":"A, 무조건 오른다는 말을 듣자마자 대화를 끝낸다.","start":75.953,"end":79.469},{"n":22,"part":"항목 2","text":"B, 회비를 내고 들어간다.","start":79.849,"end":81.589},{"n":23,"part":"항목 2","text":"C, 무료 체험 기간에만 들어가 본다.","start":81.969,"end":84.309},{"n":24,"part":"항목 2","text":"A는 10점, B는 0점, C는 5점입니다.","start":84.689,"end":87.769},{"n":25,"part":"항목 3","text":"세 번째 항목입니다.","start":88.769,"end":89.999},{"n":26,"part":"항목 3","text":"얼마 뒤, 내가 매수한 주식이 한 달 만에 50% 올랐습니다.","start":90.379,"end":94.372},{"n":27,"part":"항목 3","text":"주변에서는 주식 고수라는 말까지 듣습니다.","start":94.752,"end":97.068},{"n":28,"part":"항목 3","text":"가장 먼저 드는 생각은 무엇입니까?","start":97.448,"end":99.486},{"n":29,"part":"항목 3","text":"A, 같은 기간 그 주식이 속한 시장의 대표 지수와 먼저 견줘 본다.","start":99.866,"end":104.223},{"n":30,"part":"항목 3","text":"B, 이번에는 운이 좋았다고 생각한다.","start":104.603,"end":107.118},{"n":31,"part":"항목 3","text":"C, 나는 주식에 재능이 있다고 확신한다.","start":107.498,"end":110.177},{"n":32,"part":"항목 3","text":"A는 10점, B는 5점, C는 0점입니다.","start":110.557,"end":113.769},{"n":33,"part":"항목 4","text":"네 번째 항목입니다.","start":114.769,"end":115.87},{"n":34,"part":"항목 4","text":"이제 그 종목이라면, 앞으로도 오를 거라는 확신이 듭니다.","start":116.25,"end":119.836},{"n":35,"part":"항목 4","text":"주식 계좌 전체에서, 그 한 종목을 얼마나 보유하시겠습니까?","start":120.216,"end":124.22},{"n":36,"part":"항목 4","text":"A, 계좌의 4분의 1에서 절반까지 보유한다.","start":124.6,"end":127.876},{"n":37,"part":"항목 4","text":"B, 다른 종목을 모두 매도하고, 계좌의 절반 넘게 보유한다.","start":128.256,"end":132.158},{"n":38,"part":"항목 4","text":"C, 4분의 1이 안 되게 보유하고, 나머지는 여러 종목에 나눠 보유한다.","start":132.538,"end":137.368},{"n":39,"part":"항목 4","text":"A는 5점, B는 0점, C는 10점입니다.","start":137.748,"end":140.898},{"n":40,"part":"항목 5","text":"다섯 번째 항목입니다.","start":141.898,"end":143.198},{"n":41,"part":"항목 5","text":"그 뒤로 주식 앱 알림이 하루에 수십 번 울립니다.","start":143.578,"end":146.546},{"n":42,"part":"항목 5","text":"주가가 1%만 움직여도 매매하고 싶어집니다.","start":146.926,"end":149.863},{"n":43,"part":"항목 5","text":"정해진 날 정기적으로 매수하는 것은 빼고, 평소 한 달에 몇 번 매매하십니까?","start":150.243,"end":154.808},{"n":44,"part":"항목 5","text":"A, 한 달에 한두 번 이하로 매매한다.","start":155.188,"end":157.698},{"n":45,"part":"항목 5","text":"B, 거의 매일, 하루에도 여러 번 매매한다.","start":158.078,"end":161.441},{"n":46,"part":"항목 5","text":"C, 일주일에 한두 번 매매한다.","start":161.821,"end":164.031},{"n":47,"part":"항목 5","text":"A는 10점, B는 0점, C는 5점입니다.","start":164.411,"end":167.491},{"n":48,"part":"항목 6","text":"여섯 번째 항목입니다.","start":168.491,"end":169.747},{"n":49,"part":"항목 6","text":"그러다 꼭 매수하고 싶은 종목이 생겨, 모아 둔 1,200만 원을 넣으려 합니다.","start":170.127,"end":174.8},{"n":50,"part":"항목 6","text":"언제, 얼마씩 매수하고 매도할지 정해 두셨습니까?","start":175.18,"end":178.41},{"n":51,"part":"항목 6","text":"A, 매수는 몇 번에 나눌 생각이지만, 매도는 그때 가서 정한다.","start":178.79,"end":183.158},{"n":52,"part":"항목 6","text":"B, 몇 번에 나눠 매수하고 매도할지, 가격과 금액을 미리 정해 두었다.","start":183.538,"end":188.042},{"n":53,"part":"항목 6","text":"C, 느낌이 오는 날 한 번에 다 매수하고, 오르면 한 번에 다 매도한다.","start":188.422,"end":193.15},{"n":54,"part":"항목 6","text":"A는 5점, B는 10점, C는 0점입니다.","start":193.53,"end":196.469},{"n":55,"part":"항목 7","text":"일곱 번째 항목입니다.","start":197.469,"end":198.957},{"n":56,"part":"항목 7","text":"보유한 종목 하나가 매수 가격의 절반이 됐고, 회사 실적이 나빠졌다는 뉴스도 나옵니다.","start":199.337,"end":204.726},{"n":57,"part":"항목 7","text":"A, 처음 매수한 이유를 다시 확인해, 맞으면 보유하고 틀렸다면 매도한다.","start":205.106,"end":210.096},{"n":58,"part":"항목 7","text":"B, 이유는 따져 보지 않고, 절반만 매도한다.","start":210.476,"end":213.596},{"n":59,"part":"항목 7","text":"C, 이유는 따져 보지 않고, 매수 가격이 될 때까지 보유하거나 더 매수한다.","start":213.976,"end":218.935},{"n":60,"part":"항목 7","text":"A는 10점, B는 5점, C는 0점입니다.","start":219.315,"end":222.527},{"n":61,"part":"항목 8","text":"여덟 번째 항목입니다.","start":223.527,"end":224.84},{"n":62,"part":"항목 8","text":"반값이 된 종목을 보고 나서, 내 계좌 전체를 다시 들여다봅니다.","start":225.22,"end":229.204},{"n":63,"part":"항목 8","text":"현금은 하나도 없고, 보유 종목은 모두 한 업종입니다.","start":229.584,"end":233.097},{"n":64,"part":"항목 8","text":"투자한 나라의 지수가 오르내릴 때, 현금과 업종 비중을 어떻게 할지 정해 두셨습니까?","start":233.477,"end":238.637},{"n":65,"part":"항목 8","text":"A, 현금 비중만 대충 정해 두었다.","start":239.017,"end":241.361},{"n":66,"part":"항목 8","text":"B, 오를 때와 떨어질 때의 현금 비중과 업종 배분을, 미리 정해 두었다.","start":241.741,"end":246.41},{"n":67,"part":"항목 8","text":"C, 정해 둔 것 없이, 그때그때 오르는 업종에 모두 넣는다.","start":246.79,"end":250.77},{"n":68,"part":"항목 8","text":"A는 5점, B는 10점, C는 0점입니다.","start":251.15,"end":254.088},{"n":69,"part":"항목 9","text":"아홉 번째 항목입니다.","start":255.088,"end":256.398},{"n":70,"part":"항목 9","text":"얼마 뒤 내가 투자한 나라의 대표 지수가 크게 떨어지자, 바닥이라는 글이 쏟아집니다.","start":256.778,"end":262.021},{"n":71,"part":"항목 9","text":"증권사 앱에는 내 돈만큼 빌려서 두 배로 매수할 수 있다는 안내가 뜹니다.","start":262.401,"end":266.664},{"n":72,"part":"항목 9","text":"A, 조금만 빌려서 매수한다.","start":267.044,"end":269.06},{"n":73,"part":"항목 9","text":"B, 빌리지 않고 내 돈으로만 매수한다.","start":269.44,"end":272.104},{"n":74,"part":"항목 9","text":"C, 내 돈만큼 빌려서 두 배로 매수한다.","start":272.484,"end":275.615},{"n":75,"part":"항목 9","text":"A는 5점, B는 10점, C는 0점입니다.","start":275.995,"end":278.933},{"n":76,"part":"항목 10","text":"마지막 열 번째 항목입니다.","start":279.933,"end":281.783},{"n":77,"part":"항목 10","text":"결국 큰 손실을 본 날, 레버리지 ETF로 손실을 한 달 만에 되찾았다는 영상이 보입니다.","start":282.163,"end":287.429},{"n":78,"part":"항목 10","text":"A, 남은 돈을 모두, 하루 움직임의 두 배로 움직이는 2배 레버리지 ETF에 넣는다.","start":287.809,"end":293.652},{"n":79,"part":"항목 10","text":"B, 남은 돈의 일부만 2배 레버리지 ETF에 넣는다.","start":294.032,"end":297.827},{"n":80,"part":"항목 10","text":"C, 손실은 받아들이고, 남은 돈을 여러 곳에 나눠 다시 시작한다.","start":298.207,"end":302.387},{"n":81,"part":"항목 10","text":"A는 0점, B는 5점, C는 10점입니다.","start":302.767,"end":305.869},{"n":82,"part":"통과 기준","text":"점수를 모두 더하셨다면, 이제 통과 기준을 알려 드리겠습니다.","start":306.869,"end":310.769},{"n":83,"part":"통과 기준","text":"먼저, 9번이나 10번에서 0점이라면 총점과 상관없이 불통과입니다.","start":311.149,"end":315.802},{"n":84,"part":"통과 기준","text":"빌린 돈과 레버리지 상품은, 한 번의 폭락으로 계좌 대부분을 잃게 할 수 있기 때문입니다.","start":316.182,"end":321.417},{"n":85,"part":"통과 기준","text":"이 두 항목에 0점이 없다면, 70점 이상은 통과입니다.","start":321.797,"end":325.465},{"n":86,"part":"통과 기준","text":"40점에서 65점은 주의, 35점 이하는 불통과입니다.","start":325.845,"end":330.015},{"n":87,"part":"통과 기준","text":"통과는, 남의 말이나 그날 기분이 아니라 내 계획대로 매수하고 매도하는 사람입니다.","start":330.395,"end":335.709},{"n":88,"part":"통과 기준","text":"주의는, 원칙은 있지만 흔들리는 순간에는 감정대로 움직이는 사람입니다.","start":336.089,"end":340.679},{"n":89,"part":"통과 기준","text":"0점과 5점을 받은 습관 몇 개만 고치면, 통과할 수 있습니다.","start":341.059,"end":345.059},{"n":90,"part":"통과 기준","text":"불통과는, 손실을 본 사람들과 같은 행동을 많이 하는 사람입니다.","start":345.439,"end":349.389},{"n":91,"part":"통과 기준","text":"어느 쪽이든, 0점을 받은 항목이 바로 내 계좌에서 돈이 새는 곳입니다.","start":349.769,"end":354.376},{"n":92,"part":"통과 기준","text":"그럼 왜 그런 점수인지, 1번부터 하나씩 돌아보겠습니다.","start":354.756,"end":358.175},{"n":93,"part":"해설 1","text":"1번에서 남을 따라 바로 매수했다면 0점입니다.","start":359.175,"end":362.205},{"n":94,"part":"해설 1","text":"남이 수익을 자랑할 때는, 그 종목이 이미 많이 오른 뒤일 때가 많기 때문입니다.","start":362.585,"end":367.474},{"n":95,"part":"해설 1","text":"2022년 미국 연구진이 주식 앱 로빈후드 이용자의 거래를 분석했습니다.","start":367.854,"end":372.675},{"n":96,"part":"해설 1","text":"하루 가장 많이 매수된 종목은, 그 뒤 한 달간 미국 시장 평균보다 4.7% 뒤처졌습니다.","start":373.055,"end":379.205},{"n":97,"part":"해설 1","text":"한국 자본시장연구원 분석에서도 2020년 개인은 이미 크게 오른 종목을 많이 매수했습니다.","start":379.585,"end":385.637},{"n":98,"part":"해설 1","text":"그래서 남의 수익이 아니라, 그 회사가 무엇으로 돈을 버는지를 보고 매수를 정해야 합니다.","start":386.017,"end":391.337},{"n":99,"part":"해설 2","text":"2번에서 회비를 내고 들어갔다면 0점입니다.","start":392.337,"end":395.254},{"n":100,"part":"해설 2","text":"무조건 오르는 종목을 아는 사람이, 회비를 받고 남에게 알려 줄 까닭이 없기 때문입니다.","start":395.634,"end":400.974},{"n":101,"part":"해설 2","text":"2025년 미국 연방거래위원회에 신고된 투자 사기 피해는 79억 달러였습니다.","start":401.354,"end":406.84},{"n":102,"part":"해설 2","text":"모든 사기 피해의 절반 가까이입니다.","start":407.22,"end":409.409},{"n":103,"part":"해설 2","text":"한국 금융감독원 집계로, 2024년 불법 종목 추천방 피해는 약 7,100억 원이었습니다.","start":409.789,"end":415.898},{"n":104,"part":"해설 2","text":"같은 해 보이스피싱 피해의 83%에 이르는 돈입니다.","start":416.278,"end":419.597},{"n":105,"part":"해설 2","text":"그래서 무조건 오른다는 말을 듣는 순간 대화를 끝내야, 내 돈을 지킬 수 있습니다.","start":419.977,"end":424.805},{"n":106,"part":"해설 3","text":"3번에서 재능이 있다고 확신했다면 0점입니다.","start":425.805,"end":428.715},{"n":107,"part":"해설 3","text":"수익이 났을 때 운과 실력을 가르지 못하면, 자신감만 커지기 때문입니다.","start":429.095,"end":433.849},{"n":108,"part":"해설 3","text":"미국 금융산업규제청 재단은 2024년에 투자자를 조사했습니다.","start":434.229,"end":438.687},{"n":109,"part":"해설 3","text":"SNS로 투자 정보를 얻는 사람들은 투자 지식 문제를 평균 42%만 맞혔습니다.","start":439.067,"end":444.551},{"n":110,"part":"해설 3","text":"그런데도 63%는 자기 투자 지식이 높다고 답했습니다.","start":444.931,"end":448.779},{"n":111,"part":"해설 3","text":"한국 지수는 올해 4월 말부터 한 달 동안 20% 넘게 올랐습니다.","start":449.159,"end":453.292},{"n":112,"part":"해설 3","text":"그 한 달에 50%를 벌었다면, 20% 넘는 몫은 지수만 따라가도 벌 수 있었습니다.","start":453.672,"end":459.207},{"n":113,"part":"해설 3","text":"그래서 수익이 나면, 같은 기간 대표 지수와 먼저 견줘 봐야 내 실력이 보입니다.","start":459.587,"end":464.758},{"n":114,"part":"해설 4","text":"4번에서 한 종목을 절반 넘게 보유했다면 0점입니다.","start":465.758,"end":469.428},{"n":115,"part":"해설 4","text":"한 종목에 몰아 넣으면, 지수가 올라도 내 계좌는 떨어질 수 있기 때문입니다.","start":469.808,"end":473.966},{"n":116,"part":"해설 4","text":"2025년 미국 S&P 500 종목 가운데 지수보다 더 오른 종목은 30.5%뿐이었습니다.","start":474.346,"end":480.575},{"n":117,"part":"해설 4","text":"한국은 더 심했습니다.","start":480.955,"end":482.469},{"n":118,"part":"해설 4","text":"지수가 20% 넘게 오른 그 한 달 동안, 한국 상장 종목의 82%는 오히려 떨어졌습니다.","start":482.849,"end":489.46},{"n":119,"part":"해설 4","text":"그래서 한 종목이 틀려도 계좌가 버틸 만큼만, 여러 종목에 나눠 보유해야 합니다.","start":489.84,"end":494.822},{"n":120,"part":"해설 5","text":"5번에서 주가를 보고 거의 매일 매매했다면 0점입니다.","start":495.822,"end":499.328},{"n":121,"part":"해설 5","text":"매매를 자주 할수록, 세금과 수수료로 나가는 돈이 번 돈보다 빨리 쌓이기 때문입니다.","start":499.708,"end":504.441},{"n":122,"part":"해설 5","text":"한국 자본시장연구원은 2020년 2월부터 1년 동안 개인 투자자의 거래를 분석했습니다.","start":504.821,"end":510.311},{"n":123,"part":"해설 5","text":"매매로 번 돈은 약 13조 원이었습니다.","start":510.691,"end":513.152},{"n":124,"part":"해설 5","text":"같은 기간 낸 세금과 수수료는 약 13조 7천억 원으로, 번 돈보다 7천억 원 많았습니다.","start":513.532,"end":519.197},{"n":125,"part":"해설 5","text":"인도 증권거래위원회는 하루 안에 매수와 매도를 한 개인을 분석했습니다.","start":519.577,"end":524.103},{"n":126,"part":"해설 5","text":"2022년 4월부터 1년 동안, 그 가운데 71%가 손실을 봤습니다.","start":524.483,"end":529.589},{"n":127,"part":"해설 5","text":"그래서 매매 횟수를 줄이는 것만으로도, 계좌에서 새는 돈을 막을 수 있습니다.","start":529.969,"end":534.658},{"n":128,"part":"해설 6","text":"6번에서 한 번에 다 매수하고 한 번에 다 매도했다면 0점입니다.","start":535.658,"end":539.551},{"n":129,"part":"해설 6","text":"주가가 오를지 떨어질지는, 아무도 미리 알 수 없기 때문입니다.","start":539.931,"end":543.681},{"n":130,"part":"해설 6","text":"올해 한국 지수에 4월 21일 한 번에 넣은 돈은, 6월 22일까지 43% 올랐습니다.","start":544.061,"end":550.171},{"n":131,"part":"해설 6","text":"같은 돈을 한 달 간격으로 세 번 나눠 넣었다면, 20% 올랐습니다.","start":550.551,"end":554.914},{"n":132,"part":"해설 6","text":"하지만 6월 22일에 한 번에 넣은 돈은, 10월 15일까지 39% 줄었습니다.","start":555.294,"end":561.054},{"n":133,"part":"해설 6","text":"같은 돈을 한 달 간격으로 네 번 나눠 넣었다면, 24% 줄었습니다.","start":561.434,"end":565.941},{"n":134,"part":"해설 6","text":"나눠 넣으면 오를 때 덜 벌지만, 떨어질 때 덜 잃어 어느 쪽이 와도 버틸 수 있습니다.","start":566.321,"end":571.261},{"n":135,"part":"해설 6","text":"매도도 같습니다.","start":571.641,"end":572.571},{"n":136,"part":"해설 6","text":"올해 미국 설문에선, 개인 4명 중 1명이 겁나서 매도한 뒤 몇 주 만에 회복을 봤습니다.","start":572.951,"end":578.277},{"n":137,"part":"해설 6","text":"그래서 매수와 매도 모두, 몇 번에 나눠 얼마씩 할지 미리 정해 두어야 합니다.","start":578.657,"end":583.537},{"n":138,"part":"해설 7","text":"7번에서 이유를 따지지 않고 매수 가격만 기다렸다면 0점입니다.","start":584.537,"end":588.666},{"n":139,"part":"해설 7","text":"매수 가격은 내 사정일 뿐, 회사의 앞날과는 상관이 없기 때문입니다.","start":589.046,"end":593.244},{"n":140,"part":"해설 7","text":"2024년 미국 경제학회 학술지의 한 연구는 논문 150편을 모아 분석했습니다.","start":593.624,"end":598.859},{"n":141,"part":"해설 7","text":"사람은 같은 돈이라도, 잃을 때의 고통을 얻을 때의 기쁨보다 약 2배 크게 느꼈습니다.","start":599.239,"end":604.461},{"n":142,"part":"해설 7","text":"한국 자본시장연구원은 2020년 개인 투자자 약 20만 명의 거래를 분석했습니다.","start":604.841,"end":610.248},{"n":143,"part":"해설 7","text":"매수 다음 날, 이익 난 주식은 41%를 매도했지만 손실 난 주식은 22%만 매도했습니다.","start":610.628,"end":617.298},{"n":144,"part":"해설 7","text":"하지만 절반으로 떨어진 주식이 매수 가격을 되찾으려면, 100%가 올라야 합니다.","start":617.678,"end":622.266},{"n":145,"part":"해설 7","text":"그래서 매수 가격 대신, 처음 매수한 이유가 아직 맞는지로 보유와 매도를 정해야 합니다.","start":622.646,"end":628.046},{"n":146,"part":"해설 8","text":"8번에서 계획 없이 오르는 업종에 모두 넣었다면 0점입니다.","start":629.046,"end":632.854},{"n":147,"part":"해설 8","text":"한 업종에 다 넣고 현금도 없으면, 그 업종이 무너질 때 계좌도 함께 무너지기 때문입니다.","start":633.234,"end":639.057},{"n":148,"part":"해설 8","text":"한국 주식 지수는 삼성전자와 SK하이닉스, 두 회사가 시가총액의 절반쯤을 차지합니다.","start":639.437,"end":645.529},{"n":149,"part":"해설 8","text":"올해 7월 28일 두 회사는 하루에 13%, 14% 넘게 떨어졌습니다.","start":645.909,"end":650.894},{"n":150,"part":"해설 8","text":"그날 지수도 10.8% 떨어졌습니다.","start":651.274,"end":653.844},{"n":151,"part":"해설 8","text":"현금이 없다면 이런 날 피할 곳도, 싸게 매수할 돈도 없습니다.","start":654.224,"end":658.144},{"n":152,"part":"해설 8","text":"그래서 오를 때와 떨어질 때, 현금과 업종을 얼마씩 둘지 미리 정해 두어야 합니다.","start":658.524,"end":663.265},{"n":153,"part":"해설 9","text":"9번에서 빌려서 두 배로 매수했다면 0점이고, 과락입니다.","start":664.265,"end":668.095},{"n":154,"part":"해설 9","text":"주가가 떨어져도 빌린 돈은 그대로 갚아야 해서, 내 손실이 두 배로 커지기 때문입니다.","start":668.475,"end":673.353},{"n":155,"part":"해설 9","text":"주식을 사려고 빌린 돈은, 올해 한국은 34조 원, 미국은 1조 5천억 달러를 넘었습니다.","start":673.733,"end":679.743},{"n":156,"part":"해설 9","text":"내 돈만큼 빌려 두 배로 매수하면, 주가가 20%만 떨어져도 내 돈은 40%가 사라집니다.","start":680.123,"end":686.642},{"n":157,"part":"해설 9","text":"주가가 한국에서는 30%, 미국에서는 33% 떨어지면, 강제로 매도될 수 있습니다.","start":687.022,"end":693.199},{"n":158,"part":"해설 9","text":"이 기준은 증권사마다 조금씩 다릅니다.","start":693.579,"end":696.136},{"n":159,"part":"해설 9","text":"앞에서 말한 3,900억 원도, 빌린 돈 때문에 강제로 매도된 주식입니다.","start":696.516,"end":701.354},{"n":160,"part":"해설 9","text":"강제로 매도되면, 그 뒤 주가가 다시 올라도 되찾을 기회가 사라집니다.","start":701.734,"end":706.301},{"n":161,"part":"해설 9","text":"그래서 바닥처럼 보여도, 매수는 내 돈으로만 해야 합니다.","start":706.681,"end":710.323},{"n":162,"part":"해설 10","text":"10번에서 남은 돈을 모두 레버리지 ETF에 넣었다면 0점이고, 과락입니다.","start":711.323,"end":715.903},{"n":163,"part":"해설 10","text":"2배 레버리지 ETF는, 주가가 오르내리다 제자리로 와도 돈이 줄 수 있기 때문입니다.","start":716.283,"end":721.305},{"n":164,"part":"해설 10","text":"주가가 하루에 10% 떨어지고, 다음 날 11.1% 올라 제자리로 왔다고 해 보겠습니다.","start":721.685,"end":727.087},{"n":165,"part":"해설 10","text":"이때 2배 레버리지 ETF는, 오히려 2.2% 손실이 남습니다.","start":727.467,"end":731.989},{"n":166,"part":"해설 10","text":"앞에서 말한 한국의 6조 원 손실도, 이런 단일 종목 레버리지 상품에서 났습니다.","start":732.369,"end":737.338},{"n":167,"part":"해설 10","text":"그래서 손실을 한 번에 되찾으려 하기보다, 남은 돈을 나눠 다시 시작해야 합니다.","start":737.718,"end":742.404},{"n":168,"part":"정리","text":"이 테스트는 공식 시험이 아니라, 한국과 미국 등의 최근 통계로 직접 만든 것입니다.","start":743.404,"end":748.824},{"n":169,"part":"정리","text":"내 투자 방식을 점검하는 정도로 생각해 주세요.","start":749.204,"end":751.904},{"n":170,"part":"정리","text":"0점을 받은 항목의 10점 답을, 내 투자 원칙으로 적어 두세요.","start":752.284,"end":756.289},{"n":171,"part":"마무리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":757.289,"end":759.499},{"n":172,"part":"마무리","text":"시청해주셔서 감사합니다.","start":759.879,"end":761.409}],"subs":[[0.2,6.28,"최근 중동 긴장과 미국 금리 상승 등으로 주가가 출렁이며,\n손실 본 개인이 늘고 있습니다."],[6.28,11.104,"특히 한국 주식 지수는 6월 고점보다 40% 가까이 빠졌습니다."],[11.104,16.824,"5월 나온 단일 종목 레버리지 상품에선,\n석 달 새 개인이 6조 원 넘게 잃었습니다."],[16.824,21.75,"빚을 못 갚아 강제로 매도된 주식도, 이달에만 3,900억 원이 넘습니다."],[21.75,26.131,"이런 통계로, 투자에 실패할 확률을 판단하는 테스트를 만들었습니다."],[26.131,28.036,"점수를 모두 더해 주세요."],[28.036,30.233,"그럼 시작하겠습니다."],[30.233,31.783,"첫 번째 항목입니다."],[31.783,35.976,"주식 커뮤니티에는 수익 인증 글이 하루에도 수십 개씩 올라옵니다."],[35.976,39.846,"뉴스마다 주식을 처음 시작하는 사람이 몰린다는 이야기입니다."],[39.846,46.03,"점심시간에는 동료가,\n일주일 만에 30% 오른 종목으로 돈을 번 계좌를 보여 줍니다."],[46.03,49.715,"그 회사에 대해 내가 아는 것은, 동료가 한 말뿐입니다."],[49.715,51.285,"어떻게 하시겠습니까?"],[51.285,54.065,"A, 오늘 바로 그 종목을 매수한다."],[54.065,57.685,"B, 그 회사가 무엇으로 돈을 버는지부터 알아본다."],[57.685,59.885,"C, 조금만 매수해 본다."],[59.885,63.965,"A는 0점, B는 10점, C는 5점입니다."],[63.965,65.451,"두 번째 항목입니다."],[65.451,70.859,"그날 밤,\n모르는 사람이 메신저로 수익률 300%를 인증한 화면을 보내옵니다."],[70.859,75.953,"회비만 내면 무조건 오를 종목을 매일 알려 주겠다며,\n단체 대화방에 초대합니다."],[75.953,79.849,"A, 무조건 오른다는 말을 듣자마자 대화를 끝낸다."],[79.849,81.969,"B, 회비를 내고 들어간다."],[81.969,84.689,"C, 무료 체험 기간에만 들어가 본다."],[84.689,88.769,"A는 10점, B는 0점, C는 5점입니다."],[88.769,90.379,"세 번째 항목입니다."],[90.379,94.752,"얼마 뒤, 내가 매수한 주식이 한 달 만에 50% 올랐습니다."],[94.752,97.448,"주변에서는 주식 고수라는 말까지 듣습니다."],[97.448,99.866,"가장 먼저 드는 생각은 무엇입니까?"],[99.866,104.603,"A, 같은 기간 그 주식이 속한 시장의 대표 지수와 먼저 견줘 본다."],[104.603,107.498,"B, 이번에는 운이 좋았다고 생각한다."],[107.498,110.557,"C, 나는 주식에 재능이 있다고 확신한다."],[110.557,114.769,"A는 10점, B는 5점, C는 0점입니다."],[114.769,116.25,"네 번째 항목입니다."],[116.25,120.216,"이제 그 종목이라면, 앞으로도 오를 거라는 확신이 듭니다."],[120.216,124.6,"주식 계좌 전체에서, 그 한 종목을 얼마나 보유하시겠습니까?"],[124.6,128.256,"A, 계좌의 4분의 1에서 절반까지 보유한다."],[128.256,132.538,"B, 다른 종목을 모두 매도하고, 계좌의 절반 넘게 보유한다."],[132.538,137.748,"C, 4분의 1이 안 되게 보유하고, 나머지는 여러 종목에 나눠 보유한다."],[137.748,141.898,"A는 5점, B는 0점, C는 10점입니다."],[141.898,143.578,"다섯 번째 항목입니다."],[143.578,146.926,"그 뒤로 주식 앱 알림이 하루에 수십 번 울립니다."],[146.926,150.243,"주가가 1%만 움직여도 매매하고 싶어집니다."],[150.243,155.188,"정해진 날 정기적으로 매수하는 것은 빼고,\n평소 한 달에 몇 번 매매하십니까?"],[155.188,158.078,"A, 한 달에 한두 번 이하로 매매한다."],[158.078,161.821,"B, 거의 매일, 하루에도 여러 번 매매한다."],[161.821,164.411,"C, 일주일에 한두 번 매매한다."],[164.411,168.491,"A는 10점, B는 0점, C는 5점입니다."],[168.491,170.127,"여섯 번째 항목입니다."],[170.127,175.18,"그러다 꼭 매수하고 싶은 종목이 생겨,\n모아 둔 1,200만 원을 넣으려 합니다."],[175.18,178.79,"언제, 얼마씩 매수하고 매도할지 정해 두셨습니까?"],[178.79,183.538,"A, 매수는 몇 번에 나눌 생각이지만, 매도는 그때 가서 정한다."],[183.538,188.422,"B, 몇 번에 나눠 매수하고 매도할지, 가격과 금액을 미리 정해 두었다."],[188.422,193.53,"C, 느낌이 오는 날 한 번에 다 매수하고, 오르면 한 번에 다 매도한다."],[193.53,197.469,"A는 5점, B는 10점, C는 0점입니다."],[197.469,199.337,"일곱 번째 항목입니다."],[199.337,205.106,"보유한 종목 하나가 매수 가격의 절반이 됐고,\n회사 실적이 나빠졌다는 뉴스도 나옵니다."],[205.106,210.476,"A, 처음 매수한 이유를 다시 확인해,\n맞으면 보유하고 틀렸다면 매도한다."],[210.476,213.976,"B, 이유는 따져 보지 않고, 절반만 매도한다."],[213.976,219.315,"C, 이유는 따져 보지 않고,\n매수 가격이 될 때까지 보유하거나 더 매수한다."],[219.315,223.527,"A는 10점, B는 5점, C는 0점입니다."],[223.527,225.22,"여덟 번째 항목입니다."],[225.22,229.584,"반값이 된 종목을 보고 나서, 내 계좌 전체를 다시 들여다봅니다."],[229.584,233.477,"현금은 하나도 없고, 보유 종목은 모두 한 업종입니다."],[233. function zeroIdx(n) { return ITEM[n].pts.indexOf(0); }

}
function reviewSo(n) {
  const kL = partLast(`해설 ${n}`), a = until(kL), b = n < 10 ? ch(partFirst(`해설 ${n + 1}`)) : ch(partFirst("정리"));

}
