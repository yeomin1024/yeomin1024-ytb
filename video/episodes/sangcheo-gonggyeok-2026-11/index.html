702},{"n":19,"part":"바탕이 된 연구","text":"그럼 상처와는 어떻게 이어질까요?","start":78.082,"end":80.322},{"n":20,"part":"바탕이 된 연구","text":"2022년, 실험 연구들을 모은 메타분석이 있습니다.","start":80.702,"end":84.332},{"n":21,"part":"바탕이 된 연구","text":"메타분석은 같은 주제의 연구들을 모아 결과를 다시 계산하는 방법입니다.","start":84.712,"end":89.452},{"n":22,"part":"바탕이 된 연구","text":"참가자에게 따돌림이나 거절을 겪게 하자, 그 뒤 평균적으로 더 공격적으로 행동했습니다.","start":89.832,"end":95.532},{"n":23,"part":"바탕이 된 연구","text":"방금 받은 상처가 날카로움으로 이어질 수 있다는 뜻입니다.","start":95.912,"end":99.152},{"n":24,"part":"바탕이 된 연구","text":"실험실에서 잠깐 겪은 거절이라, 일상과 똑같지는 않습니다.","start":99.532,"end":103.357},{"n":25,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"첫 번째 이유는, 거절당할 낌새에 미리 날을 세운다는 것입니다.","start":104.357,"end":108.493},{"n":26,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"거절에 예민한 사람은, 비슷한 일이 다시 일어날까 봐 자주 대비합니다.","start":108.873,"end":113.429},{"n":27,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"답장이 조금 늦으면 '나를 싫어하나' 하는 생각이 먼저 들기 쉽습니다.","start":113.809,"end":117.745},{"n":28,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"회의에서 내 의견이 그냥 넘어가면, 무시당했다고 느끼기도 합니다.","start":118.125,"end":122.265},{"n":29,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"그리고 상처받기 전에 먼저 쏘아붙이기도 합니다.","start":122.645,"end":125.392},{"n":30,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"혹시 연락이 뜸한 친구에게 \"왜 연락 안 해?\" 하고 먼저 따진 적이 있으신가요?","start":125.772,"end":130.419},{"n":31,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"그 말 밑에는 '또 나만 뒷전이네' 하는 서운함과 화가 있을 수 있습니다.","start":130.799,"end":134.627},{"n":32,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"2021년, 연구 52편을 모은 분석에서도 거절에 예민할수록 공격이 조금 더 많았습니다.","start":135.007,"end":141.334},{"n":33,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"특히 걱정보다 화가 먼저 나는 사람, 순간 맞받아치는 공격에서 그랬습니다.","start":141.714,"end":146.459},{"n":34,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"한마디로, 날카로운 말은 거절의 낌새에 먼저 튀어나오는 반응일 수 있습니다.","start":146.839,"end":151.169},{"n":35,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"두 번째 이유는, 남의 말과 행동을 나를 공격하려는 뜻으로 읽는다는 것입니다.","start":152.169,"end":156.679},{"n":36,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"심리학에서는 이것을 적대적 귀인 편향이라고 부릅니다.","start":157.059,"end":160.219},{"n":37,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"뜻이 분명하지 않은 남의 행동을, 나에게 나쁜 마음을 품은 행동으로 읽는 버릇입니다.","start":160.599,"end":165.643},{"n":38,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"예를 들어 지하철에서 누가 어깨를 부딪치고 지나갔다고 해 보겠습니다.","start":166.023,"end":169.794},{"n":39,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"많은 사람은 '사람이 많아서 그랬나 보다' 하고 넘어갑니다.","start":170.174,"end":173.235},{"n":40,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그런데 이 버릇이 강한 사람은 '일부러 밀쳤다'고 읽기 쉽습니다.","start":173.615,"end":177.395},{"n":41,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그렇게 읽고 나면, 화를 내는 게 당연하게 느껴집니다.","start":177.775,"end":180.904},{"n":42,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"물론 정말 나쁜 뜻이 담긴 말도 있습니다.","start":181.284,"end":183.944},{"n":43,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그것을 알아챈 것은 편향이 아닙니다.","start":184.324,"end":186.534},{"n":44,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"문제는 뜻이 애매한 말까지 모두 공격으로 읽을 때입니다.","start":186.914,"end":190.582},{"n":45,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"2023년 한국 대학생 250명에게 한 번 온라인 설문을 한 연구가 이 부분을 봤습니다.","start":190.962,"end":196.862},{"n":46,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"여기서 공격은 계획한 것이 아니라, 화가 나는 순간 바로 맞받아치는 공격입니다.","start":197.242,"end":202.472},{"n":47,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"거절에 예민한 학생일수록 남의 행동을 나쁜 뜻으로 읽는 경향이 강했습니다.","start":202.852,"end":207.482},{"n":48,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그리고 그런 학생일수록, 화가 나는 순간 바로 맞받아치는 공격도 많았습니다.","start":207.862,"end":212.371},{"n":49,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"연구자들은 해석이 거절 예민함과 공격 사이를 잇는 다리일 수 있다고 봤습니다.","start":212.751,"end":217.301},{"n":50,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"다만 한 번 한 설문이라, 무엇이 먼저인지는 알 수 없습니다.","start":217.681,"end":221.419},{"n":51,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"처음에 말씀드린 옷 이야기도 이렇게 볼 수 있습니다.","start":221.799,"end":224.727},{"n":52,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"\"그 옷 새로 샀어?\"라는 말을 '안 어울린다는 비난'으로 읽었을 수 있습니다.","start":225.107,"end":229.783},{"n":53,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"회사에서 상사가 \"이 부분 다시 볼까요?\" 하고 말하면, 일을 고치자는 뜻일 수 있습니다.","start":230.163,"end":235.663},{"n":54,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그런데 이 버릇이 강하면 '나를 무능하다고 보는구나'로 들립니다.","start":236.043,"end":239.844},{"n":55,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그래서 고칠 점을 듣기도 전에 날카롭게 받아치기 쉽습니다.","start":240.224,"end":243.714},{"n":56,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"한마디로, 같은 말도 거절에 예민한 귀에는 공격으로 들리기 쉽습니다.","start":244.094,"end":248.772},{"n":57,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"세 번째 이유는, 내가 어떤 사람인지에 대한 생각이 흔들리고 있다는 것입니다.","start":249.772,"end":254.183},{"n":58,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"심리학에서는 이것을 자기 개념이 흐리다고 말합니다.","start":254.563,"end":257.469},{"n":59,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'나는 이런 사람이다'라는 생각이 분명하지 않은 상태입니다.","start":257.849,"end":260.968},{"n":60,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"자기 개념이 분명한 사람은 남의 말에 덜 흔들리는 편입니다.","start":261.348,"end":265.186},{"n":61,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'저 사람 말은 저 사람 생각이고, 나는 나'라고 넘길 수 있습니다.","start":265.566,"end":269.376},{"n":62,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그런데 이 생각이 흐리면, 남의 한마디가 나에 대한 판결처럼 들릴 수 있습니다.","start":269.756,"end":274.416},{"n":63,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그 한마디에 내가 무너질 것 같아, 더 세게 맞서기 쉽습니다.","start":274.796,"end":278.429},{"n":64,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'나는 일을 잘하는 사람인가' 하는 생각이 날마다 바뀌는 사람이 있다고 해 보겠습니다.","start":278.809,"end":283.256},{"n":65,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"보고서 오타 하나를 지적받았을 뿐인데, 나를 통째로 부정당한 것처럼 느낍니다.","start":283.636,"end":288.546},{"n":66,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그래서 별일 아닌 말에도 날카롭게 맞서기 쉽습니다.","start":288.926,"end":291.931},{"n":67,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"앞의 한국 대학생 연구에서, 나에 대한 생각이 흐린 학생일수록 순간 공격이 많았습니다.","start":292.311,"end":298.031},{"n":68,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그런 학생일수록 남의 행동을 나쁜 뜻으로 읽는 경향도 강했습니다.","start":298.411,"end":302.359},{"n":69,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"한마디로, 내가 흔들릴수록 남의 말 한마디에 더 크게 맞서기 쉽습니다.","start":302.739,"end":307.294},{"n":70,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그렇다면 이 고리는 어떻게 끊을 수 있을까요?","start":307.674,"end":310.384},{"n":71,"part":"내가 이런 쪽이라면","text":"연구로 효과를 확인한 방법은 아니지만, 해 볼 만한 것이 세 가지 있습니다.","start":311.384,"end":316.065},{"n":72,"part":"내가 이런 쪽이라면","text":"첫 번째로, 애매한 말에 화가 나면 '다른 뜻일 수도 있다'를 하나만 떠올려 보세요.","start":316.445,"end":321.469},{"n":73,"part":"내가 이런 쪽이라면","text":"\"그 옷 새로 샀어?\"는 '예뻐서 물어봤다'일 수도 있습니다.","start":321.849,"end":325.342},{"n":74,"part":"내가 이런 쪽이라면","text":"다른 해석이 하나 있으면, 맞받아치기 전에 한 번 멈출 틈이 생길 수 있습니다.","start":325.722,"end":330.35},{"n":75,"part":"내가 이런 쪽이라면","text":"두 번째로, 화를 내기 전에 몸이 먼저 보내는 신호를 알아차리세요.","start":330.73,"end":334.883},{"n":76,"part":"내가 이런 쪽이라면","text":"얼굴이 달아오르거나, 주먹에 힘이 들어가거나, 숨이 빨라집니다.","start":335.263,"end":339.503},{"n":77,"part":"내가 이런 쪽이라면","text":"이 신호가 오면 바로 대답하지 말고, 물을 한 모금 마시고 숨을 고르세요.","start":339.883,"end":344.552},{"n":78,"part":"내가 이런 쪽이라면","text":"\"잠깐만, 이따 얘기하자\"처럼 틈을 버는 말도 좋습니다.","start":344.932,"end":348.382},{"n":79,"part":"내가 이런 쪽이라면","text":"세 번째로, 화 대신 그 밑에 있는 마음을 말로 해 보세요.","start":348.762,"end":352.262},{"n":80,"part":"내가 이런 쪽이라면","text":"\"왜 그렇게 말해!\" 대신 \"나 지금 좀 서운해\"라고 말하는 것입니다.","start":352.642,"end":356.642},{"n":81,"part":"내가 이런 쪽이라면","text":"따지는 말이 아니라, 내 마음만 말하는 것입니다.","start":357.022,"end":360.002},{"n":82,"part":"내가 이런 쪽이라면","text":"지적을 받으면 '이건 오타 하나 이야기'처럼, 일과 나를 나눠 말해 보는 것도 방법입니다.","start":360.382,"end":365.728},{"n":83,"part":"내가 이런 쪽이라면","text":"이런 일이 자주 반복되어 관계가 자꾸 망가진다면, 상담을 받아 보는 것도 좋습니다.","start":366.108,"end":371.265},{"n":84,"part":"내가 이런 쪽이라면","text":"학교나 회사 상담실이 없다면, 지역 정신건강복지센터에 먼저 전화해 볼 수 있습니다.","start":371.645,"end":377.061},{"n":85,"part":"내가 이런 쪽이라면","text":"센터 상담을 기다리는 동안 힘들 때 걸 수 있는 번호는 설명란에 적어 두겠습니다.","start":377.441,"end":382.321},{"n":86,"part":"가까운 사람이 이렇다면","text":"반대로 가까운 사람이 이런 쪽이라면, 알아 둘 것이 있습니다.","start":383.321,"end":386.884},{"n":87,"part":"가까운 사람이 이렇다면","text":"그 사람의 날카로운 말이 꼭 나 때문만은 아닐 수 있습니다.","start":387.264,"end":390.491},{"n":88,"part":"가까운 사람이 이렇다면","text":"지난 상처가 같이 반응하는 경우도 있습니다.","start":390.871,"end":393.201},{"n":89,"part":"가까운 사람이 이렇다면","text":"같은 말로 맞받아치면, '역시 나를 공격하는구나'로 들리기 쉽습니다.","start":393.581,"end":398.001},{"n":90,"part":"가까운 사람이 이렇다면","text":"내 말이 서운하게 들릴 만했는지 한 번만 돌아보되, 매번 내 탓으로 돌릴 필요는 없습니다.","start":398.381,"end":403.693},{"n":91,"part":"가까운 사람이 이렇다면","text":"그다음 내 뜻을 짧고 분명하게 다시 말해 주세요.","start":404.073,"end":406.923},{"n":92,"part":"가까운 사람이 이렇다면","text":"\"안 어울린다는 뜻이 아니라, 새 옷 같아서 물어본 거야.\"","start":407.303,"end":410.711},{"n":93,"part":"가까운 사람이 이렇다면","text":"다만 이유가 있다고 해서, 상처 주는 말이 괜찮다는 뜻은 아닙니다.","start":411.091,"end":414.82},{"n":94,"part":"가까운 사람이 이렇다면","text":"같은 일이 계속되어 내가 지친다면, \"그렇게 말하면 나도 힘들어\"라고 선을 그어도 됩니다.","start":415.2,"end":420.604},{"n":95,"part":"가까운 사람이 이렇다면","text":"상대를 이해하는 것과 모든 말을 참는 것은 다른 일입니다.","start":420.984,"end":424.124},{"n":96,"part":"가까운 사람이 이렇다면","text":"말이 위협이나 폭력으로 번진다면, 이해보다 내 안전이 먼저입니다.","start":424.504,"end":428.758},{"n":97,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":429.758,"end":432.644},{"n":98,"part":"정리","text":"상처받은 사람이 날카로워질 때, 까닭일 수 있는 것은 세 가지였습니다.","start":433.024,"end":437.404},{"n":99,"part":"정리","text":"첫째, 거절당할 낌새에 미리 날을 세웁니다.","start":437.784,"end":440.624},{"n":100,"part":"정리","text":"둘째, 남의 말과 행동을 나를 공격하려는 뜻으로 읽습니다.","start":441.004,"end":444.844},{"n":101,"part":"정리","text":"셋째, 내가 어떤 사람인지에 대한 생각이 흔들리고 있습니다.","start":445.224,"end":448.733},{"n":102,"part":"정리","text":"다만 연구에서 본 것은 함께 나타나는 약한 연결이라, 순서는 아직 모릅니다.","start":449.113,"end":454.118},{"n":103,"part":"정리","text":"애매한 말에 날카로운 말이 나오려 할 때, '다른 뜻일 수도 있다'를 떠올려 보세요.","start":454.498,"end":459.322},{"n":104,"part":"정리","text":"시청해주셔서 감사합니다.","start":459.702,"end":461.232}],"subs":[[0.2,4.4,"가볍게 한 말에 상대가 갑자기 날카롭게 받아친 적이 있으신가요?"],[4.4,10.17,"\"그 옷 새로 샀어?\" 하고 물었을 뿐인데,\n\"왜, 안 어울려?\" 하고 화를 냅니다."],[10.17,14.547,"그런데 거꾸로, 내가 그 날카로운 쪽이었던 적은 없으셨나요?"],[14.547,18.955,"한 강연 영상에, 이런 댓글이 9천 개가 넘는 공감을 받았습니다."],[18.955,23.777,"상처받았다는 이유로 우리가\n얼마나 날카로웠는지 돌아보게 된다는 말이었습니다."],[23.777,26.812,"상처받은 사람은 왜 오히려 날카로워질까요?"],[26.812,28.722,"결론부터 말씀드리겠습니다."],[28.722,32.941,"거절로 상처받은 뒤라면, 까닭은 세 가지로 볼 수 있습니다."],[32.941,36.161,"첫째, 거절당할 낌새에 미리 날을 세웁니다."],[36.161,40.381,"둘째, 남의 말과 행동을 나를 공격하려는 뜻으로 읽습니다."],[40.381,44.27,"셋째, 내가 어떤 사람인지에 대한 생각이 흔들리고 있습니다."],[44.27,49.93,"물론 상처받은 사람이 모두 날카로워지지도,\n날카로운 사람이 모두 상처받은 것도 아닙니다."],[49.93,54.8,"혼자 삭이거나 자기를 탓하는 사람도,\n오히려 더 다정해지는 사람도 있습니다."],[54.8,57.756,"오늘은 그중 날카로워지는 쪽 이야기입니다."],[57.756,62.1,"그리고 이유를 아는 것은 감싸려는 것이 아니라, 멈추기 위해서입니다."],[62.1,67.034,"내가 이런 쪽일 때와 가까운 사람이\n이럴 때 할 일도 끝에 말씀드리겠습니다."],[67.034,72.352,"날카로움을 다룬 설문들이 잰 것은 '상처'가 아니라,\n'거절에 얼마나 예민한가'입니다."],[72.352,78.082,"이것을 거부 민감성이라고 하는데,\n거절을 미리 걱정하거나 미리 화가 나 있는 마음입니다."],[78.082,80.702,"그럼 상처와는 어떻게 이어질까요?"],[80.702,84.712,"2022년, 실험 연구들을 모은 메타분석이 있습니다."],[84.712,89.832,"메타분석은 같은 주제의 연구들을\n모아 결과를 다시 계산하는 방법입니다."],[89.832,95.912,"참가자에게 따돌림이나 거절을 겪게 하자,\n그 뒤 평균적으로 더 공격적으로 행동했습니다."],[95.912,99.532,"방금 받은 상처가 날카로움으로 이어질 수 있다는 뜻입니다."],[99.532,104.357,"실험실에서 잠깐 겪은 거절이라, 일상과 똑같지는 않습니다."],[104.357,108.873,"첫 번째 이유는, 거절당할 낌새에 미리 날을 세운다는 것입니다."],[108.873,113.809,"거절에 예민한 사람은, 비슷한 일이 다시 일어날까 봐 자주 대비합니다."],[113.809,118.125,"답장이 조금 늦으면 '나를 싫어하나' 하는 생각이 먼저 들기 쉽습니다."],[118.125,122.645,"회의에서 내 의견이 그냥 넘어가면, 무시당했다고 느끼기도 합니다."],[122.645,125.772,"그리고 상처받기 전에 먼저 쏘아붙이기도 합니다."],[125.772,130.799,"혹시 연락이 뜸한 친구에게 \"왜 연락 안 해?\" 하고\n먼저 따진 적이 있으신가요?"],[130.799,135.007,"그 말 밑에는 '또 나만 뒷전이네' 하는 서운함과 화가 있을 수 있습니다."],[135.007,141.714,"2021년, 연구 52편을 모은 분석에서도 거절에\n예민할수록 공격이 조금 더 많았습니다."],[141.714,146.839,"특히 걱정보다 화가 먼저 나는 사람,\n순간 맞받아치는 공격에서 그랬습니다."],[146.839,152.169,"한마디로,\n날카로운 말은 거절의 낌새에 먼저 튀어나오는 반응일 수 있습니다."],[152.169,157.059,"두 번째 이유는,\n남의 말과 행동을 나를 공격하려는 뜻으로 읽는다는 것입니다."],[157.059,160.599,"심리학에서는 이것을 적대적 귀인 편향이라고 부릅니다."],[160.599,166.023,"뜻이 분명하지 않은 남의 행동을,\n나에게 나쁜 마음을 품은 행동으로 읽는 버릇입니다."],[166.023,170.174,"예를 들어 지하철에서 누가 어깨를 부딪치고 지나갔다고 해 보겠습니다."],[170.174,173.615,"많은 사람은 '사람이 많아서 그랬나 보다' 하고 넘어갑니다."],[173.615,177.775,"그런데 이 버릇이 강한 사람은 '일부러 밀쳤다'고 읽기 쉽습니다."],[177.775,181.284,"그렇게 읽고 나면, 화를 내는 게 당연하게 느껴집니다."],[181.284,184.324,"물론 정말 나쁜 뜻이 담긴 말도 있습니다."],[184.324,186.914,"그것을 알아챈 것은 편향이 아닙니다."],[186.914,190.962,"문제는 뜻이 애매한 말까지 모두 공격으로 읽을 때입니다."],[190.962,197.242,"2023년 한국 대학생 250명에게 한 번\n온라인 설문을 한 연구가 이 부분을 봤습니다."],[197.242,202.852,"여기서 공격은 계획한 것이 아니라,\n화가 나는 순간 바로 맞받아치는 공격입니다."],[202.852,207.862,"거절에 예민한 학생일수록 남의 행동을\n나쁜 뜻으로 읽는 경향이 강했습니다."],[207.862,212.751,"그리고 그런 학생일수록,\n화가 나는 순간 바로 맞받아치는 공격도 많았습니다."],[212.751,217.681,"연구자들은 해석이 거절 예민함과 공격 사이를\n잇는 다리일 수 있다고 봤습니다."],[217.681,221.799,"다만 한 번 한 설문이라, 무엇이 먼저인지는 알 수 없습니다."],[221.799,225.107,"처음에 말씀드린 옷 이야기도 이렇게 볼 수 있습니다."],[225.107,230.163,"\"그 옷 새로 샀어?\"라는 말을 '안 어울린다는\n비난'으로 읽었을 수 있습니다."],[230.163,236.043,"회사에서 상사가 \"이 부분 다시 볼까요?\" 하고 말하면,\n일을 고치자는 뜻일 수 있습니다."],[236.043,240.224,"그런데 이 버릇이 강하면 '나를 무능하다고 보는구나'로 들립니다."],[240.224,244.094,"그래서 고칠 점을 듣기도 전에 날카롭게 받아치기 쉽습니다."],[244.094,249.772,"한마디로, 같은 말도 거절에 예민한 귀에는 공격으로 들리기 쉽습니다."],[249.772,254.563,"세 번째 이유는,\n내가 어떤 사람인지에 대한 생각이 흔들리고 있다는 것입니다."],[254.563,257.849,"심리학에서는 이것을 자기 개념이 흐리다고 말합니다."],[257.849,261.348,"'나는 이런 사람이다'라는 생각이 분명하지 않은 상태입니다."],[261.348,265.566,"자기 개념이 분명한 사람은 남의 말에 덜 흔들리는 편입니다."],[265.566,269.756,"'저 사람 말은 저 사람 생각이고, 나는 나'라고 넘길 수 있습니다."],[269.756,274.796,"그런데 이 생각이 흐리면,\n남의 한마디가 나에 대한 판결처럼 들릴 수 있습니다."],[274.796,278.809,"그 한마디에 내가 무너질 것 같아, 더 세게 맞서기 쉽습니다."],[278.809,283.636,"'나는 일을 잘하는 사람인가' 하는 생각이\n날마다 바뀌는 사람이 있다고 해 보겠습니다."],[283.636,288.926,"보고서 오타 하나를 지적받았을 뿐인데,\n나를 통째로 부정당한 것처럼 느낍니다."],[288.926,292.311,"그래서 별일 아닌 말에도 날카롭게 맞서기 쉽습니다."],[292.311,298.411,"앞의 한국 대학생 연구에서,\n나에 대한 생각이 흐린 학생일수록 순간 공격이 많았습니다."],[298.411,302.739,"그런 학생일수록 남의 행동을 나쁜 뜻으로 읽는 경향도 강했습니다."],[302.739,307.674,"한마디로, 내가 흔들릴수록 남의 말 한마디에 더 크게 맞서기 쉽습니다."],[307.674,311.384,"그렇다면 이 고리는 어떻게 끊을 수 있을까요?"],[311.384,316.445,"연구로 효과를 확인한 방법은 아니지만,\n해 볼 만한 것이 세 가지 있습니다."],[316.445,321.849,"첫 번째로, 애매한 말에 화가 나면\n'다른 뜻일 수도 있다'를 하나만 떠올려 보세요."],[321.849,325.722,"\"그 옷 새로 샀어?\"는 '예뻐서 물어봤다'일 수도 있습니다."],[325.722,330.73,"다른 해석이 하나 있으면,\n맞받아치기 전에 한 번 멈출 틈이 생길 수 있습니다."],[330.73,335.263,"두 번째로, 화를 내기 전에 몸이 먼저 보내는 신호를 알아차리세요."],[335.263,339.883,"얼굴이 달아오르거나, 주먹에 힘이 들어가
