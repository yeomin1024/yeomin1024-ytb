# 분노 댓글·제목 셈 설정 — tools/anger_words.py v1.0 (재테크)
# VERSION: v1.0 — 2026-11-02 — 최초 (사용자 지시 2026-11-02 "아니 제목좀 더 자극적으로 해봐 댓글보면 나라가 일을 안한다 도둑놈이다 이렇게 말하던데 좀 참고해보라고").
# 댓글 갈래 = 시청자가 '누구에게·어떻게' 화를 내는지. 같은 댓글 id 는 한 번만 셈 · 채널 주인 댓글 뺌.
# 기준 = 위 댓글(답글 뺌) 좋아요 평균 — 갈래 평균 ÷ 전체 평균 = '좋아요 배수'.
# ※ 정보 제공용 — 세무·법률 상담이 아님.

[comments]
# 주어(나라·공단·세금…) + 행동(떼어 간다·도둑…) — 갈래 pattern 의 {STATE}·{TAKE} 자리에 그대로 들어감 (B·B2)
STATE = '(나라|국가|정부|국회|공단|국민연금|건보|건강보험|국세청|세금|기재부|복지부|정책|제도)'
TAKE = '(도둑|날강도|강도|삥|뜯어|뜯는|뜯겨|털어|갈취|착취|약탈|빨대|등골|빼앗|뺏|떼어\s?가|떼\s?가|떼먹|가져가|훔쳐|날로\s?먹|사기)'

[[group]]
code = "A"
name = "나라·국회가 일을 안 한다"
pattern = '(나라|국가|정부|국회|공단|국민연금|건보|건강보험|국세청|세금|기재부|복지부|정책|제도|국회의원|공무원).{0,12}(일을?\s?안|일\s?좀|뭐\s?하|하는\s?게\s?없|손\s?놓|탁상|무능)'

[[group]]
code = "B"
name = "나라·세금·공단이 떼어 간다 · 도둑"
pattern = "{STATE}.{0,25}{TAKE}|{TAKE}.{0,15}{STATE}"

[[group]]
code = "B2"
name = "(B 가운데) 도둑·강도 낱말"
pattern = "{STATE}.{0,25}(도둑|강도|날강도)|(도둑|강도|날강도).{0,15}{STATE}"

[[group]]
code = "C"
name = "이게 나라냐"
pattern = '이게\s?나라|나라\s?맞|나라냐|국가냐|헬조선'

[[group]]
code = "D"
name = "성실히 낸 사람만 바보·호구"
pattern = '(성실|열심히|꼬박|아끼고|알뜰).{0,25}(손해|바보|호구|역차별|봉)|낸\s?사람만|호구\s?(된|만|취급)|바보\s?(된|만들)'

[[group]]
code = "E"
name = "세금·건보료 폭탄"
pattern = '(세금|소득세|건보료|보험료|가산세)\s?폭탄'

[[group]]
code = "P"
name = "정당·정치인 이름 (채널 선 밖 — 비교용)"
pattern = '민주당|국민의힘|국힘|이재명|윤석열|문재인|좌파|우파|빨갱'

[titles]
# compare.csv 비교 집단(in_compare)의 success 몫
"따옴표로 시작" = "^\\s*[\"“'‘]"
"따옴표 안에 분노 말" = '["“][^"”]*(열받|화나|억울|황당|분통|어이없|말이 됩니까|말이 되|도둑|날강도|바보|호구|죄냐|일을 안)[^"”]*["”]'
"나라·정부·공단이 주어" = '나라가|국가가|정부가|공단이|국민연금공단|국세청이|나라에서|국가에서|정부에서'
"떼어 간다·뺏는다·도둑" = '도둑|강도|뜯|털어|빼앗|뺏|떼어|떼 ?가|떼먹|가져가|훔쳐|삥'
"억울·황당·분통·충격" = '억울|황당|분통|분노|충격|발칵|날벼락|뒤통수|이게 말이'
"손해·날린다·깎인다·폭탄" = '손해|날린|날려|깎|삭감|감액|폭탄'
"안 알려 준다·숨긴다·모르면" = '안\s?알려|알려주지\s?않|숨기|모르면|절대'
