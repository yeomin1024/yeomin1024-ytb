# (v1.0 — 2026-10-28 — 새로 (사용자 지시 2026-10-28 "주식 주제 관련 세션에서 했던것처럼 똑같은 방식으로 진행해서 유튜브 분석부터 요약본까지 만들어봐"
#   — 주식 stock/topics/settings.toml v1.0 · 재테크 economic/topics/settings.toml v1.0 과 같은 꼴: 20개씩 · 좋음·나쁨을 배움 · 명확한 결론만).)
#   역사 = 채널 설명 history/guides/channel.md (임시 — 조선 백성의 삶 주력·세계사 실험).
# ※ 연구·교육용 분석. 역사 사실은 사료·연구 원문으로 확인한 뒤 대본에 쓴다.

[page]
NAME = "역사"
# 평가판 (Artifact — 좋음·나쁨을 눌러 남김, db 모음 'marks'). 갱신하면 같은 주소로 다시 올림 (다른 대화에서는 Artifact publish 에 url).
URL = "https://claude.ai/artifact/M6MvGi7WJmC9wmN5tPvHoB"
# 안내 문구 (tools/topic_ideas.py v1.2.2 — 없으면 주식 글)
NOTE_DOC = "※ 연구·교육용. 결론은 **예상**이며 사료·연구 원문 확인과 계산으로 확정한다 — 판정 규칙이 있어 어느 쪽으로 나와도 결론은 하나."
NOTE_PAGE = "※ 연구·교육용. 결론은 사료 확인 전 예상입니다."

[fields]
# 후보 칸 설명 (material.md 머리 표 — 주식 글 대신)
data = "자료 (사료 원문 — 조선왕조실록·승정원일기·일기·여행기·연구 논문 · 지도 자료 historical-basemaps 등, 시대·연도 필수)"
format = "생활사 해설형 (조선 사람들은 정말 ~했을까) · 확인형 (댓글·통념이 사실인가 — 판정 하나) · 지도형 (세계사 — 연도별 지도·넓이) — history/guides/channel.md 1번"
market = "한국사 · 세계사"
data_kind = "사료 원문 · 계산(양·거리·수) · 지도 넓이 · 연구 통계 · 그 밖"

[batch]
SIZE = 20                 # 한 묶음 주제 수
MAX_PER_THEME = 6         # 한 묶음 안 같은 주제 묶음(analysis themes) 최대 — 역사는 '3. 조선'이 주력이라 주식·재테크(4)보다 넓게
MAX_PER_NEED = 2          # 같은 댓글 니즈(K01 …) 최대
EXPLORE = 3               # 평가가 쌓인 뒤: 아직 평가 없는 갈래에서 뽑는 자리

[score]
# 처음 점수 = 니즈 크기·주제 묶음 성공 비율·페르소나 몫·공급 틈·성공 사례 닮음의 가중합 (0~1) — 주식과 같은 무게
W_NEED = 0.30
W_THEME = 0.20
W_PERSONA = 0.15
W_GAP = 0.15
W_SUCCESS = 0.20
GAP_FULL = 30
SUCCESS_FULL = 0.15
W_LEARN_FEATURE = 0.5
W_LEARN_SIMILAR = 0.5

[dedupe]
SIM_MAX = 0.40            # 이미 쓴·쓰는 주제와 낱말 닮음(Jaccard) — 주식에서 맞춘 값 그대로
OVERLAP_MAX = 0.50
SIM_MAX_BATCH = 0.50
OVERLAP_MAX_BATCH = 0.60

[clarity]
# 결론에 이런 말이 있으면 '애매한 결론'으로 뺌 (주식과 같음 + 역사: '설이 있다'·'알려지지 않았다'·'논란이 있다')
VAGUE = '상황에\s?따라|경우에\s?따라|사람마다|개인차|케이스\s?바이|다를\s?수|일\s?수도|할\s?수도|될\s?수도|수도\s?있|신중|적절히|잘\s?판단|고려해야|알\s?수\s?없|정답은\s?없|모른다|애매|장단점|일장일단|나름|본인\s?선택|성향에\s?따라|설이\s?(있|갈)|알려지지\s?않|논란이\s?있'
# 결론에 숫자나 판정 말 (역사: '사실이었다'·'아니었다'·'더 많았다'·'먹었다' 같은 확인 말)
DECISIVE = '\d|보다|사실|아니었|아니다|절반|더\s?(많|적|크|작|높|낮|길|짧|넓|좁|일찍|늦)|많았|적었|길었|짧았|넓었|살았|먹었|썼다|했다|못\s?했|않았|없었|있었|됐다|이었다|였다|0\s?%|배'
# 자료에 시대·연도가 있어야 함 (topic_ideas v1.2.1 — 주식·재테크는 (19|20)\d\d. 역사 = 세 자리·네 자리 해 · N세기 · 기원전)
YEAR = '(?<!\d)\d{3,4}(?!\d)|\d{1,2}\s?세기|기원전'
# 판정 규칙에 기준(비교·문턱) — 기록이 어느 쪽으로 나와도 결론이 하나로
DECIDE = '보다|이상|이하|넘으면|못\s?넘으면|미만|초과|%|비율|배|이면|아니면|까지|부터|번|개|명|더\s?(적|많|크|작|높|낮)'

# 이미 쓴 주제 — 역사는 아직 만든 영상이 없음. 지금 쓰는 편은 history/source/*/요약본.txt 에서 저절로 읽음.

