  const nowIso = () => new Date().toISOString();
  const fmtN = n => n == null || n === "" ? "–" : Number(n).toLocaleString("ko-KR");
  const syncedAt = () => (S.common && S.common.synced_at) || B.synced_at || null;
  const pendingDoc = d => !!(d && d.at && (!syncedAt() || String(d.at) > String(syncedAt())));
  const pendChip = d => pendingDoc(d) ? `<span class="chip warn">Claude 반영 전</span>` : (d && d.at ? `<span class="chip ok">반영됨</span>` : "");

  // ───────── 편 · 단계 통과
  const cands = topic => [...S.col.episodes.values()].filter(c => c.topic === topic && !c.deleted).map(c => ({
    topic, id: "cand-" + c.id, docId: c.id, kind: "cand", title: c.title || "(제목 없음)", memo: c.memo || "", repo_gates: {}, lines: [], thumbs: [],
    thumb_main: [], thumb_sub: [], title_alts: [], persona: {}, history: [], audio: { status: "none", note: "판에서 더한 후보 — 대본 없음" }, video: {}, upload: null }));
  // v1.1 주제 자료를 아직 안 받은 주제는 common.json 편 요약으로 (단계 수·흐름 표용)
  const eps = topic => { const D = S.data[topic]; const base = D && D.episodes ? D.episodes : (((S.common || {}).summary || {})[topic] || []).map(x => Object.assign({ topic, light: true }, x)); return [...cands(topic), ...base]; };
  const tinfo = k => B.topics.find(t => t.key === k) || { key: k, name: k };
  const topicOn = t => { const d = S.col.topics.get(t.key); return d && typeof d.enabled === "boolean" ? d.enabled : !t.repo_off; };
  const visTopics = () => B.topics.filter(topicOn);
  function fixTopic() { const v = visTopics(); if (!v.some(t => t.key === S.topic)) S.topic = (v[0] || B.topics[0]).key; }
  const tname = k => tinfo(k).name || k;
  const gid = (ep, s) => `${ep.topic}__${ep.id}__${s}`;
  function own(ep, s) {
    const g = S.col.gates.get(gid(ep, s));
    if (g && typeof g.pass === "boolean") return { v: g.pass, by: "board", doc: g };
    return { v: !!(ep.repo_gates || {})[s], by: "repo" };
  }
  function eff(ep, s) { for (const x of STAGES) { if (!own(ep, x).v) return false; if (x === s) return true; } return false; }
  function at(ep) { for (const x of STAGES) if (!own(ep, x).v) return x; return "done"; }
  const kindChip = ep => ep.kind === "shorts" ? `<span class="chip info">쇼츠</span>` : ep.kind === "cand" ? `<span class="chip acc">판 후보</span>` : `<span class="chip mute">롱폼</span>`;
  function stepsHtml(ep) {
    const cur = at(ep);
    return `<span class="steps" title="단계: ${e(STAGES.map(s => SK[s] + (eff(ep, s) ? " ✓" : "")).join(" → "))}">${STAGES.map(s => `<i class="${eff(ep, s) ? "on" : s === cur ? "cur" : ""}"></i>`).join("")}</span>
      <span class="small">${cur === "done" ? "업로드까지 끝" : "지금 " + e(SK[cur])}</span>`;
  }
  function gateHtml(ep, s, label) {
    const i = STAGES.indexOf(s), prevOk = i === 0 || eff(ep, STAGES[i - 1]);
    const o = own(ep, s), on = o.v && prevOk;
    const dis = !prevOk || !S.db || !S.canWrite;
    const by = o.by === "board" ? `<span class="chip acc">판 체크</span>${pendChip(o.doc)}` : (o.v ? `<span class="chip mute">저장소 기준</span>` : "");
    const reset = o.by === "board" ? `<button class="btn ghost sm" type="button" data-act="gate-reset" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${s}">저장소 기준으로</button>` : "";

      <input type="checkbox" data-act="gate" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${s}" ${o.v ? "checked" : ""} ${dis ? "disabled" : ""}>
      ${e(label || SK[s] + " 통과")}</label>${by}${reset}${prevOk ? "" : `<span class="small">${e(SK[STAGES[i - 1]])} 통과 전</span>`}</span>`;
  }
  function epHead(ep, extra) {
    return `<div class="ephead"><div style="min-width:0;display:grid;gap:2px">
      <div class="row">${kindChip(ep)}<span class="id">${e(ep.id)}</span></div>
      <h3>${e(ep.title || (ep.summary_title ? "요약본: " + ep.summary_title : "") || "(제목 아직 없음)")}</h3>
      <div class="row">${stepsHtml(ep)}</div></div>${extra || ""}</div>`;
  }

  // ───────── 규칙
  function rulesOf(stage) {
    const R = ((S.common || {}).rules || {}).stages || {};
    const base = R[stage] || {};
    const out = [];
    for (const scope of ["common", S.topic]) {
      const items = (base[scope] || []).map(r => ({ ...r, stage, scope }));
      const ids = new Set(items.map(r => r.id));
      for (const d of S.col.rules.values()) if (d.stage === stage && (d.scope || "common") === scope && !ids.has(d.id)) items.push({ id: d.id, text: d.text, src: "판에서 더함", stage, scope, added: true });
      for (const r of items) { const d = S.col.rules.get(r.id); if (d) { r.doc = d; if (d.text) r.text = d.text; if (d.deleted) r.deleted = true; } }
      out.push({ scope, items });
    }
    return out;
  }
  function rulesBox(stage, title) {
    const groups = rulesOf(stage);
    const tname = (S.data[S.topic] || {}).name || S.topic;
    const body = groups.map(g => `<div class="scope">${g.scope === "common" ? "공통" : e(tname) + " 주제"}</div>` + (g.items.length ? g.items.map(r => {
      const k = "rule:" + r.id;
      if (S.edit === k) return `<div class="rule"><textarea id="ed-${e(r.id)}">${e(r.text)}</textarea><div class="row"><button class="btn sm" data-act="rule-save" data-id="${e(r.id)}" data-stage="${stage}" data-scope="${e(g.scope)}">저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div>`;
      return `<div class="rule" ${r.deleted ? 'style="opacity:.55"' : ""}><div class="t">${r.deleted ? "<s>" + e(r.text) + "</s>" : e(r.text)}</div><div class="meta">
        ${r.src ? `<span>${e(r.src)}</span>` : ""}${r.doc ? pendChip(r.doc) : ""}${r.deleted ? `<span class="chip bad">뺌</span>` : ""}
        ${S.confirm === k ? `<span class="confirm">이 규칙을 뺄까요?<button class="btn bad sm" data-act="rule-del" data-id="${e(r.id)}" data-stage="${stage}" data-scope="${e(g.scope)}">빼기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>`
          : r.deleted ? `<button class="btn ghost sm" data-act="rule-undel" data-id="${e(r.id)}" data-stage="${stage}" data-scope="${e(g.scope)}" ${wr()}>되살리기</button>`
          : `<button class="btn ghost sm" data-act="edit" data-k="${e(k)}" ${wr()}>고치기</button><button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>빼기</button>`}</div></div>`;
    }).join("") : `<div class="empty">아직 없음</div>`)).join("");
    return `<section class="box"><header><h2>${e(title || SK[stage] + " 규칙")}</h2><span class="small">고치면 Claude 가 지시사항 문서에도 반영</span></header>${body}
      <details><summary class="small">규칙 더하기</summary><div class="fb" style="margin-top:6px">
        <select id="nr-scope-${stage}"><option value="common">공통 (모든 주제)</option><option value="${e(S.topic)}">${e(tname)} 주제만</option></select>
        <textarea id="nr-text-${stage}" placeholder="한 줄 규칙 — 예: 제목 첫 낱말은 시청자가 겪는 장면으로"></textarea>
        <div class="row"><button class="btn sm" data-act="rule-add" data-stage="${stage}" ${wr()}>더하기</button></div></div></details></section>`;
  }
  const wr = () => (S.db && S.canWrite) ? "" : "disabled";

  // ───────── 피드백 (제목·썸네일·대본 줄·영상)
  function fbOf(topic, ep, stage, line) {
    return [...S.col.feedback.values()].filter(f => f.topic === topic && f.ep === ep && f.stage === stage && (line == null ? !f.line : Number(f.line) === Number(line)))
      .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  }
  function fbBox(ep, stage, line, hint) {
    const L = fbOf(ep.topic, ep.id, stage, line);
    const key = `fbnew:${ep.id}:${stage}:${line == null ? "" : line}`;
    const items = L.map(f => {
      const k = "fb:" + f.id;
      if (S.edit === k) return `<div class="fbitem"><textarea id="ed-${e(f.id)}">${e(f.text)}</textarea><div class="row"><button class="btn sm" data-act="fb-save" data-id="${e(f.id)}">저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div>`;

  }

  // ───────── 참고 자료 (분석 성공 사례 — 고치기·빼기·더하기)
  function refsOf(kind) {
    const R = (S.data[S.topic] || {}).refs || {};

    const out = base.map(r => { const d = S.col.refs.get(r.id); return d ? { ...r, text: d.text ?? r.text, sub: d.sub ?? r.sub, note: d.note || "", deleted: !!d.deleted, doc: d } : r; });
    for (const d of S.col.refs.values()) if (d.topic === S.topic && d.kind === kind && !base.some(r => r.id === d.id)) out.unshift({ id: d.id, text: d.text, sub: d.sub, note: d.note, deleted: !!d.deleted, doc: d, added: true });

  }
  function refsBox(kind) {
    const R = (S.data[S.topic] || {}).refs || {};

    const q = S.refq.trim();
    const L = all.filter(r => !q || (r.text + " " + (r.sub || "") + " " + (r.channel || "")).includes(q));
    const shown = L.slice(0, S.open.has("refs-all-" + kind) ? 400 : 30);
    const item = r => {
      const k = `ref:${r.id}`;
      if (S.edit === k) return `<div class="ref noimg"><div class="fb"><input type="text" id="ed-${e(r.id)}" value="${e(r.text)}">${kind === "thumb" ? `<input type="text" id="eds-${e(r.id)}" value="${e(r.sub || "")}" placeholder="보조 문구">` : ""}
        <input type="text" id="edn-${e(r.id)}" value="${e(r.note || "")}" placeholder="메모 (왜 참고하는지)"><div class="row"><button class="btn sm" data-act="ref-save" data-id="${e(r.id)}" data-kind="${kind}">저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div></div>`;
      const meta = [r.channel, r.views != null ? "조회 " + fmtN(r.views) : "", r.ratio != null ? "구독자 배수 " + r.ratio : "", r.published, r.shorts ? "쇼츠" : "", r.format].filter(Boolean).join(" · ");
      return `<div class="ref ${r.img ? "" : "noimg"}" ${r.deleted ? 'style="opacity:.5"' : ""}>${r.img ? `<img src="${e(r.img)}" alt="" loading="lazy">` : ""}<div style="min-width:0;display:grid;gap:2px">
        <div class="t">${r.deleted ? "<s>" + e(r.text) + "</s>" : e(r.text)}</div>${kind === "thumb" && r.sub ? `<div class="s">보조: ${e(r.sub)}</div>` : ""}
        ${kind === "thumb" && r.title ? `<div class="s">제목: ${e(r.title)}</div>` : ""}<div class="s">${e(meta)}${r.vid ? ` · <a href="https://www.youtube.com/watch?v=${encodeURIComponent(r.vid)}" target="_blank" rel="noopener">영상</a>` : ""}</div>
        ${r.note ? `<div class="s">메모: ${e(r.note)}</div>` : ""}<div class="row">${r.added ? `<span class="chip acc">판에서 더함</span>` : ""}${r.doc ? pendChip(r.doc) : ""}
        ${S.confirm === k ? `<span class="confirm">참고 자료에서 뺄까요?<button class="btn bad sm" data-act="ref-del" data-id="${e(r.id)}" data-kind="${kind}">빼기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>`
          : r.deleted ? `<button class="btn ghost sm" data-act="ref-undel" data-id="${e(r.id)}" data-kind="${kind}" ${wr()}>되살리기</button>`
          : `<button class="btn ghost sm" data-act="edit" data-k="${e(k)}" ${wr()}>고치기</button><button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>빼기</button>`}</div></div></div>`;
    };
    const note = kind === "thumb" && !all.length ? `<p class="empty">${e(R.thumb_note || "성공 사례 썸네일 문구가 아직 없음")}</p>` : "";
    return `<section class="box"><header><h2>${kind === "title" ? "성공 사례 제목" : "성공 사례 썸네일 문구"}</h2><span class="small">${all.filter(r => !r.deleted).length}개 · 기본 = 분석 결과</span></header>
      <p class="small">${e(kind === "title" ? R.source || "" : R.thumb_source || R.source || "")} — 고치거나 빼거나 더할 수 있습니다 (분석 원본은 그대로, 판에만 저장).</p>
      <input type="text" id="refq" placeholder="찾기 — 낱말·채널" value="${e(S.refq)}">${note}
      <div>${shown.map(item).join("") || `<div class="empty">맞는 것 없음</div>`}</div>
      ${L.length > shown.length ? `<button class="btn ghost sm" data-act="open" data-k="refs-all-${kind}">${L.length - shown.length}개 더 보기</button>` : ""}
      <details><summary class="small">참고 자료 더하기</summary><div class="fb" style="margin-top:6px"><input type="text" id="nref-${kind}" placeholder="${kind === "title" ? "제목" : "주요 문구"}">
        ${kind === "thumb" ? `<input type="text" id="nrefs-${kind}" placeholder="보조 문구 (선택)">` : ""}<input type="text" id="nrefn-${kind}" placeholder="메모 — 어디서 봤는지, 왜 참고하는지">
        <div class="row"><button class="btn sm" data-act="ref-add" data-kind="${kind}" ${wr()}>더하기</button></div></div></details></section>`;
  }
  function wordsBox() {
    const R = (S.data[S.topic] || {}).refs || {};
    const chips = (R.freq || []).map(w => `<span class="word">${e(w.word)}<b>${w.n}</b></span>`).join("");
    const tbl = (L, cap) => L && L.length ? `<div class="tablebox"><table><caption class="small" style="text-align:left">${cap}</caption><thead><tr><th>낱말·꼴</th><th>든 제목</th><th>성공 비율</th><th>차이</th></tr></thead><tbody>${L.map(w => `<tr><td>${e(w.word)}</td><td class="num">${w.n}</td><td class="num">${Math.round(w.rate * 100)}%</td><td class="num">${w.diff > 0 ? "+" : ""}${Math.round(w.diff * 100)}%p</td></tr>`).join("")}</tbody></table></div>` : "";
    const rel = ((S.data[S.topic] || {}).related || []).map(docHtml).join("");
    return `<section class="box"><header><h2>자주 쓰는 낱말</h2><span class="small">성공 사례 제목 ${(R.titles || []).length}개에서</span></header>
      <div class="words">${chips || `<span class="empty">아직 없음</span>`}</div>${tbl(R.features, "제목 꼴 — 있을 때 성공 비율")}${tbl(R.words_up, "있으면 성공 비율이 높은 낱말")}${tbl(R.words_down, "있으면 성공 비율이 낮은 낱말")}
      ${rel ? `<div class="scope">관련 영상 낱말·형식 (tools/related_titles.py)</div>${rel}` : ""}</section>`;
  }
  const docHtml = d => `<details class="doc-d"><summary>${e(d.title)} <span class="chip mute">${e(d.date)}</span></summary><p class="small mono">${e(d.path)}${d.cut ? " · 앞부분만" : ""}</p><div class="doc">${d.html}</div></details>`;

  // ───────── 명령 상자
  const cmd = (lab, text) => `<div class="cmdbox"><span class="lab">${e(lab)}</span><pre class="cmd">${e(text)}</pre><div class="row"><button class="btn ghost sm" data-act="copy" data-text="${e(text)}">복사</button></div></div>`;

  // ───────── 공통 (트렌드 · 흐름)
  function spark(series) {
    if (!series || series.length < 2) return "";
    const mx = Math.max(1, ...series), w = 120, h = 28, n = series.length;
    const pts = series.map((v, i) => `${(i / (n - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - v / mx * (h - 6)).toFixed(1)}`);
    const last = pts[pts.length - 1].split(",");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4"/></svg>`;
  }
  function trendsResult(tr, label) {
    if (!tr || !tr.period) return `<p class="empty">${e(label)}: PC 결과 아직 없음 — PC 에서 아래 명령을 켜 두면 간격마다 받아 올립니다.</p>`;
    const ts = (tr.timeseries || []).flatMap(b => b.words.map(w => ({ ...w, dates: b.dates, file: b.file })));
    const t1 = ts.length ? `<div class="tablebox"><table><thead><tr><th>낱말</th><th>평균</th><th>최근 4주</th><th>앞 4주 대비</th><th>흐름</th></tr></thead><tbody>${ts.map(w => `<tr><td>${e(w.word)}</td><td class="num">${w.avg}</td><td class="num">${w.last4}</td><td class="num">${w.change == null ? "–" : "×" + w.change}</td><td>${spark(w.series)}</td></tr>`).join("")}</tbody></table></div>` : "";
    const t2 = (tr.related || []).map(r => `<details><summary>${e(r.keyword || CATS[r.cat] || "분류 " + r.cat)} — 급상승 ${r.rising.length} · 인기 ${r.top.length}</summary>
      <div class="grid2" style="margin-top:6px"><div><div class="scope">급상승</div><div class="words">${r.rising.map(x => `<span class="word">${e(x[0])}<b>${e(x[1] || "")}</b></span>`).join("") || `<span class="empty">없음</span>`}</div></div>
      <div><div class="scope">인기</div><div class="words">${r.top.map(x => `<span class="word">${e(x)}</span>`).join("") || `<span class="empty">없음</span>`}</div></div></div></details>`).join("");
    return `<div class="small">${e(label)} · 결과 ${e(tr.period)} · 올린 때 ${e(String(tr.pushed || "").slice(0, 16).replace("T", " "))} · <span class="mono">${e(tr.dir)}</span></div>${t1}${t2}`;
  }
  function trendsSetting(key, label, defaults, isOverall) {
    const d = S.col.trends.get(key);
    const st = ((S.common || {}).state || {}).trends || null;
    const repoCur = isOverall ? (st && st.overall) : (st && st.topics && st.topics[key]);
    const words = d ? (isOverall ? (d.cats || []).join(", ") : (d.words || []).join("\n")) : (isOverall ? (defaults.cats || []).join(", ") : (defaults.words || []).join("\n"));
    const hours = (d && d.every_hours) || (repoCur && repoCur.every_hours) || (S.common.trends_defaults || {}).every_hours || 24;
    return `<div class="card"><div class="ephead"><h3>${e(label)}</h3><div class="row">${d ? pendChip(d) : `<span class="chip mute">기본값 (studio.toml)</span>`}</div></div>

          <p class="small">'음성 생성' = 음성이 없거나 옛 대본이면 만듦 · '전부 다시' = 있어도 처음부터 · 줄 '재생성' = 그 문장만 새로 만들어 저장소 음성에 끼움. 음성을 듣고 괜찮으면 → </p>

  // ───────── 6 업로드
  // v1.2 재업로드 — 요청 시각(reupload_at)이 지금 업로드보다 나중이면 '요청됨' (다시 올리면 저절로 끝남)
  function reuploadHtml(ep, d) {
    const cur = (ep.history || []).find(h => h.current) || {};
    const asked = d.reupload && d.reupload_at && (!cur.uploadedAt || new Date(d.reupload_at) > new Date(cur.uploadedAt));
    const inQueue = asked && ((((S.common || {}).state || {}).reupload || {}).items || []).some(x => x.topic === ep.topic && x.id === ep.id && x.at === d.reupload_at);
    return `<div class="row">${asked
      ? `<span class="chip ${inQueue ? "acc" : "warn"}">${inQueue ? "재업로드 요청됨 — PC '올릴 대본'에 있음" : "재업로드 요청됨 — Claude 동기화 전"}</span><button class="btn ghost sm" data-act="reup-off" data-ep="${e(ep.id)}" ${wr()}>재업로드 취소</button>`
      : `<button class="btn sm" data-act="reup-on" data-ep="${e(ep.id)}" ${wr()}>재업로드</button>`}</div>
      <p class="small">[재업로드] → Claude 에게 '제작 판 동기화해' → PC 업로드 화면 '올릴 대본'에 [재업로드] 줄 → 다시 올리면 저절로 끝남. 옛 기록은 youtube_history.json 에 남고, 옛 영상은 스튜디오에서 직접 지우지 않으면 그대로 있습니다.</p>`;
  }
  function upDoc(ep) { return S.col.uploads.get(`${ep.topic}__${ep.id}`) || {}; }
  function viewUpload() {
    const v = VIEWS.find(x => x.key === "upload");
    const waiting = eligible(v), done = eps(S.topic).filter(ep => at(ep) === "done");
    const list = [...waiting, ...done];
    const [ep, pk] = picker(v, list);
    let body = `<div class="empty">업로드를 기다리는 편이 없음 (영상 통과 뒤 여기로)</div>`;
    if (ep) {
      const U = ep.upload || {}, d = upDoc(ep), checks = d.checks || {};
      const allMan = UPLOAD_CHECKS.every(c => checks[c]);
      const items = (U.items || []);
      const autoOk = items.length ? items.every(x => x[1]) && !(U.problems || []).length : false;
      const done = (ep.history || []).some(h => h.current);
      const thumbs = (U.thumbs || []).map(t => `<figure><img src="${e(t.img || "")}" alt="${e(t.name)}" loading="lazy"><figcaption>${t.main ? "<b>본안</b> · " : ""}${e(t.role)}</figcaption></figure>`).join("");
      body = `<div class="card">${epHead(ep, "")}
        ${U.status ? "" : `<p class="small">업로드 시트(upload.md)가 아직 없음 — Claude 가 만든 뒤 최종 확인할 수 있습니다.</p>`}
        ${U.title ? `<div class="scope">제목 (본안)</div><div style="font-weight:700">${e(U.title)} <span class="small">${U.title_chars}자</span></div>` : ""}
        ${thumbs ? `<div class="scope">썸네일</div><div class="thumbs">${thumbs}</div>` : ""}
        ${U.description ? `<div class="scope">설명란</div><div class="desc">${e(U.description)}</div>` : ""}
        ${(U.tags || []).length ? `<div class="scope">태그 ${U.tags.length}개 · ${U.tags_chars}자</div><div class="words">${U.tags.map(t => `<span class="word">${e(t)}</span>`).join("")}</div>` : ""}
        ${U.settings ? `<div class="tablebox"><table><tbody>${Object.entries(U.settings).map(([k, x]) => `<tr><th>${e(k)}</th><td>${e(x)}</td></tr>`).join("")}</tbody></table></div>` : ""}
        ${items.length ? `<div class="scope">자동 점검</div><ul class="list small">${items.map(x => `<li class="${x[1] ? "item-ok" : "item-bad"}">${x[1] ? "✓" : "✗"} ${e(x[0])} — ${e(x[2])}</li>`).join("")}</ul>` : ""}
        ${(U.problems || []).length ? `<ul class="list small">${U.problems.map(p => `<li class="item-bad">✗ ${e(p)}</li>`).join("")}</ul>` : ""}
        ${U.script_stale ? `<p class="small item-bad">대본 문장 ${U.script_stale}개가 지금 자막에 없음 — 음성·영상이 옛 대본</p>` : ""}</div>
        <section class="box"><header><h2>최종 확인</h2><span class="chip ${allMan && (autoOk || done) ? "ok" : "warn"}">${allMan ? "모두 봄" : UPLOAD_CHECKS.filter(c => checks[c]).length + "/" + UPLOAD_CHECKS.length}</span></header>
          <div class="checks">${UPLOAD_CHECKS.map(c => `<label><input type="checkbox" data-act="up-check" data-ep="${e(ep.id)}" data-c="${e(c)}" ${checks[c] ? "checked" : ""} ${wr()}>${e(c)}</label>`).join("")}</div>
          <div class="row">${gateHtml(ep, "upload", "업로드 준비 완료")}${allMan ? "" : `<span class="small">최종 확인을 모두 체크한 뒤 체크하세요</span>`}</div>
          <p class="small">체크 → Claude 에게 '제작 판 동기화해' → PC '유튜브_업로드.bat' 의 '올릴 대본'에 이 편이 나타남 (체크 안 한 편은 숨김) → [미리보기] → [업로드] (7일 뒤 17:00 KST 예약).</p></section>
        <section class="box"><header><h2>업로드 기록</h2><span class="small">${(ep.history || []).length}건</span></header>
          ${(ep.history || []).length ? `<div class="tablebox"><table><thead><tr><th>올린 때</th><th>공개 예약</th><th>영상</th><th>제목</th><th>상태</th></tr></thead><tbody>${ep.history.map(h => `<tr><td class="mono">${e(String(h.uploadedAt || "").slice(0, 16).replace("T", " "))}</td><td class="mono">${e(String(h.publishAt || "").slice(0, 16).replace("T", " "))}</td><td>${/^https:\/\//.test(h.url || "") ? `<a href="${e(h.url)}" target="_blank" rel="noopener">${e(h.videoId)}</a>` : e(h.videoId)}</td><td>${e(h.title)}</td><td>${h.current ? `<span class="chip ok">지금</span>` : `<span class="chip mute">옛 업로드 (${e(h.file)})</span>`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">아직 안 올림</p>`}
          ${done ? reuploadHtml(ep, d) : ""}</section>`;
    }
    const log = eps(S.topic).flatMap(x => (x.history || []).map(h => ({ ...h, ep: x.id }))).sort((a, b) => String(b.uploadedAt).localeCompare(String(a.uploadedAt)));
    return `<div class="cols"><div class="side"><section class="box"><header><h2>업로드</h2><span class="small">올릴 편 ${waiting.length} · 올린 편 ${done.length} (기록·다시 올리기)</span></header>${pk}</section>${body}
      <section class="box"><header><h2>${e((S.data[S.topic] || {}).name || "")} 업로드 기록 전체</h2><span class="small">${log.length}건</span></header>${log.length ? `<div class="tablebox"><table><thead><tr><th>올린 때</th><th>편</th><th>영상</th><th>공개 예약</th><th></th></tr></thead><tbody>${log.map(h => `<tr><td class="mono">${e(String(h.uploadedAt || "").slice(0, 10))}</td><td class="mono">${e(h.ep)}</td><td>${/^https:\/\//.test(h.url || "") ? `<a href="${e(h.url)}" target="_blank" rel="noopener">${e(h.videoId)}</a>` : e(h.videoId)}</td><td class="mono">${e(String(h.publishAt || "").slice(0, 16).replace("T", " "))}</td><td>${h.current ? "지금" : "옛"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">없음</p>`}</section></div>
      <div class="side">${rulesBox("upload")}<section class="box"><h2>올리기</h2>${cmd("PC — 업로드 화면 (더블 클릭)", "유튜브_업로드.bat")}<p class="small">미리보기·썸네일 받기는 업로드 미리보기 판에서도 볼 수 있습니다.</p><a href="https://claude.ai/artifact/PCe8WUwr4nSVGyHviy1Uar" target="_blank" rel="noopener">업로드 미리보기 판</a></section></div></div>`;
  }

  // ───────── 채널 분석
  function viewChannel() {
    const C = (S.common || {}).channels || {};
    const byVid = {}, vis = new Set(visTopics().map(t => t.key));
    for (const t of visTopics()) for (const ep of eps(t.key)) for (const h of ep.history || []) byVid[h.videoId] = ep;
    const chans = (C.channels || []).filter(ch => !(ch.topics || []).length || ch.topics.some(t => vis.has(t))).map(ch => {
      const rec = (ch.recent || []);
      const ours = rec.filter(r => byVid[r.id]).length;
      return `<section class="box"><header><h2>${e(ch.title)}</h2><span class="small">${e((ch.topics || []).map(tname).join(" · "))} · <span class="mono">${e(ch.id)}</span></span></header>
        <div class="tiles"><div class="tile"><span class="k">구독자</span><span class="v">${ch.hidden_subs ? "숨김" : fmtN(ch.subs)}</span></div><div class="tile"><span class="k">총 조회수</span><span class="v">${fmtN(ch.views)}</span></div>
        <div class="tile"><span class="k">영상</span><span class="v">${fmtN(ch.videos)}</span><span class="s">공개된 것</span></div><div class="tile"><span class="k">우리 판 편</span><span class="v">${ours}</span><span class="s">최근 목록 안</span></div></div>
        ${rec.length ? `<div class="tablebox"><table><thead><tr><th>올린 날</th><th>제목</th><th>조회수</th><th>하루 조회수</th><th>좋아요</th><th>댓글</th><th>길이</th><th>판 편</th></tr></thead><tbody>${rec.map(r => `<tr><td class="mono">${e(String(r.published || "").slice(0, 10))}</td><td><a href="https://www.youtube.com/watch?v=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">${e(r.title)}</a>${r.shorts ? ' <span class="chip info">쇼츠</span>' : ""}</td><td class="num">${fmtN(r.views)}</td><td class="num">${r.vpd == null ? "–" : r.vpd}</td><td class="num">${fmtN(r.likes)}</td><td class="num">${fmtN(r.comments)}</td><td class="num">${e(r.duration || "")}</td><td class="mono small">${byVid[r.id] ? e(byVid[r.id].id) : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">공개된 영상 없음 (예약·비공개 영상은 공개 자료로는 안 보임)</p>`}
        ${(ch.analytics || null) ? `<div class="scope">시청 분석 (OAuth)</div><pre class="cmd">${e(JSON.stringify(ch.analytics, null, 1))}</pre>` : ""}</section>`;
    }).join("");
    return `<div class="cols"><div class="side">${chans || `<section class="box"><p class="empty">${e(C.note || "채널 자료 없음")}</p></section>`}</div>
      <div class="side"><section class="box"><h2>채널 자료</h2><p class="small">받은 때 ${e(C.made || "아직")} · ${e(C.source || "")}</p>
        <p class="small">공개 지표(구독자·조회수·좋아요·댓글)는 YouTube Data API 로 Claude 세션에서 받습니다. 시청 지속·클릭률·유입 경로는 채널 주인 인증(OAuth)이 필요해 PC 에서 받습니다.</p>
        ${cmd("Claude 에게", "채널 분석 새로 받아")}${cmd("Claude 세션 (공개 지표)", "python3 tools/channel_stats.py --push")}${cmd("PC (시청 분석 — 채널 키가 든 주제 폴더 .env)", "python tools/youtube_feedback.py psychology --push")}</section></div></div>`;
  }

  // ───────── 그리기
  function renderNav() {
    $("nav").innerHTML = VIEWS.map((v, i) => {
      const n = v.stages ? eps(S.topic).filter(ep => v.stages.includes(at(ep))).length : null;
      return (i === 1 || i === 7 ? `<li class="sep" aria-hidden="true">|</li>` : "") + `<li><a href="#${v.key}" ${S.view === v.key ? 'aria-current="page"' : ""}>${v.n ? `<span class="n">${v.n}</span>` : ""}${e(v.label)}${n ? `<span class="c" title="이 단계에서 기다리는 편">${n}</span>` : ""}</a></li>`;
    }).join("");
    $("topics").innerHTML = visTopics().map(t => `<button class="pill" type="button" data-act="topic" data-key="${e(t.key)}" aria-pressed="${t.key === S.topic}">${e(t.name)}</button>`).join("");
  }
  let rq = null;
  function render() {
    fixTopic();
    renderNav();
    if (!S.common) { $("view").innerHTML = `<div class="loading">판 자료를 불러오는 중…</div>`; return; }
    const topicView = !["common", "channel"].includes(S.view);
    if (topicView && !tinfo(S.topic).built) { $("view").innerHTML = `<section class="box"><h2>${e(tname(S.topic))}</h2><p class="small">이 주제는 꺼져 있던 때 판을 만들어 자료가 없습니다. 판에서 다시 켰다면 Claude 에게 '제작 판 동기화해' — 다음 판에 자료가 들어옵니다.</p></section>`; return; }
    if (topicView && !S.data[S.topic]) { $("view").innerHTML = `<div class="loading">${e(tname(S.topic))} 자료를 불러오는 중…</div>`; loadTopic(S.topic).then(render); return; }
    const keepFocus = document.activeElement && document.activeElement.id;
    const vals = {};
    document.querySelectorAll("#view textarea[id], #view input[type=text][id], #view select[id]").forEach(x => { vals[x.id] = x.value; });
    const sc = window.scrollY;
    const fn = { common: viewCommon, topic: viewTopic, title: viewTitle, thumb: viewThumb, script: viewScript, video: viewVideo, upload: viewUpload, channel: viewChannel }[S.view] || viewCommon;
    try { $("view").innerHTML = fn(); } catch (err) { $("view").innerHTML = `<section class="box"><p class="item-bad">이 화면을 그리지 못했습니다: ${e(err && err.message)}</p></section>`; console.error(err); }
    for (const [id, v] of Object.entries(vals)) { const x = document.getElementById(id); if (x && !id.startsWith("ed") && x.value !== v && id !== "refq") x.value = v; }
    if (keepFocus) { const x = document.getElementById(keepFocus); if (x) { x.focus(); try { const L = x.value.length; x.setSelectionRange && x.type !== "select-one" && x.setSelectionRange(L, L); } catch (_) {} } }
    window.scrollTo(0, sc);
  }
  const later = () => { clearTimeout(rq); rq = setTimeout(render, 60); };

  // ───────── db 쓰기
  async function put(col, id, data, merge) {
    if (!S.db) { toast("저장소에 연결되지 않아 저장할 수 없습니다"); return false; }
    try {
      const ref = S.db.collection(col).doc(id);
      if (merge && S.col[col].has(id)) await ref.update(data); else await ref.set(Object.assign({}, merge ? S.col[col].get(id) || {} : {}, data));
      return true;
    } catch (err) { toast(err && err.code === "invalid_argument" ? "이 화면에서는 저장할 권한이 없습니다" : "저장하지 못했습니다. 다시 눌러 주세요"); return false; }
  }
  async function del(col, id) {
    try { await S.db.collection(col).doc(id).delete(); return true; } catch (_) { toast("지우지 못했습니다. 다시 눌러 주세요"); return false; }
  }
  const clean = o => { const x = Object.assign({}, o); delete x.id; return x; };
  const val = id => ((document.getElementById(id) || {}).value || "").trim();
  const redoTimers = {};

  document.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.tagName === "INPUT") return;
    const a = b.dataset.act, D = b.dataset;
    if (a === "topic") { S.topic = D.key; keep("topic", S.topic); S.edit = S.confirm = null; await loadTopic(S.topic); render(); return; }
    if (a === "copy") { try { await navigator.clipboard.writeText(D.text); toast("복사했습니다"); } catch (_) { const pre = b.closest(".cmdbox") && b.closest(".cmdbox").querySelector("pre"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("선택했습니다 — Ctrl+C 로 복사하세요"); } return; }
    if (a === "edit") { S.edit = D.k; S.confirm = null; render(); const x = document.querySelector(`#view [id^="ed"]`); if (x) x.focus(); return; }
    if (a === "ask") { S.confirm = D.k; S.edit = null; render(); return; }
    if (a === "cancel") { S.edit = S.confirm = null; render(); return; }
    if (a === "open") { S.open.has(D.k) ? S.open.delete(D.k) : S.open.add(D.k); render(); return; }
    if (a === "pick") { S.sel[D.view + ":" + S.topic] = D.id; S.edit = S.confirm = null; render(); return; }
    if (S.busy) return;
    S.busy = true;
    try {
      const t = nowIso();
      if (a === "gate-reset") { if (await del("gates", `${D.topic}__${D.ep}__${D.stage}`)) toast("저장소 기준으로 되돌렸습니다"); }
      else if (a === "rule-save") { const txt = val("ed-" + D.id); if (txt && await put("rules", D.id, { stage: D.stage, scope: D.scope, text: txt, deleted: false, at: t })) { S.edit = null; toast("규칙을 고쳤습니다 — Claude 반영 전"); } }
      else if (a === "rule-del") { const r = rulesOf(D.stage).flatMap(g => g.items).find(x => x.id === D.id) || {}; if (await put("rules", D.id, { stage: D.stage, scope: D.scope, text: r.text || "", deleted: true, at: t })) { S.confirm = null; toast("규칙을 뺐습니다"); } }
      else if (a === "rule-undel") { const r = rulesOf(D.stage).flatMap(g => g.items).find(x => x.id === D.id) || {}; if (await put("rules", D.id, { stage: D.stage, scope: D.scope, text: r.text || "", deleted: false, at: t })) toast("되살렸습니다"); }
      else if (a === "rule-add") { const txt = val("nr-text-" + D.stage), scope = val("nr-scope-" + D.stage) || "common"; if (!txt) toast("규칙을 적어 주세요"); else if (await put("rules", `${D.stage}.${scope}.u${Date.now().toString(36)}`, { stage: D.stage, scope, text: txt, deleted: false, at: t })) { document.getElementById("nr-text-" + D.stage).value = ""; toast("규칙을 더했습니다"); } }
      else if (a === "fb-add") { const txt = val(D.k); if (!txt) toast("피드백을 적어 주세요"); else { try { await S.db.collection("feedback").add({ topic: D.topic, ep: D.ep, stage: D.stage, line: D.line ? Number(D.line) : null, text: txt, status: "new", reply: "", createdAt: t, at: t }); document.getElementById(D.k).value = ""; toast("피드백을 남겼습니다"); } catch (_) { toast("저장하지 못했습니다"); } } }
      else if (a === "fb-save") { const txt = val("ed-" + D.id); if (txt && await put("feedback", D.id, { text: txt, status: "new", at: t }, true)) { S.edit = null; toast("고쳤습니다"); } }
      else if (a === "fb-del") { if (await del("feedback", D.id)) { S.confirm = null; toast("지웠습니다"); } }
      else if (a === "ref-save") { const id = D.id; if (await put("refs", id, { topic: S.topic, kind: D.kind, text: val("ed-" + id), sub: val("eds-" + id), note: val("edn-" + id), deleted: false, at: t })) { S.edit = null; toast("참고 자료를 고쳤습니다"); } }
      else if (a === "ref-del" || a === "ref-undel") { const r = refsOf(D.kind).find(x => x.id === D.id) || {}; if (await put("refs", D.id, { topic: S.topic, kind: D.kind, text: r.text || "", sub: r.sub || "", note: r.note || "", deleted: a === "ref-del", at: t })) { S.confirm = null; toast(a === "ref-del" ? "참고 자료에서 뺐습니다" : "되살렸습니다"); } }
      else if (a === "ref-add") { const txt = val("nref-" + D.kind); if (!txt) toast("문구를 적어 주세요"); else if (await put("refs", `${S.topic}.${D.kind}.u${Date.now().toString(36)}`, { topic: S.topic, kind: D.kind, text: txt, sub: val("nrefs-" + D.kind), note: val("nrefn-" + D.kind), deleted: false, at: t })) { ["nref-", "nrefs-", "nrefn-"].forEach(p => { const x = document.getElementById(p + D.kind); if (x) x.value = ""; }); toast("참고 자료를 더했습니다"); } }
      else if (a === "cand-add") { const title = val("nc-title"); if (!title) toast("후보 제목을 적어 주세요"); else { try { await S.db.collection("episodes").add({ topic: S.topic, title, memo: val("nc-memo"), createdAt: t, at: t }); ["nc-title", "nc-memo"].forEach(i => { document.getElementById(i).value = ""; }); toast("후보를 더했습니다 — 통과를 체크하면 제목 단계로"); } catch (_) { toast("저장하지 못했습니다"); } } }
      else if (a === "cand-del") { if (await del("episodes", D.id)) { S.confirm = null; toast("후보를 지웠습니다"); } }
      else if (a === "ch-add") { const raw = val("ch-in"), memo = val("ch-memo"); const items = raw.split(/[\s,]+/).filter(Boolean).slice(0, 30); for (const x of items) await S.db.collection("channels").add({ topic: S.topic, input: x, memo, createdAt: t, at: t, status: "new", reply: "" }); if (items.length) { document.getElementById("ch-in").value = ""; toast(`채널 ${items.length}개를 넣었습니다`); } }
      else if (a === "ch-del") { if (await del("channels", D.id)) { S.confirm = null; toast("지웠습니다"); } }
      else if (a === "trends-save") {
        const raw = val("tw-" + D.key), hours = Number(val("th-" + D.key)) || 24;
        const data = D.overall === "1" ? { cats: raw.split(/[\s,]+/).map(Number).filter(n => Number.isInteger(n) && n >= 0), every_hours: hours, at: t } : { words: raw.split(/\n+/).map(x => x.trim()).filter(Boolean).slice(0, 25), every_hours: hours, at: t };
        if (await put("trends", D.key, data)) toast("검색어를 저장했습니다 — Claude 동기화 뒤 PC 가 다음 회차에 받음");
      }
      else if (a === "sk-add") { const url = val("nsk-u"); if (!/^https:\/\//.test(url)) toast("https:// 로 시작하는 GitHub 주소를 넣어 주세요"); else { try { await S.db.collection("skills").add({ name: val("nsk-n"), url, memo: val("nsk-m"), createdAt: t, at: t }); ["nsk-n", "nsk-u", "nsk-m"].forEach(i => { document.getElementById(i).value = ""; }); toast("스킬을 등록했습니다"); } catch (_) { toast("저장하지 못했습니다"); } } }
      else if (a === "sk-save") { const url = val("sk-u-" + D.id); if (!/^https:\/\//.test(url)) toast("https:// 로 시작하는 주소를 넣어 주세요"); else if (await put("skills", D.id, { name: val("sk-n-" + D.id), url, memo: val("sk-m-" + D.id), at: t }, true)) { S.edit = null; toast("고쳤습니다"); } }
      else if (a === "sk-del") { if (await del("skills", D.id)) { S.confirm = null; toast("지웠습니다"); } }
      else if (a === "reup-on" || a === "reup-off") {                       // v1.2 재업로드 단추
        const ep = eps(S.topic).find(x => x.id === D.ep), d = upDoc(ep);
        if (await put("uploads", `${S.topic}__${D.ep}`, Object.assign(clean(d), { reupload: a === "reup-on", reupload_at: a === "reup-on" ? t : (d.reupload_at || ""), at: t })))
          toast(a === "reup-on" ? "재업로드를 요청했습니다 — Claude 동기화 뒤 PC '올릴 대본'에" : "재업로드 요청을 취소했습니다");
      }
      else if (a === "redo-clear") { const ep = eps(S.topic).find(x => x.id === D.ep); const d = ttsDoc(ep) || {}; if (await put("tts", `${S.topic}__${D.ep}`, Object.assign(clean(d), { topic: S.topic, ep: D.ep, redo: [], at: t }))) toast("재생성 체크를 풀었습니다"); }
    } finally { S.busy = false; render(); }
  });

  document.addEventListener("change", async ev => {
    const x = ev.target;
    if (x.id === "refq") return;
    if (x.tagName !== "INPUT" || x.type !== "checkbox" || !x.dataset.act) return;
    const D = x.dataset, t = nowIso();
    if (D.act === "topic-on") {
      const ok = await put("topics", D.key, { enabled: x.checked, at: t });
      if (ok) toast(x.checked ? `${tname(D.key)} 주제를 켰습니다` : `${tname(D.key)} 주제를 껐습니다 — 판에서 숨김 · 동기화 뒤 Claude·도구도 안 봄`);
      fixTopic(); render(); return;
    }
    if (D.act === "gate") {
      const ok = await put("gates", `${D.topic}__${D.ep}__${D.stage}`, { topic: D.topic, ep: D.ep, stage: D.stage, pass: x.checked, at: t });
      if (ok) toast(x.checked ? `${SK[D.stage]} 통과 — 다음 단계에 나타납니다` : `${SK[D.stage]} 통과를 풀었습니다 — 뒤 단계에서 빠집니다`);
      render(); return;
    }
    const ep = eps(S.topic).find(y => y.id === D.ep);
    if (D.act === "tts-make" || D.act === "tts-full") {
      const d = ttsDoc(ep) || {};
      const patch = D.act === "tts-make" ? { make: x.checked } : { full: x.checked, make: x.checked ? true : !!d.make };
      if (await put("tts", `${S.topic}__${D.ep}`, Object.assign({ topic: S.topic, ep: D.ep, make: false, full: false, redo: [] }, clean(d), patch, { at: t }))) toast(x.checked ? "음성 생성에 체크했습니다" : "체크를 풀었습니다");
      render(); return;
    }
    if (D.act === "redo") {                       // 줄 체크는 잠깐 모아서 한 번에 씀 (같은 문서에 연달아 쓰지 않게)
      const key = `${S.topic}__${D.ep}`;
      const d = ttsDoc(ep) || {};
      const cur = new Set(((redoTimers[key] && redoTimers[key].set) || d.redo || []).map(Number));
      x.checked ? cur.add(Number(D.n)) : cur.delete(Number(D.n));
      clearTimeout((redoTimers[key] || {}).tm);
      redoTimers[key] = { set: [...cur], tm: setTimeout(async () => { const s = redoTimers[key].set; delete redoTimers[key]; if (await put("tts", key, Object.assign({ topic: S.topic, ep: D.ep, make: false, full: false }, clean(ttsDoc(ep) || {}), { redo: s.sort((a, b) => a - b), at: nowIso() }))) toast(`재생성 ${s.length}줄`); render(); }, 700) };
      x.closest(".ln") && x.closest(".ln").classList.toggle("redo", x.checked);
      return;
    }
    if (D.act === "up-check") { const d = upDoc(ep); const checks = Object.assign({}, d.checks || {}, { [D.c]: x.checked }); await put("uploads", `${S.topic}__${D.ep}`, Object.assign(clean(d), { checks, at: t })); render(); return; }

  });
  document.addEventListener("input", ev => { if (ev.target.id === "refq") { S.refq = ev.target.value; clearTimeout(rq); rq = setTimeout(render, 250); } });
  document.addEventListener("toggle", ev => { const d = ev.target; if (d.tagName === "DETAILS" && d.dataset && d.dataset.k) { d.open ? S.open.add(d.dataset.k) : S.open.delete(d.dataset.k); } }, true);

  // ───────── 길 · 자료 · db
  function route() { const h = (location.hash || "").slice(1); S.view = VIEWS.some(v => v.key === h) ? h : (store("view") || "common"); keep("view", S.view); S.edit = S.confirm = null; render(); }
  window.addEventListener("hashchange", route);
  async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " HTTP " + r.status); return r.json(); }
  const loading = {};
  async function loadTopic(t) { if (S.data[t] || !tinfo(t).built) return; if (loading[t]) return loading[t]; return (loading[t] = (async () => { try { S.data[t] = await getJSON(`data/${t}.json`); } catch (err) { S.data[t] = { name: t, episodes: [], refs: {}, explore: [], legacy: {}, error: String(err) }; toast(`${t} 자료를 못 불러옴`); } })()); }
  (async () => {
    try { S.common = await getJSON("data/common.json"); } catch (err) { S.common = { rules: {}, channels: {}, trends_defaults: {}, state: {} }; toast("공통 자료를 못 불러옴"); }
    fixTopic();
    await loadTopic(S.topic);                                // v1.1 고른 주제만 먼저 (다른 주제는 누를 때)
    route();
  })();
  (async () => {
    const use = window.claude && window.claude.use ? n => window.claude.use(n) : () => Promise.resolve(null);
    const timer = setTimeout(() => { if (!S.connected) { $("status").className = "status bad"; $("status-t").textContent = "저장소가 응답하지 않습니다 — 자료는 볼 수 있지만 체크·피드백은 저장되지 않습니다."; } }, 10000);
    let db = null, user = null;
    try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (_) { db = null; }
    if (!db) { clearTimeout(timer); $("status").className = "status bad"; $("status-t").textContent = "저장소에 연결하지 못했습니다 — 자료는 볼 수 있지만 체크·피드백은 저장되지 않습니다."; render(); return; }
    S.db = db;
    try { if (user && user.can && (await user.can("data.write")) === false) S.canWrite = false; } catch (_) { /* 모름 — 쓰기에서 판단 */ }
    let first = 0;
    for (const c of COLS) {
      db.collection(c).onSnapshot(snap => {
        const m = new Map(); snap.docs.forEach(d => m.set(d.id, Object.assign({ id: d.id }, d.data())));
        S.col[c] = m;
        if (!snap.metadata.fromCache && ++first >= 1) { clearTimeout(timer); S.connected = true; $("status").className = "status " + (S.canWrite ? "ok" : "warn"); $("status-t").textContent = S.canWrite ? `저장소 연결됨 — 체크·피드백은 바로 저장되고 Claude 가 동기화 때 읽습니다 · 판 ${B.made}` : "보기 전용 — 이 화면에서는 저장할 수 없습니다"; }
        later();
      }, () => { clearTimeout(timer); $("status").className = "status bad"; $("status-t").textContent = `${c} 목록을 읽지 못했습니다`; });
    }
  })();
})();
</script>
