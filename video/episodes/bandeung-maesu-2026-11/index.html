 6년이었습니다.","start":161.134,"end":165.97},{"n":38,"part":"그래도 돌아왔다, 다만","text":"더 나쁜 경우도 보겠습니다.","start":166.35,"end":167.853},{"n":39,"part":"그래도 돌아왔다, 다만","text":"하락이 시작되기 직전, 최고가에 매수한 사람입니다.","start":168.233,"end":171.462},{"n":40,"part":"그래도 돌아왔다, 다만","text":"2000년 이후 미국 증시가 최고가에서 15% 넘게 빠진 하락은 여섯 번입니다.","start":171.842,"end":176.99},{"n":41,"part":"그래도 돌아왔다, 다만","text":"가장 깊었던 금융위기 때는 55.2%가 빠졌습니다.","start":177.37,"end":181.239},{"n":42,"part":"그래도 돌아왔다, 다만","text":"여섯 번 모두 최고가를 되찾았습니다.","start":181.619,"end":183.759},{"n":43,"part":"그래도 돌아왔다, 다만","text":"세 번은 1년 안에 되찾았고, 가장 오래 걸린 닷컴 버블은 6.6년이었습니다.","start":184.139,"end":189.17},{"n":44,"part":"그래도 돌아왔다, 다만","text":"그런데 닷컴 버블 꼭대기에 매수한 사람은, 본전을 찾자마자 금융위기를 만났습니다.","start":189.55,"end":194.63},{"n":45,"part":"그래도 돌아왔다, 다만","text":"다시 본전 아래로 내려갔고, 완전히 벗어난 건 매수한 지 11.7년 뒤였습니다.","start":195.01,"end":200.052},{"n":46,"part":"그래도 돌아왔다, 다만","text":"미국 지수는 그 뒤 최고가를 다시 썼으니, 어느 하락에서 매수했든 지금은 본전 위입니다.","start":200.432,"end":205.982},{"n":47,"part":"그래도 돌아왔다, 다만","text":"그래서 볼 것은 되찾았느냐가 아니라, 얼마나 걸렸느냐입니다.","start":206.362,"end":209.942},{"n":48,"part":"그래도 돌아왔다, 다만","text":"그럼 코스피는 어땠을까요?","start":210.322,"end":211.836},{"n":49,"part":"그래도 돌아왔다, 다만","text":"코스피는 30% 넘게 빠진 지난 네 번을 모두 되찾았지만, 길게는 5.5년이 걸렸습니다.","start":212.216,"end":218.306},{"n":50,"part":"그래도 돌아왔다, 다만","text":"30%까지는 빠지지 않았던 2011년 최고가도, 되찾는 데 6년이 걸렸습니다.","start":218.686,"end":224.036},{"n":51,"part":"그래도 돌아왔다, 다만","text":"그리고 이것은 지수의 기록이지, 종목의 기록이 아닙니다.","start":224.416,"end":227.779},{"n":52,"part":"그래도 돌아왔다, 다만","text":"2000년 무렵 미국에서 시가총액이 가장 컸던 회사들 가운데 여덟 곳을 봤습니다.","start":228.159,"end":232.909},{"n":53,"part":"그래도 돌아왔다, 다만","text":"그중 여섯 곳은 그때 최고가를 되찾는 데 10년이 넘게 걸렸습니다.","start":233.289,"end":237.399},{"n":54,"part":"그래도 돌아왔다, 다만","text":"시스코는 21년이 걸렸습니다.","start":237.779,"end":239.769},{"n":55,"part":"그래도 돌아왔다, 다만","text":"되찾지 못한 곳도 있습니다.","start":240.149,"end":241.583},{"n":56,"part":"그래도 돌아왔다, 다만","text":"2007년 최고가에 매수한 씨티그룹은 지금도 67% 아래에 있습니다.","start":241.963,"end":246.462},{"n":57,"part":"그래도 돌아왔다, 다만","text":"종목에 물린 분께 기록이 어디까지 말해 주는지는, 조금 뒤에 따로 보겠습니다.","start":246.842,"end":251.59},{"n":58,"part":"그래도 돌아왔다, 다만","text":"그럼 반대로, 매도하고 기다리면 안전할까요?","start":251.97,"end":254.803},{"n":59,"part":"매도하고 기다려도 공짜가 아니었다","text":"여섯 번의 바닥 뒤 한 달 동안, 주가는 가운데 값으로 15.0% 올랐습니다.","start":255.803,"end":261.071},{"n":60,"part":"매도하고 기다려도 공짜가 아니었다","text":"가장 덜 오른 2022년에도 10.7%가 올랐습니다.","start":261.451,"end":265.235},{"n":61,"part":"매도하고 기다려도 공짜가 아니었다","text":"물론 바닥은 지나고 나서야 알 수 있습니다.","start":265.615,"end":268.045},{"n":62,"part":"매도하고 기다려도 공짜가 아니었다","text":"문제는 진짜 반등의 첫날이 가짜와 똑같이 생겼다는 겁니다.","start":268.425,"end":271.995},{"n":63,"part":"매도하고 기다려도 공짜가 아니었다","text":"2020년 코로나 폭락 때, 바닥 전까지 급반등이 다섯 번 있었습니다.","start":272.375,"end":276.864},{"n":64,"part":"매도하고 기다려도 공짜가 아니었다","text":"다섯 번 모두 가짜였습니다.","start":277.244,"end":278.961},{"n":65,"part":"매도하고 기다려도 공짜가 아니었다","text":"그리고 3월 24일, 여섯 번째로 하루 9.1%가 올랐습니다.","start":279.341,"end":283.706},{"n":66,"part":"매도하고 기다려도 공짜가 아니었다","text":"여러분이라면 여섯 번째를 믿으셨겠습니까?","start":284.086,"end":286.545},{"n":67,"part":"매도하고 기다려도 공짜가 아니었다","text":"바로 그 전날이 코로나 폭락의 진짜 바닥이었습니다.","start":286.925,"end":289.909},{"n":68,"part":"매도하고 기다려도 공짜가 아니었다","text":"매도하고 기다리는 쪽도, 틀리면 값을 치렀던 겁니다.","start":290.289,"end":293.799},{"n":69,"part":"그래서 전부 걸지 않는다","text":"모두 버티면, 가짜 반등일 때 더 크게 잃습니다.","start":294.799,"end":297.919},{"n":70,"part":"그래서 전부 걸지 않는다","text":"모두 매도하고 기다리면, 진짜 반등일 때 놓칩니다.","start":298.299,"end":301.637},{"n":71,"part":"그래서 전부 걸지 않는다","text":"남는 답은 뻔합니다.","start":302.017,"end":303.216},{"n":72,"part":"그래서 전부 걸지 않는다","text":"어느 쪽에도 전부 걸지 않는 것입니다.","start":303.596,"end":305.507},{"n":73,"part":"그래서 전부 걸지 않는다","text":"다만 그 뻔한 답이 실제로 얼마를 지키고 얼마를 내줬는지는 숫자로 보겠습니다.","start":305.887,"end":310.605},{"n":74,"part":"이미 많이 물렸다면","text":"이미 물린 분은 이 반등에 매도할까 버틸까, 그 하나죠.","start":311.605,"end":315.225},{"n":75,"part":"이미 많이 물렸다면","text":"그래서 깊이 물린 상태에서 나온 급반등만 따로 골랐습니다.","start":315.605,"end":319.249},{"n":76,"part":"이미 많이 물렸다면","text":"미국 증시가 최고가보다 30% 넘게 빠져 있을 때 나온 급반등 32번입니다.","start":319.629,"end":324.482},{"n":77,"part":"이미 많이 물렸다면","text":"닷컴 버블, 금융위기, 코로나, 세 번의 하락에서 나온 날들이라 크게 말할 수는 없습니다.","start":324.862,"end":330.532},{"n":78,"part":"이미 많이 물렸다면","text":"그때 최고가에 매수한 사람은 가운데 값으로 42.3% 손실 중이었습니다.","start":330.912,"end":336.192},{"n":79,"part":"이미 많이 물렸다면","text":"2026년 11월 10일 코스피는 최고가보다 42.5% 아래입니다.","start":336.572,"end":341.762},{"n":80,"part":"이미 많이 물렸다면","text":"낙폭으로는 거의 같은 자리입니다.","start":342.142,"end":344.131},{"n":81,"part":"이미 많이 물렸다면","text":"다만 미국 지수로 한 실험이라, 종목이라면 숫자는 달라집니다.","start":344.511,"end":348.395},{"n":82,"part":"이미 많이 물렸다면","text":"먼저 그대로 버틴 경우입니다.","start":348.775,"end":350.676},{"n":83,"part":"이미 많이 물렸다면","text":"그 뒤 1년 사이 가장 깊을 때, 계좌는 가운데 값으로 그날보다 19.6% 더 줄었습니다.","start":351.056,"end":356.906},{"n":84,"part":"이미 많이 물렸다면","text":"본전까지는 가운데 값으로 3.7년이 걸렸습니다.","start":357.286,"end":360.284},{"n":85,"part":"이미 많이 물렸다면","text":"다음은 급반등 다음 날 절반만 매도한 경우입니다.","start":360.664,"end":363.724},{"n":86,"part":"이미 많이 물렸다면","text":"매도한 값보다 10% 내려가면, 그 돈으로 다시 매수했습니다.","start":364.104,"end":368.263},{"n":87,"part":"이미 많이 물렸다면","text":"반대로 10% 올라가면, 틀린 것으로 치고 그때 다시 매수했습니다.","start":368.643,"end":373.083},{"n":88,"part":"이미 많이 물렸다면","text":"100주였다면, 싸게 다시 매수하면 105주쯤, 비싸게 다시 매수하면 95주쯤이 됩니다.","start":373.463,"end":379.083},{"n":89,"part":"이미 많이 물렸다면","text":"여기까지는 계산입니다.","start":379.463,"end":380.823},{"n":90,"part":"이미 많이 물렸다면","text":"기록이 알려 주는 건 어느 쪽이 먼저 왔느냐입니다.","start":381.203,"end":383.968},{"n":91,"part":"이미 많이 물렸다면","text":"32번 가운데 18번은 먼저 내려갔고, 14번은 먼저 올랐습니다.","start":384.348,"end":388.676},{"n":92,"part":"이미 많이 물렸다면","text":"거의 반반이었습니다.","start":389.056,"end":390.436},{"n":93,"part":"이미 많이 물렸다면","text":"금융위기에서는 먼저 내려간 날이, 닷컴 버블과 코로나에서는 먼저 오른 날이 많았습니다.","start":390.816,"end":396.523},{"n":94,"part":"이미 많이 물렸다면","text":"매도하자마자 오른 14번이, 두려워하던 바로 그 경우입니다.","start":396.903,"end":400.793},{"n":95,"part":"이미 많이 물렸다면","text":"이때 본전은 버틴 것보다 길어야 다섯 달 늦어졌습니다.","start":401.173,"end":404.522},{"n":96,"part":"이미 많이 물렸다면","text":"10%를 5%나 15%로 바꿔도, 늦어진 건 여섯 달 안이었습니다.","start":404.902,"end":409.982},{"n":97,"part":"이미 많이 물렸다면","text":"코스피로 같은 실험을 하면, 70번 중 39번으로 먼저 오른 쪽이 더 많았습니다.","start":410.362,"end":415.648},{"n":98,"part":"이미 많이 물렸다면","text":"그때도 늦어진 건 길어야 넉 달이었습니다.","start":416.028,"end":418.377},{"n":99,"part":"이미 많이 물렸다면","text":"팔든 버티든, 차이는 주식 수 5% 안팎이었던 겁니다.","start":418.757,"end":422.582},{"n":100,"part":"이미 많이 물렸다면","text":"매도할까 버틸까로 잠을 설칠 만큼의 차이는 아니었습니다.","start":422.962,"end":426.252},{"n":101,"part":"이미 많이 물렸다면","text":"절반 매도는 더 버는 기술이 아닙니다.","start":426.632,"end":428.665},{"n":102,"part":"이미 많이 물렸다면","text":"최악이어도 주식 수 5%라는 것을 미리 알고 정하는 방법입니다.","start":429.045,"end":432.684},{"n":103,"part":"이미 많이 물렸다면","text":"그러니 정말 따져 볼 것은 따로 있습니다.","start":433.064,"end":435.132},{"n":104,"part":"이미 많이 물렸다면","text":"이 돈을 몇 년 동안 꺼내지 않아도 됩니까?","start":435.512,"end":437.778},{"n":105,"part":"이미 많이 물렸다면","text":"물린 것이 지수입니까, 종목입니까?","start":438.158,"end":440.472},{"n":106,"part":"이미 많이 물렸다면","text":"몇 년을 기다릴 수 있는 돈이고 지수라면, 기록에서는 버틴 쪽도 본전을 찾았습니다.","start":440.852,"end":445.737},{"n":107,"part":"이미 많이 물렸다면","text":"곧 써야 할 돈이거나 종목이라면, 버티면 돌아온다고 말할 기록이 없습니다.","start":446.117,"end":450.769},{"n":108,"part":"이미 많이 물렸다면","text":"그렇다고 전부 매도하라는 기록도 없습니다.","start":451.149,"end":453.459},{"n":109,"part":"이미 많이 물렸다면","text":"오래 걸려 돌아온 종목도, 아직 못 돌아온 종목도 있었으니까요.","start":453.839,"end":457.699},{"n":110,"part":"이미 많이 물렸다면","text":"절반과 10%라는 실험 값도 지수에서 해 본 것이라, 종목에서 통했다는 기록은 없습니다.","start":458.079,"end":463.597},{"n":111,"part":"이미 많이 물렸다면","text":"그래서 종목에 물린 분은, 틀려도 견딜 수 있게 미리 정해 두는 수밖에 없습니다.","start":463.977,"end":468.776},{"n":112,"part":"이미 많이 물렸다면","text":"얼마를 매도할지, 얼마 내리면 다시 매수할지, 얼마 오르면 다시 매수할지.","start":469.156,"end":474.063},{"n":113,"part":"이미 많이 물렸다면","text":"그리고 종목이라면 하나 더, 다시 매수할 것이 그 종목인지입니다.","start":474.443,"end":478.721},{"n":114,"part":"이미 많이 물렸다면","text":"기록이 말해 줄 수 있는 것은 여기까지입니다.","start":479.101,"end":481.569},{"n":115,"part":"남겨 둔 현금이나 월급이라면","text":"남겨 둔 현금이 있거나 다음 달 월급이 들어오면, 같은 고민이 따라옵니다.","start":482.569,"end":486.952},{"n":116,"part":"남겨 둔 현금이나 월급이라면","text":"이 반등에 더 매수할까, 기다릴까.","start":487.332,"end":489.792},{"n":117,"part":"남겨 둔 현금이나 월급이라면","text":"반등 스무 번에 전부 매수했다면, 8번은 1년 안에 계좌가 20% 넘게 줄었습니다.","start":490.172,"end":495.669},{"n":118,"part":"남겨 둔 현금이나 월급이라면","text":"5%만 먼저 매수하고, 10% 내려갈 때마다 5%씩 더 매수하면 한 번으로 줄었습니다.","start":496.049,"end":502.057},{"n":119,"part":"남겨 둔 현금이나 월급이라면","text":"주식을 조금만 들고 있었으니 당연한 결과이기도 합니다.","start":502.437,"end":505.682},{"n":120,"part":"남겨 둔 현금이나 월급이라면","text":"그 대가로 1년 수익률의 가운데 값은 13.7%에서 5.2%로 내려갔습니다.","start":506.062,"end":511.69},{"n":121,"part":"남겨 둔 현금이나 월급이라면","text":"2008년 3월 반등에서는 이 방법으로도 계좌가 24.9% 줄었습니다.","start":512.07,"end":516.699},{"n":122,"part":"남겨 둔 현금이나 월급이라면","text":"덜 잃는 대신 덜 버는 거래입니다.","start":517.079,"end":519.249},{"n":123,"part":"정리","text":"지금 반등이 진짜인지 가짜인지는 지나고 나서야 알 수 있습니다.","start":520.249,"end":523.893},{"n":124,"part":"정리","text":"그래서 기록에서 숫자 셋만 남기겠습니다.","start":524.273,"end":526.743},{"n":125,"part":"정리","text":"하나, 급반등 세 번 중 두 번은 가짜였고, 붙은 날을 묶으면 네 번 중 세 번이었습니다.","start":527.123,"end":532.972},{"n":126,"part":"정리","text":"둘, 미국 지수는 그래도 최고가를 되찾았지만, 길게는 10년이 넘게 걸렸습니다.","start":533.352,"end":538.522},{"n":127,"part":"정리","text":"셋, 깊이 물린 채 반등에 절반을 매도하든 버티든, 차이는 주식 수 5% 안팎이었습니다.","start":538.902,"end":544.912},{"n":128,"part":"정리","text":"수수료와 세금은 계산에 넣지 않은 과거의 기록이고, 앞으로도 같다는 보장은 없습니다.","start":545.292,"end":550.532},{"n":129,"part":"정리","text":"시청해주셔서 감사합니다.","start":550.912,"end":552.442}],"subs":[[0.2,4.024,"폭락 뒤에 주가가 반등했는데, 반갑기보다 불안합니다."],[4.024,6.364,"또 떨어지려는 건 아닐까 싶어서죠."],[6.364,8.268,"그 불안은 틀리지 않았습니다."],[8.268,14.483,"미국 증시가 1년 최고가보다 10% 넘게 빠진 뒤,\n하루 3% 넘게 오른 날을 셌습니다."],[14.483,20.193,"2000년부터 83번이었고,\n그중 56번은 반년 안에 저점을 다시 깼습니다."],[20.193,25.252,"코스피도 같은 기준으로 세면, 137번 중 98번이 그랬습니다."],[25.252,31.462,"그럼 닷컴 버블, 금융위기,\n코로나 때처럼 30% 넘게 물린 채 급반등을 맞았다면요."],[31.462,34.183,"팔았어야 할까요, 버텼어야 할까요?"],[34.183,39.373,"미국에서 그대로 버텼다면,\n본전까지 가운데 값으로 3.7년이 걸렸습니다."],[39.373,44.633,"절반을 매도한 뒤,\n10% 더 떨어지기 전에 10% 올라 버린 경우도 있습니다."],[44.633,49.695,"미국은 32번 중 14번, 코스피는 70번 중 39번이었습니다."],[49.695,56.105,"팔았다면 얼마를 잃었는지,\n그리고 팔지 버틸지를 가르는 기준까지 보여 드리겠습니다."],[56.105,61.165,"83번 중 56번, 세 번 중 두 번이라는 숫자부터 따져 보겠습니다."],[61.165,67.208,"기록은 닷컴 버블 꼭대기인 2000년부터 2026년 10월까지의\n미국 S&P 500입니다."],[67.208,71.784,"저점은 반등 직전 20거래일 가운데 가장 낮았던 종가로 잡았습니다."],[71.784,77.005,"깨진 56번 가운데 절반은 17거래일, 한 달이 채 안 돼서 깨졌습니다."],[77.005,81.622,"기준을 여섯 가지로 바꿔도, 가짜는 열 번 중 여섯 번 안팎이었습니다."],[81.622,84.348,"그럼 아주 크게 오른 날은 믿어도 될까요?"],[84.348,89.513,"2000년 이후 미국 증시가 하루에\n가장 크게 오른 날은 2008년 10월 13일입니다."],[89.513,93.903,"이날 S&P 500 지수는 하루에 11.6% 올랐습니다."],[93.903,97.389,"이만큼 오르면, 이제 바닥이라고 믿고 싶어집니다."],[97.389,101.454,"하지만 지수는 그날보다 32.6% 더 떨어졌습니다."],[101.454,105.999,"가장 크게 오른 날 20번 가운데 19번이 이렇게 하락 중에 나왔습니다."],[105.999,109.107,"그럼 전문가들이 말하는 차트 신호는 어땠을까요?"],[109.107,112.161,"차트를 볼 때 흔히 쓰는 신호 하나를 골랐습니다."],[112.161,117.541,"거래가 평소보다 늘면서\n주가가 20일 평균 위로 올라서면 진짜라는 신호입니다."],[117.541,121.831,"앞의 83번에는 며칠 사이로 붙어 나온 날이 여러 번 들어 있습니다."],[121.831,127.468,"석 달 안에 붙은 날을 하나로 묶으면 반등은 스무 번이고,\n그중 15번이 가짜였습니다."],[127.468,132.271,"묶어서 세면 네 번 중 세 번이니, 세 번 중 두 번은 낮춰 잡은 숫자입니다."],[132.271,135.711,"이 스무 번에 신호를 대 보니 13번을 맞혔습니다."],[135.711,140.035,"그런데 아무것도 보지 않고 전부 가짜라고 했다면 15번을 맞혔습니다."],[140.035,145.493,"스무 번뿐이라 크게 말할 수는 없지만,\n신호를 본다고 더 잘 맞히지는 못했습니다."],[145.493,148.716,"그러니 반등에 속은 건 여러분의 실력 문제가 아닙니다."],[148.716,151.406,"기록에서는 속는 쪽이 보통이었습니다."],[151.406,155.488,"그럼 속아서 매수한 사람들은 그 뒤 어떻게 됐을까요?"],[155.488,161.134,"가짜였던 15번의 반등 다음 날 매수했더라도,\n15번 모두 매수가를 되찾았습니다."],[161.134,166.35,"9번은 1년이 걸리지 않았고, 가장 오래 걸린 경우는 약 6년이었습니다."],[166.35,168.233,"더 나쁜 경우도 보겠습니다."],[168.233,171.842,"하락이 시작되기 직전, 최고가에 매수한 사람입니다."],[171.842,177.37,"2000년 이후 미국 증시가 최고가에서\n15% 넘게 빠진 하락은 여섯 번입니다."],[177.37,181.619,"가장 깊었던 금융위기 때는 55.2%가 빠졌습니다."],[181.619,184.139,"여섯 번 모두 최고가를 되찾았습니다."],[184.139,189.55,"세 번은 1년 안에 되찾았고,\n가장 오래 걸린 닷컴 버블은 6.6년이었습니다."],[189.55,195.01,"그런데 닷컴 버블 꼭대기에 매수한 사람은,\n본전을 찾자마자 금융위기를 만났습니다."],[195.01,200.432,"다시 본전 아래로 내려갔고,\n완전히 벗어난 건 매수한 지 11.7년 뒤였습니다."],[200.432,206.362,"미국 지수는 그 뒤 최고가를 다시 썼으니,\n어느 하락에서 매수했든 지금은 본전 위입니다."],[206.362,210.322,"그래서 볼 것은 되찾았느냐가 아니라, 얼마나 걸렸느냐입니다."],[210.322,212.216,"그럼 코스피는 어땠을까요?"],[212.216,218.686,"코스피는 30% 넘게 빠진 지난 네 번을 모두 되찾았지만,\n길게는 5.5년이 걸렸습니다."],[218.686,224.416,"30%까지는 빠지지 않았던 2011년 최고가도,\n되찾는 데 6년이 걸렸습니다."],[224.416,228.159,"그리고 이것은 지수의 기록이지, 종목의 기록이 아닙니다."],[228.159,233.289,"2000년 무렵 미국에서\n시가총액이 가장 컸던 회사들 가운데 여덟 곳을 봤습니다."],[233.289,237.779,"그중 여섯 곳은 그때 최고가를 되찾는 데 10년이 넘게 걸렸습니다."],[237.779,240.149,"시스코는 21년이 걸렸습니다."],[240.149,241.963,"되찾지 못한 곳도 있습니다."],[241.963,246.842,"2007년 최고가에 매수한 씨티그룹은 지금도 67% 아래에 있습니다."],[246.842,251.97,"종목에 물린 분께 기록이 어디까지 말해 주는지는,\n조금 뒤에 따로 보겠습니다."],[251.97,255.803,"그럼 반대로, 매도하고 기다리면 안전할까요?"],[255.803,261.451,"여섯 번의 바닥 뒤 한 달 동안,\n주가는 가운데 값으로 15.0% 올랐습니다."],[261.451,265.615,"가장 덜 오른 2022년에도 10.7%가 올랐습니다."],[265.615,268.425,"물론 바닥은 지나고 나서야 알 수 있습니다."],[268.425,272.375,"문제는 진짜 반등의 첫날이 가짜와 똑같이 생겼다는 겁니다."],[272.375,277.244,"2020년 코로나 폭락 때, 바닥 전까지 급반등이 다섯 번 있었습니다."],[277.244,279.341,"다섯 번 모두 가짜였습니다."],[279.341,284.086,"그리고 3월 24일, 여섯 번째로 하루 9.1%가 올랐습니다."],[284.086,286.925,"여러분이라면 여섯 번째를 믿으셨겠습니까?"],[286.925,290.289,"바로 그 전날이 코로나 폭락의 진짜 바닥이었습니다."],[290.289,294.799,"매도하고 기다리는 쪽도, 틀리면 값을 치렀던 겁니다."],[294.799,298.299,"모두 버티면, 가짜 반등일 때 더 크게 잃습니다."],[298.299,302.017,"모두 매도하고 기다리면, 진짜 반등일 때 놓칩니다."],[302.017,303.596,"남는 답은 뻔합니다."],[303.596,305.887,"어느 쪽에도 전부 걸지 않는 것입니다."],[305.887,311.605,"다만 그 뻔한 답이 실제로 얼마를 지키고\n얼마를 내줬는지는 숫자로 보겠습니다."],[311.605,315.605,"이미 물린 분은 이 반등에 매도할까 버틸까, 그 하나죠."],[315.605,319.629,"그래서 깊이 물린 상태에서 나온 급반등만 따로 골랐습니다."],[319.629,324.862,"미국 증시가 최고가보다 30% 넘게\n빠져 있을 때 나온 급반등 32번입니다."],[324.862,330.912,"닷컴 버블, 금융위기, 코로나,\n세 번의 하락에서 나온 날들이라 크게 말할 수는 없습니다."],[330.912,336.572,"그때 최고가에 매수한 사람은\n가운데 값으로 42.3% 손실 중이었습니다."],[336.572,342.142,"2026년 11월 10일 코스피는 최고가보다 42.5% 아래입니다."],[342.142,344.511,"낙폭으로는 거의 같은 자리입니다."],[344.511,348.775,"다만 미국 지수로 한 실험이라, 종목이라면 숫자는 달라집니다."],[348.775,351.056,"먼저 그대로 버틴 경우입니다."],[
