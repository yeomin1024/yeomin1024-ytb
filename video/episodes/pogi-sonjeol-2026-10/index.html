<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"pogi-sonjeol-2026-10","topic":"stock","duration":415.32,"audio":null,"thumb":null,"estimated":true,"est_model":{"perSyl":0.151,"comma":0.25,"base":-0.08,"min":0.8,"lead":0.3,"gap":0.45,"part":1,"tail":0.8},"synced":"2026-10-23T08:19:33Z","sent":[{"n":1,"part":"도입","text":"올해 반도체 주식 종목에 투자했다가, 전재산의 70%인 2억 5천만 원을 손해 봤어요.","start":0.3,"end":6.057},{"n":2,"part":"도입","text":"빚까지 냈다가, 7월 폭락에 빌린 돈부터 강제로 빠져나갔죠.","start":6.507,"end":10.301},{"n":3,"part":"도입","text":"이제 마흔넷인데, 회사는 언제까지 다닐지 모르고, 딸 학원비는 매달 나가요.","start":10.751,"end":15.701},{"n":4,"part":"도입","text":"노후 자금은 1억 원 남았는데, 아내에게는 아직 말도 못 했어요.","start":16.151,"end":20.096},{"n":5,"part":"도입","text":"주식에서 손을 떼야겠다 싶었죠.","start":20.546,"end":22.429},{"n":6,"part":"도입","text":"하지만 매도만 안하면 손실이 아니듯이","start":22.879,"end":25.215},{"n":7,"part":"도입","text":"주식시장을 떠나지 않으면 아직 손해가 아니라고 생각했어요.","start":25.665,"end":29.36},{"n":8,"part":"도입","text":"그래서 원금 복구를 위해 제대로 공부하기로 마음먹고 지켜야할 5가지를 알아보았어요.","start":29.81,"end":35.166},{"n":9,"part":"방법1","text":"첫 번째는, 국장 대신 미장으로 옮기는 거예요.","start":36.166,"end":39.054},{"n":10,"part":"방법1","text":"국장은 한국 주식, 미장은 미국 주식을 말해요.","start":39.504,"end":42.392},{"n":11,"part":"방법1","text":"많은 개미가 익숙한 국장에서만 투자하죠.","start":42.842,"end":45.329},{"n":12,"part":"방법1","text":"그런데 지금 코스피는, 삼성전자와 SK하이닉스 두 회사가 시가총액의 절반을 넘어요.","start":45.779,"end":51.536},{"n":13,"part":"방법1","text":"코스피를 산다는 건, 사실상 반도체 한 업종에 몰빵하는 거예요.","start":51.986,"end":55.931},{"n":14,"part":"방법1","text":"저는 거기서도, 반도체에만 돈을 넣었고요.","start":56.381,"end":59.118},{"n":15,"part":"방법1","text":"그러니 반도체가 흔들리면, 시장 전체가 같이 흔들려요.","start":59.568,"end":63.06},{"n":16,"part":"방법1","text":"7월 13일에는 코스피가 하루에 8.95% 떨어져서, 거래가 20분 동안 멈추기도 했어요.","start":63.51,"end":69.72},{"n":17,"part":"방법1","text":"그리고 7월 한 달 동안, 34% 넘게 떨어졌죠.","start":70.17,"end":73.511},{"n":18,"part":"방법1","text":"저처럼 반도체만 들고 있던 사람은, 그 충격을 그대로 맞았어요.","start":73.961,"end":77.906},{"n":19,"part":"방법1","text":"길게 봐도 비슷했어요.","start":78.356,"end":79.635},{"n":20,"part":"방법1","text":"코스피는 2007년에 처음 2,000을 넘었지만, 2,000을 되찾는 데 3년이 넘게 걸렸어요.","start":80.085,"end":85.889},{"n":21,"part":"방법1","text":"그 뒤로도 2016년까지 6년 넘게, 1,900에서 2,000대에 머물렀죠.","start":86.339,"end":91.237},{"n":22,"part":"방법1","text":"그래서 박스피라는 별명까지 붙었어요.","start":91.687,"end":94.023},{"n":23,"part":"방법1","text":"같은 기간, 미국 대표 회사 500개를 묶은 S&P 500은 81% 올랐고요.","start":94.473,"end":99.626},{"n":24,"part":"방법1","text":"물론 국장이 늘 진 건 아니에요.","start":100.076,"end":101.808},{"n":25,"part":"방법1","text":"작년 가을 4,000을 넘은 코스피는, 올해 6월 9,000까지 올랐으니까요.","start":102.258,"end":107.005},{"n":26,"part":"방법1","text":"미장도 2022년에는 20% 넘게 떨어졌고, 환율이 움직이는 위험도 있어요.","start":107.455,"end":112.91},{"n":27,"part":"방법1","text":"그래도 저는, 한 나라 한 업종에 몰리지 않으려고 미장으로 옮기기로 했어요.","start":113.36,"end":118.06},{"n":28,"part":"방법1","text":"그것도 한 종목이 아니라, 500개 회사를 나눠 담은 지수 S&P 500으로요.","start":118.51,"end":123.361},{"n":29,"part":"방법2","text":"두 번째는, 크게 잃었다고 시장을 떠나지 않는 거예요.","start":124.361,"end":127.702},{"n":30,"part":"방법2","text":"크게 잃으면, 주식은 도박이라며 다 정리하고 떠나는 분이 많아요.","start":128.152,"end":132.248},{"n":31,"part":"방법2","text":"저도 지난주까지는, 주식 앱을 지울 생각만 했어요.","start":132.698,"end":135.888},{"n":32,"part":"방법2","text":"그런데 떠나는 그 순간, 손실은 영원히 확정돼요.","start":136.338,"end":139.377},{"n":33,"part":"방법2","text":"그래서 저는 떠나는 대신, 매매만 멈추기로 했어요.","start":139.827,"end":143.017},{"n":34,"part":"방법2","text":"계좌는 두고, 공부가 끝날 때까지 새로 매수하지 않는 거예요.","start":143.467,"end":147.261},{"n":35,"part":"방법2","text":"S&P 500에서, 2000년 이후 크게 떨어졌던 네 번을 봤어요.","start":147.711,"end":151.656},{"n":36,"part":"방법2","text":"배당은 빼고 가격만 봤으니, 실제보다 조금 적게 나온 값이에요.","start":152.106,"end":156.051},{"n":37,"part":"방법2","text":"2007년 10월 고점에 1억 원을 넣었다면, 2009년 3월 바닥에는 약 4,900만 원이 됐어요.","start":156.501,"end":162.659},{"n":38,"part":"방법2","text":"여기서 떠났다면, 그게 끝이었을 거예요.","start":163.109,"end":165.695},{"n":39,"part":"방법2","text":"그런데 남아 있었다면, 4년 뒤에 1억 원을 되찾았어요.","start":166.145,"end":169.637},{"n":40,"part":"방법2","text":"지금까지 들고 있었다면, 약 5억 원이 됐고요.","start":170.087,"end":172.975},{"n":41,"part":"방법2","text":"닷컴 폭락도, 코로나 폭락도, 2022년 하락장도 마찬가지였어요.","start":173.425,"end":178.073},{"n":42,"part":"방법2","text":"네 번 모두, 남아 있던 사람은 고점을 되찾았어요.","start":178.523,"end":181.562},{"n":43,"part":"방법2","text":"짧게는 5개월, 길게는 4년 3개월이 걸렸죠.","start":182.012,"end":185.051},{"n":44,"part":"방법2","text":"다만 이건 500개 회사를 나눠 담은 지수 이야기예요.","start":185.501,"end":188.592},{"n":45,"part":"방법2","text":"한 종목은, 끝내 회복하지 못할 수도 있어요.","start":189.042,"end":191.779},{"n":46,"part":"방법3","text":"세 번째는, 종목 뉴스만 보지 말고 거시 경제를 보는 공부를 하는 거예요.","start":192.779,"end":197.177},{"n":47,"part":"방법3","text":"거시 경제는 금리처럼 시장 전체를 움직이는 큰 흐름이에요.","start":197.627,"end":201.171},{"n":48,"part":"방법3","text":"많은 개미가, 종목 뉴스와 차트만 봐요.","start":201.621,"end":204.056},{"n":49,"part":"방법3","text":"저도 반도체 호재 기사만 골라 읽었어요.","start":204.506,"end":206.842},{"n":50,"part":"방법3","text":"그런데 7월 폭락은, 회사 하나의 문제가 아니었어요.","start":207.292,"end":210.633},{"n":51,"part":"방법3","text":"반도체와 레버리지 상품에 돈이 쏠린 상태였어요.","start":211.083,"end":214.023},{"n":52,"part":"방법3","text":"거기에 미국 금리 인상 우려와 AI 수익성 우려, 지정학 불안이 한꺼번에 덮쳤다는 분석이 나왔죠.","start":214.473,"end":220.834},{"n":53,"part":"방법3","text":"금리가 오르면 예금 이자가 좋아지니, 주식으로 오던 돈이 줄기 쉬워요.","start":221.284,"end":225.682},{"n":54,"part":"방법3","text":"환율이 급하게 뛰면, 외국인 투자자가 한국 주식을 매도하고 나가기 쉽고요.","start":226.132,"end":230.832},{"n":55,"part":"방법3","text":"시장의 빚도 신호였어요.","start":231.282,"end":232.712},{"n":56,"part":"방법3","text":"증권사에서 빌린 신용 잔고는 6월 24일, 38조 6천억 원으로 올해 가장 많았어요.","start":233.162,"end":238.768},{"n":57,"part":"방법3","text":"코스피가 9,000을 처음 넘은 지, 엿새 뒤였죠.","start":239.218,"end":242.205},{"n":58,"part":"방법3","text":"시장 전체가 빚으로 달리고 있었던 거예요.","start":242.655,"end":245.142},{"n":59,"part":"방법3","text":"그래서 매수하기 전 장단기 금리차, 채권 등 경제 관련 지표를 확인하기로 했어요.","start":245.592,"end":250.594},{"n":60,"part":"방법3","text":"이걸로 매수, 매도 시점을 맞히려는 게 아니에요.","start":251.044,"end":254.083},{"n":61,"part":"방법3","text":"제가 지금 무리하고 있는지, 점검하는 거예요.","start":254.533,"end":257.421},{"n":62,"part":"방법4","text":"네 번째는, 공부한 걸로 본인만의 원칙을 만들고, 남의 말에 휘둘리지 않는 거예요.","start":258.421,"end":263.673},{"n":63,"part":"방법4","text":"많은 개미가 리딩방, 유튜브, 단톡방에서 들은 종목을 따라 매수해요.","start":264.123,"end":268.62},{"n":64,"part":"방법4","text":"리딩방은 종목을 찍어 준다는 유료 대화방이에요.","start":269.07,"end":272.01},{"n":65,"part":"방법4","text":"저도 2년 동안 리딩방 회비를 냈고, 올해 6월엔 단톡방 수익 인증을 보고 빚까지 냈어요.","start":272.46,"end":277.915},{"n":66,"part":"방법4","text":"이건 저만의 일이 아니었어요.","start":278.365,"end":280.097},{"n":67,"part":"방법4","text":"올해 6월과 7월, 서학개미가 가장 많이 순매수한 종목은 반도체 3배 레버리지 ETF인 SOXL이었어요.","start":280.547,"end":287.814},{"n":68,"part":"방법4","text":"그 ETF는 5월 말부터 7월 30일까지, 48.9%가 떨어졌죠.","start":288.264,"end":293.115},{"n":69,"part":"방법4","text":"자본시장연구원은 잦은 매매와 지나친 확신을, 낮은 수익의 원인으로 짚었어요.","start":293.565,"end":298.567},{"n":70,"part":"방법4","text":"2020년에 새로 시작한 개인 투자자의 62%가, 손실을 봤고요.","start":299.017,"end":303.717},{"n":71,"part":"방법4","text":"미국 모닝스타도, 펀드 투자자가 사고파는 시점 때문에 해마다 1.2%포인트를 덜 벌었다고 분석했어요.","start":304.167,"end":311.132},{"n":72,"part":"방법4","text":"그래서 저는 제 원칙을 노트에 적었어요.","start":311.582,"end":313.918},{"n":73,"part":"방법4","text":"빚은 내지 않기,","start":314.368,"end":315.444},{"n":74,"part":"방법4","text":"한 종목에는, 계좌의 10%까지만 넣기,","start":315.894,"end":318.881},{"n":75,"part":"방법4","text":"매수하기 전에는, 이유를 세 줄로 적기 , 일단 이렇게 생각해봤어요.","start":319.331,"end":323.677},{"n":76,"part":"방법4","text":"남이 추천한 종목은, 그 세 줄을 제가 직접 못 쓰면 매수하지 않아요.","start":324.127,"end":328.223},{"n":77,"part":"방법4","text":"원칙이 있으면, 남의 수익 인증을 봐도 흔들릴 이유가 줄어요.","start":328.673,"end":332.467},{"n":78,"part":"방법4","text":"제 원칙에 맞지 않으면, 그냥 지나가면 되니까요.","start":332.917,"end":335.956},{"n":79,"part":"방법5","text":"다섯 번째는, 리스크를 최대한 줄이면서 천천히 수익을 내는 거예요.","start":336.956,"end":341.203},{"n":80,"part":"방법5","text":"잃은 돈을 빨리 메우려고, 레버리지와 몰빵에 다시 손을 대는 분이 많아요.","start":341.653,"end":346.202},{"n":81,"part":"방법5","text":"저도 그 유혹이 제일 커요.","start":346.652,"end":348.082},{"n":82,"part":"방법5","text":"그래서 월급날 다음 날, 정해진 금액 안에서만 매수하도록 했어요.","start":348.532,"end":352.628},{"n":83,"part":"방법5","text":"매달 100만 원씩 10년을 넣었다면 어땠는지, S&P 500으로 계산해 봤어요.","start":353.078,"end":357.929},{"n":84,"part":"방법5","text":"2000년부터 2016년까지, 아무 달에나 시작한 202번을 봤어요.","start":358.379,"end":362.777},{"n":85,"part":"방법5","text":"손실로 끝난 경우는, 8번이었어요.","start":363.227,"end":365.511},{"n":86,"part":"방법5","text":"202번 중 194번은, 넣은 돈보다 많이 남았다는 뜻이죠.","start":365.961,"end":369.906},{"n":87,"part":"방법5","text":"평균 수익 배수는, 넣은 돈의 1.6배였고요.","start":370.356,"end":373.244},{"n":88,"part":"방법5","text":"가장 나빴을 때도, 넣은 돈의 0.95배였어요.","start":373.694,"end":376.733},{"n":89,"part":"방법5","text":"물론 과거 결과가 앞으로를 보장하지는 않아요.","start":377.183,"end":379.972},{"n":90,"part":"방법5","text":"반대로 3배 레버리지로 빨리 메우려 했다면, 2020년 3월 한 달에만 76.7%가 떨어졌어요.","start":380.422,"end":387.085},{"n":91,"part":"방법5","text":"빨리 가려다, 아예 못 가게 되는 거죠.","start":387.535,"end":389.819},{"n":92,"part":"방법5","text":"천천히라도 쌓아 가다 보면, 언젠가 잃었던 돈을 다시 찾을 수 있을 거라고 믿어요.","start":390.269,"end":395.271},{"n":93,"part":"정리","text":"오늘 이야기, 정리해볼게요.","start":396.271,"end":398.102},{"n":94,"part":"마무리","text":"주식으로 전재산을 날렸어도, 포기하지 않으면 아직 진짜 손해는 아니라고 믿어요.","start":399.102,"end":404.255},{"n":95,"part":"마무리","text":"저는 오늘부터 매매를 잠시 멈추고, 앞서 말한 방법들을 지키도록 노력할 거예요.","start":404.705,"end":409.707},{"n":96,"part":"마무리","text":"여러분의 투자도 꼭 성공하길 바랄게요.","start":410.157,"end":412.493},{"n":97,"part":"마무리","text":"시청해주셔서 감사합니다.","start":412.943,"end":414.524}],"subs":[[0.3,2.68,"올해 반도체 주식 종목에 투자했다가,"],[2.68,6.057,"전재산의 70%인 2억 5천만 원을 손해 봤어요."],[6.507,10.301,"빚까지 냈다가, 7월 폭락에 빌린 돈부터 강제로 빠져나갔죠."],[10.751,15.701,"이제 마흔넷인데, 회사는 언제까지 다닐지 모르고, 딸 학원비는 매달 나가요."],[16.151,20.096,"노후 자금은 1억 원 남았는데, 아내에게는 아직 말도 못 했어요."],[20.546,22.429,"주식에서 손을 떼야겠다 싶었죠."],[22.879,25.215,"하지만 매도만 안하면 손실이 아니듯이"],[25.665,29.36,"주식시장을 떠나지 않으면 아직 손해가 아니라고 생각했어요."],[29.81,32.488,"그래서 원금 복구를 위해 제대로 공부하기로"],[32.488,35.166,"마음먹고 지켜야할 5가지를 알아보았어요."],[36.166,39.054,"첫 번째는, 국장 대신 미장으로 옮기는 거예요."],[39.504,42.392,"국장은 한국 주식, 미장은 미국 주식을 말해요."],[42.842,45.329,"많은 개미가 익숙한 국장에서만 투자하죠."],[45.779,47.237,"그런데 지금 코스피는,"],[47.237,51.536,"삼성전자와 SK하이닉스 두 회사가 시가총액의 절반을 넘어요."],[51.986,55.931,"코스피를 산다는 건, 사실상 반도체 한 업종에 몰빵하는 거예요."],[56.381,59.118,"저는 거기서도, 반도체에만 돈을 넣었고요."],[59.568,63.06,"그러니 반도체가 흔들리면, 시장 전체가 같이 흔들려요."],[63.51,67.42,"7월 13일에는 코스피가 하루에 8.95% 떨어져서,"],[67.42,69.72,"거래가 20분 동안 멈추기도 했어요."],[70.17,73.511,"그리고 7월 한 달 동안, 34% 넘게 떨어졌죠."],[73.961,77.906,"저처럼 반도체만 들고 있던 사람은, 그 충격을 그대로 맞았어요."],[78.356,79.635,"길게 봐도 비슷했어요."],[80.085,83.191,"코스피는 2007년에 처음 2,000을 넘었지만,"],[83.191,85.889,"2,000을 되찾는 데 3년이 넘게 걸렸어요."],[86.339,91.237,"그 뒤로도 2016년까지 6년 넘게, 1,900에서 2,000대에 머물렀죠."],[91.687,94.023,"그래서 박스피라는 별명까지 붙었어요."],[94.473,99.626,"같은 기간, 미국 대표 회사 500개를 묶은 S&P 500은 81% 올랐고요."],[100.076,101.808,"물론 국장이 늘 진 건 아니에요."],[102.258,107.005,"작년 가을 4,000을 넘은 코스피는, 올해 6월 9,000까지 올랐으니까요."],[107.455,112.91,"미장도 2022년에는 20% 넘게 떨어졌고, 환율이 움직이는 위험도 있어요."],[113.36,118.06,"그래도 저는, 한 나라 한 업종에 몰리지 않으려고 미장으로 옮기기로 했어요."],[118.51,123.361,"그것도 한 종목이 아니라, 500개 회사를 나눠 담은 지수 S&P 500으로요."],[124.361,127.702,"두 번째는, 크게 잃었다고 시장을 떠나지 않는 거예요."],[128.152,132.248,"크게 잃으면, 주식은 도박이라며 다 정리하고 떠나는 분이 많아요."],[132.698,135.888,"저도 지난주까지는, 주식 앱을 지울 생각만 했어요."],[136.338,139.377,"그런데 떠나는 그 순간, 손실은 영원히 확정돼요."],[139.827,143.017,"그래서 저는 떠나는 대신, 매매만 멈추기로 했어요."],[143.467,147.261,"계좌는 두고, 공부가 끝날 때까지 새로 매수하지 않는 거예요."],[147.711,151.656,"S&P 500에서, 2000년 이후 크게 떨어졌던 네 번을 봤어요."],[152.106,156.051,"배당은 빼고 가격만 봤으니, 실제보다 조금 적게 나온 값이에요."],[156.501,159.264,"2007년 10월 고점에 1억 원을 넣었다면,"],[159.264,162.659,"2009년 3월 바닥에는 약 4,900만 원이 됐어요."],[163.109,165.695,"여기서 떠났다면, 그게 끝이었을 거예요."],[166.145,169.637,"그런데 남아 있었다면, 4년 뒤에 1억 원을 되찾았어요."],[170.087,172.975,"지금까지 들고 있었다면, 약 5억 원이 됐고요."],[173.425,178.073,"닷컴 폭락도, 코로나 폭락도, 2022년 하락장도 마찬가지였어요."],[178.523,181.562,"네 번 모두, 남아 있던 사람은 고점을 되찾았어요."],[182.012,185.051,"짧게는 5개월, 길게는 4년 3개월이 걸렸죠."],[185.501,188.592,"다만 이건 500개 회사를 나눠 담은 지수 이야기예요."],[189.042,191.779,"한 종목은, 끝내 회복하지 못할 수도 있어요."],[192.779,197.177,"세 번째는, 종목 뉴스만 보지 말고 거시 경제를 보는 공부를 하는 거예요."],[197.627,201.171,"거시 경제는 금리처럼 시장 전체를 움직이는 큰 흐름이에요."],[201.621,204.056,"많은 개미가, 종목 뉴스와 차트만 봐요."],[204.506,206.842,"저도 반도체 호재 기사만 골라 읽었어요."],[207.292,210.633,"그런데 7월 폭락은, 회사 하나의 문제가 아니었어요."],[211.083,214.023,"반도체와 레버리지 상품에 돈이 쏠린 상태였어요."],[214.473,217.768,"거기에 미국 금리 인상 우려와 AI 수익성 우려,"],[217.768,220.834,"지정학 불안이 한꺼번에 덮쳤다는 분석이 나왔죠."],[221.284,225.682,"금리가 오르면 예금 이자가 좋아지니, 주식으로 오던 돈이 줄기 쉬워요."],[226.132,230.832,"환율이 급하게 뛰면, 외국인 투자자가 한국 주식을 매도하고 나가기 쉽고요."],[231.282,232.712,"시장의 빚도 신호였어요."],[233.162,236.003,"증권사에서 빌린 신용 잔고는 6월 24일,"],[236.003,238.768,"38조 6천억 원으로 올해 가장 많았어요."],[239.218,242.205,"코스피가 9,000을 처음 넘은 지, 엿새 뒤였죠."],[242.655,245.142,"시장 전체가 빚으로 달리고 있었던 거예요."],[245.592,247.824,"그래서 매수하기 전 장단기 금리차,"],[247.824,250.594,"채권 등 경제 관련 지표를 확인하기로 했어요."],[251.044,254.083,"이걸로 매수, 매도 시점을 맞히려는 게 아니에요."],[254.533,257.421,"제가 지금 무리하고 있는지, 점검하는 거예요."],[258.421,261.604,"네 번째는, 공부한 걸로 본인만의 원칙을 만들고,"],[261.604,263.673,"남의 말에 휘둘리지 않는 거예요."],[264.123,268.62,"많은 개미가 리딩방, 유튜브, 단톡방에서 들은 종목을 따라 매수해요."],[269.07,272.01,"리딩방은 종목을 찍어 준다는 유료 대화방이에요."],[272.46,274.688,"저도 2년 동안 리딩방 회비를 냈고,"],[274.688,277.915,"올해 6월엔 단톡방 수익 인증을 보고 빚까지 냈어요."],[278.365,280.097,"이건 저만의 일이 아니었어요."],[280.547,284.142,"올해 6월과 7월, 서학개미가 가장 많이 순매수한 종목은"],[284.142,287.814,"반도체 3배 레버리지 ETF인 SOXL이었어요."],[288.264,293.115,"그 ETF는 5월 말부터 7월 30일까지, 48.9%가 떨어졌죠."],[293.565,296.566,"자본시장연구원은 잦은 매매와 지나친 확신을,"],[296.566,298.567,"낮은 수익의 원인으로 짚었어요."],[299.017,303.717,"2020년에 새로 시작한 개인 투자자의 62%가, 손실을 봤고요."],[304.167,307.611,"미국 모닝스타도, 펀드 투자자가 사고파는 시점 때문에"],[307.611,311.132,"해마다 1.2%포인트를 덜 벌었다고 분석했어요."],[311.582,313.918,"그래서 저는 제 원칙을 노트에 적었어요."],[314.368,315.444,"빚은 내지 않기,"],[315.894,318.881,"한 종목에는, 계좌의 10%까지만 넣기,"],[319.331,323.677,"매수하기 전에는, 이유를 세 줄로 적기 , 일단 이렇게 생각해봤어요."],[324.127,328.223,"남이 추천한 종목은, 그 세 줄을 제가 직접 못 쓰면 매수하지 않아요."],[328.673,332.467,"원칙이 있으면, 남의 수익 인증을 봐도 흔들릴 이유가 줄어요."],[332.917,335.956,"제 원칙에 맞지 않으면, 그냥 지나가면 되니까요."],[336.956,341.203,"다섯 번째는, 리스크를 최대한 줄이면서 천천히 수익을 내는 거예요."],[341.653,346.202,"잃은 돈을 빨리 메우려고, 레버리지와 몰빵에 다시 손을 대는 분이 많아요."],[346.652,348.082,"저도 그 유혹이 제일 커요."],[348.532,352.628,"그래서 월급날 다음 날, 정해진 금액 안에서만 매수하도록 했어요."],[353.078,357.929,"매달 100만 원씩 10년을 넣었다면 어땠는지, S&P 500으로 계산해 봤어요."],[358.379,362.777,"2000년부터 2016년까지, 아무 달에나 시작한 202번을 봤어요."],[363.227,365.511,"손실로 끝난 경우는, 8번이었어요."],[365.961,369.906,"202번 중 194번은, 넣은 돈보다 많이 남았다는 뜻이죠."],[370.356,373.244,"평균 수익 배수는, 넣은 돈의 1.6배였고요."],[373.694,376.733,"가장 나빴을 때도, 넣은 돈의 0.95배였어요."],[377.183,379.972,"물론 과거 결과가 앞으로를 보장하지는 않아요."],[380.422,383.256,"반대로 3배 레버리지로 빨리 메우려 했다면,"],[383.256,387.085,"2020년 3월 한 달에만 76.7%가 떨어졌어요."],[387.535,389.819,"빨리 가려다, 아예 못 가게 되는 거죠."],[390.269,392.039,"천천히라도 쌓아 가다 보면,"],[392.039,395.271,"언젠가 잃었던 돈을 다시 찾을 수 있을 거라고 믿어요."],[396.271,398.102,"오늘 이야기, 정리해볼게요."],[399.102,401.025,"주식으로 전재산을 날렸어도,"],[401.025,404.255,"포기하지 않으면 아직 진짜 손해는 아니라고 믿어요."],[404.705,406.937,"저는 오늘부터 매매를 잠시 멈추고,"],[406.937,409.707,"앞서 말한 방법들을 지키도록 노력할 거예요."],[410.157,412.493,"여러분의 투자도 꼭 성공하길 바랄게요."],[412.943,414.524,"시청해주셔서 감사합니다."]],"subs_estimated":true};/*EP-DATA:END*/</script>
