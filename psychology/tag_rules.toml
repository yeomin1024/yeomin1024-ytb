#   → ④ TAG_THEMES 로 묶어 검색어 목록 keywords.txt 를 다시 씀 (--write-keywords, 예전 것은 .bak). 표: tag_candidates.md
# 고치는 법: 메모장으로 열어 "따옴표" 안의 글자만 바꾸고 저장 → python tools/tag_keywords.py psychology --write-keywords
