<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"adhd-ab-2026-11","topic":"psychology","duration":338.5,"audio":"../../../psychology/source/adhd-ab-2026-11/narration.mp3","thumb":null,"synced":"2026-11-23T21:14:33Z","tts":"2026-11-23T17:09:47","script_sha1":"e5a97218556faac3","sent":[{"n":1,"part":"도입","text":"할 일을 계속 미루고 휴대폰만 보다가, 하루가 다 지나가 버린 경험, 한 번쯤 있으시죠.","start":0.3,"end":5.8},{"n":2,"part":"도입","text":"그리고 밤이 되면 \"나는 왜 이렇게 게으를까\" 하고 자책하게 되고요.","start":6.18,"end":10.04},{"n":3,"part":"도입","text":"그런데 요즘, 이게 게으름이 아니라 ADHD일지도 모른다며 병원을 찾는 어른이 5년 사이 6배 넘게 늘었어요.","start":10.42,"end":17.78},{"n":4,"part":"도입","text":"자가진단만으로는 애매하니까, 답답한 마음에 검사를 받아 보는 거죠.","start":18.16,"end":22.468},{"n":5,"part":"도입","text":"물론 \"나는 아니겠지, 검사는 시간 낭비야\" 하고 넘기는 사람도 있고요.","start":22.848,"end":27.328},{"n":6,"part":"도입","text":"정말 시간 낭비일까요?","start":27.708,"end":29.073},{"n":7,"part":"도입","text":"두 사람을 비교해 보면 답이 보입니다.","start":29.453,"end":31.633},{"n":8,"part":"똑같은 하루","text":"서른두 살 A씨는 6시까지 낼 보고서를, 쉰한 살 B씨는 오늘까지 낼 과태료를 앞에 두고 휴대폰을 집어 듭니다.","start":32.633,"end":40.003},{"n":9,"part":"똑같은 하루","text":"그리고 몇 시간이 순식간에 지나가죠.","start":40.383,"end":42.319},{"n":10,"part":"똑같은 하루","text":"결국 A씨는 급하게 낸 보고서를 다시 쓰게 되고, B씨는 기한을 넘겨 가산금까지 내요.","start":42.699,"end":48.539},{"n":11,"part":"똑같은 하루","text":"그런데 두 사람에게는 이상한 공통점이 하나 더 있어요.","start":48.919,"end":52.059},{"n":12,"part":"똑같은 하루","text":"보고서랑 고지서는 그렇게 미루던 사람들이, 좋아하는 건 새벽 세 시까지 본다는 거예요.","start":52.439,"end":57.554},{"n":13,"part":"똑같은 하루","text":"둘 다 자기가 게을러서 그렇다고 생각했어요.","start":57.934,"end":60.614},{"n":14,"part":"똑같은 하루","text":"하지만 게으름만으로는 이게 설명이 안 돼요.","start":60.994,"end":63.464},{"n":15,"part":"똑같은 하루","text":"ADHD는 집중을 아예 못 하는 게 아니라, 집중을 마음대로 켜고 끄기가 어려운 상태거든요.","start":63.844,"end":69.616},{"n":16,"part":"똑같은 하루","text":"그래서 재미없는 일은 시작이 안 되고, 재미있는 일은 멈추기가 어려운 거죠.","start":69.996,"end":74.456},{"n":17,"part":"똑같은 하루","text":"이렇게 똑같던 두 사람의 삶은, 어느 날 밤 영상 하나로 갈라집니다.","start":74.836,"end":79.046},{"n":18,"part":"갈림길","text":"두 사람은 똑같이 성인 ADHD 증상 영상을 봤어요.","start":80.046,"end":83.256},{"n":19,"part":"갈림길","text":"A씨는 그 자리에서 병원을 예약했고, B씨는 시간 낭비라며 영상을 꺼 버렸죠.","start":83.636,"end":88.666},{"n":20,"part":"갈림길","text":"A씨는 병원에서 어떤 결과를 받았을까요?","start":89.046,"end":91.719},{"n":21,"part":"갈림길","text":"병원에서는 지금 증상만 보지 않아요.","start":92.099,"end":94.185},{"n":22,"part":"갈림길","text":"어릴 때도 그랬는지 생활기록부나 가족 이야기로 확인하고, 설문과 검사도 하죠.","start":94.565,"end":99.645},{"n":23,"part":"갈림길","text":"우울이나 불안, 수면 문제 같은 다른 원인은 아닌지도 함께 살피고요.","start":100.025,"end":104.475},{"n":24,"part":"갈림길","text":"그렇게 A씨는 ADHD 진단을 받았습니다.","start":104.855,"end":107.975},{"n":25,"part":"갈림길","text":"요즘은 A씨처럼 어른이 되어서야 진단받는 사람이 정말 많아요.","start":108.355,"end":112.265},{"n":26,"part":"갈림길","text":"특히 30대 여성은 5년 사이 11.6배나 늘었습니다.","start":112.645,"end":116.315},{"n":27,"part":"갈림길","text":"전문가들은 환자가 갑자기 생긴 게 아니라, 모르고 살던 사람들이 이제야 알게 된 거라고 봐요.","start":116.695,"end":121.937},{"n":28,"part":"갈림길","text":"진단을 받고 나서, A씨의 하루는 어떻게 달라졌을까요?","start":122.317,"end":125.847},{"n":29,"part":"A씨, 알고 난 뒤","text":"약을 먹은 첫날, 늘 마감 직전에야 내던 보고서를 오전에 끝냈어요.","start":126.847,"end":131.187},{"n":30,"part":"A씨, 알고 난 뒤","text":"그런데 A씨는 기쁘기보다 억울해서, 화장실에서 울었습니다.","start":131.567,"end":135.505},{"n":31,"part":"A씨, 알고 난 뒤","text":"늦게 진단받은 어른들은 이렇게 그동안 놓친 시간을 억울해하는 경우가 많아요.","start":135.885,"end":140.385},{"n":32,"part":"A씨, 알고 난 뒤","text":"하지만 약이 모든 걸 해결해 주지는 않았어요.","start":140.765,"end":143.205},{"n":33,"part":"A씨, 알고 난 뒤","text":"약을 깜빡한 날은 예전처럼 돌아가고, 약효가 떨어지는 저녁에도 다시 흐트러졌거든요.","start":143.585,"end":148.952},{"n":34,"part":"A씨, 알고 난 뒤","text":"그래서 A씨는 약에 한 가지를 더했어요.","start":149.332,"end":151.711},{"n":35,"part":"A씨, 알고 난 뒤","text":"바로 습관이에요.","start":152.091,"end":153.269},{"n":36,"part":"A씨, 알고 난 뒤","text":"의사와 상담하면서, 일어나면 약부터 먹고, 일할 땐 휴대폰을 서랍에 넣고, 알람으로 일을 잘게 나눴죠.","start":153.649,"end":160.189},{"n":37,"part":"A씨, 알고 난 뒤","text":"그렇게 1년이 지났습니다.","start":160.569,"end":161.983},{"n":38,"part":"A씨, 알고 난 뒤","text":"실수가 아예 없어진 건 아니에요.","start":162.363,"end":164.373},{"n":39,"part":"A씨, 알고 난 뒤","text":"다만 실수 하나로 하루를 망치지 않게 됐고, 무엇보다 더 이상 스스로를 게으르다고 탓하지 않아요.","start":164.753,"end":170.619},{"n":40,"part":"A씨, 알고 난 뒤","text":"한편, 검사를 시간 낭비라고 했던 B씨는 오늘도 같은 일로 다투고 있었습니다.","start":170.999,"end":175.889},{"n":41,"part":"B씨, 모르고 산 30년","text":"아침에 세 번이나 들은 부탁을, 또 잊어버렸거든요.","start":176.889,"end":180.108},{"n":42,"part":"B씨, 모르고 산 30년","text":"내일 결혼식에 입을 양복인데도요.","start":180.488,"end":182.441},{"n":43,"part":"B씨, 모르고 산 30년","text":"잊어버리고, 화내고, 후회하고.","start":182.821,"end":185.188},{"n":44,"part":"B씨, 모르고 산 30년","text":"이런 일로 두 사람은 30년째 다투고 있어요.","start":185.568,"end":188.393},{"n":45,"part":"B씨, 모르고 산 30년","text":"그런데 아내는 이 일을 전혀 다르게 받아들이고 있었어요.","start":188.773,"end":191.747},{"n":46,"part":"B씨, 모르고 산 30년","text":"아내는 무시당한다고 느꼈고, B씨는 자기가 게을러서라고 믿었죠.","start":192.127,"end":196.377},{"n":47,"part":"B씨, 모르고 산 30년","text":"이유를 모르면, 이렇게 모든 게 성격 탓이 돼요.","start":196.757,"end":199.623},{"n":48,"part":"B씨, 모르고 산 30년","text":"그리고 문제는 집에서 끝나지 않았습니다.","start":200.003,"end":202.363},{"n":49,"part":"B씨, 모르고 산 30년","text":"일 잘한다는 말을 듣던 B씨였지만, 승진 서류를 마감까지 내지 못해서 이번에도 승진에서 빠졌어요.","start":202.743,"end":208.813},{"n":50,"part":"B씨, 모르고 산 30년","text":"처음 있는 일도 아니었죠.","start":209.193,"end":210.553},{"n":51,"part":"B씨, 모르고 산 30년","text":"이렇게 자책이 쌓이면 마음도 지쳐요.","start":210.933,"end":213.223},{"n":52,"part":"B씨, 모르고 산 30년","text":"실제로 ADHD가 있는 어른은 우울이나 불안을 함께 겪는 경우가 많다고 알려져 있습니다.","start":213.603,"end":219.08},{"n":53,"part":"B씨, 모르고 산 30년","text":"모르고 사는 것과 치료하는 것, 숫자로 보면 차이가 꽤 납니다.","start":219.46,"end":223.379},{"n":54,"part":"숫자로 본 차이","text":"2025년 영국 의학 학술지 BMJ에 실린 스웨덴 연구가 있어요.","start":224.379,"end":228.809},{"n":55,"part":"숫자로 본 차이","text":"ADHD를 새로 진단받은 6살부터 64살까지 14만 8천여 명을, 약을 먹기 시작한 사람과 먹지 않은 사람으로 나눠 2년 동안 비교했죠.","start":229.189,"end":238.627},{"n":56,"part":"숫자로 본 차이","text":"그 결과, 약을 먹은 쪽은 자살 시도 같은 행동이 17%, 교통사고가 12%, 범죄가 13% 적었습니다.","start":239.007,"end":246.677},{"n":57,"part":"숫자로 본 차이","text":"다만 실험이 아니라 기록을 비교한 연구라서, 이 차이가 모두 약 덕분이라고 단정할 수는 없어요.","start":247.057,"end":252.577},{"n":58,"part":"숫자로 본 차이","text":"또 이건 진단을 받고도 약을 먹지 않은 사람과 비교한 결과예요.","start":252.957,"end":256.572},{"n":59,"part":"숫자로 본 차이","text":"B씨처럼 병원에 가 보지도 않은 사람은, 이런 통계에 잡히지도 않죠.","start":256.952,"end":261.313},{"n":60,"part":"숫자로 본 차이","text":"요즘엔 아무나 ADHD라고 한다는 말도 있어요.","start":261.693,"end":264.64},{"n":61,"part":"애매한 나는","text":"틀린 말은 아니에요.","start":265.64,"end":266.709},{"n":62,"part":"애매한 나는","text":"누구나 미루고, 누구나 깜빡하니까요.","start":267.089,"end":269.589},{"n":63,"part":"애매한 나는","text":"다만, 스스로 세 가지만 물어보세요.","start":269.969,"end":272.309},{"n":64,"part":"애매한 나는","text":"첫째, 어릴 때부터 그랬나요?","start":272.689,"end":274.623},{"n":65,"part":"애매한 나는","text":"둘째, 집과 직장처럼 두 곳 이상에서 그런가요?","start":275.003,"end":278.008},{"n":66,"part":"애매한 나는","text":"셋째, 그 때문에 돈이나 일, 관계에서 같은 손해를 반복하고 있나요?","start":278.388,"end":282.708},{"n":67,"part":"애매한 나는","text":"셋 다 그렇다면, 한 번쯤 확인해 볼 만해요.","start":283.088,"end":285.761},{"n":68,"part":"애매한 나는","text":"하지만 잠이 부족하거나 우울할 때도 집중은 무너져요.","start":286.141,"end":289.391},{"n":69,"part":"애매한 나는","text":"그래서 판단은 인터넷 체크리스트가 아니라, 전문의 검사로 해야 합니다.","start":289.771,"end":293.881},{"n":70,"part":"애매한 나는","text":"그리고 B씨에게도, 결국 그 순간이 찾아왔습니다.","start":294.261,"end":297.499},{"n":71,"part":"마무리","text":"몇 년 뒤, B씨의 중학생 아들이 ADHD 진단을 받았어요.","start":298.499,"end":302.529},{"n":72,"part":"마무리","text":"그날 의사는 B씨에게 이렇게 물었습니다.","start":302.909,"end":305.299},{"n":73,"part":"마무리","text":"\"아버님은 어릴 때 어떠셨어요?\"","start":305.679,"end":307.344},{"n":74,"part":"마무리","text":"ADHD는 가족 안에서 함께 나타나는 경우가 많거든요.","start":307.724,"end":311.301},{"n":75,"part":"마무리","text":"아들의 진단을 듣고서야, B씨는 처음으로 자기 자신을 돌아보게 됐어요.","start":311.681,"end":316.111},{"n":76,"part":"마무리","text":"결국 B씨가 아낀 건 검사 몇 시간뿐이었어요.","start":316.491,"end":319.256},{"n":77,"part":"마무리","text":"그 대신 30년 동안 자기 자신을 탓하며 살았죠.","start":319.636,"end":322.555},{"n":78,"part":"마무리","text":"A씨와 B씨를 가른 건 의지가 아니었어요.","start":322.935,"end":325.699},{"n":79,"part":"마무리","text":"내가 왜 이런지, 그 이유를 알았느냐였죠.","start":326.079,"end":328.759},{"n":80,"part":"마무리","text":"이유를 알아야, 나를 탓하는 대신 방법을 찾을 수 있으니까요.","start":329.139,"end":332.619},{"n":81,"part":"마무리","text":"유익하셨다면 구독과 좋아요 부탁드려요.","start":332.999,"end":335.598}],"subs":[[0.2,6.18,"할 일을 계속 미루고 휴대폰만 보다가,\n하루가 다 지나가 버린 경험, 한 번쯤 있으시죠."],[6.18,10.42,"그리고 밤이 되면 \"나는 왜 이렇게 게으를까\" 하고 자책하게 되고요."],[10.42,18.16,"그런데 요즘, 이게 게으름이 아니라 ADHD일지도 모른다며\n병원을 찾는 어른이 5년 사이 6배 넘게 늘었어요."],[18.16,22.848,"자가진단만으로는 애매하니까, 답답한 마음에 검사를 받아 보는 거죠."],[22.848,27.708,"물론 \"나는 아니겠지, 검사는 시간 낭비야\" 하고 넘기는 사람도 있고요."],[27.708,29.453,"정말 시간 낭비일까요?"],[29.453,32.633,"두 사람을 비교해 보면 답이 보입니다."],[32.633,40.383,"서른두 살 A씨는 6시까지 낼 보고서를,\n쉰한 살 B씨는 오늘까지 낼 과태료를 앞에 두고 휴대폰을 집어 듭니다."],[40.383,42.699,"그리고 몇 시간이 순식간에 지나가죠."],[42.699,48.919,"결국 A씨는 급하게 낸 보고서를 다시 쓰게 되고,\nB씨는 기한을 넘겨 가산금까지 내요."],[48.919,52.439,"그런데 두 사람에게는 이상한 공통점이 하나 더 있어요."],[52.439,57.934,"보고서랑 고지서는 그렇게 미루던 사람들이,\n좋아하는 건 새벽 세 시까지 본다는 거예요."],[57.934,60.994,"둘 다 자기가 게을러서 그렇다고 생각했어요."],[60.994,63.844,"하지만 게으름만으로는 이게 설명이 안 돼요."],[63.844,69.996,"ADHD는 집중을 아예 못 하는 게 아니라,\n집중을 마음대로 켜고 끄기가 어려운 상태거든요."],[69.996,74.836,"그래서 재미없는 일은 시작이 안 되고,\n재미있는 일은 멈추기가 어려운 거죠."],[74.836,80.046,"이렇게 똑같던 두 사람의 삶은, 어느 날 밤 영상 하나로 갈라집니다."],[80.046,83.636,"두 사람은 똑같이 성인 ADHD 증상 영상을 봤어요."],[83.636,89.046,"A씨는 그 자리에서 병원을 예약했고,\nB씨는 시간 낭비라며 영상을 꺼 버렸죠."],[89.046,92.099,"A씨는 병원에서 어떤 결과를 받았을까요?"],[92.099,94.565,"병원에서는 지금 증상만 보지 않아요."],[94.565,100.025,"어릴 때도 그랬는지 생활기록부나 가족 이야기로 확인하고,\n설문과 검사도 하죠."],[100.025,104.855,"우울이나 불안, 수면 문제 같은 다른 원인은 아닌지도 함께 살피고요."],[104.855,108.355,"그렇게 A씨는 ADHD 진단을 받았습니다."],[108.355,112.645,"요즘은 A씨처럼 어른이 되어서야 진단받는 사람이 정말 많아요."],[112.645,116.695,"특히 30대 여성은 5년 사이 11.6배나 늘었습니다."],[116.695,122.317,"전문가들은 환자가 갑자기 생긴 게 아니라,\n모르고 살던 사람들이 이제야 알게 된 거라고 봐요."],[122.317,126.847,"진단을 받고 나서, A씨의 하루는 어떻게 달라졌을까요?"],[126.847,131.567,"약을 먹은 첫날, 늘 마감 직전에야 내던 보고서를 오전에 끝냈어요."],[131.567,135.885,"그런데 A씨는 기쁘기보다 억울해서, 화장실에서 울었습니다."],[135.885,140.765,"늦게 진단받은 어른들은 이렇게 그동안 놓친 시간을\n억울해하는 경우가 많아요."],[140.765,143.585,"하지만 약이 모든 걸 해결해 주지는 않았어요."],[143.585,149.332,"약을 깜빡한 날은 예전처럼 돌아가고,\n약효가 떨어지는 저녁에도 다시 흐트러졌거든요."],[149.332,152.091,"그래서 A씨는 약에 한 가지를 더했어요."],[152.091,153.649,"바로 습관이에요."],[153.649,160.569,"의사와 상담하면서, 일어나면 약부터 먹고,\n일할 땐 휴대폰을 서랍에 넣고, 알람으로 일을 잘게 나눴죠."],[160.569,162.363,"그렇게 1년이 지났습니다."],[162.363,164.753,"실수가 아예 없어진 건 아니에요."],[164.753,170.999,"다만 실수 하나로 하루를 망치지 않게 됐고,\n무엇보다 더 이상 스스로를 게으르다고 탓하지 않아요."],[170.999,176.889,"한편, 검사를 시간 낭비라고\n했던 B씨는 오늘도 같은 일로 다투고 있었습니다."],[176.889,180.488,"아침에 세 번이나 들은 부탁을, 또 잊어버렸거든요."],[180.488,182.821,"내일 결혼식에 입을 양복인데도요."],[182.821,185.568,"잊어버리고, 화내고, 후회하고."],[185.568,188.773,"이런 일로 두 사람은 30년째 다투고 있어요."],[188.773,192.127,"그런데 아내는 이 일을 전혀 다르게 받아들이고 있었어요."],[192.127,196.757,"아내는 무시당한다고 느꼈고, B씨는 자기가 게을러서라고 믿었죠."],[196.757,200.003,"이유를 모르면, 이렇게 모든 게 성격 탓이 돼요."],[200.003,202.743,"그리고 문제는 집에서 끝나지 않았습니다."],[202.743,209.193,"일 잘한다는 말을 듣던 B씨였지만,\n승진 서류를 마감까지 내지 못해서 이번에도 승진에서 빠졌어요."],[209.193,210.933,"처음 있는 일도 아니었죠."],[210.933,213.603,"이렇게 자책이 쌓이면 마음도 지쳐요."],[213.603,219.46,"실제로 ADHD가 있는 어른은 우울이나 불안을\n함께 겪는 경우가 많다고 알려져 있습니다."],[219.46,224.379,"모르고 사는 것과 치료하는 것, 숫자로 보면 차이가 꽤 납니다."],[224.379,229.189,"2025년 영국 의학 학술지 BMJ에 실린 스웨덴 연구가 있어요."],[229.189,239.007,"ADHD를 새로 진단받은 6살부터 64살까지 14만 8천여 명을,\n약을 먹기 시작한 사람과 먹지 않은 사람으로 나눠 2년 동안 비교했죠."],[239.007,247.057,"그 결과, 약을 먹은 쪽은 자살 시도 같은 행동이 17%,\n교통사고가 12%, 범죄가 13% 적었습니다."],[247.057,252.957,"다만 실험이 아니라 기록을 비교한 연구라서,\n이 차이가 모두 약 덕분이라고 단정할 수는 없어요."],[252.957,256.952,"또 이건 진단을 받고도 약을 먹지 않은 사람과 비교한 결과예요."],[256.952,261.693,"B씨처럼 병원에 가 보지도 않은 사람은, 이런 통계에 잡히지도 않죠."],[261.693,265.64,"요즘엔 아무나 ADHD라고 한다는 말도 있어요."],[265.64,267.089,"틀린 말은 아니에요."],[267.089,269.969,"누구나 미루고, 누구나 깜빡하니까요."],[269.969,272.689,"다만, 스스로 세 가지만 물어보세요."],[272.689,275.003,"첫째, 어릴 때부터 그랬나요?"],[275.003,278.388,"둘째, 집과 직장처럼 두 곳 이상에서 그런가요?"],[278.388,283.088,"셋째, 그 때문에 돈이나 일, 관계에서 같은 손해를 반복하고 있나요?"],[283.088,286.141,"셋 다 그렇다면, 한 번쯤 확인해 볼 만해요."],[286.141,289.771,"하지만 잠이 부족하거나 우울할 때도 집중은 무너져요."],[289.771,294.261,"그래서 판단은 인터넷 체크리스트가 아니라,\n전문의 검사로 해야 합니다."],[294.261,298.499,"그리고 B씨에게도, 결국 그 순간이 찾아왔습니다."],[298.499,302.909,"몇 년 뒤, B씨의 중학생 아들이 ADHD 진단을 받았어요."],[302.909,305.679,"그날 의사는 B씨에게 이렇게 물었습니다."],[305.679,307.724,"\"아버님은 어릴 때 어떠셨어요?\""],[307.724,311.681,"ADHD는 가족 안에서 함께 나타나는 경우가 많거든요."],[311.681,316.491,"아들의 진단을 듣고서야,\nB씨는 처음으로 자기 자신을 돌아보게 됐어요."],[316.491,319.636,"결국 B씨가 아낀 건 검사 몇 시간뿐이었어요."],[319.636,322.935,"그 대신 30년 동안 자기 자신을 탓하며 살았죠."],[322.935,326.079,"A씨와 B씨를 가른 건 의지가 아니었어요."],[326.079,329.139,"내가 왜 이런지, 그 이유를 알았느냐였죠."],[329.139,332.999,"이유를 알아야, 나를 탓하는 대신 방법을 찾을 수 있으니까요."],[332.999,335.998,"유익하셨다면 구독과 좋아요 부탁드려요."]]};/*EP-DATA:END*/</script>

for (const k of ["OFFICE", "B-LIVING", "A-BED", "CLINIC", "RESTROOM", "MEETING", "B-ROOM", "VERANDA", "B-OFFICE", "PUB", "PEDS", "RECEPTION"]) BGS[k] = PUP + `BG-${k}.jpg`;
PSY.setup({ man: window.CUT_MANIFEST, cut: PUP + "cut/", bg: BGS,
  layout: { MID: [950, 0, 24, 1080] },
  allow: [["MID", "WORLD"], ["MID", "HEAD"], ["MID", "LOW"], ["MID", "LIST"]] });
const { shot, world, cam, actor, moves, bubble, label, list, show, hide, pop, squash, breathe, spr } = PSY;
const RD = PSY.RD, TL = PSY.TL, YL = PSY.YL;
const B = n => Math.max(0, S(n) - 0.25);
const NIGHT = "rgba(14,20,60,.45)";

/* 자리 표 [발 x, 발 y, 배율] — 세계 좌표 (배경 1920×1080) */
const SP = {
  OFF_A: [860, 905, 0.8],      // A씨 사무실 의자 (배경 의자 자리 x 860)
  OFF_T: [1360, 1010, 0.72],   // 팀장 (선 자세)
  LIV_B: [1400, 880, 0.72],    // B씨 거실 소파 오른쪽 끝 (앉은 자세)
  LIV_W: [560, 1005, 0.74],    // 아내 (선 자세)
  LIV_BS: [1250, 1005, 0.74],  // B씨 거실 (선 자세)
  BED_A: [880, 700, 0.7],      // A씨 침대 위 (책상다리)
  BED_A2: [1120, 1005, 0.74],  // A씨 침실 (선 자세)
  CL_D: [1700, 965, 0.78], CL_A: [760, 985, 0.78],          // 진료실
  RR_A: [960, 1010, 0.8],                                    // 화장실 세면대 앞
  MT_A: [560, 1000, 0.8], MT_T: [1480, 1000, 0.8],          // 회의실
  RM_B: [1640, 900, 0.78],                                   // B씨 침실 침대 끝
  VR_W: [1000, 1010, 0.8],                                   // 베란다
  BO_B: [420, 905, 0.8], BO_B2: [1380, 1010, 0.76],         // B씨 회사 책상 · 게시판 앞
  PB_F: [620, 965, 0.78], PB_B: [1320, 965, 0.78],          // 술집 의자 두 개
  PD_S: [700, 1010, 0.7], PD_B: [1080, 1010, 0.76], PD_K: [1660, 990, 0.76],   // 소아청소년 진료실
  RC_B: [1100, 1010, 0.78],                                  // 접수대 앞
};
const at = (W_, keys, p, opt) => actor(W_, keys, p[0], p[1], p[2], opt);

/* ─────── 반반 화면: 왼쪽 A씨 · 오른쪽 B씨 — 배경의 [ox, ox+960] 만 보임 ─────── */
function half(a, b, bg, side, ox, opt) {
  const W_ = world(a, b, bg, opt);
  gsap.set(W_.sc, { x: (side === "L" ? 0 : 960) - ox });
  W_.sc.style.clipPath = `inset(0 ${1920 - ox - 960}px 0 ${ox}px)`;
  W_.ox = ox; W_.side = side;
  return W_;
}
function over(a, b) {                     // 반반 화면 위 글자 층 (자르지 않는 장면) + 가운데 흰 선
  const sc = K.scene(a, b + 0.4);
  K.el(`<div class="mid" data-slot="MID"></div>`, sc);
  return { sc };
}
function tagIn(W_, html, t, out, cls, y) {   // 반쪽 위 이름표 (세계 안 — 그 반쪽 가운데)
  const n = K.el(`<div class="tag ${cls || (W_.side === "L" ? "a" : "b")}">${html}</div>`, W_.L.fly);
  gsap.set(n, { x: W_.ox + 480, y: y == null ? 30 : y, xPercent: -50, opacity: 0 });
  tl.fromTo(n, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t);
  if (out) hide(n, out, 0.25);
  return n;
}
function clock(W_, x, y, size, t0, t1, turns, layer) {   // 바늘 없는 벽시계 그림 + 코드 바늘
  const L = layer || W_.L.fly;
  const c = spr(L, "PROPS-A-4", x, y, size);
  const hh = K.el(`<div class="hand" style="left:${x - 6}px;top:${y - size * 0.26}px;width:12px;height:${size * 0.26}px"></div>`, L);
  const mh = K.el(`<div class="hand" style="left:${x - 4}px;top:${y - size * 0.36}px;width:8px;height:${size * 0.36}px"></div>`, L);
  gsap.set([hh, mh], { opacity: 0 });
  for (const n of [c, hh, mh]) show(n, t0, 0.3);
  tl.fromTo(mh, { rotation: 0 }, { rotation: 360 * turns, duration: Math.max(0.3, t1 - t0), ease: "power1.in", immediateRender: false }, t0);
  tl.fromTo(hh, { rotation: 0 }, { rotation: 30 * turns, duration: Math.max(0.3, t1 - t0), ease: "power1.in", immediateRender: false }, t0);
  return [c, hh, mh];
}

/* ─────── 숫자 판 (코드 화면) ─────── */
function panel(a, b) {
  const sc = K.scene(a, b + 0.4);
  const p = K.el(`<div class="panel" data-slot="WORLD"></div>`, sc);
  return { sc, p };
}
function pt(p, y, html, size, t, out, cls) {
  const n = K.el(`<div class="t ${cls || ""}" style="top:${y}px;font-size:${size}px">${html}</div>`, p);
  gsap.set(n, { opacity: 0 });
  tl.fromTo(n, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
  if (out) hide(n, out, 0.3);
  return n;
}
function bar(p, x, y, w, h, color, t, dur) {
  const n = K.el(`<div class="bar" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${color}"></div>`, p);
  gsap.set(n, { scaleX: 0 });
  tl.fromTo(n, { scaleX: 0 }, { scaleX: 1, duration: dur || 0.9, ease: "power2.out", immediateRender: false }, t);
  return n;
}
function abs(p, html, x, y, cls, t, out) {
  const n = K.el(`<div class="${cls}" style="left:${x}px;top:${y}px">${html}</div>`, p);
  gsap.set(n, { opacity: 0 });
  show(n, t, 0.3);
  if (out) hide(n, out, 0.3);
  return n;
}
