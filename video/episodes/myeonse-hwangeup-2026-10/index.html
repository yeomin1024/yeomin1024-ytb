<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"myeonse-hwangeup-2026-10","topic":"test","duration":479.08,"audio":null,"thumb":null,"estimated":true,"est_model":{"perSyl":0.151,"comma":0.25,"base":-0.08,"min":0.8,"lead":0.3,"gap":0.45,"part":1,"tail":0.8},"synced":"2026-10-24T04:16:03Z","sent":[{"n":1,"part":"도입","text":"11월 1일부터 일본의 외국인 여행자 면세 방식이 바뀝니다.","start":0.3,"end":3.995},{"n":2,"part":"도입","text":"지금처럼 매장 계산대에서 바로 면세해 주는 방식은 사라집니다.","start":4.445,"end":8.291},{"n":3,"part":"도입","text":"대신 출국할 때 공항에서 세관 확인을 받아야, 낸 세금을 돌려받는 방식으로 바뀝니다.","start":8.741,"end":14.045},{"n":4,"part":"도입","text":"이렇게 바뀌면 이런 걱정이 들 수 있습니다.","start":14.495,"end":16.982},{"n":5,"part":"도입","text":"살 때 세금까지 다 내야 하니 부담스럽지 않을까?","start":17.432,"end":20.221},{"n":6,"part":"도입","text":"공항에 수속하는 사람이 몰려서 줄만 길어지는 건 아닐까?","start":20.671,"end":24.064},{"n":7,"part":"도입","text":"확인을 놓치면 낸 세금을 그냥 날리는 건 아닐까?","start":24.514,"end":27.303},{"n":8,"part":"도입","text":"결국 면세를 안 해 주려고 일부러 번거롭게 만든 건 아닐까?","start":27.753,"end":31.146},{"n":9,"part":"도입","text":"이 걱정들이 정말 맞는지, 바뀐 면세의 단점과 장점부터 하나씩 따져 보겠습니다.","start":31.596,"end":36.598},{"n":10,"part":"첫째, 바뀐 면세의 장단점","text":"단점부터 보겠습니다.","start":37.598,"end":38.877},{"n":11,"part":"첫째, 바뀐 면세의 장단점","text":"첫째, 살 때 세금까지 먼저 다 내야 합니다.","start":39.327,"end":41.913},{"n":12,"part":"첫째, 바뀐 면세의 장단점","text":"11월부터는 매장에서 여권을 보여 주고, 소비세를 포함한 가격으로 결제합니다.","start":42.363,"end":47.516},{"n":13,"part":"첫째, 바뀐 면세의 장단점","text":"예를 들어 세금 포함 1만 1천 엔짜리를 사면, 그중 1천 엔이 나중에 돌려받을 소비세예요.","start":47.966,"end":53.572},{"n":14,"part":"첫째, 바뀐 면세의 장단점","text":"돌려받는 방법은 카드, 계좌 송금, 앱, 공항 현금 등 매장마다 다릅니다.","start":54.022,"end":58.769},{"n":15,"part":"첫째, 바뀐 면세의 장단점","text":"일본 정부는 수수료를 받지 않지만, 환급 업체의 수수료는 법으로 정해져 있지 않습니다.","start":59.219,"end":64.674},{"n":16,"part":"첫째, 바뀐 면세의 장단점","text":"그래서 수수료를 떼고 나면, 돌려받는 돈이 낸 세금보다 적을 수 있습니다.","start":65.124,"end":69.673},{"n":17,"part":"첫째, 바뀐 면세의 장단점","text":"둘째, 공항에서 할 일이 하나 늘어납니다.","start":70.123,"end":72.709},{"n":18,"part":"첫째, 바뀐 면세의 장단점","text":"출국하는 날에는 공항 출발 로비의 면세 수속 단말기에 여권을 대야 합니다.","start":73.159,"end":77.609},{"n":19,"part":"첫째, 바뀐 면세의 장단점","text":"화면에 초록색이 뜨면 확인이 끝나요.","start":78.059,"end":80.244},{"n":20,"part":"첫째, 바뀐 면세의 장단점","text":"빨간색이 뜨면 세관 검사장에서 산 물건을 직접 보여 줘야 합니다.","start":80.694,"end":84.54},{"n":21,"part":"첫째, 바뀐 면세의 장단점","text":"그래서 걱정처럼 단말기 앞에 줄이 길어질 수 있습니다.","start":84.99,"end":88.232},{"n":22,"part":"첫째, 바뀐 면세의 장단점","text":"정해진 기준 시간은 없고, 관광청은 시간에 여유를 두고 공항에 오라고 안내합니다.","start":88.682,"end":93.835},{"n":23,"part":"첫째, 바뀐 면세의 장단점","text":"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않는다고 밝혔습니다.","start":94.285,"end":99.438},{"n":24,"part":"첫째, 바뀐 면세의 장단점","text":"셋째, 놓치면 환급을 못 받는 세 가지가 있습니다.","start":99.888,"end":102.927},{"n":25,"part":"첫째, 바뀐 면세의 장단점","text":"하나, 짐을 맡기기 전에 세관 확인을 받아야 합니다.","start":103.377,"end":106.567},{"n":26,"part":"첫째, 바뀐 면세의 장단점","text":"산 물건을 캐리어에 넣어 먼저 부치면, 확인을 받을 수 없고 되찾아 올 수도 없습니다.","start":107.017,"end":112.17},{"n":27,"part":"첫째, 바뀐 면세의 장단점","text":"둘, 확인은 영수증 단위로 합니다.","start":112.62,"end":114.753},{"n":28,"part":"첫째, 바뀐 면세의 장단점","text":"한 영수증에 든 물건 가운데 하나라도 없으면, 그 영수증 전체가 환급되지 않습니다.","start":115.203,"end":120.356},{"n":29,"part":"첫째, 바뀐 면세의 장단점","text":"일본에서 먹거나 써 버린 물건도 환급받을 수 없어요.","start":120.806,"end":123.897},{"n":30,"part":"첫째, 바뀐 면세의 장단점","text":"셋, 산 날부터 90일 안에 출국하면서 확인을 받아야 합니다.","start":124.347,"end":128.141},{"n":31,"part":"첫째, 바뀐 면세의 장단점","text":"그럼 이런 불편에 대한 대책은 있을까요?","start":128.591,"end":130.927},{"n":32,"part":"첫째, 바뀐 면세의 장단점","text":"나리타, 하네다, 간사이 등 일곱 개 공항에서는 휴대전화로도 수속할 수 있습니다.","start":131.377,"end":136.629},{"n":33,"part":"첫째, 바뀐 면세의 장단점","text":"공항 안 전용 와이파이 구역에서 비지트 재팬 웹에 접속하는 방식이에요.","start":137.079,"end":141.378},{"n":34,"part":"첫째, 바뀐 면세의 장단점","text":"업계 보도에 따르면, 하네다·나리타·나하 공항에는 현금 환급 단말기도 생깁니다.","start":141.828,"end":146.83},{"n":35,"part":"첫째, 바뀐 면세의 장단점","text":"약 1분이면 엔화 현금으로 받을 수 있다는 설명입니다.","start":147.28,"end":150.522},{"n":36,"part":"첫째, 바뀐 면세의 장단점","text":"다만 줄이 실제로 얼마나 길어질지는 11월이 지나야 알 수 있습니다.","start":150.972,"end":155.12},{"n":37,"part":"첫째, 바뀐 면세의 장단점","text":"그렇다면 바뀐 면세는 불편해지기만 하는 걸까요?","start":155.57,"end":158.51},{"n":38,"part":"첫째, 바뀐 면세의 장단점","text":"꼭 그렇지는 않습니다, 오히려 지금보다 편해지는 점도 있거든요.","start":158.96,"end":163.056},{"n":39,"part":"첫째, 바뀐 면세의 장단점","text":"같은 매장에서 하루에 세금 빼고 5,000엔 이상 사야 한다는 기준은 그대로입니다.","start":163.506,"end":168.508},{"n":40,"part":"첫째, 바뀐 면세의 장단점","text":"대신 과자나 화장품 같은 소모품과, 옷이나 가전 같은 일반 물품의 구분이 사라집니다.","start":168.958,"end":174.262},{"n":41,"part":"첫째, 바뀐 면세의 장단점","text":"그래서 둘을 합쳐 5,000엔 이상이면 돼요.","start":174.712,"end":177.298},{"n":42,"part":"첫째, 바뀐 면세의 장단점","text":"소모품은 50만 엔까지만 면세되던 상한도 없어집니다.","start":177.748,"end":181.141},{"n":43,"part":"첫째, 바뀐 면세의 장단점","text":"소모품을 밀봉 봉투에 담아 주던 특수 포장도 사라지고요.","start":181.591,"end":184.984},{"n":44,"part":"첫째, 바뀐 면세의 장단점","text":"다만 한 개에 세금 빼고 100만 엔 이상이면, 시리얼 번호 같은 정보를 남깁니다.","start":185.434,"end":190.134},{"n":45,"part":"첫째, 바뀐 면세의 장단점","text":"그런데 여행자에게 이렇게 손이 더 가는 방식을, 일본은 왜 굳이 골랐을까요?","start":190.584,"end":195.284},{"n":46,"part":"둘째, 왜 바꾸나","text":"일본 재무성은 면세로 산 물건을 일본 안에서 되파는 부정을 막기 위해서라고 설명합니다.","start":196.284,"end":201.64},{"n":47,"part":"둘째, 왜 바꾸나","text":"면세는 산 물건을 일본 밖으로 가지고 나간다는 조건으로 세금을 빼 주는 제도입니다.","start":202.09,"end":207.144},{"n":48,"part":"둘째, 왜 바꾸나","text":"그런데 가지고 나가지 않고, 일본 안에서 되파는 경우가 있었던 겁니다.","start":207.594,"end":211.992},{"n":49,"part":"둘째, 왜 바꾸나","text":"재무성이 2022년 4월부터 2년 동안의 면세 기록을 정리한 자료가 있습니다.","start":212.442,"end":217.496},{"n":50,"part":"둘째, 왜 바꾸나","text":"그 기간에 한 번 입국해 면세로 1억 엔 이상 산 사람이 690명이었습니다.","start":217.946,"end":222.547},{"n":51,"part":"둘째, 왜 바꾸나","text":"이들이 산 물건은 모두 2,332억 엔어치입니다.","start":222.997,"end":226.64},{"n":52,"part":"둘째, 왜 바꾸나","text":"그런데 이 가운데 10명 중 9명 가까이는, 출국할 때 세관이 물건을 확인하지 못했습니다.","start":227.09,"end":232.696},{"n":53,"part":"둘째, 왜 바꾸나","text":"세관 검사는 강제가 아니어서, 검사를 받지 않는다고 출국을 막을 수도 없었거든요.","start":233.146,"end":238.299},{"n":54,"part":"둘째, 왜 바꾸나","text":"세관이 확인한 사람들도 거의 모두 산 물건을 가지고 있지 않았습니다.","start":238.749,"end":242.897},{"n":55,"part":"둘째, 왜 바꾸나","text":"그래서 세금을 내라고 했지만, 거의 전부가 내지 않고 그냥 떠났습니다.","start":243.347,"end":247.745},{"n":56,"part":"둘째, 왜 바꾸나","text":"이미 세금을 빼고 팔았으니, 떠난 사람에게서 세금을 받아 낼 방법이 없었던 거죠.","start":248.195,"end":253.197},{"n":57,"part":"둘째, 왜 바꾸나","text":"새 방식은 거꾸로 세금을 먼저 받고, 가지고 나간 게 확인되면 돌려줍니다.","start":253.647,"end":258.196},{"n":58,"part":"둘째, 왜 바꾸나","text":"물건 없이 떠나면 처음부터 돌려받을 돈이 없으니, 이런 부정은 하기 어려워집니다.","start":258.646,"end":263.799},{"n":59,"part":"둘째, 왜 바꾸나","text":"그렇다면 이렇게 깐깐해진 면세가, 일본에는 정말 이득일까요?","start":264.249,"end":268.194},{"n":60,"part":"둘째, 왜 바꾸나","text":"여행자가 불편해서 덜 사면, 오히려 손해가 아닐까요?","start":268.644,"end":271.985},{"n":61,"part":"셋째, 실제 효과","text":"사실 일본 안에서도 의견이 갈립니다.","start":272.985,"end":275.17},{"n":62,"part":"셋째, 실제 효과","text":"자민당의 한 의원은 국회에서, 아예 외국인 면세를 없애자고 제안했습니다.","start":275.62,"end":280.32},{"n":63,"part":"셋째, 실제 효과","text":"세금을 더 걷고 부정도 막자는 이유였어요.","start":280.77,"end":283.257},{"n":64,"part":"셋째, 실제 효과","text":"하지만 당시 재무상은, 새 환급 방식이면 부정을 막을 수 있다며 맞섰습니다.","start":283.707,"end":288.407},{"n":65,"part":"셋째, 실제 효과","text":"반대로 백화점과 면세점 등 업계 단체들은, 면세를 없애면 오히려 손해라고 주장합니다.","start":288.857,"end":294.312},{"n":66,"part":"셋째, 실제 효과","text":"면세가 없어지면 관광객 소비가 약 1조 4,304억 엔 줄어든다는 추산입니다.","start":294.762,"end":299.915},{"n":67,"part":"셋째, 실제 효과","text":"면세가 관광객이 일본에서 지갑을 여는 큰 이유라는 거죠.","start":300.365,"end":303.758},{"n":68,"part":"셋째, 실제 효과","text":"그럼 면세를 없애지 않고 방식만 바꾸는 이번 변화는 어떨까요?","start":304.208,"end":307.903},{"n":69,"part":"셋째, 실제 효과","text":"미즈호은행 보고서는 오히려 면세 시장이 커질 수 있다고 봤습니다.","start":308.353,"end":312.35},{"n":70,"part":"셋째, 실제 효과","text":"2024년 약 1조 2천억 엔에서 1조 7천억 엔 정도로 늘 수 있다는 전망입니다.","start":312.8,"end":317.854},{"n":71,"part":"셋째, 실제 효과","text":"여행자는 조금 불편해져도, 구매 상한이 없어지고 면세 가게가 늘 것으로 봤기 때문입니다.","start":318.304,"end":323.91},{"n":72,"part":"셋째, 실제 효과","text":"반대로 비슷한 고민 끝에, 아예 면세를 없앤 나라도 있습니다.","start":324.36,"end":328.154},{"n":73,"part":"셋째, 실제 효과","text":"영국은 2021년 1월, 관광객에게 부가세를 돌려주던 제도를 없앴습니다.","start":328.604,"end":333.606},{"n":74,"part":"셋째, 실제 효과","text":"영국 정부는 유지 비용이 크고 경제 효과가 분명하지 않다고 설명했습니다.","start":334.056,"end":338.506},{"n":75,"part":"셋째, 실제 효과","text":"반면 소매업계는 씀씀이 큰 관광객이 프랑스, 이탈리아로 간다며 반발했습니다.","start":338.956,"end":343.958},{"n":76,"part":"셋째, 실제 효과","text":"정부는 세금이 더 걷혔다고 보고, 업계는 손해를 봤다고 맞서고 있습니다.","start":344.408,"end":348.957},{"n":77,"part":"셋째, 실제 효과","text":"일본의 이번 변화가 이득인지 손해인지는, 11월 이후 숫자가 나와야 알 수 있습니다.","start":349.407,"end":354.711},{"n":78,"part":"셋째, 실제 효과","text":"분명한 건, 일본은 면세를 없애는 대신 부정을 막는 쪽을 골랐다는 점입니다.","start":355.161,"end":359.861},{"n":79,"part":"셋째, 실제 효과","text":"그럼 다른 나라 여행자들은, 일본보다 편하게 세금을 돌려받고 있을까요?","start":360.311,"end":364.86},{"n":80,"part":"넷째, 우리나라와 다른 나라 비교","text":"먼저 싱가포르입니다.","start":365.86,"end":367.139},{"n":81,"part":"넷째, 우리나라와 다른 나라 비교","text":"같은 매장에서 100싱가포르달러 이상 사면, 세금을 돌려받을 수 있습니다.","start":367.589,"end":372.138},{"n":82,"part":"넷째, 우리나라와 다른 나라 비교","text":"단말기에 여권을 대는 방식은 일본과 같고, 부칠 짐이면 맡기기 전에 해야 합니다.","start":372.588,"end":377.59},{"n":83,"part":"넷째, 우리나라와 다른 나라 비교","text":"카드로 받으면 10일 안에 들어오지만, 수수료를 떼서 낸 세금보다 적을 수 있습니다.","start":378.04,"end":383.193},{"n":84,"part":"넷째, 우리나라와 다른 나라 비교","text":"프랑스는 한 매장에서 하루 100유로를 조금 넘게 사면 대상입니다.","start":383.643,"end":387.489},{"n":85,"part":"넷째, 우리나라와 다른 나라 비교","text":"여권만 대면 되는 일본과 달리, 매장에서 받은 면세 서류를 공항 단말기에 읽혀야 합니다.","start":387.939,"end":393.394},{"n":86,"part":"넷째, 우리나라와 다른 나라 비교","text":"호주는 한 사업자에게서 300호주달러 이상 사고, 출국 심사 뒤 공항 창구에서 신청합니다.","start":393.844,"end":399.45},{"n":87,"part":"넷째, 우리나라와 다른 나라 비교","text":"비행기 출발 30분 전까지 신청해야 하고, 현금으로는 돌려주지 않습니다.","start":399.9,"end":404.6},{"n":88,"part":"넷째, 우리나라와 다른 나라 비교","text":"그리고 영국처럼, 아예 세금을 돌려받을 수 없는 나라도 있습니다.","start":405.05,"end":409.146},{"n":89,"part":"넷째, 우리나라와 다른 나라 비교","text":"기간도 일본은 90일로, 싱가포르의 2개월이나 호주의 60일보다 깁니다.","start":409.596,"end":414.447},{"n":90,"part":"넷째, 우리나라와 다른 나라 비교","text":"떠날 때 확인받는 나라들과 비교하면, 일본의 새 방식이 특별히 더 불편한 편은 아닙니다.","start":414.897,"end":420.352},{"n":91,"part":"넷째, 우리나라와 다른 나라 비교","text":"그렇다면 우리나라는 외국인 관광객에게 어떻게 세금을 돌려주고 있을까요?","start":420.802,"end":425.403},{"n":92,"part":"넷째, 우리나라와 다른 나라 비교","text":"우리나라는 사후면세점에서 한 번에 1만 5천 원 이상 사면 대상입니다.","start":425.853,"end":430.152},{"n":93,"part":"넷째, 우리나라와 다른 나라 비교","text":"한 번에 100만 원 미만이면, 매장이 바로 세금을 뺀 값으로 팔 수 있어요.","start":430.602,"end":434.849},{"n":94,"part":"넷째, 우리나라와 다른 나라 비교","text":"이렇게 바로 빼 주는 금액은 입국 뒤 모두 합쳐 500만 원까지입니다.","start":435.299,"end":439.296},{"n":95,"part":"넷째, 우리나라와 다른 나라 비교","text":"그보다 크면, 산 날부터 3개월 안에 출국하면서 세관 확인을 받고 돌려받습니다.","start":439.746,"end":444.748},{"n":96,"part":"넷째, 우리나라와 다른 나라 비교","text":"일본이 없애는 매장 즉시 면세를, 우리나라는 금액 한도를 두고 남겨 둔 셈입니다.","start":445.198,"end":450.2},{"n":97,"part":"정리","text":"이렇게 바뀌는 일본 면세의 장단점과 이유, 다른 나라와의 차이에 대해 알아보았습니다.","start":451.2,"end":456.655},{"n":98,"part":"정리","text":"과연 이번 변화가 일본에 이득이 될까요?","start":457.105,"end":459.441},{"n":99,"part":"정리","text":"제 생각에는, 공항 줄을 얼마나 빨리 줄이느냐가 이득과 손해를 가를 것 같습니다.","start":459.891,"end":464.893},{"n":100,"part":"정리","text":"줄이 짧으면 부정도 막고 쇼핑객도 지키겠지만, 길면 지갑을 덜 열 수도 있으니까요.","start":465.343,"end":470.496},{"n":101,"part":"정리","text":"일본에서 쇼핑하신다면, 짐을 맡기기 전에 단말기부터 들르는 것만은 꼭 기억하세요.","start":470.946,"end":476.25},{"n":102,"part":"정리","text":"시청해주셔서 감사합니다.","start":476.7,"end":478.281}],"subs":[[0.3,3.995,"11월 1일부터 일본의 외국인 여행자 면세 방식이 바뀝니다."],[4.445,8.291,"지금처럼 매장 계산대에서 바로 면세해 주는 방식은 사라집니다."],[8.741,14.045,"대신 출국할 때 공항에서 세관 확인을 받아야,\n낸 세금을 돌려받는 방식으로 바뀝니다."],[14.495,16.982,"이렇게 바뀌면 이런 걱정이 들 수 있습니다."],[17.432,20.221,"살 때 세금까지 다 내야 하니 부담스럽지 않을까?"],[20.671,24.064,"공항에 수속하는 사람이 몰려서 줄만 길어지는 건 아닐까?"],[24.514,27.303,"확인을 놓치면 낸 세금을 그냥 날리는 건 아닐까?"],[27.753,31.146,"결국 면세를 안 해 주려고 일부러 번거롭게 만든 건 아닐까?"],[31.596,36.598,"이 걱정들이 정말 맞는지,\n바뀐 면세의 단점과 장점부터 하나씩 따져 보겠습니다."],[37.598,38.877,"단점부터 보겠습니다."],[39.327,41.913,"첫째, 살 때 세금까지 먼저 다 내야 합니다."],[42.363,47.516,"11월부터는 매장에서 여권을 보여 주고,\n소비세를 포함한 가격으로 결제합니다."],[47.966,53.572,"예를 들어 세금 포함 1만 1천 엔짜리를 사면,\n그중 1천 엔이 나중에 돌려받을 소비세예요."],[54.022,58.769,"돌려받는 방법은 카드, 계좌 송금, 앱, 공항 현금 등 매장마다 다릅니다."],[59.219,64.674,"일본 정부는 수수료를 받지 않지만,\n환급 업체의 수수료는 법으로 정해져 있지 않습니다."],[65.124,69.673,"그래서 수수료를 떼고 나면,\n돌려받는 돈이 낸 세금보다 적을 수 있습니다."],[70.123,72.709,"둘째, 공항에서 할 일이 하나 늘어납니다."],[73.159,77.609,"출국하는 날에는 공항 출발 로비의 면세\n수속 단말기에 여권을 대야 합니다."],[78.059,80.244,"화면에 초록색이 뜨면 확인이 끝나요."],[80.694,84.54,"빨간색이 뜨면 세관 검사장에서 산 물건을 직접 보여 줘야 합니다."],[84.99,88.232,"그래서 걱정처럼 단말기 앞에 줄이 길어질 수 있습니다."],[88.682,93.835,"정해진 기준 시간은 없고,\n관광청은 시간에 여유를 두고 공항에 오라고 안내합니다."],[94.285,99.438,"시간이 모자라 비행기를 놓쳐도,\n항공사나 세관은 보상하지 않는다고 밝혔습니다."],[99.888,102.927,"셋째, 놓치면 환급을 못 받는 세 가지가 있습니다."],[103.377,106.567,"하나, 짐을 맡기기 전에 세관 확인을 받아야 합니다."],[107.017,112.17,"산 물건을 캐리어에 넣어 먼저 부치면,\n확인을 받을 수 없고 되찾아 올 수도 없습니다."],[112.62,114.753,"둘, 확인은 영수증 단위로 합니다."],[115.203,120.356,"한 영수증에 든 물건 가운데 하나라도 없으면,\n그 영수증 전체가 환급되지 않습니다."],[120.806,123.897,"일본에서 먹거나 써 버린 물건도 환급받을 수 없어요."],[124.347,128.141,"셋, 산 날부터 90일 안에 출국하면서 확인을 받아야 합니다."],[128.591,130.927,"그럼 이런 불편에 대한 대책은 있을까요?"],[131.377,136.629,"나리타, 하네다,\n간사이 등 일곱 개 공항에서는 휴대전화로도 수속할 수 있습니다."],[137.079,141.378,"공항 안 전용 와이파이 구역에서\n비지트 재팬 웹에 접속하는 방식이에요."],[141.828,146.83,"업계 보도에 따르면,\n하네다·나리타·나하 공항에는 현금 환급 단말기도 생깁니다."],[147.28,150.522,"약 1분이면 엔화 현금으로 받을 수 있다는 설명입니다."],[150.972,155.12,"다만 줄이 실제로 얼마나 길어질지는 11월이 지나야 알 수 있습니다."],[155.57,158.51,"그렇다면 바뀐 면세는 불편해지기만 하는 걸까요?"],[158.96,163.056,"꼭 그렇지는 않습니다, 오히려 지금보다 편해지는 점도 있거든요."],[163.506,168.508,"같은 매장에서 하루에 세금 빼고\n5,000엔 이상 사야 한다는 기준은 그대로입니다."],[168.958,174.262,"대신 과자나 화장품 같은 소모품과,\n옷이나 가전 같은 일반 물품의 구분이 사라집니다."],[174.712,177.298,"그래서 둘을 합쳐 5,000엔 이상이면 돼요."],[177.748,181.141,"소모품은 50만 엔까지만 면세되던 상한도 없어집니다."],[181.591,184.984,"소모품을 밀봉 봉투에 담아 주던 특수 포장도 사라지고요."],[185.434,190.134,"다만 한 개에 세금 빼고 100만 엔 이상이면,\n시리얼 번호 같은 정보를 남깁니다."],[190.584,195.284,"그런데 여행자에게 이렇게 손이 더 가는 방식을,\n일본은 왜 굳이 골랐을까요?"],[196.284,201.64,"일본 재무성은 면세로 산 물건을 일본 안에서\n되파는 부정을 막기 위해서라고 설명합니다."],[202.09,207.144,"면세는 산 물건을 일본 밖으로 가지고\n나간다는 조건으로 세금을 빼 주는 제도입니다."],[207.594,211.992,"그런데 가지고 나가지 않고, 일본 안에서 되파는 경우가 있었던 겁니다."],[212.442,217.496,"재무성이 2022년 4월부터 2년 동안의\n면세 기록을 정리한 자료가 있습니다."],[217.946,222.547,"그 기간에 한 번 입국해 면세로\n1억 엔 이상 산 사람이 690
