// =====================================================================================================================

    ctx.setLineDash([18, 12]); ctx.lineWidth = 4; ctx.strokeStyle = YE; ctx.beginPath(); ctx.moveTo(X0, py(1)); ctx.lineTo(X0 + WW, py(1)); ctx.stroke(); ctx.setLineDash([]);
    const R = t < t91 ? R5 : R10, n = R.pts.length;
    const show = t < t91 ? clamp((t - t86) / 3.0, 0, 1) : clamp((t - t91) / 1.5, 0, 1);
    const bw = WW / n;
    ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = "#7F8BA3";
    let lastY = "";
    R.pts.forEach(([s], q) => { const y = s.slice(0, 4); if (y !== lastY && s.slice(5, 7) <= "02") { ctx.fillText(y, X0 + (q + 0.5) * bw + 30, Y0 + HH + 14); lastY = y; } });
    for (let q = 0; q < Math.floor(n * show); q++) {

    }
    if (t >= t89 && t < t91) { const q = R5.pts.findIndex(p => p[0] === R5.a_best_start); const p = R5.pts[q]; R2.pin(ctx, X0 + (q + 0.5) * bw, py(p[2] / p[1]), `${ymd(p[0]).slice(0, 7)}  ${SDX(p)}`, VI, clamp((t - t89) / 0.3, 0, 1), false, 36); }
    if (t >= t90 && t < t91) { const q = R5.pts.findIndex(p => p[0] === R5.b_best_start); const p = R5.pts[q]; R2.pin(ctx, X0 + (q + 0.5) * bw, py(p[2] / p[1]), `${ymd(p[0]).slice(0, 7)}  ×${f2(p[2] / p[1])}`, BL, clamp((t - t90) / 0.3, 0, 1), true, 36); }
    ctx.restore();

  const sc = K.scene(a - 0.1, b + 0.5);

    }

      R2.pin(ctx, ch.X(iS), ch.Y(VD.a[iS]), money(VF.at_schd_start.a), VI, u, false, 36, [60, 1320]);
      R2.pin(ctx, ch.X(iS), ch.Y(VD.b[iS]), money(VF.at_schd_start.b), BL, u, true, 36, [60, 1320]);
    }
    if (t >= t99 - 0.2) {
      R2.pin(ctx, ch.X(iE), ch.Y(VD.a[iE]), money(V.a_end), VI, clamp((t - t99 + 0.2) / 0.3, 0, 1) * al, false, 40, [60, 1320]);
      R2.pin(ctx, ch.X(iE), ch.Y(VD.b[iE]), money(V.b_end), BL, clamp((t - W("VYM 80만", "109만") + 0.2) / 0.3, 0, 1) * al, true, 40, [60, 1320]);
