:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --ink:#E6ECE9; --muted:#9AA8A3; --line:#2A3431;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;

.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}

  $("cards").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b || st.busy) return;
    const act = b.dataset.act, id = b.dataset.id, key = b.dataset.k;
    if (act === "open") { st.open = st.open === id + "|" + key ? null : id + "|" + key; renderCards(); const ta = $(`ta-${id}-${key}`); if (ta) ta.focus(); return; }
    if (act === "del") { st.delAsk = b.dataset.fid; renderCards(); return; }
    if (act === "delno") { st.delAsk = null; renderCards(); return; }
    st.busy = true; b.disabled = true;
    const t = T.find(x => x.id === id), now = new Date().toISOString();
    try {
      if (act === "save") {
        const v = ($(`ta-${id}-${key}`).value || "").trim(); if (!v) { st.busy = false; b.disabled = false; return; }
        await st.db.collection("feedback").add({ topic: id, batch: t.batch, field: key, text: v, createdAt: now, updatedAt: now, status: "new", reply: "" });
        st.open = null; toast("피드백을 저장했습니다");
      } else if (act === "delok") {
        await st.db.doc("feedback/" + b.dataset.fid).delete(); st.delAsk = null; toast("피드백을 삭제했습니다");
      } else if (act === "verdict") {
        await st.db.doc("verdicts/" + id).set({ id, batch: t.batch, verdict: b.dataset.v, note: "", updatedAt: now }); toast(VLAB[b.dataset.v] + "(으)로 저장했습니다");
      } else if (act === "unset") {
        await st.db.doc("verdicts/" + id).delete(); toast("평가를 지웠습니다");
      }
    } catch (err) { toast(err && err.code === "invalid_argument" ? "이 화면에서는 저장할 권한이 없습니다" : "저장하지 못했습니다. 다시 눌러 주세요."); }
    st.busy = false; renderAll();
  });

  renderAll();
  (async () => {
    const use = window.claude && window.claude.use ? n => window.claude.use(n) : () => Promise.resolve(null);
    let db = null, user = null;
    try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (e) { db = null; }
    if (!db) { $("status").className = "status bad"; $("status-t").textContent = "저장소에 연결하지 못했습니다 — 주제는 볼 수 있지만 평가·피드백은 저장되지 않습니다."; return; }
    st.db = db;
    try { if (user && user.can && (await user.can("data.write")) === false) st.canWrite = false; } catch (e) { /* 모름 */ }
    $("status").className = "status " + (st.canWrite ? "ok" : ""); $("status-t").textContent = st.canWrite ? "저장소 연결됨 — 평가·피드백은 바로 저장되고 Claude 가 읽습니다." : "보기 전용 — 이 화면에서는 저장할 수 없습니다.";
    db.collection("verdicts").onSnapshot(s => { st.verdicts = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, () => {});
    db.collection("feedback").onSnapshot(s => { st.fb = s.docs.map(d => Object.assign({ id: d.id }, d.data())); if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") renderAll(); }, () => {});
    renderAll();
  })();
})();
</script>
