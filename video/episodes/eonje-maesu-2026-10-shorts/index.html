  const leg = el(`<div class="a cx row" style="left:${CX}px;top:1240px;gap:40px;font:900 44px/1 'Noto Sans KR'"><span class="row" style="gap:12px"><span style="display:inline-block;width:70px;height:7px;border-radius:4px;background:${WH}"></span>SPY</span><span class="row" style="gap:12px"><span style="display:inline-block;width:70px;height:7px;border-radius:4px;background:${YE}"></span><span style="color:${YE}">20</span></span><span class="row" style="gap:10px">${IC.up(46, MI)}${BUY}</span></div>`, sc);

  const wc = windowChart({ from: "2016-01-04", to: "2016-07-29", x: 140, y: 470, w: 740, h: 640 });
  const pace = R2.warp([[a + 0.2, wc.i0], [b - 0.2, wc.i1]], "쇼츠 SPY 2016", 400);
  add(a - 0.3, b, t => { wc.draw(pace(t), clamp((t - a + 0.3) / 0.35, 0, 1) * clamp((b - t) / 0.3, 0, 1));
    ctx.font = `900 60px ${R2.FONT}`; ctx.fillStyle = WH; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.globalAlpha = clamp((t - a) / 0.3, 0, 1) * clamp((b - t) / 0.3, 0, 1);
    ctx.fillText(ymd(Math.floor(pace(t))), 64, 395); ctx.globalAlpha = 1; });
  K.cut(E(A2) - 0.2, "SPY · 20일 평균 · BUY");
}

// 3. 규칙 (s3): 실제 거래 둘 — 왼쪽 +5% 먼저 ✓ (2016.07.01 매수) · 오른쪽 −2% 먼저 ✗ (2021.12.08 매수)
{ const a = S(A3), b = S(A4) - 0.1, sc = K.scene(a - 0.3, b);
  const TW = X.trades.find(t => AN.dates[t.b] === "2016-07-01"), TL = X.trades.find(t => AN.dates[t.b] === "2021-12-08");
  if (!TW || TW.res !== "w" || !TL || TL.res !== "l") throw new Error("규칙 예시 거래가 anim.js 와 다름");
  const tW = W(A3, "성공"), tL = W(A3, "실패");
  const panel = (T, x, t0, t1) => {
    const i0 = Math.max(0, T.b - 6), i1 = T.h + 4;
    let lo = T.sl, hi = T.tg; for (let i = i0; i <= i1; i++) { lo = Math.min(lo, AN.close[i]); hi = Math.max(hi, AN.close[i]); }
    const ch = new R2.Chart({ x, y: 560, w: 380, h: 560, n: N, xFrom: i0, xTo: i1, mode: "lin", min: lo - (hi - lo) * 0.08, max: hi + (hi - lo) * 0.12, grid: false, series: [{ vals: AN.close, color: WH, width: 5 }] });
    const pace = R2.warp([[t0, T.b], [t1, T.h]], "쇼츠 규칙 예", 200);
    return { ch, T, pace, t1, i0, i1 };
  };
  const P = [panel(TW, 80, a + 0.1, tW + 0.2), panel(TL, 540, W(A3, "2%") - 0.2, tL + 0.2)];
  add(a - 0.3, b, t => {
    const al = clamp((t - a + 0.3) / 0.35, 0, 1) * clamp((b - t) / 0.3, 0, 1);
    P.forEach(({ ch, T, pace, t1, i0, i1 }, j) => {
      const on = j === 0 ? 1 : clamp((t - (W(A3, "2%") - 0.5)) / 0.3, 0, 1);
      if (on <= 0) return;
      ctx.save(); ctx.globalAlpha = al * on;
      ctx.fillStyle = "rgba(255,255,255,.04)"; R2.rr(ctx, ch.x - 20, ch.y - 90, ch.w + 40, ch.h + 140, 24); ctx.fill();
      const d = Math.max(i0, pace(t));
      ch.draw(ctx, Math.min(d, i1), { noHeads: false });
      const xb = ch.X(T.b), x1 = ch.x + ch.w;
      hline(xb, x1, ch.Y(T.tg), MI); hline(xb, x1, ch.Y(T.sl), RD);
      hline(ch.x, x1, ch.Y(T.bp), "rgba(201,210,226,.35)", [4, 8]);
      ctx.font = `900 44px ${R2.FONT}`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillStyle = MI; ctx.fillText("+5%", ch.x, ch.Y(T.tg) - 34);
      ctx.fillStyle = "#FF6B78"; ctx.fillText("−2%", ch.x, ch.Y(T.sl) + 36);
      tri(xb, ch.Y(T.bp) + 28, 15, MI);
      ctx.font = `900 34px ${R2.FONT}`; ctx.fillStyle = "#03231A"; ctx.textAlign = "center";
      ctx.fillStyle = MI; R2.rr(ctx, xb - 46, ch.Y(T.bp) + 50, 92, 44, 10); ctx.fill(); ctx.fillStyle = "#03231A"; ctx.fillText("BUY", xb, ch.Y(T.bp) + 73);
      if (t >= t1) { const u = clamp((t - t1) / 0.25, 0, 1); ctx.globalAlpha = al * on * u;
        T.res === "w" ? check(ch.X(T.h), ch.Y(T.tg) - 70, 90) : xmark(ch.X(T.h), ch.Y(T.sl) + 72, 80); }
      ctx.font = `700 34px ${R2.FONT}`; ctx.fillStyle = GR; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.globalAlpha = al * on;
      ctx.fillText(ymd(T.b).slice(0, 7), ch.x + ch.w / 2, ch.y + ch.h + 6);
      ctx.restore();
    });
  });
  K.cut(tW + 0.6, "규칙: +5% 먼저 ✓");
  K.cut(E(A3) - 0.1, "규칙: −2% 먼저 ✗");
}

// 4. 2021.12 — 20일 평균 돌파 64.7% vs 무작위 계좌 2,000개 평균 51.8% (s4)
{ const a = S(A4), b = S(A5) - 0.1, sc = K.scene(a - 0.3, b);
  const dt = el(`<div class="a cx row" style="left:${CX}px;top:300px;gap:20px">${IC.cal(70)}<span class="big tab" style="font-size:80px">2021.12</span></div>`, sc);
  pop(dt, a);
  const cL = el(`<div class="card2" style="left:70px;top:470px;width:400px;height:640px;display:grid;justify-items:center;align-content:center;gap:40px"><span class="row" style="gap:14px;font:900 64px/1 'Noto Sans KR'">${SIG20(70)}${BUY}</span><span class="big tab" style="font-size:120px;color:${MI}">${rt(rateAt(iDec))}</span></div>`, sc);
  pop(cL, a + 0.1);
  const cR = el(`<div class="card2" style="left:520px;top:470px;width:400px;height:640px;display:grid;justify-items:center;align-content:center;gap:40px"><span class="row" style="gap:14px">${IC.dice(84)}<span class="big tab" style="font-size:60px">× 2,000</span></span><span class="big tab" style="font-size:120px;color:#C9D2E2">${rt(rndAt(iDec))}</span></div>`, sc);
  pop(cR, W(A4, "무작위로"));
  tl.fromTo(cR.lastElementChild, { opacity: 0 }, { opacity: 1, duration: 0.3 }, W(A4, "51.8%") - 0.1);
  K.cut(E(A4) - 0.15, "2021.12 64.7% vs 무작위 51.8%");
}

// 5·6. 연속 — 2016.07~2018.01 ✓×5 (s5) · 2021.12~2022.07 ✗×6 (s6). 위 = 그날까지 성공률(초록) · 무작위 평균(회색)
function streakScene(a, b, from, to, res, n, name, word) {
  const sc = K.scene(a - 0.3, b);
  const ic = el(`<div class="a row" style="left:70px;top:390px;gap:14px;font:900 50px/1 'Noto Sans KR'">${SIG20(58)}${BUY}</div>`, sc);
  const dc = el(`<div class="a row" style="left:600px;top:384px;gap:14px">${IC.dice(64)}</div>`, sc);
  pop(ic, a); pop(dc, a + 0.1);
  const wc = windowChart({ from, to, x: 140, y: 560, w: 740, h: 560 });
  const tr = X.trades.filter(t => t.h != null && AN.dates[t.b] >= from && AN.dates[t.h] <= to && t.res === res);
  if (tr.length !== n) throw new Error(`${name}: 연속 ${n}번이 아님 (${tr.length})`);
  const tEnd = W(SN(word).text, word === A5 ? "성공하기도" : "실패했습니다") + 0.1;
  const pace = R2.warp([[a + 0.25, wc.i0], [tEnd, wc.i1]], name, 260);
  add(a - 0.3, b, t => {
    const al = clamp((t - a + 0.3) / 0.35, 0, 1) * clamp((b - t) / 0.3, 0, 1);
    const d = pace(t), k = Math.floor(d);
    wc.draw(d, al);
    ctx.save(); ctx.globalAlpha = al;
    ctx.font = `900 60px ${R2.FONT}`; ctx.fillStyle = WH; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(ymd(k), 64, 272);
    ctx.font = `900 72px ${R2.FONT}`; ctx.textBaseline = "middle";
    ctx.fillStyle = MI; ctx.fillText(rt(rateAt(k)), 345, 422);
    ctx.fillStyle = "#C9D2E2"; ctx.fillText(rt(rndAt(k)), 684, 422);
    // 연속 줄: 판정 난 것만 ✓/✗
    const done = tr.filter(x => x.h <= k).length, gap = 150, x0 = CX - (n - 1) * gap / 2;
    for (let j = 0; j < n; j++) {
      const x = x0 + j * gap, y = 1240;
      ctx.globalAlpha = al * (j < done ? 1 : 0.18);
      ctx.fillStyle = "rgba(255,255,255,.06)"; R2.rr(ctx, x - 62, y - 62, 124, 124, 26); ctx.fill();
      res === "w" ? check(x, y, 80) : xmark(x, y, 72);
    }
    ctx.restore();
  });
  return sc;
}
streakScene(S(A5), S(A6) - 0.1, "2016-06-15", "2018-01-31", "w", 5, "쇼츠 ✓×5", A5);
K.cut(E(A5) - 0.15, "2016.07~2018.01 ✓×5");
streakScene(S(A6), S(A7) - 0.1, "2021-11-22", "2022-07-15", "l", 6, "쇼츠 ✗×6", A6);   // 7.12 여섯 번째 실패에서 끝 (7.28 성공은 대본 밖)
K.cut(E(A6) - 0.15, "2021.12~2022.07 ✗×6 (64.7% → 55.0%)");

// 7·8. 매수 신호 10가지 (s7) → 10가지 ＞ 무작위 ? · 2016 → 2026 (s8)
{ const a = S(A7), b = S(A9) - 0.1, sc = K.scene(a - 0.3, b);
  const top = el(`<div class="a cx row" style="left:${CX}px;top:300px;gap:20px"><span class="big tab" style="font-size:76px">10 ×</span>${BUY}</div>`, sc);
  pop(top, a);
  const boxes = AN.order.map((k, i) => {
    const col = i % 2, r = Math.floor(i / 2);
    const [icon, lab] = SIGS[k];
    const n = el(`<div class="sig${k === "x20" ? " hi" : ""}" style="left:${70 + col * 440}px;top:${440 + r * 136}px"><span class="badge2">${i + 1}</span>${icon(50)}<span class="tab">${lab}</span><span class="q" style="margin-left:auto;color:${YE};font-size:56px;opacity:0">?</span></div>`, sc);
    pop(n, a + 0.15 + i * 0.12);
    return n;
  });
  // RSI·VIX 를 말할 때 그 칸을 밝힘
  [["rsi40", "RSI"], ["vix20", "VIX처럼"]].forEach(([k, w]) => tl.fromTo(boxes[AN.order.indexOf(k)], { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, W(A7, w)));
  K.cut(E(A7) - 0.15, "매수 신호 10가지");
  // s8: 위 줄 → 2016 → 2026 · 아래: 10가지 ＞ 무작위 ? · 칸마다 ?
  const t8 = S(A8);
  tl.to(top, { opacity: 0, duration: 0.3 }, t8 - 0.2);
  const yr = el(`<div class="a cx big tab" style="left:${CX}px;top:296px;font-size:80px">2016 → <span style="color:${YE}">2026</span></div>`, sc);
  pop(yr, W(A8, "10년이"));
  const cmp = el(`<div class="a cx row" style="left:${CX}px;top:1150px;gap:26px"><span class="big tab" style="font-size:76px">10 ×</span>${BUY}<span class="big" style="font-size:90px">＞</span>${IC.dice(96)}<span class="big" style="font-size:110px;color:${YE}">?</span></div>`, sc);
  pop(cmp, W(A8, "무작위보다"));
  boxes.forEach((n, i) => tl.to(n.querySelector(".q"), { opacity: 1, duration: 0.25 }, W(A8, "나은") + i * 0.06));
  K.cut(E(A8) - 0.15, "10가지 ＞ 무작위 ? (2016 → 2026)");
}

// 9. 끝 화면 (s9) — 10가지 ＞ 무작위 ? · ⬇ (관련 동영상 링크 자리)
{ const a = S(A9), sc = K.scene(a - 0.3, K.D, { keep: true });
  el(`<div class="veil"></div>`, sc);
  const icons = el(`<div class="a cx row" style="left:${CX}px;top:310px;gap:30px 34px;flex-wrap:wrap;justify-content:center;width:640px">${AN.order.map(k => SIGS[k][0](84)).join("")}</div>`, sc);
  pop(icons, a);
  const cmp = el(`<div class="a cx row" style="left:${CX}px;top:600px;gap:26px">${BUY}<span class="big" style="font-size:90px">＞</span>${IC.dice(96)}<span class="big" style="font-size:110px;color:${YE}">?</span></div>`, sc);
  pop(cmp, a + 0.2);
  const yr = el(`<div class="a cx big tab" style="left:${CX}px;top:820px;font-size:90px">2016 → 2026</div>`, sc);
  pop(yr, W(A9, "결과는"));
  const ar = el(`<svg class="arrow" viewBox="0 0 120 160" width="140" height="186" style="left:${CX - 70}px;top:1200px" aria-hidden="true">
    <path d="M60 6 L60 120 M14 78 L60 124 L106 78" fill="none" stroke="${YE}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>`, sc);
  pop(ar, W(A9, "아래"));
  tl.fromTo(ar, { y: 0 }, { y: 50, duration: 0.45, ease: "sine.inOut", repeat: 7, yoyo: true }, W(A9, "아래") + 0.6);
  K.cut(E(A9) - 0.1, "끝 화면 ⬇");
}

K.done();
})();
</script>
