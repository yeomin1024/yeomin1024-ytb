<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"gongpo-test-2026-11","topic":"stock","duration":511.95,"audio":"../../../stock/source/gongpo-test-2026-11/narration.mp3","thumb":null,"synced":"2026-11-04T16:32:06Z","tts":"2026-11-04T16:02:41","script_sha1":"86d5fd5eaeeefda9","sent":[{"n":1,"part":"도입","text":"폭락장에서 계좌를 가르는 건 공포를 느끼느냐가 아니라, 계획이 있느냐입니다.","start":0.3,"end":4.801},{"n":2,"part":"도입","text":"정씨도 폭락이 오면 사려고 현금을 남기고, 매수 계획까지 적어 둔 사람인데요.","start":5.181,"end":9.892},{"n":3,"part":"도입","text":"그런데 막상 폭락이 오자, 계획 대신 공포를 따랐습니다.","start":10.272,"end":13.875},{"n":4,"part":"도입","text":"그 결과 4년 뒤, 1억 원은 3천5백만 원 남짓만 남았습니다.","start":14.255,"end":18.279},{"n":5,"part":"도입","text":"지수는 그 폭락을 딛고, 같은 4년 동안 40% 넘게 올랐는데 말이죠.","start":18.659,"end":23.493},{"n":6,"part":"도입","text":"공포 앞에서 정씨가 내린 다섯 번의 결정을, 당신이라면 어떻게 했을지 골라 보세요.","start":23.873,"end":29.103},{"n":7,"part":"도입","text":"공포에 진 결정이 몇 개인지 세어 두시면 됩니다.","start":29.483,"end":32.438},{"n":8,"part":"도입","text":"공포가 처음 덮친 그날, 정씨의 자리에 당신이 서 보겠습니다.","start":32.818,"end":36.834},{"n":9,"part":"선택 1","text":"당신에게는 5년 넘게 쓸 일이 없는 1억 원이 있습니다.","start":37.834,"end":41.114},{"n":10,"part":"선택 1","text":"지수가 사상 최고가이던 날, 당신은 6천만 원을 S&P 500 지수에 넣었습니다.","start":41.495,"end":46.633},{"n":11,"part":"선택 1","text":"나머지 4천만 원은, 폭락이 오면 사려고 현금으로 남겼는데요.","start":47.013,"end":51.053},{"n":12,"part":"선택 1","text":"얼마나 떨어지면 얼마씩 살지, 매수 계획도 적어 두었습니다.","start":51.433,"end":54.89},{"n":13,"part":"선택 1","text":"두 달 뒤, 전쟁 소식에 지수가 최고가보다 12% 넘게 하락했습니다.","start":55.27,"end":59.929},{"n":14,"part":"선택 1","text":"미국 주식이 얼마나 출렁일지 보여 주는 지수를, 공포 지수라고 부릅니다.","start":60.309,"end":64.781},{"n":15,"part":"선택 1","text":"그 공포 지수가, 평소의 두 배 가까운 36까지 치솟았습니다.","start":65.161,"end":69.329},{"n":16,"part":"선택 1","text":"넣은 6천만 원은 5천2백만 원대로 줄었고, 뉴스엔 더 떨어진다는 전망뿐입니다.","start":69.709,"end":74.807},{"n":17,"part":"선택 1","text":"이 순간 당신은 더 잃기 전에 모두 매도하고, 공포가 가라앉으면 다시 매수하시겠습니까?","start":75.187,"end":80.91},{"n":18,"part":"선택 1","text":"아니면 매도하지 않고, 적어 둔 매수 계획을 꺼내 보시겠습니까?","start":81.29,"end":84.989},{"n":19,"part":"선택 1","text":"선택해 보세요.","start":85.369,"end":86.309},{"n":20,"part":"선택 1","text":"3, 2, 1.","start":86.689,"end":88.869},{"n":21,"part":"선택 1","text":"이 상황에서는 매도하지 않고 적어 둔 매수 계획을 꺼내 보는 것이 옳은 선택입니다.","start":89.249,"end":94.256},{"n":22,"part":"선택 1","text":"그때가 2022년 3월 7일, 러시아가 우크라이나를 침공한 지 열하루 뒤였습니다.","start":94.636,"end":100.011},{"n":23,"part":"선택 1","text":"정씨와 똑같이 모두 매도하고, 공포 지수가 20 아래로 내려오자 다시 샀다고 하겠습니다.","start":100.391,"end":105.766},{"n":24,"part":"선택 1","text":"그사이 지수가 9% 올라, 같은 돈으로 살 수 있는 주식은 8% 줄었을 것입니다.","start":106.146,"end":111.514},{"n":25,"part":"선택 1","text":"그래서 2025년 말까지도 58% 오르는 데 그쳤을 것입니다.","start":111.894,"end":116.125},{"n":26,"part":"선택 1","text":"매도하지 않았다면, 같은 때 72% 올랐을 겁니다.","start":116.505,"end":120.315},{"n":27,"part":"선택 1","text":"물론 그날 팔면, 그 뒤에 이어진 하락은 잠시 피할 수 있습니다.","start":120.695,"end":124.515},{"n":28,"part":"선택 1","text":"하지만 공포가 가라앉았다고 느낄 때는, 대개 값이 이미 올라 있습니다.","start":124.895,"end":129.274},{"n":29,"part":"선택 1","text":"1990년 이후 공포 지수가 35를 넘은 열일곱 번 중 열여섯 번이 그랬습니다.","start":129.654,"end":134.732},{"n":30,"part":"선택 1","text":"계획은 예를 들어 이렇습니다.","start":135.112,"end":136.94},{"n":31,"part":"선택 1","text":"최고가보다 10%, 15%, 20%, 25% 내려갈 때마다 현금의 4분의 1씩 삽니다.","start":137.32,"end":144.323},{"n":32,"part":"선택 1","text":"그러니 옳은 선택은 공포가 클수록 팔지 않고, 적어 둔 매수 계획을 꺼내는 것입니다.","start":144.703,"end":149.623},{"n":33,"part":"선택 2","text":"3주 뒤, 공포 지수가 평소 수준인 20 아래로 내려왔는데요.","start":150.623,"end":154.5},{"n":34,"part":"선택 2","text":"지수도 그사이 9% 가까이 반등했습니다.","start":154.88,"end":157.708},{"n":35,"part":"선택 2","text":"커뮤니티엔 빚을 내서 산 사람이 벌써 크게 벌었다는 인증 글이 올라옵니다.","start":158.088,"end":162.488},{"n":36,"part":"선택 2","text":"증권사 앱에는, 신용으로 돈을 빌려 더 살 수 있다는 안내가 뜹니다.","start":162.868,"end":167.059},{"n":37,"part":"선택 2","text":"이 순간 당신은 빚 없이, 투자용으로 정해 둔 돈 안에서만 매수하시겠습니까?","start":167.439,"end":172.355},{"n":38,"part":"선택 2","text":"아니면 신용으로 돈을 빌려, 더 많이 매수하시겠습니까?","start":172.735,"end":176.311},{"n":39,"part":"선택 2","text":"선택해 보세요.","start":176.691,"end":177.631},{"n":40,"part":"선택 2","text":"3, 2, 1.","start":178.011,"end":180.191},{"n":41,"part":"선택 2","text":"이 상황에서는 빚 없이 정해 둔 돈 안에서만 매수하는 것이 옳은 선택입니다.","start":180.571,"end":185.421},{"n":42,"part":"선택 2","text":"정씨와 똑같이 3월 28일 다시 사면서, 같은 금액을 신용으로 빌려 더 샀다고 하겠습니다.","start":185.801,"end":191.407},{"n":43,"part":"선택 2","text":"그 뒤 지수가 22% 하락하자, 빚까지 넣은 돈은 절반 가까이 줄었을 것입니다.","start":191.787,"end":197.276},{"n":44,"part":"선택 2","text":"빚이 없었다면, 같은 때 줄어든 돈은 21%였을 겁니다.","start":197.656,"end":201.663},{"n":45,"part":"선택 2","text":"빌린 돈 대비 주식 값도 151%까지 내려갔을 것입니다.","start":202.043,"end":205.903},{"n":46,"part":"선택 2","text":"증권사가 강제로 파는 140% 선의 바로 위죠.","start":206.283,"end":209.633},{"n":47,"part":"선택 2","text":"물론 지수가 오르기만 하면, 빌린 만큼 더 벌 수 있습니다.","start":210.013,"end":213.653},{"n":48,"part":"선택 2","text":"하지만 빚은 떨어질 때 손실을 두 배로 키우고, 이자는 하루도 빠짐없이 붙습니다.","start":214.033,"end":218.9},{"n":49,"part":"선택 2","text":"1990년 이후 하락장 네 번을 보면, 첫날 빚내 산 지수는 두 번 강제로 팔렸습니다.","start":219.28,"end":224.89},{"n":50,"part":"선택 2","text":"그러니 옳은 선택은 정해 둔 돈 안에서만 매수해, 더 떨어져도 버틸 힘을 남기는 것입니다.","start":225.27,"end":230.825},{"n":51,"part":"선택 3","text":"6주 뒤, 지수는 다시 최고가보다 17% 아래로 내려갔습니다.","start":231.825,"end":236.134},{"n":52,"part":"선택 3","text":"이때 코로나 백신으로 유명해진 한 제약사 주식은, 1년도 안 돼 72% 하락해 있었는데요.","start":236.514,"end":242.412},{"n":53,"part":"선택 3","text":"이렇게 싼 가격은 다시 없다며, 지금 사면 몇 배를 번다는 말이 돕니다.","start":242.792,"end":247.036},{"n":54,"part":"선택 3","text":"이 순간 당신은 이 종목은 매수하지 않고, 지수에 그대로 두시겠습니까?","start":247.416,"end":251.91},{"n":55,"part":"선택 3","text":"아니면 지수의 일부를 팔아, 이 종목을 매수하시겠습니까?","start":252.29,"end":256.12},{"n":56,"part":"선택 3","text":"선택해 보세요.","start":256.5,"end":257.44},{"n":57,"part":"선택 3","text":"3, 2, 1.","start":257.82,"end":260},{"n":58,"part":"선택 3","text":"이 상황에서는 이 종목은 매수하지 않고 지수에 그대로 두는 것이 옳은 선택입니다.","start":260.38,"end":265.4},{"n":59,"part":"선택 3","text":"그때가 2022년 5월 9일, 그 종목은 모더나였습니다.","start":265.78,"end":269.759},{"n":60,"part":"선택 3","text":"정씨와 똑같이 지수 절반을 팔아 모더나를 샀다면, 그해 말 잠깐 55% 반등했을 것입니다.","start":270.139,"end":275.856},{"n":61,"part":"선택 3","text":"그러나 2025년 말에는 그날보다 78% 아래일 것입니다.","start":276.236,"end":280.456},{"n":62,"part":"선택 3","text":"지수에 두었다면, 가장 나쁠 때도 10% 하락에 그치고 81% 올라 있었을 겁니다.","start":280.836,"end":286.394},{"n":63,"part":"선택 3","text":"물론 넷플릭스처럼, 그날 크게 하락해 있다가 다섯 배 넘게 오른 종목도 있습니다.","start":286.774,"end":291.734},{"n":64,"part":"선택 3","text":"하지만 많이 하락한 종목 가운데 어느 것이 살아날지는, 그날 알 수 없습니다.","start":292.114,"end":296.773},{"n":65,"part":"선택 3","text":"지금 S&P 500 회사 중, 그날 가장 많이 하락해 있던 24곳을 보면 이렇습니다.","start":297.153,"end":302.337},{"n":66,"part":"선택 3","text":"그 가운데 15곳은 그 뒤 2년 안에, 30% 넘게 더 하락한 적이 있었습니다.","start":302.717,"end":308.163},{"n":67,"part":"선택 3","text":"그러니 옳은 선택은 싸 보이는 한 종목보다, 여러 종목이 담긴 지수를 지키는 것입니다.","start":308.543,"end":313.537},{"n":68,"part":"선택 4","text":"석 달 뒤, 지수가 앞서 찍은 바닥보다 17% 반등했습니다.","start":314.537,"end":318.707},{"n":69,"part":"선택 4","text":"방송에선 하락장은 끝났다는 전문가 의견이 이어집니다.","start":319.087,"end":322.523},{"n":70,"part":"선택 4","text":"당신에게는 아직 넣지 않은 현금이 남아 있습니다.","start":322.903,"end":325.53},{"n":71,"part":"선택 4","text":"이 순간 당신은 바닥은 지났다고 보고, 남은 현금을 한 번에 매수하시겠습니까?","start":325.91,"end":330.585},{"n":72,"part":"선택 4","text":"아니면 계획에 적어 둔 다음 가격이 올 때까지 기다리시겠습니까?","start":330.965,"end":334.889},{"n":73,"part":"선택 4","text":"선택해 보세요.","start":335.269,"end":336.209},{"n":74,"part":"선택 4","text":"3, 2, 1.","start":336.589,"end":338.769},{"n":75,"part":"선택 4","text":"이 상황에서는 계획에 적어 둔 다음 가격까지 기다리는 것이 옳은 선택입니다.","start":339.149,"end":343.799},{"n":76,"part":"선택 4","text":"그때가 2022년 8월 12일, 6월 바닥보다 17% 가까이 오른 날이었습니다.","start":344.179,"end":349.779},{"n":77,"part":"선택 4","text":"정씨와 똑같이 현금을 그날 한 번에 넣었다면, 두 달 뒤 바닥에서 16% 줄었을 것입니다.","start":350.159,"end":355.79},{"n":78,"part":"선택 4","text":"계획에 적은 다음 가격, 최고가보다 25% 아래는 9월 30일에 왔습니다.","start":356.17,"end":361.206},{"n":79,"part":"선택 4","text":"그날 값은, 한 번에 넣은 날보다 16% 쌌습니다.","start":361.586,"end":365.086},{"n":80,"part":"선택 4","text":"3년여 뒤, 한 번에 넣은 돈은 68% 늘었을 것이고 기다린 돈은 두 배가 됐을 겁니다.","start":365.466,"end":371.035},{"n":81,"part":"선택 4","text":"물론 그 반등이 진짜 바닥이었다면, 기다리는 동안 더 올라 버렸을 수도 있습니다.","start":371.415,"end":376.323},{"n":82,"part":"선택 4","text":"하지만 하락장의 반등은, 바닥이 끝났다는 뜻이 아닌 경우가 많습니다.","start":376.703,"end":381.28},{"n":83,"part":"선택 4","text":"닷컴 거품 이후 하락장에서 15% 넘게 반등한 열 번 중 여섯 번은, 새 바닥이 왔습니다.","start":381.66,"end":387.667},{"n":84,"part":"선택 4","text":"그러니 옳은 선택은 반등에도 한 번에 넣지 않고, 계획한 다음 가격을 기다리는 것입니다.","start":388.047,"end":393.347},{"n":85,"part":"선택 5","text":"한 달 반 뒤, 지수가 다시 미끄러지며 전에 찍은 바닥 아래로 내려갔습니다.","start":394.347,"end":398.724},{"n":86,"part":"선택 5","text":"최고가보다 24% 아래이고, 물가가 잡히지 않는다는 뉴스에 공포가 다시 커집니다.","start":399.104,"end":404.433},{"n":87,"part":"선택 5","text":"그동안 산 주식도 모두 손실입니다.","start":404.813,"end":406.983},{"n":88,"part":"선택 5","text":"커뮤니티엔 계획대로 사 봐야 소용없다는 글이 넘칩니다.","start":407.363,"end":410.595},{"n":89,"part":"선택 5","text":"이 순간 당신은 생활에 지장 없는 돈인지 확인하고, 계획대로 이어 가시겠습니까?","start":410.975,"end":416.034},{"n":90,"part":"선택 5","text":"아니면 계획이 틀렸다며, 지수를 모두 매도하고 멈추시겠습니까?","start":416.414,"end":420.371},{"n":91,"part":"선택 5","text":"선택해 보세요.","start":420.751,"end":421.691},{"n":92,"part":"선택 5","text":"3, 2, 1.","start":422.071,"end":424.251},{"n":93,"part":"선택 5","text":"이 상황에서는 생활에 지장 없는지 확인하고 계획대로 이어 가는 것이 옳은 선택입니다.","start":424.631,"end":429.492},{"n":94,"part":"선택 5","text":"그때가 2022년 9월 26일, 지수가 6월 바닥을 다시 깬 날이었습니다.","start":429.872,"end":435.184},{"n":95,"part":"선택 5","text":"정씨와 똑같이 모두 매도하고 멈췄다면, 3년여간 이자로 16% 느는 데 그쳤을 것입니다.","start":435.564,"end":441.352},{"n":96,"part":"선택 5","text":"계획대로 이어 갔다면, 그 뒤 2% 더 하락했다가 96% 올랐을 겁니다.","start":441.732,"end":447.126},{"n":97,"part":"선택 5","text":"물론 바닥을 다시 깨면, 계획 자체가 틀린 것처럼 느껴집니다.","start":447.506,"end":451.275},{"n":98,"part":"선택 5","text":"하지만 계획은 바닥을 맞히려는 게 아니라, 버틸 만큼만 나눠 사려는 것이었습니다.","start":451.655,"end":456.425},{"n":99,"part":"선택 5","text":"같은 하락장들에서 바닥을 다시 깬 세 번 모두, 4년 뒤엔 보유가 더 나았습니다.","start":456.805,"end":461.903},{"n":100,"part":"선택 5","text":"그 돈이 곧 써야 할 돈이라면, 그때는 계획보다 생활을 먼저 지켜야 합니다.","start":462.283,"end":467.008},{"n":101,"part":"선택 5","text":"그러니 옳은 선택은 바닥이 다시 깨져도 여윳돈이라면, 처음 계획을 이어 가는 것입니다.","start":467.388,"end":472.753},{"n":102,"part":"결과","text":"이 테스트에서 당신이 공포에 진 결정은 몇 개였나요?","start":473.753,"end":477.063},{"n":103,"part":"결과","text":"하나도 없었다면 폭락 속에서도 여윳돈으로 계획대로 사는 사람으로, 통과입니다.","start":477.443,"end":482.403},{"n":104,"part":"결과","text":"한두 개였다면 계획은 있지만 공포나 반등에 가끔 흔들리는 사람으로, 주의입니다.","start":482.783,"end":488.063},{"n":105,"part":"결과","text":"세 개 이상이면 정씨처럼 공포에 사지 못해 손실을 볼 확률이 높은 사람으로, 불통과입니다.","start":488.443,"end":494.185},{"n":106,"part":"정리","text":"이 테스트에서 알 수 있듯이, 비 온 뒤에 땅이 굳는다는 말처럼 폭락 속에서도 계획을 지키며 사는 쪽이 주식으로 부자가 되는 길이라는 것을 알아두세요.","start":495.185,"end":504.552},{"n":107,"part":"정리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":504.932,"end":507.142},{"n":108,"part":"정리","text":"시청해주셔서 감사합니다.","start":507.522,"end":509.052}],"subs":[[0.2,5.181,"폭락장에서 계좌를 가르는 건 공포를 느끼느냐가 아니라,\n계획이 있느냐입니다."],[5.181,10.272,"정씨도 폭락이 오면 사려고 현금을 남기고,\n매수 계획까지 적어 둔 사람인데요."],[10.272,14.255,"그런데 막상 폭락이 오자, 계획 대신 공포를 따랐습니다."],[14.255,18.659,"그 결과 4년 뒤, 1억 원은 3천5백만 원 남짓만 남았습니다."],[18.659,23.873,"지수는 그 폭락을 딛고, 같은 4년 동안 40% 넘게 올랐는데 말이죠."],[23.873,29.483,"공포 앞에서 정씨가 내린 다섯 번의 결정을,\n당신이라면 어떻게 했을지 골라 보세요."],[29.483,32.818,"공포에 진 결정이 몇 개인지 세어 두시면 됩니다."],[32.818,37.834,"공포가 처음 덮친 그날, 정씨의 자리에 당신이 서 보겠습니다."],[37.834,41.495,"당신에게는 5년 넘게 쓸 일이 없는 1억 원이 있습니다."],[41.495,47.013,"지수가 사상 최고가이던 날,\n당신은 6천만 원을 S&P 500 지수에 넣었습니다."],[47.013,51.433,"나머지 4천만 원은, 폭락이 오면 사려고 현금으로 남겼는데요."],[51.433,55.27,"얼마나 떨어지면 얼마씩 살지, 매수 계획도 적어 두었습니다."],[55.27,60.309,"두 달 뒤, 전쟁 소식에 지수가 최고가보다 12% 넘게 하락했습니다."],[60.309,65.161,"미국 주식이 얼마나 출렁일지 보여 주는 지수를,\n공포 지수라고 부릅니다."],[65.161,69.709,"그 공포 지수가, 평소의 두 배 가까운 36까지 치솟았습니다."],[69.709,75.187,"넣은 6천만 원은 5천2백만 원대로 줄었고,\n뉴스엔 더 떨어진다는 전망뿐입니다."],[75.187,81.29,"이 순간 당신은 더 잃기 전에 모두 매도하고,\n공포가 가라앉으면 다시 매수하시겠습니까?"],[81.29,85.369,"아니면 매도하지 않고, 적어 둔 매수 계획을 꺼내 보시겠습니까?"],[85.369,86.689,"선택해 보세요."],[86.689,89.249,"3, 2, 1."],[89.249,94.636,"이 상황에서는 매도하지 않고\n적어 둔 매수 계획을 꺼내 보는 것이 옳은 선택입니다."],[94.636,100.391,"그때가 2022년 3월 7일,\n러시아가 우크라이나를 침공한 지 열하루 뒤였습니다."],[100.391,106.146,"정씨와 똑같이 모두 매도하고,\n공포 지수가 20 아래로 내려오자 다시 샀다고 하겠습니다."],[106.146,111.894,"그사이 지수가 9% 올라,\n같은 돈으로 살 수 있는 주식은 8% 줄었을 것입니다."],[111.894,116.505,"그래서 2025년 말까지도 58% 오르는 데 그쳤을 것입니다."],[116.505,120.695,"매도하지 않았다면, 같은 때 72% 올랐을 겁니다."],[120.695,124.895,"물론 그날 팔면, 그 뒤에 이어진 하락은 잠시 피할 수 있습니다."],[124.895,129.654,"하지만 공포가 가라앉았다고 느낄 때는, 대개 값이 이미 올라 있습니다."],[129.654,135.112,"1990년 이후 공포 지수가 35를 넘은\n열일곱 번 중 열여섯 번이 그랬습니다."],[135.112,137.32,"계획은 예를 들어 이렇습니다."],[137.32,144.703,"최고가보다 10%, 15%, 20%,\n25% 내려갈 때마다 현금의 4분의 1씩 삽니다."],[144.703,150.623,"그러니 옳은 선택은 공포가 클수록 팔지 않고,\n적어 둔 매수 계획을 꺼내는 것입니다."],[150.623,154.88,"3주 뒤, 공포 지수가 평소 수준인 20 아래로 내려왔는데요."],[154.88,158.088,"지수도 그사이 9% 가까이 반등했습니다."],[158.088,162.868,"커뮤니티엔 빚을 내서 산 사람이\n벌써 크게 벌었다는 인증 글이 올라옵니다."],[162.868,167.439,"증권사 앱에는, 신용으로 돈을 빌려 더 살 수 있다는 안내가 뜹니다."],[167.439,172.735,"이 순간 당신은 빚 없이,\n투자용으로 정해 둔 돈 안에서만 매수하시겠습니까?"],[172.735,176.691,"아니면 신용으로 돈을 빌려, 더 많이 매수하시겠습니까?"],[176.691,178.011,"선택해 보세요."],[178.011,180.571,"3, 2, 1."],[180.571,185.801,"이 상황에서는 빚 없이 정해 둔 돈 안에서만\n매수하는 것이 옳은 선택입니다."],[185.801,191.787,"정씨와 똑같이 3월 28일 다시 사면서,\n같은 금액을 신용으로 빌려 더 샀다고 하겠습니다."],[191.787,197.656,"그 뒤 지수가 22% 하락하자,\n빚까지 넣은 돈은 절반 가까이 줄었을 것입니다."],[197.656,202.043,"빚이 없었다면, 같은 때 줄어든 돈은 21%였을 겁니다."],[202.043,206.283,"빌린 돈 대비 주식 값도 151%까지 내려갔을 것입니다."],[206.283,210.013,"증권사가 강제로 파는 140% 선의 바로 위죠."],[210.013,214.033,"물론 지수가 오르기만 하면, 빌린 만큼 더 벌 수 있습니다."],[214.033,219.28,"하지만 빚은 떨어질 때 손실을 두 배로 키우고,\n이자는 하루도 빠짐없이 붙습니다."],[219.28,225.27,"1990년 이후 하락장 네 번을 보면,\n첫날 빚내 산 지수는 두 번 강제로 팔렸습니다."],[225.27,231.825,"그러니 옳은 선택은 정해 둔 돈 안에서만 매수해,\n더 떨어져도 버틸 힘을 남기는 것입니다."],[231.825,236.514,"6주 뒤, 지수는 다시 최고가보다 17% 아래로 내려갔습니다."],[236.514,242.792,"이때 코로나 백신으로 유명해진 한 제약사 주식은,\n1년도 안 돼 72% 하락해 있었는데요."],[242.792,247.416,"이렇게 싼 가격은 다시 없다며, 지금 사면 몇 배를 번다는 말이 돕니다."],[247.416,252.29,"이 순간 당신은 이 종목은 매수하지 않고, 지수에 그대로 두시겠습니까?"],[252.29,256.5,"아니면 지수의 일부를 팔아, 이 종목을 매수하시겠습니까?"],[256.5,257.82,"선택해 보세요."],[257.82,260.38,"3, 2, 1."],[260.38,265.78,"이 상황에서는 이 종목은 매수하지 않고\n지수에 그대로 두는 것이 옳은 선택입니다."],[265.78,270.139,"그때가 2022년 5월 9일, 그 종목은 모더나였습니다."],[270.139,276.236,"정씨와 똑같이 지수 절반을 팔아 모더나를 샀다면,\n그해 말 잠깐 55% 반등했을 것입니다."],[276.236,280.836,"그러나 2025년 말에는 그날보다 78% 아래일 것입니다."],[280.836,286.774,"지수에 두었다면,\n가장 나쁠 때도 10% 하락에 그치고 81% 올라 있었을 겁니다."],[286.774,292.114,"물론 넷플릭스처럼,\n그날 크게 하락해 있다가 다섯 배 넘게 오른 종목도 있습니다."],[292.114,297.153,"하지만 많이 하락한 종목 가운데 어느 것이 살아날지는,\n그날 알 수 없습니다."],[297.153,302.717,"지금 S&P 500 회사 중,\n그날 가장 많이 하락해 있던 24곳을 보면 이렇습니다."],[302.717,308.543,"그 가운데 15곳은 그 뒤 2년 안에,\n30% 넘게 더 하락한 적이 있었습니다."],[308.543,314.537,"그러니 옳은 선택은 싸 보이는 한 종목보다,\n여러 종목이 담긴 지수를 지키는 것입니다."],[314.537,319.087,"석 달 뒤, 지수가 앞서 찍은 바닥보다 17% 반등했습니다."],[319.087,322.903,"방송에선 하락장은 끝났다는 전문가 의견이 이어집니다."],[322.903,325.91,"당신에게는 아직 넣지 않은 현금이 남아 있습니다."],[325.91,330.965,"이 순간 당신은 바닥은 지났다고 보고,\n남은 현금을 한 번에 매수하시겠습니까?"],[330.965,335.269,"아니면 계획에 적어 둔 다음 가격이 올 때까지 기다리시겠습니까?"],[335.269,336.589,"선택해 보세요."],[336.589,339.149,"3, 2, 1."],[339.149,344.179,"이 상황에서는 계획에 적어 둔 다음 가격까지\n기다리는 것이 옳은 선택입니다."],[344.179,350.159,"그때가 2022년 8월 12일,\n6월 바닥보다 17% 가까이 오른 날이었습니다."],[350.159,356.17,"정씨와 똑같이 현금을 그날 한 번에 넣었다면,\n두 달 뒤 바닥에서 16% 줄었을 것입니다."],[356.17,361.586,"계획에 적은 다음 가격, 최고가보다 25% 아래는 9월 30일에 왔습니다."],[361.586,365.466,"그날 값은, 한 번에 넣은 날보다 16% 쌌습니다."],[365.466,371.415,"3년여 뒤, 한 번에 넣은 돈은 68% 늘었을 것이고\n기다린 돈은 두 배가 됐을 겁니다."],[371.415,376.703,"물론 그 반등이 진짜 바닥이었다면,\n기다리는 동안 더 올라 버렸을 수도 있습니다."],[376.703,381.66,"하지만 하락장의 반등은, 바닥이 끝났다는 뜻이 아닌 경우가 많습니다."],[381.66,388.047,"닷컴 거품 이후 하락장에서 15% 넘게 반등한 열 번 중 여섯 번은,\n새 바닥이 왔습니다."],[388.047,394.347,"그러니 옳은 선택은 반등에도 한 번에 넣지 않고,\n계획한 다음 가격을 기다리는 것입니다."],[394.347,399.104,"한 달 반 뒤, 지수가 다시 미끄러지며\n전에 찍은 바닥 아래로 내려갔습니다."],[399.104,404.813,"최고가보다 24% 아래이고,\n물가가 잡히지 않는다는 뉴스에 공포가 다시 커집니다."],[404.813,407.363,"그동안 산 주식도 모두 손실입니다."],[407.363,410.975,"커뮤니티엔 계획대로 사 봐야 소용없다는 글이 넘칩니다."],[410.975,416.414,"이 순간 당신은 생활에 지장 없는 돈인지 확인하고,\n계 /* ═════════════ 결과 — 공책 세 줄 + 고무도장 (통과 · 주의 · 불통과) ═════════════ */
{
  const a = ch(nRes), b = ch(nEnd), r1 = nRes + 1, r2 = nRes + 2, r3 = nRes + 3;
  const { sc, st } = stage(a, b, "DESK", null);
  st.update = poses(st, a, ["H_THINK", "H_ENDURE", "H_THINK", "H_SHOCK"], "HERO_R", [S(r1), S(r2), S(r3)]);
  notePage(sc, a + 0.02);
  boxC(sc, "N_TOP", row([inkS("공포에 진 결정", CRIM, 72), inkS("?개", NAVY, 72)], 24), S(nRes) + 0.1, "justify-content:flex-start;");
  const rowR = (slot, t2, at) => boxC(sc, slot, inkS(t2, NAVY, 76), at, "justify-content:flex-start;padding-left:30px;border-radius:12px;");
  const rr = [rowR("R1", "0개", S(r1)), rowR("R2", "1–2개", S(r2)), rowR("R3", "3개 이상", S(r3))];
  const hl = ["rgba(34,199,176,.28)", "rgba(255,212,0,.35)", "rgba(179,32,42,.22)"];
  rr.forEach((r, i) => { tl.to(r, { backgroundColor: hl[i], duration: 0.3 }, S([r1, r2, r3][i]) + 0.2); if (i < 2) tl.to(r, { backgroundColor: "rgba(0,0,0,0)", opacity: 0.6, duration: 0.3 }, S([r2, r3][i]) - 0.1); });
  [["통과", TEAL, r1, -10], ["주의", AMB, r2, -7], ["불통과", CRIM, r3, -12]].forEach(([w2, c, n, rot], i, arr) => {
    const d = box(sc, "STAMP", `<div class="stp" ${KW} style="font-size:${w2.length > 2 ? 96 : 112}px;color:${c};transform:rotate(${rot}deg)">${w2}</div>`, CEN);
    const at = W(n, ["통과", "주의", "불통과"][i]);
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, at);   // 칸 상자는 그대로 · 안의 도장만 쾅
    tl.fromTo(d.firstElementChild, { scale: 1.6 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at);
    gsap.set(d, { opacity: 0 });
    if (i + 1 < arr.length) tl.to(d, { opacity: 0, duration: 0.2 }, S(arr[i + 1][2]) - 0.1);
  });
  K.cut(E(nRes) - 0.1, "결과 공포에 진 결정 ?개"); K.cut(E(r1) - 0.1, "결과 통과"); K.cut(E(r2) - 0.1, "결과 주의"); K.cut(E(r3) - 0.1, "결과 불통과");
}

/* ═════════════ 정리 · 인사 (공원 노을) ═════════════ */
{ // 비 온 뒤에 땅이 굳는다 — 계획대로 산 길 vs 정씨 (메모지 그래프)
  const a = ch(nEnd), b = until(nEnd + 1);
  const { sc, st } = stage(a, b, "PARK", null);
  st.update = poses(st, a, ["H_ENDURE"], "HERO_S", []);
  memo(sc, a + 0.1);
  boxC(sc, "M_TOP", row([lab("계획 ✓", TEAL), lab("공포", CRIM)], 24), a + 0.3);
  const g = box(sc, "M_BIG", "", ""); pop(g, a + 0.3, { from: { y: 0 } });
  const P = plot(g, SR.dates.peak, SR.end, 0.25, 1.75, { l: 40, t: 30, r: 40, b: 80 });
  P.hline(1, LINE_Y, a + 0.4, 4);
  P.line(SR.intro_jeong, CRIM, a + 0.5, 1.6, 8);
  P.line(SR.good, TEAL, W(nEnd, "계획을 지키며"), Math.max(1.6, E(nEnd) - W(nEnd, "계획을 지키며") - 1.2), 10);
  inBox(g, `<div class="a w7 nw" style="font-size:36px;color:#5A6378">2022.01</div>`, g._x + 40, g._y + g._h - 60, a + 0.4);
  inBox(g, `<div class="a w7 nw" style="font-size:36px;color:#5A6378;transform:translateX(-100%)">2025.12</div>`, g._x + g._w - 40, g._y + g._h - 60, a + 0.4);
  K.cut(E(nEnd) - 0.1, "정리 계획 ✓");
}
{ // 인사 — HERO_C · 주황 빛 알갱이 (노을)
  const a = until(nEnd + 1), b = K.D;
  const { st } = stage(a, b, "PARK", null, { keep: true });
  st.update = poses(st, a, ["H_BOW"], "HERO_C", [], 5.2);
  const bow = st.update;
  st.update = t => { bow(t); st.BG.tint.setRGB(0.92, 0.88, 0.88); const k = sm(lin(t, S(nEnd + 2), S(nEnd + 2) + 0.6)); st.actors[1] && (st.actors[1].g.rotation.z = 0.15 * Math.sin(k * Math.PI)); };
  st.part(Puppet.floaters({ n: 70, x: [-11, 11], z: [-6, 4], hgt: 12, speed: [0.3, 0.8], size: 0.32, inner: "rgba(255,170,90,1)", outer: "rgba(230,90,40,0)" }));
  K.cut(E(nEnd + 2) - 0.1, "인사");
}
K.done();
})();
</script>
