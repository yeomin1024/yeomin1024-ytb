 A씨도 늘 이렇게 빨리 끝나는 건 아닙니다."],[344.027,348.105,"휴대전화로 수속해도, 운 나쁘게 빨간색이 뜰 수 있습니다."],[348.105,353.631,"빨간색은 세관이 검사가 필요하다고 판단한 경우인데,\n그 기준은 공개되지 않았습니다."],[353.631,359.141,"이때는 세관 검사장에 가서,\n면세품 가방을 열어 산 물건을 직접 보여 줘야 합니다."],[359.141,363.83,"붐비는 시간에는 검사 줄도 길어서, 끝날 때까지 오래 걸릴 수 있습니다."],[363.83,369.937,"그래서 다섯 번째는,\n휴대전화로 수속하더라도 공항에 두세 시간 일찍 가는 것입니다."],[369.937,374.131,"마지막으로, 가장 빠르게 면세를 받는 방법을 정리하겠습니다."],[374.131,378.53,"하나, 출국 전에 비지트 재팬 웹에 여권 정보를 등록해 두세요."],[378.53,381.945,"둘, 일본에서 먹거나 쓸 물건은 따로 계산하세요."],[381.945,385.486,"셋, 계산할 때 환급은 카드로 받겠다고 말하세요."],[385.486,389.705,"넷, 공항에 도착하면 체크인보다 먼저 면세 수속을 하세요."],[389.705,394.25,"다섯, 빨간색이 뜰 수 있으니, 공항에는 두세 시간 일찍 가세요."],[394.25,398.31,"그리고 산 날부터 90일 안에 출국해야 한다는 것도 잊지 마세요."],[398.31,400.24,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

  show(T(sc, 960, 140, `B씨 · 여권 등록 ✕ → <span class="Y">출발 로비 단말기</span>로`, 56), S(58) + 0.05, S(59) - 0.15);
  signal(s, sc, () => KI, false, S(59) + 0.1);
  pop(T(sc, 960, 140, `과자를 먹어서 → <span class="R">세관 창구</span>에서 직접 신고`, 58), S(59) + 0.05);
  pop(T(sc, 960, 245, `붐비면 창구 줄 · 신고에만 <span class="R">1시간 넘게</span>`, 62), W(60, "1시간"));
  K.cut(E(59) - 0.1, "D6 B씨 세관 창구");
  K.cut(E(60) - 0.1, "D6 1시간 넘게");
}
/* D7. A씨 — 전용 와이파이 구역 · 휴대전화 → 초록 → 2분 정도 · 막 오후 3시를 넘김 (문장 61~63) */
{
  const a = until(61), b = until(64);
  const sc = K.scene(a, b);
  let WI, P;
  const s = ST.set(a, b, st => { bgOf(st, "AIR"); WI = act(st, "WIFI", { h: 4.4, at: [-3.2, 0, -0.4] }).ro(2); P = actA(st, "YOU_P", { h: 4.3, at: [0.4, 0, 0.6], flip: true }).ro(4); });
  s.update = t => { idle(P, t); walk(P, t, S(61) - 0.2, S(61) + 1.4, 7); };
  steps(sc, 1, a + 0.05);
  nm(s, sc, () => P, "A", S(61) + 0.4);
  tagOn(s, sc, () => WI, "전용 와이파이", S(61) + 0.3, null, "Y", 0.5);
  pop(T(sc, 960, 140, `A씨 · <span class="G">휴대전화로 수속</span>`, 62), S(61) + 0.05);
  signal(s, sc, () => P, true, W(62, "초록색"));
  pop(T(sc, 960, 240, `<span class="G">초록</span> → 세관 확인 바로 끝`, 58), S(62) + 0.05);
  pop(T(sc, 1500, 330, `<span class="G">2분 정도</span>`, 76), W(63, "2분"), { from: { scale: 1.3, y: 0 } });
  bigClock(sc, 1500, 430, `오후 3시 <span class="G">막 넘김</span>`, "#F4F6FA", W(63, "오후 3시"), 64);
  K.cut(E(62) - 0.1, "D7 A씨 초록");
  K.cut(E(63) - 0.15, "D7 2분 정도 · 3시 막 넘김");
}
/* D8. ③ 세금 돌려받기 — B씨: 이제야 체크인 → 현금 환급 단말기 · 보안 검사 전 · 1시간 넘게 (문장 64~67) */
{
  const a = until(64), b = until(68);
  const sc = K.scene(a, b);
  let CK, P1, CA, QB, P2;
  const s1 = ST.set(a, S(66) - 0.2, st => { bgOf(st, "AIR"); CK = act(st, "CHECKIN", { h: 3.4, at: [3.4, 0, -0.3] }).ro(2); P1 = act(st, "YOU_W", { h: 4.3, at: [-1.4, 0, 0.6] }).ro(4); }, { fadeOut: 0.3 });
  s1.update = t => walk(P1, t, S(65) - 0.2, S(65) + 1.2, -5);
  const s2 = ST.set(S(66) - 0.2, b, st => { bgOf(st, "AIR"); CA = act(st, "CASH", { h: 3.8, at: [6.8, 0, 0] }).ro(2); QB = act(st, "QB", { h: 4.0, at: [-0.4, 0, 0] }).ro(3); P2 = act(st, "YOU_T", { h: 4.3, at: [-5.6, 0, 0.5] }).ro(4); }, { fadeIn: 0.3 });
  s2.update = t => { idle(QB, t); idle(P2, t, 1); };
  steps(sc, 2, S(64) + 0.05);
  nm(s1, sc, () => P1, "B", S(65) + 0.3);
  nm(s2, sc, () => P2, "B", S(66) - 0.1);
  show(T(sc, 960, 140, `B씨 · 이제야 체크인 → <span class="R">현금 환급 단말기</span>로`, 56), S(65) + 0.05, S(66) - 0.15);
  show(T(sc, 960, 140, `나리타 현금 단말기 = <span class="Y">출국 심사 전 구역</span> · 보안 검사 전`, 50), S(66) + 0.05, S(67) - 0.15);
  pop(T(sc, 960, 140, `현금 받으려는 사람이 몰리면 · 여기서도 <span class="R">1시간 넘게</span>`, 54), S(67) + 0.05);
  K.cut(E(65) - 0.1, "D8 B씨 이제야 체크인");
  K.cut(E(67) - 0.1, "D8 현금 단말기 1시간 넘게");
}
/* D9. A씨 — 면세품 가방 맡기고 바로 체크인 · 카드로 → 현금 줄 없음 (문장 68~69) */
{
  const a = until(68), b = until(70);
  const sc = K.scene(a, b);
  let CK, P, TO, CD, pBelt, pEnd;
  const tDrop = S(68) + 0.6;
  const s = ST.set(a, b, st => {
    bgOf(st, "AIR");
    CK = act(st, "CHECKIN", { h: 3.4, at: [2.4, 0, -0.3] }).ro(2);
    const vb = topV("CHECKIN", 0.645); pBelt = uvW(CK, 0.645, vb); pEnd = uvW(CK, 0.77, vb);
    P = actA(st, "YOU_P", { h: 4.3, at: [-4.0, 0, 0.6] }).ro(4);
    TO = act(st, "TOTE", { h: 1.8, at: [-2.2, 0, 0.8] }).ro(5);
    CD = act(st, "CARD", { h: 1.2, at: [-4.0, 5.2, 0.8] }).ro(6);
  });
  s.update = t => {
    idle(P, t);
    const k1 = sm(lin(t, tDrop, tDrop + 0.8)), k2 = lin(t, tDrop + 0.9, tDrop + 2.4);
    if (k1 > 0) TO.g.position.set(lerp(TO.home.x, pBelt.x, k1), lerp(0, pBelt.y, k1) + Math.sin(Math.PI * k1) * 0.8, 0.1);
    if (k2 > 0) { TO.g.position.set(lerp(pBelt.x, pEnd.x, k2), pBelt.y, 0.1); TO.op = 1 - seg(t, tDrop + 1.7, tDrop + 2.3); }
    CD.pop(t, W(69, "카드로"), 0.45);
  };
  steps(sc, 2, a + 0.05);
  nm(s, sc, () => P, "A", S(68) + 0.1);
  pop(T(sc, 960, 140, `A씨 · 면세품 가방 맡기고 <span class="G">바로 체크인</span>`, 60), S(68) + 0.05);
  pop(T(sc, 960, 245, `환급은 <span class="G">카드로</span> → 현금 단말기 줄 필요 없음`, 54), S(69) + 0.05);
  K.cut(E(68) - 0.1, "D9 A씨 바로 체크인");
  K.cut(E(69) - 0.1, "D9 카드 · 줄 없음");
}
/* D10. 결과 — 같은 시각 도착 · B씨 면세에만 2시간 넘게 vs A씨 2분 정도 (문장 70~72) */
{
  const a = until(70), b = until(73), BY = 470, AY = 700;
  const sc = K.scene(a, b);
  ST.set(a, b, st => { bgOf(st, "PAPER"); });
  pop(T(sc, 960, 40, `같은 시각에 도착했는데`, 66), S(70) + 0.05);
  axis(sc, AY + 90, S(70) + 0.2);
  pop(el(`<div class="a nmB" style="left:120px;top:${BY - 30}px">B씨</div>`, sc), S(70) + 0.3);
  tseg(sc, 0, 62, BY, R, `세관 창구 <span class="R">1시간+</span>`, W(70, "면세에만"));
  tseg(sc, 62, 124, BY, "#C4402F", `현금 단말기 <span class="R">1시간+</span>`, W(70, "면세에만") + 0.6);
  tseg(sc, 124, 150, BY, R, ``, W(70, "2시간") + 0.2, true);
  pop(T(sc, 960, 130, `B씨 · 면세에만 <span class="R">2시간 넘게</span>`, 80), W(70, "2시간"), { from: { scale: 1.3, y: 0 } });
  pop(T(sc, 960, 250, `3시간 일찍 왔는데 · 그중 <span class="R">2시간 넘게</span> 줄과 창구에서`, 50), S(71) + 0.05);
  pop(el(`<div class="a nmA" style="left:120px;top:${AY - 30}px">A씨</div>`, sc), S(72) + 0.05);
  tseg(sc, 0, 1.5, AY, G, ``, W(72, "2분"));
  pop(T(sc, 700, AY - 40, `<span class="G">2분 정도</span> → 남은 시간은 <span class="G">여유</span>`, 54), W(72, "2분") + 0.2);
  K.cut(E(70) - 0.1, "D10 B씨 2시간 넘게");
  K.cut(E(72) - 0.1, "D10 A씨 2분 정도");
}
/* D11. A씨도 빨간색이 뜰 수 있음 · 기준 비공개 · 검사장 · 오래 → 다섯 번째 (문장 73~78) */
{
  const a = until(73), b = ch(79);
  const sc = K.scene(a, b);
  let WI, CU, P, TO;
  const tGo = S(76) + 0.2;
  const s = ST.set(a, b, st => {
    bgOf(st, "AIR");
    WI = act(st, "WIFI", { h: 4.2, at: [-8.0, 0, -0.4] }).ro(2);
    CU = act(st, "CUSTOMS", { h: 3.6, at: [4.4, 0, -0.4] }).ro(2);
    P = actA(st, "YOU_P", { h: 4.3, at: [-5.0, 0, 0.6] }).ro(4);
    TO = act(st, "TOTE", { h: 1.8, at: [-6.3, 0, 0.9] }).ro(5);
  });
  s.update = t => {
    idle(P, t); CU.op = t < S(76) - 0.1 ? 0 : 1; CU.slide(t, S(76) - 0.1, 0.6, 12);
    const k = sm(lin(t, tGo, tGo + 1.6)); P.g.position.x = lerp(P.home.x, 0.6, k); TO.g.position.x = lerp(TO.home.x, -0.6, k);
    if (k > 0 && k < 1) P.g.position.y = 0.1 * Math.abs(Math.sin(q12(t) * Math.PI * 2.2));
    const pT = uvW(CU, 0.32, topV("CUSTOMS", 0.32)); if (t > tGo + 1.6) { const k2 = sm(lin(t, tGo + 1.6, tGo + 2.2)); TO.g.position.set(lerp(-0.6, pT.x, k2), lerp(0, pT.y, k2) + Math.sin(Math.PI * k2) * 0.6, 0.9); }
    s.tint.copy(WARM).lerp(DARK, seg(t, S(77) - 0.1, S(77) + 0.4) * 0.4);
  };
  nm(s, sc, () => P, "A", S(73) + 0.1);
  show(T(sc, 960, 40, `물론 A씨도 <span class="Y">늘 빠른 건 아님</span>`, 66), S(73) + 0.05, S(74) - 0.15);
  signal(s, sc, () => P, false, W(74, "빨간색"), S(76) - 0.2);
  show(T(sc, 960, 40, `휴대전화로 해도 <span class="R">빨간색</span>이 뜰 수 있음`, 66), S(74) + 0.05, S(78) - 0.2);
  show(T(sc, 960, 140, `빨강 = 세관이 검사가 필요하다고 본 경우 · <span class="Y">기준 비공개</span>`, 48), S(75) + 0.05, S(76) - 0.15);
  show(T(sc, 960, 140, `세관 검사장 → 면세품 가방 열어 <span class="Y">직접 보여 주기</span>`, 54), S(76) + 0.05, S(78) - 0.2);
  show(T(sc, 960, 240, `붐비면 검사 줄도 길어 → <span class="R">오래 걸릴 수</span>`, 54), S(77) + 0.05, S(78) - 0.2);
  tipCard(sc, 5, `휴대전화로 해도 공항엔 <span class="Y">두세 시간 일찍</span>`, S(78) + 0.05, 40);
  K.cut(E(75) - 0.1, "D11 빨강 · 기준 비공개");
  K.cut(E(77) - 0.1, "D11 검사장 · 오래");
  K.cut(E(78) - 0.1, "D11 다섯 번째");
}

/* ═════════════ 정리 ═════════════ */
{
  const a = ch(79), b = K.D;
  const sc = K.scene(a, b, { keep: true });
  const ICON = ["PHONE", "SNACK", "CARD", "TOTE", "PLANE", "PASS"], IH = [0.95, 0.85, 0.7, 0.85, 0.6, 0.75];
  const rowY = i => 160 + i * 112;
  let ic = [];
  const s = ST.set(a, b, st => { bgOf(st, "PAPER"); ic = ICON.map((k, i) => act(st, k, { h: IH[i], anchor: [0.5, 0.5], at: [(1580 - 960) / 84, 3.34 - (rowY(i) + 48 - 540) / 84, 0.5] }).ro(5)); }, { fadeOut: 0 });
  const items = [
    [S(80), "출국 전 비지트 재팬 웹에 여권 등록"],

    [S(82), "계산할 때 환급은 카드로"],
    [S(83), "공항에선 체크인보다 먼저 면세 수속"],
    [S(84), "빨간색 대비 — 공항엔 두세 시간 일찍"],

  ];
  s.update = t => ic.forEach((c, i) => c.pop(t, items[i][0] + 0.1, 0.4));

}
K.done();
