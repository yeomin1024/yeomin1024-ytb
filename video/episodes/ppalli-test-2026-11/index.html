   그래프 선 = window.SERIES (calc/series.py v1.0 — 실제 종가) · 숫자 = longform_items.py v2.1 nasdaq_1_v21 */
const SR = window.SERIES;
// 칸 안 실제 종가 선 — arr = [[날짜, 값]] · 칸 g 안의 그림 자리 [x, y, w, h] (화면 좌표) · lo·hi = 세로 범위
function seriesIn(g, arr, area, lo, hi, color, at, dur, w) {
  const [x, y, ww, hh] = area, n = arr.length;
  const pts = arr.map(([, v], i) => [+(x + ww * i / (n - 1)).toFixed(1), +(y + hh * (1 - (v - lo) / (hi - lo))).toFixed(1)]);
  return { path: lineIn(g, pts, color, at, dur || 1.4, w || 9), end: pts[n - 1], pts };
}
function baseIn(g, area, lo, hi, at) {                 // 시작 값(1) 노란 점선 = 기준
  const [x, y, ww, hh] = area, yy = +(y + hh * (1 - (1 - lo) / (hi - lo))).toFixed(1);
  return lineIn(g, [[x, yy], [x + ww, yy]], Y, at, 0.3, 5, "14 10");
}
const won = v => "₩" + Math.round(v).toLocaleString("en-US");
const dateTag = (d) => tag(d, "#9FB4D8");
const slice = (arr, a, b) => arr.filter(([d]) => d >= a && d <= b);
const norm = arr => arr.map(([d, v]) => [d, +(v / arr[0][1]).toFixed(4)]);

// 결과 둘: 왼쪽 오답 길(빨강) · 오른쪽 정답 길(청록) — VSL · VSR
function vsPanel(sc, slot, k, ok, head, at) {
  const p = box(sc, slot, "", PANEL_CSS); pop(p, at);
  inBox(p, `<div class="a w9 nw" style="font-size:60px;line-height:1"><span style="display:inline-grid;place-items:center;width:80px;height:80px;border-radius:50%;background:${WH};color:#0C1424;margin-right:18px">${LET[k]}</span><span style="color:${ok ? G : R}">${ok ? "✓" : "✕"}</span> <span class="N" style="font-size:44px">${head}</span></div>`, p._x + 30, p._y + 26, at + 0.1);
  return p;
}
function vsNums(p, items, at0) {                         // [[글, 색, 시각]] — 판 아래쪽 한 줄씩
  items.forEach(([t2, col, at], i) => inBox(p, `<div class="a w9 nw ts" style="font-size:64px;line-height:1;color:${col}">${t2}</div>`, p._x + 34 + i * 380, p._y + p._h - 96, at));
}
function resultVS(n, a, b, spec) {
  const { sc } = stage(a, b, "PAPER", null);
  const k0 = ITEM[n].ans, kw = 1 - k0;
  const L1 = vsPanel(sc, "VSL", kw, false, spec.wHead, a + 0.15), R1 = vsPanel(sc, "VSR", k0, true, spec.rHead, spec.rAt - 0.2);
  const areaL = [L1._x + 40, L1._y + 140, L1._w - 80, L1._h - 280], areaR = [R1._x + 40, R1._y + 140, R1._w - 80, R1._h - 280];
  baseIn(L1, areaL, spec.lo, spec.hi, a + 0.3); baseIn(R1, areaR, spec.lo, spec.hi, spec.rAt);
  seriesIn(L1, spec.w, areaL, spec.lo, spec.hi, R, a + 0.4, spec.wDur || 1.6, 8);
  seriesIn(R1, spec.r, areaR, spec.lo, spec.hi, G, spec.rAt + 0.1, spec.rDur || 1.6, 8);
  vsNums(L1, spec.wNums); vsNums(R1, spec.rNums);
  K.cut(b - 0.2, `L 해설 ${n} 결과`);
}
// 반론 → 반박: HERO_L 머리 위 '?' → '!' · 오른쪽 판(PANEL_R)에 숫자·기호

  const p = box(sc, "PANEL_R", "", PANEL_CSS + CEN + "flex-direction:column;gap:30px;"); pop(p, S(q) + 0.1);
  build(p);
  K.cut(butAt - 0.2, `L 해설 ${n} 물론`); K.cut(b - 0.2, `L 해설 ${n} 하지만`);
}
