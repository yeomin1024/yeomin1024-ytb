  tl.fromTo(q.firstElementChild, { rotate: 0 }, { rotate: 8, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(3, "무슨") + 0.3);   // 칸 상자는 그대로 · 글자만 흔들림
  K.cut(E(3) - 0.1, "S-03 ?!");
}
/* S-04 점점 욕심 — 생각하는 주인공 · 동전이 점점 커짐 · MORE (문장 4) */
{
  const a = until(4), b = until(5);
  let HT;
  const { sc, st } = stage(a, b, "HOME", s => { HT = act(s, "H_THINK", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HT, t, a + 0.1); idle(HT, t); };
  const c = boxC(sc, "T_MAIN", propH("P-COINS", 200), S(4) + 0.1);
  tl.fromTo(c.firstElementChild, { scale: 0.7 }, { scale: 1.45, duration: Math.max(0.6, E(4) - W(4, "점점")), ease: "power1.in" }, W(4, "점점"));
  boxC(sc, "T_TAG", tag("MORE", Y), W(4, "욕심") - 0.1);
  K.cut(E(4) - 0.1, "S-04 MORE");
}
/* S-05 수익 → 매수 금액을 점점 늘림 — 막대 넷 + BUY (문장 5) */
{
  const a = until(5), b = until(6);
  let HP;
  const { sc, st } = stage(a, b, "OFF", s => { HP = act(s, "H_PHONE", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HP, t, a + 0.1); idle(HP, t); };
  boxC(sc, "T_TAG", tag("▲", G, 70), S(5) + 0.05);
  const m = box(sc, "T_MAIN", "", "");
  pop(m, W(5, "매수") - 0.3);
  const HS = [70, 130, 210, 320], t0 = W(5, "매수");
  const bars = HS.map((h, i) => {
    const n = el(`<div class="a" style="left:${20 + i * 105}px;top:${340 - h}px;width:80px;height:${h}px;border-radius:14px 14px 4px 4px;background:${G};transform-origin:50% 100%"></div>`, m);
    tl.fromTo(n, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(1.6)" }, t0 + i * Math.max(0.25, (E(5) - t0) / 5));
    return n;
  });
  const bt = el(`<div class="btn buy a" style="left:500px;top:120px">BUY</div>`, m);
  bars.forEach((_, i) => press(bt, t0 + i * Math.max(0.25, (E(5) - t0) / 5) - 0.05));
  K.cut(E(5) - 0.1, "S-05 BUY 막대");
}
/* S-06 손실 → 더 자주, 더 크게 매수·매도 반복 (문장 6) */
{
  const a = until(6), b = until(7);
  let HS;
  const { sc, st } = stage(a, b, "OFF", s => { HS = act(s, "H_SHOCK", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HS, t, a + 0.1); if (t > W(6, "더 자주")) HS.jitter(t, 0.02); else idle(HS, t); };
  boxC(sc, "T_TAG", tag("▼", R, 70), S(6) + 0.05);
  const m = boxC(sc, "T_MAIN", `<div class="btn buy">BUY</div><div class="btn sell">SELL</div>`, W(6, "더 자주") - 0.4);
  const [bb, bs] = m.children;
  gsap.set([bb, bs], { opacity: 0.35 });
  const t0 = W(6, "더 자주"), t1 = E(6) - 0.15;
  let t = t0, k = 0, gap = 0.5;
  while (t < t1) {
    const on = k % 2 ? bs : bb, off = k % 2 ? bb : bs, sc2 = 1 + Math.min(0.25, k * 0.025);
    tl.to(on, { opacity: 1, scale: sc2, duration: 0.08 }, t); tl.to(off, { opacity: 0.35, scale: 1, duration: 0.08 }, t);
    t += gap; gap = Math.max(0.16, gap * 0.85); k++;
  }
  K.cut(W(6, "반복") + 0.2, "S-06 BUY ↔ SELL");
}
/* S-07 큰 하락 → 더 살 돈 없음(CASH ₩0) · 팔자니 손실(SELL · LOSS) (문장 7) */
{
  const a = until(7), b = until(8), tC = W(7, "매수할") - 0.2;
  let HS;
  const { sc, st } = stage(a, b, "HOME", s => { HS = act(s, "H_SHOCK", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HS, t, a + 0.1); idle(HS, t); if (t > W(7, "하락이") && t < tC) HS.jitter(t, 0.02); };
  const g = box(sc, "T_CHART", "", PANEL_CSS); pop(g, S(7) + 0.05); out(g, tC - 0.25);
  const [x, y, w, h] = LAY.T_CHART;
  const P = [[0, 0.30], [0.12, 0.24], [0.22, 0.30], [0.34, 0.18], [0.46, 0.26], [0.56, 0.20], [0.64, 0.36], [0.74, 0.58], [0.84, 0.70], [1, 0.90]];
  lineIn(g, P.map(([u, v]) => [x + 60 + (w - 120) * u, y + 50 + (h - 100) * v]), R, S(7) + 0.1, Math.max(0.6, tC - 0.45 - S(7)), 12);   // "결국 큰 하락이 오면" 동안
  const cash = boxC(sc, "T_L", `<div class="app"><div class="h">CASH</div><div class="v R">₩0</div></div>`, tC);
  const sell = boxC(sc, "T_R", `<div style="display:grid;gap:30px;justify-items:center"><div class="btn sell">SELL</div>${tag("LOSS ▼", R)}</div>`, W(7, "매도하자니") - 0.2);
  tl.fromTo(sell.querySelector(".btn"), { x: 0 }, { x: 10, duration: 0.07, yoyo: true, repeat: 5, ease: "none" }, W(7, "손실이"));
  K.cut(tC - 0.35, "S-07 하락 그래프");
  K.cut(E(7) - 0.1, "S-07 CASH ₩0 · SELL LOSS");
}
/* S-08 떨어지는 계좌를 지켜보는 것 말고 할 수 있는 게 없음 (문장 8) */
{
  const a = until(8), b = until(9);
  let HD;
  const { sc, st } = stage(a, b, "HOME", s => { HD = act(s, "H_DESP", "P_C", 3.6).ro(5); });
  st.update = t => { enter(HD, t, a + 0.1); };
  const g = box(sc, "T_CHART", "", PANEL_CSS); pop(g, S(8) + 0.05);
  const [x, y, w, h] = LAY.T_CHART;
  const P = [[0, 0.10], [0.15, 0.18], [0.28, 0.16], [0.42, 0.30], [0.55, 0.28], [0.70, 0.44], [0.84, 0.50], [1, 0.62]];
  lineIn(g, P.map(([u, v]) => [x + 60 + (w - 120) * u, y + 40 + (h - 80) * v]), R, S(8) + 0.2, Math.max(1.5, E(8) - S(8) - 0.4), 12);
  inBox(g, `<div class="a btn off" style="font-size:56px;padding:18px 40px">BUY</div>`, x + 140, y + h - 140, W(8, "할 수 있는") - 0.1);
  inBox(g, `<div class="a btn off" style="font-size:56px;padding:18px 40px">SELL</div>`, x + 480, y + h - 140, W(8, "할 수 있는"));
  K.cut(E(8) - 0.1, "S-08 지켜보기만");
}
/* S-09 급할수록 돌아가라 — 곧은 길 ✕ · 돌아가는 길 ✓ (문장 9) */
{
  const a = until(9), b = until(10);
  let HP;
  const { sc, st } = stage(a, b, "PAPER", s => { HP = act(s, "H_PLAN", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HP, t, a + 0.1); idle(HP, t); };
  const g = box(sc, "T_MAIN", "", ""); pop(g, S(9));
  const [x, y, w, h] = LAY.T_MAIN, A = [x + 90, y + h - 70], B = [x + w - 90, y + 90];
  inBox(g, `<div class="a" style="width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:${WH}"></div>`, A[0], A[1], S(9));
  inBox(g, `<div class="a" style="width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:${Y}"></div>`, B[0], B[1], S(9));
  lineIn(g, [A, B], R, S(9) + 0.1, 0.4, 10);
  inBox(g, `<div class="a w9 R ts" style="font-size:120px;line-height:1;margin:-60px 0 0 -40px">✕</div>`, (A[0] + B[0]) / 2, (A[1] + B[1]) / 2, S(9) + 0.5, { from: { scale: 2, y: 0 } });
  const curve = [[A[0], A[1]], [A[0] + 300, A[1]], [A[0] + 560, A[1] - 20], [B[0] - 40, A[1] - 120], [B[0], B[1] + 60], [B[0], B[1]]];
  lineIn(g, curve, G, W(9, "돌아가라") - 0.2, 0.9, 12);
  inBox(g, `<div class="a w9 G ts" style="font-size:120px;line-height:1;margin:-60px 0 0 -40px">✓</div>`, B[0] - 140, A[1] - 60, W(9, "돌아가라") + 0.7, { from: { scale: 2, y: 0 } });
  K.cut(E(9) - 0.1, "S-09 돌아가는 길 ✓");
}
/* S-10 욕심을 버리고·리스크 대비·천천히 → 승리자 (문장 10) */
{
  const a = until(10), b = until(11);
  let HP;
  const { sc, st } = stage(a, b, "CAFE", s => { HP = act(s, "H_PLAN", "P_C", 4.4).ro(5); });
  st.update = t => { enter(HP, t, a + 0.1); idle(HP, t); };
  const g = box(sc, "T_CHART", "", PANEL_CSS); pop(g, S(10) + 0.05);
  const [x, y, w, h] = LAY.T_CHART;
  const P = [[0, 0.86], [0.1, 0.80], [0.18, 0.83], [0.3, 0.70], [0.4, 0.73], [0.52, 0.58], [0.6, 0.61], [0.72, 0.46], [0.82, 0.48], [0.92, 0.36], [1, 0.30]];
  lineIn(g, P.map(([u, v]) => [x + 60 + (w - 120) * u, y + 40 + (h - 80) * v]), G, W(10, "천천히") - 0.6, Math.max(1.6, W(10, "승리자") - W(10, "천천히")), 12);
  inBox(g, tag("RISK ▼", G, 46).replace('class="tag2"', 'class="tag2 a"'), x + 40, y + 34, W(10, "리스크") - 0.1);
  inBox(g, tag("SLOW", Y, 46).replace('class="tag2"', 'class="tag2 a"'), x + 380, y + 34, W(10, "천천히") - 0.1);
  inBox(g, stampH("WIN", Y, -8).replace('class="stamp"', 'class="stamp a"'), x + 520, y + 250, W(10, "승리자") - 0.1, { from: { scale: 2.2, y: 0, opacity: 0 } });
  headMark(st, sc, "HEAD_C", () => HP, `<span class="G">✓</span>`, W(10, "승리자"));
  K.cut(E(10) - 0.1, "S-10 SLOW → WIN");
}
/* S-11 다른 테스트 — 롱폼 카드 ▶ + SUBSCRIBE (문장 11 · 끝 화면) */
{
  const a = until(11), b = K.D;
  let HB;
  const { sc, st } = stage(a, b, "PAPER", s => { HB = act(s, "H_BOW", "P_C", 4.4).ro(5); }, { keep: true });
  st.update = t => { enter(HB, t, a + 0.1); };
  const card = box(sc, "E_CARD", `<div class="card a" style="inset:0"><img alt="" src="../../../stock/source/ppalli-test-2026-11/thumbnails/thumbnail_1.jpg"><div class="play"><svg viewBox="0 0 60 60" width="64" height="64" aria-hidden="true"><path d="M18 10 L50 30 L18 50 Z" fill="#fff"/></svg></div></div>`);
  pop(card, S(11) + 0.05, { from: { scale: 0.85, y: 0 } });
  const btn = boxC(sc, "E_BTN", `<div class="btn sub">SUBSCRIBE</div>`, W(11, "구독하고") - 0.2);
  press(btn.firstElementChild, W(11, "구독하고") + 0.2);
  K.cut(E(11) - 0.1, "S-11 카드 ▶ · SUBSCRIBE");
  K.cut(K.D - 0.3, "끝 화면");
}
K.done();
})();
