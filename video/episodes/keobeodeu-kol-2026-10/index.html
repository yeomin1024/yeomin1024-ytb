// ---------- 동전이 흐르는 그림 (반복) ----------
function coinFlow(parent, x0, y0, x1, y1, at, until, n, size) {
  const cs = [];
  for (let i = 0; i < n; i++) cs.push(el(`<div class="a" style="left:${x0}px;top:${y0}px">${IC.coin(size || 60)}</div>`, parent));
  const per = 0.9, gap = 0.45, reps = Math.max(0, Math.floor((until - at - per) / (gap * n)));
  cs.forEach((c, i) => tl.fromTo(c, { x: 0, y: 0, opacity: 0 }, { x: x1 - x0, y: y1 - y0, opacity: 1, duration: per, ease: "power1.in", repeat: reps, repeatDelay: gap * n - per }, at + i * gap));
  return cs;
}

    <div class="big tab" style="font-size:96px;color:#FFE680" id="o2">${money(TX.out_total)}</div></div>`, sc);
  pop(outBox, S("15%를 떼면")); tl.fromTo(outBox.querySelector("#o2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, W("15%를 떼면", "9만"));
  const H = 600, MX = 600000, base = 900;
  const vb = (x, v, col, at, tk) => {
    const h = v / MX * H;
    const bb = el(`<div class="vbar" style="left:${x}px;top:${base - h}px;width:240px;height:${h}px;background:${col}"></div>`, sc);

    const tkx = el(`<div class="a c" style="left:${x - 60}px;width:360px;top:${base + 20}px">${tk}</div>`, sc);
    pop(tkx, at);
  };
  vb(1060, TX.b_end, BL, W("QQQ 계좌도 그만큼만", "56만"), QQ(48));
  vb(1480, TX.a_end, OR, W("주식 수가 같아서", "7만"), QY(48));
  cut(E("주식 수가 같아서") - 0.2, "다른 조건 — 원천징수 15%");
  const sc2 = K.scene(s116 - 0.15, b + 0.5);
  const hd = el(`<div class="a row" style="left:120px;top:120px;gap:20px">${IC.coin(110)}${IC.loop(110)}<span class="tag b" style="font-size:64px">BUY</span></div>`, sc2);
  pop(hd, s116);
  const MX2 = 1000000, H2 = 640, base2 = 920;
  const vb2 = (x, v, col, at, tk) => {
    const h = v / MX2 * H2;
    const bb = el(`<div class="vbar" style="left:${x}px;top:${base2 - h}px;width:260px;height:${h}px;background:${col}"></div>`, sc2);
    K.grow(bb, at, 0.8, "y");
    const lab = el(`<div class="a big tab c" style="left:${x - 60}px;width:380px;top:${base2 - h - 74}px;font-size:60px">${money(v)}</div>`, sc2);
    pop(lab, at + 0.3);
    const tkx = el(`<div class="a c" style="left:${x - 60}px;width:380px;top:${base2 + 18}px">${tk}</div>`, sc2);
    pop(tkx, at);
  };
  vb2(820, RV.a_end, OR, W("QYLD는 29만", "29만"), QY(48));
  vb2(1300, RV.b_end, BL, W("QYLD는 29만", "94만"), QQ(48));
  const x3 = el(`<div class="a big tab" style="left:200px;top:420px;font-size:130px;color:#FFD400">×${f2(RV.b_over_a)}</div>`, sc2);
  pop(x3, W("다시 매수해도, QQQ 쪽이", "3.25배"), { from: { scale: 0.6, y: 0 } });
  cut(b - 0.2, "다른 조건 — 다시 매수");
}

// =====================================================================================================================
// 정리 (s119~s124)
// =====================================================================================================================
{
  const a = PS("정리"), b = PS("한계");
  const sc = K.scene(a - 0.2, b - 0.4);
  const boxes = (v, col) => `<div class="boxes" style="margin-top:0">${Array.from({ length: 6 }, (_, j) => `<i><b style="background:${col};height:${(clamp(v / INIT - j, 0, 1) * 100).toFixed(1)}%"></b></i>`).join("")}</div>`;
  const c1 = el(`<div class="card2" style="left:70px;top:110px;width:860px;height:360px;display:grid;align-content:center;justify-items:center;gap:26px">
    <div class="row" style="gap:20px">${QY(52)}<span class="big tab" style="font-size:90px;color:#FF6B78">${pc(SUM.a_vs_initial - 1)}</span></div>${boxes(SUM.a_end, "rgba(255,138,61,.85)")}
    <div class="big tab" style="font-size:44px;color:#C9D2E2">${SUM.start.slice(0, 4)} → ${SUM.end.slice(0, 4)}</div></div>`, sc);
  const c2 = el(`<div class="card2" style="left:990px;top:110px;width:860px;height:360px;display:grid;align-content:center;justify-items:center;gap:26px">
    <div class="row" style="gap:20px">${QQ(52)}<span class="big tab" style="font-size:90px;color:${MI}">×${SUM.b_vs_initial.toFixed(1)}</span></div>${boxes(SUM.b_end, "rgba(90,180,255,.85)")}
    <div class="row" style="gap:12px">${IC.coin(48)}<span class="big tab" style="font-size:44px;color:#FFE680">= ${money(SUM.out_total)}</span></div></div>`, sc);
  const R5 = CC.rolling["5y"], R3 = CC.rolling["3y"], CK = CC.checks;
  const c3 = el(`<div class="card2" style="left:70px;top:520px;width:560px;height:380px;display:grid;align-content:center;justify-items:center;gap:24px">${IC.cal(80)}
    <div class="big tab" style="font-size:54px;color:${MI}">${R5.b_gt_a}/${R5.windows} ✓</div><div class="big tab" style="font-size:54px;color:${MI}">${R3.b_gt_a}/${R3.windows} ✓</div></div>`, sc);
  const c4 = el(`<div class="card2" style="left:680px;top:520px;width:560px;height:380px;display:grid;align-content:center;gap:26px;padding:0 40px">
    <div class="row" style="gap:14px">${TK("XYLD", "q", 40)}<span class="big tab" style="font-size:52px;color:${MI}">${pc(CK.xyld.a_end / INIT - 1)}</span><span class="big" style="font-size:52px">&lt;</span>${TK("SPY", "s", 40)}</div>
    <div class="row" style="gap:14px">${TK("JEPI", "q", 40)}<span class="big tab" style="font-size:52px;color:${MI}">${pc(CK.jepi.a_end / INIT - 1)}</span><span class="big" style="font-size:52px">&lt;</span>${TK("SPY", "s", 40)}</div></div>`, sc);
  const cap = CC.capture;
  const c5 = el(`<div class="card2" style="left:1290px;top:520px;width:560px;height:380px;display:grid;align-content:center;gap:34px;padding:0 40px">
    <div class="row" style="gap:16px">${IC.up(70)}<span class="big tab" style="font-size:64px">${pcu(cap.up_capture)}</span></div>
    <div class="row" style="gap:16px">${IC.dn(70)}<span class="big tab" style="font-size:64px">${pcu(cap.down_capture)}</span></div></div>`, sc);
  pop(c1, S("분배금을 매달 꺼내 쓴 QYLD 계좌는")); pop(c2, S("같은 돈을 매도해서 꺼낸 QQQ 계좌는")); pop(c3, S("시작 달을 바꾼 계좌에서도, 모두"));
  pop(c4, S("XYLD와 JEPI는 원금이 줄지 않았지만")); pop(c5, S("오를 때는 덜 오르고"));
  cut(E("오를 때는 덜 오르고") - 0.2, "정리 — 카드 5개");
}
// =====================================================================================================================
// 한계 (s125~s129)
// =====================================================================================================================
{
  const a = PS("한계"), b = PS("마무리");
  const sc = K.scene(a - 0.2, b - 0.4);
  const c = (x, html, at) => { const n = el(`<div class="card2" style="left:${x}px;top:250px;width:400px;height:440px;display:grid;place-items:center;align-content:center;gap:28px">${html}</div>`, sc); pop(n, at); return n; };
  c(90, `${IC.up(130, MI)}<span class="big tab" style="font-size:52px">${SUM.start.slice(0, 4)} → ${SUM.end.slice(0, 4)}</span>`, a);
  c(540, `<span class="row" style="gap:8px">${IC.flat(130)}<span class="big" style="font-size:110px;color:#FFD400">?</span></span>`, S("주가가 오래 제자리였던 기간이라면"));
  c(990, `<span class="row" style="gap:14px">${IC.cal(100)}<span class="big" style="font-size:70px;color:#93A0B8">≈</span>${IC.cal(100)}</span><span class="row" style="gap:10px">${IC.coin(60)}</span>`, S("분배금은 지급일이 아니라"));
  c(1440, `<span class="row" style="gap:6px">${IC.ban(110, IC.cpi)}${IC.ban(110, IC.fx)}</span>${IC.ban(110, IC.receipt)}`, S("물가와 환율, 나라마다 다른 세금은"));
  cut(S("투자 권유가 아니라") + 1.2, "한계");
}
// =====================================================================================================================
// 마무리
// =====================================================================================================================
{
  const a = PS("마무리");
  const sc = K.scene(a - 0.2, EP.duration + 1, { keep: true });
  const c = el(`<div class="a flexc" style="left:0;width:1920px;top:330px;gap:40px">${IC.chat(220)}<span class="big" style="font-size:200px;color:#FFD400">?</span></div>`, sc);
  pop(c, a);
  const end = el(`<div class="a flexc" style="left:0;width:1920px;top:690px;gap:30px">${QY(64)}${IC.coin(90)}${QQ(64)}</div>`, sc);
  pop(end, S("시청해주셔서 감사합니다"));
  cut(S("시청해주셔서 감사합니다") + 0.8, "마무리");
}

CUTQ.sort((x, y) => x[0] - y[0]).forEach(([t, n]) => K.cut(t, n));

})();
