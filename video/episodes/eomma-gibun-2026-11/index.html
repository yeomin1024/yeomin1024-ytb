<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"eomma-gibun-2026-11","topic":"psychology","duration":464.47,"audio":"../../../psychology/source/eomma-gibun-2026-11/narration.mp3","thumb":null,"synced":"2026-11-13T08:50:43Z","tts":"2026-11-13T07:19:13","script_sha1":"42f8e1c4da95b6bd","sent":[{"n":1,"part":"도입","text":"어릴 때 현관문을 열기 전에, 집 안에서 엄마 목소리부터 들어 본 적이 있으신가요?","start":0.3,"end":5.001},{"n":2,"part":"도입","text":"목소리가 밝으면 마음을 놓고, 가라앉아 있으면 엄마 곁에 앉아 이야기를 들어 드렸습니다.","start":5.381,"end":10.821},{"n":3,"part":"도입","text":"엄마가 한숨을 쉬면, 내가 뭘 잘못했는지부터 떠올렸습니다.","start":11.201,"end":15.071},{"n":4,"part":"도입","text":"이런 아이는 커서 어떤 어른이 될까요?","start":15.451,"end":17.633},{"n":5,"part":"도입","text":"결론부터 말씀드리겠습니다.","start":18.013,"end":19.543},{"n":6,"part":"도입","text":"이렇게 자란 사람에게서 자주 이야기되는 특징은 다섯 가지입니다.","start":19.923,"end":23.512},{"n":7,"part":"도입","text":"첫째, 남의 표정과 말투를 빨리 알아챕니다.","start":23.892,"end":26.739},{"n":8,"part":"도입","text":"둘째, 부탁을 거절하기 어렵습니다.","start":27.119,"end":29.719},{"n":9,"part":"도입","text":"셋째, 내 기분은 뒤로 미루고, 잘 말하지 못합니다.","start":30.099,"end":33.704},{"n":10,"part":"도입","text":"넷째, 쉬고 있으면 괜히 마음이 불편합니다.","start":34.084,"end":36.963},{"n":11,"part":"도입","text":"다섯째, 남을 돌보는 일은 잘합니다.","start":37.343,"end":39.763},{"n":12,"part":"도입","text":"마지막 다섯 번째는 오히려 강점이 될 수 있습니다.","start":40.143,"end":43.077},{"n":13,"part":"도입","text":"다섯 가지는 해외 상담 전문가들의 글에 나오는 모습이고, 글 목록은 설명란에 두겠습니다.","start":43.457,"end":49.03},{"n":14,"part":"도입","text":"그러니 나와 맞는 것만 가져가시면 됩니다.","start":49.41,"end":51.622},{"n":15,"part":"도입","text":"엄마를 탓하자는 것이 아니라, 내가 힘들었던 마음을 알아보자는 이야기입니다.","start":52.002,"end":56.407},{"n":16,"part":"도입","text":"엄마를 예로 들었지만, 아빠나 다른 어른이었어도 비슷할 수 있습니다.","start":56.787,"end":61.039},{"n":17,"part":"도입","text":"이미 이렇게 살고 있다면 지금 해 볼 수 있는 것도 끝에 정리해 드리겠습니다.","start":61.419,"end":65.549},{"n":18,"part":"도입","text":"먼저 이런 어린 시절과 가까운 심리학 말부터 보겠습니다.","start":65.929,"end":69.052},{"n":19,"part":"먼저 알아 둘 말, 부모화","text":"아이가 부모 역할을 대신 떠맡는 것을 심리학에서는 부모화라고 부릅니다.","start":70.052,"end":74.449},{"n":20,"part":"먼저 알아 둘 말, 부모화","text":"다만 자기 나이에 감당하기 힘들 만큼, 오랫동안 떠맡을 때를 말합니다.","start":74.829,"end":79.153},{"n":21,"part":"먼저 알아 둘 말, 부모화","text":"동생을 돌보거나 집안일을 떠맡는 것은 눈에 보이는 부모화입니다.","start":79.533,"end":84.016},{"n":22,"part":"먼저 알아 둘 말, 부모화","text":"엄마의 기분을 달래고, 엄마의 고민을 들어 주는 것은 눈에 잘 보이지 않는 부모화입니다.","start":84.396,"end":89.856},{"n":23,"part":"먼저 알아 둘 말, 부모화","text":"이것을 정서적 부모화라고 합니다.","start":90.236,"end":92.189},{"n":24,"part":"먼저 알아 둘 말, 부모화","text":"가끔 동생을 보거나 엄마 이야기를 들어 준 것까지 부모화라고 하지는 않습니다.","start":92.569,"end":96.916},{"n":25,"part":"먼저 알아 둘 말, 부모화","text":"2023년, 연구 95편을 모은 정리 논문이 있습니다.","start":97.296,"end":101.306},{"n":26,"part":"먼저 알아 둘 말, 부모화","text":"부모화를 많이 겪었다는 사람일수록 불안이나 우울이 많았습니다.","start":101.686,"end":105.926},{"n":27,"part":"먼저 알아 둘 말, 부모화","text":"연구진은 수고를 인정받고 기댈 사람이 있으면, 더 단단해질 수 있다고 봤습니다.","start":106.306,"end":111.595},{"n":28,"part":"먼저 알아 둘 말, 부모화","text":"그러니 모두 같은 어른이 되는 것도, 이런 모습이 있다고 꼭 그렇게 자란 것도 아닙니다.","start":111.975,"end":116.875},{"n":29,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"첫 번째 특징은, 남의 표정과 말투를 빨리 알아챈다는 것입니다.","start":117.875,"end":121.53},{"n":30,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"회의실에 들어가면 누가 기분이 안 좋은지 바로 알아채곤 합니다.","start":121.91,"end":125.47},{"n":31,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"카톡 답장에 마침표 하나만 달라져도 신경이 쓰입니다.","start":125.85,"end":129.025},{"n":32,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"어릴 때 엄마의 기분은 그날 집안 분위기를 정하는 날씨와 같았을 수 있습니다.","start":129.405,"end":133.496},{"n":33,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"그래서 날씨를 미리 읽는 눈이 일찍 길러졌을 수 있습니다.","start":133.876,"end":137.116},{"n":34,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"문제는 알아챈 것을 자꾸 '나 때문'으로 읽기 쉽다는 것입니다.","start":137.496,"end":140.987},{"n":35,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"아무 일도 없는데 '혹시 나 때문인가' 하고 먼저 걱정합니다.","start":141.367,"end":144.697},{"n":36,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"상대가 그냥 피곤해서 말이 짧았던 것인데도, 내가 뭘 잘못했는지 되짚어 봅니다.","start":145.077,"end":150.061},{"n":37,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"그래서 사람을 만나고 오면 유난히 지치기 쉽습니다.","start":150.441,"end":153.418},{"n":38,"part":"첫 번째 특징, 표정을 빨리 알아챔","text":"한마디로, 남의 기분을 읽는 눈이 너무 일찍, 너무 밝게 켜졌을 수 있습니다.","start":153.798,"end":158.566},{"n":39,"part":"두 번째 특징, 거절이 어려움","text":"두 번째 특징은, 부탁을 거절하기 어렵다는 것입니다.","start":159.566,"end":162.806},{"n":40,"part":"두 번째 특징, 거절이 어려움","text":"동료가 일을 떠넘겨도 \"괜찮아요\"가 먼저 나옵니다.","start":163.186,"end":166.42},{"n":41,"part":"두 번째 특징, 거절이 어려움","text":"친구가 돈을 빌려 달라고 하면, 형편이 어려워도 마련해 주기도 합니다.","start":166.8,"end":170.86},{"n":42,"part":"두 번째 특징, 거절이 어려움","text":"거절하면 상대가 실망하고, 그러면 관계가 끝날 것 같은 마음이 듭니다.","start":171.24,"end":175.691},{"n":43,"part":"두 번째 특징, 거절이 어려움","text":"어릴 때 엄마를 실망시키는 것이 가장 무서운 일이었다면 더 그럴 수 있습니다.","start":176.071,"end":180.551},{"n":44,"part":"두 번째 특징, 거절이 어려움","text":"엄마가 실망하면 집안 공기까지 무거워졌을 수 있습니다.","start":180.931,"end":184.107},{"n":45,"part":"두 번째 특징, 거절이 어려움","text":"그 두려움이 상사와 친구와 배우자에게로 옮겨 왔을 수 있습니다.","start":184.487,"end":188.026},{"n":46,"part":"두 번째 특징, 거절이 어려움","text":"그래서 남의 일까지 떠안아 자주 바쁘고 지치기 쉽습니다.","start":188.406,"end":191.957},{"n":47,"part":"두 번째 특징, 거절이 어려움","text":"한마디로, 성격이나 직장 탓도 있겠지만, 관계를 잃을까 두려워 거절이 어려울 수 있습니다.","start":192.337,"end":197.827},{"n":48,"part":"세 번째 특징, 내 기분은 뒤로","text":"세 번째 특징은, 내 기분은 뒤로 미루고 잘 말하지 못한다는 것입니다.","start":198.827,"end":203.066},{"n":49,"part":"세 번째 특징, 내 기분은 뒤로","text":"누가 \"너는 괜찮아?\" 하고 물으면 오히려 당황합니다.","start":203.446,"end":206.733},{"n":50,"part":"세 번째 특징, 내 기분은 뒤로","text":"내가 괜찮은지 생각해 볼 틈이 별로 없었을 수 있습니다.","start":207.113,"end":210.113},{"n":51,"part":"세 번째 특징, 내 기분은 뒤로","text":"어릴 때 집에서 가장 중요한 것이 엄마의 기분이었다면, 내 기분은 삼키게 될 수 있습니다.","start":210.493,"end":215.926},{"n":52,"part":"세 번째 특징, 내 기분은 뒤로","text":"내 기분을 말하면 엄마가 더 힘들어질 것 같았을 수 있습니다.","start":216.306,"end":219.925},{"n":53,"part":"세 번째 특징, 내 기분은 뒤로","text":"그렇게 오래 삼키다 보면, 나중에는 내가 무엇을 느끼는지도 잘 모르게 되기도 합니다.","start":220.305,"end":225.165},{"n":54,"part":"세 번째 특징, 내 기분은 뒤로","text":"국내 20대 387명 설문에서도, 부모화를 많이 겪은 사람이 속마음을 누르는 편이었습니다.","start":225.545,"end":231.512},{"n":55,"part":"세 번째 특징, 내 기분은 뒤로","text":"서운한 일이 있어도 '내가 참으면 되지' 하고 넘깁니다.","start":231.892,"end":235.051},{"n":56,"part":"세 번째 특징, 내 기분은 뒤로","text":"그러다 혼자 있을 때 갑자기 눈물이 나기도 합니다.","start":235.431,"end":238.151},{"n":57,"part":"세 번째 특징, 내 기분은 뒤로","text":"힘든 일이 쌓여도 말하지 않다가, 어느 날 한꺼번에 무너지기도 합니다.","start":238.531,"end":242.441},{"n":58,"part":"세 번째 특징, 내 기분은 뒤로","text":"결혼한 뒤에는 배우자와의 사이에서도 같은 일이 생길 수 있습니다.","start":242.821,"end":246.541},{"n":59,"part":"세 번째 특징, 내 기분은 뒤로","text":"배우자가 \"서운했으면 왜 말을 안 했어\" 하고 물으면, 이렇게 답합니다.","start":246.921,"end":251.131},{"n":60,"part":"세 번째 특징, 내 기분은 뒤로","text":"\"말해도 되는 줄 몰랐어.\"","start":251.511,"end":252.864},{"n":61,"part":"세 번째 특징, 내 기분은 뒤로","text":"상대는 몰랐다는 사실에 놀라고, 나는 말하지 못한 내가 답답해집니다.","start":253.244,"end":257.521},{"n":62,"part":"세 번째 특징, 내 기분은 뒤로","text":"물론 말해도 들어 주지 않는 상대라서, 또는 원래 말수가 적어서일 수도 있습니다.","start":257.901,"end":262.721},{"n":63,"part":"세 번째 특징, 내 기분은 뒤로","text":"한마디로, 내 마음을 말하는 연습을 할 기회가 적었을 수 있습니다.","start":263.101,"end":267.058},{"n":64,"part":"네 번째 특징, 쉬면 불편함","text":"네 번째 특징은, 쉬고 있으면 괜히 마음이 불편하다는 것입니다.","start":268.058,"end":272.178},{"n":65,"part":"네 번째 특징, 쉬면 불편함","text":"주말에 늦잠을 자면 하루를 버린 것 같습니다.","start":272.558,"end":275.058},{"n":66,"part":"네 번째 특징, 쉬면 불편함","text":"아무것도 안 하고 누워 있으면, 누가 뭐라고 하지 않아도 마음이 불편합니다.","start":275.438,"end":280.148},{"n":67,"part":"네 번째 특징, 쉬면 불편함","text":"물론 바쁜 사람이라면 누구나 쉬면 불편할 수 있습니다.","start":280.528,"end":283.96},{"n":68,"part":"네 번째 특징, 쉬면 불편함","text":"여기서 말하는 것은, 쉬고 있는 나를 쓸모없다고 느끼는 마음입니다.","start":284.34,"end":288.257},{"n":69,"part":"네 번째 특징, 쉬면 불편함","text":"어릴 때 엄마를 도울 때만 인정받는다고 느꼈다면, 그럴 수 있습니다.","start":288.637,"end":292.725},{"n":70,"part":"네 번째 특징, 쉬면 불편함","text":"혼자 있는 휴일에도, 청소나 할 일부터 찾아 몸을 움직입니다.","start":293.105,"end":297.115},{"n":71,"part":"네 번째 특징, 쉬면 불편함","text":"그러다 몸이 먼저 지쳐 버리기도 합니다.","start":297.495,"end":299.525},{"n":72,"part":"네 번째 특징, 쉬면 불편함","text":"한마디로, 쉬는 것도 허락을 받아야 한다고 느끼고 있을 수 있습니다.","start":299.905,"end":303.979},{"n":73,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"다섯 번째 특징은, 남을 돌보는 일은 잘한다는 것입니다.","start":304.979,"end":308.468},{"n":74,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"누가 힘들어하면 말하기 전에 먼저 챙겨 줍니다.","start":308.848,"end":311.478},{"n":75,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"모임에서 혼자 있는 사람이 있으면 먼저 말을 걸어 줍니다.","start":311.858,"end":314.888},{"n":76,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"아픈 가족이 생기면 가장 먼저 병원을 알아보고 일정을 짭니다.","start":315.268,"end":318.982},{"n":77,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"반대로 돌보는 일에 지쳐, 아예 피하게 된 사람도 있습니다.","start":319.362,"end":323.112},{"n":78,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"남을 챙기는 힘은 잘 쓰면 큰 장점이 됩니다.","start":323.492,"end":326.335},{"n":79,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"문제는 이 힘을 남에게만 쓰고, 나에게는 잘 쓰지 않기 쉽다는 것입니다.","start":326.715,"end":330.984},{"n":80,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"한마디로, 돌보는 힘은 그대로 두고, 그 대상에 나를 넣으면 됩니다.","start":331.364,"end":335.704},{"n":81,"part":"다섯 번째 특징, 돌보는 일을 잘함","text":"그렇다면 이미 이렇게 살고 있는 사람은 무엇부터 해 볼 수 있을까요?","start":336.084,"end":339.634},{"n":82,"part":"지금 해 볼 수 있는 것","text":"첫 번째로, 하루에 한 번 내 기분에 이름을 붙여 보세요.","start":340.634,"end":343.978},{"n":83,"part":"지금 해 볼 수 있는 것","text":"'피곤하다', '서운하다', '기쁘다'처럼 한 낱말이면 충분합니다.","start":344.358,"end":348.178},{"n":84,"part":"지금 해 볼 수 있는 것","text":"남의 기분을 읽던 눈을 하루에 한 번만 나에게 돌리는 연습입니다.","start":348.558,"end":352.347},{"n":85,"part":"지금 해 볼 수 있는 것","text":"두 번째로, 작은 부탁부터 거절해 보세요.","start":352.727,"end":355.407},{"n":86,"part":"지금 해 볼 수 있는 것","text":"\"이번에는 어려워요\" 한마디면 되고, 까닭을 길게 대지 않아도 됩니다.","start":355.787,"end":360.045},{"n":87,"part":"지금 해 볼 수 있는 것","text":"작은 거절 뒤에도 관계가 이어지는지, 직접 확인해 보는 것이 중요합니다.","start":360.425,"end":364.771},{"n":88,"part":"지금 해 볼 수 있는 것","text":"처음 몇 번은 마음이 불편할 수 있습니다.","start":365.151,"end":367.584},{"n":89,"part":"지금 해 볼 수 있는 것","text":"세 번째로, 이 문장을 기억해 두세요.","start":367.964,"end":370.363},{"n":90,"part":"지금 해 볼 수 있는 것","text":"'엄마의 기분은 엄마의 몫이다.'","start":370.743,"end":372.642},{"n":91,"part":"지금 해 볼 수 있는 것","text":"엄마를 사랑하지 않아서가 아닙니다.","start":373.022,"end":374.94},{"n":92,"part":"지금 해 볼 수 있는 것","text":"어른의 기분은 어른이 스스로 돌봐야 한다는 뜻입니다.","start":375.32,"end":378.246},{"n":93,"part":"지금 해 볼 수 있는 것","text":"그 짐이 엄마에게도 무거웠겠지만, 그렇다고 내가 대신 질 짐은 아닙니다.","start":378.626,"end":383.126},{"n":94,"part":"지금 해 볼 수 있는 것","text":"엄마가 전화로 하소연을 하면, 들어 주더라도 해결까지 내가 떠안지 않아도 됩니다.","start":383.506,"end":388.441},{"n":95,"part":"지금 해 볼 수 있는 것","text":"\"엄마 많이 속상했구나\"까지만 말해도 곁에 있어 주는 것입니다.","start":388.821,"end":392.946},{"n":96,"part":"지금 해 볼 수 있는 것","text":"듣기 힘든 날은 \"오늘은 여기까지 들을게\" 하고 끊어도 됩니다.","start":393.326,"end":397.101},{"n":97,"part":"지금 해 볼 수 있는 것","text":"엄마가 너무 힘들어 보이면, 내가 다 받는 대신 상담 전화나 병원을 알려 드리면 됩니다.","start":397.481,"end":402.554},{"n":98,"part":"지금 해 볼 수 있는 것","text":"이미 거리를 두고 지내는 분이라면, 그것도 나를 지키는 방법의 하나일 수 있습니다.","start":402.934,"end":407.924},{"n":99,"part":"지금 해 볼 수 있는 것","text":"잠이나 식사, 일이 무너질 만큼 힘든 날이 2주 넘게 이어진다면 혼자 견디지 마세요.","start":408.304,"end":413.811},{"n":100,"part":"지금 해 볼 수 있는 것","text":"2주가 안 됐어도 견디기 어렵다면, 그때도 도움을 받으셔도 됩니다.","start":414.191,"end":418.34},{"n":101,"part":"지금 해 볼 수 있는 것","text":"가까운 정신건강의학과나 정신건강복지센터에 전화로 먼저 물어보시면 됩니다.","start":418.72,"end":424.211},{"n":102,"part":"지금 해 볼 수 있는 것","text":"예약이 밀려도 바로 걸 수 있는 24시간 상담 전화를 설명란에 적어 두겠습니다.","start":424.591,"end":429.461},{"n":103,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":430.461,"end":433.348},{"n":104,"part":"정리","text":"어릴 때 엄마 기분부터 살피던 사람에게서 자주 이야기되는 특징은 다섯 가지였습니다.","start":433.728,"end":438.468},{"n":105,"part":"정리","text":"첫째, 남의 표정과 말투를 빨리 알아챕니다.","start":438.848,"end":441.695},{"n":106,"part":"정리","text":"둘째, 부탁을 거절하기 어렵습니다.","start":442.075,"end":444.675},{"n":107,"part":"정리","text":"셋째, 내 기분은 뒤로 미루고 잘 말하지 못합니다.","start":445.055,"end":448.231},{"n":108,"part":"정리","text":"넷째, 쉬고 있으면 괜히 마음이 불편합니다.","start":448.611,"end":451.489},{"n":109,"part":"정리","text":"다섯째, 남을 돌보는 일은 잘합니다.","start":451.869,"end":454.289},{"n":110,"part":"정리","text":"오늘 하나만 해 보신다면, 자기 전에 내 기분을 한 낱말로 적거나 말해 보세요.","start":454.669,"end":459.657},{"n":111,"part":"정리","text":"시청해주셔서 감사합니다.","start":460.037,"end":461.567}],"subs":[[0.2,5.381,"어릴 때 현관문을 열기 전에,\n집 안에서 엄마 목소리부터 들어 본 적이 있으신가요?"],[5.381,11.201,"목소리가 밝으면 마음을 놓고,\n가라앉아 있으면 엄마 곁에 앉아 이야기를 들어 드렸습니다."],[11.201,15.451,"엄마가 한숨을 쉬면, 내가 뭘 잘못했는지부터 떠올렸습니다."],[15.451,18.013,"이런 아이는 커서 어떤 어른이 될까요?"],[18.013,19.923,"결론부터 말씀드리겠습니다."],[19.923,23.892,"이렇게 자란 사람에게서 자주 이야기되는 특징은 다섯 가지입니다."],[23.892,27.119,"첫째, 남의 표정과 말투를 빨리 알아챕니다."],[27.119,30.099,"둘째, 부탁을 거절하기 어렵습니다."],[30.099,34.084,"셋째, 내 기분은 뒤로 미루고, 잘 말하지 못합니다."],[34.084,37.343,"넷째, 쉬고 있으면 괜히 마음이 불편합니다."],[37.343,40.143,"다섯째, 남을 돌보는 일은 잘합니다."],[40.143,43.457,"마지막 다섯 번째는 오히려 강점이 될 수 있습니다."],[43.457,49.41,"다섯 가지는 해외 상담 전문가들의 글에 나오는 모습이고,\n글 목록은 설명란에 두겠습니다."],[49.41,52.002,"그러니 나와 맞는 것만 가져가시면 됩니다."],[52.002,56.787,"엄마를 탓하자는 것이 아니라,\n내가 힘들었던 마음을 알아보자는 이야기입니다."],[56.787,61.419,"엄마를 예로 들었지만, 아빠나 다른 어른이었어도 비슷할 수 있습니다."],[61.419,65.929,"이미 이렇게 살고 있다면\n지금 해 볼 수 있는 것도 끝에 정리해 드리겠습니다."],[65.929,70.052,"먼저 이런 어린 시절과 가까운 심리학 말부터 보겠습니다."],[70.052,74.829,"아이가 부모 역할을 대신 떠맡는 것을\n심리학에서는 부모화라고 부릅니다."],[74.829,79.533,"다만 자기 나이에 감당하기 힘들 만큼, 오랫동안 떠맡을 때를 말합니다."],[79.533,84.396,"동생을 돌보거나 집안일을 떠맡는 것은 눈에 보이는 부모화입니다."],[84.396,90.236,"엄마의 기분을 달래고,\n엄마의 고민을 들어 주는 것은 눈에 잘 보이지 않는 부모화입니다."],[90.236,92.569,"이것을 정서적 부모화라고 합니다."],[92.569,97.296,"가끔 동생을 보거나 엄마 이야기를\n들어 준 것까지 부모화라고 하지는 않습니다."],[97.296,101.686,"2023년, 연구 95편을 모은 정리 논문이 있습니다."],[101.686,106.306,"부모화를 많이 겪었다는 사람일수록 불안이나 우울이 많았습니다."],[106.306,111.975,"연구진은 수고를 인정받고 기댈 사람이 있으면,\n더 단단해질 수 있다고 봤습니다."],[111.975,117.875,"그러니 모두 같은 어른이 되는 것도,\n이런 모습이 있다고 꼭 그렇게 자란 것도 아닙니다."],[117.875,121.91,"첫 번째 특징은, 남의 표정과 말투를 빨리 알아챈다는 것입니다."],[121.91,125.85,"회의실에 들어가면 누가 기분이 안 좋은지 바로 알아채곤 합니다."],[125.85,129.405,"카톡 답장에 마침표 하나만 달라져도 신경이 쓰입니다."],[129.405,133.876,"어릴 때 엄마의 기분은 그날 집안 분위기를\n정하는 날씨와 같았을 수 있습니다."],[133.876,137.496,"그래서 날씨를 미리 읽는 눈이 일찍 길러졌을 수 있습니다."],[137.496,141.367,"문제는 알아챈 것을 자꾸 '나 때문'으로 읽기 쉽다는 것입니다."],[141.367,145.077,"아무 일도 없는데 '혹시 나 때문인가' 하고 먼저 걱정합니다."],[145.077,150.441,"상대가 그냥 피곤해서 말이 짧았던 것인데도,\n내가 뭘 잘못했는지 되짚어 봅니다."],[150.441,153.798,"그래서 사람을 만나고 오면 유난히 지치기 쉽습니다."],[153.798,159.566,"한마디로, 남의 기분을 읽는 눈이 너무 일찍,\n너무 밝게 켜졌을 수 있습니다."],[159.566,163.186,"두 번째 특징은, 부탁을 거절하기 어렵다는 것입니다."],[163.186,166.8,"동료가 일을 떠넘겨도 \"괜찮아요\"가 먼저 나옵니다."],[166.8,171.24,"친구가 돈을 빌려 달라고 하면, 형편이 어려워도 마련해 주기도 합니다."],[171.24,176.071,"거절하면 상대가 실망하고, 그러면 관계가 끝날 것 같은 마음이 듭니다."],[176.071,180.931,"어릴 때 엄마를 실망시키는 것이 가장 무서운 일이었다면\n더 그럴 수 있습니다."],[180.931,184.487,"엄마가 실망하면 집안 공기까지 무거워졌을 수 있습니다."],[184.487,188.406,"그 두려움이 상사와 친구와 배우자에게로 옮겨 왔을 수 있습니다."],[188.406,192.337,"그래서 남의 일까지 떠안아 자주 바쁘고 지치기 쉽습니다."],[192.337,198.827,"한마디로, 성격이나 직장 탓도 있겠지만,\n관계를 잃을까 두려워 거절이 어려울 수 있습니다."],[198.827,203.446,"세 번째 특징은, 내 기분은 뒤로 미루고 잘 말하지 못한다는 것입니다."],[203.446,207.113,"누가 \"너는 괜찮아?\" 하고 물으면 오히려 당황합니다."],[207.113,210.493,"내가 괜찮은지 생각해 볼 틈이 별로 없었을 수 있습니다."],[210.493,216.306,"어릴 때 집에서 가장 중요한 것이 엄마의 기분이었다면,\n내 기분은 삼키게 될 수 있습니다."],[216.306,220.305,"내 기분을 말하면 엄마가 더 힘들어질 것 같았을 수 있습니다."],[220.305,225.545,"그렇게 오래 삼키다 보면,\n나중에는 내가 무엇을 느끼는지도 잘 모르게 되기도 합니다."],[225.545,231.892,"국내 20대 387명 설문에서도,\n부모화를 많이 겪은 사람이 속마음을 누르는 편이었습니다."],[231.892,235.431,"서운한 일이 있어도 '내가 참으면 되지' 하고 넘깁니다."],[235.431,238.531,"그러다 혼자 있을 때 갑자기 눈물이 나기도 합니다."],[238.531,242.821,"힘든 일이 쌓여도 말하지 않다가, 어느 날 한꺼번에 무너지기도 합니다."],[242.821,246.921,"결혼한 뒤에는 배우자와의 사이에서도 같은 일이 생길 수 있습니다."],[246.921,251.511,"배우자가 \"서운했으면 왜 말을 안 했어\" 하고 물으면, 이렇게 답합니다."],[251.511,253.244,"\"말해도 되는 줄 몰랐어.\""],[253.244,257.901,"상대는 몰랐다는 사실에 놀라고, 나는 말하지 못한 내가 답답해집니다."],[257.901,263.101,"물론 말해도 들어 주지 않는 상대라서,\n또는 원래 말수가 적어서일 수도 있습니다."],[263.101,268.058,"한마디로, 내 마음을 말하는 연습을 할 기회가 적었을 수 있습니다."],[268.058,272.558,"네 번째 특징은, 쉬고 있으면 괜히 마음이 불편하다는 것입니다."],[272.558,275.438,"주말에 늦잠을 자면 하루를 버린 것 같습니다."],[275.438,280.528,"아무것도 안 하고 누워 있으면,\n누가 뭐라고 하지 않아도 마음이 불편합니다."],[280.528,284.34,"물론 바쁜 사람이라면 누구나 쉬면 불편할 수 있습니다."],[284.34,288.637,"여기서 말하는 것은, 쉬고 있는 나를 쓸모없다고 느끼는 마음입니다."],[288.637,293.105,"어릴 때 엄마를 도울 때만 인정받는다고 느꼈다면, 그럴 수 있습니다."],[293.105,297.495,"혼자 있는 휴일에도, 청소나 할 일부터 찾아 몸을 움직입니다."],[297.495,299.905,"그러다 몸이 먼저 지쳐 버리기도 합니다."],[299.905,304.979,"한마디로, 쉬는 것도 허락을 받아야 한다고 느끼고 있을 수 있습니다."],[304.979,308.848,"다섯 번째 특징은, 남을
