function pcam(W_, a, b, from, to, ease) {
  const xy = ([s, fx, fy]) => ({ scale: s, x: Math.min(0, Math.max(1920 - 1920 * s, 960 - fx * s)), y: Math.min(0, Math.max(1080 - 1280 * s, 540 - fy * s)) });
  tl.fromTo(W_.w, xy(from), Object.assign(xy(to), { duration: Math.max(0.1, b - a), ease: ease || "sine.inOut", immediateRender: false }), a);
  if (a <= W_.a + 0.01) gsap.set(W_.w, xy(from));
}
function prop(W_, key, cx, cy, size, t, layer) {          // 소품 사진 조각 (세계 안 — 카메라와 같이)
  const n = PSY.spr(W_.L[layer || "fly"], key, cx, cy, size, ";filter:drop-shadow(0 24px 30px rgba(0,0,0,.55))");
  tl.fromTo(n, { opacity: 0, y: cy + 60, scale: 0.9 }, { opacity: 1, y: cy, scale: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
  return n;
}
const pp = (n, t, s0) => { gsap.set(n, { opacity: 0 }); PSY.pop(n, t, s0); };   // 제 시각 전에는 투명
function panel(W_, t, out) {                              // 화면 고정 판 (PANEL 칸)
  const n = K.el(`<div class="ppan" data-slot="PANEL"></div>`, W_.sc);
  gsap.set(n, { opacity: 0 });
  tl.to(n, { opacity: 1, duration: 0.3 }, t);
  if (out) tl.to(n, { opacity: 0, duration: 0.3 }, out);
  return n;
}
