# 음악 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.0 — 2026-10-28 — 새로 (사용자 지시 2026-10-28 "시청자 페르소나 파일 생성하도록 해").
#   음악 채널 전제 = 작곡 AI 곡을 묶은 연주 플레이리스트 → 플레이리스트·배경음악 영상만 (제목 거르기 VIDEO_TITLE_RX — 아이돌 뮤직비디오·팬 댓글은 뺌).
#   묶음(stage) = 듣는 때(공부·작업 / 잠·휴식 / 이동·일상 / 추억 / 위로 / 독서·창작) — 스스로 말하는 단서라 자기 이야기 조건 없음(NEED_SELF=false).
#   한국어·영어를 따로 (SPLIT_LANG — 음악 분석이 한국·외국을 각자 안에서 견주는 것과 같음).
#   감사 2026-10-28 (audit 무작위 — Claude 가 읽음): '잠·휴식' 9/12 · '이동·일상' 7/12 → 'night·evening' 빼고 고침 · 나이는 밝힌 사람이 적어(한국어 81명) 페르소나별 연령은 읽지 않는다.

[personas]
VERSION = "v1.0"
RECENT_DAYS = 180
LANGS = ["한국어", "영어"]
SPLIT_LANG = true
MIN_SHARE = 0.08
COVER = 0.80
MIN_PERSONAS = 2
MAX_PERSONAS = 5
MIN_N = 30
NEED_SELF = false
VIDEO_TITLE_RX = 'playlist|플레이리스트|플리|bgm|\bhours?\b|시간|lo-?fi|로파이|piano|피아노|jazz|재즈|cafe|café|카페|study|공부|sleep|수면|relax|ambient|앰비언트|노동요|focus|집중|classical|클래식|instrumental|연주|chill|guitar|기타|bossa|보사노바|music for|beats|healing|힐링|매장음악|배경음악'
STOP = ["음악", "노래", "곡", "플리", "플레이리스트", "영상", "music", "song", "songs", "playlist", "video", "listen", "listening", "hear", "this", "these", "one", "much", "really", "always", "every", "time", "day", "today"]

# ---------------------------------------------------------------- 묶음 = 듣는 때 (위에서부터 먼저)
[[stage]]
key = "study_work"
name = "공부·작업하며 듣는"
strong = true
ko = '공부|작업|일할\s?때|일하면서|업무|노동요|과제|시험|코딩|집중|독서실|스터디'
en = '\b(study|studying|studied|work|working|focus|focusing|homework|exam|exams|coding|productive|concentrat\w*|essay|assignment)\b'

[[stage]]
key = "sleep_rest"
name = "잠들기 전·쉬며 듣는"
strong = true
ko = '(?<![가-힣])잠(?!깐|시|실|재|정|금|수|복|기)|자기\s?전|수면|잠들|휴식|쉬면서|쉴\s?때|힐링|편안|명상|요가'
en = '\b(sleep|sleeping|asleep|relax|relaxing|calm|calming|rest|unwind|peaceful|meditat\w*|yoga|bedtime|insomnia)\b'

[[stage]]
key = "daily"
name = "이동·카페·집안일 하며 듣는"
strong = false
ko = '운전|드라이브|출근|퇴근|카페|매장|가게|산책|요리|청소|설거지|집안일|아침|저녁|밤에|새벽'
en = '\b(drive|driving|commute|cafe|café|coffee|shop|store|walk|walking|cleaning|at night|late night|tonight|in the morning|morning coffee|on my way)\b'

[[stage]]
key = "memory"
name = "추억에 젖어 듣는"
strong = false
ko = '추억|그\s?시절|옛날|학창|어릴\s?적|어렸을|그립|생각나|향수'
en = '\b(nostalgi\w*|memories|memory|childhood|reminds me|back in|takes me back|old days|miss those)\b'

[[stage]]
key = "comfort"
name = "마음을 달래려 듣는"
strong = false
ko = '위로|힘들|우울|슬플|슬퍼|외로|눈물|불안|지칠|지친|괜찮아'
en = '\b(comfort\w*|depress\w*|anxiety|anxious|lonely|loneliness|tears|crying|cried|heal\w*|hard time|sad|stress\w*|grief)\b'

[[stage]]
key = "create"
name = "책·글·그림 하며 듣는"
strong = false
ko = '책\s?(읽|보)|독서|글\s?(쓰|을\s?쓰)|그림\s?(그리|을\s?그리)|창작|드로잉'
en = '\b(reading|read a book|writing|write|drawing|painting|sketch\w*|creative)\b'

# ---------------------------------------------------------------- 처지 (모든 댓글)
[[state]]
key = "repeat"
name = "매일·반복해서 듣는"
ko = '매일|하루\s?종일|반복|무한|계속\s?(듣|틀)|몇\s?번째|자주\s?(듣|와)'
en = '\b(every ?day|daily|on repeat|loop|looping|all day|every night|every morning|keep coming back|come back to)\b'

[[state]]
key = "ai_note"
name = "AI 곡인지 말함"
ko = 'AI|에이아이|인공지능|수노|suno|udio'
en = '\b(AI|A\.I\.|artificial|generated|suno|udio)\b'

[[state]]
key = "rain_season"
name = "비·계절과 함께"
ko = '비\s?(오는|올\s?때|내리)|빗소리|봄\s?(날|밤|비|바람|에|이\s?오)|여름|가을|겨울|눈\s?(오는|내리)'
en = '\b(rain|rainy|autumn|fall(?!\s+(asleep|apart|in love|into|for))|winter|spring|summer|snow\w*)\b'

[[state]]
key = "gaming"
name = "게임하며"
ko = '게임'
en = '\b(gaming|game|games|minecraft|zelda|genshin)\b'

[[state]]
key = "request"
name = "더 길게·다음 편 요청"
ko = '더\s?(길게|올려|만들어)|\d+\s?시간\s?(버전|짜리)|다음\s?(편|플리)|2탄|모음\s?(도|좀)'
en = '\b(longer|part 2|more of this|10 hours?|extended|please make|next one|vol\.? ?2)\b'

[[state]]
key = "abroad"
name = "다른 나라에서 들음"
ko = '해외|외국|미국에서|일본에서|유학'
en = '\b(from (brazil|mexico|india|indonesia|philippines|vietnam|turkey|germany|france|japan|korea|spain|italy|poland|argentina|chile|peru|colombia)|greetings from|love from)\b'

# ---------------------------------------------------------------- 지식 (음악 용어)
[know]
basic = ["피아노", "재즈", "클래식", "로파이", "기타", "보사노바", "앰비언트", "첼로", "바이올린", "오케스트라", "OST", "BGM"]
basic_en = ["piano", "jazz", "classical", "lofi", "lo-fi", "guitar", "bossa nova", "ambient", "cello", "violin", "orchestra", "soundtrack", "OST", "BGM"]
advanced = ["코드 진행", "화성", "템포", "편곡", "믹싱", "마스터링", "리버브", "보이싱", "스케일", "조성", "녹턴", "쇼팽", "드뷔시", "사티", "바흐", "모차르트", "지브리", "히사이시", "왈츠", "소나타"]
advanced_en = ["chord", "chords", "progression", "voicing", "reverb", "mixing", "mastering", "bpm", "tempo", "arrangement", "harmony", "melody", "key of", "nocturne", "chopin", "debussy", "satie", "bach", "mozart", "ghibli", "hisaishi", "waltz", "sonata", "modal"]

# ---------------------------------------------------------------- 좋아함
[[like]]
key = "mood"
name = "분위기·감성"
ko = '분위기|감성|무드|느낌|잔잔'
en = '\b(vibe|vibes|mood|atmosphere|aesthetic|cozy|chill)\b'

[[like]]
key = "flow"
name = "선곡·흐름"
ko = '선곡|곡\s?(하나하나|들이)|흐름|끊김\s?없|이어'
en = '\b(selection|every song|each song|transition\w*|flow|curat\w*)\b'

[[like]]
key = "visual"
name = "그림·영상미"
ko = '그림|영상미|썸네일|배경|애니'
en = '\b(art|artwork|visual\w*|animation|thumbnail|background|illustration)\b'

[[like]]
key = "length"
name = "길이·광고 없음"
ko = '광고\s?(가\s?)?없|길어서\s?(좋|최고)|시간\s?(이\s?)?(길|넉넉)'
en = '\b(no ads|ad-?free|without ads|long enough|hours long)\b'

[[like]]
key = "focus"
name = "집중이 잘 됨"
ko = '집중\s?(이\s?)?(잘|된|돼)|능률'
en = '\b(helps? me (focus|concentrate|study)|productive|focused)\b'

# ---------------------------------------------------------------- 불만
[[dislike]]
key = "ad"
name = "광고"
ko = '광고'
en = '\b(ads?|commercial\w*|advert\w*)\b'

[[dislike]]
key = "ai"
name = "AI 곡 거부감"
ko = 'AI|인공지능|가짜|영혼\s?(이\s?)?없'
en = '\b(AI|soulless|fake|generated|not real)\b'

[[dislike]]
key = "repetitive"
name = "같은 곡·반복"
ko = '같은\s?곡|반복|비슷비슷|똑같'
en = '\b(same song|repetitive|repeat\w*|all sound the same|samey)\b'

[[dislike]]
key = "sound"
name = "음질·볼륨"
ko = '음질|소리\s?(가\s?)?(크|작|깨)|볼륨|잡음'
en = '\b(volume|audio quality|sound quality|too loud|distort\w*|noise)\b'

[[dislike]]
key = "sudden"
name = "갑자기 튀는 소리"
ko = '갑자기|깜짝'
en = '\b(sudden\w*|jump ?scare|startled|out of nowhere)\b'
