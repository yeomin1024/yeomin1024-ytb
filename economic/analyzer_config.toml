# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 재테크 (폴더 economic)
# VERSION: v1.2 — 2026-10-15 — INCLUDE_FOREIGN = false 추가 (외국 영상 켜고 끄기 — 사용자 지시: "주식은 외국 영상도 다 분석할 건데 확인해봐
#          on/off 기능(default off) 있는지 확인하고 없으면 추가해"). 재테크는 꺼 둠 = 예전처럼 한국어 영상만. 다른 값은 v1.1 그대로
# (v1.1 — 2026-10-13 — 주제 이름 '재테크'(경제는 뺌 — 사용자 지시), 성공사례 영상 파일은 받지 않음(DOWNLOAD_VIDEOS = false — 사용자 지시
#          "일단 영상 자체는 받지말고"), 자막 없는 영상 음성인식은 결과를 먼저 올린 뒤 대기열에서 하나씩 (tools/pc_analysis.py 가 --defer-whisper)
# (v1.0.1 — 2026-10-13 — 주석의 실행 명령만 (-File run_analyzer.ps1 — .\ 없이). 설정 값은 v1.0 그대로)
# (v1.0 — 2026-10-13 — 새로 만듦 (사용자 지시: 모든 주제 폴더를 지우고 경제·재테크 폴더 하나만).
#   검색어·관련어 목록은 이 파일이 아니라 같은 폴더의 keywords.toml 에 있다 (분석기 v2.4.0).)
#
# ▶ PC에서 (자막·썸네일까지 받음, 할당량이 끝나면 다음 날 자동으로 이어서): guides/pc_analysis.md
#      powershell -ExecutionPolicy Bypass -File run_analyzer.ps1                     (Windows)
#      bash run_analyzer.sh                                                             (Mac/Linux)
# ▶ 분석기만 한 번: python youtube_topic_analyzer.py --config economic/analyzer_config.toml
# ▶ 클라우드(Claude Code)에서: bash tools/run_analysis.sh economic   (자막·썸네일은 네트워크 정책상 못 받을 수 있음)
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값 (우선순위: 코드 기본값 < 이 파일 < keywords.toml(목록만) < 명령줄)
# =====================================================================================================

[topic]
TOPIC = "재테크"
PROJECT_FOLDER = "economic"          # 결과 상위 폴더 → PC: output/economic/result/, GitHub: economic/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"
INCLUDE_FOREIGN = false              # 외국 영상도 탐색·분석 (true) — 기본 false = 한국어 영상만. 웹 화면 4번 칸 [외국 영상도]로 켜고 끔

[keywords]
KEYWORD_MODE = "curated"             # keywords.toml 의 KEYWORD_GROUPS 에 적은 검색어만
KEYWORDS_FILE = "keywords.toml"      # 검색어·관련어 목록 파일 (이 파일과 같은 폴더)

[ads]
AD_SUSPECT_FILTER = true             # 조회수는 많은데 좋아요·댓글이 거의 없는 영상(광고로 조회수를 산 것으로 의심) 제외
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# 하루 할당량 10,000단위를 tools/outlier_research.py(작은 채널 성공 사례, 약 4,000단위)와 나눠 쓴다.
# 다 못 한 검색어는 다음 날로 이월되고, tools/pc_analysis.py 가 할당량이 초기화되면(태평양 자정) 자동으로 이어서 돌린다.
QUOTA_BUDGET = 6000                  # ⚠️ 비용 관련 (tools/pc_analysis.py 는 오늘 남은 만큼만 줌)
DOWNLOAD_VIDEOS = false              # ⚠️ 성공사례 영상 파일은 받지 않음 (사용자 지시 2026-10-13) — 자막·썸네일·댓글·메타데이터만
# ANALYSIS_DAYS = 365
# OUTLIER_MIN = 3.0
# MIN_SUCCESS_VIEWS = 10000
# SUCCESS_CASE_COUNT = 8
# FETCH_COMMENTS_TOP_N = 30
# SEARCH_CACHE_TTL_HOURS = 168      # 검색 결과 캐시 7일 — 이어서 돌릴 때 이미 받은 검색은 할당량 0
