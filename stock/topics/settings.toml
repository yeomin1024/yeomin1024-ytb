[fields]
# v1.2 자료 갈래 — 후보의 data_kind 는 이 안에서만 (topic_ideas lint). 주가 백테스트 = 지수·ETF 전략을 모든 시작 날에 돌림 · 사건 사례 = 실제 사건 날짜(전쟁·금리 인하·폭락) 뒤 지수 ·
# 종목 사례 = 실제 회사 이름이 나오는 주가·배당·분할 자료 · 재무제표 = 매출·이익·EPS·자사주
data_kind = "주가 백테스트(지수·ETF 전략을 모든 시작 날에) · 사건 사례(실제 사건 날짜 뒤 지수) · 종목 사례(실제 회사 이름 — 주가·배당·분할) · 재무제표 · 세금·법 · 환율 · 그 밖"
DATA_KINDS = ["주가 백테스트", "사건 사례", "종목 사례", "재무제표", "세금·법", "환율", "그 밖"]

[batch]
SIZE = 20                 # 한 묶음 주제 수
MAX_PER_THEME = 4         # 한 묶음 안 같은 주제 묶음(analysis themes) 최대 — 한쪽으로 쏠리지 않게
MAX_PER_NEED = 2          # 같은 댓글 니즈(K01·U05 …) 최대
EXPLORE = 3               # 평가가 쌓인 뒤: 아직 평가 없는 갈래(페르소나·형식·주제 묶음)에서 뽑는 자리 — 좋은 쪽만 파다가 새 좋은 쪽을 놓치지 않게

[score]
# 처음 점수(분석 결과) = 니즈 크기·주제 묶음 성공 비율·페르소나 몫·공급 틈·성공 사례 닮음의 가중합 (0~1) — 평가가 없을 때는 이것만
W_NEED = 0.30             # 이어진 댓글 니즈의 좋아요 (log, 가장 큰 니즈 = 1)
W_THEME = 0.20            # 그 주제 묶음의 성공 비율 (가장 높은 묶음 = 1)
W_PERSONA = 0.15          # 대상 페르소나의 몫 (가장 큰 페르소나 = 1)
W_GAP = 0.15              # 같은 내용의 최근 영상 제목이 적을수록 (0개 = 1, GAP_FULL 개 이상 = 0)
W_SUCCESS = 0.20          # 한국어 성공 사례 제목과 낱말이 닮을수록 (IDF 무게 Jaccard — 흔한 말은 가벼움 · 닮음 SUCCESS_FULL 이상 = 1) — 실제로 잘된 영상과 같은 주제인가
GAP_FULL = 30
SUCCESS_FULL = 0.15
# 배운 점수 = 평가(좋음·나쁨)에서 — 갈래마다 log((좋음+1)/(나쁨+1)) 의 평균 + 가장 닮은 좋음 주제와 나쁨 주제의 닮음 차이
W_LEARN_FEATURE = 0.5
W_LEARN_SIMILAR = 0.5

[precheck]
# 정답 미리 확인 (stock/topics/README.md '정답 미리 확인' · 계산 stock/topics/precheck/precheck.py · 넣기 topic_ideas.py precheck)
EXCLUDE = ["미확인"]          # 자료가 없어 확인 못 한 주제 — 묶음에서 뺌 (자료가 생기면 다시 계산)
NO_TEST = ["조건부형"]        # 조건에 따라 이긴 쪽이 바뀌는 주제 — 형식이 테스트형(정답을 맞히는 꼴)이면 뺌 · 실험형(비교)은 남기되 결론은 '조건·내기의 크기'로

[dedupe]
SIM_MAX = 0.40            # 이미 쓴·쓰는 주제와 낱말 닮음(Jaccard)이 이 이상이면 '같은 주제'로 뺌
OVERLAP_MAX = 0.50        # 또는 글자 두 개씩 겹침(작은 쪽 기준)이 이 이상 — 표현만 바꾼 같은 실험을 잡음 (2026-10-28 맞춤: 같은 주제 0.61~0.89 · 첫 후보 24개 ≤ 0.33)
SIM_MAX_BATCH = 0.50      # 같은 묶음 안 후보끼리 (낱말)
OVERLAP_MAX_BATCH = 0.60  # 같은 묶음 안 후보끼리 (글자)

[clarity]
