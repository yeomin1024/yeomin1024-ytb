const BGO = { PAPER: { v: 0.5, y: 2.6 }, ALLEY: { v: 0.66, y: 0.6 } };
const bgOf = (st, key) => st.bg(key, BGO[key]);
const DARK = new THREE.Color(0x7d8299), WARM = new THREE.Color(0xffffff);
