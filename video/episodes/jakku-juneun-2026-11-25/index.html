<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"jakku-juneun-2026-11-25","topic":"psychology","duration":441.1,"audio":"../../../psychology/source/jakku-juneun-2026-11-25/narration.mp3","thumb":null,"synced":"2026-11-25T06:55:11Z","tts":"2026-11-25T06:31:43","script_sha1":"9b631030389fcc1f","sent":[{"n":1,"part":"도입","text":"기한이 지난 과자, 언제 얼렸는지 모를 냉동 반찬, 한 번도 안 쓴 사은품.","start":0.3,"end":4.802},{"n":2,"part":"도입","text":"이런 걸 자꾸 건네는 사람이 있습니다.","start":5.182,"end":7.132},{"n":3,"part":"도입","text":"필요 없다고 해도, \"그래도 가져가\" 하면서 손에 쥐여 줍니다.","start":7.512,"end":11.107},{"n":4,"part":"도입","text":"물론 반갑게 받는 분도 있습니다.","start":11.487,"end":13.446},{"n":5,"part":"도입","text":"하지만 필요 없는 물건이라면, 고맙다고 말하고도 집에 와서 버릴 곳부터 찾게 되죠.","start":13.826,"end":19.053},{"n":6,"part":"도입","text":"그런데 그 사람은 왜 그렇게까지 줄까요?","start":19.433,"end":21.713},{"n":7,"part":"도입","text":"결론부터 말씀드리겠습니다.","start":22.093,"end":23.623},{"n":8,"part":"도입","text":"이 행동과 비슷한 마음을 다룬 심리학 연구를 보면, 이유는 크게 세 가지로 볼 수 있습니다.","start":24.003,"end":29.332},{"n":9,"part":"도입","text":"첫째, 버리기는 아깝고, 남에게 주면 버린 것이 아니게 되기 때문일 수 있습니다.","start":29.712,"end":34.554},{"n":10,"part":"도입","text":"둘째, 주는 사람은 건네는 순간을 보고, 받는 사람은 그 뒤를 보기 때문일 수 있습니다.","start":34.934,"end":40.314},{"n":11,"part":"도입","text":"셋째, 주고 나면 주는 사람의 마음이 좋아지기 때문일 수 있습니다.","start":40.694,"end":44.573},{"n":12,"part":"도입","text":"그렇다고 나쁜 마음으로 준다는 뜻은 아닙니다.","start":44.953,"end":47.453},{"n":13,"part":"도입","text":"정으로, 나누며 살라고 배운 습관으로, 또 이웃과 말 한마디 나누고 싶어서 주는 분도 많습니다.","start":47.833,"end":53.934},{"n":14,"part":"도입","text":"오늘은 받는 쪽이 왜 이렇게 불편한지, 그리고 서운하지 않게 거절하는 말까지 짚어 보겠습니다.","start":54.314,"end":60.124},{"n":15,"part":"도입","text":"먼저 첫 번째부터 보겠습니다.","start":60.504,"end":62.262},{"n":16,"part":"첫 번째, 버리기 아까워서","text":"첫 번째는, 버리기 아까운 마음입니다.","start":63.262,"end":65.77},{"n":17,"part":"첫 번째, 버리기 아까워서","text":"예를 들어, 명절을 앞두고 냉동실을 정리하는 사람이 있다고 해 볼까요.","start":66.15,"end":70.419},{"n":18,"part":"첫 번째, 버리기 아까워서","text":"작년에 얼려 둔 떡과, 언제 넣었는지 모를 생선이 나옵니다.","start":70.799,"end":74.379},{"n":19,"part":"첫 번째, 버리기 아까워서","text":"먹을 것 같지는 않은데, 버리자니 아깝습니다.","start":74.758,"end":77.713},{"n":20,"part":"첫 번째, 버리기 아까워서","text":"이때 '옆집에 주면 되겠다' 하는 생각이 들면, 마음이 한결 가벼워집니다.","start":78.093,"end":82.509},{"n":21,"part":"첫 번째, 버리기 아까워서","text":"버리면 낭비지만, 주면 나눔이 되니까요.","start":82.889,"end":85.549},{"n":22,"part":"첫 번째, 버리기 아까워서","text":"2019년 네덜란드 연구팀은, 아직 쓸 수 있는 물건을 버릴 때 드는 마음을 세 번의 실험으로 살펴봤습니다.","start":85.929,"end":92.479},{"n":23,"part":"첫 번째, 버리기 아까워서","text":"그런 물건을 버리는 상황에서, 사람들은 불편함을 느꼈습니다.","start":92.859,"end":96.839},{"n":24,"part":"첫 번째, 버리기 아까워서","text":"연구팀은, '아깝다'는 마음과 '버린다'는 행동이 부딪혀서 불편해진다고 봤습니다.","start":97.219,"end":102.149},{"n":25,"part":"첫 번째, 버리기 아까워서","text":"이 연구는 버리는 순간만 살펴봤습니다.","start":102.529,"end":105.112},{"n":26,"part":"첫 번째, 버리기 아까워서","text":"하지만 남에게 주면 버리지 않아도 되니, 이 불편함을 피하는 길이 될 수 있습니다.","start":105.492,"end":109.852},{"n":27,"part":"첫 번째, 버리기 아까워서","text":"실제로 비슷한 영상에도, 음식을 버리는 게 죄 같아서 남에게 준다는 댓글이 있었습니다.","start":110.232,"end":115.444},{"n":28,"part":"첫 번째, 버리기 아까워서","text":"그런데 이 아까움은, 받은 사람에게 넘어가기 쉽습니다.","start":115.824,"end":119.204},{"n":29,"part":"첫 번째, 버리기 아까워서","text":"받은 사람이 먹지 않을 음식을 버리면서, 같은 불편함을 느끼는 분이 많으니까요.","start":119.584,"end":124.384},{"n":30,"part":"첫 번째, 버리기 아까워서","text":"비슷한 영상에도, 받은 걸 결국 버리면서 마음이 편치 않았다는 댓글이 여럿 있었습니다.","start":124.764,"end":130.384},{"n":31,"part":"첫 번째, 버리기 아까워서","text":"한마디로, 필요 없는 걸 주는 손에는 버리기 아까운 마음이 들어 있을 수 있습니다.","start":130.764,"end":135.245},{"n":32,"part":"두 번째, 건네는 순간만 보여서","text":"두 번째는, 주는 사람과 받는 사람이 보는 때가 다르다는 것입니다.","start":136.245,"end":140.256},{"n":33,"part":"두 번째, 건네는 순간만 보여서","text":"2016년 미국 연구자들은 선물에 관한 여러 연구를 모아 정리했습니다.","start":140.636,"end":145.003},{"n":34,"part":"두 번째, 건네는 순간만 보여서","text":"주는 사람은 선물을 건네는 그 순간, 상대가 반가워할 얼굴을 떠올립니다.","start":145.383,"end":149.971},{"n":35,"part":"두 번째, 건네는 순간만 보여서","text":"반면 받는 사람은 그 물건을 집에 가져간 뒤, 얼마나 쓸모 있을지를 더 따집니다.","start":150.351,"end":155.521},{"n":36,"part":"두 번째, 건네는 순간만 보여서","text":"그래서 주는 사람에게는 '고마워요' 하는 얼굴이 남습니다.","start":155.901,"end":159.141},{"n":37,"part":"두 번째, 건네는 순간만 보여서","text":"받는 사람에게는 냉장고 자리와, 버리는 일이 남습니다.","start":159.521,"end":163.2},{"n":38,"part":"두 번째, 건네는 순간만 보여서","text":"그래서 받는 쪽이 웃으며 받으면, 주는 쪽은 잘 줬다고 느끼기 쉽습니다.","start":163.58,"end":168.03},{"n":39,"part":"두 번째, 건네는 순간만 보여서","text":"또 다른 연구도 있습니다.","start":168.41,"end":169.787},{"n":40,"part":"두 번째, 건네는 순간만 보여서","text":"2011년 미국 연구팀의 실험에서, 받는 사람은 자기가 부탁한 선물을 더 고마워했습니다.","start":170.167,"end":175.983},{"n":41,"part":"두 번째, 건네는 순간만 보여서","text":"그런데 주는 쪽은 거꾸로, 말 안 해도 알아서 챙겨 줘야 더 감동할 거라고 생각했습니다.","start":176.363,"end":181.878},{"n":42,"part":"두 번째, 건네는 순간만 보여서","text":"말하지 않아도 챙겨 주는 게 정이라는 생각이, 필요 없다고 말한 사람의 마음과는 어긋날 수 있는 겁니다.","start":182.258,"end":188.496},{"n":43,"part":"두 번째, 건네는 순간만 보여서","text":"그래서 받는 쪽이 '괜찮아요'라고 해도, 주는 쪽에는 예의로 사양하는 말로 들릴 수 있습니다.","start":188.876,"end":194.037},{"n":44,"part":"두 번째, 건네는 순간만 보여서","text":"한마디로, 주는 사람은 건네는 순간을, 받는 사람은 그 뒤를 보기 쉽습니다.","start":194.417,"end":199.247},{"n":45,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"세 번째는, 주는 일 자체가 주는 사람을 기분 좋게 할 수 있다는 것입니다.","start":200.247,"end":204.617},{"n":46,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"남을 위해 돈을 쓴 사람들을 살펴본 2020년 연구에서도, 대체로 남을 위해 쓴 쪽이 더 행복하다고 답했습니다.","start":204.997,"end":212.084},{"n":47,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"반찬 한 통을 건네고 돌아서는 길이 뿌듯한 것도, 이와 비슷한 마음일 수 있습니다.","start":212.464,"end":217.286},{"n":48,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"'그냥 주고 싶어서 준다'는 댓글에는, 좋아요가 700개 넘게 달렸습니다.","start":217.666,"end":221.856},{"n":49,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"이런 마음이 나쁜 것은 아닙니다.","start":222.236,"end":224.006},{"n":50,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"다만 기쁨이 주는 쪽에서 생기다 보니, 받는 쪽이 괜찮은지 묻는 일을 건너뛰기 쉽습니다.","start":224.386,"end":229.623},{"n":51,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"한 댓글은 '주는 사람은 뿌듯하겠지만, 필요 없는 걸 갑자기 받는 사람은 불편할 수 있다'고 적었습니다.","start":230.003,"end":236.048},{"n":52,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"한마디로, 자꾸 주는 손에는 주는 기쁨이 들어 있을 수 있습니다.","start":236.428,"end":240.188},{"n":53,"part":"세 번째, 주고 나면 내 마음이 좋아져서","text":"그렇다면 받는 쪽은, 왜 이렇게까지 불편할까요?","start":240.568,"end":243.715},{"n":54,"part":"받는 쪽이 불편한 까닭","text":"비슷한 영상의 댓글을 보면, 받는 쪽의 불편함은 크게 세 가지였습니다.","start":244.715,"end":249.055},{"n":55,"part":"받는 쪽이 불편한 까닭","text":"첫째, 받았으니 뭔가 돌려줘야 할 것 같은 부담입니다.","start":249.435,"end":252.933},{"n":56,"part":"받는 쪽이 불편한 까닭","text":"필요 없는 걸 받고, 돌려줄 때는 내 돈이 나간다는 댓글도 있었습니다.","start":253.313,"end":257.525},{"n":57,"part":"받는 쪽이 불편한 까닭","text":"둘째, 먹지도 쓰지도 않을 것을 버리는 죄책감입니다.","start":257.905,"end":261.652},{"n":58,"part":"받는 쪽이 불편한 까닭","text":"셋째, 거절하면 상대가 서운해할까 봐 보게 되는 눈치입니다.","start":262.032,"end":265.842},{"n":59,"part":"받는 쪽이 불편한 까닭","text":"식단을 조절하거나, 물건을 줄이며 사는 분에게는 이 부담이 더 클 수 있습니다.","start":266.222,"end":271.036},{"n":60,"part":"받는 쪽이 불편한 까닭","text":"그리고 소비기한이 지난 음식은, 마음의 문제가 아니라 안전의 문제입니다.","start":271.416,"end":275.946},{"n":61,"part":"받는 쪽이 불편한 까닭","text":"우리나라는 요즘 대부분의 식품에, 유통기한 대신 소비기한을 적습니다.","start":276.326,"end":281.146},{"n":62,"part":"받는 쪽이 불편한 까닭","text":"유통기한은 가게에서 팔 수 있는 기한이고, 소비기한은 보관 방법을 지켰을 때 먹어도 되는 기한입니다.","start":281.526,"end":287.302},{"n":63,"part":"받는 쪽이 불편한 까닭","text":"그래서 소비기한이 지난 음식은, 아깝더라도 먹지 않는 것이 안전합니다.","start":287.682,"end":291.923},{"n":64,"part":"받는 쪽이 불편한 까닭","text":"그렇다면 서운하지 않게, 어떻게 말하면 좋을까요?","start":292.303,"end":295.401},{"n":65,"part":"서운하지 않게 거절하는 말","text":"첫째, 물건이 아니라 내 사정을 이유로 말합니다.","start":296.401,"end":299.577},{"n":66,"part":"서운하지 않게 거절하는 말","text":"'이게 별로예요'가 아니라, 실제 내 사정을 말하는 겁니다.","start":299.957,"end":303.557},{"n":67,"part":"서운하지 않게 거절하는 말","text":"예를 들어 '요즘 식단을 조절하고 있어서요', '집에 둘 자리가 없어서요'처럼요.","start":303.937,"end":308.846},{"n":68,"part":"서운하지 않게 거절하는 말","text":"그러면 상대의 마음을 탓하지 않고도 거절할 수 있습니다.","start":309.226,"end":312.181},{"n":69,"part":"서운하지 않게 거절하는 말","text":"둘째, 계속 주고받는 사이라 받고 싶은 것이 하나라도 있다면, 그것 하나만 콕 집어 말합니다.","start":312.561,"end":318.569},{"n":70,"part":"서운하지 않게 거절하는 말","text":"앞에서 본 2011년 연구에는 이런 결과도 있었습니다.","start":318.949,"end":322.543},{"n":71,"part":"서운하지 않게 거절하는 말","text":"원하는 걸 여러 개 늘어놓을 때보다, 하나만 콕 집어 말해 줬을 때였습니다.","start":322.923,"end":327.269},{"n":72,"part":"서운하지 않게 거절하는 말","text":"그때 주는 사람은, 상대가 얼마나 반가워할지 더 잘 알아맞혔습니다.","start":327.649,"end":332.139},{"n":73,"part":"서운하지 않게 거절하는 말","text":"'주시려면, 저는 귤 몇 개가 제일 반가워요'처럼, 반가운 것을 하나만 정해 주는 겁니다.","start":332.519,"end":337.949},{"n":74,"part":"서운하지 않게 거절하는 말","text":"아무것도 필요 없다면, 첫째처럼 내 사정만 말해도 충분합니다.","start":338.329,"end":342.508},{"n":75,"part":"서운하지 않게 거절하는 말","text":"셋째, 소비기한이 지난 음식은 짧고 분명하게 말합니다.","start":342.888,"end":346.558},{"n":76,"part":"서운하지 않게 거절하는 말","text":"'소비기한이 지나서 저는 못 먹어요. 마음만 받을게요.'","start":346.938,"end":350.637},{"n":77,"part":"서운하지 않게 거절하는 말","text":"날짜를 모르는 냉동 음식이라면, '언제 얼린 건지 몰라서 저는 못 먹겠어요'라고 하면 됩니다.","start":351.017,"end":356.496},{"n":78,"part":"서운하지 않게 거절하는 말","text":"넷째, 그래도 계속 주시면, 같은 말을 같은 말투로 짧게 되풀이합니다.","start":356.876,"end":361.42},{"n":79,"part":"서운하지 않게 거절하는 말","text":"이유를 매번 새로 대면, 그 이유만 피해서 다시 권하는 경우가 있기 때문입니다.","start":361.8,"end":366.822},{"n":80,"part":"서운하지 않게 거절하는 말","text":"이미 받아 왔다면, 억지로 먹거나 쌓아 둘 필요는 없습니다.","start":367.202,"end":371.032},{"n":81,"part":"서운하지 않게 거절하는 말","text":"아직 쓸 만한 물건이라면, 나눔 장터에 내놓아도 됩니다.","start":371.412,"end":374.792},{"n":82,"part":"서운하지 않게 거절하는 말","text":"준 사람의 마음은 고맙다는 인사로 받았고, 물건까지 다 떠안을 의무는 없으니까요.","start":375.172,"end":380.142},{"n":83,"part":"내가 주는 쪽이라면","text":"혹시 영상을 보며 '내 얘긴가' 싶은 분도 계실 겁니다.","start":381.142,"end":384.143},{"n":84,"part":"내가 주는 쪽이라면","text":"주는 마음은 소중합니다.","start":384.523,"end":385.799},{"n":85,"part":"내가 주는 쪽이라면","text":"다만 건네기 전에, 세 가지만 확인해 보세요.","start":386.179,"end":388.829},{"n":86,"part":"내가 주는 쪽이라면","text":"첫째, 상대에게 먼저 물어봤나요?","start":389.209,"end":391.383},{"n":87,"part":"내가 주는 쪽이라면","text":"'이거 쓰실래요?' 한마디면 됩니다.","start":391.763,"end":393.933},{"n":88,"part":"내가 주는 쪽이라면","text":"둘째, 상대가 요즘 쓰거나 먹는 물건인가요?","start":394.313,"end":397.217},{"n":89,"part":"내가 주는 쪽이라면","text":"셋째, 내가 받아도 반가울 만큼 상태가 좋은가요?","start":397.597,"end":400.759},{"n":90,"part":"내가 주는 쪽이라면","text":"한 댓글은 '엄마가 남한테 주는 건 제일 좋은 걸 주라고 했다'고 적었고, 좋아요가 800개 넘게 달렸습니다.","start":401.139,"end":407.979},{"n":91,"part":"내가 주는 쪽이라면","text":"셋 다 그렇다면, 적어도 상대가 곤란해할 일은 줄어듭니다.","start":408.359,"end":412.127},{"n":92,"part":"내가 주는 쪽이라면","text":"그리고 상대가 거절한다면, 그건 내 마음을 거절한 게 아니라 물건 하나를 사양한 것뿐입니다.","start":412.507,"end":418.357},{"n":93,"part":"내가 주는 쪽이라면","text":"아직 쓸 만한 물건이라면, 사람보다 나눔 장터나 기부처를 먼저 찾아보는 것도 방법입니다.","start":418.737,"end":424.085},{"n":94,"part":"내가 주는 쪽이라면","text":"다만 소비기한이 지난 음식은, 나누지 말고 버리는 것이 맞습니다.","start":424.465,"end":428.455},{"n":95,"part":"마무리","text":"주는 쪽이라면 건네기 전에 한 번만 물어봐 주시고, 받는 쪽이라면 내 사정을 이유로 짧게 거절해도 괜찮습니다.","start":429.455,"end":436.289},{"n":96,"part":"마무리","text":"시청해주셔서 감사합니다.","start":436.669,"end":438.199}],"subs":[[0.2,5.182,"기한이 지난 과자, 언제 얼렸는지 모를 냉동 반찬, 한 번도 안 쓴 사은품."],[5.182,7.512,"이런 걸 자꾸 건네는 사람이 있습니다."],[7.512,11.487,"필요 없다고 해도, \"그래도 가져가\" 하면서 손에 쥐여 줍니다."],[11.487,13.826,"물론 반갑게 받는 분도 있습니다."],[13.826,19.433,"하지만 필요 없는 물건이라면,\n고맙다고 말하고도 집에 와서 버릴 곳부터 찾게 되죠."],[19.433,22.093,"그런데 그 사람은 왜 그렇게까지 줄까요?"],[22.093,24.003,"결론부터 말씀드리겠습니다."],[24.003,29.712,"이 행동과 비슷한 마음을 다룬 심리학 연구를 보면,\n이유는 크게 세 가지로 볼 수 있습니다."],[29.712,34.934,"첫째, 버리기는 아깝고,\n남에게 주면 버린 것이 아니게 되기 때문일 수 있습니다."],[34.934,40.694,"둘째, 주는 사람은 건네는 순간을 보고,\n받는 사람은 그 뒤를 보기 때문일 수 있습니다."],[40.694,44.953,"셋째, 주고 나면 주는 사람의 마음이 좋아지기 때문일 수 있습니다."],[44.953,47.833,"그렇다고 나쁜 마음으로 준다는 뜻은 아닙니다."],[47.833,54.314,"정으로, 나누며 살라고 배운 습관으로,\n또 이웃과 말 한마디 나누고 싶어서 주는 분도 많습니다."],[54.314,60.504,"오늘은 받는 쪽이 왜 이렇게 불편한지,\n그리고 서운하지 않게 거절하는 말까지 짚어 보겠습니다."],[60.504,63.262,"먼저 첫 번째부터 보겠습니다."],[63.262,66.15,"첫 번째는, 버리기 아까운 마음입니다."],[66.15,70.799,"예를 들어, 명절을 앞두고 냉동실을 정리하는 사람이 있다고 해 볼까요."],[70.799,74.758,"작년에 얼려 둔 떡과, 언제 넣었는지 모를 생선이 나옵니다."],[74.758,78.093,"먹을 것 같지는 않은데, 버리자니 아깝습니다."],[78.093,82.889,"이때 '옆집에 주면 되겠다' 하는 생각이 들면,\n마음이 한결 가벼워집니다."],[82.889,85.929,"버리면 낭비지만, 주면 나눔이 되니까요."],[85.929,92.859,"2019년 네덜란드 연구팀은, 아직 쓸 수 있는 물건을\n버릴 때 드는 마음을 세 번의 실험으로 살펴봤습니다."],[92.859,97.219,"그런 물건을 버리는 상황에서, 사람들은 불편함을 느꼈습니다."],[97.219,102.529,"연구팀은,\n'아깝다'는 마음과 '버린다'는 행동이 부딪혀서 불편해진다고 봤습니다."],[102.529,105.492,"이 연구는 버리는 순간만 살펴봤습니다."],[105.492,110.232,"하지만 남에게 주면 버리지 않아도 되니,\n이 불편함을 피하는 길이 될 수 있습니다."],[110.232,115.824,"실제로 비슷한 영상에도,\n음식을 버리는 게 죄 같아서 남에게 준다는 댓글이 있었습니다."],[115.824,119.584,"그런데 이 아까움은, 받은 사람에게 넘어가기 쉽습니다."],[119.584,124.764,"받은 사람이 먹지 않을 음식을 버리면서,\n같은 불편함을 느끼는 분이 많으니까요."],[124.764,130.764,"비슷한 영상에도, 받은 걸 결국 버리면서\n마음이 편치 않았다는 댓글이 여럿 있었습니다."],[130.764,136.245,"한마디로,\n필요 없는 걸 주는 손에는 버리기 아까운 마음이 들어 있을 수 있습니다."],[136.245,140.636,"두 번째는, 주는 사람과 받는 사람이 보는 때가 다르다는 것입니다."],[140.636,145.383,"2016년 미국 연구자들은 선물에 관한 여러 연구를 모아 정리했습니다."],[145.383,150.351,"주는 사람은 선물을 건네는 그 순간,\n상대가 반가워할 얼굴을 떠올립니다."],[150.351,155.901,"반면 받는 사람은 그 물건을 집에 가져간 뒤,\n얼마나 쓸모 있을지를 더 따집니다."],[155.901,159.521,"그래서 주는 사람에게는 '고마워요' 하는 얼굴이 남습니다."],[159.521,163.58,"받는 사람에게는 냉장고 자리와, 버리는 일이 남습니다."],[163.58,168.41,"그래서 받는 쪽이 웃으며 받으면, 주는 쪽은 잘 줬다고 느끼기 쉽습니다."],[168.41,170.167,"또 다른 연구도 있습니다."],[170.167,176.363,"2011년 미국 연구팀의 실험에서,\n받는 사람은 자기가 부탁한 선물을 더 고마워했습니다."],[176.363,182.258,"그런데 주는 쪽은 거꾸로,\n말 안 해도 알아서 챙겨 줘야 더 감동할 거라고 생각했습니다."],[182.258,188.876,"말하지 않아도 챙겨 주는 게 정이라는 생각이,\n필요 없다고 말한 사람의 마음과는 어긋날 수 있는 겁니다."],[188.876,194.417,"그래서 받는 쪽이 '괜찮아요'라고 해도,\n주는 쪽에는 예의로 사양하는 말로 들릴 수 있습니다."],[194.417,200.247,"한마디로, 주는 사람은 건네는 순간을,\n받는 사람은 그 뒤를 보기 쉽습니다."],[200.247,204.997,"세 번째는,\n주는 일 자체가 주는 사람을 기분 좋게 할 수 있다는 것입니다."],[204.997,212.464,"남을 위해 돈을 쓴 사람들을 살펴본 2020년 연구에서도,\n대체로 남을 위해 쓴 쪽이 더 행복하다고 답했습니다."],[212.464,217.666,"반찬 한 통을 건네고 돌아서는 길이 뿌듯한 것도,\n이와 비슷한 마음일 수 있습니다."],[217.666,222.236,"'그냥 주고 싶어서 준다'는 댓글에는, 좋아요가 700개 넘게 달렸습니다."],[222.236,224.386,"이런 마음이 나쁜 것은 아닙니다."],[224.386,230.003,"다만 기쁨이 주는 쪽에서 생기다 보니,\n받는 쪽이 괜찮은지 묻는 일을 건너뛰기 쉽습니다."],[230.003,236.428,"한 댓글은 '주는 사람은 뿌듯하겠지만,\n필요 없는 걸 갑자기 받는 사람은 불편할 수 있다'고 적었습니다."],[236.428,240.568,"한마디로, 자꾸 주는 손에는 주는 기쁨이 들어 있을 수 있습니다."],[240.568,244.715,"그렇다면 받는 쪽은, 왜 이렇게까지 불편할까요?"],[244.715,249.435,"비슷한 영상의 댓글을 보면, 받는 쪽의 불편함은 크게 세 가지였습니다."],[249.435,253.313,"첫째, 받았으니 뭔가 돌려줘야 할 것 같은 부담입니다."],[253.313,257.905,"필요 없는 걸 받고, 돌려줄 때는 내 돈이 나간다는 댓글도 있었습니다."],[257.905,262.032,"둘째, 먹지도 쓰지도 않을 것을 버리는 죄책감입니다."],[262.032,266.222,"셋째, 거절하면 상대가 서운해할까 봐 보게 되는 눈치입니다."],[266.222,271.416,"식단을 조절하거나,\n물건을 줄이며 사는 분에게는 이 부담이 더 클 수 있습니다."],[271.416,276.326,"그리고 소비기한이 지난 음식은,\n마음의 문제가 아니라 안전의 문제입니다."],[276.326,281.526,"우리나라는 요즘 대부분의 식품에,\n유통기한 대신 소비기한을 적습니다."],[281.526,287.682,"유통기한은 가게에서 팔 수 있는 기한이고,\n소비기한은 보관 방법을 지켰을 때 먹어도 되는 기한입니다."],[287.682,292.303,"그래서 소비기한이 지난 음식은,\n아깝더라도 먹지 않는 것이 안전합니다."],[292.303,296.401,"그렇다면 서운하지 않게, 어떻게 말하면 좋을까요?"],[296.401,299.957,"첫째, 물건이 아니라 내 사정을 이유로 말합니다."],[299.957,303.937,"'이게 별로예요'가 아니라, 실제 내 사정을 말하는 겁니다."],[303.937,309.226,"예를 들어 '요즘 식단을 조절하고 있어서요',\n'집에 둘 자리가 없어서요'처럼요."],[309.226,312.561,"그러면 상대의 마음을 탓하지 않고도 거절할 수 있습니다."],[312.561,318.949,"둘째, 계속 주고받는 사이라 받고 싶은 것이 하나라도 있다면,\n그것 하나만 콕 집어 말합니다."],[318.949,322.923,"앞에서 본 2011년 연구에는 이런 결과도 있었습니다."],[322.923,327.649,"원하는 걸 여러 개 늘어놓을 때보다,\n하나만 콕 집어 말해 줬을 때였습니다."],[327.649,332.519,"그때 주는 사람은, 상대가 얼마나 반가워할지 더 잘 알아맞혔습니다."],[332.519,338.329,"'주시려면, 저는 귤 몇 개가 제일 반가워요'처럼,\n반가운 것을 하나만 정해 주는 겁니다."],[338.329,342.888,"아무것도 필요 없다면, 첫째처럼 내 사정만 말해도 충분합니다."],[342.888,346.938,"셋째, 소비기한이 지난 음식은 짧고 분명하게 말합니다."],[346.938,351.017,"'소비기한이 지나서 저는 못 먹어요. 마음만 받을게요.'"],[351.017,356.876,"날짜를 모르는 냉동 음식이라면,\n'언제 얼린 건지 몰라서 저는 못 먹겠어요'라고 하면 됩니다."],[356.876,361.8,"넷째, 그래도 계속 주시면, 같은 말을 같은 말투로 짧게 되풀이합니다."],[361.8,367.202,"이유를 매번 새로 대면,\n그 이유만 피해서 다시 권하는 경우가 있기 때문입니다."],[367.202,371.412,"이미 받아 왔다면, 억지로 먹거나 쌓아 둘 필요는 없습니다."],[371.412,375.172,"아직 쓸 만한 물건이라면, 나눔 장터에 내놓아도 됩니다."],[375.172,381.142,"준 사람의 마음은 고맙다는 인사로 받았고,\n물건까지 다 떠안을 의무는 없으니까요."],[381.142,384.523,"혹시 영상을 보며 '내 얘긴가' 싶은 분도 계실 겁니다."],[384.523,386.179,"주는 마음은 소중합니다."],[386.179,389.209,"다만 건네기 전에, 세 가지만 확인해 보세요."],[389.209,391.763,"첫째, 상대에게 먼저 물어봤나요?"],[391.763,394.313,"'이거 쓰실래요?' 한마디면 됩니다."],[394.313,397.597,"둘째, 상대가 요즘 쓰거나 먹는 물건인가요?"],[397.597,401.139,"셋째, 내가 받아도 반가울 만큼 상태가 좋은가요?"],[401.139,408.359,"한 댓글은 '엄마가 남한테 주는 건 제일 좋은 걸 주라고 했다'고 적었고,\n좋아요가 800개 넘게 달렸습니다."],[408.359,412.507,"셋 다 그렇다면, 적어도 상대가 곤란해할 일은 줄어듭니다."],[412.507,418.737,"그리고 상대가 거절한다면,\n그건 내 마음을 거절한 게 아니라 물건 하나를 사양한 것뿐입니다."],[418.737,424.465,"아직 쓸 만한 물건이라면,\n사람보다 나눔 장터나 기부처를 먼저 찾아보는 것도 방법입니다."],[424.465,429.455,"다만 소비기한이 지난 음식은, 나누지 말고 버리는 것이 맞습니다."],[429.455,436.669,"주는 쪽이라면 건네기 전에 한 번만 물어봐 주시고,\n받는 쪽이라면 내 사정을 이유로 짧게 거절해도 괜찮습니다."],[436.669,438.599,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

<script>

for (const k of ["HALLWAY", "R-KITCHEN", "G-KITCHEN", "OFFICE", "R-LIVING", "LOBBY"]) BGS[k] = PUP + `BG-${k}.jpg`;
PSY.setup({ man: MAN, cut: PUP + "cut/", bg: BGS,
  layout: { MID: [950, 0, 24, 1080], SWIPE: [-2400, 0, 6800, 1080] },
  allow: [["MID", "WORLD"], ["MID", "HEAD"], ["MID", "LOW"], ["MID", "LIST"],
          ["SWIPE", "WORLD"], ["SWIPE", "MID"], ["SWIPE", "LIST"], ["SWIPE", "HEAD"], ["SWIPE", "LOW"]] });
const { shot, world, actor, moves, show, hide, pop, squash, breathe, spr } = PSY;
const B = n => Math.max(0, S(n) - 0.25);
const NIGHT = "rgba(14,20,60,.45)";

/* 자리 표 [발 x, 발 y, 배율] — 세계 좌표 (배경 1920×1080) */
const SP = {
  HW_G: [640, 1010, 0.74], HW_R: [1300, 1010, 0.74],      // 복도 — G 왼쪽(자기 집 문 쪽) · R 오른쪽(자기 집 문 앞)
  HW_GL: [560, 1010, 0.74], HW_RL: [1080, 1010, 0.74],    // 반반 화면 왼쪽(ox 280)에 둘 다 들어가게
  RK_R: [1180, 1010, 0.76],                                // R 부엌 — 쓰레기통(오른쪽) 앞
  GK_G: [960, 1010, 0.76],                                 // G 부엌 — 식탁과 냉장고 사이
  OF_H: [760, 1010, 0.76],                                 // 회사 — 책상 왼쪽
  LV_R: [1310, 905, 0.72],                                 // R 거실 — 소파 오른쪽 끝 (탁자 피함)
  LB_G: [900, 1010, 0.76], LB_R: [960, 1010, 0.76],        // 1층 — 나눔 선반(오른쪽) 앞
};
const at = (W_, keys, p, opt) => actor(W_, keys, p[0], p[1], p[2], opt);

/* ─────── 반반 화면 — 배경의 [ox, ox+960] 만 보임 ─────── */
function half(a, b, bg, side, ox, opt) {
  const W_ = world(a, b, bg, opt);
  gsap.set(W_.sc, { x: (side === "L" ? 0 : 960) - ox });

function over(a, b, mid) {
  const sc = K.scene(a, b + 0.4);
  if (mid) K.el(`<div class="mid" data-slot="MID"></div>`, sc);
  return { sc };
}
function tagIn(W_, html, t, out, cls) {      // 인물 설명 이름표 (반쪽 위 가운데)
  const n = K.el(`<div class="tag ${cls || "g"}">${html}</div>`, W_.L.fly);
  gsap.set(n, { x: (W_.ox != null ? W_.ox + 480 : 960), y: 64, xPercent: -50, opacity: 0 });
  tl.fromTo(n, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t);
  if (out) hide(n, out, 0.25);
  return n;
}
function stamp(W_, html, x, y, t, out, cls) {

  say(W_, G, "G03-2", "내 마음이 아니라<br>물건 하나를 사양한 거지~", W(92, "내"), null, { kind: "think", side: 1, size: 44, y: 140 });   // R 머리 위로 올림 (v1.1)
  K.cut(E(92) - 0.3, "92 사양");
});
shot(B(93), (a, b) => {                      // 93~94 — 나눔 선반 · 소비기한 지난 음식은 나누지 않음 (1층)
  const W_ = world(a, b, "LOBBY");
  const G = at(W_, ["G05-1", "G05-2", "G05-3"], SP.LB_G);
  moves(G, [[a, "G05-1", 1, "hold"], [W(93, "나눔") - 0.2, "G05-2", 1, "hold"], [W(93, "방법입니다") - 0.2, "G05-3", 1, "hold"]], b + 0.4);
  breathe(G, a, b);
  stamp(W_, "쓸 만한 물건 → 나눔 장터·기부처", 430, 560, S(93) + 0.3, S(94) - 0.1, "tl");
  const sn = prop(W_.L.fly, "PROPS-A-3", 400, 700, 200, S(94), null, true);
  void sn;
  const no = K.el(`<div class="stamp rd" style="font-size:44px">소비기한 지난 음식 ✕ 나눔</div>`, W_.L.fly);
  gsap.set(no, { x: 470, y: 520, xPercent: -50, yPercent: -50, rotation: -4, opacity: 0 });
  tl.fromTo(no, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, S(94) + 0.2);
  K.cut(E(93) - 0.3, "93 나눔 장터"); K.cut(E(94) - 0.3, "94 소비기한");
});

/* ═════════════ 마무리 (95~96) ═════════════ */
shot(B(95), (a, b) => {
  swipe(a + 0.2);
  const W_ = world(a, b, "HALLWAY");
  const G = at(W_, ["G04-1", "G04-3"], SP.HW_G);
  const R = at(W_, ["R04-2", "R04-3"], SP.HW_R);
  moves(G, [[a, "G04-1", 1, "hold"], [W(95, "받는") - 0.2, "G04-3", 1, "hold"]], b + 0.4);
  moves(R, [[a, "R04-2", 1, "hold"], [S(96), "R04-3", 1, "hold"]], b + 0.4);
  breathe(G, a, b); breathe(R, a, b);
  say(W_, G, "G04-1", "이거<br>쓰실래요?", a + 0.5, W(95, "받는") - 0.2, { side: 1, size: 52 });
  say(W_, R, "R04-2", "마음만<br>받을게요~", W(95, "받는"), null, { side: 1, size: 50 });
  PSY.cam(W_, a, b, [1.0, 960, 600], [1.04, 960, 600]);
  K.cut(E(95) - 0.3, "95 마무리"); K.cut(E(96), "96 끝");
});

PSY.build();
K.done();
})();
