  cam(W_, a, b, [1.0, 960, 470], [1.08, 960, 520]);
  K.cut(E(59) - 0.2, "59 설명 먼저");
});
// 60~61 — 아침 거실: 손 흔들어 인사 → 가슴에 손 얹고 고개 숙임
shot(B(60), (a, b) => {
  const W_ = world(a, b, "MORNING", { keep: true });
  const [x, y, s] = SPOT.ROOM;
  const V = actor(W_.L.act, ["V17-1", "V17-2", "V17-3"], 960, y, s);
  moves(V, [[a, ["V17-1", "V17-2"], 3, "pp"], [S(61), "V17-3", 1, "hold"]], K.D + 5);
  squash(V, S(61), 0.05);
  sparkle(W_.L.fly, 960, y - 700 * s, W(60, "성공"), 6, 220);
  cam(W_, a, K.D, [1.08, 960, 520], [1.0, 960, 540]);
  K.cut(E(60) - 0.2, "60 인사");
  K.cut(K.D - 0.5, "61 끝");
});

/* ─────────── 장면 짓기 (시작 시각 차례 — 각 장면은 다음 장면 시작까지) ─────────── */
SHOTS.sort((p, q) => p.t - q.t);
SHOTS.forEach((s, i) => s.fn(s.t, i + 1 < SHOTS.length ? SHOTS[i + 1].t : K.D));
K.done();
})();
