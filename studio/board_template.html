<title>제작 판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- VERSION: v1.4.1 — 2026-11-28 — 주제 후보를 더한 순서대로 (Claude 가 넣은 순위 후보가 1순위부터 보이게).
     (v1.4) — 2026-11-28 — [규칙 · 결과] = 단계별 (studio/rules.json steps — 단계마다 규칙 → 그 단계 결과: 트렌드·next_topic 문서·성공 사례·낱말·
     페르소나 회차·도입 30초·챕터 끝 문장·음성·영상·업로드 상태) · 주식 → 재테크 안 (BOARD merge — 편은 제 폴더 이름으로 저장: stock__… · '주식' 표시) ·
     최신 트렌드 주제 · 판 동작(통과·체크)은 규칙 목록에서 빼고 판 설계로. 사용자 지시 2026-11-28 "제작 판 동기화하고 주식 관련 내용은 재테크에 포함시켜 그리고 규칙을 단계로 나누고 그 단계에 대한 결과를 각각 표시하도록 해 그리고 주식에 관련된 단어들 구글 트렌드에 추가한 후 링크 생성 해놔 주식 주제별 규칙을 빼는걸로 체크했으니까 그건 아예 빼버리고 최신 트렌드 주제 추가해 그리고 주제 후보는 판에서 [통과 → 제목]을 누른 것만 … 이건 공통 규칙이 아니라 아티팩트를 그렇게 설계하라는거야 다른 단계도 똑같이 적용되는거고 수정해".
     (v1.3) — 2026-11-28 — '공통' 칸 없앰 · 주제 탐색에 구글 트렌드(줄마다 단어 8개 → [링크 생성] → 링크 열기 → CSV 올리기 · 모든 링크 CSV 가 오면 '완료'
     — db trend_rows · trend_csv) · 화면마다 [작업] / [규칙 · 결과] 둘 중 하나를 넓게 (예전 오른쪽 옆 칸) · 편마다 [통과 → 다음 단계] · [← 이전 단계] 단추
     (체크 상자 대신 — 누르면 편과 함께 그 단계 화면으로) · 주제 켜기·끄기는 머리 띠 단추. 사용자 지시 2026-11-28 "제작 판 동기화하고 공통탭을 없애고 주제 탐색에 구글 트렌드
     부분을 넣어 단어는 8개씩하고 줄마다 단어 입력 후 링크 생성 버튼을 누르면 바로 해당 단어가 입력되어 있는 구글 트렌드 링크 생성해 그리고 csv 파일 업로드 할 수 있도록 해
     모든 파일이 업로드 되면 완료로 표시하고 그리고 지금 규칙을 사이드로 보여주는데 규칙, 작업 2가지로 선택해서 화면에 다 보여주도록 해 그리고 규칙에 결과도 같이 표시해"
     · "그리고 통과 버튼 누르면 다음단계로 넘어가도록 하고 이전 단계 버튼 누르면 다시 이전 단계로 넘어가도록 해".
     (v1.2) — 2026-11-27 — 업로드: 단계 이름 '업로드 준비 완료'(체크 + 동기화한 편만 PC 업로드 화면 '올릴 대본'에) · 올린 편 [재업로드] 단추
     (db uploads reupload·reupload_at — 동기화 뒤 PC 올릴 목록에 [재업로드] 줄, 다시 올리면 저절로 끝남) — 사용자 지시 2026-11-27 "아티팩트에서 업로드 준비 완료 체크된 것만 올릴대본에 표시하도록 해, 그리고 재업로드 버튼도 추가해".
     (v1.1) — 2026-11-27 — 단계마다 그 단계에서 기다리는 편만 (통과한 편은 접힌 '통과한 편' — 되돌릴 때만) · 주제 모두(studio.toml TOPICS) · 주제 켜기·끄기
     (db topics — 끈 주제는 판에 안 보이고 동기화 뒤 studio/state/topics.json 으로 Claude·도구가 읽지 않음) · 주제 자료는 고를 때 받음 (common.json 편 요약으로 단계 수).
     사용자 지시 2026-11-27 "아니 각 단계에 맞는 것만 나오게 해야지 지금은 다 나오잖아 수정하고 주식 이런 주제는 왜 없어? 누락된거 추가하고 주제 비활성화도 할 수 있도록 해".
     (v1.0 — 2026-11-27 — 최초: 심리·위기 분석 판을 하나로 (tools/studio_board.py v1.0 이 BOARD 칸과 data/*.json 을 채움 — 손으로 고치지 않음).
     사용자 지시 2026-11-27 "지금 아티팩트가 심리, 위기 2개 있는데 하나로 통합하고 아래 내용을 모두 만족하도록 수정해".
     db 컬렉션: gates · episodes · rules · refs · feedback · tts · trends · skills · uploads · channels · topics · trend_rows · trend_csv (자세히 tools/studio_board.py 머리말).
     판에서 바꾼 것은 db 에 바로 저장 → Claude 가 '제작 판 동기화' 때 studio/state/*.json 으로 저장소에 (PC·Kaggle 은 저장소를 읽음). 연구·교육용. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치 (v1.3): 위 = 판 이름·주제 고르기(+ 켜기·끄기)·동기화 상태 / 단계 띠(1 주제 … 6 업로드 | 채널 분석) / 본문 = [작업] · [규칙 · 결과] 중 하나를 넓게 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#EEF2F0; --ink:#1B2320; --muted:#5C6A65; --line:#DCE3E0;
  --accent:#0E7466; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --ok:#2B7A55; --ok-soft:#E1F2E8; --warn:#8A6A00; --warn-soft:#FBF1D0; --bad:#B83227; --bad-soft:#FBE4E1; --info:#2F5FA8;
  --shadow:0 10px 30px -18px rgba(20,40,35,.45);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --sunk:#1F2926; --ink:#E6ECE9; --muted:#9AA8A3; --line:#2A3431;
  --accent:#3FC1AC; --accent-ink:#05221D; --accent-soft:#16352F;
  --ok:#62C793; --ok-soft:#163327; --warn:#E2C15A; --warn-soft:#33290C; --bad:#FF6E5E; --bad-soft:#3A1915; --info:#8DB4F2;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --sunk:#1F2926; --ink:#E6ECE9; --muted:#9AA8A3; --line:#2A3431;
  --accent:#3FC1AC; --accent-ink:#05221D; --accent-soft:#16352F;
  --ok:#62C793; --ok-soft:#163327; --warn:#E2C15A; --warn-soft:#33290C; --bad:#FF6E5E; --bad-soft:#3A1915; --info:#8DB4F2;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
header.top{display:flex;gap:12px 20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
header.top h1{font-size:clamp(20px,2.4vw,26px);margin:0;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.topics{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px var(--f-body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
#status-t{flex:1 1 0;min-width:0}
.status.ok .dot{background:var(--ok)} .status.bad .dot{background:var(--bad)} .status.warn .dot{background:var(--warn)}
nav.stages{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;border-bottom:1px solid var(--line);overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.stages ol{list-style:none;margin:0;padding:0;display:flex;gap:4px;min-width:max-content}
nav.stages a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav.stages a .n{font:600 12px var(--f-mono);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor}
nav.stages a .c{font:600 12px var(--f-mono);color:var(--muted)}
nav.stages a[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
nav.stages .sep{align-self:center;color:var(--line);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.side{display:grid;gap:16px;min-width:0}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:10px;min-width:0}
section.box>h2,section.box>header h2{margin:0;font-size:16px}
section.box>header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3{margin:0;font-size:15px}
.small{font-size:13px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile .v{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.acc{color:var(--accent)} .chip.mute{color:var(--muted)} .chip.info{color:var(--info)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 13px;font:600 13.5px var(--f-body);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,input[type=text],input[type=number],select{width:100%;font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
pre.cmd{margin:0;background:var(--sunk);border-radius:10px;padding:9px 11px;font:500 12.5px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-all}
.cmdbox{display:grid;gap:4px}
.cmdbox .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface);min-width:0}
.card.locked{background:var(--sunk);opacity:.85}
.card h3{font-size:15.5px;text-wrap:balance}
.ephead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ephead .id{font:500 12px var(--f-mono);color:var(--muted);word-break:break-all}
.steps{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.steps i{width:16px;height:6px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--ok)} .steps i.cur{background:var(--warn)}
.gate{display:inline-flex;gap:7px;align-items:center;font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--surface);cursor:pointer}
.gate.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.gate.dis{opacity:.5;cursor:not-allowed}
.gatebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .t{font-size:14px}
.rule .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.scope{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.fb{display:grid;gap:6px}
.fbitem{background:var(--sunk);border-radius:10px;padding:7px 10px;display:grid;gap:4px;font-size:14px}
.fbitem .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.fbitem .reply{font-size:13px;color:var(--ink);border-left:3px solid var(--accent);padding-left:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;display:grid;gap:3px;width:min(220px,100%)}
.thumbs img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;aspect-ratio:16/9;object-fit:cover;background:var(--sunk)}
.thumbs figcaption{font-size:12px;color:var(--muted)}
.ref{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.ref:first-child{border-top:0}
.ref img{width:96px;border-radius:6px;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line)}
.ref .t{font-size:14px;font-weight:600}
.ref .s{font-size:12.5px;color:var(--muted)}
.ref.noimg{grid-template-columns:minmax(0,1fr)}
.words{display:flex;gap:6px;flex-wrap:wrap}
.word{background:var(--sunk);border-radius:8px;padding:2px 8px;font-size:13px}
.word b{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px;font-weight:600}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.doc{font-size:14px;max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px;background:var(--surface)}
.doc h3,.doc h4,.doc h5,.doc h6{margin:12px 0 4px;font-size:14.5px}
.doc table{font-size:12.5px;min-width:520px}
.doc pre{background:var(--sunk);padding:8px;border-radius:8px;overflow-x:auto;font-size:12px}
.doc blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--line);color:var(--muted)}
.mdpath{font-size:11.5px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600;font-size:14px}
details.doc-d>summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lines{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.part{background:var(--sunk);font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 10px;letter-spacing:.02em}
.ln{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:6px 10px;border-top:1px solid var(--line);align-items:start}
.ln .n{font:600 12px var(--f-mono);color:var(--muted);padding-top:2px;text-align:right}
.ln .x{font-size:14.5px}
.ln.changed .x{background:linear-gradient(transparent 60%,var(--warn-soft) 60%)}
.ln .acts{display:flex;gap:6px;align-items:center}
.ln .fbwrap{grid-column:2/4}
.ln label.rg{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.ln.redo{background:var(--warn-soft)}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;text-align:left;max-width:100%}
.picker button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.picker button .k{display:block;font:500 11px var(--f-mono);color:var(--muted)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.item-ok{color:var(--ok)} .item-bad{color:var(--bad)}
.desc{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px;max-height:260px;overflow:auto}
svg.spark{width:120px;height:28px;display:block}
svg.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6}
svg.spark circle{fill:var(--accent)}
.persona{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.persona .who{font-size:12.5px;color:var(--muted)}
.persona dl{margin:0;display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.persona dt{font-weight:700;color:var(--muted);font-size:12.5px}
.persona dd{margin:0}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.one{display:grid;gap:16px;min-width:0}
.step{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.step:first-of-type{border-top:0;padding-top:0}
.stephead{display:flex;gap:10px;align-items:center}
.stephead .sn{font:600 13px var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.steprules{padding-left:34px}
.stepres{margin-left:34px;background:var(--sunk);border-radius:12px;padding:8px 12px;display:grid;gap:8px;min-width:0}
.stepres section.box{box-shadow:none}
@media (max-width:620px){.steprules{padding-left:0}.stepres{margin-left:0}}
.modebar{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
.modebar button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 18px;font:600 14px var(--f-body);cursor:pointer}
.modebar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stagebtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tinputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tlink{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.filebtn:has(input:disabled){opacity:.45}
.pill.ghostpill{border-style:dashed;color:var(--muted)}
#panel:empty{display:none}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}.tinputs{grid-template-columns:repeat(2,minmax(0,1fr))}.ln{grid-template-columns:28px minmax(0,1fr)}.ln .acts{grid-column:2}.ln .fbwrap{grid-column:1/3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>제작 판</h1>
      <p id="intro">주제 탐색부터 업로드까지 한 판에서 — 단계마다 [통과]를 누른 편만 다음 단계로 갑니다.</p>
      <div class="status" id="status"><span class="dot"></span><span id="status-t">저장소에 연결하는 중…</span></div>
      <div class="status" id="pend"></div>
    </div>
    <div class="topics" id="topics" role="group" aria-label="주제"></div>
  </header>
  <div id="panel"></div>
  <nav class="stages" aria-label="단계"><ol id="nav"></ol></nav>
  <main id="view"><div class="loading">판 자료를 불러오는 중…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const BOARD = /*BOARD:BEGIN*/null/*BOARD:END*/;
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const B = BOARD || { topics: [{ key: "psychology", name: "심리" }], stages: ["topic", "title", "thumb", "script", "voice", "codetest", "video", "upload"], stage_ko: {}, made: "?" };
  const STAGES = B.stages;
  const SK = Object.assign({ topic: "주제", title: "제목", thumb: "썸네일", script: "대본", voice: "음성", codetest: "코드 테스트", video: "영상", upload: "업로드" }, B.stage_ko || {});
  const VIEWS = [
    { key: "topic", label: "주제 탐색", n: "1", stages: ["topic"] },
    { key: "title", label: "제목", n: "2", stages: ["title"] },
    { key: "thumb", label: "썸네일", n: "3", stages: ["thumb"] },
    { key: "script", label: "대본·음성", n: "4", stages: ["script", "voice"] },
    { key: "video", label: "영상", n: "5", stages: ["codetest", "video"] },
    { key: "upload", label: "업로드", n: "6", stages: ["upload"] },
    { key: "channel", label: "채널 분석", n: "" },
  ];
  const COLS = ["gates", "episodes", "rules", "refs", "feedback", "tts", "trends", "skills", "uploads", "channels", "topics", "trend_rows", "trend_csv"];
  const CATS = { 0: "모든 카테고리", 14: "집단·사회", 958: "직업·교육", 45: "건강", 16: "뉴스", 3: "예술·엔터", 7: "금융", 71: "식음료", 65: "취미·레저", 11: "홈·가든", 18: "쇼핑", 44: "미용·건강" };
  const UPLOAD_CHECKS = ["제목 · 본안 썸네일", "설명란 첫 줄 · 챕터", "태그 · 해시태그", "자막 (지금 대본과 같은지)", "음성 · 영상 끝까지 봄", "합성 콘텐츠 '예' · 카테고리", "올릴 채널 · 공개 시각"];
  const store = k => { try { return localStorage.getItem("studio." + k); } catch (_) { return null; } };
  const keep = (k, v) => { try { localStorage.setItem("studio." + k, v); } catch (_) { /* 이 브라우저는 기억 못 함 */ } };

  const S = {
    topic: (B.topics.find(t => t.key === store("topic")) || B.topics[0]).key,
    view: "topic", mode: store("mode") === "rules" ? "rules" : "work", panel: false, data: {}, common: null, db: null, canWrite: true, connected: false,
    col: Object.fromEntries(COLS.map(c => [c, new Map()])),
    edit: null, confirm: null, open: new Set(), sel: {}, refq: "", busy: false,
  };
  let tt = null;
  const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2400); };
  const nowIso = () => new Date().toISOString();
  const fmtN = n => n == null || n === "" ? "–" : Number(n).toLocaleString("ko-KR");
  const syncedAt = () => (S.common && S.common.synced_at) || B.synced_at || null;
  const pendingDoc = d => !!(d && d.at && (!syncedAt() || String(d.at) > String(syncedAt())));
  const pendChip = d => pendingDoc(d) ? `<span class="chip warn">Claude 반영 전</span>` : (d && d.at ? `<span class="chip ok">반영됨</span>` : "");

  // ───────── 편 · 단계 통과
  const cands = topic => [...S.col.episodes.values()].filter(c => c.topic === topic && !c.deleted).sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || ""))).map(c => ({   // v1.4.1 더한 순서대로
    topic, id: "cand-" + c.id, docId: c.id, kind: "cand", title: c.title || "(제목 없음)", memo: c.memo || "", repo_gates: {}, lines: [], thumbs: [],
    thumb_main: [], thumb_sub: [], title_alts: [], persona: {}, history: [], audio: { status: "none", note: "판에서 더한 후보 — 대본 없음" }, video: {}, upload: null }));
  // v1.1 주제 자료를 아직 안 받은 주제는 common.json 편 요약으로 (단계 수·흐름 표용)
  const eps = topic => { const D = S.data[topic]; const base = D && D.episodes ? D.episodes : (((S.common || {}).summary || {})[topic] || []).map(x => Object.assign({ topic, light: true }, x)); return [...cands(topic), ...base]; };
  const tinfo = k => B.topics.find(t => t.key === k) || { key: k, name: k };
  const topicOn = t => { const d = S.col.topics.get(t.key); return d && typeof d.enabled === "boolean" ? d.enabled : !t.repo_off; };
  const visTopics = () => B.topics.filter(topicOn);
  function fixTopic() { const v = visTopics(); if (!v.some(t => t.key === S.topic)) S.topic = (v[0] || B.topics[0]).key; }
  const tname = k => (B.names || {})[k] || tinfo(k).name || k;
  const MERGE = B.merge || {};                                  // v1.4 { 폴더: 판 주제 } — 주식 → 재테크 (사용자 지시 2026-11-28 "주식 관련 내용은 재테크에 포함시켜")
  const gid = (ep, s) => `${ep.topic}__${ep.id}__${s}`;
  function own(ep, s) {
    const g = S.col.gates.get(gid(ep, s));
    if (g && typeof g.pass === "boolean") return { v: g.pass, by: "board", doc: g };
    return { v: !!(ep.repo_gates || {})[s], by: "repo" };
  }
  function eff(ep, s) { for (const x of STAGES) { if (!own(ep, x).v) return false; if (x === s) return true; } return false; }
  function at(ep) { for (const x of STAGES) if (!own(ep, x).v) return x; return "done"; }
  const kindChip = ep => ep.kind === "shorts" ? `<span class="chip info">쇼츠</span>` : ep.kind === "cand" ? `<span class="chip acc">판 후보</span>` : `<span class="chip mute">롱폼</span>`;
  function stepsHtml(ep) {
    const cur = at(ep);
    return `<span class="steps" title="단계: ${e(STAGES.map(s => SK[s] + (eff(ep, s) ? " ✓" : "")).join(" → "))}">${STAGES.map(s => `<i class="${eff(ep, s) ? "on" : s === cur ? "cur" : ""}"></i>`).join("")}</span>
      <span class="small">${cur === "done" ? "업로드까지 끝" : "지금 " + e(SK[cur])}</span>`;
  }
  function gateHtml(ep, s, label) {
    const i = STAGES.indexOf(s), prevOk = i === 0 || eff(ep, STAGES[i - 1]);
    const o = own(ep, s), on = o.v && prevOk;
    const dis = !prevOk || !S.db || !S.canWrite;
    const by = o.by === "board" ? `<span class="chip acc">판 체크</span>${pendChip(o.doc)}` : (o.v ? `<span class="chip mute">저장소 기준</span>` : "");
    const reset = o.by === "board" ? `<button class="btn ghost sm" type="button" data-act="gate-reset" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${s}">저장소 기준으로</button>` : "";
    return `<span class="gatebar"><label class="gate ${on ? "on" : ""} ${dis ? "dis" : ""}" title="${prevOk ? "" : e(SK[STAGES[i - 1]]) + " 통과 뒤 체크할 수 있음"}">
      <input type="checkbox" data-act="gate" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${s}" ${o.v ? "checked" : ""} ${dis ? "disabled" : ""}>
      ${e(label || SK[s] + " 통과")}</label>${by}${reset}${prevOk ? "" : `<span class="small">${e(SK[STAGES[i - 1]])} 통과 전</span>`}</span>`;
  }
  function epHead(ep, extra) {
    return `<div class="ephead"><div style="min-width:0;display:grid;gap:2px">
      <div class="row">${kindChip(ep)}${ep.topic !== S.topic ? `<span class="chip info">${e(tname(ep.topic))}</span>` : ""}<span class="id">${e(ep.id)}</span></div>
      <h3>${e(ep.title || (ep.summary_title ? "요약본: " + ep.summary_title : "") || "(제목 아직 없음)")}</h3>
      <div class="row">${stepsHtml(ep)}</div></div>${extra || ""}</div>`;
  }

  // ───────── 규칙
  // ───────── v1.4 규칙 = 단계(steps) · 단계마다 결과 (사용자 지시 2026-11-28 "규칙을 단계로 나누고 그 단계에 대한 결과를 각각 표시하도록 해")
  const stepsOf = stage => (((S.common || {}).rules || {}).steps || {})[stage] || [{ key: "_", name: SK[stage] || stage, results: [] }];
  function ruleItems(stage) {                                    // 공통 + 이 주제 · 판에서 고친 것 덮어씀 · 동기화로 이미 뺀 것(db 에만 남은 뺌)은 안 보임
    const base = ((((S.common || {}).rules || {}).stages || {})[stage]) || {}, out = [];
    for (const scope of ["common", S.topic]) {
      const items = (base[scope] || []).map(r => ({ ...r, stage, scope }));
      const ids = new Set(items.map(r => r.id));
      for (const d of S.col.rules.values()) if (d.stage === stage && (d.scope || "common") === scope && !ids.has(d.id) && !d.deleted) items.push({ id: d.id, text: d.text, step: d.step, src: "판에서 더함", stage, scope, added: true });
      for (const r of items) { const d = S.col.rules.get(r.id); if (d) { r.doc = d; if (d.text) r.text = d.text; if (d.step) r.step = d.step; if (d.deleted) r.deleted = true; } }
      out.push(...items);
    }
    return out;
  }
  const rulesOf = stage => [{ scope: "all", items: ruleItems(stage) }];
  function ruleHtml(r) {
    const k = "rule:" + r.id, A = `data-id="${e(r.id)}" data-stage="${e(r.stage)}" data-scope="${e(r.scope)}" data-step="${e(r.step || "")}"`;
    const sc = r.scope === "common" ? `<span class="chip mute">공통</span>` : `<span class="chip acc">${e(tname(r.scope))}</span>`;
    if (S.edit === k) return `<div class="rule"><textarea id="ed-${e(r.id)}">${e(r.text)}</textarea><div class="row"><button class="btn sm" data-act="rule-save" ${A}>저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div>`;
    return `<div class="rule" ${r.deleted ? 'style="opacity:.55"' : ""}><div class="t">${r.deleted ? "<s>" + e(r.text) + "</s>" : e(r.text)}</div><div class="meta">${sc}
      ${r.src ? `<span>${e(r.src)}</span>` : ""}${r.doc ? pendChip(r.doc) : ""}${r.deleted ? `<span class="chip bad">뺌 — 동기화 뒤 사라짐</span>` : ""}
      ${S.confirm === k ? `<span class="confirm">이 규칙을 뺄까요?<button class="btn bad sm" data-act="rule-del" ${A}>빼기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>`
        : r.deleted ? `<button class="btn ghost sm" data-act="rule-undel" ${A} ${wr()}>되살리기</button>`
        : `<button class="btn ghost sm" data-act="edit" data-k="${e(k)}" ${wr()}>고치기</button><button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>빼기</button>`}</div></div>`;
  }
  function stepsBox(stage) {
    const steps = stepsOf(stage), known = new Set(steps.map(x => x.key)), last = steps[steps.length - 1].key, items = ruleItems(stage);
    const tn = tname(S.topic);
    return `<section class="box"><header><h2>${e(SK[stage])} — 단계별 규칙 · 결과</h2><span class="small">고치면 Claude 가 지시사항 문서에도 반영</span></header>
      ${steps.map((st, i) => { const R = items.filter(r => (known.has(r.step) ? r.step : last) === st.key);
        const res = (st.results || []).map(k => resultHtml(k, stage)).join("");
        return `<div class="step"><div class="stephead"><span class="sn">${i + 1}</span><h3>${e(st.name)}</h3></div>
          <div class="steprules">${R.map(ruleHtml).join("") || `<div class="empty">규칙 없음</div>`}</div>
          <div class="stepres"><div class="scope">결과</div>${res || `<p class="empty">이 단계는 따로 남는 결과 파일이 없음 — 작업 화면에서 규칙대로 됐는지 확인</p>`}</div></div>`; }).join("")}
      <details><summary class="small">규칙 더하기</summary><div class="fb" style="margin-top:6px">
        <div class="grid2"><select id="nr-step-${stage}" aria-label="단계">${steps.map((x, i) => `<option value="${e(x.key)}">${i + 1}. ${e(x.name)}</option>`).join("")}</select>
        <select id="nr-scope-${stage}" aria-label="범위"><option value="common">공통 (모든 주제)</option><option value="${e(S.topic)}">${e(tn)} 주제만</option></select></div>
        <textarea id="nr-text-${stage}" placeholder="한 줄 규칙 — 예: 제목 첫 낱말은 시청자가 겪는 장면으로"></textarea>
        <div class="row"><button class="btn sm" data-act="rule-add" data-stage="${stage}" ${wr()}>더하기</button></div></div></details></section>`;
  }
  const rulesBox = stage => stepsBox(stage);
  // 결과 칸 — 단계 정의(studio/rules.json steps[].results)의 이름마다
  const stageEps = st => eps(S.topic).filter(ep => (Array.isArray(st) ? st : [st]).includes(at(ep)));
  const STEP_CMD = { t1: "python3 tools/next_topic.py {t} suggest · 트렌드 = 작업 화면 구글 트렌드", t2: "python3 tools/next_topic.py {t} recent --top 300", t3: "python3 tools/next_topic.py {t} big", t4: "python3 tools/next_topic.py {t} report · overlap", t5: "판단 문서 <주제>/result/next_topic/next_topic.md" };
  const sylSec = x => (String(x).match(/[가-힣]/g) || []).length / 6.3;        // 진행자 H17 약 6.3음절/초
  const miniTable = (head, rows) => rows.length ? `<div class="tablebox"><table><thead><tr>${head.map(h => `<th>${e(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>` : "";
  function resultHtml(key, stage) {
    const D = S.data[S.topic] || {};
    const none = m => `<p class="empty">${e(m)}</p>`;
    if (key === "trends") return trendsResultBox();
    if (key.startsWith("docs:")) { const k = key.slice(5), L = (D.step_docs || {})[k] || [];
      return L.length ? L.map(docHtml).join("") : none(`결과 문서 없음 — ${(STEP_CMD[k] || "").replace("{t}", S.topic)}`); }
    if (key === "personas") { const P = (D.legacy || {}).personas || []; return P.length ? P.map(personaHtml).join("") : ""; }
    if (key === "related") return (D.related || []).map(docHtml).join("") || none("관련 영상 낱말·형식 결과 없음 — python3 tools/related_titles.py " + S.topic);
    if (key === "refs:title") return refsBox("title");
    if (key === "refs:thumb") return refsBox("thumb");
    if (key === "words") return wordsBox();
    const L = stageEps(stage === "voice" ? ["script", "voice"] : stage === "video" ? ["codetest", "video"] : stage);
    const pre = `<p class="small">지금 ${e(SK[stage])} 단계에서 기다리는 편 ${L.length}</p>`;
    if (!L.length && !["upload_log", "skills"].includes(key)) return none(`지금 ${SK[stage]} 단계에서 기다리는 편이 없음`);
    if (key === "ep_titles") return pre + miniTable(["편", "제목", "글자", "다른 안"], L.map(ep => `<tr><td class="mono small">${e(ep.id)}</td><td>${e(ep.title || "(없음)")}</td><td class="num">${(ep.title || "").length}${(ep.title || "").length > 60 ? " ⚠" : ""}</td><td class="num">${(ep.title_alts || []).length}</td></tr>`));
    if (key === "persona:title" || key === "persona:script") {
      const sc = key === "persona:title";
      return pre + miniTable(["편", sc ? "title 회차" : "이탈 회차", sc ? "" : "반론 회차"].filter(Boolean), L.map(ep => { const P = ep.persona || {};
        const ok = sc ? (P.title || 0) >= 2 : (P.script_exit || 0) >= 2 && (P.script_rebuttal || 0) >= 2;
        return `<tr><td class="mono small">${e(ep.id)}</td>${sc ? `<td class="num ${ok ? "item-ok" : "item-bad"}">${P.title || 0}</td>` : `<td class="num ${(P.script_exit || 0) >= 2 ? "item-ok" : "item-bad"}">${P.script_exit || 0}</td><td class="num ${(P.script_rebuttal || 0) >= 2 ? "item-ok" : "item-bad"}">${P.script_rebuttal || 0}</td>`}</tr>`; }))
        + `<p class="small">2회차 이상이어야 통과 (tools/persona_gate.py 기록)</p>`;
    }
    if (key === "ep_thumbs") return pre + L.map(ep => `<div class="scope">${e(ep.id)}</div><div class="thumbs">${(ep.thumbs || []).map(t => t.img ? `<figure><img src="${e(t.img)}" alt="${e(t.name)}" loading="lazy"><figcaption>${e(t.name)}</figcaption></figure>` : "").join("") || `<span class="empty">그림 없음</span>`}</div>`).join("");
    if (key === "ep_thumb_text") return pre + miniTable(["편", "주요 문구", "보조 문구"], L.map(ep => `<tr><td class="mono small">${e(ep.id)}</td><td>${(ep.thumb_main || []).map(e).join("<br>") || "–"}</td><td>${(ep.thumb_sub || []).map(e).join("<br>") || "–"}</td></tr>`));
    if (key === "intro") return pre + L.map(ep => { let s = 0; const I = []; for (const l of ep.lines || []) { if (s >= 30) break; s += sylSec(l.text); I.push(l); }
      return `<div class="scope">${e(ep.id)} — 도입 어림 ${Math.round(s)}초 ${s > 32 ? "⚠ 30초 넘음" : ""}</div><ol class="small">${I.map(l => `<li>${e(l.text)}</li>`).join("") || "<li>대본 줄 없음</li>"}</ol>`; }).join("");
    if (key === "chapters") return pre + L.map(ep => { const parts = []; for (const l of ep.lines || []) { const c = parts[parts.length - 1]; if (!c || c.part !== l.part) parts.push({ part: l.part, last: l.text }); else c.last = l.text; }
      return `<div class="scope">${e(ep.id)}</div>` + miniTable(["챕터", "끝 문장", "질문?"], parts.map(c => `<tr><td>${e(c.part || "—")}</td><td>${e(c.last)}</td><td class="${/[?？]\s*$/.test(c.last) ? "item-ok" : "item-bad"}">${/[?？]\s*$/.test(c.last) ? "질문" : "–"}</td></tr>`)); }).join("");
    if (key === "tts_state") return pre + miniTable(["편", "지금 음성", "판 체크"], L.map(ep => { const [c, t2] = ttsState(ep); return `<tr><td class="mono small">${e(ep.id)}</td><td>${e((ep.audio || {}).note || "없음")}</td><td><span class="chip ${c}">${e(t2)}</span></td></tr>`; }));
    if (key === "ep_video") return pre + miniTable(["편", "장면 파일", "렌더 기록", "업로드 조각", "길이"], L.map(ep => { const V = ep.video || {}; return `<tr><td class="mono small">${e(ep.id)}</td><td>${V.scene ? "✓" : "–"}</td><td>${V.render_md ? "✓" : "–"}</td><td>${V.packed ? (V.mb || "?") + "MB" : "–"}</td><td class="num">${V.duration_s ? Math.floor(V.duration_s / 60) + ":" + String(Math.round(V.duration_s % 60)).padStart(2, "0") : "–"}</td></tr>`; }));
    if (key === "skills") return skillsBox();
    if (key === "ep_upload") return pre + miniTable(["편", "제목 글자", "태그", "자동 점검"], L.map(ep => { const U = ep.upload || {}, it = U.items || []; return `<tr><td class="mono small">${e(ep.id)}</td><td class="num">${U.title_chars || "–"}</td><td class="num">${(U.tags || []).length || "–"}</td><td>${it.length ? it.filter(x => x[1]).length + "/" + it.length : "시트 없음"}${(U.problems || []).length ? ` · <span class="item-bad">문제 ${U.problems.length}</span>` : ""}</td></tr>`; }));
    if (key === "upload_log") { const log = eps(S.topic).flatMap(x => (x.history || []).map(h => ({ ...h, ep: x.id }))).sort((a, b) => String(b.uploadedAt).localeCompare(String(a.uploadedAt)));
      return miniTable(["올린 때", "편", "영상", "공개 예약", ""], log.map(h => `<tr><td class="mono">${e(String(h.uploadedAt || "").slice(0, 10))}</td><td class="mono">${e(h.ep)}</td><td>${/^https:\/\//.test(h.url || "") ? `<a href="${e(h.url)}" target="_blank" rel="noopener">${e(h.videoId)}</a>` : e(h.videoId)}</td><td class="mono">${e(String(h.publishAt || "").slice(0, 16).replace("T", " "))}</td><td>${h.current ? "지금" : "옛"}</td></tr>`)) || none("올린 기록 없음"); }
    return "";
  }
  const wr = () => (S.db && S.canWrite) ? "" : "disabled";

  // ───────── 피드백 (제목·썸네일·대본 줄·영상)
  function fbOf(topic, ep, stage, line) {
    return [...S.col.feedback.values()].filter(f => f.topic === topic && f.ep === ep && f.stage === stage && (line == null ? !f.line : Number(f.line) === Number(line)))
      .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  }
  function fbBox(ep, stage, line, hint) {
    const L = fbOf(ep.topic, ep.id, stage, line);
    const key = `fbnew:${ep.id}:${stage}:${line == null ? "" : line}`;
    const items = L.map(f => {
      const k = "fb:" + f.id;
      if (S.edit === k) return `<div class="fbitem"><textarea id="ed-${e(f.id)}">${e(f.text)}</textarea><div class="row"><button class="btn sm" data-act="fb-save" data-id="${e(f.id)}">저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div>`;
      return `<div class="fbitem"><div>${e(f.text)}</div>${f.reply ? `<div class="reply">Claude: ${e(f.reply)}</div>` : ""}<div class="meta">
        <span class="chip ${f.status === "done" ? "ok" : "warn"}">${f.status === "done" ? "반영함" : "반영 전"}</span><span>${e(String(f.at || f.createdAt || "").slice(0, 16).replace("T", " "))}</span>
        ${S.confirm === k ? `<span class="confirm">지울까요?<button class="btn bad sm" data-act="fb-del" data-id="${e(f.id)}">지우기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>`
          : `<button class="btn ghost sm" data-act="edit" data-k="${e(k)}" ${wr()}>고치기</button><button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>지우기</button>`}</div></div>`;
    }).join("");
    return `<div class="fb">${items}<textarea id="${e(key)}" placeholder="${e(hint || "피드백 — Claude 가 동기화 때 읽고 반영합니다")}"></textarea>
      <div class="row"><button class="btn sm" data-act="fb-add" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${stage}" data-line="${line == null ? "" : line}" data-k="${e(key)}" ${wr()}>피드백 남기기</button></div></div>`;
  }

  // ───────── 참고 자료 (분석 성공 사례 — 고치기·빼기·더하기)
  function refsOf(kind) {
    const R = (S.data[S.topic] || {}).refs || {};
    const base = (kind === "title" ? R.titles : R.thumbs) || [];
    const out = base.map(r => { const d = S.col.refs.get(r.id); return d ? { ...r, text: d.text ?? r.text, sub: d.sub ?? r.sub, note: d.note || "", deleted: !!d.deleted, doc: d } : r; });
    for (const d of S.col.refs.values()) if (d.topic === S.topic && d.kind === kind && !base.some(r => r.id === d.id)) out.unshift({ id: d.id, text: d.text, sub: d.sub, note: d.note, deleted: !!d.deleted, doc: d, added: true });
    return out;
  }
  function refsBox(kind) {
    const R = (S.data[S.topic] || {}).refs || {};
    const all = refsOf(kind);
    const q = S.refq.trim();
    const L = all.filter(r => !q || (r.text + " " + (r.sub || "") + " " + (r.channel || "")).includes(q));
    const shown = L.slice(0, S.open.has("refs-all-" + kind) ? 400 : 30);
    const item = r => {
      const k = `ref:${r.id}`;
      if (S.edit === k) return `<div class="ref noimg"><div class="fb"><input type="text" id="ed-${e(r.id)}" value="${e(r.text)}">${kind === "thumb" ? `<input type="text" id="eds-${e(r.id)}" value="${e(r.sub || "")}" placeholder="보조 문구">` : ""}
        <input type="text" id="edn-${e(r.id)}" value="${e(r.note || "")}" placeholder="메모 (왜 참고하는지)"><div class="row"><button class="btn sm" data-act="ref-save" data-id="${e(r.id)}" data-kind="${kind}">저장</button><button class="btn ghost sm" data-act="cancel">그만</button></div></div></div>`;
      const meta = [r.channel, r.views != null ? "조회 " + fmtN(r.views) : "", r.ratio != null ? "구독자 배수 " + r.ratio : "", r.published, r.shorts ? "쇼츠" : "", r.format].filter(Boolean).join(" · ");
      return `<div class="ref ${r.img ? "" : "noimg"}" ${r.deleted ? 'style="opacity:.5"' : ""}>${r.img ? `<img src="${e(r.img)}" alt="" loading="lazy">` : ""}<div style="min-width:0;display:grid;gap:2px">
        <div class="t">${r.deleted ? "<s>" + e(r.text) + "</s>" : e(r.text)}</div>${kind === "thumb" && r.sub ? `<div class="s">보조: ${e(r.sub)}</div>` : ""}
        ${kind === "thumb" && r.title ? `<div class="s">제목: ${e(r.title)}</div>` : ""}<div class="s">${e(meta)}${r.vid ? ` · <a href="https://www.youtube.com/watch?v=${encodeURIComponent(r.vid)}" target="_blank" rel="noopener">영상</a>` : ""}</div>
        ${r.note ? `<div class="s">메모: ${e(r.note)}</div>` : ""}<div class="row">${r.added ? `<span class="chip acc">판에서 더함</span>` : ""}${r.doc ? pendChip(r.doc) : ""}
        ${S.confirm === k ? `<span class="confirm">참고 자료에서 뺄까요?<button class="btn bad sm" data-act="ref-del" data-id="${e(r.id)}" data-kind="${kind}">빼기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>`
          : r.deleted ? `<button class="btn ghost sm" data-act="ref-undel" data-id="${e(r.id)}" data-kind="${kind}" ${wr()}>되살리기</button>`
          : `<button class="btn ghost sm" data-act="edit" data-k="${e(k)}" ${wr()}>고치기</button><button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>빼기</button>`}</div></div></div>`;
    };
    const note = kind === "thumb" && !all.length ? `<p class="empty">${e(R.thumb_note || "성공 사례 썸네일 문구가 아직 없음")}</p>` : "";
    return `<section class="box"><header><h2>${kind === "title" ? "성공 사례 제목" : "성공 사례 썸네일 문구"}</h2><span class="small">${all.filter(r => !r.deleted).length}개 · 기본 = 분석 결과</span></header>
      <p class="small">${e(kind === "title" ? R.source || "" : R.thumb_source || R.source || "")} — 고치거나 빼거나 더할 수 있습니다 (분석 원본은 그대로, 판에만 저장).</p>
      <input type="text" id="refq" placeholder="찾기 — 낱말·채널" value="${e(S.refq)}">${note}
      <div>${shown.map(item).join("") || `<div class="empty">맞는 것 없음</div>`}</div>
      ${L.length > shown.length ? `<button class="btn ghost sm" data-act="open" data-k="refs-all-${kind}">${L.length - shown.length}개 더 보기</button>` : ""}
      <details><summary class="small">참고 자료 더하기</summary><div class="fb" style="margin-top:6px"><input type="text" id="nref-${kind}" placeholder="${kind === "title" ? "제목" : "주요 문구"}">
        ${kind === "thumb" ? `<input type="text" id="nrefs-${kind}" placeholder="보조 문구 (선택)">` : ""}<input type="text" id="nrefn-${kind}" placeholder="메모 — 어디서 봤는지, 왜 참고하는지">
        <div class="row"><button class="btn sm" data-act="ref-add" data-kind="${kind}" ${wr()}>더하기</button></div></div></details></section>`;
  }
  function wordsBox() {
    const R = (S.data[S.topic] || {}).refs || {};
    const chips = (R.freq || []).map(w => `<span class="word">${e(w.word)}<b>${w.n}</b></span>`).join("");
    const tbl = (L, cap) => L && L.length ? `<div class="tablebox"><table><caption class="small" style="text-align:left">${cap}</caption><thead><tr><th>낱말·꼴</th><th>든 제목</th><th>성공 비율</th><th>차이</th></tr></thead><tbody>${L.map(w => `<tr><td>${e(w.word)}</td><td class="num">${w.n}</td><td class="num">${Math.round(w.rate * 100)}%</td><td class="num">${w.diff > 0 ? "+" : ""}${Math.round(w.diff * 100)}%p</td></tr>`).join("")}</tbody></table></div>` : "";
    const rel = ((S.data[S.topic] || {}).related || []).map(docHtml).join("");
    return `<section class="box"><header><h2>자주 쓰는 낱말</h2><span class="small">성공 사례 제목 ${(R.titles || []).length}개에서</span></header>
      <div class="words">${chips || `<span class="empty">아직 없음</span>`}</div>${tbl(R.features, "제목 꼴 — 있을 때 성공 비율")}${tbl(R.words_up, "있으면 성공 비율이 높은 낱말")}${tbl(R.words_down, "있으면 성공 비율이 낮은 낱말")}
      ${rel ? `<div class="scope">관련 영상 낱말·형식 (tools/related_titles.py)</div>${rel}` : ""}</section>`;
  }
  const docHtml = d => `<details class="doc-d"><summary>${e(d.title)} <span class="chip mute">${e(d.date)}</span></summary><p class="small mono">${e(d.path)}${d.cut ? " · 앞부분만" : ""}</p><div class="doc">${d.html}</div></details>`;

  // ───────── 명령 상자
  const cmd = (lab, text) => `<div class="cmdbox"><span class="lab">${e(lab)}</span><pre class="cmd">${e(text)}</pre><div class="row"><button class="btn ghost sm" data-act="copy" data-text="${e(text)}">복사</button></div></div>`;

  // ───────── v1.3 단계 단추 — [통과 → 다음 단계] · [← 이전 단계]
  const nextOf = s => STAGES[STAGES.indexOf(s) + 1] || null;
  const prevOf = s => STAGES[STAGES.indexOf(s) - 1] || null;
  const uploaded = ep => (ep.history || []).some(h => h.current);
  function stageBtns(ep) {
    const cur = at(ep), dis = (!S.db || !S.canWrite) ? "disabled" : "";
    if (cur === "done") {
      if (uploaded(ep)) return "";
      return `<div class="stagebtns"><span class="chip ok">업로드 준비 완료</span><button class="btn ghost" data-act="back" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="upload" ${dis}>← 준비 취소 (업로드 단계로)</button></div>`;
    }
    const nx = nextOf(cur), pv = prevOf(cur);
    const label = cur === "upload" ? "업로드 준비 완료 → PC 올릴 대본" : `${SK[cur]} 통과 → ${nx ? SK[nx] : "끝"}`;
    return `<div class="stagebtns"><button class="btn" data-act="pass" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${cur}" ${dis}>✓ ${e(label)}</button>${pv
      ? `<button class="btn ghost" data-act="back" data-topic="${e(ep.topic)}" data-ep="${e(ep.id)}" data-stage="${pv}" ${dis}>← 이전 단계 (${e(SK[pv])})</button>` : ""}</div>`;
  }
  function eligible(v) { return eps(S.topic).filter(ep => v.stages.includes(at(ep))); }

  // ───────── v1.3 구글 트렌드 — 줄마다 단어 8개 → 링크 → CSV 올리기
  const TREND_TIMES = [["now 7-d", "지난 7일"], ["today 1-m", "지난 1개월"], ["today 3-m", "지난 3개월"], ["today 12-m", "지난 12개월"], ["today 5-y", "지난 5년"]];
  const TREND_PROPS = [["youtube", "유튜브 검색"], ["", "웹 검색"]];
  const normW = s => String(s || "").replace(/\s+/g, "").toLowerCase();
  function trendOpt(topic) {
    const d = S.col.trends.get(topic) || {};
    const D = (S.common || {}).trends_defaults || {};
    return { time: d.time || D.time || "today 3-m", gprop: d.gprop != null ? d.gprop : (D.gprop != null ? D.gprop : "youtube"), every_hours: Number(d.every_hours || D.every_hours || 24) };
  }
  function trendRows(topic) {
    const all = [...S.col.trend_rows.values()].filter(r => r.topic === topic);
    if (all.length) return all.filter(r => !r.deleted).sort((a, b) => (a.n || 0) - (b.n || 0));
    const C = S.common || {}, st = ((C.state || {}).trends || {}).topics || {};
    const def = ((st[topic] || {}).words || ((C.trends_defaults || {}).words || {})[topic] || []);   // 아직 저장한 줄이 없으면 기본 검색어로 줄을 채워 보여 줌 ([링크 생성] 때 저장)
    const rows = [], rest = def.slice(8);                                // 둘째 줄부터도 첫 단어(기준)로 시작 — 줄끼리 크기를 견줄 수 있게
    if (def.length) rows.push({ id: `${topic}.r1`, topic, n: 1, words: def.slice(0, 8), draft: true });
    for (let i = 0; i < rest.length; i += 7) rows.push({ id: `${topic}.r${rows.length + 1}`, topic, n: rows.length + 1, words: [def[0], ...rest.slice(i, i + 7)], draft: true });
    return rows.length ? rows : [{ id: `${topic}.r1`, topic, n: 1, words: [], draft: true }];
  }
  function trendParts(words, opt) {
    const W = (words || []).map(x => String(x || "").trim()).filter(Boolean).slice(0, 8);
    if (!W.length) return [];
    const groups = W.length <= 5 ? [W] : [W.slice(0, 5), [W[0], ...W.slice(5)]];      // 구글 트렌드는 한 번에 5개까지 — 6개부터는 첫 낱말을 기준으로 둘로
    return groups.map((q, i) => ({ part: i + 1, q, url: "https://trends.google.com/trends/explore?" + [`date=${encodeURIComponent(opt.time)}`, "geo=KR",
      opt.gprop ? `gprop=${encodeURIComponent(opt.gprop)}` : "", `q=${q.map(encodeURIComponent).join(",")}`, "hl=ko"].filter(Boolean).join("&") }));
  }
  const csvId = (row, part) => `${row.id}.p${part}`;
  function csvFor(row, p, opt) {
    const d = S.col.trend_csv.get(csvId(row, p.part));
    if (!d) return null;
    const same = (d.q || []).map(normW).join("|") === p.q.map(normW).join("|") && (d.time || "") === opt.time && (d.gprop ?? "youtube") === opt.gprop;
    return { doc: d, same };
  }
  function parseTrendsCsv(text) {
    const lines = String(text || "").replace(/^﻿/, "").split(/\r?\n/).filter(x => x.trim());
    const hi = lines.findIndex(x => /^(주|Week|일|Day|월|Month|시간|Time)\s*,/.test(x));
    if (hi < 0) return null;
    const head = lines[hi].split(",");
    const words = head.slice(1).map(h => h.replace(/:\s*\(.*\)\s*$/, "").trim());
    const series = words.map(() => []), dates = [];
    for (const ln of lines.slice(hi + 1)) {
      const c = ln.split(",");
      if (c.length < 2) continue;
      dates.push(c[0]);
      words.forEach((_, i) => { const v = (c[i + 1] || "").trim(); series[i].push(v === "<1" ? 0.5 : (Number(v) || 0)); });
    }
    return { dates: dates.length ? [dates[0], dates[dates.length - 1]] : [], words: words.map((w, i) => {
      const s = series[i], last = s.slice(-4), prev = s.slice(-8, -4), avg = s.reduce((a, b) => a + b, 0) / (s.length || 1);
      const l4 = last.reduce((a, b) => a + b, 0) / (last.length || 1), p4 = prev.reduce((a, b) => a + b, 0) / (prev.length || 1);
      return { word: w, avg: Math.round(avg * 10) / 10, last4: Math.round(l4 * 10) / 10, change: prev.length && p4 ? Math.round(l4 / p4 * 100) / 100 : null, series: s.slice(-26) };
    }) };
  }
  function spark(series) {
    if (!series || series.length < 2) return "";
    const mx = Math.max(1, ...series), w = 120, h = 28, n = series.length;
    const pts = series.map((v, i) => `${(i / (n - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - v / mx * (h - 6)).toFixed(1)}`);
    const last = pts[pts.length - 1].split(",");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4"/></svg>`;
  }
  function trendsResult(tr, label) {
    if (!tr || !tr.period) return `<p class="empty">${e(label)}: PC 결과 아직 없음 — 아래 PC 명령을 켜 두면 간격마다 받아 올립니다.</p>`;
    const ts = (tr.timeseries || []).flatMap(b => b.words.map(w => ({ ...w, dates: b.dates, file: b.file })));
    const t1 = ts.length ? `<div class="tablebox"><table><thead><tr><th>낱말</th><th>평균</th><th>최근 4칸</th><th>앞 4칸 대비</th><th>흐름</th></tr></thead><tbody>${ts.map(w => `<tr><td>${e(w.word)}</td><td class="num">${w.avg}</td><td class="num">${w.last4}</td><td class="num">${w.change == null ? "–" : "×" + w.change}</td><td>${spark(w.series)}</td></tr>`).join("")}</tbody></table></div>` : "";
    const t2 = (tr.related || []).map(r => `<details><summary>${e(r.keyword || CATS[r.cat] || "분류 " + r.cat)} — 급상승 ${r.rising.length} · 인기 ${r.top.length}</summary>
      <div class="grid2" style="margin-top:6px"><div><div class="scope">급상승</div><div class="words">${r.rising.map(x => `<span class="word">${e(x[0])}<b>${e(x[1] || "")}</b></span>`).join("") || `<span class="empty">없음</span>`}</div></div>
      <div><div class="scope">인기</div><div class="words">${r.top.map(x => `<span class="word">${e(x)}</span>`).join("") || `<span class="empty">없음</span>`}</div></div></div></details>`).join("");
    return `<div class="small">${e(label)} · 결과 ${e(tr.period)} · 올린 때 ${e(String(tr.pushed || "").slice(0, 16).replace("T", " "))} · <span class="mono">${e(tr.dir)}</span></div>${t1}${t2}`;
  }
  function trendsSetting(key, label, defaults) {                       // 전체 탐색(분류 번호) — 새 분야 주제의 주제 탐색에서만
    const d = S.col.trends.get(key);
    const st = ((S.common || {}).state || {}).trends || null;
    const repoCur = st && st.overall;
    const words = d ? (d.cats || []).join(", ") : (defaults.cats || []).join(", ");
    const hours = (d && d.every_hours) || (repoCur && repoCur.every_hours) || ((S.common || {}).trends_defaults || {}).every_hours || 24;
    return `<div class="card"><div class="ephead"><h3>${e(label)}</h3><div class="row">${d ? pendChip(d) : `<span class="chip mute">기본값 (studio.toml)</span>`}</div></div>
      <label class="small" for="tw-${e(key)}">분류 번호 (쉼표로) — ${Object.entries(CATS).slice(0, 8).map(([k, v]) => k + " " + v).join(" · ")}</label>
      <input type="text" id="tw-${e(key)}" value="${e(words)}">
      <div class="row"><label class="small" for="th-${e(key)}">다시 받는 간격</label><select id="th-${e(key)}" style="width:auto">${[6, 12, 24, 48, 168].map(h => `<option value="${h}" ${Number(hours) === h ? "selected" : ""}>${h < 24 ? h + "시간" : h / 24 + "일"}</option>`).join("")}</select>
      <button class="btn sm" data-act="trends-save" data-key="${e(key)}" data-overall="1" ${wr()}>저장</button></div>
      <p class="small">저장소(PC 가 읽는 곳): ${repoCur ? e((repoCur.cats || []).join(", ")) + " · " + e(repoCur.every_hours) + "시간마다" : "아직 동기화 전"}</p></div>`;
  }
  function trendTable(text) {
    const r = parseTrendsCsv(text);
    if (!r || !r.words.length) return `<p class="small item-bad">CSV 를 읽지 못했습니다</p>`;
    return `<div class="tablebox"><table><thead><tr><th>낱말</th><th>평균</th><th>최근 4칸</th><th>앞 4칸 대비</th><th>흐름</th></tr></thead><tbody>${r.words.map(w => `<tr><td>${e(w.word)}</td><td class="num">${w.avg}</td><td class="num">${w.last4}</td><td class="num">${w.change == null ? "–" : "×" + w.change}</td><td>${spark(w.series)}</td></tr>`).join("")}</tbody></table></div>
      <p class="small">${e(r.dates.join(" ~ "))} · 값은 같은 링크 안 낱말끼리만 비교 (0~100)</p>`;
  }
  function trendStatus(topic) {
    const opt = trendOpt(topic), rows = trendRows(topic);
    let need = 0, have = 0;
    for (const r of rows) for (const p of trendParts(r.words, opt)) { need++; const c = csvFor(r, p, opt); if (c && c.same && !r.draft) have++; }
    return { need, have, done: need > 0 && have === need };
  }
  function trendsBox() {
    const opt = trendOpt(S.topic), rows = trendRows(S.topic), st = trendStatus(S.topic);
    const body = rows.map((r, ri) => {
      const parts = r.draft ? [] : trendParts(r.words, opt);
      const k = "tr:" + r.id;
      const inputs = Array.from({ length: 8 }, (_, i) => `<input type="text" id="tw-${e(r.id)}-${i}" value="${e((r.words || [])[i] || "")}" placeholder="단어 ${i + 1}" aria-label="${ri + 1}번째 줄 단어 ${i + 1}">`).join("");
      const links = parts.map(p => {
        const c = csvFor(r, p, opt);
        return `<div class="tlink"><div class="row"><a class="btn ghost sm" href="${e(p.url)}" target="_blank" rel="noopener">링크 ${p.part} 열기 ↗</a><span class="small">${e(p.q.join(" · "))}</span>
            ${c && c.same ? `<span class="chip ok">CSV 올림 ✓</span>` : c ? `<span class="chip warn">CSV 가 지금 단어·기간과 다름 — 다시 올리기</span>` : `<span class="chip mute">CSV 아직</span>`}
            <label class="btn ghost sm filebtn">CSV 올리기<input type="file" accept=".csv,text/csv" data-act="csv" data-row="${e(r.id)}" data-part="${p.part}" ${wr()}></label></div>
          ${c && c.same ? `<details><summary class="small">결과 보기 — ${e(c.doc.file || "CSV")} · ${e(String(c.doc.uploadedAt || "").slice(0, 16).replace("T", " "))}</summary>${trendTable(c.doc.text)}</details>` : ""}</div>`;
      }).join("");
      const rdone = parts.length && parts.every(p => { const c = csvFor(r, p, opt); return c && c.same; });
      return `<div class="card trow"><div class="ephead"><h3>${ri + 1}번째 줄</h3><div class="row">${r.draft ? `<span class="chip mute">저장 전 — [링크 생성]을 누르면 저장</span>` : rdone ? `<span class="chip ok">완료</span>` : parts.length ? `<span class="chip warn">CSV ${parts.filter(p => { const c = csvFor(r, p, opt); return c && c.same; }).length}/${parts.length}</span>` : ""}
          ${S.confirm === k ? `<span class="confirm">이 줄을 지울까요?<button class="btn bad sm" data-act="tr-del" data-id="${e(r.id)}">지우기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>` : (!r.draft ? `<button class="btn ghost sm" data-act="ask" data-k="${e(k)}" ${wr()}>줄 지우기</button>` : "")}</div></div>
        <div class="tinputs">${inputs}</div>
        <div class="row"><button class="btn sm" data-act="tr-link" data-id="${e(r.id)}" data-n="${r.n || ri + 1}" ${wr()}>링크 생성</button><span class="small">6~8개면 링크 둘 (구글 트렌드는 한 번에 5개까지 — 첫 단어를 둘 다에 넣어 크기를 맞춤)</span></div>
        ${links}</div>`;
    }).join("");
    return `<section class="box"><header><h2>구글 트렌드</h2><span class="chip ${st.done ? "ok" : st.have ? "warn" : "mute"}">${st.done ? "완료 — CSV " + st.have + "/" + st.need : "CSV " + st.have + "/" + st.need}</span></header>
      <div class="row"><label class="small" for="tr-time">기간</label><select id="tr-time" data-act="tr-opt" style="width:auto">${TREND_TIMES.map(([v, l]) => `<option value="${v}" ${opt.time === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <label class="small" for="tr-gprop">대상</label><select id="tr-gprop" data-act="tr-opt" style="width:auto">${TREND_PROPS.map(([v, l]) => `<option value="${v}" ${opt.gprop === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        <span class="small">한국 · 바꾸면 링크가 새로 만들어지고 CSV 도 다시 올려야 함</span></div>
      <p class="small">줄마다 단어 8개까지 → [링크 생성] → 링크 열기 → 구글 트렌드 그래프 오른쪽 위 ⤓(CSV 다운로드) → 그 줄의 [CSV 올리기]. 모든 링크의 CSV 가 올라가면 '완료'. 지금 크게 오르는 검색어 전체는 <a href="https://trends.google.com/trending?geo=KR" target="_blank" rel="noopener">구글 트렌드 인기 급상승 (한국)</a>.</p>
      ${body}
      <div class="row"><button class="btn ghost sm" data-act="tr-add" ${wr()}>줄 더하기</button><label class="btn ghost sm filebtn">CSV 여러 개 한 번에 올리기<input type="file" accept=".csv,text/csv" multiple data-act="csv-bulk" ${wr()}></label><span class="small">여러 개는 CSV 안의 단어로 맞는 링크를 찾아 넣음</span></div>
      <details><summary class="small">PC 가 간격마다 저절로 받기 (선택)</summary><div class="fb" style="margin-top:6px">
        <div class="row"><label class="small" for="tr-hours">다시 받는 간격</label><select id="tr-hours" data-act="tr-opt" style="width:auto">${[6, 12, 24, 48, 168].map(h => `<option value="${h}" ${opt.every_hours === h ? "selected" : ""}>${h < 24 ? h + "시간" : h / 24 + "일"}</option>`).join("")}</select>
          <span class="small">PC 는 위 줄의 링크와 같은 단어 묶음을 받습니다 (Claude 동기화 뒤)</span></div>
        ${cmd("PC — 간격마다 받아 올리기 (켜 두기 · 멈춤 Ctrl+C)", "powershell -ExecutionPolicy Bypass -File run_analyzer.ps1 -TrendsWatch")}
        ${cmd("PC — 한 번만 받기", "powershell -ExecutionPolicy Bypass -File run_analyzer.ps1 -TrendsWatch -Once")}
        ${S.topic === (((S.common || {}).trends_defaults || {}).overall || {}).topic ? trendsSetting("overall", "전체 탐색 (주제 없이 분류만 · 관련 검색어 인기·급상승)", ((S.common || {}).trends_defaults || {}).overall || {}, true) : ""}</div></details></section>`;
  }
  function trendsResultBox() {
    const opt = trendOpt(S.topic), out = [];
    trendRows(S.topic).forEach((r, ri) => trendParts(r.draft ? [] : r.words, opt).forEach(p => { const c = csvFor(r, p, opt); if (c && c.same) out.push(`<div class="scope">${ri + 1}번째 줄 · 링크 ${p.part} — ${e(p.q.join(" · "))}</div>${trendTable(c.doc.text)}`); }));
    const pc = ((S.common || {}).topic_trends || {})[S.topic];
    return `<section class="box"><header><h2>구글 트렌드 결과</h2><span class="small">${TREND_TIMES.find(x => x[0] === opt.time)?.[1] || opt.time} · ${opt.gprop ? "유튜브 검색" : "웹 검색"}</span></header>${out.join("") || `<p class="empty">올린 CSV 없음 — 작업 화면의 구글 트렌드에서 링크 → CSV 올리기</p>`}
      <details><summary class="small">PC 저절로 받기 결과${pc && pc.period ? " (" + e(pc.period) + ")" : " — 없음"}</summary>${trendsResult(pc, tname(S.topic))}${S.topic === (((S.common || {}).trends_defaults || {}).overall || {}).topic ? trendsResult((S.common || {}).overall_trends, "전체 탐색") : ""}</details></section>`;
  }

  // ───────── 주제 켜기·끄기 (머리 띠에서 여닫음)
  function topicsPanel() {
    return `<section class="box"><header><h2>주제 켜기·끄기</h2><button class="btn ghost sm" data-act="panel">닫기</button></header>
      <ul class="list">${B.topics.map(t => { const on = topicOn(t), d = S.col.topics.get(t.key); const sum = (((S.common || {}).summary || {})[t.key] || []).length;
        return `<li class="row" style="justify-content:space-between"><label class="gate ${on ? "on" : ""}"><input type="checkbox" data-act="topic-on" data-key="${e(t.key)}" ${on ? "checked" : ""} ${wr()}>${e(t.name)} <span class="mono small">${e(t.key)}</span></label>
          <span class="row small">${on ? (t.built ? `편 ${sum}` : `<span class="chip warn">다시 켬 — Claude 동기화 뒤 자료</span>`) : `<span class="chip mute">꺼짐</span>`}${d ? pendChip(d) : ""}</span></li>`; }).join("")}</ul>
      ${Object.keys(MERGE).length ? `<p class="small">합친 주제: ${Object.entries(MERGE).map(([c, p]) => `${e(tname(c))} → ${e(tname(p))} 안에 (편·규칙·결과·트렌드 · 저장소 폴더 <span class="mono">${e(c)}/</span> 는 그대로)`).join(" · ")}</p>` : ""}
      <p class="small">끈 주제는 판에서 바로 사라지고, Claude 가 동기화하면 Claude 세션·음성·업로드·채널 도구도 그 주제를 읽지 않습니다. 다시 켜면 다음 동기화부터.</p>
      <details><summary class="small">켠 주제마다 단계별 편 수</summary><div class="tablebox"><table><thead><tr><th>주제</th>${STAGES.map(s => `<th>${e(SK[s])}</th>`).join("")}<th>끝</th></tr></thead><tbody>${visTopics().map(t => { const cnt = {}; for (const ep of eps(t.key)) { const a = at(ep); cnt[a] = (cnt[a] || 0) + 1; }
        return `<tr><td>${e(t.name)}</td>${STAGES.map(s => `<td class="num">${cnt[s] || ""}</td>`).join("")}<td class="num">${cnt.done || ""}</td></tr>`; }).join("")}</tbody></table></div></details></section>`;
  }

  // ───────── 1 주제 탐색
  function personaHtml(p) {
    const F = [["situation", "상황"], ["curiosity", "호기심"], ["worry", "걱정"], ["anxiety", "불안"], ["wants", "원하는 것"], ["habit", "버릇"]];
    const rows = F.map(([k, nm]) => { const v = p[k]; const L = Array.isArray(v) ? v : v ? [v] : []; return L.length ? `<dt>${nm}</dt><dd>${L.map(x => e(x.text)).join("<br>")}</dd>` : ""; }).join("");
    return `<details class="persona"><summary>${e(p.name)} <span class="small">근거 댓글 ${p.n}</span></summary><div class="who">${e(p.who)}</div><dl>${rows}</dl>
      ${(p.quotes || []).length ? `<details><summary class="small">원문 댓글 ${p.quotes.length}</summary><ul class="small">${p.quotes.map(q => `<li>“${e(q.text)}” (공감 ${q.likes})</li>`).join("")}</ul></details>` : ""}</details>`;
  }
  function viewTopic() {
    const D = S.data[S.topic] || {};
    const v = VIEWS.find(x => x.key === "topic");
    const L = eligible(v);
    const lg = D.legacy || {};
    const chans = [...S.col.channels.values()].filter(c => (c.topic || S.topic) === S.topic).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const cards = L.map(ep => `<div class="card">${epHead(ep, stageBtns(ep))}
      ${ep.kind === "cand" ? `${ep.memo ? `<p class="small">메모: ${e(ep.memo)}</p>` : ""}<div class="row">${S.confirm === "cand:" + ep.docId ? `<span class="confirm">이 후보를 지울까요?<button class="btn bad sm" data-act="cand-del" data-id="${e(ep.docId)}">지우기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>` : `<button class="btn ghost sm" data-act="ask" data-k="cand:${e(ep.docId)}" ${wr()}>후보 지우기</button>`}</div>` : ""}
      <details ${S.open.has("fbo:" + ep.id + ":topic") ? "open" : ""} data-k="fbo:${e(ep.id)}:topic"><summary class="small">주제 피드백 ${fbOf(ep.topic, ep.id, "topic").length}</summary>${fbBox(ep, "topic", null)}</details></div>`).join("");
    const tr = lg.transcript || {};
    const work = `${trendsBox()}
      <section class="box"><header><h2>주제 후보</h2><span class="small">주제 단계에서 기다리는 편 ${L.length} · [통과]를 누르면 제목 단계로</span></header>
        <div class="fb"><input type="text" id="nc-title" placeholder="새 후보 — 예: 남의 뒷말을 전하는 사람의 심리"><input type="text" id="nc-memo" placeholder="메모 — 근거(탐색 결과 몇 번, 트렌드 줄 등)">
        <div class="row"><button class="btn sm" data-act="cand-add" ${wr()}>후보 더하기</button></div></div>
        <div class="list">${cards || `<div class="empty">주제 단계에서 기다리는 후보 없음</div>`}</div></section>
      <section class="box"><h2>탐색할 고정 채널</h2><p class="small">채널 ID(UC…)·주소·@이름 — 여러 개는 줄을 바꿔서. Claude 가 다음 분석 때 탐색 목록에 더하고 결과를 적습니다.</p>
        <textarea id="ch-in" placeholder="UCxxxxxxxxxxxxxxxxxxxxxx&#10;@채널이름"></textarea><input type="text" id="ch-memo" placeholder="메모 (선택)">
        <div class="row"><button class="btn sm" data-act="ch-add" ${wr()}>채널 넣기</button></div>
        <ul class="list">${chans.map(c => `<li class="card"><div class="row"><span class="chip ${c.status === "done" ? "ok" : c.status === "fail" ? "bad" : "warn"}">${c.status === "done" ? "반영됨" : c.status === "fail" ? "못 찾음" : "반영 전"}</span><code>${e(c.input)}</code></div>${c.memo ? `<span class="small">메모: ${e(c.memo)}</span>` : ""}${c.reply ? `<span class="small">Claude: ${e(c.reply)}</span>` : ""}
          <div class="row">${S.confirm === "ch:" + c.id ? `<span class="confirm">지울까요?<button class="btn bad sm" data-act="ch-del" data-id="${e(c.id)}">지우기</button><button class="btn ghost sm" data-act="cancel">그대로</button></span>` : `<button class="btn ghost sm" data-act="ask" data-k="ch:${e(c.id)}" ${wr()}>지우기</button>`}</div></li>`).join("")}</ul></section>
      ${tr.command ? `<section class="box"><h2>대본 받기 (PC)</h2><p class="small">${e(tr.why || "")} (목록 ${e(tr.made || "")})</p>${cmd("PC 명령", tr.command)}</section>` : ""}`;
    const rules = stepsBox("topic");
    return { work, rules };
  }

  // ───────── 2 제목 · 3 썸네일
  function viewTitle() {
    const v = VIEWS.find(x => x.key === "title");
    const L = eligible(v);
    const cards = L.map(ep => `<div class="card">${epHead(ep, stageBtns(ep))}
      ${(ep.title_alts || []).length ? `<details><summary class="small">다른 안 ${ep.title_alts.length}</summary><ul class="small">${ep.title_alts.map(a => `<li>${e(a.title)} <span class="mono">(${e(a.key)})</span></li>`).join("")}</ul></details>` : ""}
      ${ep.title_why ? `<details><summary class="small">제목 근거</summary><p class="small">${e(ep.title_why)}</p></details>` : ""}
      <div class="row small">${ep.persona && ep.persona.title ? `<span class="chip ok">페르소나 title ${ep.persona.title}회차</span>` : `<span class="chip warn">페르소나 title 검증 기록 없음</span>`}</div>
      <div class="scope">제목 피드백</div>${fbBox(ep, "title", null, "제목 피드백 — 예: '심리' 대신 시청자가 겪는 장면으로")}</div>`).join("");
    return { work: `<section class="box"><header><h2>제목</h2><span class="small">제목 단계에서 기다리는 편 ${L.length}</span></header>
      <div class="list">${cards || `<div class="empty">제목 단계에서 기다리는 편이 없음 (주제 단계에서 [통과]를 누르면 여기로)</div>`}</div></section>`,
      rules: stepsBox("title") };
  }
  function viewThumb() {
    const v = VIEWS.find(x => x.key === "thumb");
    const L = eligible(v);
    const cards = L.map(ep => `<div class="card">${epHead(ep, stageBtns(ep))}
      <div class="grid2"><div><div class="scope">주요 문구</div><div>${(ep.thumb_main || []).map(x => `<div style="font-weight:700">${e(x)}</div>`).join("") || `<span class="empty">없음</span>`}</div></div>
      <div><div class="scope">보조 문구</div><div>${(ep.thumb_sub || []).map(x => `<div>${e(x)}</div>`).join("") || `<span class="empty">없음</span>`}</div></div></div>
      <div class="thumbs">${(ep.thumbs || []).map(t => t.img ? `<figure><img src="${e(t.img)}" alt="${e(t.name)}" loading="lazy"><figcaption>${e(t.name)}</figcaption></figure>` : "").join("") || `<span class="empty">썸네일 그림 없음 — ChatGPT 요청 파일(thumbnails_chatgpt.md)부터</span>`}</div>
      <div class="scope">썸네일 피드백 (문구·그림)</div>${fbBox(ep, "thumb", null, "썸네일 피드백 — 예: 말풍선이 얼굴을 가림 · 2줄째를 더 짧게")}</div>`).join("");
    return { work: `<section class="box"><header><h2>썸네일 문구 · 이미지</h2><span class="small">썸네일 단계에서 기다리는 편 ${L.length}</span></header>
      <div class="list">${cards || `<div class="empty">썸네일 단계에서 기다리는 편이 없음 (제목 단계에서 [통과]를 누르면 여기로)</div>`}</div></section>`,
      rules: stepsBox("thumb") };
  }

  // ───────── 4 대본 · 음성
  function picker(v, list) {

        <div class="tiles"><div class="tile"><span class="k">구독자</span><span class="v">${ch.hidden_subs ? "숨김" : fmtN(ch.subs)}</span></div><div class="tile"><span class="k">총 조회수</span><span class="v">${fmtN(ch.views)}</span></div>

        ${rec.length ? `<div class="tablebox"><table><thead><tr><th>올린 날</th><th>제목</th><th>조회수</th><th>하루 조회수</th><th>좋아요</th><th>댓글</th><th>길이</th><th>판 편</th></tr></thead><tbody>${rec.map(r => `<tr><td class="mono">${e(String(r.published || "").slice(0, 10))}</td><td><a href="https://www.youtube.com/watch?v=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">${e(r.title)}</a>${r.shorts ? ' <span class="chip info">쇼츠</span>' : ""}</td><td class="num">${fmtN(r.views)}</td><td class="num">${r.vpd == null ? "–" : r.vpd}</td><td class="num">${fmtN(r.likes)}</td><td class="num">${fmtN(r.comments)}</td><td class="num">${e(r.duration || "")}</td><td class="mono small">${byVid[r.id] ? e(byVid[r.id].id) : ""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">공개된 영상 없음 (예약·비공개 영상은 공개 자료로는 안 보임)</p>`}
        ${(ch.analytics || null) ? `<div class="scope">시청 분석 (OAuth)</div><pre class="cmd">${e(JSON.stringify(ch.analytics, null, 1))}</pre>` : ""}</section>`;

    return `${chans || `<section class="box"><p class="empty">${e(C.note || "채널 자료 없음")}</p></section>`}
      <section class="box"><h2>채널 자료</h2><p class="small">받은 때 ${e(C.made || "아직")} · ${e(C.source || "")} — 공개 지표는 YouTube Data API 로 Claude 세션에서, 시청 지속·클릭률·유입 경로는 채널 주인 인증(OAuth)이라 PC 에서 받습니다.</p>
        ${cmd("Claude 에게", "채널 분석 새로 받아")}</section>`;
  }

  // ───────── 그리기
  function renderNav() {
    $("nav").innerHTML = VIEWS.map((v, i) => {
      const n = v.stages ? eps(S.topic).filter(ep => v.stages.includes(at(ep))).length : null;
      return (v.key === "channel" ? `<li class="sep" aria-hidden="true">|</li>` : "") + `<li><a href="#${v.key}" ${S.view === v.key ? 'aria-current="page"' : ""}>${v.n ? `<span class="n">${v.n}</span>` : ""}${e(v.label)}${n ? `<span class="c" title="이 단계에서 기다리는 편">${n}</span>` : ""}</a></li>`;
    }).join("");
    $("topics").innerHTML = visTopics().map(t => `<button class="pill" type="button" data-act="topic" data-key="${e(t.key)}" aria-pressed="${t.key === S.topic}">${e(t.name)}</button>`).join("")
      + `<button class="pill ghostpill" type="button" data-act="panel" aria-expanded="${S.panel}">주제 켜기·끄기</button>`;
    const pend = COLS.reduce((a, c) => a + [...S.col[c].values()].filter(pendingDoc).length, 0);
    $("pend").innerHTML = pend ? `판에서 바꾼 것 ${pend}건이 아직 저장소에 없음 — Claude 에게 <b>'제작 판 동기화해'</b>` : `마지막 동기화 ${e(String(syncedAt() || "아직").slice(0, 16).replace("T", " "))}`;
    $("panel").innerHTML = S.panel ? topicsPanel() : "";
  }
  let rq = null;
  function render() {
    fixTopic();
    renderNav();
    if (!S.common) { $("view").innerHTML = `<div class="loading">판 자료를 불러오는 중…</div>`; return; }
    const topicView = S.view !== "channel";
    if (topicView && !tinfo(S.topic).built) { $("view").innerHTML = `<section class="box"><h2>${e(tname(S.topic))}</h2><p class="small">이 주제는 꺼져 있던 때 판을 만들어 자료가 없습니다. 판에서 다시 켰다면 Claude 에게 '제작 판 동기화해' — 다음 판에 자료가 들어옵니다.</p></section>`; return; }
    if (topicView && !S.data[S.topic]) { $("view").innerHTML = `<div class="loading">${e(tname(S.topic))} 자료를 불러오는 중…</div>`; loadTopic(S.topic).then(render); return; }
    const keepFocus = document.activeElement && document.activeElement.id;
    const vals = {};
    document.querySelectorAll("#view textarea[id], #view input[type=text][id], #view select[id]").forEach(x => { vals[x.id] = x.value; });
    const sc = window.scrollY;
    const fn = { topic: viewTopic, title: viewTitle, thumb: viewThumb, script: viewScript, video: viewVideo, upload: viewUpload, channel: viewChannel }[S.view] || viewTopic;
    try {
      const out = fn();
      if (typeof out === "string") $("view").innerHTML = `<div class="one">${out}</div>`;
      else {
        const m = S.mode === "rules" ? "rules" : "work";
        $("view").innerHTML = `<div class="modebar" role="group" aria-label="보기"><button type="button" data-act="mode" data-m="work" aria-pressed="${m === "work"}">작업</button><button type="button" data-act="mode" data-m="rules" aria-pressed="${m === "rules"}">규칙 · 결과</button></div><div class="one">${out[m]}</div>`;
      }
    } catch (err) { $("view").innerHTML = `<section class="box"><p class="item-bad">이 화면을 그리지 못했습니다: ${e(err && err.message)}</p></section>`; console.error(err); }
    for (const [id, v] of Object.entries(vals)) { const x = document.getElementById(id); if (x && !id.startsWith("ed") && x.value !== v && id !== "refq" && x.tagName !== "SELECT") x.value = v; }
    if (keepFocus) { const x = document.getElementById(keepFocus); if (x) { x.focus(); try { const L = x.value.length; x.setSelectionRange && x.type !== "select-one" && x.setSelectionRange(L, L); } catch (_) {} } }
