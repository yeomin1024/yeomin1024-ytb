      mom12: [[L.close_252ago, "#FFD400", 0.04, 0.8, 5]],
    })[k] || [];
    const dlo = new Float64Array(N), dhi = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      let a = AN.close[i], b = a;
      if (stop[i] != null) { a = Math.min(a, stop[i]); b = Math.max(b, stop[i]); }
      for (const l of lines) { const v = l[0][i]; if (v != null) { a = Math.min(a, v); b = Math.max(b, v); } }
      dlo[i] = a; dhi[i] = b;
    }
    const back = Math.round(FR * WIN), lo = new Float64Array(N), hi = new Float64Array(N);
    for (let c = 0; c < N; c++) { let a = Infinity, b = -Infinity; for (let i = Math.max(0, c - back); i <= c; i++) { if (dlo[i] < a) a = dlo[i]; if (dhi[i] > b) b = dhi[i]; } lo[c] = a; hi[c] = b; }
    for (let c = 1; c < N; c++) {                            // 커질 때는 바로, 줄 때는 하루 4%씩 (범위가 덜컥거리지 않게 — 지난 값만 씀)
      hi[c] = Math.max(hi[c], hi[c - 1] + (hi[c] - hi[c - 1]) * 0.04);
      lo[c] = Math.min(lo[c], lo[c - 1] + (lo[c] - lo[c - 1]) * 0.04);
    }
    for (let c = 0; c < N; c++) {                            // 너무 좁으면(16% 아래) 가운데로 넓힘 · 위아래 여유
      let a = lo[c], b = hi[c]; const ms = 0.16 * b;
      if (b - a < ms) { const m = (a + b) / 2; a = m - ms / 2; b = m + ms / 2; }
      const sp = b - a; lo[c] = a - 0.04 * sp; hi[c] = b + 0.06 * sp;
    }
    return (PRE[k] = { stop, lines, lo, hi });
  }
  function thrEl(html, pp, style) {                          // 기준선 이름: 오늘 막대 오른쪽 — 값 눈금 쪽(x 1222 넘음)이면 왼쪽
    const e = ovEl(html, pp[0] + 10, pp[1], "thl", style);
    if (boxOf(e).r > 1222) { e.style.left = (pp[0] - 22) + "px"; e.style.transform = "translate(-100%,-50%)"; }
    return e;
  }
  function draw(k, fi, hdr) {
    const P = pre(k), H = R(k).holding;
    fi = clamp(fi, 0, N - 1);
    const cur = Math.floor(fi), c1 = Math.min(N - 1, cur + 1), fr = fi - cur;
    const lo = lerp(P.lo[cur], P.lo[c1], fr), hi = lerp(P.hi[cur], P.hi[c1], fr);
    const i0 = Math.max(0, fi - FR * WIN);                   // 창 왼쪽 끝 (거래일, 소수)
    const X = i => XL + XW * (i - i0) / WIN, Y = p => YB + (p - lo) / (hi - lo) * (YT - YB);
    const a0 = Math.max(0, Math.floor(i0) - 45), aEnd = Math.min(N - 1, Math.ceil(i0 + WIN) + 6);
    // 가격 벽 앞면 (보유 = 초록, 현금 = 회색) — 지붕 없음
    {
      const pa = wallM.geometry.attributes.position.array, ca = wallM.geometry.attributes.color.array; let v = 0;
      for (let i = a0; i < cur && v + 18 <= pa.length; i++) {
        const x0 = X(i), x1 = X(i + 1), y0 = Y(AN.close[i]), y1 = Y(AN.close[i + 1]);
        const c = H[i + 1] === "1" ? CG : CN, t0 = Math.min(1, y0 / YT * 1.15), t1 = Math.min(1, y1 / YT * 1.15);
        for (const [x, y, t] of [[x0, 0, 0], [x0, y0, t0], [x1, y1, t1], [x0, 0, 0], [x1, y1, t1], [x1, 0, 0]]) {
          pa[v] = x; pa[v + 1] = y; pa[v + 2] = HZ;
          ca[v] = c[0].r + (c[1].r - c[0].r) * t; ca[v + 1] = c[0].g + (c[1].g - c[0].g) * t; ca[v + 2] = c[0].b + (c[1].b - c[0].b) * t; v += 3;
        }
      }
      wallM.geometry.attributes.position.needsUpdate = true; wallM.geometry.attributes.color.needsUpdate = true; wallM.geometry.setDrawRange(0, v / 3);
    }
    // 선: 가격(흰 선 하나) · 매도선(빨간 점선) · 이 신호가 보는 선
    const pts = (arr, f) => { const o = []; for (let i = a0; i <= cur; i++) { const v = arr[i]; if (v != null) o.push([X(i), Y(f ? f(v) : v), i]); } return o; };
    ribbon(lineM, pts(AN.close), 0.05, HZ + 0.01, 0);
    ribbon(stopM, pts(P.stop), 0.05, HZ + 0.04, 5);
    ruleM.forEach((m, j) => {
      const l = P.lines[j];
      if (!l) { m.geometry.setDrawRange(0, 0); return; }
      m.material.color.set(l[1]); m.material.opacity = l[3]; ribbon(m, pts(l[0]), l[2], HZ + 0.03, l[4]);
    });
    // 값 격자 (벽 앞면) · 분기 바닥 선
    const step = niceStep((hi - lo) / 5), ticks = [];
    for (let p = Math.ceil(lo / step) * step; p <= hi && ticks.length < 14; p += step) ticks.push(p);
    {
      const a = gridM.geometry.attributes.position.array; let v = 0;
      for (const p of ticks) { const y = Y(p), w = 0.011, Q = [XL - 0.05, y - w, XR, y - w, XR, y + w, XL - 0.05, y + w]; for (const j of [0, 1, 2, 0, 2, 3]) { a[v++] = Q[j * 2]; a[v++] = Q[j * 2 + 1]; a[v++] = HZ + 0.012; } }
      gridM.geometry.attributes.position.needsUpdate = true; gridM.geometry.setDrawRange(0, v / 3);
    }
    const YRS = [];
    {
      const a = qG.attributes.position.array; let v = 0;
      for (let i = Math.max(1, a0); i <= aEnd && v + 6 <= a.length; i++) {
        const m0 = AN.dates[i - 1].slice(5, 7), m1 = AN.dates[i].slice(5, 7);
        if (m0 === m1 || !["01", "04", "07", "10"].includes(m1)) continue;
        const x = X(i); if (x < XL - 1 || x > XR + 0.4) continue;
        a.set([x, 0, -HZ, x, 0, 2.6], v); v += 6;
        if (m1 === "01") YRS.push([x, AN.dates[i].slice(0, 4)]);
      }

    }
    // 오늘 막대·점 · 매매 점
    curPl.position.set(X(cur), (YT + 1.2) / 2, HZ + 0.02);
    curDot.position.set(X(cur), Y(AN.close[cur]), HZ + 0.08);
    const T = R(k).trades;
    let nb = 0, ns = 0;
    for (const t of T) {
      if (t.b <= cur && t.b >= a0 && nb < BUYP.length) { BUYP[nb].position.set(X(t.b), Y(AN.close[t.b]), HZ + 0.06); BUYP[nb++].visible = true; }
      if (!t.open && t.s <= cur && t.s >= a0 && ns < SELP.length) { SELP[ns].position.set(X(t.s), Y(AN.close[t.s]), HZ + 0.06); SELP[ns++].visible = true; }
    }
    for (let j = nb; j < BUYP.length; j++) BUYP[j].visible = false;
    for (let j = ns; j < SELP.length; j++) SELP[j].visible = false;
    drawIn(scene, cam, VP);
    // ---- 글자 (오버레이)
    PLACED = [];
    const cp = proj(X(cur), YT + 1.2, HZ + 0.02);
    const cl = ovEl(`<span class="tab">$${f2(AN.close[cur])}</span>`, cp[0], cp[1] - 4, "cur");
    { const b0 = boxOf(cl), dx = b0.l < 46 ? 46 - b0.l : b0.r > 1222 ? 1222 - b0.r : 0; if (dx) cl.style.left = (cp[0] + dx) + "px"; }
    PLACED.push(boxOf(cl));
    const axEls = [];                                        // 축 글자는 움직이는 글자(꼬리표·핀)와 겹치면 그 프레임만 숨김
    for (const p of ticks) { const q = proj(XR + 0.05, Y(p), HZ); axEls.push(ovEl(`$${f0(p)}`, q[0] + 30, q[1], "lab ax")); }
    for (const [x, yy] of YRS) { const q = proj(x, 0, 2.2), e = ovEl(yy, q[0] + 34, q[1], "lab ax"); if (boxOf(e).l < 46) e.remove(); else axEls.push(e); }   // 왼쪽으로 흘러 나간 연도는 뺌
    if (k === "dip10" || k === "dip20") {
      const q = k === "dip10" ? 0.9 : 0.8, pp = proj(X(cur) + 0.18, Y(AN.lines.ath[cur] * q), HZ);
      const e = thrEl(`★ −${k === "dip10" ? 10 : 20}%`, pp); PLACED.push(boxOf(e));
    }
    if (k === "ma200" || k === "gc") { const pp = proj(X(cur) + 0.18, Y(AN.lines.sma200[cur]), HZ); const e = thrEl("200", pp); if (!hit(boxOf(e))) PLACED.push(boxOf(e)); else e.remove(); }
    if (k === "gc") { const pp = proj(X(cur) + 0.18, Y(AN.lines.sma50[cur]), HZ); const e = thrEl("50", pp, "color:#7FD4FF"); if (!hit(boxOf(e))) PLACED.push(boxOf(e)); else e.remove(); }
    if (P.stop[cur] != null) { const pp = proj(X(cur) + 0.18, Y(P.stop[cur]), HZ); const e = thrEl(`−${Math.round(TRAIL * 100)}%`, pp, "color:#FF6B6B"); if (!hit(boxOf(e))) PLACED.push(boxOf(e)); else e.remove(); }
    const BOX = { l: 46, t: 140, r: 1222, b: 905 };
    const tries = (dir) => (dir > 0 ? [[1, 1.0], [1, 1.6], [1, 2.2], [-1, 1.0], [-1, 1.6]] : [[-1, 1.0], [-1, 1.6], [-1, 2.2], [1, 1.0], [1, 1.6]]);
    const place = (html, x, y0, dir, color) => {

        const e = ovEl(html, pt[0], pt[1] + (d > 0 ? -22 : 22), "lab");
        let b = boxOf(e);
        if (b.l < 50 && i0 === 0) { e.style.left = (pt[0] + 50 - b.l) + "px"; b = boxOf(e); }   // 시작 쪽 첫 매수 글자는 오른쪽으로 밀어 보임 (흘러 나가는 글자는 그대로)
        if (!hit(b) && bounds(b, BOX)) {
          PLACED.push(b); stemEl(base[0], base[1], d > 0 ? b.b : b.t, color);
          if (i0 > 0 && b.l < 170) e.style.opacity = clamp((b.l - 46) / 124, 0.3, 1);     // 왼쪽 끝으로 흘러 나가는 글자는 흐리게

    for (const t of shown) {
      if (!t.open && t.s <= cur && X(t.s) > XL - 0.2) place(`<div class="pin"><span class="tag s">SELL</span><span class="v ${t.r >= 0 ? "up" : "dn"} tab">${pc(t.r)}</span></div>`, X(t.s), Y(AN.close[t.s]), 1, "#FF8A3D");
      if (t.b >= a0 && X(t.b) > XL - 0.2) place(`<div class="pin"><span class="tag b">BUY</span><span class="v tab">$${f0(t.bp)}</span></div>`, X(t.b), Y(AN.close[t.b]), -1, "#2BE0A0");
    }

})();

// 경주 DOM (머리·카드) — 규칙마다 장면 안에 만들고, 프레임마다 값만 바꿈. 카드 2개 = 시안 race3d.html v1.1 그대로 (+ 아래 합계)
function raceDom(k, sc, opt) {
  const hd = el(`<div class="a row" style="left:44px;top:34px;gap:18px"><div class="no">${VNO(k)}</div><div class="rule">${HEAD[k]()}</div><div class="lv tab row" style="gap:8px;margin-left:6px;font:900 40px/1 'Noto Sans KR';color:#C9D2E2"></div></div>`, sc);
  const dt = el(`<div class="date tab"></div>`, sc);
  const live = hd.querySelector(".lv");
  const side = el(`<div class="side" data-small="사용자 지시 2026-10-16 — 시안 카드 그대로 (글자 15~40px)"><div class="card c1"></div><div class="card c2"></div></div>`, sc);
  el(`<div class="legend"><span style="display:inline-block;width:46px;border-top:5px solid #fff"></span><span>SPY</span><span class="sw" style="margin-left:26px;background:linear-gradient(180deg,#22C79A,#0B3D33)"></span><span class="tag b">BUY</span><span>~</span><span class="tag s">SELL</span><span class="sw" style="margin-left:26px;background:linear-gradient(180deg,#4A5875,#1A2336)"></span><span>$</span><span style="margin-left:26px;display:inline-block;width:46px;border-top:5px dashed #FF5A5A"></span><span class="tag s">SELL</span></div>`, sc);
  const c1 = side.children[0], c2 = side.children[1];
  const T = R(k).trades, SHOW = 6;                     // 6줄 = 카드가 y 1020(유튜브 진행 막대 자리) 위에서 끝남 (7줄은 1054)
  const hlOn = opt && opt.bhHL;                               // (1번 장) 'BUY & HOLD' 줄을 노란 테두리로 — [시작, 끝] 시각
  const ds = i => AN.dates[i].slice(2).replace(/-/g, ".");
  const spark = (v, bv, cur) => {                             // 계좌 그래프: 이 규칙(초록) · BUY & HOLD(회색) · $10,000(노란 점선) — 시안 그대로
    const w = 480, h = 104, val = R(k).value;
    let lo = CAP, hi = -Infinity;
    for (let i = 0; i <= cur; i++) { lo = Math.min(lo, val[i], AN.bh[i]); hi = Math.max(hi, val[i], AN.bh[i]); }
    const sx = i => i / Math.max(1, N - 1) * w, sy = y => h - 6 - (y - lo) / Math.max(1, hi - lo) * (h - 12);
    const path = arr => { let d = ""; for (let i = 0; i <= cur; i += 3) d += (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(arr[i]).toFixed(1); return d + "L" + sx(cur).toFixed(1) + " " + sy(arr[cur]).toFixed(1); };
    const base = sy(CAP);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:14px">
      <line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="#FFD400" stroke-dasharray="7 7" stroke-width="2" opacity=".6"/>
      <path d="${path(AN.bh)}" fill="none" stroke="#AFC0DA" stroke-width="3" stroke-linejoin="round" opacity=".75"/>
      <path d="${path(val)}" fill="none" stroke="#2BE0A0" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="${sx(cur)}" cy="${sy(bv)}" r="6" fill="#AFC0DA"/><circle cx="${sx(cur)}" cy="${sy(v)}" r="7" fill="#fff"/></svg>`;
  };
  const stopAt = (t, cur) => { let pk = 0; for (let i = t.b; i <= cur; i++) pk = Math.max(pk, AN.close[i]); return pk * (1 - TRAIL); };
  return (cur, now) => {
    dt.textContent = ymd(cur);
    const L = AN.lines;
    const lv = {
      dip10: () => `★ ${pcu(AN.close[cur] / L.ath[cur] - 1)}`, dip20: () => `★ ${pcu(AN.close[cur] / L.ath[cur] - 1)}`,
      rsi30: () => `RSI ${L.rsi14[cur].toFixed(1)}`, vix30: () => (L.vix[cur] == null ? "" : `VIX ${L.vix[cur].toFixed(1)}`),
      drop2: () => `${IC.cal(40)} ${pc(L.ret1[cur] / 100, 1)}`, mom12: () => `−1Y ${pc(AN.close[cur] / L.close_252ago[cur] - 1)}`,
    }[k];
    live.innerHTML = lv ? lv() : "";
    // 카드 1: 계좌 (+ BUY & HOLD — 첫날 매수하고 그대로 둔 계좌) + 계좌 그래프
    const v = R(k).value[cur], bv = AN.bh[cur];
    const hl = hlOn && now >= hlOn[0] && now < hlOn[1];
    c1.innerHTML = `<div class="ch">${IC.wallet}<span class="tab">$${f0(CAP)}</span><span>→</span></div>
      <div class="acc"><span class="who rb">${VNO(k)}</span><span class="big tab">$${f0(v)}</span><span class="mid tab ${v >= CAP ? "up" : "dn"}">${pc(v / CAP - 1)}</span></div>
      <div class="acc bh" style="position:relative">${hl ? `<span class="bh-hl"></span>` : ""}<span class="who bhp">BUY &amp; HOLD</span><span class="bv tab">$${f0(bv)}</span><span class="bp tab">${pc(bv / CAP - 1)}</span></div>${spark(v, bv, cur)}`;
    // 카드 2: 거래 기록 (최근 SHOW개) — 번호 · BUY 날·값 → SELL 날·값 · 수익률·손익 $ · 들고 있으면 흐린 SELL + ⌛ + 매도선 값
    const done = T.filter(t => t.b <= cur);
    const isOpen = t => t.open || t.s > cur;
    const pnl = t => (isOpen(t) ? v - t.bc : t.sc - t.bc);
    const skip = Math.max(0, done.length - SHOW);
    const rows = done.slice(skip).map((t, kk) => {
      const op = isOpen(t), r = op ? v / t.bc - 1 : t.r, u = pnl(t);
      const sell = op ? `<div class="cl"><b class="s">SELL</b><span class="dt tab" style="display:flex;align-items:center;gap:5px">${IC.hour(20)}</span><span class="px tab">≤ ${f0(stopAt(t, cur))}</span></div>`
                      : `<div class="cl"><b class="s">SELL</b><span class="dt tab">${ds(t.s)}</span><span class="px tab">${f0(t.sp)}</span></div>`;
      return `<div class="t2 ${op ? "open" : ""}"><span class="k">${kk + skip + 1}</span>
        <div class="cl"><b class="b">BUY</b><span class="dt tab">${ds(t.b)}</span><span class="px tab">${f0(t.bp)}</span></div><span class="ar">→</span>${sell}
        <div class="rs"><span class="r tab ${r >= 0 ? "up" : "dn"}">${pc(r)}</span><span class="u tab ${u >= 0 ? "up" : "dn"}">${susd(u)}</span></div></div>`;
    }).join("");
    const closed = done.filter(t => !isOpen(t)), openT = done.filter(isOpen);
    const W_ = closed.filter(t => t.r > 0), L_ = closed.filter(t => t.r <= 0);
    const sum = a => a.reduce((s, t) => s + pnl(t), 0);
    c2.innerHTML = `<div class="ch">${IC.log}<span class="tab">${done.length}</span>${skip ? `<span class="tab" style="margin-left:auto;font-size:20px">1~${skip} ↑</span>` : ""}</div>${rows}
      <div class="foot tab"><span class="up">▲ ${W_.length} <span style="font-size:24px">${susd(sum(W_))}</span></span><span class="dn">▼ ${L_.length} <span style="font-size:24px">${susd(sum(L_))}</span></span></div>
      <div class="foot2 tab">${openT.length ? `<span class="row" style="gap:6px">${IC.hour(26)}<span class="${sum(openT) >= 0 ? "up" : "dn"}">${susd(sum(openT))}</span></span>` : ""}<span class="sum"><span style="color:var(--GR)">Σ</span> <span class="${v - CAP >= 0 ? "up" : "dn"}">${susd(v - CAP)}</span></span></div>`;
  };
}

// 3D 확대 (규칙 설명 · 매도 규칙 예) — 실제 자료의 짧은 구간
// =====================================================================================================================
function makeZoom(opt) {
  // opt: {i0, i1, lines:[[array, color, dash]], low:{arr, thr, max}, stop:{buyI}, sig, buyI, hl:[i,j] }
  const VP = { x: 140, y: 150, w: 1640, h: 820 };
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, VP.w / VP.h, 0.1, 200);
  const n = opt.i1 - opt.i0 + 1;
  const pr = AN.close.slice(opt.i0, opt.i1 + 1);
  const extra = (opt.lines || []).flatMap(([a]) => a.slice(opt.i0, opt.i1 + 1).filter(v => v != null));
  const stopVals = [];
  let lo = Math.min(...pr, ...extra), hi = Math.max(...pr, ...extra);
  if (opt.stop) { let pk = Math.max(...AN.close.slice(opt.stop.buyI, opt.i0 + 1)); for (let i = opt.i0; i <= opt.i1; i++) { pk = Math.max(pk, AN.close[i]); stopVals.push(pk * (1 - TRAIL)); } lo = Math.min(lo, ...stopVals); }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const top = opt.low ? 6.2 : 5.6, base = opt.low ? 1.4 : 0;
  const X = j => -8 + 16 * j / (n - 1), Y = p => base + (p - lo) / (hi - lo) * (top - base);
  const xs = Array.from({ length: n }, (_, j) => X(j));
  const yP = pr.map(Y);
  const grid = new THREE.Mesh(new THREE.PlaneGeometry(17.2, 0.02), mat("#3B4C6E", 0.8));
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(17.4, top - base + 0.8), mat("#13213C", 0.55)); panel.position.set(0, (top + base) / 2, -0.4); scene.add(panel);
  // 가격 관 (3D)
  const pts = xs.map((x, j) => new THREE.Vector3(x, yP[j], 0));

// ---------- 시각 → 날짜 (조각 직선) ----------
function timeMap(anchors) {                                  // [[t, i]] → t → 실수 날짜 위치
  const A = anchors.slice().sort((x, y) => x[0] - y[0]);
  for (let q = 1; q < A.length; q++) if (A[q][1] < A[q - 1][1]) A[q][1] = A[q - 1][1];
  return t => {
    if (t <= A[0][0]) return A[0][1];
    for (let q = 1; q < A.length; q++) if (t <= A[q][0]) { const u = (t - A[q - 1][0]) / Math.max(1e-6, A[q][0] - A[q - 1][0]); return lerp(A[q - 1][1], A[q][1], u); }
    return A[A.length - 1][1];
  };
}

  const cx = 1040, sc1 = 660 / Math.max(...VORDER.map(k => Math.abs(SUM.reentry[k].mean)));   // 가장 긴 막대 = 660px (글자까지 화면 안)
  el(`<div class="a" style="left:${cx - 2}px;top:90px;width:4px;height:880px;background:#FFD400;opacity:.7"></div>`, sc);
  const head = el(`<div class="a row tab" style="left:${cx - 330}px;top:42px;gap:14px;font:900 44px/1 'Noto Sans KR'"><span class="tag s">SELL</span><span style="color:var(--GR)">→</span><span class="tag b">BUY</span><span style="color:var(--GR)">%</span></div>`, sc);
  pop(head, a);
  const rows = ks.map((k, r) => {
    const m = SUM.reentry[k].mean, w = Math.abs(m) * sc1, y = 110 + r * 86;
    const bar = el(`<div class="a" style="left:${m >= 0 ? cx : cx - w}px;top:${y}px;width:${w}px;height:58px;border-radius:12px;background:${m >= 0 ? "linear-gradient(90deg,#FF4D5E,#FF8A8A)" : "linear-gradient(270deg,#16A87A,#2BE0A0)"};transform-origin:${m >= 0 ? "left" : "right"} center;box-shadow:0 10px 24px rgba(0,0,0,.35)"></div>`, sc);
    const lab = el(`<div class="a tab" style="left:${m >= 0 ? cx + w + 16 : cx - w - 16}px;top:${y + 10}px;transform:translateX(${m >= 0 ? 0 : -100}%);font:900 38px/1 'Noto Sans KR';color:${m >= 0 ? "#FF8A8A" : "#2BE0A0"}">${pc(m)}</div>`, sc);
    const bd = el(`<div class="a" style="left:${m >= 0 ? cx - 30 : cx + 30}px;top:${y + 2}px;transform:translateX(${m >= 0 ? -100 : 0}%)">${badge(k)}</div>`, sc);
    return { k, bar, lab, bd };
  });
  rows.forEach((o, r) => { tl.fromTo(o.bar, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, a + 0.2 + r * 0.08); pop([o.lab, o.bd], a + 0.3 + r * 0.08); });
  const dimExcept = (keys, at) => rows.forEach(o => tl.to([o.bar, o.lab, o.bd], { opacity: keys.includes(o.k) ? 1 : 0.25, duration: 0.4 }, at));
  dimExcept([...TREND], W("추세 신호 네 개는 매도한 값보다", "비싸게"));
  dimExcept(["dip10"], S("저점 매수는 평균 1.4% 싸게"));
  dimExcept(["dip20"], S("큰 하락 매수는 7.3% 싸게"));
  const inv = el(`<div class="a row tab" style="left:1300px;top:900px;gap:16px;font:900 56px/1 'Noto Sans KR'">${badge("dip20")}<span class="sw" style="width:60px;height:30px;background:#22C79A"></span><span>${(SUM.invested.dip20 * 100).toFixed(0)}%</span></div>`, sc);
  pop(inv, W("큰 하락 매수는 7.3% 싸게", "주식을"));
  cut(W("추세 신호 네 개는 매도한 값보다", "비싸게") + 1.2, "종합 — 다시 산 값 (추세)");
  cut(S("큰 하락 매수는 7.3% 싸게") + 2.5, "종합 — 큰 하락 42%");
}
// ---------- 다른 조건 ----------
{
  const a = PS("다른 조건"), b = PS("정리");
  const sc = K.scene(a - 0.2, b - 0.4);
  const q = el(`<div class="a flexc" style="left:0;width:1920px;top:90px;gap:20px">${IC.star(70)}<span class="big tab" style="font-size:90px;color:#FF6B6B">−?%</span><span style="font:900 70px/1 'Noto Sans KR';color:var(--GR)">→</span><span class="tag s" style="font-size:60px">SELL</span></div>`, sc);
  pop(q, a);
  const T4 = [["5", SUM.above.trail5], ["10", SUM.above.trail10], ["15", SUM.above.trail15], ["20", SUM.above.trail20]];
  const tiles = T4.map(([n, c], i) => el(`<div class="card2" style="left:${150 + i * 420}px;top:330px;width:360px;height:360px;display:grid;place-items:center;align-content:center;gap:26px;${n === "10" ? "border-color:rgba(255,212,0,.6)" : ""}">
    <span class="big tab" style="font-size:80px;color:#FF6B6B">−${n}%</span><span class="big tab" style="font-size:110px;color:${c ? "#2BE0A0" : "#93A0B8"}">${c}<span style="font-size:60px;color:#93A0B8">/10</span></span>
    <span class="tag h" style="font-size:36px">&gt; BUY &amp; HOLD</span></div>`, sc));
  pop(tiles[1], a + 0.4);
  pop(tiles[0], S("5%로 바꾸면"));
  pop([tiles[2], tiles[3]], S("15%나 20%로 하면"));
  const fee = el(`<div class="a flexc tab" style="left:0;width:1920px;top:770px;gap:30px;font:900 70px/1 'Noto Sans KR'"><span class="tag b" style="font-size:52px">BUY</span><span class="tag s" style="font-size:52px">SELL</span><span style="color:#FF6B6B">0%</span><span style="color:var(--GR)">→</span><span style="color:#2BE0A0">${SUM.above.cost0}</span><span style="color:#93A0B8;font-size:50px">/10</span></div>`, sc);
  pop(fee, S("수수료를 0으로 해도"));
  cut(S("15%나 20%로 하면") + 1.5, "다른 조건 — 매도 기준");
  cut(S("수수료를 0으로 해도") + 1.2, "다른 조건 — 수수료 0");
}
// ---------- 정리 ----------
{
  const a = PS("정리"), b = PS("한계");
  const sc = K.scene(a - 0.2, b - 0.4);
  const c1 = el(`<div class="card2" style="left:110px;top:170px;width:820px;height:330px;display:grid;place-items:center;align-content:center;gap:24px">
    <span class="big tab" style="font-size:150px">${10 - SUM.above.trail10}<span style="font-size:80px;color:#93A0B8">/10</span></span><span class="row" style="font:900 56px/1 'Noto Sans KR'"><span>&lt;</span><span class="tag h" style="font-size:44px">BUY &amp; HOLD</span></span></div>`, sc);
  pop(c1, S("이번 10년 동안, 매수 신호 10가지 중"));
  const c2 = el(`<div class="card2" style="left:990px;top:170px;width:820px;height:330px;display:grid;place-items:center;align-content:center;gap:24px">
    <span class="row" style="gap:20px">${badge("dip10", true)}</span><span class="row" style="gap:18px;font:900 110px/1 'Noto Sans KR'"><span class="sw" style="width:90px;height:44px;background:#22C79A"></span><span class="tab">${(SUM.invested.dip10 * 100).toFixed(0)}%</span></span></div>`, sc);
  pop(c2, S("넘은 하나도, 떨어지면 바로 다시 매수해서"));
  const c3 = el(`<div class="card2" style="left:110px;top:560px;width:820px;height:330px;display:grid;place-items:center;align-content:center;gap:24px">
    <span class="tag h" style="font-size:48px">BUY &amp; HOLD</span><span class="row" style="gap:20px">${IC.dn(80)}<span class="big tab" style="font-size:110px;color:#FF4D5E">${pcu(SUM.bh.max_dd)}</span></span><span class="tab" style="font:900 48px/1 'Noto Sans KR';color:#AFC0DA">${SUM.bh.max_dd_date.slice(0, 7).replace("-", ".")}</span></div>`, sc);
  pop(c3, S("그대로 둔 계좌는 2020년 3월에 33.7%"));
  const c4 = el(`<div class="card2 flexc" style="left:990px;top:560px;width:820px;height:330px;gap:22px"><span class="tag s" style="font-size:56px">SELL</span><span style="font:900 64px/1 'Noto Sans KR';color:var(--GR)">→</span>${IC.hour(90)}<span style="font:900 64px/1 'Noto Sans KR';color:var(--GR)">→</span><span class="tag b" style="font-size:56px">BUY</span><span class="big" style="font-size:96px;color:#FFD400">?</span></div>`, sc);
  pop(c4, S("언제 매수하느냐만큼, 매도한 뒤"));
  cut(S("언제 매수하느냐만큼, 매도한 뒤") + 1.5, "정리 — 카드 4개");
}
// ---------- 한계 ----------
{
  const a = PS("한계"), b = PS("마무리");
  const sc = K.scene(a - 0.2, b - 0.4);
  const items = [
    el(`<div class="card2" style="left:150px;top:260px;width:460px;height:420px;display:grid;place-items:center;align-content:center;gap:30px">${IC.cal(130)}<span class="big tab" style="font-size:64px">2016 → 2026</span></div>`, sc),
    el(`<div class="card2" style="left:730px;top:260px;width:460px;height:420px;display:grid;place-items:center;align-content:center;gap:24px"><span class="row" style="gap:16px">${IC.ban(110, `<circle cx="17.5" cy="18" r="3.4" fill="none" stroke="#FFD400" stroke-width="2.8"/><circle cx="30.5" cy="30" r="3.4" fill="none" stroke="#FFD400" stroke-width="2.8"/><path d="M31 15 L17 33" stroke="#FFD400" stroke-width="2.8" stroke-linecap="round"/>`)}${IC.ban(110, `<ellipse cx="24" cy="29" rx="10" ry="4.2" fill="#B8860B"/><ellipse cx="24" cy="25" rx="10" ry="4.2" fill="#E8B800"/><ellipse cx="24" cy="21" rx="10" ry="4.2" fill="#FFD400"/>`)}</span><span class="row" style="gap:12px;font:900 50px/1 'Noto Sans KR'"><span class="tag s" style="font-size:44px">SELL</span><span style="color:#AFC0DA">+1D</span></span></div>`, sc),
    el(`<div class="card2" style="left:1310px;top:260px;width:460px;height:420px;display:grid;place-items:center;align-content:center">${IC.warn(200)}</div>`, sc),
  ];
  pop(items[0], a); pop(items[1], S("세금과 환전 비용은 넣지 않았어요")); pop(items[2], S("투자 권유가 아니라"));
  cut(S("투자 권유가 아니라") + 1.2, "한계");
}
// ---------- 마무리 ----------
{
  const a = PS("마무리");
  const sc = K.scene(a - 0.2, EP.duration + 1, { keep: true });
  const c = el(`<div class="a flexc" style="left:0;width:1920px;top:330px;gap:40px">${IC.chat(220)}<span class="big" style="font-size:200px;color:#FFD400">?</span></div>`, sc);
  pop(c, a);
  const end = el(`<div class="a flexc" style="left:0;width:1920px;top:690px;gap:24px"><span class="tag b" style="font-size:60px">BUY</span><span class="tag s" style="font-size:60px">SELL</span><span class="tag h" style="font-size:52px">BUY &amp; HOLD</span></div>`, sc);
  pop(end, S("시청해주셔서 감사합니다"));
  cut(S("시청해주셔서 감사합니다") + 0.8, "마무리");
}

CUTQ.sort((x, y) => x[0] - y[0]).forEach(([t, n]) => K.cut(t, n));
K.done();
})();
