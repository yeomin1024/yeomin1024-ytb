/* 4. 64세에 돌아올 줄 안 점선 → 동창 모임 친구의 말 '평생 30%' → 점선이 사라지고 63만 원이 끝까지 (s5–s7) */

  tl.fromTo(th, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.15 }, W(5, "원래대로") - 0.4);   // 생각 풍선 (김 씨 머리 → 점선)
  K.cut(E(5) - 0.1, "64세에 90만 원으로 돌아올 줄 (점선 · 생각)");

  pop(table, W(6, "동창"), { from: { y: 0 } });
  K.cut(E(6) - 0.1, "동창 모임 — 김 씨 · 친구");
  // s7 친구의 말 '평생 30%' → 점선이 사라지고 63만 원 막대가 끝까지
  const bub = el(`<div class="bub" style="left:300px;top:388px;font-size:84px">평생 30%<svg style="position:absolute;right:-38px;top:36px" width="48" height="56" viewBox="0 0 48 56" aria-hidden="true"><path d="M0 4 L48 26 L0 52 Z" fill="${R}"/></svg></div>`, sc);

/* 5. 김 씨의 계산 (s8) — 계산기 6,480만 원 올라가기 → 신청서 한 장 때문에 '평생 손해?' (s9) */

  K.cut(E(9) - 0.1, "신청서 한 장 → 평생 손해?");
}

/* 7. 끝 화면 (s11) — 진짜 범인 · 지금 할 일 · 롱폼 자리 · 아래 영상에서 확인 ⬇ (관련 동영상 링크 자리) */
