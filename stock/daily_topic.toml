#   "일단 예약 작업은 하지말고 탐색 시 시간체크해서 지난 만큼 업데이트하도록 하고".
# v1.0 — 2026-11-28 — 최초. 사용자 지시 2026-11-28 "1은 그냥 댓글보면 알 수 있지 않나? … soxl 등 주식 매수 타이밍 예측하는게 많던데 …
#   4는 근데 모두야 … 공통점을 찾으면 돼 5는 되도록이면 오래가면 좋은데 딱히 상관없어 6은 미장 끝나고 업데이트되면 해".
#   미국 장 마감 뒤에 사람이 시키면 (예약 작업 없음) 이 설정으로: 시장 숫자 → 지난 실행 뒤 새 영상 검색 → 그 영상들 댓글 → 시청자 공통 관심(의도) → stock/result/next_topic/daily/.
#   기간 기록 = stock/result/next_topic/daily/state.json (검색어마다 끝까지 찾은 시각 · 본 영상 · 마지막 거래일) — 지우면 처음처럼 DAYS 일.
#   할당량: 검색 1번 100단위 × 검색어 수 × 조각 수 + 영상 정보·댓글 (영상마다 2) — 하루 한 번이면 약 1,500단위 (하루 10,000). 미리 보기 `daily_topic.py stock plan`.

