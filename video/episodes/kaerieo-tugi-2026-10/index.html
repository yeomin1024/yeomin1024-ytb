","text":"삿포로의 한 호텔 지배인도 보관할 공간이 없고 처리비가 꽤 든다고 말했습니다.","start":145.527,"end":150.346},{"n":39,"part":"셋째, 호텔도 돈이 든다","text":"호텔 입장에서도 비용 부담인 겁니다.","start":150.726,"end":152.93},{"n":40,"part":"넷째, 쓰레기통 없는 나라","text":"네 번째 이유는 일본 길거리에 쓰레기통이 드물다는 점입니다.","start":153.93,"end":157.447},{"n":41,"part":"넷째, 쓰레기통 없는 나라","text":"흔히 꼽히는 이유는 1995년 도쿄 지하철 사린 사건입니다.","start":157.827,"end":161.907},{"n":42,"part":"넷째, 쓰레기통 없는 나라","text":"그 뒤로 역의 쓰레기통이 크게 줄었다는 겁니다.","start":162.287,"end":164.837},{"n":43,"part":"넷째, 쓰레기통 없는 나라","text":"다만 사린 사건이 직접 원인인지는 일본 안에서도 의견이 갈립니다.","start":165.217,"end":169.239},{"n":44,"part":"넷째, 쓰레기통 없는 나라","text":"일본 관광청 조사에서도 외국인 관광객이 꼽은 불편 1위가 '쓰레기통 부족'이었습니다.","start":169.619,"end":175.159},{"n":45,"part":"넷째, 쓰레기통 없는 나라","text":"작은 쓰레기도 버릴 곳이 마땅치 않은데, 캐리어처럼 큰 물건은 더 어렵습니다.","start":175.539,"end":180.489},{"n":46,"part":"다른 목소리","text":"그렇다면 버릴 곳을 찾기 어려우니, 길에 두고 가도 괜찮은 걸까요?","start":181.489,"end":185.539},{"n":47,"part":"다른 목소리","text":"현지에서는 전혀 다른 이야기가 나옵니다.","start":185.919,"end":188.229},{"n":48,"part":"현지 반응","text":"현지 주민들의 반응부터 보겠습니다.","start":189.229,"end":191.169},{"n":49,"part":"현지 반응","text":"\"화가 납니다\", \"몇 년 사이 50개 넘게 봤다\"는 말이 나왔습니다.","start":191.549,"end":195.169},{"n":50,"part":"현지 반응","text":"\"내용물을 몰라 무섭다\", \"폭발물인 줄 알았다\"는 반응도 있었습니다.","start":195.549,"end":199.769},{"n":51,"part":"현지 반응","text":"실제로 주인 없는 가방은 유실물로 일정 기간 보관해야 하거든요.","start":200.149,"end":203.862},{"n":52,"part":"현지 반응","text":"주부공항은 위험물인지 확인하려고 그때마다 X선 검사를 한다고 밝혔습니다.","start":204.242,"end":209.164},{"n":53,"part":"현지 반응","text":"도시마구에선 이렇게 버려진 캐리어를 구청이 세금으로 수거하고 있습니다.","start":209.544,"end":213.522},{"n":54,"part":"현지 반응","text":"게다가 길에 버리는 건 엄연한 불법입니다.","start":213.902,"end":216.392},{"n":55,"part":"현지 반응","text":"일본 폐기물처리법은 쓰레기 무단 투기를 금지합니다.","start":216.772,"end":220.135},{"n":56,"part":"현지 반응","text":"어기면 5년 이하 구금형이나 1,000만 엔 이하 벌금, 또는 둘 다 받을 수 있습니다.","start":220.515,"end":225.525},{"n":57,"part":"현지 반응","text":"다만 이 문제를 외국인 관광객만의 탓으로 단정할 수는 없습니다.","start":225.905,"end":229.81},{"n":58,"part":"현지 반응","text":"주부공항에서 이 혐의로 처음 적발된 사람은 일본인 남성이었습니다.","start":230.19,"end":234.539},{"n":59,"part":"현지 반응","text":"그리고 지금, 일본 지자체들은 실제로 대책을 내놓기 시작했습니다.","start":234.919,"end":239.111},{"n":60,"part":"실제로 바뀐 것","text":"도시마구는 올해 7월, 캐리어 재활용 업체 두 곳과 협정을 맺었습니다.","start":240.111,"end":244.781},{"n":61,"part":"실제로 바뀐 것","text":"여러 나라 말로 된 경고 전단을 만들고, 이케부쿠로의 대형 전광판으로도 경고하고 있습니다.","start":245.161,"end":250.437},{"n":62,"part":"실제로 바뀐 것","text":"캐리어 투기를 막는 조례도 검토하고 있어요.","start":250.817,"end":253.3},{"n":63,"part":"실제로 바뀐 것","text":"삿포로는 올해 6월부터 호텔에 남은 캐리어를 거둬 고친 뒤 다시 파는 방식을 시작했습니다.","start":253.68,"end":259.15},{"n":64,"part":"실제로 바뀐 것","text":"그럼 여행 중에 캐리어를 바꿨다면, 헌 가방은 어떻게 해야 할까요?","start":259.53,"end":263.73},{"n":65,"part":"실제로 바뀐 것","text":"간사이공항은 2018년부터 헌 캐리어를 무료로 받는 재사용 서비스를 운영하고 있습니다.","start":264.11,"end":269.72},{"n":66,"part":"실제로 바뀐 것","text":"항공권과 여권을 보여 주고, 소유권 포기서에 서명하면 돼요.","start":270.1,"end":274.04},{"n":67,"part":"실제로 바뀐 것","text":"주부공항은 1,200엔에 받아 주고, 2,200엔에 수거해 가는 민간 업체도 있습니다.","start":274.42,"end":279.246},{"n":68,"part":"실제로 바뀐 것","text":"떠나기 전에 이용할 공항이나 숙소에 먼저 물어보는 게 가장 확실합니다.","start":279.626,"end":283.743},{"n":69,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":284.743,"end":287.629},{"n":70,"part":"정리","text":"일본에서 새 캐리어를 사는 여행객은 늘었는데, 구청의 대형 쓰레기 제도는 주민용입니다.","start":288.009,"end":293.448},{"n":71,"part":"정리","text":"호텔은 처리비가 들고, 길거리엔 쓰레기통도 드뭅니다.","start":293.828,"end":297.368},{"n":72,"part":"정리","text":"그렇다고 길에 두고 가면 불법이고, 수거 비용은 세금으로 나갑니다.","start":297.748,"end":301.713},{"n":73,"part":"정리","text":"공항이나 민간 업체처럼 여행자가 쓸 수 있는 방법도 있습니다.","start":302.093,"end":305.873},{"n":74,"part":"정리","text":"일본 여행에서 캐리어를 바꾼다면, 헌 가방을 처리할 방법부터 먼저 확인해 두세요.","start":306.253,"end":311.253},{"n":75,"part":"정리","text":"시청해주셔서 감사합니다.","start":311.633,"end":313.163}],"subs":[[0.2,4.325,"지난 9월 15일, 도쿄 이케부쿠로의 한 쓰레기 집적소 앞."],[4.325,6.87,"주인 없는 캐리어 하나가 놓여 있었습니다."],[6.87,10.17,"구청은 경고 스티커를 붙이고 주인을 기다렸습니다."],[10.17,15.873,"하지만 일주일이 지나도 주인은 나타나지 않았고,\n캐리어는 결국 대형 쓰레기로 수거됐습니다."],[15.873,19.003,"이케부쿠로가 있는 곳은 도쿄 도시마구입니다."],[19.003,23.714,"이곳에서만 지난해 이렇게 버려진 캐리어가 약 290개 나왔습니다."],[23.714,28.341,"도쿄 경찰에 습득물로 들어온 캐리어도 지난해 약 4,600개였습니다."],[28.341,30.321,"3년 전의 1.8배예요."],[30.321,36.024,"잃어버린 가방도 섞인 숫자지만,\n약 70%는 끝내 주인이 찾아가지 않았습니다."],[36.024,40.331,"깨끗하기로 유명한 일본에서, 왜 이런 일이 벌어지는 걸까요?"],[40.331,43.252,"그냥 쓰레기로 버리면 되는 것 아닐까요?"],[43.252,47.952,"결론부터 말하면, 구청의 대형 쓰레기 제도는 주민을 위한 것입니다."],[47.952,50.762,"그래서 여행자는 버릴 곳을 따로 찾아야 하죠."],[50.762,54.182,"왜 그런지 네 가지 이유로 알아보겠습니다."],[54.182,58.301,"첫 번째 이유는 여행객이 일본에서 캐리어를 새로 사기 때문입니다."],[58.301,63.82,"도시마구는 엔화 약세로 싸고\n튼튼한 일본산 캐리어를 사는 여행객이 늘었다고 봅니다."],[63.82,68.207,"기념품 때문에 더 큰 가방으로 바꾸는 경우도 있을 것으로 보고 있고요."],[68.207,70.762,"그러면 원래 가져온 가방이 남게 되죠."],[70.762,73.717,"공항에서도 주인 없는 캐리어가 늘고 있습니다."],[73.717,77.826,"나리타공항에서 나온 캐리어는 지난해 1,200개가 넘었습니다."],[77.826,83.416,"도쿄신문은 이 가운데 약 90%가 주인을 찾지 못하고\n폐기된다고 전했습니다."],[83.416,87.654,"그렇다면 남은 가방은 왜 제대로 버리지 못하는 걸까요?"],[87.654,90.868,"두 번째 이유는 일본의 대형 쓰레기 제도입니다."],[90.868,96.248,"도쿄의 구들은 보통 한 변이 30센티미터를\n넘는 물건을 대형 쓰레기로 분류합니다."],[96.248,98.068,"캐리어도 여기에 들어가죠."],[98.068,103.538,"대형 쓰레기를 버리려면 미리 수거 신청을 하고,\n처리권 스티커를 사서 붙여야 합니다."],[103.538,106.608,"신주쿠구의 경우 캐리어 한 개에 400엔이에요."],[106.608,110.01,"비싸지 않아 보이지만, 결정적인 조건이 있습니다."],[110.01,113.594,"이 제도는 그 구에 사는 주민을 위한 제도라는 겁니다."],[113.594,119.264,"구 담당자도 일본 언론에 외국인 여행자를 위한 제도는\n생각하지 않았다고 말했습니다."],[119.264,125.031,"그래서 여행자는 민간 수거 업체나 공항\n서비스 같은 다른 방법을 따로 찾아야 합니다."],[125.031,128.526,"그럼 묵었던 호텔에 두고 가면 어떨까요?"],[128.526,131.595,"세 번째 이유는 호텔도 곤란하다는 점입니다."],[131.595,135.065,"손님이 두고 간 물건은 사업장 쓰레기로 분류됩니다."],[135.065,138.509,"그래서 호텔이 허가받은 업체에 돈을 내고 처리해야 합니다."],[138.509,142.567,"오사카의 한 호텔에는 한 해 200개 넘는 캐리어가 버려집니다."],[142.567,145.527,"처리비로만 1년에 15만 엔이 든다고 했습니다."],[145.527,150.726,"삿포로의 한 호텔 지배인도 보관할 공간이 없고\n처리비가 꽤 든다고 말했습니다."],[150.726,153.93,"호텔 입장에서도 비용 부담인 겁니다."],[153.93,157.827,"네 번째 이유는 일본 길거리에 쓰레기통이 드물다는 점입니다."],[157.827,162.287,"흔히 꼽히는 이유는 1995년 도쿄 지하철 사린 사건입니다."],[162.287,165.217,"그 뒤로 역의 쓰레기통이 크게 줄었다는 겁니다."],[165.217,169.619,"다만 사린 사건이 직접 원인인지는 일본 안에서도 의견이 갈립니다."],[169.619,175.539,"일본 관광청 조사에서도 외국인 관광객이 꼽은\n불편 1위가 '쓰레기통 부족'이었습니다."],[175.539,181.489,"작은 쓰레기도 버릴 곳이 마땅치 않은데,\n캐리어처럼 큰 물건은 더 어렵습니다."],[181.489,185.919,"그렇다면 버릴 곳을 찾기 어려우니, 길에 두고 가도 괜찮은 걸까요?"],[185.919,189.229,"현지에서는 전혀 다른 이야기가 나옵니다."],[189.229,191.549,"현지 주민들의 반응부터 보겠습니다."],[191.549,195.549,"\"화가 납니다\", \"몇 년 사이 50개 넘게 봤다\"는 말이 나왔습니다."],[195.549,200.149,"\"내용물을 몰라 무섭다\", \"폭발물인 줄 알았다\"는 반응도 있었습니다."],[200.149,204.242,"실제로 주인 없는 가방은 유실물로 일정 기간 보관해야 하거든요."],[204.242,209.544,"주부공항은 위험물인지 확인하려고\n그때마다 X선 검사를 한다고 밝혔습니다."],[209.544,213.902,"도시마구에선 이렇게 버려진 캐리어를\n구청이 세금으로 수거하고 있습니다."],[213.902,216.772,"게다가 길에 버리는 건 엄연한 불법입니다."],[216.772,220.515,"일본 폐기물처리법은 쓰레기 무단 투기를 금지합니다."],[220.515,225.905,"어기면 5년 이하 구금형이나 1,000만 엔 이하 벌금,\n또는 둘 다 받을 수 있습니다."],[225.905,230.19,"다만 이 문제를 외국인 관광객만의 탓으로 단정할 수는 없습니다."],[230.19,234.919,"주부공항에서 이 혐의로 처음 적발된 사람은 일본인 남성이었습니다."],[234.919,240.111,"그리고 지금, 일본 지자체들은 실제로 대책을 내놓기 시작했습니다."],[240.111,245.161,"도시마구는 올해 7월, 캐리어 재활용 업체 두 곳과 협정을 맺었습니다."],[245.161,250.817,"여러 나라 말로 된 경고 전단을 만들고,\n이케부쿠로의 대형 전광판으로도 경고하고 있습니다."],[250.817,253.68,"캐리어 투기를 막는 조례도 검토하고 있어요."],[253.68,259.53,"삿포로는 올해 6월부터 호텔에 남은 캐리어를\n거둬 고친 뒤 다시 파는 방식을 시작했습니다."],[259.53,264.11,"그럼 여행 중에 캐리어를 바꿨다면, 헌 가방은 어떻게 해야 할까요?"],[264.11,270.1,"간사이공항은 2018년부터 헌 캐리어를 무료로\n받는 재사용 서비스를 운영하고 있습니다."],[270.1,274.42,"항공권과 여권을 보여 주고, 소유권 포기서에 서명하면 돼요."],[274.42,279.626,"주부공항은 1,200엔에 받아 주고,\n2,200엔에 수거해 가는 민간 업체도 있습니다."],[279.626,284.743,"떠나기 전에 이용할 공항이나 숙소에\n먼저 물어보는 게 가장 확실합니다."],[284.743,288.009,"자, 마지막으로 오늘 내용을 정리하겠습니다."],[288.009,293.828,"일본에서 새 캐리어를 사는 여행객은 늘었는데,\n구청의 대형 쓰레기 제도는 주민용입니다."],[293.828,297.748,"호텔은 처리비가 들고, 길거리엔 쓰레기통도 드뭅니다."],[297.748,302.093,"그렇다고 길에 두고 가면 불법이고, 수거 비용은 세금으로 나갑니다."],[302.093,306.253,"공항이나 민간 업체처럼 여행자가 쓸 수 있는 방법도 있습니다."],[306.253,311.633,"일본 여행에서 캐리어를 바꾼다면,\n헌 가방을 처리할 방법부터 먼저 확인해 두세요."],[311.633,313.563,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

/* H3. 여행 중 캐리어를 바꿨다면? · 간사이공항 2018~ 무료 · 항공권·여권 + 포기서 · 주부 1,200엔 · 민간 2,200엔 · 먼저 물어보기 (문장 64~68) */

{
