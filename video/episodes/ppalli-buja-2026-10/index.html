7.335},{"n":71,"part":"장면 여섯, 내가 판 게 아니라 팔렸다","text":"그리고 이틀 뒤인 7월 31일, SK하이닉스는 하루에 30% 올라 상한가를 쳤습니다.","start":317.715,"end":323.494},{"n":72,"part":"장면 여섯, 내가 판 게 아니라 팔렸다","text":"빚이 없었다면, 그날 김 과장의 돈은 8,935만 원까지 돌아왔을 겁니다.","start":323.874,"end":329.15},{"n":73,"part":"장면 여섯, 내가 판 게 아니라 팔렸다","text":"빚은 손실을 키웠을 뿐 아니라, 다시 오를 때까지 기다릴 기회까지 빼앗은 것이죠.","start":329.53,"end":334.439},{"n":74,"part":"장면 여섯, 내가 판 게 아니라 팔렸다","text":"상한가를 지켜보기만 한 김 과장은, 이제 한 가지만 생각했습니다.","start":334.819,"end":339.16},{"n":75,"part":"장면 여섯, 내가 판 게 아니라 팔렸다","text":"한 번만 크게 먹으면 된다.","start":339.54,"end":341.1},{"n":76,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"7월 31일 장이 끝나기 직전, 김 과장은 남은 3,986만 원을 모두 넣었습니다.","start":342.1,"end":348.09},{"n":77,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"이번에는 SK하이닉스를 하루에 두 배로 따라가는 레버리지 ETF였습니다.","start":348.47,"end":353.25},{"n":78,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"잃은 6천만 원을, 두 배 속도로 빨리 되찾고 싶었습니다.","start":353.63,"end":357.3},{"n":79,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"그 뒤로 김 과장은 일하는 중에도 몇 분마다 주식 앱을 열었습니다.","start":357.68,"end":361.427},{"n":80,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"8월 12일, SK하이닉스는 7월 31일보다 12% 넘게 떨어져 있었습니다.","start":361.807,"end":367.449},{"n":81,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"두 배를 따라가는 김 과장의 계좌는 26% 줄어, 2,960만 원이 됐습니다.","start":367.829,"end":373.229},{"n":82,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"넣은 1억 원의 70%가, 석 달도 안 돼 사라진 겁니다.","start":373.609,"end":377.428},{"n":83,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"레버리지 상품은 떨어질 때도 두 배로 떨어지고, 오르내릴수록 더 깎이죠.","start":377.808,"end":382.468},{"n":84,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"하루 10% 떨어졌다가 다음 날 11% 올라, 주가가 제자리로 왔다고 해 보죠.","start":382.848,"end":388.168},{"n":85,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"그래도 2배 상품에는 2.4% 손해가 남습니다.","start":388.548,"end":391.713},{"n":86,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"2,960만 원을 다시 1억 원으로 만들려면, 이제 238%를 벌어야 합니다.","start":392.093,"end":397.933},{"n":87,"part":"장면 일곱, 한 번만 크게 먹으면 된다","text":"그날 밤 김 과장은 주식 앱을 지웠습니다.","start":398.313,"end":400.753},{"n":88,"part":" // box = [left, top, width, height] · range = [첫 날짜, 끝 날짜] · y 값 범위 [lo, hi]
function chart(sc, box, range, lo, hi, o) {
  o = o || {};
  const [L, Tp, Wd, Ht] = box, i0 = pIdx(range[0]), i1 = pIdx(range[1]);
  const xOf = d => L + (pIdx(d) - i0) / (i1 - i0) * Wd, yOf = p => Tp + (hi - p) / (hi - lo) * Ht;
  const pts = PX.slice(i0, i1 + 1).map((r, k) => `${(L + k / (i1 - i0) * Wd).toFixed(1)},${yOf(r[1]).toFixed(1)}`).join(" ");
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const svg = el(`<svg class="chart" viewBox="0 0 1920 1080" width="1920" height="1080" style="left:0;top:0" aria-hidden="true">
    <defs><clipPath id="${id}"><rect x="${L - 10}" y="0" width="0" height="1080"/></clipPath></defs>
    <rect x="${L - 30}" y="${Tp - 30}" width="${Wd + 60}" height="${Ht + 60}" rx="26" fill="rgba(10,16,30,.72)" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
    <polyline points="${pts}" fill="none" stroke="${o.color || "#F4F6FA"}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${id})"/>
  </svg>`, sc);
  const clip = svg.querySelector(`#${id} rect`);
  const reveal = (d, at, dur) => tl.to(clip, { attr: { width: xOf(d) - L + 20 }, duration: dur || 1.2, ease: "power1.inOut" }, at);
  const setTo = (d, at) => tl.set(clip, { attr: { width: xOf(d) - L + 20 } }, at);
  const line = (p, label, at, color, left) => {    // 가로 기준선 (노란 점선) · left = 이름표를 왼쪽 위에
    const y = yOf(p);
    const l = el(`<div class="hthr" style="left:${L}px;top:${y - 3}px;width:${Wd}px;border-top-color:${color || Y}"></div>`, sc);
    const lab = el(`<div class="a w9 nw ts" style="left:${left ? L + 20 : L + Wd - 360}px;top:${left ? y - 62 : y + 12}px;font-size:44px;color:${color || Y}">${label}</div>`, sc);
    pop(l, at, { from: { y: 0, scaleX: 0 } }); pop(lab, at + 0.1);
    return { l, lab };
  };
  const mark = (d, html, at, color, dy, side) => {   // 점 + 이름표
    const x = xOf(d), y = yOf(close(d));
    const dot = el(`<div class="a" style="left:${x - 16}px;top:${y - 16}px;width:32px;height:32px;border-radius:50%;background:${color || "#F4F6FA"};border:5px solid #0C1424"></div>`, sc);
    const lab = el(`<div class="a ${side === "l" ? "" : "cx"} w9 nw ts" style="left:${side === "l" ? x - 470 : x}px;top:${y + (dy == null ? -96 : dy)}px;font-size:46px;color:${color || "#F4F6FA"}">${html}</div>`, sc);
    pop(dot, at, { from: { scale: 0.2, y: 0 } }); pop(lab, at + 0.1);
    return { dot, lab };
  };
  return { svg, xOf, yOf, reveal, setTo, line, mark };
}
