","text":"성실성은 계획을 세우고, 정리하고, 일을 끝까지 마무리하는 성향을 말합니다.","start":71.426,"end":76.598},{"n":20,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"성실성이 높은 분에게는 밥을 먹는 것도 하나의 일일 수 있습니다.","start":76.978,"end":80.918},{"n":21,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"수저를 내려놓는 순간이 아니라, 그릇을 정리한 순간이 그 일이 끝나는 순간입니다.","start":81.298,"end":86.221},{"n":22,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"그래서 그릇을 모으는 것까지가 식사의 마지막 순서가 될 수 있습니다.","start":86.601,"end":90.498},{"n":23,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"다만 식당에서는 모으는데 집은 어수선한 분도 있습니다.","start":90.878,"end":94.16},{"n":24,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"그럴 땐 남이 치우는 곳이라 더 신경 쓰이거나, 남의 눈이 쓰여서일 수도 있습니다.","start":94.54,"end":99},{"n":25,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"여행지 숙소를 나올 때 이불을 개어 두는 분도 이쪽에 가깝습니다.","start":99.38,"end":103.19},{"n":26,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"회의가 끝나면 다 쓴 컵을 챙기고, 의자를 넣고 나오는 분도 있습니다.","start":103.57,"end":107.96},{"n":27,"part":"첫 번째, 끝까지 마무리하려는 성향","text":"한마디로, 그릇을 모으는 손에는 끝까지 마무리하려는 성향이 묻어 있을 수 있습니다.","start":108.34,"end":113.55},{"n":28,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"두 번째는, 그릇을 치울 사람의 수고를 먼저 떠올리는 마음입니다.","start":114.55,"end":118.584},{"n":29,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"식당 직원은 하루에도 많은 테이블을 치웁니다.","start":118.964,"end":121.712},{"n":30,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그릇이 테이블 여기저기 흩어져 있으면, 그만큼 손이 여러 번 더 갑니다.","start":122.092,"end":126.612},{"n":31,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그래서 일어나기 전에 '치우는 사람이 덜 힘들었으면' 하는 생각이 들 수 있습니다.","start":126.992,"end":131.312},{"n":32,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"모임에서 빈 컵을 먼저 모으는 분도 이쪽에 가깝습니다.","start":131.692,"end":135.333},{"n":33,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"심리학에서는 남의 입장에 서서 그 사람의 마음을 느껴 보는 힘을 공감이라고 부릅니다.","start":135.713,"end":140.783},{"n":34,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"의자를 다시 넣는 사람을 다룬 한 영상에도, '치울 때 편하시라고'라는 댓글이 있었습니다.","start":141.163,"end":146.292},{"n":35,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"'일하시는 분들이 조금이라도 덜 힘들었으면 해서'라는 댓글도 있었습니다.","start":146.672,"end":150.739},{"n":36,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그런데 식당에서는 알아 둘 것이 하나 있습니다.","start":151.119,"end":153.599},{"n":37,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"식당에 따라서는 직원이 정해진 순서대로 치웁니다.","start":153.979,"end":157.144},{"n":38,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"음식이 남은 그릇을 겹치면 바닥까지 묻어 오히려 일이 늘 수 있습니다.","start":157.524,"end":161.734},{"n":39,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그럴 땐 겹치지 말고 한쪽에 모아만 두면 됩니다.","start":162.114,"end":164.723},{"n":40,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그래서 직원이 \"그대로 두셔도 됩니다\"라고 하면, 그 말을 따르는 것이 배려입니다.","start":165.103,"end":169.879},{"n":41,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"그릇을 모으지 않는 사람이 나쁜 사람이라는 뜻도 아닙니다.","start":170.259,"end":173.458},{"n":42,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"사람마다 남을 생각하는 방식이 다를 뿐입니다.","start":173.838,"end":176.537},{"n":43,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"한마디로, 그릇을 모으는 손에는 다음 사람을 생각하는 마음이 들어 있을 수 있습니다.","start":176.917,"end":181.857},{"n":44,"part":"두 번째, 치울 사람을 먼저 떠올림","text":"첫째가 끝내려는 성향, 둘째가 남을 향한 마음이라면, 셋째는 안 할 때의 불편함입니다.","start":182.237,"end":187.527},{"n":45,"part":"세 번째, 착해서만이 아니라 불편해서","text":"세 번째는, 어질러진 채로 일어나면 마음이 불편하다는 것입니다.","start":188.527,"end":192.647},{"n":46,"part":"세 번째, 착해서만이 아니라 불편해서","text":"앞에서 본 의자 영상의 댓글을 다시 보겠습니다.","start":193.027,"end":195.727},{"n":47,"part":"세 번째, 착해서만이 아니라 불편해서","text":"좋아요를 가장 많이 받은 댓글은 '의자 넣는 건 기본 아닌가'였습니다.","start":196.107,"end":200.147},{"n":48,"part":"세 번째, 착해서만이 아니라 불편해서","text":"가장 많은 분이 그냥 배운 예절로 본 것입니다.","start":200.527,"end":203.157},{"n":49,"part":"세 번째, 착해서만이 아니라 불편해서","text":"그다음으로 좋아요를 많이 받은 댓글은 뜻이 조금 달랐습니다.","start":203.537,"end":207.293},{"n":50,"part":"세 번째, 착해서만이 아니라 불편해서","text":"'착해서가 아니라, 안 넣고 가면 거슬려서 그냥 못 지나친다'는 말이었습니다.","start":207.673,"end":212.231},{"n":51,"part":"세 번째, 착해서만이 아니라 불편해서","text":"좋아요 다섯째 댓글도 '머문 자리를 지저분하게 두고 나오면 불편하다'였습니다.","start":212.611,"end":217.441},{"n":52,"part":"세 번째, 착해서만이 아니라 불편해서","text":"심리학에는 '딱 맞지 않는 느낌'이라는 말이 있습니다.","start":217.821,"end":220.798},{"n":53,"part":"세 번째, 착해서만이 아니라 불편해서","text":"물건이 제자리에 있지 않거나, 뭔가 어긋나 보일 때 드는 찜찜한 느낌입니다.","start":221.178,"end":226.058},{"n":54,"part":"세 번째, 착해서만이 아니라 불편해서","text":"2022년에 여러 연구를 모아 결과를 다시 계산한 분석이 있습니다.","start":226.438,"end":230.435},{"n":55,"part":"세 번째, 착해서만이 아니라 불편해서","text":"이 느낌이 강할수록 강박 증상 점수도 높았습니다.","start":230.815,"end":233.772},{"n":56,"part":"세 번째, 착해서만이 아니라 불편해서","text":"강박증이 없는 일반인에게서도 마찬가지였습니다.","start":234.152,"end":236.812},{"n":57,"part":"세 번째, 착해서만이 아니라 불편해서","text":"그렇다고 그릇을 모으는 사람이 강박증이라는 뜻은 아닙니다.","start":237.192,"end":240.729},{"n":58,"part":"세 번째, 착해서만이 아니라 불편해서","text":"강박증은 원치 않는 생각이나 찜찜함 때문에 행동을 못 멈춰, 생활이 힘든 상태입니다.","start":241.109,"end":246.689},{"n":59,"part":"세 번째, 착해서만이 아니라 불편해서","text":"그 진단은 전문가가 합니다.","start":247.069,"end":248.492},{"n":60,"part":"세 번째, 착해서만이 아니라 불편해서","text":"식당에서 그릇을 잠깐 모으고 일어나는 행동은 이와 다릅니다.","start":248.872,"end":252.517},{"n":61,"part":"세 번째, 착해서만이 아니라 불편해서","text":"앞의 댓글처럼, 그릇을 모으는 분 중에는 이 찜찜함을 더 느끼는 분이 있을 수 있습니다.","start":252.897,"end":258.482},{"n":62,"part":"세 번째, 착해서만이 아니라 불편해서","text":"그런 분이라면 그릇을 모으고 나서 마음이 풀린다고 느낄 수 있습니다.","start":258.862,"end":263.053},{"n":63,"part":"세 번째, 착해서만이 아니라 불편해서","text":"신발 끈이 한쪽만 풀려 있으면, 걷는 내내 그쪽이 신경 쓰이는 것과 비슷합니다.","start":263.433,"end":268.613},{"n":64,"part":"세 번째, 착해서만이 아니라 불편해서","text":"끈을 묶고 나서야 비로소 걸음에 집중할 수 있습니다.","start":268.993,"end":271.996},{"n":65,"part":"세 번째, 착해서만이 아니라 불편해서","text":"한마디로, 그릇을 모으는 일은 남을 위하면서 내 마음도 편하게 하는 일일 수 있습니다.","start":272.376,"end":277.596},{"n":66,"part":"세 번째, 착해서만이 아니라 불편해서","text":"그렇다면 이 습관이 지나치면 어떤 일이 생길까요?","start":277.976,"end":281.022},{"n":67,"part":"지나칠 때 알아 둘 점","text":"그릇을 모아 두는 것 자체는 나쁜 습관이 아닙니다.","start":282.022,"end":284.913},{"n":68,"part":"지나칠 때 알아 둘 점","text":"하지만 정리를 하지 않으면 자리에서 일어나지 못할 정도라면 이야기가 다릅니다.","start":285.293,"end":289.553},{"n":69,"part":"지나칠 때 알아 둘 점","text":"예를 들어 같이 간 사람이 그릇을 흩어 놓았을 때 화가 날 정도라면 한번 살펴볼 만합니다.","start":289.933,"end":294.946},{"n":70,"part":"지나칠 때 알아 둘 점","text":"집에서도 가족이 어쩌다 컵 하나 안 치운 일로 하루 종일 기분이 상한다면 마찬가지입니다.","start":295.326,"end":300.253},{"n":71,"part":"지나칠 때 알아 둘 점","text":"이럴 때는 정리를 '반드시 해야 하는 일'이 아니라 '하면 좋은 일'로 바꿔 보세요.","start":300.633,"end":304.993},{"n":72,"part":"지나칠 때 알아 둘 점","text":"방법은 이렇습니다.","start":305.373,"end":306.437},{"n":73,"part":"지나칠 때 알아 둘 점","text":"이것은 치료가 아니라, 내 마음을 살펴보는 작은 연습입니다.","start":306.817,"end":310.714},{"n":74,"part":"지나칠 때 알아 둘 점","text":"집에서 다 마신 컵 하나를 바로 씻지 말고, 30분 뒤에 씻어 보세요.","start":311.094,"end":315.434},{"n":75,"part":"지나칠 때 알아 둘 점","text":"그리고 그동안 찜찜함이 어떻게 달라지는지 지켜봅니다.","start":315.814,"end":318.915},{"n":76,"part":"지나칠 때 알아 둘 점","text":"찜찜함이 줄어든다면, 정리는 꼭 해야 하는 일이 아니라 내가 고르는 일입니다.","start":319.295,"end":324.031},{"n":77,"part":"지나칠 때 알아 둘 점","text":"그대로라면 일주일쯤 더 해 보셔도 됩니다.","start":324.411,"end":326.681},{"n":78,"part":"지나칠 때 알아 둘 점","text":"다만 일주일쯤 해도 줄지 않고 정리를 멈추지 못해 힘들다면, 전문가와 이야기해 보세요.","start":327.061,"end":332.402},{"n":79,"part":"지나칠 때 알아 둘 점","text":"그런데 이 차이가 더 자주 부딪치는 곳은 식당보다 집입니다.","start":332.782,"end":336.292},{"n":80,"part":"집에서 습관이 다를 때","text":"부부나 가족 사이에 정리 습관이 다르면, 작은 일로 다투기도 합니다.","start":337.292,"end":341.27},{"n":81,"part":"집에서 습관이 다를 때","text":"한 사람은 컵을 바로 씻고, 다른 사람은 모아 두었다가 한 번에 씻습니다.","start":341.65,"end":346.076},{"n":82,"part":"집에서 습관이 다를 때","text":"명절에 설거지를 누가 먼저 시작하느냐로 서운해지는 집도 있습니다.","start":346.456,"end":350.245},{"n":83,"part":"집에서 습관이 다를 때","text":"먼저 정리하는 쪽은 '왜 나만 치우지' 하고 서운해지기 쉽습니다.","start":350.625,"end":354.583},{"n":84,"part":"집에서 습관이 다를 때","text":"나중에 정리하는 쪽은 '왜 나를 게으른 사람으로 보지' 하고 억울해지기 쉽습니다.","start":354.963,"end":359.46},{"n":85,"part":"집에서 습관이 다를 때","text":"여기서 먼저 나눠 볼 것이 있습니다.","start":359.84,"end":361.84},{"n":86,"part":"집에서 습관이 다를 때","text":"나중에라도 치운다면, 둘 다 정리를 안 하는 것이 아니라 때가 다를 뿐입니다.","start":362.22,"end":367.003},{"n":87,"part":"집에서 습관이 다를 때","text":"그때는 '왜 안 치워'라고 말하기보다, 언제까지 치울지를 같이 정하는 것이 좋습니다.","start":367.383,"end":372.523},{"n":88,"part":"집에서 습관이 다를 때","text":"예를 들어 '설거지는 자기 전에 끝내자'처럼 끝나는 시각을 정하는 겁니다.","start":372.903,"end":376.943},{"n":89,"part":"집에서 습관이 다를 때","text":"이렇게 하면 먼저 치우는 사람은 기다리기 쉽고, 나중에 치우는 사람은 덜 쫓깁니다.","start":377.323,"end":382.173},{"n":90,"part":"집에서 습관이 다를 때","text":"하지만 늘 한 사람만 치운다면, 그것은 때의 차이가 아니라 일을 나누는 문제입니다.","start":382.553,"end":387.643},{"n":91,"part":"집에서 습관이 다를 때","text":"그때는 끝나는 시각과 함께, 누가 무엇을 맡을지도 정하세요.","start":388.023,"end":392.018},{"n":92,"part":"집에서 습관이 다를 때","text":"예를 들어 '저녁 설거지는 당신, 아침은 나'처럼 나누는 겁니다.","start":392.398,"end":396.405},{"n":93,"part":"집에서 습관이 다를 때","text":"정한 몫은 각자 지키고, 상대 몫을 대신 하지 않으면 됩니다.","start":396.785,"end":400.399},{"n":94,"part":"집에서 습관이 다를 때","text":"정한 몫이 자꾸 어긋나면, 대신 치우기 전에 한 번 말하고 나누는 방법을 다시 정하세요.","start":400.779,"end":406.399},{"n":95,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":407.399,"end":410.285},{"n":96,"part":"정리","text":"식당에서 그릇을 모아 두는 분들에게서 볼 수 있는 특징은 세 가지였습니다.","start":410.665,"end":414.574},{"n":97,"part":"정리","text":"첫째, 하던 일을 끝까지 마무리하려는 성향입니다.","start":414.954,"end":418.073},{"n":98,"part":"정리","text":"둘째, 그릇을 치울 사람의 수고를 먼저 떠올리는 마음입니다.","start":418.453,"end":422.173},{"n":99,"part":"정리","text":"셋째, 착해서만이 아니라, 어질러진 채로 일어나면 마음이 불편한 것입니다.","start":422.553,"end":427.553},{"n":100,"part":"정리","text":"첫째는 성격 이론, 둘째는 댓글, 셋째는 닮은 연구와 댓글로 짚어 본 것입니다.","start":427.933,"end":432.937},{"n":101,"part":"정리","text":"이 습관 때문에 불안해진다면, 조금 느슨해져도 괜찮습니다.","start":433.317,"end":437.227},{"n":102,"part":"정리","text":"다음에 그릇을 모을 때, 세 가지 중 어느 마음인지, 그냥 배운 습관인지 골라 보세요.","start":437.607,"end":442.947},{"n":103,"part":"정리","text":"시청해주셔서 감사합니다.","start":443.327,"end":444.857}],"subs":[[0.2,5.12,"식당에서 밥을 다 먹고 나면,\n빈 그릇을 한쪽에 모아 두는 사람이 있습니다."],[5.12,9.34,"수저는 가지런히 모으고, 흘린 반찬은 휴지로 닦아 둡니다."],[9.34,11.776,"직원이 치워 주는 식당인데도 말입니다."],[11.776,13.522,"그런데 왜 그렇게 할까요?"],[13.522,17.838,"혹시 여러분도 자리에서 일어나기 전에 그릇부터 모으고 계신가요?"],[17.838,19.748,"결론부터 말씀드리겠습니다."],[19.748,22.733,"이런 분들에게서 볼 수 있는 특징은 세 가지입니다."],[22.733,26.232,"첫째, 하던 일을 끝까지 마무리하려는 성향입니다."],[26.232,30.332,"둘째, 그릇을 치울 사람의 수고를 먼저 떠올리는 마음입니다."],[30.332,35.712,"셋째, 착해서만이 아니라,\n어질러진 채로 일어나면 마음이 불편한 것입니다."],[35.712,41.092,"흔히 '배려심이 깊다'로 설명하는데,\n연구와 댓글로 보면 어디까지 맞을까요?"],[41.092,46.909,"오늘은 닮은 행동을 다룬 연구와,\n비슷한 영상에 달린 실제 댓글로 짚어 보겠습니다."],[46.909,52.709,"물론 예절로 배웠거나 식당 일을 해 봐서 그런 분도 많고,\n하나만 맞는 분도 있습니다."],[52.709,57.849,"지나칠 때 알아 둘 점과,\n집에서 습관이 다를 때 할 일도 끝에 말씀드리겠습니다."],[57.849,60.608,"먼저 첫 번째부터 보겠습니다."],[60.608,64.239,"첫 번째는, 하던 일을 끝까지 마무리하려는 성향입니다."],[64.239,69.306,"심리학 연구에서 가장 널리 쓰는 성격 이론은\n성격을 다섯 가지 성향으로 봅니다."],[69.306,71.426,"그중 하나가 성실성입니다."],[71.426,76.978,"성실성은 계획을 세우고, 정리하고,\n일을 끝까지 마무리하는 성향을 말합니다."],[76.978,81.298,"성실성이 높은 분에게는 밥을 먹는 것도 하나의 일일 수 있습니다."],[81.298,86.601,"수저를 내려놓는 순간이 아니라,\n그릇을 정리한 순간이 그 일이 끝나는 순간입니다."],[86.601,90.878,"그래서 그릇을 모으는 것까지가 식사의 마지막 순서가 될 수 있습니다."],[90.878,94.54,"다만 식당에서는 모으는데 집은 어수선한 분도 있습니다."],[94.54,99.38,"그럴 땐 남이 치우는 곳이라 더 신경 쓰이거나,\n남의 눈이 쓰여서일 수도 있습니다."],[99.38,103.57,"여행지 숙소를 나올 때 이불을 개어 두는 분도 이쪽에 가깝습니다."],[103.57,108.34,"회의가 끝나면 다 쓴 컵을 챙기고, 의자를 넣고 나오는 분도 있습니다."],[108.34,114.55,"한마디로, 그릇을 모으는 손에는 끝까지\n마무리하려는 성향이 묻어 있을 수 있습니다."],[114.55,118.964,"두 번째는, 그릇을 치울 사람의 수고를 먼저 떠올리는 마음입니다."],[118.964,122.092,"식당 직원은 하루에도 많은 테이블을 치웁니다."],[122.092,126.992,"그릇이 테이블 여기저기 흩어져 있으면, 그만큼 손이 여러 번 더 갑니다."],[126.992,131.692,"그래서 일어나기 전에 '치우는\n사람이 덜 힘들었으면' 하는 생각이 들 수 있습니다."],[131.692,135.713,"모임에서 빈 컵을 먼저 모으는 분도 이쪽에 가깝습니다."],[135.713,141.163,"심리학에서는 남의 입장에 서서\n그 사람의 마음을 느껴 보는 힘을 공감이라고 부릅니다."],[141.163,146.672,"의자를 다시 넣는 사람을 다룬 한 영상에도,\n'치울 때 편하시라고'라는 댓글이 있었습니다."],[146.672,151.119,"'일하시는 분들이 조금이라도 덜 힘들었으면\n해서'라는 댓글도 있었습니다."],[151.119,153.979,"그런데 식당에서는 알아 둘 것이 하나 있습니다."],[153.979,157.524,"식당에 따라서는 직원이 정해진 순서대로 치웁니다."],[157.524,162.114,"음식이 남은 그릇을 겹치면 바닥까지 묻어 오히려 일이 늘 수 있습니다."],[162.114,165.103,"그럴 땐 겹치지 말고 한쪽에 모아만 두면 됩니다."],[165.103,170.259,"그래서 직원이 \"그대로 두셔도 됩니다\"라고 하면,\n그 말을 따르는 것이 배려입니다."],[170.259,173.838,"그릇을 모으지 않는 사람이 나쁜 사람이라는 뜻도 아닙니다."],[173.838,176.917,"사람마다 남을 생각하는 방식이 다를 뿐입니다."],[176.917,182.237,"한마디로, 그릇을 모으는 손에는 다음 사람을\n생각하는 마음이 들어 있을 수 있습니다."],[182.237,188.527,"첫째가 끝내려는 성향, 둘째가 남을 향한 마음이라면,\n셋째는 안 할 때의 불편함입니다."],[188.527,193.027,"세 번째는, 어질러진 채로 일어나면 마음이 불편하다는 것입니다."],[193.027,196.107,"앞에서 본 의자 영상의 댓글을 다시 보겠습니다."],[196.107,200.527,"좋아요를 가장 많이 받은 댓글은 '의자 넣는 건 기본 아닌가'였습니다."],[200.527,203.537,"가장 많은 분이 그냥 배운 예절로 본 것입니다."],[203.537,207.673,"그다음으로 좋아요를 많이 받은 댓글은 뜻이 조금 달랐습니다."],[207.673,212.611,"'착해서가 아니라,\n안 넣고 가면 거슬려서 그냥 못 지나친다'는 말이었습니다."],[212.611,217.821,"좋아요 다섯째 댓글도 '머문 자리를 지저분하게 두고\n나오면 불편하다'였습니다."],[217.821,221.178,"심리학에는 '딱 맞지 않는 느낌'이라는 말이 있습니다."],[221.178,226.438,"물건이 제자리에 있지 않거나,\n뭔가 어긋나 보일 때 드는 찜찜한 느낌입니다."],[226.438,230.815,"2022년에 여러 연구를 모아 결과를 다시 계산한 분석이 있습니다."],[230.815,234.152,"이 느낌이 강할수록 강박 증상 점수도 높았습니다."],[234.152,237.192,"강박증이 없는 일반인에게서도 마찬가지였습니다."],[237.192,241.109,"그렇다고 그릇을 모으는 사람이 강박증이라는 뜻은 아닙니다."],[241.109,247.069,"강박증은 원치 않는 생각이나 찜찜함 때문에 행동을 못 멈춰,\n생활이 힘든 상태입니다."],[247.069,248.872,"그 진단은 전문가가 합니다."],[248.872,252.897,"식당에서 그릇을 잠깐 모으고 일어나는 행동은 이와 다릅니다."],[252.897,258.862,"앞의 댓글처럼,\n그릇을 모으는 분 중에는 이 찜찜함을 더 느끼는 분이 있을 수 있습니다."],[258.862,263.433,"그런 분이라면 그릇을 모으고 나서 마음이 풀린다고 느낄 수 있습니다."],[263.433,268.993,"신발 끈이 한쪽만 풀려 있으면,\n걷는 내내 그쪽이 신경 쓰이는 것과 비슷합니다."],[268.993,272.376,"끈을 묶고 나서야 비로소 걸음에 집중할 수 있습니다."],[272.376,277.976,"한마디로, 그릇을 모으는 일은 남을 위하면서\n내 마음도 편하게 하는 일일 수 있습니다."],[277.976,282.022,"그렇다면 이 습관이 지나치면 어떤 일이 생길까요?"],[282.022,285.293,"그릇을 모아 두는 것 자체는 나쁜 습관이 아닙니다."],[285.293,289.933,"하지만 정리를 하지 않으면 자리에서\n일어나지 못할 정도라면 이야기가 다릅니다."],[289.933,295.326,"예를 들어 같이 간 사람이 그릇을 흩어 놓았을 때 화가 날 정도라면\n한번 살펴볼 만합니다."],[295.326,300.633,"집에서도 가족이 어쩌다 컵 하나 안 치운 일로\n하루 종일 기분이 상한다면 마찬가지입니다."],[300.633,305.373,"이럴 때는 정리를 '반드시 해야 하는 일'이 아니라 '하면\n좋은 일'로 바꿔 보세요."],[305.373,306.817,"방법은 이렇습니다."],[306.817,311.094,"이것은 치료가 아니라, 내 마음을 살펴보는 작은 연습입니다."],[311.094,315.814,"집에서 다 마신 컵 하나를 바로 씻지 말고, 30분 뒤에 씻어 보세요."],[315.814,319.295,"그리고 그동안 찜찜함이 어떻게 달라지는지 지켜봅니다."],[319.295,324.411,"찜찜함이 줄어든다면,\n정리는 꼭 해야 하는 일이 아니라 내가 고르는 일입니다."],[324.411,327.061,"그대로라면 일주일쯤 더 해 보셔도 됩니다."],[327.061,332.782,"다만 일주일쯤 해도 줄지 않고 정리를 멈추지 못해 힘들다면,\n전문가와 이야기해 보세요."],[332.782,337.292,"그런데 이 차이가 더 자주 부딪치는 곳은 식당보다 집입니다."],[337.292,341.65,"부부나 가족 사이에 정리 습관이 다르면, 작은 일로 다투기도 합니다."],[341.65,346.456,"한 사람은 컵을 바로 씻고,\n다른 사람은 모아 두었다가 한 번에 씻습니다."],[346.456,350.625,"명절에 설거지를 누가 먼저 시작하느냐로 서운해지는 집도 있습니다."],[350.625,354.963,"먼저 정리하는 쪽은 '왜 나만 치우지' 하고 서운해지기 쉽습니다."],[354.963,359.84,"나중에 정리하는 쪽은 '왜 나를 게으른 사람으로 보지' 하고\n억울해지기 쉽습니다."],[359.84,362.22,"여기서 먼저 나눠 볼 것이 있습니다."],[362.22,367.383,"나중에라도 치운다면,\n둘 다 정리를 안 하는 것이 아니라 때가 다를 뿐입니다."],[367.383,372.903,"그때는 '왜 안 치워'라고 말하기보다,\n언제까지 치울지를 같이 정하는 것이 좋습니다."],[372.903,377.323,"예를 들어 '설거지는 자기 전에\n끝내자'처럼 끝나는 시각을 정하는 겁니다."],[377.323,382.553,"이렇게 하면 먼저 치우는 사람은 기다리기 쉽고,\n나중에 치우는 사람은 덜 쫓깁니다."],[382.553,388.023,"하지만 늘 한 사람만 치운다면,\n그것은 때의 차이가 아니라 일을 나누는 문제입니다."],[388.023,392.398,"그때는 끝나는 시각과 함께, 누가 무엇을 맡을지도 정하세요."],[392.398,396.785,"예를 들어 '저녁 설거지는 당신, 아침은 나'처럼 나누는 겁니다."],[396.785,400.779,"정한 몫은 각자 지키고, 상대 몫을 대신 하지 않으면 됩니다."],[400.779,407.399,"정한 몫이 자꾸 어긋나면,\n대신 치우기 전에 한 번 말하고 나누는 방법을 다시 정하세요."],[407.399,410.665,"자, 마지막으로 오늘 내용을 정리하겠습니다."],[410.665,414.954,"식당에서 그릇을 모아 두는\n분들에게서 볼 수 있는 특징은 세 가지였습니다."],[414.954,418.453,"첫째, 하던 일을 끝까지 마무리하려는 성향입니다."],[418.453,422.553,"둘째, 그릇을 치울 사람의 수고를 먼저 떠올리는 마음입니다."],[422.553,427.933,"셋째, 착해서만이 아니라,\n어질러진 채로 일어나면 마음이 불편한 것입니다."],[427.933,433.317,"첫째는 성격 이론, 둘째는 댓글,\n셋째는 닮은 연구와 댓글로 짚어 본 것입니다."],[433.317,437.607,"이 습관 때문에 불안해진다면, 조금 느슨해져도 괜찮습니다."],[437.607,443.327,"다음에 그릇을 모을 때, 세 가지 중 어느 마음인지,\n그냥 배운 습관인지 골라 보세요."],[443.327,445.257,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

}
function note(W_, html, t, out, rot) {

}
function rest(a, b, opt) {            // 식당: 식탁 앞판(FG) + 식탁 위 그릇 소품
  opt = opt || {};

  if (!opt.empty) {
    put("bowl", "PROPS-A1-1", 620, 842, 150, -6); put("plate", "PROPS-A1-2", 1320, 848, 175, 8);
    put("spoon", "PROPS-A1-3", 820, 858, 130, 64); put("tissue", "PROPS-A1-4", 1120, 860, 105, 0);
    put("stack", "PROPS-A2-1", 960, 836, 180, 0);
    for (const k of ["bowl", "plate", "spoon", "tissue"]) show(D[k], a, 0.01);
  }
  return { W_, D };
}
function gather(D, t) {               // 흩어진 그릇이 가운데로 모여 한 무더기가 됨
  tl.to(D.bowl, { x: 900, y: 842, rotation: 0, duration: 0.7, ease: "power2.inOut" }, t);

  hide([D.bowl, D.plate], t + 1.0, 0.15); show(D.stack, t + 1.0, 0.15);
  pop(D.stack, t + 1.0, 0.85);
}
function wipe(D, t) {                 // 휴지로 닦고 치움

}

function seatG(W_, keys, opt) { return actor(W_, keys, SP.SEAT[0] + ((opt && opt.dx) || 0), SP.SEAT[1], SP.SEAT[2], Object.assign({ shadow: false }, opt || {})); }
function quote(W_, rect, rank, text, t, out) {

}
