# 재테크 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.0 — 2026-10-28 — 새로 (사용자 지시 2026-10-28 "시청자 페르소나 파일 생성하도록 해").
#   묶음(stage) = 생애 단계 · 처지(state) = 자기 이야기 속 상황 · know = 용어 사전 · like/dislike = 칭찬·비판 댓글 갈래.
#   정규식은 파이썬 re (대소문자 무시). 작은따옴표 문자열 = 역슬래시 그대로.
#   정확도(audit 무작위 40개를 사람이 읽음): 아래 [personas] AUDIT 에 적는다.
#   감사 2026-10-28 (audit 무작위 — Claude 가 읽음): 나이 36/40 맞음(90%, 틀린 것 = 통계 나이·남의 나이) · 묶음 '3040 직장인' 10/15 · 처지 '생활비 빠듯' 고친 뒤 12/15.

