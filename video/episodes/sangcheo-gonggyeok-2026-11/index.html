,"end":80.525},{"n":19,"part":"바탕이 된 연구","text":"그럼 상처와는 어떻게 이어질까요?","start":80.975,"end":83.009},{"n":20,"part":"바탕이 된 연구","text":"2022년, 실험 연구들을 모은 메타분석이 있습니다.","start":83.459,"end":87.102},{"n":21,"part":"바탕이 된 연구","text":"메타분석은 같은 주제의 연구들을 모아 결과를 다시 계산하는 방법입니다.","start":87.552,"end":92.002},{"n":22,"part":"바탕이 된 연구","text":"참가자에게 따돌림이나 거절을 겪게 하자, 그 뒤 평균적으로 더 공격적으로 행동했습니다.","start":92.452,"end":98.058},{"n":23,"part":"바탕이 된 연구","text":"방금 받은 상처가 날카로움으로 이어질 수 있다는 뜻입니다.","start":98.508,"end":102.052},{"n":24,"part":"바탕이 된 연구","text":"실험실에서 잠깐 겪은 거절이라, 일상과 똑같지는 않습니다.","start":102.502,"end":106.296},{"n":25,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"첫 번째 이유는, 거절당할 낌새에 미리 날을 세운다는 것입니다.","start":107.296,"end":111.241},{"n":26,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"거절에 예민한 사람은, 비슷한 일이 다시 일어날까 봐 자주 대비합니다.","start":111.691,"end":116.089},{"n":27,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"답장이 조금 늦으면 '나를 싫어하나' 하는 생각이 먼저 들기 쉽습니다.","start":116.539,"end":120.536},{"n":28,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"회의에서 내 의견이 그냥 넘어가면, 무시당했다고 느끼기도 합니다.","start":120.986,"end":125.233},{"n":29,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"그리고 상처받기 전에 먼저 쏘아붙이기도 합니다.","start":125.683,"end":128.623},{"n":30,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"혹시 연락이 뜸한 친구에게 \"왜 연락 안 해?\" 하고 먼저 따진 적이 있으신가요?","start":129.073,"end":133.372},{"n":31,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"그 말 밑에는 '또 나만 뒷전이네' 하는 서운함과 화가 있을 수 있습니다.","start":133.822,"end":137.819},{"n":32,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"2021년, 연구 52편을 모은 분석에서도 거절에 예민할수록 공격이 조금 더 많았습니다.","start":138.269,"end":144.328},{"n":33,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"특히 걱정보다 화가 먼저 나는 사람, 순간 맞받아치는 공격에서 그랬습니다.","start":144.778,"end":149.478},{"n":34,"part":"첫 번째 이유, 거절의 낌새에 미리 날을 세움","text":"한마디로, 날카로운 말은 거절의 낌새에 먼저 튀어나오는 반응일 수 있습니다.","start":149.928,"end":154.779},{"n":35,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"두 번째 이유는, 남의 말과 행동을 나를 공격하려는 뜻으로 읽는다는 것입니다.","start":155.779,"end":160.63},{"n":36,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"심리학에서는 이것을 적대적 귀인 편향이라고 부릅니다.","start":161.08,"end":164.473},{"n":37,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"뜻이 분명하지 않은 남의 행동을, 나에게 나쁜 마음을 품은 행동으로 읽는 버릇입니다.","start":164.923,"end":170.227},{"n":38,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"예를 들어 지하철에서 누가 어깨를 부딪치고 지나갔다고 해 보겠습니다.","start":170.677,"end":174.976},{"n":39,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"많은 사람은 '사람이 많아서 그랬나 보다' 하고 넘어갑니다.","start":175.426,"end":178.819},{"n":40,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그런데 이 버릇이 강한 사람은 '일부러 밀쳤다'고 읽기 쉽습니다.","start":179.269,"end":182.964},{"n":41,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그렇게 읽고 나면, 화를 내는 게 당연하게 느껴집니다.","start":183.414,"end":186.755},{"n":42,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"물론 정말 나쁜 뜻이 담긴 말도 있습니다.","start":187.205,"end":189.541},{"n":43,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그것을 알아챈 것은 편향이 아닙니다.","start":189.991,"end":192.176},{"n":44,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"문제는 뜻이 애매한 말까지 모두 공격으로 읽을 때입니다.","start":192.626,"end":196.019},{"n":45,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"2023년 한국 대학생 250명에게 한 번 온라인 설문을 한 연구가 이 부분을 봤습니다.","start":196.469,"end":202.127},{"n":46,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"여기서 공격은 계획한 것이 아니라, 화가 나는 순간 바로 맞받아치는 공격입니다.","start":202.577,"end":207.579},{"n":47,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"거절에 예민한 학생일수록 남의 행동을 나쁜 뜻으로 읽는 경향이 강했습니다.","start":208.029,"end":212.63},{"n":48,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그리고 그런 학생일수록, 화가 나는 순간 바로 맞받아치는 공격도 많았습니다.","start":213.08,"end":217.931},{"n":49,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"연구자들은 해석이 거절 예민함과 공격 사이를 잇는 다리일 수 있다고 봤습니다.","start":218.381,"end":223.133},{"n":50,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"다만 한 번 한 설문이라, 무엇이 먼저인지는 알 수 없습니다.","start":223.583,"end":227.226},{"n":51,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"처음에 말씀드린 옷 이야기도 이렇게 볼 수 있습니다.","start":227.676,"end":230.767},{"n":52,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"\"그 옷 새로 샀어?\"라는 말을 '안 어울린다는 비난'으로 읽었을 수 있습니다.","start":231.217,"end":235.365},{"n":53,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"회사에서 상사가 \"이 부분 다시 볼까요?\" 하고 말하면, 일을 고치자는 뜻일 수 있습니다.","start":235.815,"end":240.968},{"n":54,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그런데 이 버릇이 강하면 '나를 무능하다고 보는구나'로 들립니다.","start":241.418,"end":245.264},{"n":55,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"그래서 고칠 점을 듣기도 전에 날카롭게 받아치기 쉽습니다.","start":245.714,"end":249.258},{"n":56,"part":"두 번째 이유, 남의 행동을 공격으로 읽음","text":"한마디로, 같은 말도 거절에 예민한 귀에는 공격으로 들리기 쉽습니다.","start":249.708,"end":254.106},{"n":57,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"세 번째 이유는, 내가 어떤 사람인지에 대한 생각이 흔들리고 있다는 것입니다.","start":255.106,"end":259.957},{"n":58,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"심리학에서는 이것을 자기 개념이 흐리다고 말합니다.","start":260.407,"end":263.649},{"n":59,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'나는 이런 사람이다'라는 생각이 분명하지 않은 상태입니다.","start":264.099,"end":267.643},{"n":60,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"자기 개념이 분명한 사람은 남의 말에 덜 흔들리는 편입니다.","start":268.093,"end":271.637},{"n":61,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'저 사람 말은 저 사람 생각이고, 나는 나'라고 넘길 수 있습니다.","start":272.087,"end":275.881},{"n":62,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그런데 이 생각이 흐리면, 남의 한마디가 나에 대한 판결처럼 들릴 수 있습니다.","start":276.331,"end":281.182},{"n":63,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그 한마디에 내가 무너질 것 같아, 더 세게 맞서기 쉽습니다.","start":281.632,"end":285.275},{"n":64,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"'나는 일을 잘하는 사람인가' 하는 생각이 날마다 바뀌는 사람이 있다고 해 보겠습니다.","start":285.725,"end":290.779},{"n":65,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"보고서 오타 하나를 지적받았을 뿐인데, 나를 통째로 부정당한 것처럼 느낍니다.","start":291.229,"end":296.231},{"n":66,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그래서 별일 아닌 말에도 날카롭게 맞서기 쉽습니다.","start":296.681,"end":299.772},{"n":67,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"앞의 한국 대학생 연구에서, 나에 대한 생각이 흐린 학생일수록 순간 공격이 많았습니다.","start":300.222,"end":305.677},{"n":68,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그런 학생일수록 남의 행동을 나쁜 뜻으로 읽는 경향도 강했습니다.","start":306.127,"end":310.124},{"n":69,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"한마디로, 내가 흔들릴수록 남의 말 한마디에 더 크게 맞서기 쉽습니다.","start":310.574,"end":314.972},{"n":70,"part":"세 번째 이유, 내가 누구인지 흔들림","text":"그렇다면 이 고리는 어떻게 끊을 수 있을까요?","start":315.422,"end":318.06},{"n":71,"part":"내가 이런 쪽이라면","text":"연구로 효과를 확인한 방법은 아니지만, 해 볼 만한 것이 세 가지 있습니다.","start":319.06,"end":323.609},{"n":72,"part":"내가 이런 쪽이라면","text":"첫 번째로, 애매한 말에 화가 나면 '다른 뜻일 수도 있다'를 하나만 떠올려 보세요.","start":324.059,"end":328.91},{"n":73,"part":"내가 이런 쪽이라면","text":"\"그 옷 새로 샀어?\"는 '예뻐서 물어봤다'일 수도 있습니다.","start":329.36,"end":332.451},{"n":74,"part":"내가 이런 쪽이라면","text":"다른 해석이 하나 있으면, 맞받아치기 전에 한 번 멈출 틈이 생길 수 있습니다.","start":332.901,"end":337.601},{"n":75,"part":"내가 이런 쪽이라면","text":"두 번째로, 화를 내기 전에 몸이 먼저 보내는 신호를 알아차리세요.","start":338.051,"end":342.147},{"n":76,"part":"내가 이런 쪽이라면","text":"얼굴이 달아오르거나, 주먹에 힘이 들어가거나, 숨이 빨라집니다.","start":342.597,"end":346.943},{"n":77,"part":"내가 이런 쪽이라면","text":"이 신호가 오면 바로 대답하지 말고, 물을 한 모금 마시고 숨을 고르세요.","start":347.393,"end":351.791},{"n":78,"part":"내가 이런 쪽이라면","text":"\"잠깐만, 이따 얘기하자\"처럼 틈을 버는 말도 좋습니다.","start":352.241,"end":355.582},{"n":79,"part":"내가 이런 쪽이라면","text":"세 번째로, 화 대신 그 밑에 있는 마음을 말로 해 보세요.","start":356.032,"end":359.373},{"n":80,"part":"내가 이런 쪽이라면","text":"\"왜 그렇게 말해!\" 대신 \"나 지금 좀 서운해\"라고 말하는 것입니다.","start":359.823,"end":363.367},{"n":81,"part":"내가 이런 쪽이라면","text":"따지는 말이 아니라, 내 마음만 말하는 것입니다.","start":363.817,"end":366.856},{"n":82,"part":"내가 이런 쪽이라면","text":"지적을 받으면 '이건 오타 하나 이야기'처럼, 일과 나를 나눠 말해 보는 것도 방법입니다.","start":367.306,"end":372.61},{"n":83,"part":"내가 이런 쪽이라면","text":"이런 일이 자주 반복되어 관계가 자꾸 망가진다면, 상담을 받아 보는 것도 좋습니다.","start":373.06,"end":378.213},{"n":84,"part":"내가 이런 쪽이라면","text":"학교나 회사 상담실이 없다면, 지역 정신건강복지센터에 먼저 전화해 볼 수 있습니다.","start":378.663,"end":383.967},{"n":85,"part":"내가 이런 쪽이라면","text":"센터 상담을 기다리는 동안 힘들 때 걸 수 있는 번호는 설명란에 적어 두겠습니다.","start":384.417,"end":389.169},{"n":86,"part":"가까운 사람이 이렇다면","text":"반대로 가까운 사람이 이런 쪽이라면, 알아 둘 것이 있습니다.","start":390.169,"end":393.963},{"n":87,"part":"가까운 사람이 이렇다면","text":"그 사람의 날카로운 말이 꼭 나 때문만은 아닐 수 있습니다.","start":394.413,"end":397.806},{"n":88,"part":"가까운 사람이 이렇다면","text":"지난 상처가 같이 반응하는 경우도 있습니다.","start":398.256,"end":400.894},{"n":89,"part":"가까운 사람이 이렇다면","text":"같은 말로 맞받아치면, '역시 나를 공격하는구나'로 들리기 쉽습니다.","start":401.344,"end":405.591},{"n":90,"part":"가까운 사람이 이렇다면","text":"내 말이 서운하게 들릴 만했는지 한 번만 돌아보되, 매번 내 탓으로 돌릴 필요는 없습니다.","start":406.041,"end":411.496},{"n":91,"part":"가까운 사람이 이렇다면","text":"그다음 내 뜻을 짧고 분명하게 다시 말해 주세요.","start":411.946,"end":414.735},{"n":92,"part":"가까운 사람이 이렇다면","text":"\"안 어울린다는 뜻이 아니라, 새 옷 같아서 물어본 거야.\"","start":415.185,"end":418.526},{"n":93,"part":"가까운 사람이 이렇다면","text":"다만 이유가 있다고 해서, 상처 주는 말이 괜찮다는 뜻은 아닙니다.","start":418.976,"end":423.072},{"n":94,"part":"가까운 사람이 이렇다면","text":"같은 일이 계속되어 내가 지친다면, \"그렇게 말하면 나도 힘들어\"라고 선을 그어도 됩니다.","start":423.522,"end":428.977},{"n":95,"part":"가까운 사람이 이렇다면","text":"상대를 이해하는 것과 모든 말을 참는 것은 다른 일입니다.","start":429.427,"end":432.82},{"n":96,"part":"가까운 사람이 이렇다면","text":"말이 위협이나 폭력으로 번진다면, 이해보다 내 안전이 먼저입니다.","start":433.27,"end":437.517},{"n":97,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":438.517,"end":441.405},{"n":98,"part":"정리","text":"상처받은 사람이 날카로워질 때, 까닭일 수 있는 것은 세 가지였습니다.","start":441.855,"end":446.253},{"n":99,"part":"정리","text":"첫째, 거절당할 낌새에 미리 날을 세웁니다.","start":446.703,"end":449.44},{"n":100,"part":"정리","text":"둘째, 남의 말과 행동을 나를 공격하려는 뜻으로 읽습니다.","start":449.89,"end":453.533},{"n":101,"part":"정리","text":"셋째, 내가 어떤 사람인지에 대한 생각이 흔들리고 있습니다.","start":453.983,"end":457.777},{"n":102,"part":"정리","text":"다만 연구에서 본 것은 함께 나타나는 약한 연결이라, 순서는 아직 모릅니다.","start":458.227,"end":462.927},{"n":103,"part":"정리","text":"애매한 말에 날카로운 말이 나오려 할 때, '다른 뜻일 수도 있다'를 떠올려 보세요.","start":463.377,"end":468.228},{"n":104,"part":"정리","text":"시청해주셔서 감사합니다.","start":468.678,"end":470.259}],"subs":[[0.3,4.146,"가볍게 한 말에 상대가 갑자기 날카롭게 받아친 적이 있으신가요?"],[4.596,8.942,"\"그 옷 새로 샀어?\" 하고 물었을 뿐인데,\n\"왜, 안 어울려?\" 하고 화를 냅니다."],[9.392,13.186,"그런데 거꾸로, 내가 그 날카로운 쪽이었던 적은 없으셨나요?"],[13.636,17.581,"한 강연 영상에, 이런 댓글이 9천 개가 넘는 공감을 받았습니다."],[18.031,23.085,"상처받았다는 이유로 우리가\n얼마나 날카로웠는지 돌아보게 된다는 말이었습니다."],[23.535,26.173,"상처받은 사람은 왜 오히려 날카로워질까요?"],[26.623,28.355,"결론부터 말씀
