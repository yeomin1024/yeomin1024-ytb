# 주식 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.0 — 2026-10-28 — 새로 (사용자 지시 2026-10-28 "시청자 페르소나 파일 생성하도록 해").
#   묶음(stage) = 생애 단계(투자하는 처지) · 처지(state) = 자기 투자 상황 · know = 용어 사전 · like/dislike = 칭찬·비판 댓글 갈래.
#   한국어 댓글만 (채널이 한국어 — 외국 댓글로 한국어 규칙을 만들지 않음). 정규식은 파이썬 re (대소문자 무시).
#   감사 2026-10-28 (audit 무작위 — Claude 가 읽음): 나이 11/12 · 처지 '배당 투자' 11/12 · 묶음 '3040 직장인' 8/12 (일반론 '직장인들은…'이 섞임).

[personas]
VERSION = "v1.0"
RECENT_DAYS = 180
LANGS = ["한국어"]
MIN_SHARE = 0.08
COVER = 0.80
MIN_PERSONAS = 2
MAX_PERSONAS = 6
MIN_N = 30
NEED_SELF = true
STOP = ["주식", "투자", "종목", "주가", "시장", "돈", "원", "만원", "억", "년", "월", "개월", "사람", "그러면", "그럼", "정말요"]

