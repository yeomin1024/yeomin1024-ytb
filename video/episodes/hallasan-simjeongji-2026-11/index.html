<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"hallasan-simjeongji-2026-11","topic":"crisis","duration":490.61,"audio":"../../../crisis/source/hallasan-simjeongji-2026-11/narration.mp3","thumb":null,"synced":"2026-11-26T10:41:13Z","tts":"2026-11-26T10:04:06","script_sha1":"6dd76e2a73f1a4f5","sent":[{"n":1,"part":"도입","text":"산에서 몸이 안 좋을 때, 일행에게 \"먼저 내려갈게\" 하고 말한 적 있으시죠?","start":0.3,"end":4.55},{"n":2,"part":"도입","text":"그런데 한라산 둘레길에서 그 한마디를 남긴 사람이, 신고 1시간 뒤 심정지로 발견됐습니다.","start":4.93,"end":11.028},{"n":3,"part":"도입","text":"몸이 안 좋을 때 혼자가 되는 게, 왜 그렇게 위험할 수 있을까요?","start":11.408,"end":15.407},{"n":4,"part":"도입","text":"그날 둘레길에서 있었던 일과, 등산 중 심정지가 일어나는 이유를 차례로 따라가 보겠습니다.","start":15.787,"end":21.127},{"n":5,"part":"도입","text":"그리고 다음 산행 전, 내 심장을 지키려면 무엇을 확인해야 하는지도 짚어 보겠습니다.","start":21.507,"end":26.674},{"n":6,"part":"한라산 둘레길, 그날의 산행","text":"2023년 3월 26일 일요일, 그날 한라산 둘레길에서 있었던 일입니다.","start":27.674,"end":33.018},{"n":7,"part":"한라산 둘레길, 그날의 산행","text":"제주에 사는 54세 김 씨는, 일행과 함께 둘레길 산행에 나섰습니다.","start":33.398,"end":37.807},{"n":8,"part":"한라산 둘레길, 그날의 산행","text":"한라산 둘레길은 정상으로 오르는 길이 아닙니다.","start":38.187,"end":41.066},{"n":9,"part":"한라산 둘레길, 그날의 산행","text":"해발 600에서 800미터 사이, 산 중턱 숲을 따라 걷는 길입니다.","start":41.446,"end":45.386},{"n":10,"part":"한라산 둘레길, 그날의 산행","text":"그래서 많은 사람이 가벼운 산책쯤으로 여깁니다.","start":45.766,"end":48.674},{"n":11,"part":"한라산 둘레길, 그날의 산행","text":"이 가벼운 산행 중에, 김 씨에게는 무슨 일이 있었던 걸까요?","start":49.054,"end":52.602},{"n":12,"part":"먼저 내려가겠다는 결정","text":"둘레길을 걷던 중, 김 씨는 몸 상태가 좋지 않다고 느꼈습니다.","start":53.602,"end":57.542},{"n":13,"part":"먼저 내려가겠다는 결정","text":"그래서 일행에게 먼저 내려가겠다는 결정을 알렸습니다.","start":57.922,"end":60.872},{"n":14,"part":"먼저 내려가겠다는 결정","text":"\"몸이 좋지 않아 먼저 내려가겠다.\"","start":61.252,"end":63.362},{"n":15,"part":"먼저 내려가겠다는 결정","text":"김 씨는 그렇게 말하고, 혼자 왔던 길을 돌아갔습니다.","start":63.742,"end":67.032},{"n":16,"part":"먼저 내려가겠다는 결정","text":"누구나 할 법한 결정입니다.","start":67.412,"end":69.032},{"n":17,"part":"먼저 내려가겠다는 결정","text":"일행의 산행을 망치고 싶지 않고, 내려가서 쉬면 나아질 거라 생각하니까요.","start":69.412,"end":73.641},{"n":18,"part":"먼저 내려가겠다는 결정","text":"혼자 내려간 김 씨는, 무사히 산 아래에 닿았을까요?","start":74.021,"end":77.358},{"n":19,"part":"실종 신고, 1시간 뒤 발견","text":"하지만 먼저 내려갔다던 김 씨는, 어디에서도 보이지 않았습니다.","start":78.358,"end":82.395},{"n":20,"part":"실종 신고, 1시간 뒤 발견","text":"일행은 오후 1시 48분쯤, 119에 실종 신고를 했습니다.","start":82.775,"end":86.915},{"n":21,"part":"실종 신고, 1시간 뒤 발견","text":"119 구조대가 주변을 수색했고, 1시간쯤 뒤에 쓰러진 김 씨를 발견했습니다.","start":87.295,"end":92.305},{"n":22,"part":"실종 신고, 1시간 뒤 발견","text":"발견됐을 때, 김 씨는 이미 심정지 상태였습니다.","start":92.685,"end":95.858},{"n":23,"part":"실종 신고, 1시간 뒤 발견","text":"구급대가 가까운 병원으로 옮겼지만, 김 씨는 오후 3시 28분쯤 숨졌습니다.","start":96.238,"end":101.588},{"n":24,"part":"실종 신고, 1시간 뒤 발견","text":"신고하고 1시간 40분 뒤였습니다.","start":101.968,"end":104.218},{"n":25,"part":"실종 신고, 1시간 뒤 발견","text":"김 씨가 언제 쓰러졌는지는 아무도 모릅니다.","start":104.598,"end":107.408},{"n":26,"part":"실종 신고, 1시간 뒤 발견","text":"쓰러지는 순간, 김 씨 옆에는 아무도 없었기 때문입니다.","start":107.788,"end":111.438},{"n":27,"part":"실종 신고, 1시간 뒤 발견","text":"심장이 왜 멈췄는지, 정확한 원인도 알려지지 않았습니다.","start":111.818,"end":115.658},{"n":28,"part":"실종 신고, 1시간 뒤 발견","text":"정상 코스도 아닌 둘레길에서, 심장은 왜 멈출 수 있을까요?","start":116.038,"end":119.868},{"n":29,"part":"둘레길에서도 심장이 멈추는 이유","text":"김 씨가 걷던 둘레길은, 정상으로 가는 길보다 오르막이 훨씬 적습니다.","start":120.868,"end":125.408},{"n":30,"part":"둘레길에서도 심장이 멈추는 이유","text":"그런데 이런 둘레길에서도 심장이 멈추는 이유가 있습니다.","start":125.788,"end":129.067},{"n":31,"part":"둘레길에서도 심장이 멈추는 이유","text":"나이가 들수록, 심장에 피를 보내는 혈관은 조용히 좁아질 수 있습니다.","start":129.447,"end":133.645},{"n":32,"part":"둘레길에서도 심장이 멈추는 이유","text":"아무 증상이 없어서, 겉으로는 건강해 보이는 사람도 많습니다.","start":134.025,"end":137.972},{"n":33,"part":"둘레길에서도 심장이 멈추는 이유","text":"고혈압과 당뇨, 높은 콜레스테롤, 담배는 이 혈관을 더 좁게 만듭니다.","start":138.352,"end":143.371},{"n":34,"part":"둘레길에서도 심장이 멈추는 이유","text":"이런 심장에는 완만한 숲길을 오래 걷는 것도 부담이 됩니다.","start":143.751,"end":147.556},{"n":35,"part":"둘레길에서도 심장이 멈추는 이유","text":"산 중턱의 찬 공기는 혈관을 더 좁게 만듭니다.","start":147.936,"end":150.942},{"n":36,"part":"둘레길에서도 심장이 멈추는 이유","text":"땀을 흘려 몸에서 물이 빠지면, 피는 더 끈끈해집니다.","start":151.322,"end":154.832},{"n":37,"part":"둘레길에서도 심장이 멈추는 이유","text":"그렇다면 김 씨가 느낀 몸 상태가 좋지 않다는 느낌은, 무엇이었을 수 있을까요?","start":155.212,"end":160.278},{"n":38,"part":"심정지 전 몸이 보내는 신호","text":"심정지가 오기 전, 몸은 신호를 보내기도 합니다.","start":161.278,"end":164.346},{"n":39,"part":"심정지 전 몸이 보내는 신호","text":"가슴이 조이거나 답답해지고, 명치가 체한 것처럼 꽉 막힙니다.","start":164.726,"end":168.636},{"n":40,"part":"심정지 전 몸이 보내는 신호","text":"식은땀이 나거나, 숨이 평소보다 심하게 차기도 합니다.","start":169.016,"end":172.624},{"n":41,"part":"심정지 전 몸이 보내는 신호","text":"팔이나 턱, 등까지 아픈 경우도 있습니다.","start":173.004,"end":175.687},{"n":42,"part":"심정지 전 몸이 보내는 신호","text":"문제는 이 신호를 조금 쉬면 괜찮아질 거라고 넘기기 쉽다는 것입니다.","start":176.067,"end":180.184},{"n":43,"part":"심정지 전 몸이 보내는 신호","text":"2016년 미국 오리건주의 연구팀은, 갑자기 심정지가 온 사람들을 살펴봤습니다.","start":180.564,"end":185.964},{"n":44,"part":"심정지 전 몸이 보내는 신호","text":"35세에서 65세 환자의 절반 정도는, 그 전 4주 안에 신호가 있었습니다.","start":186.344,"end":191.532},{"n":45,"part":"심정지 전 몸이 보내는 신호","text":"가장 많은 신호는 가슴 통증과 숨참이었습니다.","start":191.912,"end":195.043},{"n":46,"part":"심정지 전 몸이 보내는 신호","text":"하지만 신호를 느끼고 구급차를 먼저 부른 사람은, 다섯 명 중 한 명도 안 됐습니다.","start":195.423,"end":200.456},{"n":47,"part":"심정지 전 몸이 보내는 신호","text":"김 씨가 느낀 것이 이런 신호였는지는 알 수 없습니다.","start":200.836,"end":204.06},{"n":48,"part":"심정지 전 몸이 보내는 신호","text":"하지만 이런 신호가 왔을 때, 혼자 먼저 내려가는 것은 왜 위험할까요?","start":204.44,"end":208.643},{"n":49,"part":"혼자 먼저 내려가면 위험한 이유","text":"혼자 먼저 내려가면 위험한 이유는 두 가지입니다.","start":209.643,"end":212.223},{"n":50,"part":"혼자 먼저 내려가면 위험한 이유","text":"첫 번째는, 신호가 와도 멈추지 않고 계속 걷게 된다는 것입니다.","start":212.603,"end":216.773},{"n":51,"part":"혼자 먼저 내려가면 위험한 이유","text":"걷는 동안 심장은 쉬지 못합니다.","start":217.153,"end":219.013},{"n":52,"part":"혼자 먼저 내려가면 위험한 이유","text":"두 번째는, 혼자가 된다는 것입니다.","start":219.393,"end":221.651},{"n":53,"part":"혼자 먼저 내려가면 위험한 이유","text":"심정지가 오면, 쓰러진 사람은 스스로 119를 부를 수 없습니다.","start":222.031,"end":225.951},{"n":54,"part":"혼자 먼저 내려가면 위험한 이유","text":"심장이 멈추면 피가 뇌로 가지 못해, 곧바로 의식을 잃습니다.","start":226.331,"end":230.327},{"n":55,"part":"혼자 먼저 내려가면 위험한 이유","text":"그리고 4분이 지나면, 뇌가 손상되기 시작한다고 알려져 있습니다.","start":230.707,"end":234.537},{"n":56,"part":"혼자 먼저 내려가면 위험한 이유","text":"그래서 옆 사람이 바로 가슴을 눌러 주면, 살릴 기회가 커집니다.","start":234.917,"end":239.014},{"n":57,"part":"혼자 먼저 내려가면 위험한 이유","text":"질병관리청 2024년 조사에서, 옆 사람이 가슴을 눌러 준 환자는 14.4%가 살았습니다.","start":239.394,"end":246.074},{"n":58,"part":"혼자 먼저 내려가면 위험한 이유","text":"그러지 못한 환자는 6.1%로, 두 배 넘게 차이가 났습니다.","start":246.454,"end":250.514},{"n":59,"part":"혼자 먼저 내려가면 위험한 이유","text":"넓은 숲이라, 신고 뒤 김 씨를 찾아내는 데만 1시간쯤 걸렸습니다.","start":250.894,"end":255.214},{"n":60,"part":"혼자 먼저 내려가면 위험한 이유","text":"혼자 걷던 그 숲길에서는, 그 기회를 만들어 줄 사람이 없었습니다.","start":255.594,"end":259.683},{"n":61,"part":"혼자 먼저 내려가면 위험한 이유","text":"그런데 이런 등산 중 심정지가, 김 씨에게만 일어난 일이었을까요?","start":260.063,"end":264.221},{"n":62,"part":"숫자로 본 등산 중 심정지","text":"김 씨뿐만이 아닙니다.","start":265.221,"end":266.416},{"n":63,"part":"숫자로 본 등산 중 심정지","text":"숫자로 보면, 산에서 숨진 원인 가운데 등산 중 심정지가 얼마나 큰지 보입니다.","start":266.796,"end":271.968},{"n":64,"part":"숫자로 본 등산 중 심정지","text":"국립공원공단은 지리산과 설악산, 북한산 같은 국립공원의 사망 사고를 살펴봤습니다.","start":272.348,"end":277.987},{"n":65,"part":"숫자로 본 등산 중 심정지","text":"2014년부터 10년 동안 숨진 사람은 167명이었습니다.","start":278.367,"end":282.409},{"n":66,"part":"숫자로 본 등산 중 심정지","text":"그 가운데 84명은, 심장이 갑자기 멈추는 심장 돌연사였습니다.","start":282.789,"end":287.299},{"n":67,"part":"숫자로 본 등산 중 심정지","text":"떨어져서 숨진 54명보다 30명이 더 많습니다.","start":287.679,"end":290.828},{"n":68,"part":"숫자로 본 등산 중 심정지","text":"국립공원에서 숨진 사람의 절반은, 낙사가 아닌 등산 중 심정지 때문이었습니다.","start":291.208,"end":296.314},{"n":69,"part":"숫자로 본 등산 중 심정지","text":"한라산은 제주도가 따로 관리해서, 김 씨의 사고도 이 숫자에 들어 있지 않습니다.","start":296.694,"end":301.393},{"n":70,"part":"숫자로 본 등산 중 심정지","text":"그렇다면 이 10년이 지난 뒤에는, 등산 중 심정지가 줄었을까요?","start":301.773,"end":305.938},{"n":71,"part":"반복되는 등산 중 심정지","text":"등산 중 심정지는 그 뒤에도 반복됐습니다.","start":306.938,"end":309.618},{"n":72,"part":"반복되는 등산 중 심정지","text":"2025년 3월, 한라산 성판악 코스를 오르던 60대 관광객이 쓰러졌습니다.","start":309.998,"end":315.278},{"n":73,"part":"반복되는 등산 중 심정지","text":"입구에서 5킬로미터쯤 오른 곳에서 심정지가 왔고, 심폐소생술을 받았지만 숨졌습니다.","start":315.658,"end":321.357},{"n":74,"part":"반복되는 등산 중 심정지","text":"2026년 8월, 폭염경보가 내려진 봉화 청량산에서도 50대 등산객이 쓰러졌습니다.","start":321.737,"end":327.279},{"n":75,"part":"반복되는 등산 중 심정지","text":"함께 간 지인이 발견했을 때, 이미 숨과 맥박이 없었습니다.","start":327.659,"end":331.475},{"n":76,"part":"반복되는 등산 중 심정지","text":"같은 해 10월, 한라산 성판악에서도 하산하던 50대 관광객이 심정지로 숨졌습니다.","start":331.855,"end":337.467},{"n":77,"part":"반복되는 등산 중 심정지","text":"오르막에서도, 내리막에서도, 오르막이 적은 둘레길에서도 일어났습니다.","start":337.847,"end":342.757},{"n":78,"part":"반복되는 등산 중 심정지","text":"산에서는 구조대가 닿기까지 오래 걸려, 살리기 어려운 경우가 많습니다.","start":343.137,"end":347.458},{"n":79,"part":"반복되는 등산 중 심정지","text":"그래서 곁에 누군가 있는 것도, 산에 가기 전 내 심장을 아는 것도 중요합니다.","start":347.838,"end":352.118},{"n":80,"part":"반복되는 등산 중 심정지","text":"그렇다면 등산 중 심정지를 막으려면, 산에 가기 전에 무엇을 점검해야 할까요?","start":352.498,"end":357.5},{"n":81,"part":"산에 가기 전 점검 네 가지","text":"산에 가기 전 점검할 것은 네 가지입니다.","start":358.5,"end":360.797},{"n":82,"part":"산에 가기 전 점검 네 가지","text":"첫 번째는 내 심장입니다.","start":361.177,"end":362.857},{"n":83,"part":"산에 가기 전 점검 네 가지","text":"검진에서 혈압이나 혈당, 콜레스테롤이 높다는 말을 들었나요?","start":363.237,"end":367.088},{"n":84,"part":"산에 가기 전 점검 네 가지","text":"담배를 피우거나, 가족 중에 심장병을 앓은 사람이 있나요?","start":367.468,"end":371.174},{"n":85,"part":"산에 가기 전 점검 네 가지","text":"오르막에서 예전보다 가슴이 답답하거나 숨이 쉽게 차나요?","start":371.554,"end":375.105},{"n":86,"part":"산에 가기 전 점검 네 가지","text":"하나라도 그렇다면, 산에 가기 전에 병원에서 심장 검사가 필요한지 물어보세요.","start":375.485,"end":380.48},{"n":87,"part":"산에 가기 전 점검 네 가지","text":"두 번째는 그날의 몸 상태입니다.","start":380.86,"end":382.738},{"n":88,"part":"산에 가기 전 점검 네 가지","text":"전날 술을 마셨거나 잠을 제대로 못 잤다면, 그날 산행은 미룹니다.","start":383.118,"end":387.238},{"n":89,"part":"산에 가기 전 점검 네 가지","text":"산행 중에도 술은 마시지 않습니다.","start":387.618,"end":389.558},{"n":90,"part":"산에 가기 전 점검 네 가지","text":"세 번째는 코스와 날씨입니다.","start":389.938,"end":391.896},{"n":91,"part":"산에 가기 전 점검 네 가지","text":"한파나 폭염, 강풍 특보가 내려진 날에는 산행을 미룹니다.","start":392.276,"end":395.956},{"n":92,"part":"산에 가기 전 점검 네 가지","text":"둘레길처럼 오르막이 적은 길이어도, 같은 점검을 똑같이 합니다.","start":396.336,"end":400.149},{"n":93,"part":"산에 가기 전 점검 네 가지","text":"네 번째는 함께 갈 사람입니다.","start":400.529,"end":402.362},{"n":94,"part":"산에 가기 전 점검 네 가지","text":"되도록 함께 가고, 일행에게 내 지병과 먹는 약을 미리 알려 둡니다.","start":402.742,"end":407.005},{"n":95,"part":"산에 가기 전 점검 네 가지","text":"혼자 가야 한다면, 가족에게 코스와 내려올 시각을 알리고 사람이 다니는 길로 걷습니다.","start":407.385,"end":412.789},{"n":96,"part":"산에 가기 전 점검 네 가지","text":"그리고 산에서 몸이 좋지 않으면, 그 자리에 앉아 쉬면서 일행에게 알립니다.","start":413.169,"end":417.879},{"n":97,"part":"산에 가기 전 점검 네 가지","text":"앞에서 본 신호가 하나라도 있다면, 더 걷지 말고 119에 신고합니다.","start":418.259,"end":422.549},{"n":98,"part":"산에 가기 전 점검 네 가지","text":"가슴이 조이거나 답답하고, 명치가 막히거나, 그 통증이 팔이나 턱, 등으로 번질 때입니다.","start":422.929,"end":428.762},{"n":99,"part":"산에 가기 전 점검 네 가지","text":"앉아 쉬어도 숨이 가라앉지 않거나, 식은땀이 날 때도 마찬가지입니다.","start":429.142,"end":433.448},{"n":100,"part":"산에 가기 전 점검 네 가지","text":"이런 신호 없이 힘들기만 하다면, 일행과 함께 천천히 내려옵니다.","start":433.828,"end":438.062},{"n":101,"part":"산에 가기 전 점검 네 가지","text":"신고할 때 가까운 등산로 위치 표지판의 번호를 불러 주면, 구조대가 빨리 찾습니다.","start":438.442,"end":443.603},{"n":102,"part":"산에 가기 전 점검 네 가지","text":"무엇보다, 혼자 먼저 내려가지 않습니다.","start":443.983,"end":446.663},{"n":103,"part":"산에 가기 전 점검 네 가지","text":"산에 가기 전, 누가 아프면 적어도 한 사람은 곁에 남기로 미리 약속해 두세요.","start":447.043,"end":451.963},{"n":104,"part":"산에 가기 전 점검 네 가지","text":"옆 사람이 쓰러졌다면, 119에 신고하고 안내에 따라 가슴 한가운데를 세게 누릅니다.","start":452.343,"end":457.343},{"n":105,"part":"산에 가기 전 점검 네 가지","text":"자동심장충격기가 가까이 있다면, 다른 사람이 가져와 안내에 따라 씁니다.","start":457.723,"end":462.298},{"n":106,"part":"산에 가기 전 점검 네 가지","text":"그날 한라산 둘레길이 우리에게 남긴 것은, 무엇일까요?","start":462.678,"end":466.349},{"n":107,"part":"마무리","text":"몸이 좋지 않아 먼저 내려가겠다는 말, 누구나 한 번쯤 해 봤을 겁니다.","start":467.349,"end":471.676},{"n":108,"part":"마무리","text":"김 씨도, 일행도 잘못한 것이 아닙니다.","start":472.056,"end":474.557},{"n":109,"part":"마무리","text":"하지만 몸이 신호를 보낼 때는, 누구나 하는 그 사소한 결정도 위험을 키울 수 있습니다.","start":474.937,"end":480.077},{"n":110,"part":"마무리","text":"산에 가기 전 심장을 점검하고, 몸이 이상하면 멈추고, 알리고, 혼자가 되지 마세요.","start":480.457,"end":485.797},{"n":111,"part":"마무리","text":"시청해주셔서 감사합니다.","start":486.177,"end":487.707}],"subs":[[0.2,4.93,"산에서 몸이 안 좋을 때,\n일행에게 \"먼저 내려갈게\" 하고 말한 적 있으시죠?"],[4.93,11.408,"그런데 한라산 둘레길에서 그 한마디를 남긴 사람이,\n신고 1시간 뒤 심정지로 발견됐습니다."],[11.408,15.787,"몸이 안 좋을 때 혼자가 되는 게, 왜 그렇게 위험할 수 있을까요?"],[15.787,21.507,"그날 둘레길에서 있었던 일과,\n등산 중 심정지가 일어나는 이유를 차례로 따라가 보겠습니다."],[21.507,27.674,"그리고 다음 산행 전, 내 심장을 지키려면\n무엇을 확인해야 하는지도 짚어 보겠습니다."],[27.674,33.398,"2023년 3월 26일 일요일, 그날 한라산 둘레길에서 있었던 일입니다."],[33.398,38.187,"제주에 사는 54세 김 씨는, 일행과 함께 둘레길 산행에 나섰습니다."],[38.187,41.446,"한라산 둘레길은 정상으로 오르는 길이 아닙니다."],[41.446,45.766,"해발 600에서 800미터 사이, 산 중턱 숲을 따라 걷는 길입니다."],[45.766,49.054,"그래서 많은 사람이 가벼운 산책쯤으로 여깁니다."],[49.054,53.602,"이 가벼운 산행 중에, 김 씨에게는 무슨 일이 있었던 걸까요?"],[53.602,57.922,"둘레길을 걷던 중, 김 씨는 몸 상태가 좋지 않다고 느꼈습니다."],[57.922,61.252,"그래서 일행에게 먼저 내려가겠다는 결정을 알렸습니다."],[61.252,63.742,"\"몸이 좋지 않아 먼저 내려가겠다.\""],[63.742,67.412,"김 씨는 그렇게 말하고, 혼자 왔던 길을 돌아갔습니다."],[67.412,69.412,"누구나 할 법한 결정입니다."],[69.412,74.021,"일행의 산행을 망치고 싶지 않고,\n내려가서 쉬면 나아질 거라 생각하니까요."],[74.021,78.358,"혼자 내려간 김 씨는, 무사히 산 아래에 닿았을까요?"],[78.358,82.775,"하지만 먼저 내려갔다던 김 씨는, 어디에서도 보이지 않았습니다."],[82.775,87.295,"일행은 오후 1시 48분쯤, 119에 실종 신고를 했습니다."],[87.295,92.685,"119 구조대가 주변을 수색했고,\n1시간쯤 뒤에 쓰러진 김 씨를 발견했습니다."],[92.685,96.238,"발견됐을 때, 김 씨는 이미 심정지 상태였습니다."],[96.238,101.968,"구급대가 가까운 병원으로 옮겼지만,\n김 씨는 오후 3시 28분쯤 숨졌습니다."],[101.968,104.598,"신고하고 1시간 40분 뒤였습니다."],[104.598,107.788,"김 씨가 언제 쓰러졌는지는 아무도 모릅니다."],[107.788,111.818,"쓰러지는 순간, 김 씨 옆에는 아무도 없었기 때문입니다."],[111.818,116.038,"심장이 왜 멈췄는지, 정확한 원인도 알려지지 않았습니다."],[116.038,120.868,"정상 코스도 아닌 둘레길에서, 심장은 왜 멈출 수 있을까요?"],[120.868,125.788,"김 씨가 걷던 둘레길은, 정상으로 가는 길보다 오르막이 훨씬 적습니다."],[125.788,129.447,"그런데 이런 둘레길에서도 심장이 멈추는 이유가 있습니다."],[129.447,134.025,"나이가 들수록, 심장에 피를 보내는 혈관은 조용히 좁아질 수 있습니다."],[134.025,138.352,"아무 증상이 없어서, 겉으로는 건강해 보이는 사람도 많습니다."],[138.352,143.751,"고혈압과 당뇨, 높은 콜레스테롤, 담배는 이 혈관을 더 좁게 만듭니다."],[143.751,147.936,"이런 심장에는 완만한 숲길을 오래 걷는 것도 부담이 됩니다."],[147.936,151.322,"산 중턱의 찬 공기는 혈관을 더 좁게 만듭니다."],[151.322,155.212,"땀을 흘려 몸에서 물이 빠지면, 피는 더 끈끈해집니다."],[155.212,161.278,"그렇다면 김 씨가 느낀 몸 상태가 좋지 않다는 느낌은,\n무엇이었을 수 있을까요?"],[161.278,164.726,"심정지가 오기 전, 몸은 신호를 보내기도 합니다."],[164.726,169.016,"가슴이 조이거나 답답해지고, 명치가 체한 것처럼 꽉 막힙니다."],[169.016,173.004,"식은땀이 나거나, 숨이 평소보다 심하게 차기도 합니다."],[173.004,176.067,"팔이나 턱, 등까지 아픈 경우도 있습니다."],[176.067,180.564,"문제는 이 신호를 조금 쉬면 괜찮아질 거라고 넘기기 쉽다는 것입니다."],[180.564,186.344,"2016년 미국 오리건주의 연구팀은,\n갑자기 심정지가 온 사람들을 살펴봤습니다."],[186.344,191.912,"35세에서 65세 환자의 절반 정도는,\n그 전 4주 안에 신호가 있었습니다."],[191.912,195.423,"가장 많은 신호는 가슴 통증과 숨참이었습니다."],[195.423,200.836,"하지만 신호를 느끼고 구급차를 먼저 부른 사람은,\n다섯 명 중 한 명도 안 됐습니다."],[200.836,204.44,"김 씨가 느낀 것이 이런 신호였는지는 알 수 없습니다."],[204.44,209.643,"하지만 이런 신호가 왔을 때, 혼자 먼저 내려가는 것은 왜 위험할까요?"],[209.643,212.603,"혼자 먼저 내려가면 위험한 이유는 두 가지입니다."],[212.603,217.153,"첫 번째는, 신호가 와도 멈추지 않고 계속 걷게 된다는 것입니다."],[217.153,219.393,"걷는 동안 심장은 쉬지 못합니다."],[219.393,222.031,"두 번째는, 혼자가 된다는 것입니다."],[222.031,226.331,"심정지가 오면, 쓰러진 사람은 스스로 119를 부를 수 없습니다."],[226.331,230.707,"심장이 멈추면 피가 뇌로 가지 못해, 곧바로 의식을 잃습니다."],[230.707,234.917,"그리고 4분이 지나면, 뇌가 손상되기 시작한다고 알려져 있습니다."],[234.917,239.394,"그래서 옆 사람이 바로 가슴을 눌러 주면, 살릴 기회가 커집니다."],[239.394,246.454,"질병관리청 2024년 조사에서,\n옆 사람이 가슴을 눌러 준 환자는 14.4%가 살았습니다."],[246.454,250.894,"그러지 못한 환자는 6.1%로, 두 배 넘게 차이가 났습니다."],[250.894,255.594,"넓은 숲이라, 신고 뒤 김 씨를 찾아내는 데만 1시간쯤 걸렸습니다."],[255.594,260.063,"혼자 걷던 그 숲길에서는, 그 기회를 만들어 줄 사람이 없었습니다."],[260.063,265.221,"그런데 이런 등산 중 심정지가, 김 씨에게만 일어난 일이었을까요?"],[265.221,266.796,"김 씨뿐만이 아닙니다."],[266.796,272.348,"숫자로 보면,\n산에서 숨진 원인 가운데 등산 중 심정지가 얼마나 큰지 보입니다."],[272.348,278.367,"국립공원공단은 지리산과 설악산,\n북한산 같은 국립공원의 사망 사고를 살펴봤습니다."],[278.367,282.789,"2014년부터 10년 동안 숨진 사람은 167명이었습니다."],[282.789,287.679,"그 가운데 84명은, 심장이 갑자기 멈추는 심장 돌연사였습니다."],[287.679,291.208,"떨어져서 숨진 54명보다 30명이 더 많습니다."],[291.208,296.694,"국립공원에서 숨진 사람의 절반은,\n낙사가 아닌 등산 중 심정지 때문이었습니다."],[296.694,301.773,"한라산은 제주도가 따로 관리해서,\n김 씨의 사고도 이 숫자에 들어 있지 않습니다."],[301.773,306.938,"그렇다면 이 10년이 지난 뒤에는, 등산 중 심정지가 줄었을까요?"],[306.938,309.998,"등산 중 심정지는 그 뒤에도 반복됐습니다."],[309.998,315.658,"2025년 3월,\n한라산 성판악 코스를 오르던 60대 관광객이 쓰러졌습니다."],[315.658,321.737,"입구에서 5킬로미터쯤 오른 곳에서 심정지가 왔고,\n심폐소생술을 받았지만 숨졌습니다."],[321.737,327.659,"2026년 8월,\n폭염경보가 내려진 봉화 청량산에서도 50대 등산객이 쓰러졌습니다."],[327.659,331.855,"함께 간 지인이 발견했을 때, 이미 숨과 맥박이 없었습니다."],[331.855,337.847,"같은 해 10월,\n한라산 성판악에서도 하산하던 50대 관광객이 심정지로 숨졌습니다."],[337.847,343.137,"오르막에서도, 내리막에서도,\n오르막이 적은 둘레길에서도 일어났습니다."],[343.137,347.838,"산에서는 구조대가 닿기까지 오래 걸려,\n살리기 어려운 경우가 많습니다."],[347.838,352.498,"그래서 곁에 누군가 있는 것도,\n산에 가기 전 내 심장을 아는 것도 중요합니다."],[352.498,358.5,"그렇다면 등산 중 심정지를 막으려면,\n산에 가기 전에 무엇을 점검해야 할까요?"],[358.5,361.177,"산에 가기 전 점검할 것은 네 가지입니다."],[361.177,363.237,"첫 번째는 내 심장입니다."],[363.237,367.468,"검진에서 혈압이나 혈당, 콜레스테롤이 높다는 말을 들었나요?"],[367.468,371.554,"담배를 피우거나, 가족 중에 심장병을 앓은 사람이 있나요?"],[371.554,375.485,"오르막에서 예전보다 가슴이 답답하거나 숨이 쉽게 차나요?"],[375.485,380.86,"하나라도 그렇다면,\n산에 가기 전에 병원에서 심장 검사가 필요한지 물어보세요."],[380.86,383.118,"두 번째는 그날의 몸 상태입니다."],[383.118,387.618,"전날 술을 마셨거나 잠을 제대로 못 잤다면, 그날 산행은 미룹니다."],[387.618,389.938,"산행 중에도 술은 마시지 않습니다."],[389.938,392.276,"세 번째는 코스와 날씨입니다."],[392.276,396.336,"한파나 폭염, 강풍 특보가 내려진 날에는 산행을 미룹니다."],[396.336,400.529,"둘레길처럼 오르막이 적은 길이어도, 같은 점검을 똑같이 합니다."],[400.529,402.742,"네 번째는 함께 갈 사람입니다."],[402.742,407.385,"되도록 함께 가고, 일행에게 내 지병과 먹는 약을 미리 알려 둡니다."],[407.385,413.169,"혼자 가야 한다면,\n가족에게 코스와 내려올 시각을 알리고 사람이 다니는 길로 걷습니다."],[413.169,418.259,"그리고 산에서 몸이 좋지 않으면,\n그 자리에 앉아 쉬면서 일행에게 알립니다."],[418.259,422.929,"앞에서 본 신호가 하나라도 있다면, 더 걷지 말고 119에 신고합니다."],[422.929,429.142,"가슴이 조이거나 답답하고, 명치가 막히거나,\n그 통증이 팔이나 턱, 등으로 번질 때입니다."],[429.142,433.828,"앉아 쉬어도 숨이 가라앉지 않거나, 식은땀이 날 때도 마찬가지입니다."],[433.828,438.442,"이런 신호 없이 힘들기만 하다면, 일행과 함께 천천히 내려옵니다."],[438.442,443.983,"신고할 때 가까운 등산로 위치 표지판의 번호를 불러 주면,\n구조대가 빨리 찾습니다."],[443.983,447.043,"무엇보다, 혼자 먼저 내려가지 않습니다."],[447.043,452.343,"산에 가기 전,\n누가 아프면 적어도 한 사람은 곁에 남기로 미리 약속해 두세요."],[452.343,457.723,"옆 사람이 쓰러졌다면,\n119에 신고하고 안내에 따라 가슴 한가운데를 세게 누릅니다."],[457.723,462.678,"자동심장충격기가 가까이 있다면,\n다른 사람이 가져와 안내에 따라 씁니다."],[462.678,467.349,"그날 한라산 둘레길이 우리에게 남긴 것은, 무엇일까요?"],[467.349,472.056,"몸이 좋지 않아 먼저 내려가겠다는 말, 누구나 한 번쯤 해 봤을 겁니다."],[472.056,474.937,"김 씨도, 일행도 잘못한 것이 아닙니다."],[474.937,480.457,"하지만 몸이 신호를 보낼 때는,\n누구나 하는 그 사소한 결정도 위험을 키울 수 있습니다."],[480.457,486.177,"산에 가기 전 심장을 점검하고,\n몸이 이상하면 멈추고, 알리고, 혼자가 되지 마세요."],[486.177,488.107,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
(function () {
"use strict";
K.init(window.EP, { chip: false });
const { S, E, W } = K;
const tl = K.tl;
const IMG = "../../../crisis/source/hallasan-simjeongji-2026-11/images/";
const B = n => Math.max(0, S(n) - 0.3);          // 문장 n 바로 앞 (장면 바뀜)
const END = K.D;
const SP = window.SPRITES || { sheets: {}, med: {}, plates: [] };
const has = n => n.startsWith("PLT-") ? (SP.plates || []).includes(n) : n.startsWith("MED-S") ? !!(SP.med || {})[n] : !!(SP.sheets || {})[n];
const HAS = (...ns) => ns.every(has);

/* ───── 배치 표 [x, y, 가로, 세로] — 자막 띠(y 870 아래)는 비움 ───── */
const LAY = window.LAYOUT = {
  BG: [0, 0, 1920, 1080], SHADE: [0, 0, 1920, 1080], VIG: [0, 0, 1920, 1080], ACT: [0, 0, 1920, 1080],
  MARK: [1580, 36, 300, 72],
  CH: [70, 36, 1180, 104],
  TIME: [70, 166, 1100, 100],
  LOWER: [70, 676, 1240, 170],
  QUOTE: [260, 590, 1400, 230],
  CARD: [290, 170, 1340, 660],
  SIDE: [70, 166, 1060, 640],
  CASE: [70, 166, 1060, 520],
  TLINE: [120, 240, 1680, 440],
  CLOCK: [130, 190, 560, 560],
  BIG: [110, 260, 1700, 400],
  CHIPS: [110, 650, 1700, 200],
  DOTS: [580, 40, 640, 840],
  LLIST: [50, 170, 520, 620],
  WORDS: [110, 330, 1700, 220],
};
const FULL = ["BG", "SHADE", "VIG", "ACT"];
window.LAYOUT_ALLOW = [];
for (const f of FULL) for (const k of Object.keys(LAY)) if (k !== f) window.LAYOUT_ALLOW.push([f, k]);

const box = (slot, cls, html, extra) => {
  const [x, y, w, h] = LAY[slot];
  return `<div class="${cls}" data-slot="${slot}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra || ""}">${html || ""}</div>`;
};
const show = (n, at, dur) => tl.fromTo(n, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: dur || 0.45, ease: "power2.out" }, at);
const hide = (n, at) => tl.to(n, { opacity: 0, duration: 0.35, ease: "none" }, at);
const on = (sc, slot, cls, html, a, b, extra) => {
  const n = K.el(box(slot, cls, html, extra), sc);
  gsap.set(n, { opacity: 0 });
  show(n, a);
  if (b != null) hide(n, b - 0.35);
  return n;
};
const reveal = (nodes, at) => { tl.to(nodes, { opacity: 1, duration: 0.35 }, at); };

/* ───── 사진 장면: 켄 번스 ───── */
const KB = {
  in: [1.0, 1.09, 0, 0, 0, 0], out: [1.1, 1.0, 0, 0, 0, 0],
  left: [1.08, 1.08, 2.2, -2.2, 0, 0], right: [1.08, 1.08, -2.2, 2.2, 0, 0],
  up: [1.08, 1.1, 0, 0, 1.6, -1.6], still: [1.02, 1.04, 0, 0, 0, 0], none: [1, 1, 0, 0, 0, 0],
};
function photo(a, b, file, kb, o) {
  o = o || {};
  const sc = K.scene(a, b, o.keep ? { keep: true } : undefined);
  const src = file.startsWith("sprites/") ? file : IMG + file;
  const bx = K.el(box("BG", "bgbox", `<img src="${src}" alt="">`), sc);

/* ───── 실루엣 배우 — segs: [{t0, t1, sheet, frames:[칸 번호…], fps, x, v(px/초), y 또는 yAt(x), h(키 px), flip}] ─────
   한 요소가 시각에 따라 시트·칸·자리를 바꿈 (걷기 = 칸을 차례로 + 자리 이동). 키 h 는 프레임 안 그림 높이. */
function actor(sc, segs) {

  const t0 = segs[0].t0, t1 = segs[segs.length - 1].t1;
  const upd = t => {
    let g = segs[0];
    for (const s of segs) if (t >= s.t0) g = s;
    const m = SP.sheets[g.sheet];
    const k = g.h / (m.fh - 24);
    const w = m.fw * k, h = m.fh * k;
    const dt = Math.max(0, Math.min(t, g.t1) - g.t0);
    const fr = g.frames[g.fps ? Math.floor(dt * g.fps) % g.frames.length : 0];
    const x = Math.max(w / 2, Math.min(1920 - w / 2, g.x + (g.v || 0) * dt));
    const y = g.yAt ? g.yAt(x) : g.y;
    n.style.left = `${(x - w / 2).toFixed(1)}px`;
    n.style.top = `${(y - m.feet * k).toFixed(1)}px`;
    n.style.width = `${w.toFixed(1)}px`;
    n.style.height = `${h.toFixed(1)}px`;
    n.style.backgroundImage = `url(${m.file})`;
    n.style.backgroundSize = `${(m.n * w).toFixed(1)}px ${h.toFixed(1)}px`;
    n.style.backgroundPosition = `${(-(fr - 1) * w).toFixed(1)}px 0px`;
    n.style.transform = g.flip ? "scaleX(-1)" : "none";

  upd(t0);
  const pr = { t: t0 };
  tl.fromTo(pr, { t: t0 }, { t: t1, duration: Math.max(0.05, t1 - t0), ease: "none", onUpdate: () => upd(pr.t) }, t0);

}
