# 심리 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.1 — 2026-11-11 — 첫 분석 뒤 감사(audit, Claude 가 무작위 댓글을 읽음): '틀어 두고 듣는 사람'이 설거지·출퇴근·운전 낱말만으로 걸려 14개 중 1개만 맞음 → 듣는 말(듣·들으며·틀어 두고)이 함께 있을 때만 ·
#   용어 '전이'·'투사'가 '예전이'·'투사(싸움꾼)' 같은 다른 말에 걸려 뺌. 감사(v1.0 규칙): 5060 12/14 · 부모·가족 상처 7/9 · 직장 7/9 · 배우자·시댁 5/9 · 학생·청년 5/9 · 우울·불안 5/9.
# (v1.0 — 2026-11-11 — 새로 (사용자 지시 2026-11-11 "가장 최근에 주식 주제에서 했던 것처럼 심리 주제로 분석 코드 돌려서 … 페르소나 구성해서 …").
#   꼴은 history/personas.toml v1.1 · stock/personas.toml 과 같다. 묶음(stage) = 댓글이 스스로 밝힌 처지 — 누구와의 관계로 힘든가(부모·배우자·시댁·직장),
#   마음이 아픈 사람(우울·공황), 학생·청년, 살아 본 5060, 틀어 두고 듣는 사람. 처지(state) = 지금 겪는 일(손절·이혼·상담·약).
#   ⚖️ 판단: 첫 판은 new/niches.toml '07. 심리·인간관계' 제목 낱말과 심리 채널 댓글에 흔한 자기소개 꼴로 씀 — 분석 뒤 audit 로 무작위 댓글을 읽고 고친다.
#   한국어 댓글만. 나이는 자기소개 꼴만 (AGE_STRICT — 심리 댓글의 나이는 대개 '엄마가 60대' 같은 남의 나이).)
# ※ 연구·교육용 — 의료·심리 상담이 아니다.

