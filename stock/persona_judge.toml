[[title_feature]]
name = "숫자 있음"
re = '\d'
[[title_feature]]
name = "시황·날짜(월요일·내일·긴급)"
re = '월요일|화요일|내일|이번 ?주|다음 ?주|오늘|긴급|속보|D-\d'
[[title_feature]]
