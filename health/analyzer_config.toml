# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 건강 (health)
# VERSION: v1.0 — 2026-10-09 — 최초 작성: YouTube 자동완성으로 검색 수요를 확인한 검색어 48개
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 형식은 stock/analyzer_config.toml 과 같습니다.
# ▶ 실행:  python youtube_topic_analyzer.py --config health/analyzer_config.toml
#          Windows 실행기: .\run_analyzer.ps1 -Folder health
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#
# 📝 이 주제에서 검색어를 고른 기준
#   '건강' 단독 자동완성은 건강박수·건강체조·건강보험공단이 위에 나온다 → 단독 검색은 넣지 않고 질환·수치·검진 검색어로 골랐다.
#   수요가 큰 쪽: 혈당스파이크·당뇨 전단계·지방간·간수치·고지혈증, 40~60대 건강검진 추가검사, 영양제 조합·부작용.
#   ⚠️ 건강은 YouTube 의료 정보 정책 대상이다. 분석은 그대로 하되, 영상으로 만들 때는 출처(공공기관·논문)를 대본 README에 꼭 남긴다.
# =====================================================================================================

[topic]
TOPIC = "건강"                        # 분석 주제 (관련어가 비었을 때의 기본 관련어, 자동완성 씨앗)
PROJECT_FOLDER = "health"               # 결과 폴더 → PC: output/health/result/, GitHub: health/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
# "curated" = 아래 KEYWORD_GROUPS만 검색. 이 주제는 단독 주제어의 자동완성에 무관한 것(채널·노래·게임)이 많아 curated로 둔다.
# "both"로 바꾸면 자동완성 상위 AUTOCOMPLETE_TOP_N개를 더 검색한다 → 그때는 EXCLUDE_KEYWORDS가 걸러 준다.
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = [
  "노래", "박수", "체조", "댄스", "퀴즈", "게임", "강아지", "쯔양",
  "추성훈", "팜유", "휘성", "지창욱", "다이나믹듀오", "보험공단",
]   # (autocomplete/both 모드) 자동완성에서 뺄 단어 — 2026-10-09 자동완성에서 확인한 무관한 것
AUTOCOMPLETE_TOP_N = 10

# 🔎 카테고리별 검색어 6개 × 8개 = 48개. 모두 2026-10-09 YouTube 자동완성에 나온 표현이거나, 입력하면 자동완성이 이어지는(검색 수요가 있는) 검색어다.
# 💡 키워드 1개 = 검색 1회(100유닛). 하루 한도를 넘으면 다음 날 실행 때 이어서 수집한다 (검색 결과 7일 캐시).
[KEYWORD_GROUPS]
"1. 혈당·당뇨" = [
  "혈당스파이크 증상", "혈당스파이크 방지", "당뇨 전단계 증상", "당뇨 전단계 관리",
  "공복혈당 낮추는 방법", "공복혈당장애", "당뇨 초기증상", "당뇨 초기증상 피부",
]
"2. 간·혈압·콜레스테롤 수치" = [
  "지방간 증상", "간수치 높은 이유", "간수치 낮추는 방법", "고지혈증 증상",
  "콜레스테롤 수치", "고지혈증약 부작용", "고혈압 원인", "고혈압 관리",
]
"3. 건강검진·나이대 관리" = [
  "건강검진 결과 보는법", "건강검진 결과 해석", "40대 건강검진 추가검사 추천", "50대 건강검진 추가검사 추천",
  "60대 건강검진 추가검사 추천", "50대 건강관리", "60대 건강관리", "노인 건강관리",
]
"4. 영양제·약 오해와 부작용" = [
  "영양제 부작용", "영양제 조합", "영양제 먹는 시간", "혈압약과 같이 먹으면 안되는 영양제",
  "간에 안좋은 영양제", "콜레스테롤 약 부작용", "골다공증주사 부작용", "의사가 안 먹는 음식",
]
"5. 노화·만성 통증" = [
  "근감소증 증상", "근감소증 예방 운동", "골다공증 증상", "치매 초기증상",
  "치매 예방법", "역류성 식도염 증상", "허리디스크 증상", "무릎 연골 닳음",
]
"6. 습관·몸의 신호·사연 포맷" = [
  "건강 망치는 습관", "의사가 말하는 최악의 습관", "몸이 보내는 신호", "대장암 전조증상",
  "위암 전조증상", "암 초기증상 피로", "다이어트 요요 다큐", "시니어 건강 사연",
]

[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞인 무관한 영상을 분석·성공사례에서 뺀다 (글자가 '포함'되면 맞는 것으로 봄)
# 판정: ① 제목·태그에 강한 관련어  ② 제목에 약한 관련어 + (설명란 강한 관련어 또는 제목 약한 관련어 2개)  ③ 설명란에 강한 관련어 2번 이상
RELEVANCE_TERMS = [
  "건강", "혈당", "당뇨", "혈압", "고지혈증", "콜레스테롤", "지방간", "간수치",
  "영양제", "근감소증", "골다공증", "치매", "허리디스크", "목디스크", "연골", "식도염",
  "갑상선", "대장암", "위암", "간암", "폐암", "유방암", "전립선", "갱년기",
  "초기증상", "전조증상", "전문의", "한의사", "의사가 말하는", "몸이 보내는 신호",
]
# 약한 관련어 (혼자서는 인정 안 함) — '의사'는 '의사소통·의사결정'에도, '디스크'는 컴퓨터에도 쓰여서 혼자서는 인정하지 않는다.
RELEVANCE_WEAK_TERMS = [
  "다이어트", "운동", "음식", "식단", "수면", "불면증", "스트레칭", "통증", "부작용", "노화",
  "증상", "의사", "디스크", "면역", "요요", "노인", "시니어",
]
# 관련어를 품고 있지만 무관한 표현 — 판정 전에 지운다
RELEVANCE_EXCLUDE = [
  "건강하세요", "건강하시고", "건강하시길", "건강한 하루", "건강 챙기세요", "건강보험료", "의사소통", "의사결정",
  "의사 결정", "의사표현", "하드디스크",
]

[ads]
# 📢 광고로 조회수를 산 것으로 의심되는 영상 제외 (조회수 많은데 좋아요·댓글이 거의 없음). 값은 주식 데이터 기준 — 건강기능식품·영양제 유료 광고 영상이 특히 많다. 광고 의심 필터를 켜 둔다.
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# (선택) 기본값을 바꿀 때만 '#'을 지우고 고친다. 전체 목록은 stock/analyzer_config.toml [advanced] 참고
# ANALYSIS_DAYS = 365
# QUOTA_BUDGET = 9000
