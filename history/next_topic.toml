NOISE_CHANNEL = "뉴스|news|게임|game|music|뮤직|노래|영화|무비|movie|madmovi|엘플릭|고몽|구불|김시선|리뷰 봐|드림텔러|재미난|빵공장|카랑|진리의|조선일보|kbs 한국방송|코믹스|세계경제|러끼|역전 극장|tvn drama"
BROADCAST = "tvn|jtbc|mbc|sbs|kbs|ebs|채널a|mbn|tv조선|drama|voyage|\\bent\\b|개그|예능|디글|비보|클래식 드라마|사극 몰아보기|후루룩"  # v1.0(같은 날): 후루룩 = 성인 썰·야담 채널 (「밤마다 또?!」 꼴) — 결혼·돈 주제를 부풀려 뺌
# 역사 채널 가려내기용 (좁게 — 제목만). '왕'·'전쟁' 처럼 넓은 낱말은 드라마·게임 제목에도 흔해서 뺌.
