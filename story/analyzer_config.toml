# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 사연을 통한 교훈 (story)
# VERSION: v1.0 — 2026-10-09 — 최초 작성: YouTube 자동완성으로 검색 수요를 확인한 검색어 48개
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 형식은 stock/analyzer_config.toml 과 같습니다.
# ▶ 실행:  python youtube_topic_analyzer.py --config story/analyzer_config.toml
#          Windows 실행기: .\run_analyzer.ps1 -Folder story
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#
# 📝 이 주제에서 검색어를 고른 기준
#   수요가 큰 쪽: 시어머니·며느리(고부갈등) 사연, 사이다·참교육 사연, 시니어 사연 라디오·오디오북, '죽기 전에·나이 들면 후회하는 것',
#     인간관계 정리, 돈 빌려주고 못 받은 이야기, 결혼 후회.
#   '썰'·'사연' 단독 자동완성은 채널 이름(썰그·썰툰·사연튜브·사연극장)이라 넣지 않았다.
#   '인생 실패 후 코인 대박'은 웹드라마 제목, '야릇한 실화 사연'·'오늘의 사연 외도'는 성인·외도 사연이라 넣지 않았다.
#   ⚠️ 이 장르는 AI 음성·대량 생산 채널이 많다. 성공사례를 그대로 따라 만들면 YouTube 수익 창출 정책(반복·대량 생산 콘텐츠)에 걸릴 수 있다.
# =====================================================================================================

[topic]
TOPIC = "사연"                        # 분석 주제 (관련어가 비었을 때의 기본 관련어, 자동완성 씨앗)
PROJECT_FOLDER = "story"                # 결과 폴더 → PC: output/story/result/, GitHub: story/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
# "curated" = 아래 KEYWORD_GROUPS만 검색. 이 주제는 단독 주제어의 자동완성에 무관한 것(채널·노래·게임)이 많아 curated로 둔다.
# "both"로 바꾸면 자동완성 상위 AUTOCOMPLETE_TOP_N개를 더 검색한다 → 그때는 EXCLUDE_KEYWORDS가 걸러 준다.
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = [
  "사연튜브", "사연극장", "사연툰", "썰그", "썰툰", "썰티비", "썰이모", "코인 대박",
  "야릇한", "외도", "노래", "타로", "브금",
]   # (autocomplete/both 모드) 자동완성에서 뺄 단어 — 2026-10-09 자동완성에서 확인한 무관한 것
AUTOCOMPLETE_TOP_N = 10

# 🔎 카테고리별 검색어 6개 × 8개 = 48개. 모두 2026-10-09 YouTube 자동완성에 나온 표현이거나, 입력하면 자동완성이 이어지는(검색 수요가 있는) 검색어다.
# 💡 키워드 1개 = 검색 1회(100유닛). 하루 한도를 넘으면 다음 날 실행 때 이어서 수집한다 (검색 결과 7일 캐시).
[KEYWORD_GROUPS]
"1. 가족 갈등 (고부·형제·황혼)" = [
  "시어머니 며느리 갈등 사연", "고부갈등 사연", "시아버지 며느리 사연", "시니어 사연 며느리",
  "형제간 재산 다툼", "유산상속 분쟁", "황혼 이혼 이유", "황혼 이혼 후 삶",
]
"2. 돈·배신·결혼 후회" = [
  "돈 빌려주고 못받을때", "돈 빌려주고 이자", "떼인 돈 받기", "친구 배신 썰",
  "사이다 이혼 사연", "결혼 후회하는 이유", "결혼 후회 비용", "결혼 후회하는 남자",
]
"3. 인생 후회·교훈" = [
  "죽기 전에 후회하는 것들", "나이들면 후회하는 것들", "80세가 되고 후회하는 것들", "노년에 후회하는 것",
  "인생에서 가장 후회하는 것", "인생 교훈 지혜", "인생 교훈 명언", "인생 조언 모음",
]
"4. 인간관계 교훈" = [
  "인간관계 정리하는 방법", "인간관계 정리되는 시기", "인간관계 정리 신호", "인간관계 정리의 법칙",
  "인간관계 경계", "인간관계 해결", "사람 보는 눈 기르기", "친구 배신감",
]
"5. 사연 포맷 (라디오·낭독·오디오북)" = [
  "사연 라디오", "시니어 사연 라디오", "사연 낭독", "시니어 오디오북 사연",
  "실화 사연 모음", "감동 실화 사연", "반전 실화 사연", "오늘의 사연 실화",
]
"6. 사이다·참교육·감동" = [
  "사이다 사연 모음", "사이다 참교육 사연", "시어머니 사이다 사연", "시댁 사이다 사연",
  "감동 사연 모음", "해외 감동 사연", "시니어 감동 사연", "사연툰 시어머니",
]

[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞인 무관한 영상을 분석·성공사례에서 뺀다 (글자가 '포함'되면 맞는 것으로 봄)
# 판정: ① 제목·태그에 강한 관련어  ② 제목에 약한 관련어 + (설명란 강한 관련어 또는 제목 약한 관련어 2개)  ③ 설명란에 강한 관련어 2번 이상
RELEVANCE_TERMS = [
  "사연", "실화", "교훈", "썰", "시어머니", "며느리", "시댁", "고부갈등",
  "참교육", "황혼 이혼", "황혼이혼", "오디오북", "인생 조언", "인간관계", "후회하는 것", "돈 빌려주",
  "떼인 돈", "사람 보는 눈",
]
# 약한 관련어 (혼자서는 인정 안 함) — '사이다'는 음료, '유산'은 문화유산·유산(임신), '라디오'는 방송에도 쓰여서 혼자서는 인정하지 않는다.
RELEVANCE_WEAK_TERMS = [
  "후회", "배신", "이혼", "갈등", "사이다", "감동", "라디오", "인생", "유산", "상속",
  "재산", "보증", "결혼", "자식", "형제", "친구", "노년", "시니어", "낭독",
]
# 관련어를 품고 있지만 무관한 표현 — 판정 전에 지운다
RELEVANCE_EXCLUDE = [
  "썰매", "썰기", "썰어", "채썰", "썰물", "썰렁", "사이다 식초",
]

[ads]
# 📢 광고로 조회수를 산 것으로 의심되는 영상 제외 (조회수 많은데 좋아요·댓글이 거의 없음). 값은 주식 데이터 기준 — 사연 채널은 댓글률이 높은 편이라 광고 의심 기준(댓글 거의 없음)에 잘 걸리지 않는다. 기본값 그대로 둔다.
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# (선택) 기본값을 바꿀 때만 '#'을 지우고 고친다. 전체 목록은 stock/analyzer_config.toml [advanced] 참고
# ANALYSIS_DAYS = 365
# QUOTA_BUDGET = 9000
