// ---------- 날짜 축 (시작일부터 날 수 — 점 사이 간격이 달라도 화면은 시간 비례) ----------
const T = AN.t, TD = T[NW - 1];
const DAY0 = Date.parse(AN.dates[0] + "T00:00:00Z");
const dayOf = d => (Date.parse(d + "T00:00:00Z") - DAY0) / 864e5;
const idxAtDay = day => {                                       // T[i] ≤ day 인 가장 큰 i
  if (day <= 0) return 0;
  if (day >= TD) return NW - 1;
  let lo = 0, hi = NW - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= day) lo = m; else hi = m; }
  return lo;
};
const valAt = (arr, day) => { const i = idxAtDay(day); if (i >= NW - 1) return arr[NW - 1]; const f = (day - T[i]) / (T[i + 1] - T[i]); return arr[i] + (arr[i + 1] - arr[i]) * f; };

// ---------- 대시보드: 날짜가 흐르며 A(관망) vs B(규칙) ----------
