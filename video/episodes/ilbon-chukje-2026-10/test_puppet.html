<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"ilbon-chukje-2026-10","topic":"test","duration":363.17,"audio":"../../../test/source/ilbon-chukje-2026-10/narration.mp3","thumb":null,"synced":"2026-10-20T11:16:53Z","tts":"2026-10-20T09:37:53","script_sha1":"6ae5d7d567772fc0","sent":[{"n":1,"part":"도입","text":"2026년 10월 17일, 일본 에히메현의 전통 축제 '사이조 마쓰리' 도중 무게 3톤의 가마를 높이 들어 올리던 순간 가마가 떨어졌고, 그 아래 있던 62세 현직 부시장이 깔려 숨졌습니다.","start":0.3,"end":12.66},{"n":2,"part":"도입","text":"이뿐만이 아닙니다.","start":13.11,"end":14.12},{"n":3,"part":"도입","text":"10월 10일, 오사카 단지리 축제에서 교차로를 빠르게 꺾던 수레가 잇따라 넘어져 2명이 숨지고 16명이 다쳤고, 올해 2월 21일엔 오카야마의 알몸 축제에서도 2명이 숨졌죠.","start":14.57,"end":25.32},{"n":4,"part":"도입","text":"보도된 것만 세어도 일본 축제에선 4개월에 1명꼴로 사람이 숨집니다.","start":25.77,"end":30.59},{"n":5,"part":"도입","text":"그런데도 일본은 이 축제들을 멈추지 않습니다.","start":31.04,"end":33.76},{"n":6,"part":"도입","text":"도대체 왜일까요?","start":34.21,"end":35.17},{"n":7,"part":"도입","text":"네 가지 이유를 알아보겠습니다.","start":35.62,"end":37.33},{"n":8,"part":"첫째, 돈과 관광","text":"가장 단순한 첫 번째 이유는 관광 수입입니다.","start":38.33,"end":41.24},{"n":9,"part":"첫째, 돈과 관광","text":"전통 축제에는 작게는 수만 명, 크게는 수십만 명이 몰립니다.","start":41.69,"end":45.61},{"n":10,"part":"첫째, 돈과 관광","text":"이번 사고가 난 사이조 마쓰리에는 약 8만 명, 오사카 기시와다 단지리 축제에는 50만에서 60만 명이 찾는 것으로 알려져 있습니다.","start":46.06,"end":53.82},{"n":11,"part":"첫째, 돈과 관광","text":"숙박, 음식, 교통까지 지역 경제가 1년 중 가장 크게 살아나는 대목이죠.","start":54.27,"end":59.01},{"n":12,"part":"첫째, 돈과 관광","text":"하지만 이보다 더 중요한 이유는 따로 있습니다.","start":59.46,"end":61.95},{"n":13,"part":"둘째, 동네가 곧 가족","text":"두 번째 이유는 공동체, '동네가 곧 가족'이라는 의식입니다.","start":62.95,"end":66.95},{"n":14,"part":"둘째, 동네가 곧 가족","text":"이런 축제는 동네 단위로 움직입니다.","start":67.4,"end":69.48},{"n":15,"part":"둘째, 동네가 곧 가족","text":"마을마다 가마나 수레를 갖고 1년 내내 축제를 준비하죠.","start":69.93,"end":73.53},{"n":16,"part":"둘째, 동네가 곧 가족","text":"어릴 땐 어린이회에서 줄을 잡고, 커가면서 청년단, 젊은 리더, 그리고 원로인 '세화인'까지 나이에 따라 역할이 올라갑니다.","start":73.98,"end":82.81},{"n":17,"part":"둘째, 동네가 곧 가족","text":"축제에서 맡는 역할이 곧 동네에서의 위치인 셈입니다.","start":83.26,"end":86.38},{"n":18,"part":"둘째, 동네가 곧 가족","text":"한 기시와다 주민은 일본 언론에 \"축제가 지역의 결속과 지역 사랑을 지켜준다\"며 안이한 규제에 반대한다고 말했습니다.","start":86.83,"end":93.96},{"n":19,"part":"둘째, 동네가 곧 가족","text":"이들에게 축제를 멈추라는 건 동네를 해체하라는 말처럼 들리는 겁니다.","start":94.41,"end":98.4},{"n":20,"part":"셋째, 신을 모시는 행사","text":"세 번째 이유는 축제 자체가 신을 모시는 종교 행사라는 점입니다.","start":99.4,"end":103.7},{"n":21,"part":"셋째, 신을 모시는 행사","text":"일본에는 자연 곳곳에 수많은 신이 깃들어 있다고 믿는 고유 신앙 '신토'가 있고, 동네마다 그 지역을 지키는 신을 모신 신사가 있습니다.","start":104.15,"end":112.67},{"n":22,"part":"셋째, 신을 모시는 행사","text":"일본에서 축제는 놀이이기 전에 그 신에게 올리는 의식인 겁니다.","start":113.12,"end":116.78},{"n":23,"part":"셋째, 신을 모시는 행사","text":"축제에서 쓰는 가마와 수레는 단순한 장식이 아닙니다.","start":117.23,"end":120.57},{"n":24,"part":"셋째, 신을 모시는 행사","text":"신에게 바치는 제례 도구이고, 축제 자체가 신사의 종교 행사입니다.","start":121.02,"end":125.04},{"n":25,"part":"셋째, 신을 모시는 행사","text":"그래서 행정도 손대기 어렵습니다.","start":125.49,"end":127.48},{"n":26,"part":"셋째, 신을 모시는 행사","text":"일본 방송 해설에 따르면 종교 행사라서 지자체는 '부탁' 수준의 요청은 할 수 있어도 지도나 중지 명령은 내리기 어렵다고 합니다.","start":127.93,"end":136.25},{"n":27,"part":"넷째, 자기책임 문화","text":"마지막 이유는 '자기책임' 문화입니다.","start":137.25,"end":139.57},{"n":28,"part":"넷째, 자기책임 문화","text":"일본에는 '남에게 폐를 끼치지 말라', '스스로 선택했다면 그 결과도 스스로 감당하라'는 자기책임 문화가 뿌리 깊게 자리 잡고 있습니다.","start":140.02,"end":148.43},{"n":29,"part":"넷째, 자기책임 문화","text":"이런 생각은 축제 현장에서 더 극단적으로 나타납니다.","start":148.88,"end":152.22},{"n":30,"part":"넷째, 자기책임 문화","text":"50년 넘게 기시와다 단지리에 참가해 온 한 원로는 일본 매체 인터뷰에서 이렇게 말했습니다.","start":152.67,"end":158.22},{"n":31,"part":"넷째, 자기책임 문화","text":"\"목숨을 잃는 건 격투기와 같아요. 자기책임입니다.\"","start":158.67,"end":162.1},{"n":32,"part":"넷째, 자기책임 문화","text":"지붕 위에 오르는 역할을 맡을 땐 죽을 위험까지 받아들인다고 했습니다.","start":162.55,"end":166.96},{"n":33,"part":"넷째, 자기책임 문화","text":"동의서 같은 건 쓰지 않는데도요.","start":167.41,"end":169.25},{"n":34,"part":"넷째, 자기책임 문화","text":"더 놀라운 건 그다음입니다.","start":169.7,"end":171.14},{"n":35,"part":"넷째, 자기책임 문화","text":"사고를 낸 집안이 오히려 주변에 사과해야 한다는 분위기가 있느냐는 질문에 그는 \"솔직히, 있다\"고 답하며 이렇게 덧붙였습니다.","start":171.59,"end":179.16},{"n":36,"part":"넷째, 자기책임 문화","text":"\"내가 지붕 위 역할을 하다 죽으면, 부모님은 사과하러 다닐 거라고 생각해요.\"","start":179.61,"end":184.17},{"n":37,"part":"넷째, 자기책임 문화","text":"사망사고를 낸 조는 3년간 축제에 나올 수 없다는 이야기도 전해집니다.","start":184.62,"end":188.98},{"n":38,"part":"넷째, 자기책임 문화","text":"일본의 평론가 마나베 아쓰시는 축제가 원래 죽음의 위험을 감수하며 일상을 깨부수는 장치였다고 분석합니다.","start":189.43,"end":196.63},{"n":39,"part":"넷째, 자기책임 문화","text":"위험이 없으면 축제도 아니라는 거죠.","start":197.08,"end":199.03},{"n":40,"part":"넷째, 자기책임 문화","text":"이런 자기책임론은 현지 반응에서도 그대로 드러납니다.","start":199.48,"end":202.79},{"n":41,"part":"넷째, 자기책임 문화","text":"축제를 옹호하는 사상가 우치다 다쓰루는 \"위험하니까 그만두라는 건, 사고가 많으니 F1을 그만두라는 것과 같다\"며 주변 사람이 말할 일이 아니라고 반박했습니다.","start":203.24,"end":213.19},{"n":42,"part":"넷째, 자기책임 문화","text":"반대로 축제에 비판적인 일본 SNS에선 \"위험한 걸 알고 하는 취미인데 공적 의료보험은 쓰지 마라\", \"치료비는 전액 자비로 내라\"는 말까지 나왔습니다.","start":213.64,"end":223.67},{"n":43,"part":"넷째, 자기책임 문화","text":"지지하는 쪽도, 비판하는 쪽도 결국 '자기책임'이라는 같은 말을 하고 있는 겁니다.","start":224.12,"end":229.38},{"n":44,"part":"다른 목소리","text":"그런데 일본 사람들 모두가 정말 이렇게 생각할까요?","start":230.38,"end":233.3},{"n":45,"part":"다른 목소리","text":"이번 사고 이후 일본에선 전혀 다른 목소리도 터져 나오고 있습니다.","start":233.75,"end":237.43},{"n":46,"part":"다른 목소리","text":"'자기책임'만으로는 설명할 수 없다는 거죠.","start":237.88,"end":240.13},{"n":47,"part":"일본 안에서도 갈린다","text":"지역 안에서도 \"이런 위험한 축제는 중단해야 한다\"는 목소리가 나옵니다.","start":241.13,"end":245.39},{"n":48,"part":"일본 안에서도 갈린다","text":"\"적어도 빠른 속도로 꺾는 방식은 바꿔야 한다\"는 의견도 있죠.","start":245.84,"end":249.13},{"n":49,"part":"일본 안에서도 갈린다","text":"온라인에선 자기책임론 자체를 반박하는 목소리도 나왔습니다.","start":249.58,"end":253.2},{"n":50,"part":"일본 안에서도 갈린다","text":"\"본인이 동의했다고, 자기책임이라고 해서 뭐든 해도 되는 건 아니다.\"","start":253.65,"end":257.75},{"n":51,"part":"일본 안에서도 갈린다","text":"일본 방송 거리 인터뷰에서도 의견이 나왔습니다.","start":258.2,"end":260.91},{"n":52,"part":"일본 안에서도 갈린다","text":"형태를 바꾸는 건 이해하지만, 전통의 의미는 지켜야 한다는 겁니다.","start":261.36,"end":265.44},{"n":53,"part":"일본 안에서도 갈린다","text":"그리고 실제로, 500년 넘게 이어온 전통에 손을 대기로 한 축제까지 나왔습니다.","start":265.89,"end":270.63},{"n":54,"part":"실제로 바뀐 축제","text":"바로 오카야마의 '사이다이지 에요'입니다.","start":271.63,"end":273.94},{"n":55,"part":"실제로 바뀐 축제","text":"500년 넘게 이어온 일본의 대표 알몸 축제입니다.","start":274.39,"end":277.4},{"n":56,"part":"실제로 바뀐 축제","text":"약 1만 명의 남성이 행운의 나무막대 '호기'를 차지하려고 몸싸움을 벌이죠.","start":277.85,"end":282.5},{"n":57,"part":"실제로 바뀐 축제","text":"이게 축제의 하이라이트, '호기 쟁탈전'입니다.","start":282.95,"end":285.82},{"n":58,"part":"실제로 바뀐 축제","text":"올해 2월 21일 밤, 이 몸싸움 도중 3명이 의식을 잃었고 결국 2명이 숨졌습니다.","start":286.27,"end":291.67},{"n":59,"part":"실제로 바뀐 축제","text":"주최 측은 구조 매뉴얼을 만들고 AED도 설치했습니다.","start":292.12,"end":295.33},{"n":60,"part":"실제로 바뀐 축제","text":"음주와 군중 속 다이빙도 금지하는 등 대책을 마련해 왔죠.","start":295.78,"end":299.46},{"n":61,"part":"실제로 바뀐 축제","text":"7월에는 외부 전문가 위원회까지 꾸려 앞으로의 축제 방식을 논의하고 있습니다.","start":299.91,"end":305.04},{"n":62,"part":"실제로 바뀐 축제","text":"그런데도 주최 측은 '재발을 막을 안전 대책이 아직 갖춰지지 않았다'고 판단했습니다.","start":305.49,"end":310.43},{"n":63,"part":"실제로 바뀐 축제","text":"\"전통을 끊어선 안 된다\"는 반대도 있었습니다.","start":310.88,"end":314.09},{"n":64,"part":"실제로 바뀐 축제","text":"결국 9월 29일, 2027년 호기 쟁탈전은 열지 않는 쪽으로 최종 조정에 들어갔습니다.","start":314.54,"end":321.25},{"n":65,"part":"실제로 바뀐 축제","text":"그렇다면 10월에 사망자가 나온 축제들은 어떨까요?","start":321.7,"end":324.43},{"n":66,"part":"실제로 바뀐 축제","text":"오사카 단지리 축제와 사이조 마쓰리는 지금 경찰이 사고 원인을 조사하고 있습니다.","start":324.88,"end":329.3},{"n":67,"part":"실제로 바뀐 축제","text":"아직 운영 방식을 바꾸겠다는 공식 발표는 나오지 않았습니다.","start":329.75,"end":333.18},{"n":68,"part":"실제로 바뀐 축제","text":"사이다이지처럼 변화를 택할지, 지금처럼 이어갈지, 이제 이 축제들의 선택이 남았습니다.","start":333.63,"end":339.39},{"n":69,"part":"정리","text":"정리하면, 일본이 축제를 멈추지 않는 이유는 돈만이 아니었습니다.","start":340.39,"end":344.55},{"n":70,"part":"정리","text":"동네라는 공동체, 신을 모신다는 믿음, 위험까지 자기 몫으로 받아들이는 문화죠.","start":345,"end":350.68},{"n":71,"part":"정리","text":"한 나라의 고유한 문화인 만큼 존중해야 합니다.","start":351.13,"end":354.01},{"n":72,"part":"정리","text":"하지만 사람의 목숨이 걸린 일인 만큼, 인명 피해를 줄이기 위한 변화는 필요해 보입니다.","start":354.46,"end":359.77},{"n":73,"part":"정리","text":"시청해주셔서 감사합니다.","start":360.22,"end":361.77}],"subs":[[0.2,5.634,"202   else { c = placeholder(key); src = "임시"; }

  const green = i => p[i + 1] > 150 && p[i] < 110 && p[i + 2] < 110;
  if (corners.every(i => p[i + 3] > 250)) {
    if (corners.every(green)) {                                      // 순초록 바탕 → 초록 빼기 + 가장자리 초록 번짐 줄이기

        const k = clamp((gd - 40) / 50, 0, 1) * clamp((gg - 110) / 60, 0, 1);

  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (p[at(x, y) + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

  let opC = 1, opL = 0;                                              // 갈아 끼울 때 0.08초 겹쳐 바꿈
  if (falling) opC = opL = 0;
  else if (st.ts >= 0) { opC = st.k === "CARRY" ? xf : 1 - xf; opL = st.k === "LIFT" ? xf : 1 - xf; }
  setOp(P.carry, opC); setOp(P.lift, opL);
  const hop = st.ts < 0 ? 0 : st.k === "LIFT" ? 0.14 * Math.sin(Math.PI * clamp(dt / 0.3, 0, 1)) : -0.07 * Math.sin(Math.PI * clamp(dt / 0.22, 0, 1));
  unit.position.y = stepping * 0.08 * Math.abs(Math.sin(tq * Math.PI * 2.2)) + (falling ? 0 : hop);
  unit.rotation.z = falling ? 0 : stepping * 0.012 * Math.sin(tq * Math.PI * 2.2) + (t > tUp ? 0.006 * Math.sin(tq * 9) : 0);
  // 떨어짐: 기울기(0.35초) → 떨어짐(0.42초, 점점 빠르게) → 귀퉁이 닿음 → 몸통이 쾅 (0.24초) → 살짝 튐
  setOp(P.float, falling ? 1 : 0);
  if (falling) {
    const a1 = -0.105 * sm(lin(t, tTilt, tDrop));
    const kd = lin(t, tDrop, tI1), drop = kd * kd;
    const a2 = a1 - 0.14 * drop;
    const ks = lin(t, tI1, tI2), a3 = lerp(a2, -0.035, ks * ks);
    const bounce = t > tI2 ? -0.03 * Math.exp(-(t - tI2) / 0.18) * Math.sin((t - tI2) * 30) : 0;
    pivot.rotation.z = (t < tI1 ? a2 : a3) + bounce + (t < tDrop ? 0.012 * Math.sin(tq * 40) : 0);
    pivot.position.y = lerp(pivot.userData.y, 0.02, t < tI1 ? drop : 1);
  } else { pivot.rotation.z = 0; pivot.position.y = pivot.userData.y; }
  // 가마꾼 흩어짐 (SCATTER 를 둘로 — 양옆으로 밀려나며 한 번 튐)
  const ks2 = falling ? 1 - Math.pow(1 - lin(t, tTilt, tTilt + 1.1), 3) : 0;
  setOp(P.scL, falling ? clamp((t - tTilt) / 0.08, 0, 1) : 0); setOp(P.scR, P.scL.material.opacity);
  const jump = falling ? 0.3 * Math.sin(Math.PI * lin(t, tTilt, tTilt + 0.5)) : 0;
  P.scL.position.x = P.scL.userData.x - 1.3 * ks2; P.scR.position.x = P.scR.userData.x + 1.3 * ks2;
  P.scL.position.y = P.scR.position.y = P.scL.userData.y0 + jump;
  P.scL.rotation.z = 0.05 * ks2; P.scR.rotation.z = -0.05 * ks2;
  // 구경꾼: 환호(위아래로 들썩) → 쾅에 놀람으로 뒤집기 (종이 카드 뒤집듯 가로 폭 0 → 1)
  const flipK = lin(t, tI2, tI2 + 0.2), shocked = t >= tI2 + 0.1;
  for (const [grp, arr, mir] of [[back, P.crowdB, 1], [front, P.crowdF, -1]]) {
    setOp(arr[0], shocked ? 0 : 1); setOp(arr[1], shocked ? 1 : 0);
    const sx = t < tI2 ? 1 : Math.abs(Math.cos(Math.PI * flipK));
    arr.forEach(m => (m.scale.x = mir * Math.max(0.02, sx)));
    grp.position.y = t < tI2 ? 0.06 * Math.abs(Math.sin(tq * Math.PI * 1.6 + (mir > 0 ? 0 : 1))) : -0.05 * flipK;
  }
  // 흙먼지 (종이) — 가마가 떨어진 자리
  const land = new THREE.Vector3(); P.float.updateMatrixWorld(true);
  const fb = INFO.FLOAT.bbox;
  land.set(((fb[0] + fb[2]) / 2 - 0.5) * PW, (0.5 - fb[3]) * PH, 0).applyMatrix4(P.float.matrixWorld);
  const tau = t - tI2;
  setOp(P.dust, tau > 0 ? sm(clamp(tau / 0.12, 0, 1)) * (1 - seg(tau, 1.2, 2.6)) : 0);
  if (tau > 0) { const s = lerp(0.35, 1.15, 1 - Math.pow(1 - clamp(tau / 0.6, 0, 1), 3)); P.dust.scale.set(s, s, 1); P.dust.position.set(land.x, (0.92 - 0.5) * DH * s - 0.15 + 0.12 * tau, 0.8); }   // 먼지 그림 아래 줄(92%)이 땅
  // 먼지 알갱이 (3D)
  dust3.visible = tau > 0 && tau < 3.2;
  if (dust3.visible) {
    const k = 1 - Math.exp(-tau / 0.5);
    for (let i = 0; i < ND; i++) {
      const vx = (rnd(i, 3) - 0.5) * 7, vy = 0.5 + rnd(i, 4) * 3.2, vz = (rnd(i, 5) - 0.3) * 5;
      dpos[i * 3] = land.x + vx * k; dpos[i * 3 + 1] = Math.max(0.05, vy * k - 0.6 * tau * tau * 0.3); dpos[i * 3 + 2] = 0.5 + vz * k;
    }
    dg.attributes.position.needsUpdate = true;
    dmat.opacity = 0.8 * seg(tau, 0, 0.1) * (1 - seg(tau, 1.0, 3.2));
  }
  // 불씨 (3D) — 무대 깊이 전체에서 천천히 떠오름
  for (let i = 0; i < NE; i++) {
    const sp = 0.25 + rnd(i, 4) * 0.6, y = (rnd(i, 2) * 10 + t * sp) % 10;
    ep[i * 3] = -12 + rnd(i, 1) * 26 + Math.sin(t * 0.7 + rnd(i, 5) * 6.3) * 0.4; ep[i * 3 + 1] = y; ep[i * 3 + 2] = -14 + rnd(i, 3) * 22;
  }
  eg.attributes.position.needsUpdate = true;
  emat.opacity = 0.9 * (1 - 0.5 * seg(t, tI2, tI2 + 1));
  // 국화 — '숨졌습니다' 에 위에서 천천히 흔들리며 내려와 가마 앞에 놓임
  const kf = lin(t, tDie, tDie + 1.1), fe = 1 - Math.pow(1 - kf, 2);
  setOp(P.flower, t >= tDie ? sm(clamp((t - tDie) / 0.2, 0, 1)) : 0);
  P.flower.position.set(land.x - 1.6 + 0.5 * Math.sin(kf * 5), lerp(7.5, 0.55, fe), 3.2);
  P.flower.rotation.z = 0.5 * Math.sin(kf * 6) * (1 - kf) - 0.35;
  // 색: 따뜻함 → 쾅 뒤 식음 → '숨졌습니다' 에 더 어둡게
  gradeCol.copy(WARM).lerp(COOL, seg(t, tI2, tI2 + 0.6)).lerp(DARK, seg(t, tDie, tDie + 0.8));
  for (const m of GRADE) m.color.copy(gradeCol);
  flash.style.opacity = t > tI2 ? (0.5 * Math.exp(-(t - tI2) / 0.12)).toFixed(3) : 0;   // 쾅 — 짧은 빛
  // 카메라
  const c = camAt(t);
  cam.position.copy(c.pos); cam.lookAt(c.look); cam.updateMatrixWorld();
  ren.render(scene, cam);
  // '무게 3톤' 꼬리표 — 가마 꼭대기를 따라감 ('무게' ~ 기울기 시작)
  if (t >= tW && t < tTilt + 0.15) {
    const ft = INFO.floatTop, top = st.k === "LIFT" ? ft.liftTop : ft.carryTop;
    const v = new THREE.Vector3((ft.u - INFO.anchor.cu) * PW, (INFO.anchor.fy - top) * PH + 0.3, 0).applyMatrix4(unit.matrixWorld);
    const [x, y] = proj(v), k = seg(t, tW, tW + 0.35) * (1 - seg(t, tTilt, tTilt + 0.15));
    ov.innerHTML = `<div class="tag3" style="left:${x.toFixed(1)}px;top:${Math.max(120, y - 10).toFixed(1)}px;opacity:${k.toFixed(3)}">무게 3톤</div>`;
  } else ov.innerHTML = "";
});
K.done();
})();
</script>
