<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"myeonse-hwangeup-2026-10","topic":"test","duration":436.94,"audio":"../../../test/source/myeonse-hwangeup-2026-10/narration.mp3","thumb":null,"synced":"2026-10-24T10:51:31Z","tts":"2026-10-24T07:26:53","script_sha1":"11d54a70ea55a96a","sent":[{"n":1,"part":"도입","text":"11월 1일부터 일본 면세는, 출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다.","start":0.3,"end":6.15},{"n":2,"part":"도입","text":"방법을 모르고 가면, 붐비는 날엔 공항에서 면세 때문에만 1시간 반 넘게 쓸 수 있습니다.","start":6.53,"end":12.302},{"n":3,"part":"도입","text":"최악의 경우엔 2시간 반 넘게 걸릴 수도 있어요.","start":12.682,"end":15.712},{"n":4,"part":"도입","text":"알고 가면, 줄을 거의 서지 않고 최소 약 2분 만에 끝낼 수 있습니다.","start":16.092,"end":20.436},{"n":5,"part":"도입","text":"그럼 어떻게 해야 가장 빠르게 면세 받을 수 있을까요?","start":20.816,"end":23.856},{"n":6,"part":"도입","text":"만약 11월 이후 일본에서 직접 면세를 받는다고 가정해 보겠습니다.","start":24.236,"end":28.096},{"n":7,"part":"첫째, 출국 전","text":"당신은 11월에 도쿄로 3박 4일 여행을 갈 예정입니다.","start":29.096,"end":32.764},{"n":8,"part":"첫째, 출국 전","text":"비지트 재팬 웹은 입국 심사와 세관 신고에도 쓰는 일본 정부의 웹 서비스입니다.","start":33.144,"end":38.108},{"n":9,"part":"첫째, 출국 전","text":"그런데 출국 전에 이걸 설정하지 않으면, 공항에서 빠르게 면세 수속을 할 수 없습니다.","start":38.488,"end":43.257},{"n":10,"part":"첫째, 출국 전","text":"일곱 개 공항에서는 비지트 재팬 웹으로 휴대전화 면세 수속을 할 수 있기 때문입니다.","start":43.637,"end":48.705},{"n":11,"part":"첫째, 출국 전","text":"나리타, 하네다, 간사이, 주부, 후쿠오카, 신치토세, 나하 공항입니다.","start":49.085,"end":54.936},{"n":12,"part":"첫째, 출국 전","text":"출국 전에 미리 설정해 두지 않으면, 공항에서 휴대전화 수속을 쓸 수 없습니다.","start":55.316,"end":60.354},{"n":13,"part":"첫째, 출국 전","text":"주의할 점도 있습니다.","start":60.734,"end":61.921},{"n":14,"part":"첫째, 출국 전","text":"휴대전화 수속은 공항 밖에서는 할 수 없습니다.","start":62.301,"end":65.046},{"n":15,"part":"첫째, 출국 전","text":"공항 출발 로비에서, 보안 검사장에 들어가기 전의 전용 와이파이에 연결해야만 됩니다.","start":65.426,"end":71.146},{"n":16,"part":"첫째, 출국 전","text":"그래서 첫 번째는, 출국 전에 비지트 재팬 웹을 설정해 둬야 한다는 것입니다.","start":71.526,"end":76.538},{"n":17,"part":"둘째, 쇼핑할 때","text":"일본에 도착한 첫날, 돈키호테에서 과자와 화장품을 한 번에 계산했습니다.","start":77.538,"end":82.544},{"n":18,"part":"둘째, 쇼핑할 때","text":"여기서 과자 한 봉지를 먹으면, 같이 산 화장품도 면세를 받을 수 없게 됩니다.","start":82.924,"end":87.785},{"n":19,"part":"둘째, 쇼핑할 때","text":"일본에서 먹을 과자와 화장품을 한 영수증으로 계산한 것이 실수였죠.","start":88.165,"end":92.274},{"n":20,"part":"둘째, 쇼핑할 때","text":"면세 수속 때 세관 확인은 영수증 단위로 합니다.","start":92.654,"end":95.774},{"n":21,"part":"둘째, 쇼핑할 때","text":"한 영수증에 든 물건 가운데 하나라도 없으면, 그 영수증 전체가 환급되지 않는 거죠.","start":96.154,"end":101.352},{"n":22,"part":"둘째, 쇼핑할 때","text":"과자 한 봉지 때문에, 같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다.","start":101.732,"end":106.48},{"n":23,"part":"둘째, 쇼핑할 때","text":"게다가 먹어서 없어진 물건이 있으면, 단말기로는 확인을 받을 수 없습니다.","start":106.86,"end":111.198},{"n":24,"part":"둘째, 쇼핑할 때","text":"그래서 공항에 가면 세관 창구를 찾아가, 먹은 물건이 있다고 직접 신고해야 합니다.","start":111.578,"end":116.53},{"n":25,"part":"둘째, 쇼핑할 때","text":"그래서 두 번째는, 일본에서 먹거나 쓸 물건은 면세품과 따로 계산해야 한다는 것입니다.","start":116.91,"end":122.26},{"n":26,"part":"둘째, 쇼핑할 때","text":"그러면 과자를 먹어도, 화장품 영수증은 그대로 환급받을 수 있습니다.","start":122.64,"end":127.077},{"n":27,"part":"둘째, 쇼핑할 때","text":"둘째 날에는 세금 포함 3만 3천 엔인 옷을 샀습니다.","start":127.457,"end":130.757},{"n":28,"part":"둘째, 쇼핑할 때","text":"면세를 받으면, 그중 3천 엔이 나중에 돌려받을 소비세인데요.","start":131.137,"end":135.217},{"n":29,"part":"둘째, 쇼핑할 때","text":"여기서 세 번째 실수는 돌려받는 방법입니다.","start":135.597,"end":138.266},{"n":30,"part":"둘째, 쇼핑할 때","text":"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다.","start":138.646,"end":142.684},{"n":31,"part":"둘째, 쇼핑할 때","text":"업계 발표로는 공항 현금 환급 단말기가 하네다, 나리타, 나하의 다섯 곳에 생깁니다.","start":143.064,"end":148.682},{"n":32,"part":"둘째, 쇼핑할 때","text":"현금으로 받으려면, 출국하는 날 그 단말기 앞에 줄을 서야 합니다.","start":149.062,"end":153.391},{"n":33,"part":"둘째, 쇼핑할 때","text":"또 환급 업체 수수료는 법으로 정해져 있지 않아서, 매장마다 다를 수 있습니다.","start":153.771,"end":158.788},{"n":34,"part":"둘째, 쇼핑할 때","text":"그래서 세 번째는, 살 때 돌려받는 방법을 카드로 등록하고 수수료를 물어보는 것입니다.","start":159.168,"end":164.661},{"n":35,"part":"둘째, 쇼핑할 때","text":"카드로 받으면 공항에서 줄을 설 필요가 없습니다.","start":165.041,"end":168.193},{"n":36,"part":"둘째, 쇼핑할 때","text":"다만 카드로 며칠 만에 들어오는지는, 아직 공식 설명이 없습니다.","start":168.573,"end":172.501},{"n":37,"part":"셋째, 공항에서","text":"이제 여행을 마치고, 오후 6시에 출발하는 비행기를 타러 갑니다.","start":173.501,"end":177.594},{"n":38,"part":"셋째, 공항에서","text":"당신은 출발 2시간 반 전인 오후 3시 반에 나리타 공항에 도착합니다.","start":177.974,"end":182.024},{"n":39,"part":"셋째, 공항에서","text":"공항은 출발하는 사람이 몰리는 저녁 시간대라고 정하겠습니다.","start":182.404,"end":185.758},{"n":40,"part":"셋째, 공항에서","text":"여기부터 나오는 시간은 실제로 잰 것이 아니라, 모의실험으로 계산한 값입니다.","start":186.138,"end":190.845},{"n":41,"part":"셋째, 공항에서","text":"단말기 수처럼 공개되지 않은 숫자는 가정했기 때문에, 실제와는 다를 수 있습니다.","start":191.225,"end":196.197},{"n":42,"part":"셋째, 공항에서","text":"세관 확인은 짐을 맡기기 전, 출발 로비의 면세 수속 단말기에서 합니다.","start":196.577,"end":201.077},{"n":43,"part":"셋째, 공항에서","text":"하지만 과자를 먹은 당신은, 먼저 세관 창구로 가야 합니다.","start":201.457,"end":205.115},{"n":44,"part":"셋째, 공항에서","text":"붐비는 시간이라 창구 줄이 길어서, 세관 신고를 마치면 오후 4시 22분입니다.","start":205.495,"end":210.937},{"n":45,"part":"셋째, 공항에서","text":"걷고, 줄 서고, 신고하는 데만 약 52분이 걸린 겁니다.","start":211.317,"end":215.211},{"n":46,"part":"셋째, 공항에서","text":"이제야 체크인을 합니다.","start":215.591,"end":217.051},{"n":47,"part":"셋째, 공항에서","text":"나리타의 현금 환급 단말기는 출국 심사 전 구역에 있어서, 보안 검사 전에 들러야 합니다.","start":217.431,"end":222.863},{"n":48,"part":"셋째, 공항에서","text":"그런데 현금으로 받으려는 사람이 몰려, 여기서도 약 46분이 걸립니다.","start":223.243,"end":228.109},{"n":49,"part":"셋째, 공항에서","text":"체크인을 빼고도, 면세에만 약 1시간 38분을 쓴 셈입니다.","start":228.489,"end":232.639},{"n":50,"part":"셋째, 공항에서","text":"2시간 반 일찍 왔는데, 그중 1시간 반 넘게를 줄과 창구에서 보낸 거죠.","start":233.019,"end":237.689},{"n":51,"part":"셋째, 공항에서","text":"이보다 더 나쁜 실수도 있습니다.","start":238.069,"end":239.779},{"n":52,"part":"셋째, 공항에서","text":"일본에서 산 물건을 캐리어에 넣고, 체크인 카운터에서 짐부터 맡기는 겁니다.","start":240.159,"end":245.109},{"n":53,"part":"셋째, 공항에서","text":"세관 확인은 짐을 맡기기 전에 받아야 하고, 한 번 맡긴 짐은 되찾아 올 수 없습니다.","start":245.489,"end":250.549},{"n":54,"part":"셋째, 공항에서","text":"그러면 캐리어에 든 물건의 세금은, 한 푼도 돌려받지 못합니다.","start":250.929,"end":254.764},{"n":55,"part":"셋째, 공항에서","text":"그래서 네 번째는, 공항에 도착하면 체크인보다 먼저 면세 수속부터 하는 것입니다.","start":255.144,"end":260.044},{"n":56,"part":"셋째, 공항에서","text":"면세품은 가방 하나에 모아 두고, 수속이 끝날 때까지 맡기지 마세요.","start":260.424,"end":264.644},{"n":57,"part":"셋째, 공항에서","text":"빨간색이 떠서 검사를 받게 되면, 그 가방만 열어 보여 주면 되니까요.","start":265.024,"end":269.272},{"n":58,"part":"셋째, 공항에서","text":"단말기 앞 줄이 길 때, 그냥 줄만 서 있는 것도 실수입니다.","start":269.652,"end":273.328},{"n":59,"part":"셋째, 공항에서","text":"단말기가 모자란 공항이라고 가정하면, 단말기 줄만 선 사람은 약 94분이 걸렸습니다.","start":273.708,"end":279.398},{"n":60,"part":"셋째, 공항에서","text":"줄을 보고 휴대전화로 바꾼 사람은, 약 3분 반이면 끝났고요.","start":279.778,"end":283.788},{"n":61,"part":"셋째, 공항에서","text":"그래서 다섯 번째는, 단말기 줄을 보고 수속 방법을 고르는 것입니다.","start":284.168,"end":288.6},{"n":62,"part":"셋째, 공항에서","text":"줄이 짧으면 단말기에 여권을 대고, 길면 전용 와이파이 구역에서 휴대전화로 수속합니다.","start":288.98,"end":294.505},{"n":63,"part":"셋째, 공항에서","text":"휴대전화로 잘 안 되면, 그때는 단말기로 하면 됩니다.","start":294.885,"end":298.135},{"n":64,"part":"넷째, 다 지킨 당신","text":"그럼 이 방법을 다 지킨 당신은 어땠을까요?","start":299.135,"end":301.756},{"n":65,"part":"넷째, 다 지킨 당신","text":"같은 날 오후 3시 반, 당신은 나리타 공항에 도착합니다.","start":302.136,"end":305.796},{"n":66,"part":"넷째, 다 지킨 당신","text":"체크인보다 먼저, 줄을 보고 단말기나 휴대전화로 수속합니다.","start":306.176,"end":309.996},{"n":67,"part":"넷째, 다 지킨 당신","text":"화면에 초록색이 뜨면, 그걸로 세관 확인은 끝입니다.","start":310.376,"end":313.866},{"n":68,"part":"넷째, 다 지킨 당신","text":"걸린 시간은 약 2분, 시계는 오후 3시 32분입니다.","start":314.246,"end":318.096},{"n":69,"part":"넷째, 다 지킨 당신","text":"이제 면세품 가방도 맡기고, 바로 체크인하면 됩니다.","start":318.476,"end":321.865},{"n":70,"part":"넷째, 다 지킨 당신","text":"돈은 카드로 들어오니, 현금 단말기 줄을 설 필요도 없습니다.","start":322.245,"end":326.135},{"n":71,"part":"넷째, 다 지킨 당신","text":"그럼 운 나쁘게 빨간색이 뜨면 어떻게 될까요?","start":326.515,"end":329.121},{"n":72,"part":"넷째, 다 지킨 당신","text":"빨간색은 세관이 검사가 필요하다고 본 경우로, 기준은 공개되지 않았습니다.","start":329.501,"end":334.105},{"n":73,"part":"넷째, 다 지킨 당신","text":"휴대전화로 수속해도 빨간색은 똑같이 뜰 수 있어요.","start":334.485,"end":337.211},{"n":74,"part":"넷째, 다 지킨 당신","text":"이때는 세관 검사장에 가서 산 물건을 직접 보여 줘야 합니다.","start":337.591,"end":341.539},{"n":75,"part":"넷째, 다 지킨 당신","text":"붐비는 시간이라 줄이 길어서, 검사가 끝나면 오후 4시 20분입니다.","start":341.919,"end":346.3},{"n":76,"part":"넷째, 다 지킨 당신","text":"약 50분이 걸렸지만, 출발까지는 아직 1시간 40분이 남습니다.","start":346.68,"end":351.013},{"n":77,"part":"넷째, 다 지킨 당신","text":"그래서 여섯 번째는, 휴대전화로 수속하더라도 공항에는 시간 여유를 두고 가는 것입니다.","start":351.393,"end":356.674},{"n":78,"part":"넷째, 다 지킨 당신","text":"관광청도 시간에 여유를 두고 공항에 오라고 안내합니다.","start":357.054,"end":360.294},{"n":79,"part":"넷째, 다 지킨 당신","text":"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않습니다.","start":360.674,"end":365.114},{"n":80,"part":"다섯째, 차이를 만든 것","text":"그럼 실수를 하나씩 고치면, 시간은 얼마나 달라질까요?","start":366.114,"end":369.554},{"n":81,"part":"다섯째, 차이를 만든 것","text":"빨간색이 뜨는 경우까지 넣어 평균으로 따지면, 모르고 간 당신은 약 1시간 38분입니다.","start":369.934,"end":376.058},{"n":82,"part":"다섯째, 차이를 만든 것","text":"과자만 따로 계산해도, 세관 창구에 갈 일이 없어 약 49분으로 줄어듭니다.","start":376.438,"end":381},{"n":83,"part":"다섯째, 차이를 만든 것","text":"같은 조건에서 현금 대신 카드로만 바꿔도, 약 40분이 줄었습니다.","start":381.38,"end":385.66},{"n":84,"part":"다섯째, 차이를 만든 것","text":"여섯 가지 방법을 다 지키면, 평균 약 8분이 됩니다.","start":386.04,"end":389.379},{"n":85,"part":"다섯째, 차이를 만든 것","text":"반대로 공항이 한산하면, 실수를 해도 약 12분이면 끝났습니다.","start":389.759,"end":393.924},{"n":86,"part":"다섯째, 차이를 만든 것","text":"결국 붐비는 시간일수록, 방법을 아느냐 모르느냐가 1시간 넘는 차이를 만듭니다.","start":394.304,"end":399.321},{"n":87,"part":"정리","text":"마지막으로, 가장 빠르게 면세 받는 방법을 정리하겠습니다.","start":400.321,"end":404.095},{"n":88,"part":"정리","text":"하나, 출국 전에 비지트 재팬 웹을 설정해 두세요.","start":404.475,"end":407.645},{"n":89,"part":"정리","text":"둘, 일본에서 먹거나 쓸 물건은 따로 계산하세요.","start":408.025,"end":411.059},{"n":90,"part":"정리","text":"셋, 살 때 환급 방법은 카드로 등록하고, 수수료를 물어보세요.","start":411.439,"end":415.621},{"n":91,"part":"정리","text":"넷, 공항에서는 체크인보다 먼저, 면세품 가방을 맡기기 전에 수속하세요.","start":416.001,"end":420.826},{"n":92,"part":"정리","text":"다섯, 단말기 줄을 보고 단말기나 휴대전화로 수속하세요.","start":421.206,"end":424.896},{"n":93,"part":"정리","text":"여섯, 빨간색이 뜰 수 있으니, 공항에는 시간 여유를 두고 가세요.","start":425.276,"end":429.446},{"n":94,"part":"정리","text":"그리고 산 날부터 90일 안에 출국해야 한다는 것도 잊지 마세요.","start":429.826,"end":433.166},{"n":95,"part":"정리","text":"시청해주셔서 감사합니다.","start":433.546,"end":435.076}],"subs":[[0.254,6.588,"11월 1일부터 일본 면세는,\n출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다."],[6.588,12.735,"방법을 모르고 가면, 붐비는 날엔 공항에서\n면세 때문에만 1시간 반 넘게 쓸 수 있습니다."],[12.735,16.148,"최악의 경우엔 2시간 반 넘게 걸릴 수도 있어요."],[16.148,20.878,"알고 가면, 줄을 거의 서지 않고 최소 약 2분 만에 끝낼 수 있습니다."],[20.878,24.303,"그럼 어떻게 해야 가장 빠르게 면세 받을 수 있을까요?"],[24.303,29.136,"만약 11월 이후 일본에서 직접 면세를 받는다고 가정해 보겠습니다."],[29.136,33.186,"당신은 11월에 도쿄로 3박 4일 여행을 갈 예정입니다."],[33.186,38.529,"비지트 재팬 웹은 입국 심사와 세관 신고에도\n쓰는 일본 정부의 웹 서비스입니다."],[38.529,43.697,"그런데 출국 전에 이걸 설정하지 않으면,\n공항에서 빠르게 면세 수속을 할 수 없습니다."],[43.697,49.145,"일곱 개 공항에서는 비지트 재팬 웹으로\n휴대전화 면세 수속을 할 수 있기 때문입니다."],[49.145,55.38,"나리타, 하네다, 간사이, 주부, 후쿠오카, 신치토세, 나하 공항입니다."],[55.38,60.786,"출국 전에 미리 설정해 두지 않으면,\n공항에서 휴대전화 수속을 쓸 수 없습니다."],[60.786,62.359,"주의할 점도 있습니다."],[62.359,65.469,"휴대전화 수속은 공항 밖에서는 할 수 없습니다."],[65.469,71.586,"공항 출발 로비에서,\n보안 검사장에 들어가기 전의 전용 와이파이에 연결해야만 됩니다."],[71.586,77.595,"그래서 첫 번째는,\n출국 전에 비지트 재팬 웹을 설정해 둬야 한다는 것입니다."],[77.595,82.985,"일본에 도착한 첫날,\n돈키호테에서 과자와 화장품을 한 번에 계산했습니다."],[82.985,88.226,"여기서 과자 한 봉지를 먹으면,\n같이 산 화장품도 면세를 받을 수 없게 됩니다."],[88.226,92.714,"일본에서 먹을 과자와 화장품을 한 영수증으로 계산한 것이 실수였죠."],[92.714,96.22,"면세 수속 때 세관 확인은 영수증 단위로 합니다."],[96.22,101.796,"한 영수증에 든 물건 가운데 하나라도 없으면,\n그 영수증 전체가 환급되지 않는 거죠."],[101.796,106.919,"과자 한 봉지 때문에,\n같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다."],[106.919,111.642,"게다가 먹어서 없어진 물건이 있으면,\n단말기로는 확인을 받을 수 없습니다."],[111.642,116.967,"그래서 공항에 가면 세관 창구를 찾아가,\n먹은 물건이 있다고 직접 신고해야 합니다."],[116.967,122.702,"그래서 두 번째는,\n일본에서 먹거나 쓸 물건은 면세품과 따로 계산해야 한다는 것입니다."],[122.702,127.494,"그러면 과자를 먹어도, 화장품 영수증은 그대로 환급받을 수 있습니다."],[127.494,131.19,"둘째 날에는 세금 포함 3만 3천 엔인 옷을 샀습니다."],[131.19,135.657,"면세를 받으면, 그중 3천 엔이 나중에 돌려받을 소비세인데요."],[135.657,138.701,"여기서 세 번째 실수는 돌려받는 방법입니다."],[138.701,143.122,"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다."],[143.122,149.122,"업계 발표로는 공항 현금 환급 단말기가 하네다,\n나리타, 나하의 다섯 곳에 생깁니다."],[149.122,153.825,"현금으로 받으려면, 출국하는 날 그 단말기 앞에 줄을 서야 합니다."],[153.825,159.21,"또 환급 업체 수수료는 법으로 정해져 있지 않아서,\n매장마다 다를 수 있습니다."],[159.21,165.105,"그래서 세 번째는,\n살 때 돌려받는 방법을 카드로 등록하고 수수료를 물어보는 것입니다."],[165.105,168.627,"카드로 받으면 공항에서 줄을 설 필요가 없습니다."],[168.627,173.56,"다만 카드로 며칠 만에 들어오는지는, 아직 공식 설명이 없습니다."],[173.56,177.998,"이제 여행을 마치고, 오후 6시에 출발하는 비행기를 타러 갑니다."],[177.998,182.463,"당신은 출발 2시간 반 전인 오후 3시 반에 나리타 공항에 도착합니다."],[182.463,186.199,"공항은 출발하는 사람이 몰리는 저녁 시간대라고 정하겠습니다."],[186.199,191.282,"여기부터 나오는 시간은 실제로 잰 것이 아니라,\n모의실험으로 계산한 값입니다."],[191.282,196.64,"단말기 수처럼 공개되지 않은 숫자는 가정했기 때문에,\n실제와는 다를 수 있습니다."],[196.64,201.518,"세관 확인은 짐을 맡기기 전, 출발 로비의 면세 수속 단말기에서 합니다."],[201.518,205.557,"하지만 과자를 먹은 당신은, 먼저 세관 창구로 가야 합니다."],[205.557,211.377,"붐비는 시간이라 창구 줄이 길어서,\n세관 신고를 마치면 오후 4시 20분쯤입니다."],[211.377,215.652,"걷고, 줄 서고, 신고하는 데만 약 50분이 걸린 겁니다."],[215.652,217.492,"이제야 체크인을 합니다."],[217.492,223.3,"나리타의 현금 환급 단말기는 출국 심사 전 구역에 있어서,\n보안 검사 전에 들러야 합니다."],[223.3,228.545,"그런데 현금으로 받으려는 사람이 몰려, 여기서도 약 50분이 걸립니다."],[228.545,233.082,"체크인을 빼고도, 면세에만 약 1시간 40분을 쓴 셈입니다."],[233.082,238.123,"2시간 반 일찍 왔는데, 그중 1시간 반 넘게를 줄과 창구에서 보낸 거죠."],[238.123,240.219,"이보다 더 나쁜 실수도 있습니다."],[240.219,245.557,"일본에서 산 물건을 캐리어에 넣고,\n체크인 카운터에서 짐부터 맡기는 겁니다."],[245.557,250.971,"세관 확인은 짐을 맡기기 전에 받아야 하고,\n한 번 맡긴 짐은 되찾아 올 수 없습니다."],[250.971,255.21,"그러면 캐리어에 든 물건의 세금은, 한 푼도 돌려받지 못합니다."],[255.21,260.484,"그래서 네 번째는,\n공항에 도착하면 체크인보다 먼저 면세 수속부터 하는 것입니다."],[260.484,265.08,"면세품은 가방 하나에 모아 두고, 수속이 끝날 때까지 맡기지 마세요."],[265.08,269.692,"빨간색이 떠서 검사를 받게 되면, 그 가방만 열어 보여 주면 되니까요."],[269.692,273.766,"단말기 앞 줄이 길 때, 그냥 줄만 서 있는 것도 실수입니다."],[273.766,279.834,"단말기가 모자란 공항이라고 가정하면,\n단말기 줄만 선 사람은 약 90분이 걸렸습니다."],[279.834,284.229,"줄을 보고 휴대전화로 바꾼 사람은, 약 3분이면 끝났고요."],[284.229,289.041,"그래서 다섯 번째는, 단말기 줄을 보고 수속 방법을 고르는 것입니다."],[289.041,294.942,"줄이 짧으면 단말기에 여권을 대고,\n길면 전용 와이파이 구역에서 휴대전화로 수속합니다."],[294.942,299.196,"휴대전화로 잘 안 되면, 그때는 단말기로 하면 됩니다."],[299.196,302.196,"그럼 이 방법을 다 지킨 당신은 어땠을까요?"],[302.196,306.214,"같은 날 오후 3시 반, 당신은 나리타 공항에 도착합니다."],[306.214,310.443,"체크인보다 먼저, 줄을 보고 단말기나 휴대전화로 수속합니다."],[310.443,314.308,"화면에 초록색이 뜨면, 그걸로 세관 확인은 끝입니다."],[314.308,318.538,"걸린 시간은 약 2분, 시계는 오후 3시 반을 조금 넘겼습니다."],[318.538,322.306,"이제 면세품 가방도 맡기고, 바로 체크인하면 됩니다."],[322.306,326.568,"돈은 카드로 들어오니, 현금 단말기 줄을 설 필요도 없습니다."],[326.568,329.56,"그럼 운 나쁘게 빨간색이 뜨면 어떻게 될까요?"],[329.56,334.538,"빨간색은 세관이 검사가 필요하다고 본 경우로,\n기준은 공개되지 않았습니다."],[334.538,337.65,"휴대전화로 수속해도 빨간색은 똑같이 뜰 수 있어요."],[337.65,341.975,"이때는 세관 검사장에 가서 산 물건을 직접 보여 줘야 합니다."],[341.975,346.739,"붐비는 시간이라 줄이 길어서, 검사가 끝나면 오후 4시 20분쯤입니다."],[346.739,351.455,"약 50분이 걸렸지만, 출발까지는 아직 1시간 40분이 남습니다."],[351.455,357.116,"그래서 여섯 번째는,\n휴대전화로 수속하더라도 공항에는 시간 여유를 두고 가는 것입니다."],[357.116,360.74,"관광청도 시간에 여유를 두고 공항에 오라고 안내합니다."],[360.74,366.174,"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않습니다."],[366.174,369.989,"그럼 실수를 하나씩 고치면, 시간은 얼마나 달라질까요?"],[369.989,376.501,"빨간색이 뜨는 경우까지 넣어 평균으로 따지면,\n모르고 간 당신은 약 1시간 40분입니다."],[376.501,381.442,"과자만 따로 계산해도,\n세관 창구에 갈 일이 없어 약 50분으로 줄어듭니다."],[381.442,386.1,"같은 조건에서 현금 대신 카드로만 바꿔도, 약 40분이 줄었습니다."],[386.1,389.821,"여섯 가지 방법을 다 지키면, 평균 약 8분이 됩니다."],[389.821,394.366,"반대로 공항이 한산하면, 실수를 해도 약 12분이면 끝났습니다."],[394.366,400.382,"결국 붐비는 시간일수록,\n방법을 아느냐 모르느냐가 1시간 넘는 차이를 만듭니다."],[400.382,405.262,"마지막으로, 가장 빠르게 면세 받는 방법을 정리하겠습니다."],[405.262,408.774,"하나, 출국 전에 비지트 재팬 웹을 설정해 두세요."],[408.774,412.182,"둘, 일본에서 먹거나 쓸 물건은 따로 계산하세요."],[412.182,416.044,"셋, 살 때 환급 방법은 카드로 등록하고, 수수료를 물어보세요."],[416.044,421.245,"넷, 공항에서는 체크인보다 먼저,\n면세품 가방을 맡기기 전에 수속하세요."],[421.245,425.335,"다섯, 단말기 줄을 보고 단말기나 휴대전화로 수속하세요."],[425.335,429.885,"여섯, 빨간색이 뜰 수 있으니, 공항에는 시간 여유를 두고 가세요."],[429.885,433.604,"그리고 산 날부터 90일 안에 출국해야 한다는 것도 잊지 마세요."],[433.604,435.94,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

const uvW = (a, u, v) => { a.g.updateMatrixWorld(true); const c = a.crop; return a.g.localToWorld(V3(((u - c[0]) / (c[2] - c[0]) - a.anchor[0]) * a.wd, (a.anchor[1] - (v - c[1]) / (c[3] - c[1])) * a.ht, 0)); };

const walk = (a, t, t0, t1, dx) => { const k = lin(t, t0, t1); a.op = t < t0 - 0.02 ? 0 : 1; a.g.position.x = a.home.x + dx * (1 - k); if (k > 0 && k < 1) a.g.position.y = a.home.y + 0.1 * Math.abs(Math.sin(q12(t) * Math.PI * 2.2)); return a; };

    if (!v) { f.node.style.display = "none"; continue; }

});
