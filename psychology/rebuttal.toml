# 반론 페르소나 설정 — tools/rebuttal_persona.py v1.0 (심리)
# VERSION: v1.0 — 2026-11-12 — 새로 (사용자 지시 2026-11-12 "근데 각 단계별로 페르소나 검증 다 거친거지?" — 심리 대본에 반론 검토 단계가 없었음).
#          꼴은 stock/rebuttal.toml v1.0. 갈래 = 심리·관계 영상 대본에 들어올 반론의 종류 (Claude 판단 — 갈래는 결국 댓글을 읽고 고름 picks).
#          pattern = 후보를 찾는 낱말(정규식) · question = 대본 검토 때 이 갈래의 반론자가 던질 질문. ※ 연구·교육용 — 진단·치료가 아님.

[candidates]
LANG = "한국어"
MIN_CHARS = 15
TOP = 260
DISAGREE = '아닌|아니죠|아니라|아닙니다|다르|틀리|틀렸|잘못|말이 안|무슨|근데|하지만|그런데|글쎄|과연|\?|왜 |일반화|케바케|사람 나름'
SKIP_TYPES = ["G", "S", "R", "P"]

[[kind]]
code = "K1"
name = "사람마다 다르다 · 일반화"
pattern = '사람마다|사람 나름|케바케|일반화|다 그런 건|다 그렇진|아닌 사람도|경우에 따라|성향|각자|모든 사람'
question = "'이런 사람은 다 ~다'처럼 들리는 문장이 없는가? 예외(그렇지 않은 사람)를 대본이 먼저 인정하는가?"

[[kind]]
code = "K2"
name = "근거 없음 · 유사 과학"
pattern = '근거|출처|논문|연구|과학|유사|사이비|증명|뇌피셜|카더라|통계'
question = "연구를 말할 때 누구를·몇 명·어떻게 조사했는지 말하는가? 연구가 말하지 않은 것(원인·효과)을 연구 결과처럼 말하지 않는가?"

[[kind]]
code = "K3"
name = "부모·피해자 탓"
pattern = '부모 탓|남 탓|피해자|탓하|원망|부모도 힘|부모님도|엄마도|그 시절|그땐'
question = "부모나 상처받은 사람을 탓하는 말로 들리지 않는가? 그 시절 부모의 사정을 인정하는가? 반대로 가해를 감싸 주지도 않는가?"

[[kind]]
code = "K4"
name = "전문가가 아니다 · 진단하지 마라"
pattern = '전문가|의사|진단|병원|상담사|함부로|약|치료|정신과'
question = "진단처럼 들리는 말('당신은 ~장애')이 없는가? 도움을 권하는 문장이 겁주거나 떠넘기지 않는가?"

[[kind]]
code = "K5"
name = "뻔한 말 · 누구나 아는 이야기"
pattern = '뻔한|당연한|누가 몰라|다 아는|좋은 말|하나마나|식상|맨날 같은'
question = "누구나 아는 말만 하고 끝나는 챕터가 없는가? 새로 알게 되는 것(연구·구체 장면·할 말)이 챕터마다 있는가?"

[[kind]]
code = "K6"
name = "나는 반대였다 (반대 경험)"
pattern = '저는 반대|나는 반대|저는 오히려|나는 오히려|저도 그런데|안 그런데|저는 아닌|오히려 저는'
question = "반대 경험을 가진 시청자가 '나는 아닌데'라며 떠나지 않게, 대본이 그런 경우를 짚는가?"

[[kind]]
code = "K7"
name = "원인·결과를 거꾸로 · 단정"
pattern = '때문이 아니|원인|결과|거꾸로|반대로|오히려 그 반대|이유가 아니|그래서가 아니'
question = "'A 때문에 B'를 단정하지 않는가? 설문 연구(한 번 조사)를 원인으로 말하지 않는가?"

[[kind]]
code = "K8"
name = "제목·썸네일 낚시 · 과장"
pattern = '낚시|어그로|제목|썸네일|자극|과장|소름|무조건|팩트'
question = "제목·썸네일이 약속한 것(N가지·특징·이유)을 대본이 정확히 주는가? '소름'·'무조건'처럼 내용보다 센 말이 없는가?"
