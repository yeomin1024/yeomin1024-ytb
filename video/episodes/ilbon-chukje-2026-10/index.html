<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"ilbon-chukje-2026-10","topic":"test","duration":359.24,"audio":"../../../test/source/ilbon-chukje-2026-10/narration.mp3","thumb":null,"synced":"2026-10-20T14:53:22Z","tts":"2026-10-20T14:10:14","script_sha1":"c41f2b5e047a0b57","sent":[{"n":1,"part":"도입","text":"2026년 10월 17일, 일본 에히메현의 전통 축제 '사이조 마쓰리'가 진행되던 도중, 무게 3톤의 가마를 높이 들어 올리던 순간 가마가 떨어졌고, 그 아래 있던 62세 현직 부시장이 깔려 숨졌습니다.","start":0.3,"end":13.8},{"n":2,"part":"도입","text":"이뿐만이 아닙니다.","start":14.2,"end":15.22},{"n":3,"part":"도입","text":"10월 10일, 오사카 단지리 축제에서 교차로를 빠르게 꺾던 수레가 잇따라 넘어져 2명이 숨지고 16명이 다쳤고, 올해 2월 21일엔 오카야마의 알몸 축제에서도 2명이 숨졌죠.","start":15.62,"end":26.666},{"n":4,"part":"도입","text":"언론에 알려진 것만 세어도 일본 축제에선 4개월에 1명꼴로 사람이 숨집니다.","start":27.066,"end":31.786},{"n":5,"part":"도입","text":"그런데도 일본은 이 축제들을 멈추지 않습니다.","start":32.186,"end":34.891},{"n":6,"part":"도입","text":"도대체 왜일까요?","start":35.291,"end":36.39},{"n":7,"part":"도입","text":"네 가지 이유를 알아보겠습니다.","start":36.79,"end":38.447},{"n":8,"part":"첫째, 돈과 관광","text":"가장 단순한 첫 번째 이유는 관광 수입입니다.","start":39.447,"end":42.237},{"n":9,"part":"첫째, 돈과 관광","text":"전통 축제에는 작게는 수만 명, 크게는 수십만 명이 몰립니다.","start":42.637,"end":46.63},{"n":10,"part":"첫째, 돈과 관광","text":"이번 사고가 난 사이조 마쓰리에는 약 8만 명, 오사카 기시와다 단지리 축제에는 50만에서 60만 명이 찾는 것으로 알려져 있습니다.","start":47.03,"end":55.296},{"n":11,"part":"첫째, 돈과 관광","text":"숙박, 음식, 교통까지 지역 경제가 1년 중 가장 크게 살아나는 대목이죠.","start":55.696,"end":60.514},{"n":12,"part":"첫째, 돈과 관광","text":"하지만 이보다 더 중요한 이유는 따로 있습니다.","start":60.914,"end":63.395},{"n":13,"part":"둘째, 동네가 곧 가족","text":"두 번째 이유는 공동체, '동네가 곧 가족'이라는 의식입니다.","start":64.395,"end":68.226},{"n":14,"part":"둘째, 동네가 곧 가족","text":"이런 축제는 동네 단위로 움직입니다.","start":68.626,"end":70.917},{"n":15,"part":"둘째, 동네가 곧 가족","text":"마을마다 가마나 수레를 갖고 1년 내내 축제를 준비하죠.","start":71.317,"end":74.79},{"n":16,"part":"둘째, 동네가 곧 가족","text":"어릴 땐 어린이회에서 줄을 잡고, 커가면서 청년단, 젊은 리더, 그리고 원로인 '세화인'까지 나이에 따라 역할이 올라갑니다.","start":75.19,"end":83.19},{"n":17,"part":"둘째, 동네가 곧 가족","text":"축제에서 맡는 역할이 곧 동네에서의 위치인 셈입니다.","start":83.59,"end":86.733},{"n":18,"part":"둘째, 동네가 곧 가족","text":"한 기시와다 주민은 일본 언론에 \"축제가 지역의 결속과 지역 사랑을 지켜준다\"며 안이한 규제에 반대한다고 말했습니다.","start":87.133,"end":94.142},{"n":19,"part":"둘째, 동네가 곧 가족","text":"이들에게 축제를 멈추라는 건 동네를 해체하라는 말처럼 들리는 겁니다.","start":94.542,"end":98.543},{"n":20,"part":"셋째, 신을 모시는 행사","text":"세 번째 이유는 축제 자체가 신을 모시는 종교 행사라는 점입니다.","start":99.543,"end":103.313},{"n":21,"part":"셋째, 신을 모시는 행사","text":"일본에는 자연 곳곳에 수많은 신이 깃들어 있다고 믿는 고유 신앙 '신토'가 있고, 동네마다 그 지역을 지키는 신을 모신 신사가 있습니다.","start":103.713,"end":112.02},{"n":22,"part":"셋째, 신을 모시는 행사","text":"일본에서 축제는 놀이이기 전에 그 신에게 올리는 의식인 겁니다.","start":112.42,"end":116.32},{"n":23,"part":"셋째, 신을 모시는 행사","text":"축제에서 쓰는 가마와 수레는 단순한 장식이 아닙니다.","start":116.72,"end":119.683},{"n":24,"part":"셋째, 신을 모시는 행사","text":"신에게 바치는 제례 도구이고, 축제 자체가 신사의 종교 행사입니다.","start":120.083,"end":124.478},{"n":25,"part":"셋째, 신을 모시는 행사","text":"그래서 행정도 손대기 어렵습니다.","start":124.878,"end":126.936},{"n":26,"part":"셋째, 신을 모시는 행사","text":"일본 방송 해설에 따르면 종교 행사라서 지자체는 '부탁' 수준의 요청은 할 수 있어도 지도나 중지 명령은 내리기 어렵다고 합니다.","start":127.336,"end":135.155},{"n":27,"part":"넷째, 자기책임 문화","text":"마지막 이유는 '자기책임' 문화입니다.","start":136.155,"end":138.665},{"n":28,"part":"넷째, 자기책임 문화","text":"일본에는 '남에게 폐를 끼치지 말라', '스스로 선택했다면 그 결과도 스스로 감당하라'는 자기책임 문화가 뿌리 깊게 자리 잡고 있습니다.","start":139.065,"end":147.185},{"n":29,"part":"넷째, 자기책임 문화","text":"이런 생각은 축제 현장에서 더 극단적으로 나타납니다.","start":147.585,"end":150.864},{"n":30,"part":"넷째, 자기책임 문화","text":"50년 넘게 기시와다 단지리에 참가해 온 한 원로는 일본 매체 인터뷰에서 이렇게 말했습니다.","start":151.264,"end":156.792},{"n":31,"part":"넷째, 자기책임 문화","text":"\"목숨을 잃는 건 격투기와 같아요. 자기책임입니다.\"","start":157.192,"end":160.522},{"n":32,"part":"넷째, 자기책임 문화","text":"지붕 위에 오르는 역할을 맡을 땐 죽을 위험까지 받아들인다고 했습니다.","start":160.922,"end":165.002},{"n":33,"part":"넷째, 자기책임 문화","text":"동의서 같은 건 쓰지 않는데도요.","start":165.402,"end":167.202},{"n":34,"part":"넷째, 자기책임 문화","text":"더 놀라운 건 그다음입니다.","start":167.602,"end":169.222},{"n":35,"part":"넷째, 자기책임 문화","text":"사고를 낸 집안이 오히려 주변에 사과해야 한다는 분위기가 있느냐는 질문에 그는 \"솔직히, 있다\"고 답하며 이렇게 덧붙였습니다.","start":169.622,"end":177.222},{"n":36,"part":"넷째, 자기책임 문화","text":"\"내가 지붕 위 역할을 하다 죽으면, 부모님은 사과하러 다닐 거라고 생각해요.\"","start":177.622,"end":182.149},{"n":37,"part":"넷째, 자기책임 문화","text":"사망사고를 낸 조는 3년간 축제에 나올 수 없다는 이야기도 전해집니다.","start":182.549,"end":186.596},{"n":38,"part":"넷째, 자기책임 문화","text":"일본의 평론가 마나베 아쓰시는 축제가 원래 죽음의 위험을 감수하며 일상을 깨부수는 장치였다고 분석합니다.","start":186.996,"end":193.552},{"n":39,"part":"넷째, 자기책임 문화","text":"위험이 없으면 축제도 아니라는 거죠.","start":193.952,"end":196.243},{"n":40,"part":"넷째, 자기책임 문화","text":"이런 자기책임론은 현지 반응에서도 그대로 드러납니다.","start":196.643,"end":199.768},{"n":41,"part":"넷째, 자기책임 문화","text":"축제를 옹호하는 사상가 우치다 다쓰루는 \"위험하니까 그만두라는 건, 사고가 많으니 F1을 그만두라는 것과 같다\"며 주변 사람이 말할 일이 아니라고 반박했습니다.","start":200.168,"end":209.518},{"n":42,"part":"넷째, 자기책임 문화","text":"반대로 축제에 비판적인 일본 SNS에선 \"위험한 걸 알고 하는 취미인데 공적 의료보험은 쓰지 마라\", \"치료비는 전액 자비로 내라\"는 말까지 나왔습니다.","start":209.918,"end":219.528},{"n":43,"part":"넷째, 자기책임 문화","text":"지지하는 쪽도, 비판하는 쪽도 결국 '자기책임'이라는 같은 말을 하고 있는 겁니다.","start":219.928,"end":224.679},{"n":44,"part":"다른 목소리","text":"그런데 일본 사람들 모두가 정말 이렇게 생각할까요?","start":225.679,"end":228.881},{"n":45,"part":"다른 목소리","text":"이번 사고 이후 일본에선 전혀 다른 목소리도 터져 나오고 있습니다.","start":229.281,"end":233.211},{"n":46,"part":"다른 목소리","text":"'자기책임'만으로는 설명할 수 없다는 거죠.","start":233.611,"end":236.138},{"n":47,"part":"일본 안에서도 갈린다","text":"지역 안에서도 \"이런 위험한 축제는 중단해야 한다\"는 목소리가 나옵니다.","start":237.138,"end":241.322},{"n":48,"part":"일본 안에서도 갈린다","text":"\"적어도 빠른 속도로 꺾는 방식은 바꿔야 한다\"는 의견도 있죠.","start":241.722,"end":245.518},{"n":49,"part":"일본 안에서도 갈린다","text":"온라인에선 자기책임론 자체를 반박하는 목소리도 나왔습니다.","start":245.918,"end":249.472},{"n":50,"part":"일본 안에서도 갈린다","text":"\"본인이 동의했다고, 자기책임이라고 해서 뭐든 해도 되는 건 아니다.\"","start":249.872,"end":253.882},{"n":51,"part":"일본 안에서도 갈린다","text":"일본 방송 거리 인터뷰에서도 의견이 나왔습니다.","start":254.282,"end":257.293},{"n":52,"part":"일본 안에서도 갈린다","text":"형태를 바꾸는 건 이해하지만, 전통의 의미는 지켜야 한다는 겁니다.","start":257.693,"end":261.629},{"n":53,"part":"일본 안에서도 갈린다","text":"그리고 실제로, 500년 넘게 이어온 전통에 손을 대기로 한 축제까지 나왔습니다.","start":262.029,"end":267.363},{"n":54,"part":"실제로 바뀐 축제","text":"바로 오카야마의 '사이다이지 에요'입니다.","start":268.363,"end":271.032},{"n":55,"part":"실제로 바뀐 축제","text":"500년 넘게 이어온 일본의 대표 알몸 축제입니다.","start":271.432,"end":274.702},{"n":56,"part":"실제로 바뀐 축제","text":"약 1만 명의 남성이 행운의 나무막대 '호기'를 차지하려고 몸싸움을 벌이죠.","start":275.102,"end":279.896},{"n":57,"part":"실제로 바뀐 축제","text":"이게 축제의 하이라이트, '호기 쟁탈전'입니다.","start":280.296,"end":283.294},{"n":58,"part":"실제로 바뀐 축제","text":"올해 2월 21일 밤, 이 몸싸움 도중 3명이 의식을 잃었고 결국 2명이 숨졌습니다.","start":283.694,"end":289.364},{"n":59,"part":"실제로 바뀐 축제","text":"주최 측은 구조 매뉴얼을 만들고 AED도 설치했습니다.","start":289.764,"end":293.24},{"n":60,"part":"실제로 바뀐 축제","text":"음주와 군중 속 다이빙도 금지하는 등 대책을 마련해 왔죠.","start":293.64,"end":297.254},{"n":61,"part":"실제로 바뀐 축제","text":"7월에는 외부 전문가 위원회까지 꾸려 앞으로의 축제 방식을 논의하고 있습니다.","start":297.654,"end":302.43},{"n":62,"part":"실제로 바뀐 축제","text":"그런데도 주최 측은 '재발을 막을 안전 대책이 아직 갖춰지지 않았다'고 판단했습니다.","start":302.83,"end":307.538},{"n":63,"part":"실제로 바뀐 축제","text":"\"전통을 끊어선 안 된다\"는 반대도 있었습니다.","start":307.938,"end":310.466},{"n":64,"part":"실제로 바뀐 축제","text":"결국 9월 29일, 2027년 호기 쟁탈전은 열지 않는 쪽으로 최종 조정에 들어갔습니다.","start":310.866,"end":316.913},{"n":65,"part":"실제로 바뀐 축제","text":"그렇다면 10월에 사망자가 나온 축제들은 어떨까요?","start":317.313,"end":320.365},{"n":66,"part":"실제로 바뀐 축제","text":"오사카 단지리 축제와 사이조 마쓰리는 지금 경찰이 사고 원인을 조사하고 있습니다.","start":320.765,"end":325.785},{"n":67,"part":"실제로 바뀐 축제","text":"아직 운영 방식을 바꾸겠다는 공식 발표는 나오지 않았습니다.","start":326.185,"end":329.915},{"n":68,"part":"실제로 바뀐 축제","text":"사이다이지처럼 변화를 택할지, 지금처럼 이어갈지, 이제 이 축제들의 선택이 남았습니다.","start":330.315,"end":336.324},{"n":69,"part":"정리","text":"정리하면, 일본이 축제를 멈추지 않는 이유는 돈만이 아니었습니다.","start":337.324,"end":341.566},{"n":70,"part":"정리","text":"동네라는 공동체, 신을 모신다는 믿음, 위험까지 자기 몫으로 받아들이는 문화죠.","start":341.966,"end":347.226},{"n":71,"part":"정리","text":"한 나라의 고유한 문화인 만큼 존중해야 합니다.","start":347.626,"end":350.276},{"n":72,"part":"정리","text":"하지만 사람의 목숨이 걸린 일인 만큼, 인명 피해를 줄이기 위한 변화는 필요해 보입니다.","start":350.676,"end":355.961},{"n":73,"part":"정리","text":"시청해주셔서 감사합니다.","start":356.361,"end":357.84}],"subs":[[0.2,6.394,"2026년 10월 17일,\n일본 에히메현의 전통 축제 '사이조 마쓰리'가 진행되던 도중,"],[6.394,14.2,"무게 3톤의 가마를 높이 들어 올리던 순간 가마가 떨어졌고,\n그 아래 있던 62세 현직 부시장이 깔려 숨졌습니다."],[14.2,15.62,"이뿐만이 아닙니다."],[15.62,22.675,"10월 10일, 오사카 단지리 축제에서 교차로를\n빠르게 꺾던 수레가 잇따라 넘어져 2명이 숨지고 16명이 다쳤고,"],[22.675,27.066,"올해 2월 21일엔 오카야마의 알몸 축제에서도 2명이 숨졌죠."],[27.066,32.186,"언론에 알려진 것만 세어도\n일본 축제에선 4개월에 1명꼴로 사람이 숨집니다."],[32.186,35.291,"그런데도 일본은 이 축제들을 멈추지 않습니다."],[35.291,36.79,"도대체 왜일까요?"],[36.79,39.447,"네 가지 이유를 알아보겠습니다."],[39.447,42.637,"가장 단순한 첫 번째 이유는 관광 수입입니다."],[42.637,47.03,"전통 축제에는 작게는 수만 명, 크게는 수십만 명이 몰립니다."],[47.03,50.065,"이번 사고가 난 사이조 마쓰리에는 약 8만 명,"],[50.065,55.696,"오사카 기시와다 단지리 축제에는\n50만에서 60만 명이 찾는 것으로 알려져 있습니다."],[55.696,60.914,"숙박, 음식, 교통까지 지역 경제가 1년 중 가장 크게 살아나는 대목이죠."],[60.914,64.395,"하지만 이보다 더 중요한 이유는 따로 있습니다."],[64.395,68.626,"두 번째 이유는 공동체, '동네가 곧 가족'이라는 의식입니다."],[68.626,71.317,"이런 축제는 동네 단위로 움직입니다."],[71.317,75.19,"마을마다 가마나 수레를 갖고 1년 내내 축제를 준비하죠."],[75.19,83.59,"어릴 땐 어린이회에서 줄을 잡고, 커가면서 청년단, 젊은 리더,\n그리고 원로인 '세화인'까지 나이에 따라 역할이 올라갑니다."],[83.59,87.133,"축제에서 맡는 역할이 곧 동네에서의 위치인 셈입니다."],[87.133,94.542,"한 기시와다 주민은 일본 언론에 \"축제가 지역의 결속과 지역 사랑을\n지켜준다\"며 안이한 규제에 반대한다고 말했습니다."],[94.542,99.543,"이들에게 축제를 멈추라는 건 동네를 해체하라는 말처럼 들리는 겁니다."],[99.543,103.713,"세 번째 이유는 축제 자체가 신을 모시는 종교 행사라는 점입니다."],[103.713,108.886,"일본에는 자연 곳곳에 수많은 신이 깃들어 있다고\n믿는 고유 신앙 '신토'가 있고,"],[108.886,112.42,"동네마다 그 지역을 지키는 신을 모신 신사가 있습니다."],[112.42,116.72,"일본에서 축제는 놀이이기 전에 그 신에게 올리는 의식인 겁니다."],[116.72,120.083,"축제에서 쓰는 가마와 수레는 단순한 장식이 아닙니다."],[120.083,124.878,"신에게 바치는 제례 도구이고, 축제 자체가 신사의 종교 행사입니다."],[124.878,127.336,"그래서 행정도 손대기 어렵습니다."],[127.336,136.155,"일본 방송 해설에 따르면 종교 행사라서 지자체는 '부탁' 수준의\n요청은 할 수 있어도 지도나 중지 명령은 내리기 어렵다고 합니다."],[136.155,139.065,"마지막 이유는 '자기책임' 문화입니다."],[139.065,147.585,"일본에는 '남에게 폐를 끼치지 말라', '스스로 선택했다면 그 결과도\n스스로 감당하라'는 자기책임 문화가 뿌리 깊게 자리 잡고 있습니다."],[147.585,151.264,"이런 생각은 축제 현장에서 더 극단적으로 나타납니다."],[151.264,157.192,"50년 넘게 기시와다 단지리에 참가해 온 한 원로는\n일본 매체 인터뷰에서 이렇게 말했습니다."],[157.192,160.922,"\"목숨을 잃는 건 격투기와 같아요. 자기책임입니다.\""],[160.922,165.402,"지붕 위에 오르는 역할을 맡을 땐 죽을\n위험까지 받아들인다고 했습니다."],[165.402,167.602,"동의서 같은 건 쓰지 않는데도요."],[167.602,169.622,"더 놀라운 건 그다음입니다."],[169.622,177.622,"사고를 낸 집안이 오히려 주변에 사과해야 한다는 분위기가 있느냐는\n질문에 그는 \"솔직히, 있다\"고 답하며 이렇게 덧붙였습니다."],[177.622,182.549,"\"내가 지붕 위 역할을 하다 죽으면,\n부모님은 사과하러 다닐 거라고 생각해요.\""],[182.549,186.996,"사망사고를 낸 조는 3년간 축제에 나올 수 없다는 이야기도 전해집니다."],[186.996,193.952,"일본의 평론가 마나베 아쓰시는 축제가 원래 죽음의 위험을 감수하며\n일상을 깨부수는 장치였다고 분석합니다."],[193.952,196.643,"위험이 없으면 축제도 아니라는 거죠."],[196.643,200.168,"이런 자기책임론은 현지 반응에서도 그대로 드러납니다."],[200.168,204.33,"축제를 옹호하는 사상가 우치다 다쓰루는 \"위험하니까 그만두라는 건,"],[204.33,209.918,"사고가 많으니 F1을 그만두라는 것과 같다\"며\n주변 사람이 말할 일이 아니라고 반박했습니다."],[209.918,216.478,"반대로 축제에 비판적인 일본 SNS에선 \"위험한 걸 알고\n하는 취미인데 공적 의료보험은 쓰지 마라\","],[216.478,219.928,"\"치료비는 전액 자비로 내라\"는 말까지 나왔습니다."],[219.928,225.679,"지지하는 쪽도,\n비판하는 쪽도 결국 '자기책임'이라는 같은 말을 하고 있는 겁니다."],[225.679,229.281,"그런데 일본 사람들 모두가 정말 이렇게 생각할까요?"],[229.281,233.611,"이번 사고 이후 일본에선 전혀 다른 목소리도 터져 나오고 있습니다."],[233.611,237.138,"'자기책임'만으로는 설명할 수 없다는 거죠."],[237.138,241.722,"지역 안에서도 \"이런 위험한 축제는\n중단해야 한다\"는 목소리가 나옵니다."],[241.722,245.918,"\"적어도 빠른 속도로 꺾는 방식은 바꿔야 한다\"는 의견도 있죠."],[245.918,249.872,"온라인에선 자기책임론 자체를 반박하는 목소리도 나왔습니다."],[249.872,254.282,"\"본인이 동의했다고, 자기책임이라고 해서 뭐든 해도 되는 건 아니다.\""],[254.282,257.693,"일본 방송 거리 인터뷰에서도 의견이 나왔습니다."],[257.693,262.029,"형태를 바꾸는 건 이해하지만, 전통의 의미는 지켜야 한다는 겁니다."],[262.029,268.363,"그리고 실제로,\n500년 넘게 이어온 전통에 손을 대기로 한 축제까지 나왔습니다."],[268.363,271.432,"바로 오카야마의 '사이다이지 에요'입니다."],[271.432,275.102,"500년 넘게 이어온 일본의 대표 알몸 축제입니다."],[275.102,280.296,"약 1만 명의 남성이 행운의 나무막대 '호기'를 차지하려고\n몸싸움을 벌이죠."],[280.296,283.694,"이게 축제의 하이라이트, '호기 쟁탈전'입니다."],[283.694,289.764,"올해 2월 21일 밤,\n이 몸싸움 도중 3명이 의식을 잃었고 결국 2명이 숨졌습니다."],[289.764,293.64,"주최 측은 구조 매뉴얼을 만들고 AED도 설치했습니다."],[293.64,297.654,"음주와 군중 속 다이빙도 금지하는 등 대책을 마련해 왔죠."],[297.654,302.83,"7월에는 외부 전문가 위원회까지\n꾸려 앞으로의 축제 방식을 논의하고 있습니다."],[302.83,307.938,"그런데도 주최 측은 '재발을 막을 안전 대책이\n아직 갖춰지지 않았다'고 판단했습니다."],[307.938,310.866,"\"전통을 끊어선 안 된다\"는 반대도 있었습니다."],[310.866,317.313,"결국 9월 29일,\n2027년 호기 쟁탈전은 열지 않는 쪽으로 최종 조정에 들어갔습니다."],[317.313,320.765,"그렇다면 10월에 사망자가 나온 축제들은 어떨까요?"],[320.765,326.185,"오사카 단지리 축제와 사이조 마쓰리는 지금 경찰이 사고\n원인을 조사하고 있습니다."],[326.185,330.315,"아직 운영 방식을 바꾸겠다는 공식 발표는 나오지 않았습니다."],[330.315,337.324,"사이다이지처럼 변화를 택할지, 지금처럼 이어갈지,\n이제 이 축제들의 선택이 남았습니다."],[337.324,341.966,"정리하면, 일본이 축제를 멈추지 않는 이유는 돈만이 아니었습니다."],[341.966,347.626,"동네라는 공동체, 신을 모신다는 믿음,\n위험까지 자기 몫으로 받아들이는 문화죠."],[347.626,350.676,"한 나라의 고유한 문화인 만큼 존중해야 합니다."],[350.676,356.361,"하지만 사람의 목숨이 걸린 일인 만큼,\n인명 피해를 줄이기 위한 변화는 필요해 보입니다."],[356.361,358.24,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

/* P. 10월 축제는? → 변화 vs 유지 (문장 65~68) */
{

    tape = Puppet.canvasPlane(1024, 64, 26, 1.0, (g, w, h) => { g.fillStyle = "#FFD400"; g.fillRect(0, 0, w, h); g.fillStyle = "#1A1A1A"; for (let x = -h; x < w; x += h * 1.4) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h * 0.7, 0); g.lineTo(x + h * 1.4, 0); g.lineTo(x + h * 0.7, h); g.fill(); } });
    tape.rotation.z = -0.05; tape.position.set(0, 1.2, 3.2); st.add(tape, 6);
    st.actors.push({ apply(f) { tape.material.opacity = f * tape.userData.op; } });
  });

    if (t > S(68)) { DJ.sway(t, 0.02, 0.5); FL.sway(t, 0.02, 0.5, 1); }
  };
  const t65 = T(sc, 960, 90, "10월에 사망자가 나온 축제는?", 70);

  pop(no, S(67) + 0.05);

}
