# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 주식 (stock)
# VERSION: v2.0 — 2026-10-12 — 새 stock 폴더용으로 새로 만듦 (사용자 지시: "기존 주제폴더 _backup 붙여서 백업해놓고 stock만 새로 만들어서
#          유튜브 성공사례 분석 코드 돌려서"). 옛 설정은 stock_backup/analyzer_config.toml (v1.0, 9개 그룹 × 10개 = 90개, 대부분 '실패 사연')
#   바뀐 것: ① 키워드 그룹을 '사연'만이 아니라 작은 채널 성공 사례에서 보인 형식까지 넓힘 — 실패하는 사람의 특징·패턴, 투자 심리·습관,
#            ETF·장기투자, 실험·기록 (stock_backup/result/outliers/summary.md 의 15개: '망하는 사람들의 10가지 특징', 'AI로 자동 매매하면',
#            '물린 주식 10년 … 복구 심리', 'ETF … 단타치다 망하는 이유' 등)
#            ② 그룹마다 5개(45개) — 하루 할당량 안에서 전부 검색되게 (옛 90개는 하루에 40개만 수집됨). 그룹의 첫 키워드는
#            tools/outlier_research.py 가 쓰므로 그 그룹을 가장 잘 대표하는 말로 둔다
#            ③ QUOTA_BUDGET 6000 — 같은 키로 outlier_research(--per-group 2, 3,653단위)를 먼저 돌리므로 하루 10,000 안에 둘 다 들어가게
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요).
#    - 글자는 "따옴표" 안에, 목록은 [ "가", "나", ] 처럼 쉼표로 구분, 숫자·true/false 는 그대로, '#' 뒤는 설명
# ▶ 실행(클라우드): bash tools/run_analysis.sh stock      (PC: python youtube_topic_analyzer.py --config stock/analyzer_config.toml)
# ▶ 작은 채널 성공 사례: python3 tools/outlier_research.py stock    (각 그룹의 첫 키워드로 최근 180일 롱폼 검색)
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값 (우선순위: 코드 기본값 < 이 파일 < 명령줄 옵션)
# =====================================================================================================

[topic]
TOPIC = "주식"                       # 분석 주제
PROJECT_FOLDER = "stock"             # 결과 상위 폴더 → PC: output/stock/result/, GitHub: stock/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = []
AUTOCOMPLETE_TOP_N = 10

[KEYWORD_GROUPS]
"1. 투자 실패 사연·경험담" = [
  "주식 투자 실패 사연",
  "주식으로 전재산 잃은 사연",
  "주식 손실 고백",
  "주식 투자 실패 경험담",
  "주식 노후 사연 오디오북",
]
"2. 실패하는 사람의 특징·패턴" = [
  "주식으로 망하는 사람 특징",
  "주식 투자 실패 이유",
  "개미가 주식으로 돈 잃는 이유",
  "주식 초보 실수",
  "주식으로 돈 못 버는 이유",
]
"3. 투자 심리·습관" = [
  "주식 손절 못하는 이유",
  "주식 물타기 실패",
  "주식 복구 심리",
  "주식 뇌동매매",
  "주식 중독",
]
"4. 50·60대와 노후자금" = [
  "노후자금 주식 투자 실패",
  "퇴직금 주식 투자",
  "60대 주식 투자",
  "은퇴 후 주식 투자",
  "연금저축 ETF 투자",
]
"5. ETF·지수·장기투자" = [
  "ETF 장기투자 실패",
  "S&P500 장기투자",
  "적립식 투자 후기",
  "주식 장기투자 10년",
  "배당주 장기투자",
]
"6. 빚투·레버리지·반대매매" = [
  "주식 빚투 실패",
  "신용거래 반대매매",
  "레버리지 ETF 손실",
  "대출받아 주식 투자",
  "주식 미수 깡통",
]
"7. 사기·리딩방" = [
  "주식 리딩방 사기 피해",
  "투자 사기 수법",
  "주식 전문가 사칭 사기",
  "노인 투자 사기",
  "코인 리딩방 사기",
]
"8. 실험·기록·도전" = [
  "AI 주식 자동매매",
  "주식 1년 투자 결과",
  "주식 투자 수익 공개",
  "소액 주식 투자 기록",
  "주식 계좌 공개",
]
"9. 시장 급락·급등과 개미" = [
  "주식 폭락 개미 손실",
  "코스피 폭락",
  "반도체 주식 손실",
  "테마주 투자 실패",
  "미국 주식 손실",
]

[relevance]
RELEVANCE_TERMS = [
  "주식", "주가", "증시", "증권", "코스피", "코스닥", "나스닥", "테마주", "급등주", "작전주", "동전주",
  "우량주", "배당주", "리딩방", "반대매매", "빚투", "신용거래", "공매도", "하한가", "상한가", "주가조작",
  "미공개정보", "투자자문", "증권사", "미국주식", "해외주식", "선물옵션", "상장폐지", "상폐", "깡통계좌", "ETF",
  "S&P500", "S&P 500", "연금저축", "자동매매",
]
RELEVANCE_WEAK_TERMS = [
  "종목", "개미", "상장", "물타기", "손절", "익절", "매수", "매도", "주주", "레버리지", "인버스",
  "깡통", "투자", "재테크", "노후자금", "퇴직금", "지수", "배당", "적립식",
]
RELEVANCE_EXCLUDE = ["주식회사", "(주)", "㈜"]

[ads]
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025       # 좋아요/조회수 < 0.25%
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005   # 댓글/조회수 < 0.05/1,000

[advanced]
QUOTA_BUDGET = 6000                     # outlier_research(2026-10-12 실행: 3,653단위)와 같은 키 — 둘 합쳐 하루 10,000 안 ⚠️ 비용 관련
