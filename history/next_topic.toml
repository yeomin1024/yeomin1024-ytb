# 다음 역사 영상 주제 탐색 설정 — tools/next_topic.py 가 읽음 (심리 psychology/source/next_topic.py v1.1 과 같은 네 단계)
# VERSION: v1.0 — 2026-11-25 — 새로 (사용자 지시 2026-11-25 "심리 주제에서 했던 것처럼 주제탐색에 필요한 4가지 그대로 수행해서 영상 만들 주제 알려줘").
#   네 단계 = 심리 세션 사용자 지시 2026-11-25 "1. 관심 높은 키워드 … 2. 시청자 많이 본 영상 탐색 … 3. 구독자 많은 채널이 많이 다루는 주제 …
#   4. 어떤 주제가 시청자들에게 성공적으로 추천됐는지 …" + "2번에서 최근 7일 동안으로 변경하고 최근 댓글 수로 무게 … 비슷한 주제로 많이 시청한 영상과 겹치면 안돼니까 확인".
# 주제 묶음 = 제목 낱말 규칙 (형태소 분석 아님 — 한 영상이 여러 묶음에 들 수 있음). 낱말은 history/result/outliers/compare.csv 제목과
#   analysis_rules.toml [themes] 를 보고 Claude 가 고름 — 묶음마다 '무엇을 세는지' 이름에 적음.

name = "역사"
anchor_desc = "역사 채널"

[big]
MIN_SUBS = 100000            # 3번 '구독자 많은 채널' = 10만 이상 (심리와 같음)
MIN_TOPIC_VIDEOS = 3         # 지난 탐색에서 주제 관련 영상이 3개 이상 나온 채널만 후보
SHARE = 0.15                 # 최근 1년 롱폼 중 STRICT 낱말 제목 15%+ = '역사 큰 채널' (심리와 같은 값)
DAYS = 365

[filter]
# 주제 관련(compare.csv)이어도 역사 해설 영상이 아닌 것 — 음악·게임·브이로그·뉴스·드라마 클립 (analysis_rules [exclude] 와 겹치는 것은 compare 가 이미 뺌)
# v1.0 (같은 날): 조회수 상위 300개 제목을 Claude 가 읽고 더함 — 영화·드라마 홍보·리뷰 · 아이돌 공연 · 게임 · 시사 뉴스(계엄·전쟁·해고) · 잡학(커피·설거지). 야담·낭독(잠잘 때 듣는 역사)은 역사 장르의 꼴이라 남김
