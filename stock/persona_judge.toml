[[title_feature]]
name = "퍼센트"
re = '\d ?%|퍼센트'
[[title_feature]]
name = "해시태그"
re = '#'
[[title_feature]]
name = "방법(~법·방법·전략)"
re = '방법|하는 ?법|투자법|매매법|대응법|생존법|전략'

# ---------------------------------------------------------------- 댓글 신호 (핵심 묶음 = 뉴스·주제 밖·이벤트 뺀 영상의 시청자 **최상위** 댓글)
# kind: leave = 떠나는 까닭 · keep = 계속 보는 까닭 · trust = 믿음·불신 · click = 제목·썸네일 반응
# 정규식은 2026-11-10 표본을 읽고 다른 뜻('돌려줘'·'차단'·'질질'·'마이크론'·'현실적으로' 등)을 걸러 좁힘 — 그래도 섞임, 원문으로 확인.
[[signal]]
key = "intro_long"
kind = "leave"
name = "서론·앞부분이 길다 / 본론은 뒤에"
re = '서론|본론|전반부가|앞부분이 ?(길|너무)|몇 ?분부터|분부터 보|부터 보세요|부터 보시면|여기부터|부터만 ?시청'
[[signal]]
key = "no_conclusion"
kind = "leave"
name = "결론·핵심이 없다 / 요약해 달라"
re = '결론이 뭐|결론은\?|그래서 결론|결론이 없|결론만 ?(말|얘기)|요약 ?좀|요약해 ?(줘|주세요)|요약 ?부탁|세 ?줄 ?요약|3줄 ?요약|핵심이 뭔|핵심없이|요점(이|을)? ?(뭐|없)|요점 ?정리가 ?필요|뭘 ?사라는|뭐를 ?사라는|하나마나'
[[signal]]
key = "too_long"
kind = "leave"
name = "길다·장황·시간 낭비"
re = '너무 길|길어서 ?(집중|포기|못)|말이 (너무 )?길|(영상|내용|설명)이? ?(너무 )?(길어|깁니다|길다)|시간 ?낭비|시간 ?아깝|장황|늘어지|주절|집중력'
[[signal]]
key = "quit"
kind = "leave"
name = "보다가 껐다·뒤로 가기"
re = '보다가? ?껐|중간에 ?(껐|나갔|끔)|뒤로 ?가기|듣다 ?(껐|말았)|나갈란다|구독 ?(취소|해지)|못 ?들어주겠|듣기 ?싫'
[[signal]]
key = "ad"
kind = "leave"
name = "영상 속 광고·유료 전환 (반감) / 무료라서 고맙다"
