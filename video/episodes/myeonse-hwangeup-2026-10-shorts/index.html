  let CA, QA, P;
  const s = ST.set(a, b, st => { bgOf(st, "AIR"); CA = act(st, "CASH", { h: 3.0, at: [4.4, 0, -0.2] }).ro(2); QA = act(st, "QA", { h: 3.6, at: [-0.6, 0, 0] }).ro(3); P = act(st, "YOU_T", { h: 4.0, at: [-4.2, 0, 0.5] }).ro(4); },
    { cam: (t) => { const k = sm(lin(t, a, S(6))); return { pos: [lerp(1.6, -1.4, k), 2.9, 15], look: [lerp(1.6, -1.4, k), 2.57, 0] }; } });
  s.update = t => { QA.slide(t, a + 0.1, 0.7, 10); idle(QA, t); idle(P, t, 1); s.tint.copy(WARM).lerp(DARK, seg(t, S(6) - 0.1, S(6) + 0.3) * 0.6); };
  nm(s, sc, () => P, "B", S(6) - 0.3);   // 카메라가 B씨 쪽으로 온 뒤
  const h5 = head(sc, 300, "세금은 현금으로 받기로 해서", "현금 단말기 줄도", R, 100); pop(h5, S(5) + 0.05); out(h5, S(6) - 0.1);
  pop(head(sc, 300, "붐비는 시간이라면 · 면세에만", "2시간 넘게", R, 130), S(6) + 0.05);
  K.cut(E(5) - 0.1, "현금 단말기 줄");
  K.cut(E(6) - 0.1, "면세에만 2시간 넘게");
}
/* S-07 같은 시간에 도착한 A씨 → 휴대전화 → 2분 정도 (문장 7) */
{
  const a = until(7), b = until(8);
  const sc = K.scene(a, b);
  let WI, P;
  const s = ST.set(a, b, st => { bgOf(st, "AIR"); WI = act(st, "WIFI", { h: 3.6, at: [-2.6, 0, -0.4] }).ro(2); P = act(st, "A_P", { h: 4.2, at: [0.6, 0, 0.6], flip: true }).ro(4); });
  s.update = t => { idle(P, t); walk(P, t, a + 0.05, a + 1.3, 6); };
  nm(s, sc, () => P, "A", a + 1.4);
  signal(s, sc, () => P, true, W(7, "2분") - 0.3);
  pop(head(sc, 300, "같은 시간에 도착한 A씨 · 휴대전화로", "2분 정도", G, 130), S(7) + 0.05);
  K.cut(E(7) - 0.1, "A씨 2분 정도");
}
/* S-08 차이는 여행 가기 전과 쇼핑할 때 (문장 8) */
{
  const a = until(8), b = until(9), sw = W(8, "쇼핑할");
  const sc = K.scene(a, b);
  let PH, PS, RG, P;
  const s1 = ST.set(a, sw, st => { bgOf(st, "PAPER"); PH = act(st, "PHONE", { h: 3.6, at: [1.2, 0.3, 0.4] }).ro(4); PS = act(st, "PASS", { h: 1.5, at: [3.4, 0.6, 0.8] }).ro(5); }, { fadeOut: 0.3 });
  s1.update = t => { PH.pop(t, a + 0.1, 0.4); PS.pop(t, a + 0.3, 0.4); };
  const s2 = ST.set(sw, b, st => { bgOf(st, "STORE"); RG = act(st, "REG", { h: 3.0, at: [2.0, 0, 0] }).ro(2); P = act(st, "A_P", { h: 4.0, at: [-2.6, 0, 0.6] }).ro(4); }, { fadeIn: 0.3 });
  s2.update = t => idle(P, t);
  pop(head(sc, 300, "두 사람의 차이는", "여행 가기 전", Y, 104), S(8) + 0.05);
  pop(el(`<div class="a cx c w9 nw" style="left:540px;top:540px;font-size:76px">+ <span class="Y">쇼핑할 때</span> 이미</div>`, sc), sw + 0.05);
  K.cut(sw - 0.15, "여행 가기 전");
  K.cut(E(8) - 0.1, "+ 쇼핑할 때");
}
/* S-09~10 2분으로 줄이려면? → 그 방법은 아래 영상에서 → 관련 동영상 버튼 (문장 9~10) */
{
  const a = until(9), b = K.D;
  const sc = K.scene(a, b, { keep: true });
  let KI, P;
  const s = ST.set(a, b, st => { bgOf(st, "AIR"); KI = act(st, "KIOSK", { h: 4.2, at: [1.8, 0, 0] }).ro(2); P = act(st, "A_P", { h: 4.2, at: [-0.4, 0, 0.6] }).ro(4); }, { fadeOut: 0 });
  s.update = t => idle(P, t);
  signal(s, sc, () => KI, true, S(9) + 0.3);
  const h9 = head(sc, 300, "면세 받는 시간을", "2분으로 줄이려면?", Y, 104); pop(h9, S(9) + 0.05); out(h9, S(10) - 0.1);
  pop(el(`<div class="a cx c w9 nw" style="left:540px;top:200px;font-size:76px">가장 빠르게 <span class="Y">면세 받는 방법</span></div>`, sc), S(10) + 0.05);
  K.related(sc, { at: S(10) + 0.05, arrowAt: W(10, "아래") });
  K.cut(E(9) - 0.1, "2분으로 줄이려면?");
  K.cut(E(10) - 0.1, "그 방법은 아래 영상 · 관련 동영상 ↓");
  K.cut(K.D - 0.3, "끝 화면 (관련 동영상 버튼 ↓)");
}
K.done();
})();
