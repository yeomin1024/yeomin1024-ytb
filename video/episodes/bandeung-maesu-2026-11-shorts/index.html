    const pxPer = (X1 - X0) / r, lab = c.labelsOut ? Math.max(0, Math.min(1, (pxPer - 12) / 8)) : 1;   // 줄였을 때 글자가 겹치면 글자만 숨김 (점은 남김)
    let bought = 0;
    for (const mk of c.marks) {
      const on = f >= mk.i - 1e-6, x = c.xOf(mk.i, r), y = c.yOf(c.rows[mk.i][1]);
      mk.g.setAttribute("opacity", on ? 1 : 0); if (on && mk.buy) bought++;
      mk.c.setAttribute("cx", x); mk.c.setAttribute("cy", y);
      mk.t.setAttribute("x", x + mk.dx); mk.t.setAttribute("y", y + mk.dy); mk.t.setAttribute("opacity", lab);
    }
    if (c.val) {
      const mv = c.rows[Math.min(c.n - 1, m)][c.col];
      c.val.textContent = won(mv);
      c.val.parentNode.style.borderColor = c.val.style.color = mv > CAP + 1 ? TL : mv < CAP - 1 ? RD : WH;
    }
    if (c.blk) c.blk.els.forEach((el, i) => {
      const on = c.allIn ? bought > 0 : i < bought;
      el.style.backgroundColor = on ? c.blkColor : "rgba(255,255,255,0)";
      el.style.borderColor = on ? c.blkColor : "#56627F";
    });
  }
});
function PATH(c, i0, f, r) {
  const m = Math.floor(f); let d = "";
  for (let i = i0; i <= Math.min(m, c.n - 1); i++) d += (i === i0 ? "M" : "L") + c.xOf(i, r).toFixed(1) + " " + c.yOf(c.rows[i][1]).toFixed(1);
  if (f > m && m + 1 < c.n) { const u = f - m; d += "L" + (c.xOf(m, r) + (c.xOf(m + 1, r) - c.xOf(m, r)) * u).toFixed(1) + " " + c.yOf(c.rows[m][1] + (c.rows[m + 1][1] - c.rows[m][1]) * u).toFixed(1); }
  return d;
}
// 계단 모양 (규칙만 보여 주는 그림 — 실제 종가 아님): 기준선 −10%~−40% (글자 = 왼쪽) · 선은 가운데 · 기준을 넘을 때마다 BUY

  const VR = [50, 104], xs = i => X0 + 170 + i / 17 * (X1 - X0 - 250), ys = v => YB + (v - VR[0]) / (VR[1] - VR[0]) * (YT - YB);
  const d = P.map(([i, v], k) => (k ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v).toFixed(1)).join("");
  const cross = [0, 5, 9, 13, 17];
  const svg = later(`<svg class="a" data-slot="CHART" viewBox="0 0 1080 691" width="1080" height="691" style="left:0;top:${MID}px" aria-hidden="true">
    ${[90, 80, 70, 60].map(v => `<line x1="${X0}" x2="${X1}" y1="${ys(v)}" y2="${ys(v)}" stroke="${YL}" stroke-width="5" stroke-dasharray="16 12"/>
      <text x="${X0}" y="${ys(v) - 12}" font-family="Noto Sans KR" font-weight="900" font-size="38" fill="${YL}" stroke="#0A0F1E" stroke-width="7" paint-order="stroke">−${100 - v}%</text>`).join("")}
    <path class="st" d="${d}" fill="none" stroke="${WH}" stroke-width="8" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${full ? 0 : 1}"/>
    ${cross.map((i, k) => `<g class="b${k}" opacity="${full ? 1 : 0}"><circle cx="${xs(i)}" cy="${ys(P[i][1])}" r="17" fill="${TL}" stroke="#fff" stroke-width="5"/>
      <text x="${xs(i)}" y="${ys(P[i][1]) + 60}" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="38" fill="${TL}" stroke="#0A0F1E" stroke-width="8" paint-order="stroke">BUY</text></g>`).join("")}
  </svg>`, sc);
  return { svg, path: svg.querySelector(".st"), dots: cross.map((_, k) => svg.querySelector(".b" + k)), cross };
}
function valPill(sc, c) {
  const [x, y, w, h] = LAY.VAL;

}
