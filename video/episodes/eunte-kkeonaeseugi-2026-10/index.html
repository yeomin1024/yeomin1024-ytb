text":"한 달 150만 원씩 12개월이니까, 1년에 1,800만 원이죠.","start":66.671,"end":70.866},{"n":19,"part":"두 부부의 통장","text":"모아 둔 5억 원은 남편 퇴직금 2억 원, 연금저축 1억 원, 정기예금 2억 원입니다.","start":71.316,"end":76.568},{"n":20,"part":"두 부부의 통장","text":"연금저축은 남편이 6천만 원, 아내가 4천만 원이고, 예금은 한 사람에 1억 원씩이에요.","start":77.018,"end":82.723},{"n":21,"part":"두 부부의 통장","text":"예금 금리는 3.5%이고, 물가도 그만큼 오른다고 봤습니다.","start":83.173,"end":87.42},{"n":22,"part":"두 부부의 통장","text":"A 부부는 퇴직금을 한 번에 받아 남편 이름의 예금에 넣고, 생활비는 남편 연금저축에서 먼저 꺼냅니다.","start":87.87,"end":94.382},{"n":23,"part":"두 부부의 통장","text":"B 부부는 퇴직금을 한 번에 받지 않고 개인형 퇴직연금인 IRP에 넣어 두고, 꺼내는 순서를 정했습니다.","start":94.832,"end":101.495},{"n":24,"part":"두 부부의 통장","text":"두 부부의 차이는 세 가지 원칙에서 나옵니다.","start":101.945,"end":104.583},{"n":25,"part":"두 부부의 통장","text":"하나씩 보겠습니다.","start":105.033,"end":106.161},{"n":26,"part":"원칙 하나, 기준은 한 사람씩","text":"첫 번째 원칙은, 세금과 건보료는 부부가 아니라 한 사람씩, 1년 단위로 따진다는 것입니다.","start":107.161,"end":113.017},{"n":27,"part":"원칙 하나, 기준은 한 사람씩","text":"꼭 기억하실 기준은 세 가지입니다.","start":113.467,"end":115.501},{"n":28,"part":"원칙 하나, 기준은 한 사람씩","text":"먼저 이자와 배당 기준은 1년에 1,000만 원입니다.","start":115.951,"end":118.99},{"n":29,"part":"원칙 하나, 기준은 한 사람씩","text":"세금이 아니라 건보료 기준이에요.","start":119.44,"end":121.474},{"n":30,"part":"원칙 하나, 기준은 한 사람씩","text":"다음으로 연금저축에서 꺼내는 돈의 기준은 1년에 1,500만 원입니다.","start":121.924,"end":126.473},{"n":31,"part":"원칙 하나, 기준은 한 사람씩","text":"세액공제를 받은 돈과 그 수익만 셉니다.","start":126.923,"end":129.259},{"n":32,"part":"원칙 하나, 기준은 한 사람씩","text":"마지막으로 피부양자로 남을 수 있는 소득 기준은 1년에 2,000만 원입니다.","start":129.709,"end":134.409},{"n":33,"part":"원칙 하나, 기준은 한 사람씩","text":"국민연금은 전부 여기에 들어갑니다.","start":134.859,"end":137.044},{"n":34,"part":"원칙 하나, 기준은 한 사람씩","text":"재산이 많으면 이 피부양자 기준은 더 낮아집니다.","start":137.494,"end":140.434},{"n":35,"part":"원칙 하나, 기준은 한 사람씩","text":"그리고 이게 중요합니다.","start":140.884,"end":142.314},{"n":36,"part":"원칙 하나, 기준은 한 사람씩","text":"기준을 넘으면, 넘은 만큼이 아니라 전부가 소득으로 잡힙니다.","start":142.764,"end":146.709},{"n":37,"part":"원칙 하나, 기준은 한 사람씩","text":"예를 들어 이자가 1년에 1,010만 원이면, 넘은 10만 원이 아니라 1,010만 원이 전부 건보료 소득으로 잡힙니다.","start":147.159,"end":154.322},{"n":38,"part":"원칙 하나, 기준은 한 사람씩","text":"A 부부 남편은 퇴직금까지 넣은 예금 3억 원에서, 1년 이자가 1,050만 원 나옵니다.","start":154.772,"end":160.477},{"n":39,"part":"원칙 하나, 기준은 한 사람씩","text":"이자 기준 1,000만 원을 넘었으니, 1,050만 원이 전부 소득으로 잡힙니다.","start":160.927,"end":165.825},{"n":40,"part":"원칙 하나, 기준은 한 사람씩","text":"여기에 1년치 국민연금 1,320만 원을 더하면 2,370만 원이 되어, 피부양자 기준 2,000만 원을 넘습니다.","start":166.275,"end":174.292},{"n":41,"part":"원칙 하나, 기준은 한 사람씩","text":"연금저축에서 꺼낸 1,800만 원도 연금저축 기준 1,500만 원을 넘어서, 피부양자 소득에 또 더해집니다.","start":174.742,"end":181.754},{"n":42,"part":"원칙 하나, 기준은 한 사람씩","text":"부부는 두 사람 모두 피부양자 기준 2,000만 원을 넘지 않아야 해서, 남편 때문에 아내까지 같이 피부양자에서 빠집니다.","start":182.204,"end":189.721},{"n":43,"part":"원칙 하나, 기준은 한 사람씩","text":"게다가 건보료 고지서는 다음 해에 나와서, 모르고 지나가기 쉽습니다.","start":190.171,"end":194.569},{"n":44,"part":"원칙 하나, 기준은 한 사람씩","text":"기준은 사람마다 따로 있는 바구니라고 보시면 됩니다.","start":195.019,"end":198.261},{"n":45,"part":"원칙 하나, 기준은 한 사람씩","text":"한 바구니에 몰아 담으면 넘치고, 두 바구니에 나눠 담으면 넘치지 않습니다.","start":198.711,"end":203.411},{"n":46,"part":"원칙 하나, 기준은 한 사람씩","text":"세금도 마찬가지입니다.","start":203.861,"end":205.291},{"n":47,"part":"원칙 하나, 기준은 한 사람씩","text":"연금저축에서 1,800만 원을 남편 혼자 꺼내면 세금이 약 118만 원입니다.","start":205.741,"end":210.592},{"n":48,"part":"원칙 하나, 기준은 한 사람씩","text":"남편이 1,000만 원, 아내가 800만 원씩 나눠 꺼내면 세금이 약 78만 원입니다.","start":211.042,"end":216.143},{"n":49,"part":"원칙 하나, 기준은 한 사람씩","text":"한마디로, 돈은 부부 각자 이름으로 넣고, 해마다 나눠 꺼내야 합니다.","start":216.593,"end":221.09},{"n":50,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"두 번째 원칙은, 연금계좌 안에 둔 돈은 꺼낼 때 세금을 낸다는 것입니다.","start":222.09,"end":226.488},{"n":51,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"연금저축이나 IRP 안에서는 이자와 배당이 생겨도, 그해에는 세금도 건보료도 붙지 않습니다.","start":226.938,"end":233.148},{"n":52,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"물론 꺼낼 때는 세금을 냅니다.","start":233.598,"end":235.33},{"n":53,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"하지만 한 사람이 1년에 1,500만 원 이하로 꺼내면, 세금은 나이에 따라 5.5%에서 3.3%뿐이고, 피부양자 소득에도 들어가지 않습니다.","start":235.78,"end":245.812},{"n":54,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"반대로 일반 예금은 1억 원이면 1년 이자가 350만 원이고, 여기서 해마다 세금이 약 54만 원 나갑니다.","start":246.262,"end":253.227},{"n":55,"part":"원칙 둘, 연금계좌 돈은 꺼낼 때 세금","text":"한마디로, 해마다 세금이 붙는 예금을 먼저 쓰고, 연금계좌는 나중에 씁니다.","start":253.677,"end":258.627},{"n":56,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"세 번째 원칙은, 퇴직금은 연금으로 오래 나눠 받는다는 것입니다.","start":259.627,"end":263.723},{"n":57,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"퇴직금을 연금으로 받으면 퇴직소득세를 깎아 주는데, 받은 지 10년째까지는 30%, 11년째부터는 40%, 21년째부터는 50%를 깎아 줍니다.","start":264.173,"end":274.96},{"n":58,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"게다가 퇴직금으로 받는 연금은 금액과 상관없이, 연금저축 1,500만 원 기준에도, 피부양자 소득에도 들어가지 않습니다.","start":275.41,"end":283.479},{"n":59,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"여기서 꼭 알아 두실 게 있어요.","start":283.929,"end":285.661},{"n":60,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"10년째, 11년째는 IRP에 넣은 해부터가 아니라, 실제로 연금을 받은 해만 셉니다.","start":286.111,"end":291.816},{"n":61,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"그래서 당장 필요 없어도, 첫해부터 1년에 100만 원씩이라도 받아 두는 게 좋습니다.","start":292.266,"end":297.419},{"n":62,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"A 부부는 퇴직금을 한 번에 받아서, 세금을 깎아 주는 혜택을 하나도 못 받았어요.","start":297.869,"end":303.022},{"n":63,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"한마디로, 퇴직금은 한 번에 받지 말고 IRP에 넣어 두세요.","start":303.472,"end":307.417},{"n":64,"part":"원칙 셋, 퇴직금은 연금으로 첫해부터","text":"그럼 이 세 가지 원칙으로 꺼내는 순서를 정해 보겠습니다.","start":307.867,"end":311.26},{"n":65,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"1단계, 65세부터 74세까지는 예금에서 1년에 1,700만 원, IRP에서 100만 원, 합쳐서 1,800만 원을 꺼냅니다.","start":312.26,"end":320.98},{"n":66,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"예금은 1년치 생활비만 비상금으로 남깁니다.","start":321.43,"end":324.219},{"n":67,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"2단계, 75세부터 84세까지는 IRP 퇴직금에서 1년에 1,800만 원씩 꺼냅니다.","start":324.669,"end":330.827},{"n":68,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"연금을 받은 지 11년째부터라, 퇴직소득세를 40% 깎아 줍니다.","start":331.277,"end":335.826},{"n":69,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"3단계, 85세쯤 남은 퇴직금과 비상금을 다 쓰면, 그다음에 연금저축을 꺼냅니다.","start":336.276,"end":341.83},{"n":70,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"나이가 들수록 세율이 3.3%까지 낮아지니까, 연금저축은 맨 나중입니다.","start":342.28,"end":347.433},{"n":71,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"이때도 남편이 1,000만 원, 아내가 800만 원씩 나눠 꺼내서, 한 사람 연금저축 기준 1,500만 원을 넘지 않게 합니다.","start":347.883,"end":355.447},{"n":72,"part":"꺼내는 순서, 예금 → 퇴직금 → 연금저축","text":"그럼 두 부부의 결과는 얼마나 달라졌을까요?","start":355.897,"end":358.535},{"n":73,"part":"두 부부의 결과","text":"65세 첫해 세금은 A 부부가 334만 원, B 부부가 108만 원입니다.","start":359.535,"end":364.537},{"n":74,"part":"두 부부의 결과","text":"A 부부는 예금 4억 원의 이자 세금에 연금저축 세금까지 냈고, B 부부는 예금 2억 원의 이자 세금만 냈기 때문입니다.","start":364.987,"end":372.405},{"n":75,"part":"두 부부의 결과","text":"평생 세금을 합치면 A 부부가 약 3,890만 원, B 부부가 약 1,790만 원으로, 약 2,100만 원 차이입니다.","start":372.855,"end":381.122},{"n":76,"part":"두 부부의 결과","text":"B 부부가 나중에 낼 세금까지 넣고, 건보료와 퇴직소득세는 뺀 숫자예요.","start":381.572,"end":386.121},{"n":77,"part":"두 부부의 결과","text":"피부양자 기준은 A 부부만 5년 동안 넘었고, 아낀 세금만큼 모아 둔 돈도 B 부부가 1년 2개월 더 오래 갑니다.","start":386.571,"end":393.536},{"n":78,"part":"두 부부의 결과","text":"그런데 이미 A 부부처럼 꺼내고 계신 분들도 계실 텐데요.","start":393.986,"end":397.53},{"n":79,"part":"두 부부의 결과","text":"그럼 어떻게 해야 할까요?","start":397.98,"end":399.41},{"n":80,"part":"이미 A 부부처럼 꺼내고 있다면","text":"늦지 않았습니다.","start":400.41,"end":401.387},{"n":81,"part":"이미 A 부부처럼 꺼내고 있다면","text":"평생 2천만 원 차이는, 끝까지 순서를 안 고칠 때의 숫자거든요.","start":401.837,"end":405.782},{"n":82,"part":"이미 A 부부처럼 꺼내고 있다면","text":"퇴직금을 받은 지 60일이 안 됐다면 IRP에 넣으세요.","start":406.232,"end":409.776},{"n":83,"part":"이미 A 부부처럼 꺼내고 있다면","text":"이미 낸 퇴직소득세를 돌려받고, 연금으로 받을 수 있습니다.","start":410.226,"end":414.02},{"n":84,"part":"이미 A 부부처럼 꺼내고 있다면","text":"60일이 지났어도, 꺼내는 순서는 지금 고칠 수 있습니다.","start":414.47,"end":418.113},{"n":85,"part":"이미 A 부부처럼 꺼내고 있다면","text":"남편 이름의 예금 일부를 아내 이름으로 옮기고, 다음 해부터 예금을 먼저 쓰세요.","start":418.563,"end":423.565},{"n":86,"part":"이미 A 부부처럼 꺼내고 있다면","text":"배우자에게는 10년에 6억 원까지 증여세가 없습니다.","start":424.015,"end":427.257},{"n":87,"part":"이미 A 부부처럼 꺼내고 있다면","text":"A 부부가 65세 말에 이렇게 고치면, 평생 세금 차이는 2,100만 원에서 약 1,300만 원으로, 피부양자에서 빠지는 기간은 5년에서 1년으로 줄어요.","start":427.707,"end":437.989},{"n":88,"part":"이미 A 부부처럼 꺼내고 있다면","text":"빨리 고칠수록 좋습니다.","start":438.439,"end":439.869},{"n":89,"part":"이미 A 부부처럼 꺼내고 있다면","text":"이 예에서 70세에 고치면, 연금저축을 이미 다 꺼낸 뒤라 차이가 줄지 않거든요.","start":440.319,"end":445.321},{"n":90,"part":"이미 A 부부처럼 꺼내고 있다면","text":"다만 건보료는 전년도 소득으로 정해서, 고친 다음 해에 고지서가 한 번 더 나올 수 있어요.","start":445.771,"end":451.226},{"n":91,"part":"이미 A 부부처럼 꺼내고 있다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":451.676,"end":454.564},{"n":92,"part":"정리, 바뀌어도 그대로인 것","text":"기준 금액이나 세금을 깎아 주는 비율, 연금계좌에서 받는 돈에 건보료를 매길지는 앞으로 바뀔 수 있습니다.","start":455.564,"end":462.227},{"n":93,"part":"정리, 바뀌어도 그대로인 것","text":"그래도 이 세 가지는 그대로입니다.","start":462.677,"end":464.711},{"n":94,"part":"정리, 바뀌어도 그대로인 것","text":"첫째, 기준은 한 사람씩, 1년 단위입니다.","start":465.161,"end":467.997},{"n":95,"part":"정리, 바뀌어도 그대로인 것","text":"부부가 나눠 넣고 나눠 꺼내세요.","start":468.447,"end":470.33},{"n":96,"part":"정리, 바뀌어도 그대로인 것","text":"둘째, 세금이 해마다 붙는 예금을 먼저 쓰고, 연금계좌는 나중에 쓰세요.","start":470.78,"end":475.428},{"n":97,"part":"정리, 바뀌어도 그대로인 것","text":"셋째, 퇴직금은 연금으로, 첫해부터 조금씩 오래 받으세요.","start":475.878,"end":479.771},{"n":98,"part":"정리, 바뀌어도 그대로인 것","text":"오늘 부부 각자의 1년 이자가 얼마인지부터 한번 확인해 보세요.","start":480.221,"end":484.067},{"n":99,"part":"정리, 바뀌어도 그대로인 것","text":"시청해주셔서 감사합니다.","start":484.517,"end":486.098}],"subs":[[0.3,2.455,"지금 퇴직금이나 연금저축을 갖고"],[2.455,5.302,"은퇴를 앞두고 계시다면, 이 숫자부터 보세요."],[5.752,8.088,"같은 5억 원을 가진 두 부부가 있습니다."],[8.538,13.993,"그런데 65세 첫해 세금이 한 부부는 334만 원, 다른 부부는 108만 원입니다."],[14.443,15.873,"왜 이렇게 차이가 날까요?"],[16.323,18.357,"상품이나 수익률 때문이 아닙니다."],[18.807,20.992,"돈을 꺼내는 순서가 달랐을 뿐입니다."],[21.442,24.898,"세금 차이는 은퇴 후 10년 동안 한 달에 15만 원이 넘고,"],[24.898,27.048,"평생 합치면 약 2천만 원이 됩니다."],[27.498,31.797,"게다가 한 부부는 5년 동안 자녀 건강보험의 피부양자에서도 빠집니다."],[32.247,33.979,"결론부터 말씀드리겠습니다."],[34.429,38.624,"예금부터 쓰고, 연금계좌는 나중에 쓰고, 부부가 나눠서 꺼낸다."],[39.074,40.051,"이 세 가지입니다."],[40.501,43.473,"이미 다른 순서로 꺼내고 계신 분이 어떻게 고치면"],[43.473,4
