// 소품 그림 — 알파 상자만 보이게 잘라 높이 h(px)로 (2편 롱폼 PROP 와 같은 상자)
const PROP = { "P-BANKBOOK": [DDIR, 1024, 1024, [0.175, 0.222, 0.825, 0.777]], "P-COINS": [E1DIR, 1024, 1024, [0.1, 0.251, 0.899, 0.749]] };
function prop(name, h, cls) {
  const [dir, NW, NH, [x0, y0, x1, y1]] = PROP[name];
  const k = h / ((y1 - y0) * NH), w = Math.round((x1 - x0) * NW * k);
  return `<div class="${cls || ""}" style="position:relative;flex:0 0 auto;width:${w}px;height:${Math.round(h)}px;overflow:hidden"><img src="${dir}${name}.png" alt="" style="position:absolute;left:${-Math.round(x0 * NW * k)}px;top:${-Math.round(y0 * NH * k)}px;width:${Math.round(NW * k)}px;height:${Math.round(NH * k)}px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))"></div>`;
}

// ---------- 생각 말풍선 (SVG 구름 + 꼬리 동그라미 — 겉 테두리 색은 .ol 하나로 바꿈 · 2편 롱폼 cloudSVG 그대로) ----------
let SEED = 11;
function cloudSVG(Wd, Ht, body, tails, fill, stroke, sw) {
  const [bx, by, bw, bh] = body, R = Math.min(64, Math.min(bw, bh) * 0.21), s = SEED++;
  const C0 = [], rr = k => R * (0.86 + 0.14 * rnd(s, k));
  const nx = Math.max(1, Math.ceil((bw - 2 * R) / (1.25 * R))), ny = Math.max(1, Math.ceil((bh - 2 * R) / (1.25 * R)));
  for (let i = 0; i <= nx; i++) { const x = bx + R + (bw - 2 * R) * i / nx; C0.push([x, by + R, rr(i)], [x, by + bh - R, rr(i + 50)]); }
  for (let j = 1; j < ny; j++) { const y = by + R + (bh - 2 * R) * j / ny; C0.push([bx + R, y, rr(j + 100)], [bx + bw - R, y, rr(j + 150)]); }
  const cs = (list, inf) => list.map(([x, y, r]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r + inf).toFixed(1)}"/>`).join("");
  const rect = inf => `<rect x="${(bx + R * 0.6 - inf).toFixed(1)}" y="${(by + R * 0.6 - inf).toFixed(1)}" width="${(bw - 1.2 * R + 2 * inf).toFixed(1)}" height="${(bh - 1.2 * R + 2 * inf).toFixed(1)}" rx="${(R * 0.5).toFixed(1)}"/>`;
  return `<svg class="cl" viewBox="0 0 ${Wd} ${Ht}" width="${Wd}" height="${Ht}" aria-hidden="true"><g class="ol" style="fill:${stroke}">${cs(C0, sw)}${cs(tails, sw)}${rect(sw)}</g><g style="fill:${fill}">${cs(C0, 0)}${cs(tails, 0)}${rect(0)}</g></svg>`;
}
// 몸통 · 꼬리 (칸 안 좌표) — 꼬리 끝 = 주인공 머리 바로 위 (가운데 주인공 머리 = 화면 (540, 735) · 끝 장면 주인공 머리 = (761, 805))
const BUB_BODY = [8, 8, 964, 400], BUB_TAILS = [[490, 432, 25], [497, 480, 17], [502, 515, 10]];
const END_BODY = [8, 8, 984, 470], END_TAILS = [[640, 507, 25], [674, 551, 17], [700, 582, 10]];
function bubble(sc, slot, o) {
  const [X, Y, Wd, Ht] = LAY[slot];
  const body = o.body || BUB_BODY, tails = o.tails || BUB_TAILS;
  const pad = o.pad || [70, 46], cb = [body[0] + pad[0], body[1] + pad[1], body[2] - 2 * pad[0], body[3] - 2 * pad[1]];
  const d = el(`<div class="a bub" data-slot="${slot}" style="left:${X}px;top:${Y}px;width:${Wd}px;height:${Ht}px">${cloudSVG(Wd, Ht, body, tails, CREAM, INK, 7)}<div class="bin" style="left:${cb[0]}px;top:${cb[1]}px;width:${cb[2]}px;height:${cb[3]}px;${o.css || ""}">${o.html || ""}</div></div>`, sc);
  d._x = X; d._y = Y; d._w = Wd; d._h = Ht; d.bin = d.querySelector(".bin"); d.ol = d.querySelector(".ol");
  d.bin._x = X + cb[0]; d.bin._y = Y + cb[1]; d.bin._w = cb[2]; d.bin._h = cb[3];
  const tip = tails[tails.length - 1];
  gsap.set(d, { transformOrigin: `${tip[0].toFixed(0)}px ${tip[1].toFixed(0)}px` });       // 머리 쪽 꼬리 끝에서 부풀어 나옴
  if (o.at != null) tl.fromTo(d, { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, o.at);
  return d;
}
const olTo = (d, c, at) => tl.to(d.ol, { fill: c, duration: 0.3 }, at);
const badge = (d, sym, cls, at) => { const n = el(`<div class="okb${cls ? " " + cls : ""}" style="left:${d._w - 150}px;top:-6px">${sym}</div>`, d); popIn(n, at, { s0: 0.3 }); return n; };
// 말풍선 안 내용을 차례로 바꿈 — steps = [[시각, html, fn?], …] (fn(노드, 시각) — 그 안 움직임)
function seqIn(parent, steps, end) {
  return steps.map(([at, html, fn], i) => {
    const n = el(`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">${html}</div>`, parent);
    n._x = parent._x; n._y = parent._y; n._w = parent._w; n._h = parent._h;
    tl.fromTo(n, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, at);
    const t1 = i + 1 < steps.length ? steps[i + 1][0] - 0.2 : end;
    if (t1 != null) tl.to(n, { opacity: 0, duration: 0.2 }, t1);
    if (fn) fn(n, at);
    return n;
  });
}

// ---------- 공책 쪽 그래프 (2편 롱폼 lineChart — 기준선 위 '번 돈' 청록 칠을 더함) ----------
function notebook(sc, slot, at, holes) {
  const d = box(sc, slot, holes ? `<div class="holes">${"<i></i>".repeat(holes)}</div>` : "", "");
  d.classList.add("nb");
  tl.fromTo(d, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
  return d;
}
let CID = 0;
function lineChart(p, area, arr, lo, hi, o) {     // o = {col, w, at, dur, gain: 기준선 위 칠 색, loss: 기준선 아래 칠 색, base}
  const [x, y, w, h] = area, t = d => Date.parse(d), d0 = t(arr[0][0]), d1 = t(arr[arr.length - 1][0]);
  const X = d => x + w * (t(d) - d0) / (d1 - d0), yv = v => y + h * (1 - (v - lo) / (hi - lo));
  const pts = arr.map(([d, v]) => [X(d), yv(v)]), n = pts.length;
  const ox = p._x, oy = p._y, f1 = v => v.toFixed(1);
  const P = pts.map((q, i) => `${i ? "L" : "M"}${f1(q[0] - ox)} ${f1(q[1] - oy)}`).join(" ");
  const id = `clp${++CID}`, by = yv(o.base == null ? 1 : o.base) - oy;
  const close = `${P} L${f1(pts[n - 1][0] - ox)} ${f1(by)} L${f1(pts[0][0] - ox)} ${f1(by)} Z`;
  let A = "";
  if (o.gain) A += `<clipPath id="${id}g"><rect x="-10" y="-400" width="${p._w + 20}" height="${f1(by + 400)}"/></clipPath><path class="fg" clip-path="url(#${id}g)" d="${close}" fill="${o.gain}"/>`;
  if (o.loss) A += `<clipPath id="${id}b"><rect x="-10" y="${f1(by)}" width="${p._w + 20}" height="${p._h + 400}"/></clipPath><path class="fl" clip-path="url(#${id}b)" d="${close}" fill="${o.loss}"/>`;
  const s = el(`<svg class="a" width="${p._w}" height="${p._h}" viewBox="0 0 ${p._w} ${p._h}" style="left:0;top:0;overflow:visible${o.op != null ? `;opacity:${o.op}` : ""}" aria-hidden="true"><defs><clipPath id="${id}"><rect x="${f1(x - ox - 24)}" y="-300" width="0" height="${p._h + 600}"/></clipPath></defs><g clip-path="url(#${id})">${A}<path d="${P}" fill="none" stroke="${o.col}" stroke-width="${o.w || 9}" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`, p);
  if (o.at == null) gsap.set(s.querySelector(`#${id} rect`), { attr: { width: w + 48 } });
  else tl.fromTo(s.querySelector(`#${id} rect`), { attr: { width: 0 } }, { attr: { width: w + 48 }, duration: o.dur || 1.4, ease: "power1.inOut" }, o.at);
  return { pts, yv, s, X };
}
function baseLine(p, area, yv, at, v) {
  const yy = yv(v == null ? 1 : v);
  const s = el(`<svg class="a" width="${p._w}" height="${p._h}" style="left:0;top:0;overflow:visible" aria-hidden="true"><line x1="${area[0] - p._x}" y1="${yy - p._y}" x2="${area[0] + area[2] - p._x}" y2="${yy - p._y}" stroke="${GO}" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 12"/></svg>`, p);
  fadeIn(s, at); return s;
}
function dotAt(p, x, y, c, at) { const n = el(`<div class="dotc" style="left:${(x - p._x - 20).toFixed(1)}px;top:${(y - p._y - 20).toFixed(1)}px;background:${c}"></div>`, p); popIn(n, at, { s0: 0.3 }); return n; }
const ANC = { ul: ["-100%,-100%", -18, -24], ur: ["0,-100%", 18, -24], dl: ["-100%,0", -18, 24], dr: ["0,0", 18, 24], r: ["0,-50%", 30, 0], l: ["-100%,-50%", -30, 0], u: ["-50%,-100%", 0, -28], d: ["-50%,0", 0, 28] };
function noteAt(p, html, cls, x, y, at, pos) {
  const [tf, dx, dy] = ANC[pos || "u"];
  const n = el(`<div class="note ${cls}" ${KOif(html)} style="left:${(x - p._x + dx).toFixed(1)}px;top:${(y - p._y + dy).toFixed(1)}px;transform:translate(${tf})">${html}</div>`, p);
  fadeIn(n, at, 0.25); return n;
}
const press = (n, at) => { tl.to(n, { scale: 0.86, duration: 0.12, ease: "power2.in" }, at); tl.to(n, { scale: 1, duration: 0.25, ease: "back.out(3)" }, at + 0.12); };

  const { sc, st } = stage(a, b, "YEND", s => { HE = act(s, "H_EAGER", "HERO", HH).ro(5); });
  st.update = t => { enter(HE, t, a + 0.1); idle(HE, t); if (t > t3) HE.jitter(t, 0.01); };
  const d = bubble(sc, "BUB", { at: a + 0.15 });
  seqIn(d.bin, [
    [S(7) + 0.05, `<div style="display:flex;align-items:center;gap:36px">${stk(ss("운", GOD, 120), { rot: -4, bg: "#FCE6AE" })}<div class="t2" style="display:flex;align-items:center;gap:36px">${ss("→", INK, 120)}${stk(ss("실력", TED, 120), { rot: 3, bg: "#CBEFE7" })}</div></div>`, (n) => {
      gsap.set(n.querySelector(".t2"), { opacity: 0 }); fadeIn(n.querySelector(".t2"), W(7, "실력으로") - 0.1);
    }],
    [t2, col(prop("P-COINS", 150, "cn"), stk(ss("한 종목", INK, 70), { rot: -2 })), (n) => {
      tl.fromTo(n.querySelector(".cn"), { scale: 0.85 }, { scale: 1.3, duration: Math.max(0.5, t3 - W(7, "크게") - 0.1), ease: "power1.in", immediateRender: false }, W(7, "크게") - 0.1);   // 더 크게 걸고
    }],
    [t3, row(prop("P-COINS", 160), ss("+", INK, 120), col(prop("P-BANKBOOK", 130), stk(ss("빚", CR, 84), { rot: 3, bg: "#F8D2CC" })))],
  ]);
  olTo(d, CR, t3 + 0.1);
  K.cut(t2 - 0.25, "S-07 운 → 실력");
  K.cut(t3 - 0.25, "S-07 한 종목 크게");
  K.cut(E(7) - 0.1, "S-07 + 빚 (진홍)");
}
/* S-08 폭락 → 번 돈은 물론 원금까지 — 공책 쪽 그래프 (롱폼 이씨 계좌 선 SERIES.intro_lee · 숫자 글 없이) · 연말 거리 어둡게 (문장 8) */
{
  const a = until(8), b = until(9), tg = W(8, "번 돈은"), tw = W(8, "원금까지"), tf = W(8, "무너집니다");
  let P;
  const { sc, st } = stage(a, b, "YEND", s => { P = [act(s, "H_SHOCK", "HERO_SM", 1.3).ro(5), act(s, "H_DESP", "HERO_SM", 0.95).ro(5)]; }, { bgx: -11, tint: DARK });
  st.update = t => { const cur = heroRun(P, t, a, [[0, 0], [tf, 1]]); if (t < tf && t > W(8, "폭락이")) cur.jitter(t, 0.012); };
  const nb = notebook(sc, "NOTE", a + 0.1, 10);
  const area = [nb._x + 80, nb._y + 190, nb._w - 160, nb._h - 290], lo = 0, hi = 1.45;
  const L = lineChart(nb, area, SR.intro_lee, lo, hi, { col: CR, w: 10, at: S(8) + 0.2, dur: Math.max(1.6, tf - S(8) - 0.1), gain: "rgba(34,199,176,.30)", loss: "rgba(179,32,42,.17)" });
  baseLine(nb, area, L.yv, a + 0.35);
  const ex = area[0] + area[2], by = L.yv(1);
  const won = noteAt(nb, "원금", "y", ex, by, a + 0.45, "ul");                       // 기준선 오른쪽 끝 위 (선은 그때 기준선 아래 — 안 겹침)
  let mx = SR.intro_lee[0]; for (const p of SR.intro_lee) if (p[1] > mx[1]) mx = p;   // 가장 높았던 날 (번 돈)
  const [gx, gy] = [L.pts[SR.intro_lee.indexOf(mx)][0], L.pts[SR.intro_lee.indexOf(mx)][1]];
  const gain = noteAt(nb, "번 돈", "g", gx, gy, tg, "ur");
  tl.to([gain, L.s.querySelector(".fg")], { opacity: 0.25, duration: 0.35 }, W(8, "물론"));   // 번 돈은 물론
  tl.to(won, { backgroundColor: "#F8D2CC", color: "#8E1720", duration: 0.25 }, tw);           // 원금까지
  tl.fromTo(won, { x: 0 }, { x: 9, duration: 0.07, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, tw + 0.25);
  tl.to(L.s.querySelector(".fl"), { fill: "rgba(179,32,42,.34)", duration: 0.4 }, tf);       // 한꺼번에 무너짐
  let mn = SR.intro_lee[0]; for (const p of SR.intro_lee) if (p[1] < mn[1]) mn = p;
  const lp = L.pts[SR.intro_lee.indexOf(mn)];
  dotAt(nb, lp[0], lp[1], CR, tf);
  K.cut(tg - 0.1, "S-08 폭락 선");
  K.cut(tw + 0.4, "S-08 번 돈 흐림 · 원금 진홍");
  K.cut(E(8) - 0.1, "S-08 무너짐");
}
/* S-09 벼는 익을수록 고개를 숙인다 — 가을 식당 창(단풍) · 코드로 그린 벼 세 포기가 익으며 고개 숙임 · 뽐내던 주인공 → 인사 (문장 9) */
{
  const a = until(9), b = until(10), bow = W(9, "숙인다는");
  let P;
  const { sc, st } = stage(a, b, "DIN", s => { P = [act(s, "H_PROUD", "HERO", HH).ro(5), act(s, "H_BOW", "HERO", 2.45).ro(5)]; }, { bgx: -10 });
  st.update = t => { heroRun(P, t, a, [[0, 0], [bow, 1]]); };
  const d = bubble(sc, "BUB", { at: a + 0.15 });
  // 벼 한 포기: 줄기(Q 곡선) + 잎 둘 + 이삭(낟알 9) — 끝(이삭 붙은 곳)이 옆으로 휘고 이삭이 아래로 돌며 초록 → 금색
  const XS = [150, 330, 510], GR = [[0, -18], [-14, -34], [14, -50], [-14, -66], [14, -82], [-13, -98], [13, -114], [-10, -130], [0, -146]];
  const stalk = (x, i) => `<g>
      <path class="stem" d="M${x} 300 Q${x} 190 ${x} 96" fill="none" stroke="#6E9B3E" stroke-width="9" stroke-linecap="round"/>
      <path d="M${x} 250 Q${x - 60} 210 ${x - 92} 228" fill="none" stroke="#7FAE4A" stroke-width="10" stroke-linecap="round"/>
      <path d="M${x} 210 Q${x + 58} 170 ${x + 86} 186" fill="none" stroke="#7FAE4A" stroke-width="10" stroke-linecap="round"/>
      <g class="pan" transform="translate(${x},96) rotate(0)"><line x1="0" y1="0" x2="0" y2="-150" stroke="#6E9B3E" stroke-width="6" stroke-linecap="round"/>
        <g class="gr" style="fill:#8DBB55">${GR.map(([gx, gy]) => `<ellipse cx="${gx}" cy="${gy}" rx="12" ry="19" transform="rotate(${gx * 1.6} ${gx} ${gy})" stroke="#2A2630" stroke-width="3"/>`).join("")}</g></g></g>`;
  const rice = `<svg width="660" height="310" viewBox="0 0 660 310" aria-hidden="true" style="overflow:visible">${XS.map(stalk).join("")}</svg>`;
  seqIn(d.bin, [[S(9) + 0.05, rice, (n) => {
    const t0 = W(9, "익을수록") - 0.1, dur = Math.max(0.8, bow + 0.5 - t0);
    n.querySelectorAll(".stem").forEach((p, i) => { const x = XS[i]; tl.fromTo(p, { attr: { d: `M${x} 300 Q${x} 190 ${x} 96` } }, { attr: { d: `M${x} 300 Q${x + 6} 170 ${x + 58} 118` }, duration: dur, ease: "power1.inOut", immediateRender: false }, t0 + 0.08 * i); });
    n.querySelectorAll(".pan").forEach((g, i) => { const x = XS[i]; tl.fromTo(g, { attr: { transform: `translate(${x},96) rotate(0)` } }, { attr: { transform: `translate(${x + 58},118) rotate(128)` }, duration: dur, ease: "power1.inOut", immediateRender: false }, t0 + 0.08 * i); });
    tl.to(n.querySelectorAll(".gr"), { fill: "#E2B04A", duration: dur * 0.8, ease: "none" }, t0);
    tl.to(n.querySelectorAll(".stem"), { stroke: "#B8A24A", duration: dur, ease: "none" }, t0);
  }]]);
  K.cut(W(9, "익을수록") - 0.05, "S-09 벼 초록");
  K.cut(E(9) - 0.1, "S-09 벼 숙임 · 인사");
}
/* S-10 수익 = 운 → 번 돈의 일부는 지켜 두세요 — 재택 방 낮(창 쪽) · 계획하는 주인공 (문장 10) */
{
  const a = until(10), b = until(11), t2 = W(10, "번 돈의") - 0.15, keep = W(10, "지켜");
  let HP;
  const { sc, st } = stage(a, b, "WFH", s => { HP = act(s, "H_PLAN", "HERO", HH).ro(5); }, { bgx: -7 });
  st.update = t => { enter(HP, t, a + 0.1); idle(HP, t); };
  const d = bubble(sc, "BUB", { at: a + 0.15 });
  seqIn(d.bin, [
    [S(10) + 0.05, `<div style="display:flex;align-items:center;gap:30px">${prop("P-BANKBOOK", 180)}${ss("▲", TE, 120)}<div class="lk" style="display:flex;align-items:center;gap:30px">${ss("=", INK, 120)}${stk(ss("운", GOD, 120), { rot: 4, bg: "#FCE6AE" })}</div></div>`, (n) => {
      gsap.set(n.querySelector(".lk"), { opacity: 0 }); popIn(n.querySelector(".lk"), W(10, "운이") - 0.1);
    }],
    [t2, `<div style="display:flex;align-items:center;gap:34px">${prop("P-COINS", 150)}<div class="mv" style="display:flex;align-items:center;gap:34px">${ss("→", TED, 120)}${prop("P-BANKBOOK", 190)}</div></div>`, (n) => {
      gsap.set(n.querySelector(".mv"), { opacity: 0 }); popIn(n.querySelector(".mv"), W(10, "일부는") - 0.1);
    }],
  ]);
  olTo(d, TE, keep);
  badge(d, "✓", "", keep + 0.05);
  K.cut(t2 - 0.25, "S-10 통장 ▲ = 운");
  K.cut(E(10) - 0.1, "S-10 동전 → 통장 ✓");
}
/* S-11 겸손하게 천천히 가는 사람 → 폭락이 와도 안 무너짐 — 눈 내린 연말 거리(왼쪽 가게) · 천천히 걷는 주인공 + 말풍선 안 작은 공책
   (청록 = 롱폼 정리의 대비한 길 SERIES.end_right · 옅은 진홍 = S-08 의 무너진 길 · 금색 점선 = 원금) (문장 11) */
{
  const a = until(11), b = until(12), ok = W(11, "무너지지");
  let HP;
  const { sc, st } = stage(a, b, "YEND", s => { HP = act(s, "H_PLAN", "HERO", HH).ro(5); }, { bgx: 10 });
  st.update = t => { enter(HP, t, a + 0.1); HP.g.position.x = HP.home.x + lerp(-0.2, 0, sm(lin(t, a, a + 2.4))); HP.bob(t, 0.035, 1.4); };   // 천천히 걸음
  const snow = st.part(Puppet.floaters({ n: 90, x: [-5.5, 5.5], z: [-8, 5], hgt: 11, speed: [-0.8, -0.3], size: 0.18, inner: "rgba(255,255,255,1)", outer: "rgba(255,255,255,0)", opacity: 0.85 }));
  snow.obj.position.y = 8.5;
  const d = bubble(sc, "BUB", { at: a + 0.15 });
  const w = 800, h = 296, cx = d.bin._x + (d.bin._w - w) / 2, cy = d.bin._y + (d.bin._h - h) / 2;
  const card = el(`<div class="nb sm" style="position:absolute;left:${cx - d.bin._x}px;top:${cy - d.bin._y}px;width:${w}px;height:${h}px"></div>`, d.bin);
  card._x = cx; card._y = cy; card._w = w; card._h = h;
  fadeIn(card, a + 0.3);
  const area = [cx + 36, cy + 30, w - 72, h - 60], lo = 0, hi = 1.7;
  lineChart(card, area, SR.intro_lee, lo, hi, { col: CR, w: 6, op: 0.28 });          // 무너진 길 (옅게 · 처음부터)
  const R2 = lineChart(card, area, SR.end_right, lo, hi, { col: TE, w: 10, at: S(11) + 0.3, dur: Math.max(1.6, ok - S(11) - 0.3) });
  baseLine(card, area, R2.yv, a + 0.35);
  let mn = SR.end_right[0]; for (const p of SR.end_right) if (p[0] > "2022" && p[1] < mn[1]) mn = p;   // 폭락 때 가장 낮은 날 (2022)
  const lp = R2.pts[SR.end_right.indexOf(mn)];
  const dn = el(`<div class="sb" style="position:absolute;left:${(lp[0] - cx - 34).toFixed(1)}px;top:${(lp[1] - cy + 18).toFixed(1)}px;font-size:66px;color:${CR}">▼</div>`, card);
  popIn(dn, W(11, "폭락이"), { s0: 0.3 });
  const e = R2.pts[R2.pts.length - 1];
  dotAt(card, e[0], e[1], TE, ok);
  olTo(d, TE, ok);
  badge(d, "✓", "", ok + 0.05);
  K.cut(W(11, "폭락이") + 0.3, "S-11 천천히 · 폭락 ▼");
  K.cut(E(11) - 0.1, "S-11 안 무너짐 ✓");
}
/* S-12 다른 테스트 → 구독 — 눈 내린 연말 거리(오른쪽 가게) · 말풍선 안 롱폼 썸네일 ▶ + 왼쪽 구독 메모지 단추 · 들뜬 주인공 오른쪽 (문장 12 · 끝 화면) */
{
  const a = until(12), b = K.D, tsub = W(12, "구독하고");
  let HE;
  const { sc, st } = stage(a, b, "YEND", s => { HE = act(s, "H_EAGER", "HERO_END", 2.3).ro(5); }, { bgx: -10, keep: true });
  st.update = t => { enter(HE, t, a + 0.1); idle(HE, t); };
  const snow = st.part(Puppet.floaters({ n: 90, x: [-5.5, 5.5], z: [-8, 5], hgt: 11, speed: [-0.8, -0.3], size: 0.18, inner: "rgba(255,255,255,1)", outer: "rgba(255,255,255,0)", opacity: 0.85 }));
  snow.obj.position.y = 8.5;
  const pw = 640, ph = 360;
  const d = bubble(sc, "BUB_END", { body: END_BODY, tails: END_TAILS, pad: [60, 40], at: S(12) + 0.05,
    html: `<div class="photo" style="width:${pw}px;height:${ph}px;rotate:-2deg"><img alt="" src="../../../stock/source/daebi-test-2026-11/thumbnails/thumbnail_1.jpg"><div class="play"><svg viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><path d="M18 10 L50 30 L18 50 Z" fill="#FFF7E6"/></svg></div></div>` });
  tl.fromTo(d.querySelector(".play"), { scale: 1 }, { scale: 1.12, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, W(12, "테스트가"));
  const sb = box(sc, "SUB", `<div class="subb" ${KO} style="rotate:-3deg">구독</div>`, "display:flex;align-items:center;justify-content:center;");
  popIn(sb, tsub - 0.25, { s0: 0.5 });
  press(sb.firstElementChild, tsub + 0.25);
  K.cut(tsub - 0.35, "S-12 롱폼 썸네일 ▶");
  K.cut(E(12) - 0.1, "S-12 구독 누름");
  K.cut(K.D - 0.3, "끝 화면");
}
K.done();
})();
</script>
