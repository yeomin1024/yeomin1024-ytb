# VERSION: v2.0 — 2026-10-13 — 검색어를 실제 영상 태그로 (사용자 지시: "그냥 검색어를 재테크 관련 태그로 찾아서 다 그걸로 탐색해봐"):
#          검색어 묶음은 tools/tag_keywords.py 가 씀 — 재테크 영상 726개(씨앗 검색 재테크·재테크 방법·재테크 초보·돈 모으는 방법
#          + 지금까지 받은 영상)의 태그 중 채널 5곳 이상이 쓴 것을 채널 수 순으로 40개 (경제·뉴스·금리·환율·종목 이름 등은 뺌 —
#          규칙 tag_rules.toml, 고른 표 tag_candidates.md). 사람이 만든 검색어 50개(v1.1)는 git 기록에 있음.
#          관련어(RELEVANCE_*)는 v1.1 그대로. 성공 사례 수집(tools/outlier_research.py v1.7)도 이제 검색어를 전부 검색.
# (v1.1 — 2026-10-13 — 경제는 빼고 재테크로: 7번 그룹 '경제 뉴스 해설' → '재테크 습관·자산관리', 관련어에서 경제·경기·물가·
#          인플레이션·환율을 빼고 금리는 약한 관련어로)
# (v1.0 — 2026-10-13 — 새로 만듦 (사용자 지시: "경제, 재테크(economic) 폴더만 하나 만들고 코드 분석기에서 사용한
#          검색어 목록 같은거는 따로 빼놓고"). 그 밖의 설정은 analyzer_config.toml.)
#
# 이 파일을 읽는 코드:
#   - youtube_topic_analyzer.py  (분석기 — 모든 검색어를 검색, 하루 할당량을 넘는 검색어는 다음 날로 이월)
#   - tools/outlier_research.py  (작은 채널 성공 사례 — 검색어 전부를 4~20분·20분 넘음 두 번씩 검색)
#   - tools/tag_keywords.py      (검색어 묶음을 태그로 다시 씀: python tools/tag_keywords.py economic --write-keywords)
# 고치는 법: 메모장으로 열어 "따옴표" 안의 글자만 바꾸고 저장 (태그 규칙을 바꾸려면 tag_rules.toml).
# 할당량: 검색어 1개 = 성공 사례 검색 2번 + 분석기 검색 1번 = 300단위 → 40개 = 약 12,000단위 (하루 10,000 → 이틀에 걸쳐 자동으로 이어서).
# =====================================================================================================

