# 반론 페르소나 설정 — tools/rebuttal_persona.py v1.0 (주식)
# VERSION: v1.0 — 2026-10-28 — 최초 (사용자 지시 "애매한게 있으면 반론이 들어온다고 … 반론에 특화된 페르소나 만들어서 대본 피드백하고 다시 수정하고 계속 반복해서 결과 내도록 해").
# 갈래 = 데이터·테스트 영상 대본에 들어올 반론의 종류. pattern = 후보를 찾는 낱말(정규식) — 갈래는 결국 Claude 가 댓글을 읽고 고름(picks).
# question = 대본을 검토할 때 이 갈래의 반론자가 던질 질문. ※ 연구·교육용.

[candidates]
LANG = "한국어"
MIN_CHARS = 15
TOP = 260                      # 좋아요 순 후보 수 (Claude 가 읽는 양 — 약 2만 자)
DISAGREE = '아닌|아니죠|아니라|다르|틀리|틀렸|잘못|말이 안|무슨|근데|하지만|그런데|글쎄|과연|\?|왜 |못합|어렵|힘든'
SKIP_TYPES = ["G", "S", "R", "P"]   # comment_types 규칙 유형 — 정치·광고·단순 반응·칭찬은 후보에서 뺌

[[kind]]
code = "K1"
name = "상황·조건마다 다르다"
pattern = '상황에 따라|케바케|사람마다|경우에 따라|사람 나름|나이에 따라|성향에 따라|다 다르|각자|처지|씀씀이'
question = "이 보기의 정답이 나이·돈 쓸 시기·성향에 따라 바뀌지 않는가? 상황 조건을 대본이 먼저 못 박았는가?"

[[kind]]
code = "K2"
name = "과거 자료일 뿐 · 결과론"
pattern = '결과론|지나고 나서|지나고 보면|과거 데이터|과거는|과거일 뿐|백테스트|미래는|뒷북|사후|앞으로는'
question = "과거 자료로 낸 결론을 '앞으로도 그렇다'로 말하지 않는가? 한계를 어디서 말하는가?"

[[kind]]
code = "K3"
name = "기간·비교 대상을 골랐다"
pattern = '기간을|기간이|구간을|시점에 따라|언제부터|체리|유리한|골라서|하필|비교를 해|비교하면 안'
question = "유리한 기간·비교 대상을 고른 것 아닌가? 다른 기간이면 결론이 뒤집히지 않는가? 비교가 공정한가(같은 돈·같은 조건)?"

[[kind]]
code = "K4"
name = "빠진 비용·조건"
pattern = '세금|수수료|환율|환전|양도세|배당세|물가|인플레|건보료|이자'
question = "세금·환율·수수료·물가·현금 이자 중 결론을 바꿀 만한 것을 빼지 않았는가? 뺐다면 말했는가?"

[[kind]]
code = "K5"
name = "숫자·내용 오류 · 과장"
pattern = '틀렸|틀린|계산이|오류|잘못된|사실이 아닙|정정|보수적이 아니|과장|힘듭니다'
question = "숫자가 계산과 맞는가? 퍼센트·배수·가운데 값이 오해 없이 읽히는가? 표본·기준이 말과 같은가?"

[[kind]]
code = "K6"
name = "실제로는 못 지킨다 (심리·현실)"
pattern = '현실성|비현실|말은 쉽|현실은|이론일 뿐|이상적|버티|못 버|힘든지|힘들어'
question = "정답 보기를 실제 사람이 지킬 수 있는가? 지키기 어려운 순간(손실·소외감)을 대본이 인정하는가?"

[[kind]]
code = "K7"
name = "앞뒤가 다르다 (모순)"
pattern = '말 바꾸|말바꾸|앞뒤가|모순|전에는|지난번엔|한달전|아까는'
question = "대본 앞에서 한 말과 뒤(해설·점수)가 부딪히지 않는가? 점수 근거와 해설 문장이 같은 것을 말하는가?"

[[kind]]
code = "K8"
name = "권유·낚시·과장"
pattern = '낚시|어그로|선동|공포|팔이|자극적|무조건|책임|권유|사라고'
question = "한쪽 행동을 권유하는 말로 들리지 않는가? 제목·도입이 내용보다 과장되지 않는가?"
