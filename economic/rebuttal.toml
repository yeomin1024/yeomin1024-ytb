# 반론 페르소나 설정 — tools/rebuttal_persona.py v1.0 (재테크)
# VERSION: v1.0 — 2026-11-02 — 최초 (사용자 지시 2026-11-02 "지시사항 수정됐으니 stock/guides/quick_board.md 대로 평가판 구성해" — 주식 stock/rebuttal.toml 꼴,
#   재테크 대본에 들어올 반론으로 갈래를 고침: 제도·법 사실 · 가정·조건 · 빠진 비용(건보료·세금) · 바뀌는 제도 · 정치로 흐름).
# 갈래 = 재테크 영상(연금·건보료·세금 계산)에 들어올 반론. pattern = 후보를 찾는 낱말 — 갈래는 결국 Claude 가 댓글을 읽고 고름(picks).
# question = 대본을 검토할 때 이 갈래의 반론자가 던질 질문. ※ 정보 제공용 — 세무·법률 상담이 아님.

[candidates]
LANG = "한국어"
MIN_CHARS = 15
TOP = 260
DISAGREE = '아닌|아니죠|아니라|다르|틀리|틀렸|잘못|말이 안|무슨|근데|하지만|그런데|글쎄|과연|\?|왜 |못합|어렵|힘든|사실과|확인해'
SKIP_TYPES = ["G", "S", "R", "P"]

[[kind]]
code = "K1"
name = "사람·조건마다 다르다"
pattern = '상황에 따라|케바케|사람마다|경우에 따라|나이에 따라|소득에 따라|집집마다|저는 안|우리는 안|해당 안|해당이 안|다 다르|각자|처지'
question = "예시 부부의 나이·소득·재산·가구 조건을 대본이 먼저 못 박았는가? 조건이 다른 사람(혼자 사는 사람·직장 다니는 사람)은 결론이 바뀌지 않는가?"

[[kind]]
code = "K2"
name = "제도가 바뀐다 · 옛 기준"
pattern = '바뀌|개정|올해부터|내년부터|폐지|예전 기준|작년 기준|옛날|이미 바뀐|개편|인상|인하'
question = "오늘 시행 중인 법 원문·올해 기준 금액인가? 곧 바뀌는 것(시행일이 정해진 개정)을 말했는가?"

[[kind]]
code = "K3"
name = "가정을 골랐다 · 비교가 불공정"
pattern = '가정|예시가|극단적|현실과|비현실|그런 사람이|몇 명이나|특수한|골라서|유리한|비교가'
question = "예시 금액·나이를 결론에 유리하게 고른 것 아닌가? 같은 돈·같은 조건으로 비교했는가? 다른 가정이면 뒤집히지 않는가?"

[[kind]]
code = "K4"
name = "빠진 비용·조건"
pattern = '건보료|건강보험|세금|소득세|지방세|물가|인플레|피부양자|기초연금|수수료|이자'
question = "건보료·세금(지방세 포함)·피부양자·기초연금·물가 중 결론을 바꿀 만한 것을 빼지 않았는가? 뺐다면 말했는가?"

[[kind]]
code = "K5"
name = "숫자·법 내용 오류"
pattern = '틀렸|틀린|계산이|오류|잘못된|사실이 아닙|정정|아닌데|아니던데|확인해 보니|공단에 물어|국세청에'
question = "숫자가 계산과 맞는가? 법 조문·금액·기한이 원문과 같은가? 공단·국세청 안내와 부딪히지 않는가?"

[[kind]]
code = "K6"
name = "현실에선 못 한다 · 절차가 어렵다"
pattern = '현실은|말은 쉽|신청이 어렵|서류|창구|안 해준|안해줘|거절|모른다고|복잡|힘들'
question = "할 일이 실제로 할 수 있는 것인가? 신청 절차·기한·서류를 구체적으로 말했는가? 창구에서 막히는 경우를 인정했는가?"

[[kind]]
code = "K7"
name = "앞뒤가 다르다 (모순)"
pattern = '말 바꾸|앞뒤가|모순|전에는|지난번엔|아까는|다른 영상'
question = "대본 앞에서 한 말과 뒤(계산·결론)가 부딪히지 않는가? 이 채널의 다른 편과 같은 기준을 썼는가?"

[[kind]]
code = "K8"
name = "낚시·과장·선동"
pattern = '낚시|어그로|선동|공포|자극적|무조건|폭탄|제목이|팔이|정치|광고'
question = "제목·썸네일이 내용보다 과장되지 않았는가? 제도 비판이 사람·정당 비난으로 흐르지 않았는가? 상품 권유로 들리지 않는가?"
