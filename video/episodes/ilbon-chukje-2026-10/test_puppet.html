<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"ilbon-chukje-2026-10","topic":"test","duration":363.17,"audio":"../../../test/source/ilbon-chukje-2026-10/narration.mp3","thumb":null,"synced":"2026-10-20T11:16:53Z","tts":"2026-10-20T09:37:53","script_sha1":"6ae5d7d567772fc0","sent":[{"n":1,"part":"도입","text":"2026년 10월 17일, 일본 에히메현의 전통 축제 '사이조 마쓰리' 도중 무게 3톤의 가마를 높이 들어 올리던 순간 가마가 떨어졌고, 그 아래 있던 62세 현직 부시장이 깔려 숨졌습니다.","start":0.3,"end":12.66},{"n":2,"part":"도입","text":"이뿐만이 아닙니다.","start":13.11,"end":14.12},{"n":3,"part":"도입","text":"10월 10일, 오사카 단지리 축제에서 교차로를 빠르게 꺾던 수레가 잇따라 넘어져 2명이 숨지고 16명이 다쳤고, 올해 2월 21일엔 오카야마의 알몸 축제에서도 2명이 숨졌죠.","start":14.57,"end":25.32},{"n":4,"part":"도입","text":"보도된 것만 세어도 일본 축제에선 4개월에 1명꼴로 사람이 숨집니다.","start":25.77,"end":30.59},{"n":5,"part":"도입","text":"그런데도 일본은 이 축제들을 멈추지 않습니다.","start":31.04,"end":33.76},{"n":6,"part":"도입","text":"도대체 왜일까요?","start":34.21,"end":35.17},{"n":7,"part":"도입","text":"네 가지 이유를 알아보겠습니다.","start":35.62,"end":37.33},{"n":8,"part":"첫째, 돈과 관광","text":"가장 단순한 첫 번째 이유는 관광 수입입니다.","start":38.33,"end":41.24},{"n":9,"part":"첫째, 돈과 관광","text":"전통 축제에는 작게는 수만 명, 크게는 수십만 명이 몰립니다.","start":41.69,"end":45.61},{"n":10,"part":"첫째, 돈과 관광","text":"이번 사고가 난 사이조 마쓰리에는 약 8만 명, 오사카 기시와다 단지리 축제에는 50만에서 60만 명이 찾는 것으로 알려져 있습니다.","start":46.06,"end":53.82},{"n":11,"part":"첫째, 돈과 관광","text":"숙박, 음식, 교통까지 지역 경제가 1년 중 가장 크게 살아나는 대목이죠.","start":54.27,"end":59.01},{"n":12,"part":"첫째, 돈과 관광","text":"하지만 이보다 더 중요한 이유는 따로 있습니다.","start":59.46,"end":61.95},{"n":13,"part":"둘째, 동네가 곧 가족","text":"두 번째 이유는 공동체, '동네가 곧 가족'이라는 의식입니다.","start":62.95,"end":66.95},{"n":14,"part":"둘째, 동네가 곧 가족","text":"이런 축제는 동네 단위로 움직입니다.","start":67.4,"end":69.48},{"n":15,"part":"둘째, 동네가 곧 가족","text":"마을마다 가마나 수레를 갖고 1년 내내 축제를 준비하죠.","start":69.93,"end":73.53},{"n":16,"part":"둘째, 동네가 곧 가족","text":"어릴 땐 어린이회에서 줄을 잡고, 커가면서 청년단, 젊은 리더, 그리고 원로인 '세화인'까지 나이에 따라 역할이 올라갑니다.","start":73.98,"end":82.81},{"n":17,"part":"둘째, 동네가 곧 가족","text":"축제에서 맡는 역할이 곧 동네에서의 위치인 셈입니다.","start":83.26,"end":86.38},{"n":18,"part":"둘째, 동네가 곧 가족","text":"한 기시와다 주민은 일본 언론에 \"축제가 지역의 결속과 지역 사랑을 지켜준다\"며 안이한 규제에 반대한다고 말했습니다.","start":86.83,"end":93.96},{"n":19,"part":"둘째, 동네가 곧 가족","text":"이들에게 축제를 멈추라는 건 동네를 해체하라는 말처럼 들리는 겁니다.","start":94.41,"end":98.4},{"n":20,"part":"셋째, 신을 모시는 행사","text":"세 번째 이유는 축제 자체가 신을 모시는 종교 행사라는 점입니다.","start":99.4,"end":103.7},{"n":21,"part":"셋째, 신을 모시는 행사","text":"일본에는 자연 곳곳에 수많은 신이 깃들어 있다고 믿는 고유 신앙 '신토'가 있고, 동네마다 그 지역을 지키는 신을 모신 신사가 있습니다.","start":104.15,"end":112.67},{"n":22,"part":"셋째, 신을 모시는 행사","text":"일본에서 축제는 놀이이기 전에 그 신에게 올리는 의식인 겁니다.","start":113.12,"end":116.78},{"n":23,"part":"셋째, 신을 모시는 행사","text":"축제에서 쓰는 가마와 수레는 단순한 장식이 아닙니다.","start":117.23,"end":120.57},{"n":24,"part":"셋째, 신을 모시는 행사","text":"신에게 바치는 제례 도구이고, 축제 자체가 신사의 종교 행사입니다.","start":121.02,"end":125.04},{"n":25,"part":"셋째, 신을 모시는 행사","text":"그래서 행정도 손대기 어렵습니다.","start":125.49,"end":127.48},{"n":26,"part":"셋째, 신을 모시는 행사","text":"일본 방송 해설에 따르면 종교 행사라서 지자체는 '부탁' 수준의 요청은 할 수 있어도 지도나 중지 명령은 내리기 어렵다고 합니다.","start":127.93,"end":136.25},{"n":27,"part":"넷째, 자기책임 문화","text":"마지막 이유는 '자기책임' 문화입니다.","start":137.25,"end":139.57},{"n":28,"part":"넷째, 자기책임 문화","text":"일본에는 '남에게 폐를 끼치지 말라', '스스로 선택했다면 그 결과도 스스로 감당하라'는 자기책임 문화가 뿌리 깊게 자리 잡고 있습니다.","start":140.02,"end":148.43},{"n":29,"part":"넷째, 자기책임 문화","text":"이런 생각은 축제 현장에서 더 극단적으로 나타납니다.","start":148.88,"end":152.22},{"n":30,"part":"넷째, 자기책임 문화","text":"50년 넘게 기시와다 단지리에 참가해 온 한 원로는 일본 매체 인터뷰에서 이렇게 말했습니다.","start":152.67,"end":158.22},{"n":31,"part":"넷째, 자기책임 문화","text":"\"목숨을 잃는 건 격투기와 같아요. 자기책임입니다.\"","start":158.67,"end":162.1},{"n":32,"part":"넷째, 자기책임 문화","text":"지붕 위에 오르는 역할을 맡을 땐 죽을 위험까지 받아들인다고 했습니다.","start":162.55,"end":166.96},{"n":33,"part":"넷째, 자기책임 문화","text":"동의서 같은 건 쓰지 않는데도요.","start":167.41,"end":169.25},{"n":34,"part":"넷째, 자기책임 문화","text":"더 놀라운 건 그다음입니다.","start":169.7,"end":171.14},{"n":35,"part":"넷째, 자기책임 문화","text":"사고를 낸 집안이 오히려 주변에 사과해야 한다는 분위기가 있느냐는 질문에 그는 \"솔직히, 있다\"고 답하며 이렇게 덧붙였습니다.","start":171.59,"end":179.16},{"n":36,"part":"넷째, 자기책임 문화","text":"\"내가 지붕 위 역할을 하다 죽으면, 부모님은 사과하러 다닐 거라고 생각해요.\"","start":179.61,"end":184.17},{"n":37,"part":"넷째, 자기책임 문화","text":"사망사고를 낸 조는 3년간 축제에 나올 수 없다는 이야기도 전해집니다.","start":184.62,"end":188.98},{"n":38,"part":"넷째, 자기책임 문화","text":"일본의 평론가 마나베 아쓰시는 축제가 원래 죽음의 위험을 감수하며 일상을 깨부수는 장치였다고 분석합니다.","start":189.43,"end":196.63},{"n":39,"part":"넷째, 자기책임 문화","text":"위험이 없으면 축제도 아니라는 거죠.","start":197.08,"end":199.03},{"n":40,"part":"넷째, 자기책임 문화","text":"이런 자기책임론은 현지 반응에서도 그대로 드러납니다.","start":199.48,"end":202.79},{"n":41,"part":"넷째, 자기책임 문화","text":"축제를 옹호하는 사상가 우치다 다쓰루는 \"위험하니까 그만두라는 건, 사고가 많으니 F1을 그만두라는 것과 같다\"며 주변 사람이 말할 일이 아니라고 반박했습니다.","start":203.24,"end":213.19},{"n":42,"part":"넷째, 자기책임 문화","text":"반대로 축제에 비판적인 일본 SNS에선 \"위험한 걸 알고 하는 취미인데 공적 의료보험은 쓰지 마라\", \"치료비는 전액 자비로 내라\"는 말까지 나왔습니다.","start":213.64,"end":223.67},{"n":43,"part":"넷째, 자기책임 문화","text":"지지하는 쪽도, 비판하는 쪽도 결국 '자기책임'이라는 같은 말을 하고 있는 겁니다.","start":224.12,"end":229.38},{"n":44,"part":"다른 목소리","text":"그런데 일본 사람들 모두가 정말 이렇게 생각할까요?","start":230.38,"end":233.3},{"n":45,"part":"다른 목소리","text":"이번 사고 이후 일본에선 전혀 다른 목소리도 터져 나오고 있습니다.","start":233.75,"end":237.43},{"n":46,"part":"다른 목소리","text":"'자기책임'만으로는 설명할 수 없다는 거죠.","start":237.88,"end":240.13},{"n":47,"part":"일본 안에서도 갈린다","text":"지역 안에서도 \"이런 위험한 축제는 중단해야 한다\"는 목소리가 나옵니다.","start":241.13,"end":245.39},{"n":48,"part":"일본 안에서도 갈린다","text":"\"적어도 빠른 속도로 꺾는 방식은 바꿔야 한다\"는 의견도 있죠.","start":245.84,"end":249.13},{"n":49,"part":"일본 안에서도 갈린다","text":"온라인에선 자기책임론 자체를 반박하는 목소리도 나왔습니다.","start":249.58,"end":253.2},{"n":50,"part":"일본 안에서도 갈린다","text":"\"본인이 동의했다고, 자기책임이라고 해서 뭐든 해도 되는 건 아니다.\"","start":253.65,"end":257.75},{"n":51,"part":"일본 안에서도 갈린다","text":"일본 방송 거리 인터뷰에서도 의견이 나왔습니다.","start":258.2,"end":260.91},{"n":52,"part":"일본 안에서도 갈린다","text":"형태를 바꾸는 건 이해하지만, 전통의 의미는 지켜야 한다는 겁니다.","start":261.36,"end":265.44},{"n":53,"part":"일본 안에서도 갈린다","text":"그리고 실제로, 500년 넘게 이어온 전통에 손을 대기로 한 축제까지 나왔습니다.","start":265.89,"end":270.63},{"n":54,"part":"실제로 바뀐 축제","text":"바로 오카야마의 '사이다이지 에요'입니다.","start":271.63,"end":273.94},{"n":55,"part":"실제로 바뀐 축제","text":"500년 넘게 이어온 일본의 대표 알몸 축제입니다.","start":274.39,"end":277.4},{"n":56,"part":"실제로 바뀐 축제","text":"약 1만 명의 남성이 행운의 나무막대 '호기'를 차지하려고 몸싸움을 벌이죠.","start":277.85,"end":282.5},{"n":57,"part":"실제로 바뀐 축제","text":"이게 축제의 하이라이트, '호기 쟁탈전'입니다.","start":282.95,"end":285.82},{"n":58,"part":"실제로 바뀐 축제","text":"올해 2월 21일 밤, 이 몸싸움 도중 3명이 의식을 잃었고 결국 2명이 숨졌습니다.","start":286.27,"end":291.67},{"n":59,"part":"실제로 바뀐 축제","text":"주최 측은 구조 매뉴얼을 만들고 AED도 설치했습니다.","start":292.12,"end":295.33},{"n":60,"part":"실제로 바뀐 축제","text":"음주와 군중 속 다이빙도 금지하는 등 대책을 마련해 왔죠.","start":295.78,"end":299.46},{"n":61,"part":"실제로 바뀐 축제","text":"7월에는 외부 전문가 위원회까지 꾸려 앞으로의 축제 방식을 논의하고 있습니다.","start":299.91,"end":305.04},{"n":62,"part":"실제로 바뀐 축제","text":"그런데도 주최 측은 '재발을 막을 안전 대책이 아직 갖춰지지 않았다'고 판단했습니다.","start":305.49,"end":310.43},{"n":63,"part":"실제로 바뀐 축제","text":"\"전통을 끊어선 안 된다\"는 반대도 있었습니다.","start":310.88,"end":314.09},{"n":64,"part":"실제로 바뀐 축제","text":"결국 9월 29일, 2027년 호기 쟁탈전은 열지 않는 쪽으로 최종 조정에 들어갔습니다.","start":314.54,"end":321.25},{"n":65,"part":"실제로 바뀐 축제","text":"그렇다면 10월에 사망자가 나온 축제들은 어떨까요?","start":321.7,"end":324.43},{"n":66,"part":"실제로 바뀐 축제","text":"오사카 단지리 축제와 사이조 마쓰리는 지금 경찰이 사고 원인을 조사하고 있습니다.","start":324.88,"end":329.3},{"n":67,"part":"실제로 바뀐 축제","text":"아직 운영 방식을 바꾸겠다는 공식 발표는 나오지 않았습니다.","start":329.75,"end":333.18},{"n":68,"part":"실제로 바뀐 축제","text":"사이다이지처럼 변화를 택할지, 지금처럼 이어갈지, 이제 이 축제들의 선택이 남았습니다.","start":333.63,"end":339.39},{"n":69,"part":"정리","text":"정리하면, 일본이 축제를 멈추지 않는 이유는 돈만이 아니었습니다.","start":340.39,"end":344.55},{"n":70,"part":"정리","text":"동네라는 공동체, 신을 모신다는 믿음, 위험까지 자기 몫으로 받아들이는 문화죠.","start":345,"end":350.68},{"n":71,"part":"정리","text":"한 나라의 고유한 문화인 만큼 존중해야 합니다.","start":351.13,"end":354.01},{"n":72,"part":"정리","text":"하지만 사람의 목숨이 걸린 일인 만큼, 인명 피해를 줄이기 위한 변화는 필요해 보입니다.","start":354.46,"end":359.77},{"n":73,"part":"정리","text":"시청해주셔서 감사합니다.","start":360.22,"end":361.77}],"subs":[[0.2,5.634,"202 function plane(tex, wd, ht, u0 = 0, u1 = 1, v0 = 0, v1 = 1, shadow = false) {
  const geo = new THREE.PlaneGeometry(wd * (u1 - u0), ht * (v1 - v0));
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), (1 - v1) + uv.getY(i) * (v1 - v0));
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const m = new THREE.Mesh(geo, mat); GRADE.push(mat);
  if (shadow) {                                                      // 종이 그림자 — 같은 그림을 검게, 살짝 뒤·아래
    const s = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, color: 0x000000, transparent: true, depthWrite: false, opacity: 0.34 }));
    s.position.set(0.12, -0.1, -0.12); s.renderOrder = -1; m.add(s); m.userData.shadow = s;
  }
  return m;
}
const setOp = (m, o) => { m.material.opacity = o; m.visible = o > 0.002; if (m.userData.shadow) m.userData.shadow.material.opacity = 0.34 * o; };

// 종이 조각 (흙먼지·돌) — 코드로 그림, 크림색 테두리
function paperBlob(fill, edge, seed, n = 128, cloud = true) {     // cloud = 둥근 구름 테두리(흙먼지) · false = 각진 조각(돌)
  const c = document.createElement("canvas"); c.width = c.height = n; const g = c.getContext("2d");
  const lobes = 5 + (seed % 3), ph = rnd(seed, 3) * 6.28, N = cloud ? 60 : 7;
  const path = (r) => { g.beginPath(); for (let i = 0; i <= N; i++) { const a = i / N * 6.2832, rr = cloud ? r * (0.88 + 0.12 * Math.abs(Math.cos(lobes * a / 2 + ph))) : r * (0.7 + 0.3 * rnd(seed * 31 + (i % N), 7)); g.lineTo(n / 2 + Math.cos(a) * rr, n / 2 + Math.sin(a) * rr); } g.closePath(); g.fill(); };
  g.fillStyle = "#F2E6CF"; path(n * 0.48); g.fillStyle = fill; path(n * 0.43);
  g.fillStyle = edge; g.save(); g.translate(-n * 0.07, -n * 0.07); g.scale(0.62, 0.62); g.translate(n * 0.33, n * 0.33); path(n * 0.4); g.restore();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const PUFF = [0, 1, 2].map(i => paperBlob(["#CDB78E", "#C1AA82", "#D9C59E"][i], ["#E0CDA8", "#D5C19C", "#EBDBB9"][i], i + 1));
const ROCK = [0, 1].map(i => paperBlob(["#5B5148", "#7A6E62"][i], ["#857A6D", "#9C9182"][i], i + 9, 64, false));

// 크기 (월드 단위): 인형 캔버스 3:2 → 9.9 × 6.6 (발끝 화면 74% · 든 가마 꼭대기 약 25%)
const PW = 9.9, PH = 6.6, X_IN = -7.0, X0 = 3.0;
let built = false;
const P = {}, INFO = {};
const rig = new THREE.Group(), unit = new THREE.Group(), pivot = new THREE.Group(), front = new THREE.Group();
scene.add(rig); rig.add(unit); unit.add(pivot); scene.add(front);

// 불씨 (3D 점)
const glowTex = () => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,214,150,1)"); r.addColorStop(1, "rgba(255,120,40,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); };
const NE = 110, eg = new THREE.BufferGeometry(), ep = new Float32Array(NE * 3);
eg.setAttribute("position", new THREE.BufferAttribute(ep, 3));
const emat = new THREE.PointsMaterial({ map: glowTex(), size: 0.22, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9 });
scene.add(new THREE.Points(eg, emat));
// 흙먼지 덩어리 26 · 돌 조각 16 (종이 조각 스프라이트)
const NP = 26, NR = 16, puffs = [], rocks = [];
for (let i = 0; i < NP; i++) { const m = new THREE.SpriteMaterial({ map: PUFF[i % 3], transparent: true, depthWrite: false }); GRADE.push(m); const s = new THREE.Sprite(m); s.renderOrder = 4; scene.add(s); puffs.push(s); }
for (let i = 0; i < NR; i++) { const m = new THREE.SpriteMaterial({ map: ROCK[i % 2], transparent: true, depthWrite: false }); GRADE.push(m); const s = new THREE.Sprite(m); s.renderOrder = 4; scene.add(s); rocks.push(s); }

function build() {
  const T = {};
  for (const k in FILES) { const r = prep(k); T[k] = texOf(r.c); INFO[k] = r.info; }
  // 배경 (z -24) — 그림 62% 줄(자갈 바닥이 시작) 이 인형 뒤에 오게
  const BW = 54, BH = BW * INFO.BG.h / INFO.BG.w;
  P.bg = plane(T.BG, BW, BH); P.bg.position.set(0, 2.6 + (0.62 - 0.5) * BH, -24); P.bg.renderOrder = 0; scene.add(P.bg);
  // 가마꾼 = P-LIFT 의 멜대 아래 — 기준점 = 그 알파 상자 아래 가운데 (발끝 줄)
  const fb = INFO.FLOAT.bbox, mb = INFO.MEN.bbox, cut = fb[3];          // 자르는 줄 = 가마(멜대) 아래 끝
  const cu = (mb[0] + mb[2]) / 2, fy = mb[3];
  // 가마꾼을 둘로 나눌 열: 가운데 근처에서 사람이 가장 적게 걸치는 열
  const A = INFO.MEN.A, w = INFO.MEN.w, h = INFO.MEN.h;
  let best = 0.5, bestN = 1e9;
  for (let x = Math.round(w * 0.44); x <= Math.round(w * 0.56); x++) { let n = 0; for (let y = Math.round(cut * h); y < h; y += 3) if (A(x, y) > 40) n++; if (n < bestN) { bestN = n; best = x / w; } }
  Object.assign(INFO, { cut, cu, fy, split: best });
  const put = (m, u0, u1, v0, v1) => { m.position.set(((u0 + u1) / 2 - cu) * PW, (fy - (v0 + v1) / 2) * PH, 0); m.userData.x = m.position.x; m.userData.y = m.position.y; return m; };
  P.menL = put(plane(T.MEN, PW, PH, 0, best, cut, 1, true), 0, best, cut, 1);
  P.menR = put(plane(T.MEN, PW, PH, best, 1, cut, 1, true), best, 1, cut, 1);
  unit.add(P.menL); unit.add(P.menR);
  // 가마 — 축 = 알파 상자 오른쪽 아래 귀퉁이 (멜대 끝)
  pivot.position.set((fb[2] - cu) * PW, (fy - fb[3]) * PH, 0.05); pivot.userData.y = pivot.position.y;
  P.float = plane(T.FLOAT, PW, PH, 0, 1, 0, 1, true); P.float.position.set((0.5 - fb[2]) * PW, (fb[3] - 0.5) * PH, 0); pivot.add(P.float);
  // 앞 구경꾼 (z +6) — 뒷모습, 화면 아래쪽
  const cb = INFO.CROWD.bbox, CW = 21, CH = CW * INFO.CROWD.h / INFO.CROWD.w;   // 손·머리만 화면 아래 약 1/4 에
  P.crowd = plane(T.CROWD, CW, CH, 0, 1, 0, 1, true); P.crowd.position.set(0, -5.0 + (cb[3] - 0.5) * CH, 0); front.add(P.crowd); front.position.set(1.2, 0, 6);
  P.menL.renderOrder = P.menR.renderOrder = 2; P.float.renderOrder = 3; P.crowd.renderOrder = 6;
  window.PUPPET = { cut, cu, fy, split: best, files: FILES };        // 점검용
  built = true;
}

// ---------- 카메라 ----------
function camAt(t) {
  const KF = [{ t: t0, p: [-1.0, 3.2, 26.5], l: [-0.4, 2.9, 0] }, { t: tUp, p: [0.9, 3.3, 23.6], l: [1.3, 3.0, 0] },
              { t: tTilt, p: [1.3, 3.5, 22.6], l: [1.6, 3.2, 0] }, { t: tI2, p: [1.8, 3.0, 21.2], l: [2.0, 2.4, 0] },
              { t: tEnd, p: [2.1, 2.9, 19.4], l: [2.2, 2.2, 0] }];
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1].t) i++;
  const a = KF[i], b = KF[i + 1], k = seg(t, a.t, b.t);
  const pos = new THREE.Vector3(...a.p.map((v, j) => lerp(v, b.p[j], k))), look = new THREE.Vector3(...a.l.map((v, j) => lerp(v, b.l[j], k)));
  for (const [ti, amp] of [[tI1, 0.05], [tI2, 0.13]]) if (t > ti) { const d = t - ti, s = amp * Math.exp(-d / 0.22); pos.y += s * Math.sin(d * 38); pos.x += s * 0.6 * Math.sin(d * 27 + 1); }
  return { pos, look };
}

// ---------- 글자 (DOM) ----------
{
  const sc = K.scene(0, K.D, { keep: true });
  const st = el(`<div class="kin ts Y" style="left:110px;top:128px;font-size:48px;font-weight:700">2026.10.17 · 에히메현 사이조시</div>`, sc);
  tl.fromTo(st, { opacity: 0, rotationX: -90, transformPerspective: 900, transformOrigin: "50% 0%" }, { opacity: 1, rotationX: 0, duration: 0.7, ease: "back.out(1.6)" }, t0 + 0.1);
  const name = el(`<div class="kin ts" style="left:110px;top:196px;font-size:96px">${[..."사이조 마쓰리"].map(c => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("")}</div>`, sc);
  tl.fromTo(name.children, { opacity: 0, y: 70, rotationY: 90, transformPerspective: 700 }, { opacity: 1, y: 0, rotationY: 0, duration: 0.55, ease: "power3.out", stagger: 0.06 }, tName);
  tl.to([st, name], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, tI1 - 0.32);   // 떨어지는 순간 글자 자리를 비움
  const fall = el(`<div class="kin ts" style="left:110px;top:130px;font-size:88px">가마 <span class="R">낙하</span></div>`, sc);
  tl.fromTo(fall, { opacity: 0, y: -160, rotation: -6 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "bounce.out" }, tI1);
  const who = el(`<div class="kin ts" style="left:110px;top:250px;font-size:92px">현직 부시장(62) <span class="R" id="pdead">사망</span></div>`, sc);
  tl.fromTo(who, { opacity: 0, scale: 1.4, rotationX: 60, transformPerspective: 900, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, rotationX: 0, duration: 0.6, ease: "power4.out" }, t62);
  tl.fromTo(who.querySelector("#pdead"), { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.in" }, tDie);
  const ul = el(`<div class="uline" style="left:110px;top:365px;width:860px"></div>`, sc);
  tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, tDie + 0.3);
  K.cut(t0 + 2.0, "강변 · 가마 메고 들어옴");
  K.cut(tUp + 0.25, "영차 (들썩)");
  K.cut(tDrop + 0.2, "기울며 떨어짐 · 흩어짐");
  K.cut(tI2 + 0.3, "쾅 · 흙먼지 · 구경꾼 움찔");
  K.cut(t62 + 0.8, "부시장(62)");
  K.cut(Math.min(tEnd - 0.1, tDie + 1.0), "사망 · 식은 화면");
}

// ---------- 프레임마다 ----------
const proj = v => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * 1920, (1 - p.y) / 2 * 1080, p.z]; };
const gradeCol = new THREE.Color(), WARM = new THREE.Color(0xffffff), COOL = new THREE.Color(0xb4b9cc), DARK = new THREE.Color(0x8a8fa6);
const land = new THREE.Vector3();
K.onSeek(t => {
  if (!built) {                                                      // 그림이 다 풀린 뒤에 무대를 지음 (kit 가 첫 seek 를 먼저 부름)
    if (!Object.values(IMG).every(i => i.complete && i.naturalWidth > 0)) return;
    build();
  }
  const tq = q12(t), falling = t >= tTilt;
  // 걸어 들어옴 — 걸음마다 위아래 (12장/초)
  rig.position.x = lerp(X_IN, X0, seg(t, t0, tUp - 0.3));
  const walking = t < tUp - 0.3 ? 1 : 0;
  // '높이' 부터 영차 — 들썩 두 번 (가마꾼 + 가마 함께, 위로 갈 때 살짝 늘어남)
  const hv = t >= tUp && !falling ? Math.max(0, Math.sin(Math.PI * 2 * (t - tUp) / Math.max(0.5, (tTilt - tUp) / 2))) : 0;
  unit.position.y = walking * 0.08 * Math.abs(Math.sin(tq * Math.PI * 2.2)) + 0.38 * hv;
  unit.scale.y = 1 + 0.025 * hv;
  // 가마 흔들림 → 기울기(0.35초) → 떨어짐(0.42초, 점점 빠르게) → 귀퉁이 닿음 → 몸통이 쾅(0.24초) → 살짝 튐
  if (!falling) { pivot.rotation.z = 0.012 * Math.sin(tq * (t > tUp ? 11 : 5)); pivot.position.y = pivot.userData.y; }
  else {
    const a1 = -0.105 * sm(lin(t, tTilt, tDrop)), kd = lin(t, tDrop, tI1), drop = kd * kd, a2 = a1 - 0.14 * drop;
    const ks = lin(t, tI1, tI2), a3 = lerp(a2, -0.035, ks * ks);
    const bounce = t > tI2 ? -0.03 * Math.exp(-(t - tI2) / 0.18) * Math.sin((t - tI2) * 30) : 0;
    pivot.rotation.z = (t < tI1 ? a2 : a3) + bounce + (t < tDrop ? 0.014 * Math.sin(tq * 40) : 0);
    pivot.position.y = lerp(pivot.userData.y, 0.02, t < tI1 ? drop : 1);
  }
  // 가마꾼 — 둘로 갈라져 양옆으로 밀려남(한 번 튐) → 쾅 뒤 무대 밖으로 빠져나감 (종이인형을 옆으로 빼듯, 흐려지지 않음)
  const ks2 = falling ? 1 - Math.pow(1 - lin(t, tTilt, tTilt + 0.9), 3) : 0, jump = falling ? 0.35 * Math.sin(Math.PI * lin(t, tTilt, tTilt + 0.45)) : 0;
  const off = Math.pow(lin(t, tI2 + 0.3, tI2 + 1.6), 2) * 10;
  P.menL.position.x = P.menL.userData.x - 2.7 * ks2 - off; P.menR.position.x = P.menR.userData.x + 2.7 * ks2 + off;   // 가마 몸통 폭만큼 비켜남
  P.menL.position.y = P.menL.userData.y + jump; P.menR.position.y = P.menR.userData.y + jump;
  const lean = 0.1 * Math.sin(Math.PI * lin(t, tTilt, tTilt + 1.0)) + 0.04 * ks2;
  P.menL.rotation.z = lean; P.menR.rotation.z = -lean;
  // 앞 구경꾼 — 환호(들썩) → 쾅에 움찔(아래·뒤로)
  const rec = t > tI2 ? Math.exp(-(t - tI2) / 0.5) : 0;
  front.position.y = t < tI2 ? 0.07 * Math.abs(Math.sin(tq * Math.PI * 1.6)) : -0.45 * (1 - Math.exp(-(t - tI2) / 0.12)) + 0.06 * rec * Math.sin((t - tI2) * 35);
  front.rotation.z = t > tI2 ? 0.01 * rec * Math.sin((t - tI2) * 28) : 0;
  // 흙먼지·돌 — 가마가 떨어진 자리에서
  P.float.updateMatrixWorld(true);
  const fb = INFO.FLOAT.bbox;
  land.set(((fb[0] + fb[2]) / 2 - 0.5) * PW, (0.5 - fb[3]) * PH, 0).applyMatrix4(P.float.matrixWorld);
  const tau = t - tI2;
  for (let i = 0; i < NP; i++) {
    const s = puffs[i], on = tau > 0 && tau < 3.4;
    s.visible = on; if (!on) continue;
    const k = 1 - Math.exp(-tau / (0.35 + 0.25 * rnd(i, 1))), dir = rnd(i, 2) * 2 - 1;
    s.position.set(land.x + dir * (0.6 + 4.0 * k * rnd(i, 3)), 0.2 + 1.3 * k * rnd(i, 4) + 0.2 * tau, 0.6 + 1.2 * rnd(i, 5));
    const sz = (0.8 + 1.2 * rnd(i, 6)) * (0.45 + 0.9 * k);
    s.scale.set(sz, sz * 0.85, 1); s.material.rotation = dir * k * 0.6;
    s.material.opacity = 0.92 * sm(clamp(tau / 0.08, 0, 1)) * (1 - seg(tau, 0.9 + 0.7 * rnd(i, 7), 2.8));
  }
  for (let i = 0; i < NR; i++) {
    const s = rocks[i], on = tau > 0 && tau < 1.4;
    s.visible = on; if (!on) continue;
    const vx = (rnd(i, 11) * 2 - 1) * 5.5, vy = 3 + 3 * rnd(i, 12);
    s.position.set(land.x + vx * tau, Math.max(0.1, 0.4 + vy * tau - 9 * tau * tau), 1.2 + rnd(i, 13));
    const sz = 0.22 + 0.25 * rnd(i, 14); s.scale.set(sz, sz, 1); s.material.rotation = tau * 9 * (rnd(i, 15) - 0.5);
    s.material.opacity = 1 - seg(tau, 0.9, 1.4);
  }
  // 불씨 (3D) — 무대 깊이 전체에서 천천히 떠오름
  for (let i = 0; i < NE; i++) {
    const sp = 0.25 + rnd(i, 4) * 0.6, y = (rnd(i, 2) * 10 + t * sp) % 10;
    ep[i * 3] = -12 + rnd(i, 1) * 26 + Math.sin(t * 0.7 + rnd(i, 5) * 6.3) * 0.4; ep[i * 3 + 1] = y; ep[i * 3 + 2] = -14 + rnd(i, 3) * 19;
  }
  eg.attributes.position.needsUpdate = true;
  emat.opacity = 0.9 * (1 - 0.5 * seg(t, tI2, tI2 + 1));
  // 색: 따뜻함 → 쾅 뒤 식음 → '숨졌습니다' 에 더 어둡게 · 쾅 빛
  gradeCol.copy(WARM).lerp(COOL, seg(t, tI2, tI2 + 0.6)).lerp(DARK, seg(t, tDie, tDie + 0.8));
  for (const m of GRADE) m.color.copy(gradeCol);
  flash.style.opacity = t > tI2 ? (0.5 * Math.exp(-(t - tI2) / 0.12)).toFixed(3) : 0;
  // 카메라
  const c = camAt(t);
  cam.position.copy(c.pos); cam.lookAt(c.look); cam.updateMatrixWorld();
  ren.render(scene, cam);
  // '무게 3톤' 꼬리표 — 가마 꼭대기를 따라감 ('무게' ~ 기울기 시작)
  if (t >= tW && t < tTilt + 0.15) {
    const v = new THREE.Vector3(((fb[0] + fb[2]) / 2 - 0.5) * PW, (0.5 - fb[1]) * PH + 0.3, 0).applyMatrix4(P.float.matrixWorld);
    const [x, y] = proj(v), k = seg(t, tW, tW + 0.35) * (1 - seg(t, tTilt, tTilt + 0.15));
    ov.innerHTML = `<div class="tag3" style="left:${x.toFixed(1)}px;top:${Math.max(120, y - 10).toFixed(1)}px;opacity:${k.toFixed(3)}">무게 3톤</div>`;
  } else ov.innerHTML = "";
});
K.done();
})();
</script>
