정리한 논문이 나왔습니다.","start":73.012,"end":77.445},{"n":19,"part":"왜 딸에게 몰릴까","text":"대부분 어릴 때 이런 역할을 한 자녀를 조사한 연구입니다.","start":77.825,"end":81.314},{"n":20,"part":"왜 딸에게 몰릴까","text":"이런 역할을 많이 했다는 자녀일수록 불안이나 우울이 더 많이 나타났습니다.","start":81.694,"end":86.344},{"n":21,"part":"왜 딸에게 몰릴까","text":"다만 수고를 알아주고 도와줄 사람이 있으면, 더 단단해질 수 있다고 연구진은 봤습니다.","start":86.724,"end":92.144},{"n":22,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"첫 번째 이유는, 엄마의 걱정이 내 걱정으로 남을 수 있다는 것입니다.","start":93.144,"end":97.374},{"n":23,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"털어놓으면 엄마는 잠깐 마음이 풀릴 수 있습니다.","start":97.754,"end":100.502},{"n":24,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"그런데 들은 이야기는 딸의 머릿속에 남습니다.","start":100.882,"end":103.575},{"n":25,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"전화를 끊은 뒤에도 '엄마 오늘 괜찮을까' 하는 생각이 떠나지 않습니다.","start":103.955,"end":107.948},{"n":26,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"밤에 잠들기 전에도 엄마가 한 말이 머릿속에서 다시 재생되기도 합니다.","start":108.328,"end":112.498},{"n":27,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"미국의 한 연구는 이혼 직후의 10대 딸 62명을 조사했습니다.","start":112.878,"end":117.147},{"n":28,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"엄마의 무거운 이야기를 많이 들은 딸일수록, 엄마 걱정도 크고 더 힘들어했습니다.","start":117.527,"end":122.667},{"n":29,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"10대 딸 연구라 나와 같지는 않겠지만, 통화 뒤 걱정이 남으면 내 이야기일 수 있습니다.","start":123.047,"end":128.689},{"n":30,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"마치 엄마의 짐을 내 가방에 옮겨 담고, 집에 와서도 내려놓지 못하는 것과 같습니다.","start":129.069,"end":134.306},{"n":31,"part":"첫 번째 이유, 엄마의 걱정이 내 걱정으로","text":"한마디로, 하소연은 덜어지기만 하는 것이 아니라 듣는 쪽에 남기도 합니다.","start":134.686,"end":139.009},{"n":32,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"두 번째 이유는, 다 들어 준다고 엄마와 저절로 가까워지는 것은 아니라는 것입니다.","start":140.009,"end":145.036},{"n":33,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"이렇게 생각하는 딸도 있습니다.","start":145.416,"end":147.096},{"n":34,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"'내가 들어 줘야 엄마와 사이가 좋지.'","start":147.476,"end":149.742},{"n":35,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"그런데 앞의 10대 딸 연구에는 또 하나의 결과가 있었습니다.","start":150.122,"end":153.535},{"n":36,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"엄마가 무거운 이야기를 많이 털어놓아도, 그 딸들이 더 가깝다고 느끼지는 않았습니다.","start":153.915,"end":159.105},{"n":37,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"통화가 엄마 이야기로만 채워진다면, 내 이야기를 할 틈은 없을 수 있습니다.","start":159.485,"end":163.819},{"n":38,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"가까운 사이란 서로의 이야기를 주고받는 사이입니다.","start":164.199,"end":167.056},{"n":39,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"물론 엄마의 하소연을 들으며 친구처럼 가까워졌다는 딸도 있습니다.","start":167.436,"end":171.196},{"n":40,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"차이는 한쪽만 쏟아 내느냐, 서로 주고받느냐일 수 있습니다.","start":171.576,"end":175.158},{"n":41,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"한마디로, 듣기만 하는 딸은 엄마와 가까워졌다기보다 엄마를 받쳐 주고 있을 수 있습니다.","start":175.538,"end":180.893},{"n":42,"part":"두 번째 이유, 저절로 가까워지지 않음","text":"그런데 세 번째 이유는 엄마와 나 둘만의 문제가 아닙니다.","start":181.273,"end":184.573},{"n":43,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"세 번째 이유는, 다른 가족과의 사이까지 멀어질 수 있다는 것입니다.","start":185.573,"end":189.793},{"n":44,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"엄마의 하소연에는 다른 가족이 자주 나옵니다.","start":190.173,"end":192.813},{"n":45,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"\"너희 아빠는 왜 그 모양이니\", \"네 오빠는 연락도 없다.\"","start":193.193,"end":196.603},{"n":46,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"이런 이야기를 매일 듣다 보면, 어느새 엄마 편에 서기 쉽습니다.","start":196.983,"end":200.836},{"n":47,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"반대로 듣다 지쳐, 오히려 엄마가 미워지는 딸도 있습니다.","start":201.216,"end":204.851},{"n":48,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"아빠를 만나면 엄마에게 들은 말이 먼저 떠올라, 말투가 차가워지기도 합니다.","start":205.231,"end":209.961},{"n":49,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"형제와 이야기할 때도 '나만 엄마를 챙긴다'는 서운함이 앞섭니다.","start":210.341,"end":214.149},{"n":50,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"물론 폭력이나 외도, 빚처럼 엄마가 실제로 피해를 입는 일이라면 흉이 아닙니다.","start":214.529,"end":219.34},{"n":51,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"폭력이나 폭언이라면, 엄마와 함께 여성긴급전화에 전화해 보세요.","start":219.72,"end":223.88},{"n":52,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"번호는 일삼육육이고, 설명란에도 적어 두겠습니다.","start":224.26,"end":227.595},{"n":53,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"외도나 빚 문제라면, 가족 상담이나 법률 상담을 같이 알아봐도 좋습니다.","start":227.975,"end":232.802},{"n":54,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"그런 일이 아니라면, 엄마 이야기만으로 다른 가족을 판단하게 될 수 있습니다.","start":233.182,"end":237.642},{"n":55,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"엄마 속상함이 틀렸다는 뜻이 아니라, 내가 판정하지 않아도 된다는 뜻입니다.","start":238.022,"end":242.412},{"n":56,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"이와 닮은 연구가 2007년 미국에서 나왔습니다.","start":242.792,"end":245.792},{"n":57,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"젊은 성인 천백여 명에게, 부모가 상대 부모에 대해 하는 말과 자기 마음을 물었습니다.","start":246.172,"end":251.522},{"n":58,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"부모가 자녀에게 상대 부모 흉을 볼수록, 자녀는 '사이에 끼인 느낌'을 더 받았습니다.","start":251.902,"end":257.003},{"n":59,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"그리고 이 느낌이 클수록 가족에 대한 만족도가 낮았고, 마음 건강도 나빴습니다.","start":257.383,"end":262.153},{"n":60,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"부모가 이혼하지 않은 집도 결과는 비슷했습니다.","start":262.533,"end":265.168},{"n":61,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"부부가 풀 일을 자녀가 가운데서 떠안는 모양이라는 점이 닮았습니다.","start":265.548,"end":269.22},{"n":62,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"한마디로, 가운데 끼인 느낌이 클수록 가족 전체가 덜 편하게 느껴질 수 있습니다.","start":269.6,"end":274.239},{"n":63,"part":"세 번째 이유, 다른 가족과도 멀어짐","text":"그런데 이미 많이 지쳐 있다면, 몸과 마음이 먼저 신호를 보냅니다.","start":274.619,"end":278.757},{"n":64,"part":"이미 지쳤다는 신호","text":"엄마 이름이 휴대폰에 뜨면 가슴이 먼저 철렁합니다.","start":279.757,"end":282.904},{"n":65,"part":"이미 지쳤다는 신호","text":"전화를 일부러 늦게 받거나, 받지 않고 나중에 문자로 답합니다.","start":283.284,"end":286.931},{"n":66,"part":"이미 지쳤다는 신호","text":"그러고 나면 '나는 나쁜 딸인가' 하는 죄책감이 밀려옵니다.","start":287.311,"end":290.801},{"n":67,"part":"이미 지쳤다는 신호","text":"통화를 마친 뒤 한동안 아무것도 하기 싫어집니다.","start":291.181,"end":293.771},{"n":68,"part":"이미 지쳤다는 신호","text":"엄마와 통화한 날에는 가까운 사람에게 괜히 짜증을 냅니다.","start":294.151,"end":297.681},{"n":69,"part":"이미 지쳤다는 신호","text":"이 가운데 자주 겪는 것이 있다면, 통화 시간이나 횟수를 줄여도 된다는 신호입니다.","start":298.061,"end":302.981},{"n":70,"part":"이미 지쳤다는 신호","text":"잠이나 일에까지 영향이 갈 만큼 이어진다면, 엄마보다 먼저 나를 위한 상담을 받아 보세요.","start":303.361,"end":308.892},{"n":71,"part":"이미 지쳤다는 신호","text":"이것은 엄마를 덜 사랑해서 생기는 일이 아닙니다.","start":309.272,"end":311.929},{"n":72,"part":"이미 지쳤다는 신호","text":"오래 혼자 들어 온 무게가 쌓였을 수 있습니다.","start":312.309,"end":314.939},{"n":73,"part":"이미 지쳤다는 신호","text":"그렇다면 엄마 전화를 끊지 않으면서 나를 지키려면 어떻게 해야 할까요?","start":315.319,"end":319.411},{"n":74,"part":"끊지 않고 나를 지키는 말 네 가지","text":"첫 번째는, 통화가 끝나는 때를 먼저 정하는 말입니다.","start":320.411,"end":323.914},{"n":75,"part":"끊지 않고 나를 지키는 말 네 가지","text":"\"엄마, 나 저녁 먹기 전까지만 통화할 수 있어.\"","start":324.294,"end":327.321},{"n":76,"part":"끊지 않고 나를 지키는 말 네 가지","text":"처음에 말해 두면, 중간에 끊을 때 덜 갑작스럽습니다.","start":327.701,"end":331.207},{"n":77,"part":"끊지 않고 나를 지키는 말 네 가지","text":"두 번째는, 마음은 받아 주되 해결은 돌려주는 말입니다.","start":331.587,"end":335.229},{"n":78,"part":"끊지 않고 나를 지키는 말 네 가지","text":"\"엄마 많이 속상했구나. 엄마는 그 일을 어떻게 하고 싶어?\"","start":335.609,"end":339.479},{"n":79,"part":"끊지 않고 나를 지키는 말 네 가지","text":"엄마의 마음을 알아주는 것과, 엄마의 문제를 내가 풀어 주는 것은 다른 일입니다.","start":339.859,"end":344.819},{"n":80,"part":"끊지 않고 나를 지키는 말 네 가지","text":"세 번째는, 다른 가족 흉에는 편을 들지 않는 말입니다.","start":345.199,"end":348.71},{"n":81,"part":"끊지 않고 나를 지키는 말 네 가지","text":"\"나는 우리 가족 다 소중해서, 그 얘기는 듣기가 힘들어.\"","start":349.09,"end":352.596},{"n":82,"part":"끊지 않고 나를 지키는 말 네 가지","text":"이 말은 엄마를 밀어내는 말이 아니라, 가족 모두를 지키는 말입니다.","start":352.976,"end":356.966},{"n":83,"part":"끊지 않고 나를 지키는 말 네 가지","text":"다만 앞에서 말한 실제 피해라면, 이 말 대신 도움받을 곳을 함께 찾아 주세요.","start":357.346,"end":362.143},{"n":84,"part":"끊지 않고 나를 지키는 말 네 가지","text":"네 번째는, 엄마에게 다른 기댈 곳을 함께 찾아 주는 말입니다.","start":362.523,"end":366.479},{"n":85,"part":"끊지 않고 나를 지키는 말 네 가지","text":"\"엄마 속상한 마음은 이모나 가까운 분과도 나눠 봐. 나도 다음에 또 들을게.\"","start":366.859,"end":371.489},{"n":86,"part":"끊지 않고 나를 지키는 말 네 가지","text":"아빠에게 못 한 말이라면, 어떻게 말할지 같이 정리해 드리는 것도 방법입니다.","start":371.869,"end":376.623},{"n":87,"part":"끊지 않고 나를 지키는 말 네 가지","text":"형제가 있다면 번갈아 듣는 것도 방법입니다.","start":377.003,"end":379.64},{"n":88,"part":"끊지 않고 나를 지키는 말 네 가지","text":"마음이 많이 힘들어 보이면, 동네 정신건강복지센터 무료 상담을 같이 알아봐도 좋습니다.","start":380.02,"end":385.223},{"n":89,"part":"끊지 않고 나를 지키는 말 네 가지","text":"예약이 몇 주 걸릴 수 있으니, 급하면 설명란의 정신건강 상담 전화를 알려 드리세요.","start":385.603,"end":390.803},{"n":90,"part":"끊지 않고 나를 지키는 말 네 가지","text":"이 가운데 하나만 알려 드려도 충분합니다.","start":391.183,"end":393.392},{"n":91,"part":"끊지 않고 나를 지키는 말 네 가지","text":"이 말들을 처음 꺼내면 엄마가 서운해할 수 있습니다.","start":393.772,"end":396.549},{"n":92,"part":"끊지 않고 나를 지키는 말 네 가지","text":"\"딸이 남 같다\"는 말을 들을 수도 있습니다.","start":396.929,"end":399.055},{"n":93,"part":"끊지 않고 나를 지키는 말 네 가지","text":"서운함이 금방 줄지 않는 엄마도 있습니다.","start":399.435,"end":401.619},{"n":94,"part":"끊지 않고 나를 지키는 말 네 가지","text":"서운해하셔도, 내가 정한 선은 같은 말로 지켜도 됩니다.","start":401.999,"end":405.667},{"n":95,"part":"끊지 않고 나를 지키는 말 네 가지","text":"다만 하소연 끝에 늘 나를 탓하거나 깎아내린다면, 그건 하소연을 넘어선 일입니다.","start":406.047,"end":411.127},{"n":96,"part":"끊지 않고 나를 지키는 말 네 가지","text":"그때는 통화를 줄여도 괜찮으니, 나를 위한 상담부터 받아 보세요.","start":411.507,"end":415.387},{"n":97,"part":"끊지 않고 나를 지키는 말 네 가지","text":"엄마가 \"죽고 싶다\"고 하면, 그날 바로 엄마와 함께 자살예방 상담 전화에 걸어 보세요.","start":415.767,"end":421.227},{"n":98,"part":"끊지 않고 나를 지키는 말 네 가지","text":"번호는 일공구이고, 엄마가 싫다 하시면 딸이 먼저 걸어 물어봐도 됩니다.","start":421.607,"end":426.001},{"n":99,"part":"끊지 않고 나를 지키는 말 네 가지","text":"늘 하시는 말이어도 넘기지 말고, 당장 위험해 보이면 일일구에 알리세요.","start":426.381,"end":431.025},{"n":100,"part":"끊지 않고 나를 지키는 말 네 가지","text":"딸이 다 떠안으라는 말이 아니라, 전문가에게 넘기자는 뜻입니다.","start":431.405,"end":435.15},{"n":101,"part":"정리","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":436.15,"end":439.037},{"n":102,"part":"정리","text":"엄마의 하소연을 혼자 다 받아 주면 안 되는 이유는 세 가지였습니다.","start":439.417,"end":443.154},{"n":103,"part":"정리","text":"첫째, 엄마의 걱정이 내 걱정으로 남을 수 있습니다.","start":443.534,"end":446.904},{"n":104,"part":"정리","text":"둘째, 다 들어 준다고 엄마와 저절로 가까워지지는 않습니다.","start":447.284,"end":451.294},{"n":105,"part":"정리","text":"셋째, 다른 가족과의 사이까지 멀어질 수 있습니다.","start":451.674,"end":454.934},{"n":106,"part":"정리","text":"그리고 끊지 않고 나를 지키는 말은 네 가지였습니다.","start":455.314,"end":458.142},{"n":107,"part":"정리","text":"끝나는 때를 먼저 말하기, 마음은 받고 해결은 돌려주기입니다.","start":458.522,"end":462.555},{"n":108,"part":"정리","text":"그리고 다른 가족 흉에 편들지 않기, 엄마가 기댈 다른 곳 찾기입니다.","start":462.935,"end":467.366},{"n":109,"part":"정리","text":"오늘 엄마 전화가 오면, 이 가운데 한 마디만 먼저 꺼내 보세요.","start":467.746,"end":471.685},{"n":110,"part":"정리","text":"시청해주셔서 감사합니다.","start":472.065,"end":473.595}],"subs":[[0.2,4.932,"퇴근길에 엄마 전화가 오면, 받기 전에 숨부터 한 번 고르게 되시나요?"],[4.932,10.043,"전화를 받으면 오늘도 아빠 이야기,\n형제 이야기, 이웃 이야기가 이어집니다."],[10.043,14.872,"한 시간쯤 듣고 끊으면,\n엄마 목소리는 조금 밝아지고 나는 녹초가 됩니다."],[14.872,20.112,"그래도 엄마니까,\n내가 아니면 들어 줄 사람이 없으니까 오늘도 다 들어 줍니다."],[20.112,22.022,"결론부터 말씀드리겠습니다."],[22.022,27.081,"엄마의 하소연을 딸 혼자 다 받아 주면 안 되는 이유는,\n크게 세 가지로 볼 수 있습니다."],[27.081,30.831,"첫째, 엄마의 걱정이 내 걱정으로 남을 수 있습니다."],[30.831,35.39,"둘째, 다 들어 준다고 엄마와 저절로 가까워지는 것은 아닙니다."],[35.39,39.029,"셋째, 다른 가족과의 사이까지 멀어질 수 있습니다."],[39.029,42.927,"끊지 않고도 나를 지키는 말 네 가지를 끝에 정리해 드리겠습니다."],[42.927,47.307,"먼저 왜 하필 딸에게 하소연이 몰리는지부터 보겠습니다."],[47.307,52.773,"남편에게 말하면 싸움이 되고 친구에게는 흉이 될까 봐,\n편한 딸에게 몰리기 쉽습니다."],[52.773,56.019,"물론 아들이나 외동에게 기대는 엄마도 있습니다."],[56.019,60.734,"딸이 아니어도, 엄마의 하소연을 혼자 받는 자녀라면 함께 들어 보세요."],[60.734,64.817,"혹시 여러분 집에서도 엄마의 고민을 아는 사람이 나 하나뿐인가요?"],[64.817,70.517,"심리학에서는 아이가 부모의 마음을 돌보는\n역할을 떠맡는 것을 정서적 부모화라고 부릅니다."],[70.517,73.012,"부모와 자식의 자리가 바뀌는 것입니다."],[73.012,77.825,"2023년에 부모화를 다룬 연구 95편을 모아 정리한 논문이 나왔습니다."],[77.825,81.694,"대부분 어릴 때 이런 역할을 한 자녀를 조사한 연구입니다."],[81.694,86.724,"이런 역할을 많이 했다는 자녀일수록\n불안이나 우울이 더 많이 나타났습니다."],[86.724,93.144,"다만 수고를 알아주고 도와줄 사람이 있으면,\n더 단단해질 수 있다고 연구진은 봤습니다."],[93.144,97.754,"첫 번째 이유는, 엄마의 걱정이 내 걱정으로 남을 수 있다는 것입니다."],[97.754,100.882,"털어놓으면 엄마는 잠깐 마음이 풀릴 수 있습니다."],[100.882,103.955,"그런데 들은 이야기는 딸의 머릿속에 남습니다."],[103.955,108.328,"전화를 끊은 뒤에도 '엄마 오늘 괜찮을까' 하는 생각이 떠나지 않습니다."],[108.328,112.878,"밤에 잠들기 전에도 엄마가 한 말이 머릿속에서\n다시 재생되기도 합니다."],[112.878,117.527,"미국의 한 연구는 이혼 직후의 10대 딸 62명을 조사했습니다."],[117.527,123.047,"엄마의 무거운 이야기를 많이 들은 딸일수록,\n엄마 걱정도 크고 더 힘들어했습니다."],[123.047,129.069,"10대 딸 연구라 나와 같지는 않겠지만,\n통화 뒤 걱정이 남으면 내 이야기일 수 있습니다."],[129.069,134.686,"마치 엄마의 짐을 내 가방에 옮겨 담고,\n집에 와서도 내려놓지 못하는 것과 같습니다."],[134.686,140.009,"한마디로,\n하소연은 덜어지기만 하는 것이 아니라 듣는 쪽에 남기도 합니다."],[140.009,145.416,"두 번째 이유는,\n다 들어 준다고 엄마와 저절로 가까워지는 것은 아니라는 것입니다."],[145.416,147.476,"이렇게 생각하는 딸도 있습니다."],[147.476,150.122,"'내가 들어 줘야 엄마와 사이가 좋지.'"],[150.122,153.915,"그런데 앞의 10대 딸 연구에는 또 하나의 결과가 있었습니다."],[153.915,159.485,"엄마가 무거운 이야기를 많이 털어놓아도,\n그 딸들이 더 가깝다고 느끼지는 않았습니다."],[159.485,164.199,"통화가 엄마 이야기로만 채워진다면,\n내 이야기를 할 틈은 없을 수 있습니다."],[164.199,167.436,"가까운 사이란 서로의 이야기를 주고받는 사이입니다."],[167.436,171.576,"물론 엄마의 하소연을 들으며 친구처럼 가까워졌다는 딸도 있습니다."],[171.576,175.538,"차이는 한쪽만 쏟아 내느냐, 서로 주고받느냐일 수 있습니다."],[175.538,181.273,"한마디로, 듣기만 하는 딸은 엄마와 가까워졌다기보다 엄마를\n받쳐 주고 있을 수 있습니다."],[181.273,185.573,"그런데 세 번째 이유는 엄마와 나 둘만의 문제가 아닙니다."],[185.573,190.173,"세 번째 이유는, 다른 가족과의 사이까지 멀어질 수 있다는 것입니다."],[190.173,193.193,"엄마의 하소연에는 다른 가족이 자주 나옵니다."],[193.193,196.983,"\"너희 아빠는 왜 그 모양이니\", \"네 오빠는 연락도 없다.\""],[196.983,201.216,"이런 이야기를 매일 듣다 보면, 어느새 엄마 편에 서기 쉽습니다."],[201.216,205.231,"반대로 듣다 지쳐, 오히려 엄마가 미워지는 딸도 있습니다."],[205.231,210.341,"아빠를 만나면 엄마에게 들은 말이 먼저 떠올라,\n말투가 차가워지기도 합니다."],[210.341,214.529,"형제와 이야기할 때도 '나만 엄마를 챙긴다'는 서운함이 앞섭니다."],[214.529,219.72,"물론 폭력이나 외도,\n빚처럼 엄마가 실제로 피해를 입는 일이라면 흉이 아닙니다."],[219.72,224.26,"폭력이나 폭언이라면, 엄마와 함께 여성긴급전화에 전화해 보세요."],[224.26,227.975,"번호는 일삼육육이고, 설명란에도 적어 두겠습니다."],[227.975,233.182,"외도나 빚 문제라면,\n가족 상담이나 법률 상담을 같이 알아봐도 좋습니다."],[233.182,238.022,"그런 일이 아니라면,\n엄마 이야기만으로 다른 가족을 판단하게 될 수 있습니다."],[238.022,242.792,"엄마 속상함이 틀렸다는 뜻이 아니라,\n내가 판정하지 않아도 된다는 뜻입니다."],[242.792,246.172,"이와 닮은 연구가 2007년 미국에서 나왔습니다."],[246.172,251.902,"젊은 성인 천백여 명에게,\n부모가 상대 부모에 대해 하는 말과 자기 마음을 물었습니다."],[251.902,257.383,"부모가 자녀에게 상대 부모 흉을 볼수록,\n자녀는 '사이에 끼인 느낌'을 더 받았습니다."],[257.383,262.533,"그리고 이 느낌이 클수록 가족에 대한 만족도가 낮았고,\n마음 건강도 나빴습니다."],[262.533,265.548,"부모가 이혼하지 않은 집도 결과는 비슷했습니다."],[265.548,269.6,"부부가 풀 일을 자녀가 가운데서 떠안는 모양이라는 점이 닮았습니다."],[269.6,274.619,"한마디로,\n가운데 끼인 느낌이 클수록 가족 전체가 덜 편하게 느껴질 수 있습니다."],[274.619,279.757,"그런데 이미 많이 지쳐 있다면, 몸과 마음이 먼저 신호를 보냅니다."],[279.757,283.284,"엄마 이름이 휴대폰에 뜨면 가슴이 먼저 철렁합니다."],[283.284,287.311,"전화를 일부러 늦게 받거나, 받지 않고 나중에 문자로 답합니다."],[287.311,291.181,"그러고 나면 '나는 나쁜 딸인가' 하는 죄책감이 밀려옵니다."],[291.181,294.151,"통화를 마친 뒤 한동안 아무것도 하기 싫어집니다."],[294.151,298.061,"엄마와 통화한 날에는 가까운 사람에게 괜히 짜증을 냅니다."],[298.061,303.361,"이 가운데 자주 겪는 것이 있다면,\n통화 시간이나 횟수를 줄여도 된다는 신호입니다."],[303.361,309.272,"잠이나 일에까지 영향이 갈 만큼 이어진다면,\n엄마보다 먼저 나를 위한 상담을 받아 보세요."],[309.272,312.309,"이것은 엄마를 덜 사랑해서 생기는 일이 아닙니다."],[312.309,315.319,"오래 혼자 들어 온 무게가 쌓였을 수 있습니다."],[315.319,320.411,"그렇다면 엄마 전화를 끊지 않으면서\n나를 지키려면 어떻게 해야 할까요?"],[320.411,324.294,"첫 번째는, 통화가 끝나는 때를 먼저 정하는 말입니다."],[324.294,327.701,"\"엄마, 나 저녁 먹기 전까지만 통화할 수 있어.\""],[327.701,331.587,"처음에 말해 두면, 중간에 끊을 때 덜 갑작스럽습니다."],[331.587,335.609,"두 번째는, 마음은 받아 주되 해결은 돌려주는 말입니다."],[335.609,339.859,"\"엄마 많이 속상했구나. 엄마는 그 일을 어떻게 하고 싶어?\""],[339.859,345.199,"엄마의 마음을 알아주는 것과,\n엄마의 문제를 내가 풀어 주는 것은 다른 일입니다."],[345.199,349.09,"세 번째는, 다른 가족 흉에는 편을 들지 않는 말입니다."],[349.09,352.976,"\"나는 우리 가족 다 소중해서, 그 얘기는 듣기가 힘들어.\""],[352.976,357.346,"이 말은 엄마를 밀어내는 말이 아니라, 가족 모두를 지키는 말입니다."],[357.346,362.523,"다만 앞에서 말한 실제 피해라면,\n이 말 대신 도움받을 곳을 함께 찾아 주세요."],[362.523,366.859,"네 번째는, 엄마에게 다른 기댈 곳을 함께 찾아 주는 말입니다."],[366.859,371.869,"\"엄마 속상한 마음은 이모나 가까운 분과도\n나눠 봐. 나도 다음에 또 들을게.\""],[371.869,377.003,"아빠에게 못 한 말이라면,\n어떻게 말할지 같이 정리해 드리는 것도 방법입니다."],[377.003,380.02,"형제가 있다면 번갈아 듣는 것도 방법입니다."],[380.02,385.603,"마음이 많이 힘들어 보이면,\n동네 정신건강복지센터 무료 상담을 같이 알아봐도 좋습니다."],[385.603,391.183,"예약이 몇 주 걸릴 수 있으니,\n급하면 설명란의 정신건강 상담 전화를 알려 드리세요."],[391.183,393.772,"이 가운데 하나만 알려 드려도 충분합니다."],[393.772,396.929,"이 말들을 처음 꺼내면 엄마가 서운해할 수 있습니다."],[396.929,399.435,"\"딸이 남 같다\"는 말을 들을 수도 있습니다."],[399.435,401.999,"서운함이 금방 줄지 않는 엄마도 있습니다."],[401.999,406.047,"서운해하셔도, 내가 정한 선은 같은 말로 지켜도 됩니다."],[406.047,411.507,"다만 하소연 끝에 늘 나를 탓하거나 깎아내린다면,\n그건 하소연을 넘어선 일입니다."],[411.507,415.767,"그때는 통화를 줄여도 괜찮으니, 나를 위한 상담부터 받아 보세요."],[415.767,421.607,"엄마가 \"죽고 싶다\"고 하면,\n그날 바로 엄마와 함께 자살예방 상담 전화에 걸어 보세요."],[421.607,426.381,"번호는 일공구이고,\n엄마가 싫다 하시면 딸이 먼저 걸어 물어봐도 됩니다."],[426.381,431.405,"늘 하시는 말이어도 넘기지 말고,\n당장 위험해 보이면 일일구에 알리세요."],[431.405,436.15,"딸이 다 떠안으라는 말이 아니라, 전문가에게 넘기자는 뜻입니다."],[436.15,439.417,"자, 마지막으로 오늘 내용을 정리하겠습니다."],[439.417,443.534,"엄마의 하소연을 혼자 다 받아 주면 안 되는 이유는 세 가지였습니다."],[443.534,447.284,"첫째, 엄마의 걱정이 내 걱정으로 남을 수 있습니다."],[447.284,451.674,"둘째, 다 들어 준다고 엄마와 저절로 가까워지지는 않습니다."],[451.674,455.314,"셋째, 다른 가족과의 사이까지 멀어질 수 있습니다."],[455.314,458.522,"그리고 끊지 않고 나를 지키는 말은 네 가지였습니다."],[458.522,462.935,"끝나는 때를 먼저 말하기, 마음은 받고 해결은 돌려주기입니다."],[462.935,467.746,"그리고 다른 가족 흉에 편들지 않기, 엄마가 기댈 다른 곳 찾기입니다."],[467.746,472.065,"오늘 엄마 전화가 오면, 이 가운데 한 마디만 먼저 꺼내 보세요."],[472.065,473.995,"시청해주셔서 감사합니다."]]};/*EP-DATA:END*/</script>

function rows(W_, items, out) {       // 판 위 번호 목록 [[번호, 색, 글, 시각]]
  items.forEach(([no, c, text, t], i) => board(W_, [500, 135 + i * 82, 930, 76],
    `<div class="row" style="justify-content:flex-start;width:100%;font-size:48px"><span class="pchip" style="background:${c};font-size:42px;padding:6px 20px">${no}</span><span class="ink">${text}</span></div>`, t, out));
}
function split(a, b) {                 // 통화 — 왼쪽 정류장의 딸 · 오른쪽 거실의 엄마
  const L_ = world(a, b, "BUS"), R_ = world(a, b, "MOMHOME");
  L_.w.style.clipPath = "polygon(0 0, 51% 0, 49% 100%, 0 100%)";       // 세계(w)를 자름 — 장면의 제목·이름표는 자르지 않음
  R_.w.style.clipPath = "polygon(51% 0, 100% 0, 100% 100%, 49% 100%)";
  K.el(`<svg class="light" viewBox="0 0 1920 1080"><line x1="979" y1="0" x2="941" y2="1080" stroke="#FFFDF6" stroke-width="10"/></svg>`, R_.L.light);
  return { L_, R_ };
}
function tags(W_, list_, out) {        // 떠오르는 낱말 꼬리표 [[글, x, y, 시각]]
  list_.forEach(([t, x, y, at]) => { const n = K.el(`<div class="tag">${t}</div>`, W_.L.fly); gsap.set(n, { x, y, opacity: 0 }); pop(n, at); if (out) hide(n, out); });
}
