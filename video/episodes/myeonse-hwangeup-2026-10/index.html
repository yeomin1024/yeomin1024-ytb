<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"myeonse-hwangeup-2026-10","topic":"test","duration":439.26,"audio":null,"thumb":null,"estimated":true,"est_model":{"perSyl":0.151,"comma":0.25,"base":-0.08,"min":0.8,"lead":0.3,"gap":0.45,"part":1,"tail":0.8},"synced":"2026-10-24T05:50:29Z","sent":[{"n":1,"part":"도입","text":"11월 1일부터 일본 면세는, 출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다.","start":0.3,"end":6.057},{"n":2,"part":"도입","text":"방법을 모르고 가면, 공항에서 면세 때문에만 1시간 반 넘게 쓸 수도 있습니다.","start":6.507,"end":11.358},{"n":3,"part":"도입","text":"알고 가면, 줄을 거의 서지 않고 약 2분 만에 끝낼 수 있어요.","start":11.808,"end":15.451},{"n":4,"part":"도입","text":"오늘은 당신이 직접 면세를 받는다고 정하고, 두 경우를 분 단위로 비교해 보겠습니다.","start":15.901,"end":21.205},{"n":5,"part":"상황 설정","text":"먼저 상황을 정하겠습니다.","start":22.205,"end":23.786},{"n":6,"part":"상황 설정","text":"당신은 11월에 도쿄로 3박 4일 여행을 갑니다.","start":24.236,"end":27.176},{"n":7,"part":"상황 설정","text":"돌아오는 비행기는 하네다 공항 3터미널에서 오후 6시에 출발합니다.","start":27.626,"end":31.925},{"n":8,"part":"상황 설정","text":"당신은 출발 2시간 반 전인 오후 3시 반에 공항에 도착합니다.","start":32.375,"end":36.07},{"n":9,"part":"상황 설정","text":"쇼핑은 두 번 했습니다.","start":36.52,"end":37.799},{"n":10,"part":"상황 설정","text":"첫날에는 드러그스토어에서 과자와 화장품을 한 번에 계산했고, 둘째 날에는 옷을 샀습니다.","start":38.249,"end":44.006},{"n":11,"part":"상황 설정","text":"11월부터는 두 곳 모두 여권을 보여 주고, 세금을 포함한 가격으로 결제합니다.","start":44.456,"end":49.458},{"n":12,"part":"상황 설정","text":"옷값이 세금 포함 3만 3천 엔이었다면, 그중 3천 엔이 나중에 돌려받을 소비세입니다.","start":49.908,"end":55.363},{"n":13,"part":"상황 설정","text":"이 돈을 돌려받으려면, 당신은 출국하는 날 공항에서 세관 확인을 받아야 합니다.","start":55.813,"end":60.815},{"n":14,"part":"상황 설정","text":"일본이 이렇게 바꾼 건, 면세로 산 물건을 일본 안에서 되파는 부정을 막기 위해서입니다.","start":61.265,"end":66.72},{"n":15,"part":"상황 설정","text":"세관 확인은 짐을 맡기기 전, 출발 로비의 면세 수속 단말기에서 합니다.","start":67.17,"end":71.568},{"n":16,"part":"상황 설정","text":"공항은 출발하는 사람이 몰리는 저녁 시간대라고 정하겠습니다.","start":72.018,"end":75.864},{"n":17,"part":"상황 설정","text":"줄 서는 시간은 실제로 잰 것이 아니라, 모의실험으로 계산한 값입니다.","start":76.314,"end":80.712},{"n":18,"part":"상황 설정","text":"단말기 수처럼 공개되지 않은 숫자는 가정했기 때문에, 실제 시간과는 다를 수 있습니다.","start":81.162,"end":86.617},{"n":19,"part":"상황 설정","text":"그럼 먼저, 방법을 모르고 간 당신부터 따라가 보겠습니다.","start":87.067,"end":90.71},{"n":20,"part":"첫째, 모르고 간 당신","text":"첫 번째 실수는 쇼핑할 때 이미 일어났습니다.","start":91.71,"end":94.348},{"n":21,"part":"첫째, 모르고 간 당신","text":"과자와 화장품을 한 영수증으로 계산하고, 호텔에서 그 과자를 한 봉지 먹었거든요.","start":94.798,"end":99.951},{"n":22,"part":"첫째, 모르고 간 당신","text":"그런데 세관 확인은 영수증 단위로 합니다.","start":100.401,"end":102.888},{"n":23,"part":"첫째, 모르고 간 당신","text":"한 영수증에 든 물건 가운데 하나라도 없으면, 그 영수증 전체가 환급되지 않습니다.","start":103.338,"end":108.491},{"n":24,"part":"첫째, 모르고 간 당신","text":"과자 한 봉지 때문에, 같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다.","start":108.941,"end":113.641},{"n":25,"part":"첫째, 모르고 간 당신","text":"게다가 일부를 썼으니, 당신은 단말기 대신 세관 창구에 가서 신고해야 합니다.","start":114.091,"end":118.942},{"n":26,"part":"첫째, 모르고 간 당신","text":"두 번째 실수는 돌려받는 방법입니다.","start":119.392,"end":121.577},{"n":27,"part":"첫째, 모르고 간 당신","text":"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다.","start":122.027,"end":125.972},{"n":28,"part":"첫째, 모르고 간 당신","text":"하네다 3터미널의 현금 환급 단말기는, 출국 심사를 마친 뒤 구역에 있습니다.","start":126.422,"end":131.273},{"n":29,"part":"첫째, 모르고 간 당신","text":"이제 공항입니다.","start":131.723,"end":132.7},{"n":30,"part":"첫째, 모르고 간 당신","text":"오후 3시 반에 도착한 당신은, 먼저 세관 창구로 가야 합니다.","start":133.15,"end":136.944},{"n":31,"part":"첫째, 모르고 간 당신","text":"붐비는 시간이라 창구 줄이 길어서, 신고를 마치면 오후 4시 22분입니다.","start":137.394,"end":142.245},{"n":32,"part":"첫째, 모르고 간 당신","text":"걷고, 줄 서고, 신고하는 데만 약 52분이 걸린 겁니다.","start":142.695,"end":146.437},{"n":33,"part":"첫째, 모르고 간 당신","text":"이제야 체크인을 하고, 보안 검사와 출국 심사를 지납니다.","start":146.887,"end":150.53},{"n":34,"part":"첫째, 모르고 간 당신","text":"그리고 현금 환급 단말기 앞에 섭니다.","start":150.98,"end":153.165},{"n":35,"part":"첫째, 모르고 간 당신","text":"업계 발표로는 한 사람에 약 1분이면 받는다지만, 앞에 줄이 길면 기다려야 합니다.","start":153.615,"end":158.768},{"n":36,"part":"첫째, 모르고 간 당신","text":"현금으로 받으려는 사람이 몰려, 여기서도 약 46분이 걸립니다.","start":159.218,"end":163.465},{"n":37,"part":"첫째, 모르고 간 당신","text":"체크인과 보안 검사를 빼고도, 면세에만 약 1시간 38분을 쓴 셈입니다.","start":163.915,"end":168.615},{"n":38,"part":"첫째, 모르고 간 당신","text":"2시간 반 일찍 왔는데, 그중 1시간 반 넘게를 줄과 창구에서 보낸 거죠.","start":169.065,"end":173.463},{"n":39,"part":"첫째, 모르고 간 당신","text":"이보다 더 나쁜 실수도 있습니다.","start":173.913,"end":175.796},{"n":40,"part":"첫째, 모르고 간 당신","text":"산 물건을 캐리어에 넣고, 체크인 카운터에서 짐부터 맡기는 겁니다.","start":176.246,"end":180.493},{"n":41,"part":"첫째, 모르고 간 당신","text":"세관 확인은 짐을 맡기기 전에 받아야 하고, 한 번 맡긴 짐은 되찾아 올 수 없습니다.","start":180.943,"end":185.945},{"n":42,"part":"첫째, 모르고 간 당신","text":"그러면 캐리어에 든 물건의 세금은, 한 푼도 돌려받지 못합니다.","start":186.395,"end":190.34},{"n":43,"part":"첫째, 모르고 간 당신","text":"그렇다면 같은 비행기를 타는 당신이 방법을 알고 갔다면 어땠을까요?","start":190.79,"end":194.938},{"n":44,"part":"둘째, 알고 간 당신","text":"알고 간 당신은 일본에 가기 전부터 준비합니다.","start":195.938,"end":198.727},{"n":45,"part":"둘째, 알고 간 당신","text":"첫째, 당신은 출국 전에 비지트 재팬 웹을 설정해 둬야 합니다.","start":199.177,"end":202.971},{"n":46,"part":"둘째, 알고 간 당신","text":"하네다를 포함한 일곱 개 공항에서는, 이걸로 휴대전화 면세 수속을 할 수 있기 때문입니다.","start":203.421,"end":209.027},{"n":47,"part":"둘째, 알고 간 당신","text":"미리 설정해 두지 않으면, 공항에서 휴대전화 수속을 쓸 수 없습니다.","start":209.477,"end":213.724},{"n":48,"part":"둘째, 알고 간 당신","text":"둘째, 살 때 돌려받는 방법을 카드로 등록하고, 수수료가 얼마인지 물어봐야 합니다.","start":214.174,"end":219.577},{"n":49,"part":"둘째, 알고 간 당신","text":"환급 업체 수수료는 법으로 정해져 있지 않아서, 매장마다 다를 수 있거든요.","start":220.027,"end":224.727},{"n":50,"part":"둘째, 알고 간 당신","text":"셋째, 일본에서 먹을 과자는 화장품과 따로 계산해야 합니다.","start":225.177,"end":228.971},{"n":51,"part":"둘째, 알고 간 당신","text":"그러면 과자를 먹어도, 화장품 영수증은 그대로 환급받을 수 있습니다.","start":229.421,"end":233.819},{"n":52,"part":"둘째, 알고 간 당신","text":"넷째, 면세품은 가방 하나에 모아 두고, 수속이 끝날 때까지 맡기지 않아야 합니다.","start":234.269,"end":239.521},{"n":53,"part":"둘째, 알고 간 당신","text":"같은 날 오후 3시 반, 알고 간 당신도 공항에 도착합니다.","start":239.971,"end":243.463},{"n":54,"part":"둘째, 알고 간 당신","text":"당신은 체크인 카운터보다 먼저, 면세 수속 단말기의 줄을 봐야 합니다.","start":243.913,"end":248.311},{"n":55,"part":"둘째, 알고 간 당신","text":"줄이 짧으면 단말기에 여권을 대고, 길면 전용 와이파이 구역에서 휴대전화로 수속합니다.","start":248.761,"end":254.367},{"n":56,"part":"둘째, 알고 간 당신","text":"전용 와이파이는 보안 검사장에 들어가기 전, 출발 로비에서만 잡힙니다.","start":254.817,"end":259.366},{"n":57,"part":"둘째, 알고 간 당신","text":"휴대전화로 잘 안 되면, 그때는 단말기로 하면 됩니다.","start":259.816,"end":263.157},{"n":58,"part":"둘째, 알고 간 당신","text":"화면에 초록색이 뜨면, 그걸로 세관 확인은 끝입니다.","start":263.607,"end":266.948},{"n":59,"part":"둘째, 알고 간 당신","text":"걸린 시간은 약 2분, 시계는 오후 3시 32분입니다.","start":267.398,"end":270.89},{"n":60,"part":"둘째, 알고 간 당신","text":"이제 면세품 가방도 맡기고, 바로 체크인하면 됩니다.","start":271.34,"end":274.681},{"n":61,"part":"둘째, 알고 간 당신","text":"돈은 카드로 들어오니, 현금 단말기 줄을 설 필요도 없습니다.","start":275.131,"end":278.925},{"n":62,"part":"둘째, 알고 간 당신","text":"다만 카드로 며칠 만에 들어오는지는, 아직 공식 설명이 없습니다.","start":279.375,"end":283.471},{"n":63,"part":"둘째, 알고 간 당신","text":"그럼 운 나쁘게 빨간색이 뜨면 어떻게 될까요?","start":283.921,"end":286.559},{"n":64,"part":"둘째, 알고 간 당신","text":"빨간색은 세관이 검사가 필요하다고 본 경우로, 기준은 공개되지 않았습니다.","start":287.009,"end":291.86},{"n":65,"part":"둘째, 알고 간 당신","text":"휴대전화로 수속해도 빨간색은 똑같이 뜰 수 있어요.","start":292.31,"end":295.401},{"n":66,"part":"둘째, 알고 간 당신","text":"이때는 세관 검사장에 가서 산 물건을 직접 보여 줘야 합니다.","start":295.851,"end":299.395},{"n":67,"part":"둘째, 알고 간 당신","text":"붐비는 시간이라 줄이 길어서, 검사가 끝나면 오후 4시 20분입니다.","start":299.845,"end":304.243},{"n":68,"part":"둘째, 알고 간 당신","text":"약 50분이 걸렸지만, 출발까지는 아직 1시간 40분이 남습니다.","start":304.693,"end":308.94},{"n":69,"part":"둘째, 알고 간 당신","text":"면세품을 가방 하나에 모아 뒀으니, 꺼내 보여 주는 시간도 짧았고요.","start":309.39,"end":313.637},{"n":70,"part":"둘째, 알고 간 당신","text":"그래서 휴대전화로 수속하더라도, 공항에는 시간 여유를 두고 가야 합니다.","start":314.087,"end":318.787},{"n":71,"part":"둘째, 알고 간 당신","text":"관광청도 시간에 여유를 두고 공항에 오라고 안내합니다.","start":319.237,"end":322.63},{"n":72,"part":"둘째, 알고 간 당신","text":"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않습니다.","start":323.08,"end":327.478},{"n":73,"part":"둘째, 알고 간 당신","text":"그렇다면 두 당신의 차이는, 정확히 어디서 생겼을까요?","start":327.928,"end":331.42},{"n":74,"part":"셋째, 차이를 만든 것","text":"모르고 간 당신이 실수를 하나씩 고쳤다고 해 보겠습니다.","start":332.42,"end":335.813},{"n":75,"part":"셋째, 차이를 만든 것","text":"빨간색이 뜨는 경우까지 넣어 평균으로 따지면, 처음에는 약 1시간 38분입니다.","start":336.263,"end":341.567},{"n":76,"part":"셋째, 차이를 만든 것","text":"과자만 따로 계산해도, 세관 창구에 갈 일이 없어 약 49분으로 줄어듭니다.","start":342.017,"end":346.868},{"n":77,"part":"셋째, 차이를 만든 것","text":"나머지 방법까지 다 지키면, 평균 약 8분이 됩니다.","start":347.318,"end":350.508},{"n":78,"part":"셋째, 차이를 만든 것","text":"그중 가장 큰 차이는 현금이냐 카드냐에서 나왔습니다.","start":350.958,"end":354.2},{"n":79,"part":"셋째, 차이를 만든 것","text":"같은 조건에서 현금 대신 카드로만 바꿔도, 약 40분이 줄었습니다.","start":354.65,"end":358.897},{"n":80,"part":"셋째, 차이를 만든 것","text":"현금 환급 단말기는 몇 곳에만 있어서, 현금을 고르는 사람이 몰리면 줄이 생길 수 있습니다.","start":359.347,"end":364.953},{"n":81,"part":"셋째, 차이를 만든 것","text":"두 번째는 영수증이었습니다.","start":365.403,"end":367.135},{"n":82,"part":"셋째, 차이를 만든 것","text":"과자를 따로 계산하지 않으면, 화장품 세금을 잃고 세관 창구 줄까지 서야 하니까요.","start":367.585,"end":372.738},{"n":83,"part":"셋째, 차이를 만든 것","text":"세 번째는 단말기 줄을 보고 수속 방법을 고른 것입니다.","start":373.188,"end":376.43},{"n":84,"part":"셋째, 차이를 만든 것","text":"단말기가 모자란 공항이라고 가정해 보면 차이가 더 커집니다.","start":376.88,"end":380.575},{"n":85,"part":"셋째, 차이를 만든 것","text":"단말기가 6대뿐이라면, 단말기 줄만 선 사람은 약 94분이 걸렸습니다.","start":381.025,"end":385.725},{"n":86,"part":"셋째, 차이를 만든 것","text":"줄을 보고 휴대전화로 바꾼 사람은, 약 3분 반이면 끝났고요.","start":386.175,"end":389.969},{"n":87,"part":"셋째, 차이를 만든 것","text":"반대로 공항이 한산하면, 실수를 해도 약 12분이면 끝났습니다.","start":390.419,"end":394.515},{"n":88,"part":"셋째, 차이를 만든 것","text":"결국 붐비는 시간일수록, 방법을 아느냐 모르느냐가 1시간 넘는 차이를 만듭니다.","start":394.965,"end":400.118},{"n":89,"part":"정리","text":"마지막으로, 가장 빠르게 면세 받는 방법을 정리하겠습니다.","start":401.118,"end":404.912},{"n":90,"part":"정리","text":"하나, 출국 전에 비지트 재팬 웹을 설정해 두세요.","start":405.362,"end":408.401},{"n":91,"part":"정리","text":"둘, 살 때 환급 방법은 카드로 등록하고, 수수료를 물어보세요.","start":408.851,"end":412.895},{"n":92,"part":"정리","text":"셋, 일본에서 먹거나 쓸 물건은 따로 계산하세요.","start":413.345,"end":416.384},{"n":93,"part":"정리","text":"넷, 면세품은 가방 하나에 모으고, 수속이 끝나기 전에는 맡기지 마세요.","start":416.834,"end":421.482},{"n":94,"part":"정리","text":"다섯, 공항에 도착하면 체크인보다 먼저, 줄을 보고 단말기나 휴대전화로 수속하세요.","start":421.932,"end":427.486},{"n":95,"part":"정리","text":"여섯, 빨간색이 뜰 수 있으니, 공항에는 시간 여유를 두고 가세요.","start":427.936,"end":432.131},{"n":96,"part":"정리","text":"그리고 산 날부터 90일 안에 출국해야 한다는 것도 잊지 마세요.","start":432.581,"end":436.427},{"n":97,"part":"정리","text":"시청해주셔서 감사합니다.","start":436.877,"end":438.458}],"subs":[[0.3,6.057,"11월 1일부터 일본 면세는,\n출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다."],[6.507,11.358,"방법을 모르고 가면,\n공항에서 면세 때문에만 1시간 반 넘게 쓸 수도 있습니다."],[11.808,15.451,"알고 가면, 줄을 거의 서지 않고 약 2분 만에 끝낼 수 있어요."],[15.901,21.205,"오늘은 당신이 직접 면세를 받는다고 정하고,\n두 경우를 분 단위로 비교해 보겠습니다."],[22.205,23.786,"먼저 상황을 정하겠습니다."],[24.236,27.176,"당신은 11월에 도쿄로 3박 4일 여행을 갑니다."],[27.626,31.925,"돌아오는 비행기는 하네다 공항 3터미널에서 오후 6시에 출발합니다."],[32.375,36.07,"당신은 출발 2시간 반 전인 오후 3시 반에 공항에 도착합니다."],[36.52,37.799,"쇼핑은 두 번 했습니다."],[38.249,44.006,"첫날에는 드러그스토어에서 과자와 화장품을 한 번에 계산했고,\n둘째 날에는 옷을 샀습니다."],[44.456,49.458,"11월부터는 두 곳 모두 여권을 보여 주고,\n세금을 포함한 가격으로 결제합니다."],[49.908,55.363,"옷값이 세금 포함 3만 3천 엔이었다면,\n그중 3천 엔이 나중에 돌려받을 소비세입니다."],[55.813,60.815,"이 돈을 돌려받으려면,\n당신은 출국하는 날 공항에서 세관 확인을 받아야 합니다."],[61.265,66.72,"일본이 이렇게 바꾼 건,\n면세로 산 물건을 일본 안에서 되파는 부정을 막기 위해서입니다."],[67.17,71.568,"세관 확인은 짐을 맡기기 전, 출발 로비의 면세 수속 단말기에서 합니다."],[72.018,75.864,"공항은 출발하는 사람이 몰리는 저녁 시간대라고 정하겠습니다."],[76.314,80.712,"줄 서는 시간은 실제로 잰 것이 아니라, 모의실험으로 계산한 값입니다."],[81.162,86.617,"단말기 수처럼 공개되지 않은 숫자는 가정했기 때문에,\n실제 시간과는 다를 수 있습니다."],[87.067,90.71,"그럼 먼저, 방법을 모르고 간 당신부터 따라가 보겠습니다."],[91.71,94.348,"첫 번째 실수는 쇼핑할 때 이미 일어났습니다."],[94.798,99.951,"과자와 화장품을 한 영수증으로 계산하고,\n호텔에서 그 과자를 한 봉지 먹었거든요."],[100.401,102.888,"그런데 세관 확인은 영수증 단위로 합니다."],[103.338,108.491,"한 영수증에 든 물건 가운데 하나라도 없으면,\n그 영수증 전체가 환급되지 않습니다."],[108.941,113.641,"과자 한 봉지 때문에,\n같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다."],[114.091,118.942,"게다가 일부를 썼으니,\n당신은 단말기 대신 세관 창구에 가서 신고해야 합니다."],[119.392,121.577,"두 번째 실수는 돌려받는 방법입니다."],[122.027,125.972,"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다."],[126.422,131.273,"하네다 3터미널의 현금 환급 단말기는,\n출국 심사를 마친 뒤 구역에 있습니다."],[131.723,132.7,"이제 공항입니다."],[133.15,136.944,"오후 3시 반에 도착한 당신은, 먼저 세관 창구로 가야 합니다
