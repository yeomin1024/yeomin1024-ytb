// ---------- S&P500 총수익 선 (2000-01 = 1) ----------
function spx(parent, o) {
  const i0 = o.i0 || 0, i1 = o.i1 == null ? T - 1 : o.i1, n = i1 - i0 + 1;
  const vals = AN.tri.slice(i0, i1 + 1), vmax = Math.max(...vals) * 1.04, vmin = Math.min(...vals) * 0.88;
  const X = i => i * o.w / (n - 1), Yf = v => o.h - (v - vmin) / (vmax - vmin) * o.h;
  const id = "c" + (++UID);
  let bands = "";
  if (o.bands) {                                             // 큰 하락(월평균 가격이 그때까지 최고치보다 20% 넘게 낮은 달)
    let a = null;
    for (let i = 0; i <= n; i++) {
      const d = i < n ? AN.dd[i0 + i] : 0;
      if (d <= -0.2 && a == null) a = i;
      if (d > -0.2 && a != null) { bands += `<rect x="${X(a).toFixed(1)}" y="0" width="${(X(i - 1) - X(a) + o.w / (n - 1)).toFixed(1)}" height="${o.h}" fill="rgba(255,77,61,.2)"/>`; a = null; }
    }
  }
  let stars = "";
  if (o.stars) for (let i = 0; i < n; i++) if (AN.ath[i0 + i]) stars += `<circle cx="${X(i).toFixed(1)}" cy="${Yf(vals[i]).toFixed(1)}" r="9" fill="${Y}"/>`;
  const svg = svgAt(parent, o.x, o.y, o.w, o.h, `<defs><clipPath id="${id}"><rect x="-30" y="-60" width="0" height="${o.h + 120}"/></clipPath></defs>
    <g clip-path="url(#${id})">${bands}<path d="${pathOf(vals, X, Yf)}" fill="none" stroke="${o.color || WH}" stroke-width="${o.sw || 7}" stroke-linejoin="round" stroke-linecap="round"/><g class="stars">${stars}</g></g>`);
  const clip = svg.querySelector(`#${id} rect`);
  const show = k => clip.setAttribute("width", (X(Math.max(0, Math.min(n - 1, k))) + 30).toFixed(1));
  return { svg, X, Yf, n, i0, vals, show, reveal: (at, dur) => prog(at, dur, 0, n - 1, show), stars: svg.querySelector(".stars") };
}

// ---------- 163번 막대 (시작 달 순서, 높이 = 차이) ----------
function tourn(parent, data, o) {
  const n = data.length, bw = o.w / n, id = "c" + (++UID);
  const up = r => Math.max(4, (r - 1) * o.scale), dn = r => Math.max(4, (1 / r - 1) * o.scale);
  const rect = (i, r) => r >= 1
    ? `<rect x="${(i * bw + 0.9).toFixed(1)}" y="${(o.base - up(r)).toFixed(1)}" width="${(bw - 1.8).toFixed(1)}" height="${up(r).toFixed(1)}" fill="${o.cA || G}" data-k="A"/>`
    : `<rect x="${(i * bw + 0.9).toFixed(1)}" y="${o.base}" width="${(bw - 1.8).toFixed(1)}" height="${dn(r).toFixed(1)}" fill="${o.cB || R}" data-k="B"/>`;
  const svg = svgAt(parent, o.x, o.y, o.w, o.h, `<defs><clipPath id="${id}"><rect x="-4" y="-20" width="0" height="${o.h + 40}"/></clipPath></defs>
    <line x1="0" x2="${o.w}" y1="${o.base}" y2="${o.base}" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
    <g clip-path="url(#${id})" class="bars">${data.map(([, r], i) => rect(i, r)).join("")}</g>`);
  const clip = svg.querySelector(`#${id} rect`);
  const wa = [], wb = [];
  let a = 0, b = 0;
  data.forEach(([, r]) => { if (r > 1) a++; else b++; wa.push(a); wb.push(b); });
  return {
    svg, n, bw, data, rects: svg.querySelectorAll(".bars rect"),
    X: i => o.x + i * bw, top: r => o.y + o.base - up(r), bottom: r => o.y + o.base + dn(r), base: o.y + o.base,
    show: k => clip.setAttribute("width", (Math.max(0, k) * bw + 4).toFixed(1)),
    at: k => { const i = Math.floor(Math.max(0, Math.min(n, k))) - 1; return i < 0 ? [0, 0, null] : [wa[i], wb[i], data[i][0]]; },
  };
}

}
