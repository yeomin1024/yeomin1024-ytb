# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 주식 (stock)
# VERSION: v1.0 — 2026-10-09 — 분석 코드(youtube_topic_analyzer.py v2.3.0)에서 주제별로 바뀌는 값(키워드 등)을 분리
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 메모장으로 열어 값만 바꾸고 저장하세요.
#    - 글자는 "따옴표" 안에, 목록은 [ "가", "나", ] 처럼 쉼표로 구분 (마지막 쉼표 있어도 됨), 숫자·true/false 는 그대로
#    - '#' 뒤는 설명(주석)이라 무시됩니다
# ▶ 실행:  python youtube_topic_analyzer.py --config stock/analyzer_config.toml
#          (--config 를 빼면 <스크립트 폴더>/stock/analyzer_config.toml 을 자동으로 읽음)
# ▶ 다른 주제: 이 파일을 <새 폴더>/analyzer_config.toml 로 복사해 고치거나,
#          python youtube_topic_analyzer.py --topic 부동산 --folder realestate --init-config  (새 설정 파일 생성)
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#   같은 이름으로 아래 [advanced] 등에 적으면 그 값으로 덮어씁니다. (우선순위: 코드 기본값 < 이 파일 < 명령줄 옵션)
# =====================================================================================================

[topic]
TOPIC = "주식"                       # 분석 주제 (자동완성 모드에서 씨앗 검색어로도 사용)
PROJECT_FOLDER = "stock"             # 결과 상위 폴더 → PC: output/stock/result/, GitHub: stock/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"   # 결과를 푸시할 저장소
GITHUB_BRANCH = "main"                      # 푸시할 브랜치

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

