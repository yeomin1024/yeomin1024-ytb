012,"end":64.197},{"n":16,"part":"예시 부부의 형편","text":"두 사람은 67세 동갑이고, 서울 아파트에 살아요.","start":65.197,"end":68.538},{"n":17,"part":"예시 부부의 형편","text":"아파트 공시가격은 5억 원이고, 대출은 없어요.","start":68.988,"end":72.027},{"n":18,"part":"예시 부부의 형편","text":"차는 10년이 안 된 승용차 한 대이고, 지금 기준으로 매긴 차 값인 차량가액은 1,000만 원으로 봤습니다.","start":72.477,"end":78.786},{"n":19,"part":"예시 부부의 형편","text":"예금은 둘이 합쳐 4,000만 원이고, 금리는 3.5%로 봤어요.","start":79.236,"end":83.582},{"n":20,"part":"예시 부부의 형편","text":"국민연금은 남편이 한 달 120만 원, 아내가 50만 원이고, 두 사람 모두 일은 하지 않아요.","start":84.032,"end":89.888},{"n":21,"part":"예시 부부의 형편","text":"이 정도면 기초연금은 못 받는다고 생각하시죠?","start":90.338,"end":93.127},{"n":22,"part":"예시 부부의 형편","text":"그런데 받을 수 있는지는, 세 가지 원칙으로 알 수 있습니다.","start":93.577,"end":97.22},{"n":23,"part":"예시 부부의 형편","text":"하나씩 보겠습니다.","start":97.67,"end":98.798},{"n":24,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"첫 번째 원칙은, 재산은 나라가 정한 금액만큼 먼저 빼고, 남은 재산의 일부만 소득으로 본다는 것입니다.","start":99.798,"end":106.409},{"n":25,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"소득인정액은 본인과 배우자의 한 달 소득에, 재산을 소득으로 바꾼 금액을 더한 숫자예요.","start":106.859,"end":112.465},{"n":26,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"이 소득인정액이 나라가 정한 한도인 선정기준액 이하이면, 기초연금을 받을 수 있습니다.","start":112.915,"end":118.521},{"n":27,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"선정기준액은 올해 혼자면 한 달 247만 원, 부부면 395만 2천 원입니다.","start":118.971,"end":124.426},{"n":28,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"집값은 실제로 사고파는 값인 시세가 아니라, 나라가 해마다 정해 발표하는 공시가격으로 봐요.","start":124.876,"end":130.784},{"n":29,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"우리 집 공시가격이 얼마인지 알고 계신가요?","start":131.234,"end":133.872},{"n":30,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"집과 차 같은 재산에서는, 생활에 필요한 몫으로 보는 기본재산액을 빼 주는데, 서울 같은 대도시는 1억 3,500만 원입니다.","start":134.322,"end":142.542},{"n":31,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"중소도시는 8,500만 원, 농어촌은 7,250만 원이에요.","start":142.992,"end":147.588},{"n":32,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"예금 같은 금융재산은 2,000만 원을 빼 주고, 대출 같은 빚도 재산에서 뺍니다.","start":148.038,"end":152.988},{"n":33,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"이렇게 빼고 남은 재산의 4%를 1년 동안 번 소득으로 치고, 그 금액을 12달로 나눠 한 달 소득에 더해요.","start":153.438,"end":160.252},{"n":34,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"예를 들어 남은 재산이 1억 원이면, 4%인 400만 원을 12달로 나눈 약 33만 원만 한 달 소득으로 잡힙니다.","start":160.702,"end":167.969},{"n":35,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"재산을 은행에 맡겨 두고, 1년에 4% 이자를 받는 것처럼 보는 거예요.","start":168.419,"end":173.119},{"n":36,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"다만 차량가액이 4,000만 원 이상인 차는, 차값 전부가 한 달 소득으로 잡힙니다.","start":173.569,"end":178.67},{"n":37,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"그래서 이런 차가 있으면, 사실상 기초연금을 받을 수 없습니다.","start":179.12,"end":183.065},{"n":38,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"10년 이상 된 차는, 4,000만 원 이상이어도 차값 전부를 소득으로 잡지는 않습니다.","start":183.515,"end":188.767},{"n":39,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"국민연금은 받는 돈이 전부 소득으로 잡혀요.","start":189.217,"end":191.855},{"n":40,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"일해서 버는 돈은 한 사람당 한 달 116만 원을 먼저 빼고, 나머지의 70%만 소득으로 잡힙니다.","start":192.305,"end":198.666},{"n":41,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"예를 들어 한 달에 200만 원을 벌면, 116만 원을 뺀 84만 원의 70%인 58만 8천 원만 소득으로 잡힙니다.","start":199.116,"end":206.685},{"n":42,"part":"원칙 하나, 재산은 일부만 소득으로 본다","text":"한마디로, 집 한 채가 있다고 기초연금을 못 받는 게 아닙니다.","start":207.135,"end":210.929},{"n":43,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"두 번째 원칙은, 일단 기초연금을 받을 수 있게 되면, 국민연금이 많아도 기초연금은 절반까지만 깎인다는 것입니다.","start":211.929,"end":219.295},{"n":44,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"한 사람이 받는 기초연금의 최대 금액인 기준연금액은, 올해 한 달 34만 9,700원입니다.","start":219.745,"end":225.903},{"n":45,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"국민연금이 한 사람 한 달 52만 4,550원 이하이면, 기초연금은 깎이지 않아요.","start":226.353,"end":232.209},{"n":46,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"국민연금이 52만 4,550원을 넘으면, 기초연금이 깎이기 시작해요.","start":232.659,"end":237.911},{"n":47,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"하지만 기초연금이 아무리 많이 깎여도, 기준연금액의 절반인 17만 4,850원은 받습니다.","start":238.361,"end":244.821},{"n":48,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"이 부부의 아내는 국민연금이 50만 원이라, 기초연금이 깎이지 않아요.","start":245.271,"end":249.82},{"n":49,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"남편은 국민연금이 120만 원이라 기초연금이 깎이지만, 적어도 17만 4,850원은 받습니다.","start":250.27,"end":257.032},{"n":50,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"여기에 부부가 둘 다 기초연금을 받으면, 각자 받는 금액에서 20%씩 깎는 부부 감액이 있습니다.","start":257.482,"end":263.843},{"n":51,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"다만 공무원연금, 군인연금, 사립학교 교직원이 받는 사학연금 같은 연금은 규칙이 다릅니다.","start":264.293,"end":270.3},{"n":52,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"이런 연금을 받는 사람과 그 배우자는, 가족이 세상을 떠나 받는 유족연금이라도, 소득과 상관없이 기초연금을 받을 수 없습니다.","start":270.75,"end":278.871},{"n":53,"part":"원칙 둘, 국민연금이 많아도 기초연금은 절반까지만 깎인다","text":"한마디로, 국민연금이 많아도 기초연금은 절반까지만 깎입니다.","start":279.321,"end":283.417},{"n":54,"part":"원칙 셋, 신청한 달부터 나온다","text":"세 번째 원칙은, 기초연금은 신청한 달부터 나온다는 것입니다.","start":284.417,"end":288.362},{"n":55,"part":"원칙 셋, 신청한 달부터 나온다","text":"65세가 됐다고 나라가 통장에 저절로 넣어 주지 않고, 본인이나 가족이 직접 신청해야 합니다.","start":288.812,"end":294.871},{"n":56,"part":"원칙 셋, 신청한 달부터 나온다","text":"늦게 신청하면, 신청하기 전 달의 기초연금은 나중에라도 받을 수 없어요.","start":295.321,"end":299.87},{"n":57,"part":"원칙 셋, 신청한 달부터 나온다","text":"이 부부라면, 신청이 한 달 늦을 때마다 최소 41만 9,640원을 못 받게 됩니다.","start":300.32,"end":306.025},{"n":58,"part":"원칙 셋, 신청한 달부터 나온다","text":"신청은 주민센터나 국민연금공단 지사에서 합니다.","start":306.475,"end":309.566},{"n":59,"part":"원칙 셋, 신청한 달부터 나온다","text":"한마디로, 받을 수 있을지 잘 모르겠으면, 먼저 신청부터 하는 게 낫습니다.","start":310.016,"end":314.815},{"n":60,"part":"원칙 셋, 신청한 달부터 나온다","text":"그럼 이 세 가지 원칙으로, 이 부부가 기초연금을 받을 수 있는지 직접 계산해 보겠습니다.","start":315.265,"end":320.72},{"n":61,"part":"직접 계산하는 세 단계","text":"1단계, 재산을 한 달 소득으로 바꿉니다.","start":321.72,"end":324.306},{"n":62,"part":"직접 계산하는 세 단계","text":"이 부부는 집 5억 원과 차 1,000만 원을 합친 5억 1,000만 원에서, 대도시 기본재산액 1억 3,500만 원을 뺍니다.","start":324.756,"end":332.169},{"n":63,"part":"직접 계산하는 세 단계","text":"그러면 3억 7,500만 원이 남아요.","start":332.619,"end":335.054},{"n":64,"part":"직접 계산하는 세 단계","text":"예금은 4,000만 원에서 금융재산으로 빼 주는 2,000만 원을 빼면, 2,000만 원이 남습니다.","start":335.504,"end":341.558},{"n":65,"part":"직접 계산하는 세 단계","text":"두 금액을 더한 3억 9,500만 원의 4%를, 12달로 나누면 한 달 소득으로 약 132만 원이 잡힙니다.","start":342.008,"end":349.223},{"n":66,"part":"직접 계산하는 세 단계","text":"2단계, 부부의 한 달 소득을 모두 더합니다.","start":349.673,"end":352.41},{"n":67,"part":"직접 계산하는 세 단계","text":"예금 이자는 한 달 4만 원을 넘는 만큼만 소득으로 잡힙니다.","start":352.86,"end":356.404},{"n":68,"part":"직접 계산하는 세 단계","text":"이 부부는 한 달 이자 약 11만 7천 원에서 4만 원을 뺀 7만 7천 원이 잡힙니다.","start":356.854,"end":361.606},{"n":69,"part":"직접 계산하는 세 단계","text":"여기에 국민연금 170만 원을 더하면, 한 달 소득은 약 178만 원이에요.","start":362.056,"end":366.907},{"n":70,"part":"직접 계산하는 세 단계","text":"3단계, 1단계와 2단계에서 나온 두 금액을 더해서, 선정기준액과 비교합니다.","start":367.357,"end":372.609},{"n":71,"part":"직접 계산하는 세 단계","text":"재산에서 나온 132만 원과 소득 178만 원을 더하면, 소득인정액은 약 309만 원입니다.","start":373.059,"end":379.269},{"n":72,"part":"직접 계산하는 세 단계","text":"부부 선정기준액 395만 2천 원보다 약 86만 원 낮으니, 두 사람 모두 기초연금을 받을 수 있습니다.","start":379.719,"end":386.533},{"n":73,"part":"직접 계산하는 세 단계","text":"그럼 이 부부는 얼마를 받을까요?","start":386.983,"end":388.866},{"n":74,"part":"이 부부의 결과","text":"부부 감액 20%까지 빼면, 아내는 27만 9,760원, 남편은 최소 13만 9,880원입니다.","start":389.866,"end":397.581},{"n":75,"part":"이 부부의 결과","text":"합쳐서 한 달 최소 41만 9,640원이고, 12개월이면 503만 5,680원이에요.","start":398.031,"end":404.741},{"n":76,"part":"이 부부의 결과","text":"남편 몫은, 국민연금을 몇 년 동안 넣었는지 등에 따라 더 많을 수 있습니다.","start":405.191,"end":409.74},{"n":77,"part":"이 부부의 결과","text":"그럼 집이 더 비싸면 어떨까요?","start":410.19,"end":411.922},{"n":78,"part":"이 부부의 결과","text":"다른 조건이 같다면, 이 부부는 집 공시가격이 약 7억 5천만 원이어도 받습니다.","start":412.372,"end":417.374},{"n":79,"part":"이 부부의 결과","text":"다만 소득인정액에 받을 기초연금까지 더한 금액이 부부 선정기준액 395만 2천 원을 넘으면, 넘는 만큼 기초연금을 덜 줍니다.","start":417.824,"end":426.148},{"n":80,"part":"이 부부의 결과","text":"그럼 이미 신청했다가 떨어졌거나, 아직 신청을 안 했다면, 어떻게 해야 할까요?","start":426.598,"end":431.699},{"n":81,"part":"이미 떨어졌거나 신청하지 않았다면","text":"늦지 않았습니다.","start":432.699,"end":433.676},{"n":82,"part":"이미 떨어졌거나 신청하지 않았다면","text":"이번 달에 신청하면, 이번 달부터 받아요.","start":434.126,"end":436.712},{"n":83,"part":"이미 떨어졌거나 신청하지 않았다면","text":"예전에 떨어졌다면, 올해 선정기준액으로 다시 계산해 보세요.","start":437.162,"end":441.107},{"n":84,"part":"이미 떨어졌거나 신청하지 않았다면","text":"혼자 사는 사람의 선정기준액은 작년 228만 원에서 올해 247만 원으로 올랐습니다.","start":441.557,"end":447.517},{"n":85,"part":"이미 떨어졌거나 신청하지 않았다면","text":"떨어진 결과가 틀렸다고 생각되면, 결과를 안 날부터 90일 안에, 다시 판단해 달라는 이의신청을 할 수 있어요.","start":447.967,"end":455.031},{"n":86,"part":"이미 떨어졌거나 신청하지 않았다면","text":"그리고 떨어졌을 때는, 나중에 받을 수 있는지 계속 살펴 달라는 수급희망 이력관리를 꼭 신청해 두세요.","start":455.481,"end":461.842},{"n":87,"part":"이미 떨어졌거나 신청하지 않았다면","text":"그러면 5년 동안, 선정기준액이나 내 소득·재산 자료가 바뀔 때마다, 받을 수 있는지 다시 확인해 줍니다.","start":462.292,"end":468.903},{"n":88,"part":"이미 떨어졌거나 신청하지 않았다면","text":"2026년 7월 30일부터는, 이렇게 받을 수 있다고 확인된 날을, 기초연금을 신청한 날로 쳐 줍니다.","start":469.353,"end":476.115},{"n":89,"part":"이미 떨어졌거나 신청하지 않았다면","text":"다시 신청하러 가지 않아도, 확인된 그달부터 받는다는 뜻이에요.","start":476.565,"end":480.661},{"n":90,"part":"이미 떨어졌거나 신청하지 않았다면","text":"자, 마지막으로 오늘 내용을 정리하겠습니다.","start":481.111,"end":483.999},{"n":91,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"선정기준액과 기준연금액은 해마다 바뀌고, 부부 감액 20%를 줄이는 안도 논의되고 있습니다.","start":484.999,"end":491.36},{"n":92,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"그래도 오늘 본 세 가지 원칙은 그대로입니다.","start":491.81,"end":494.448},{"n":93,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"첫째, 소득인정액은 한 달 소득에 재산의 일부만 더한 숫자입니다.","start":494.898,"end":498.994},{"n":94,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"집 한 채가 있다고 미리 신청을 포기하지 마세요.","start":499.444,"end":502.233},{"n":95,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"둘째, 기초연금을 받을 수 있게 되면, 국민연금이 많아도 기초연금은 절반까지만 깎입니다.","start":502.683,"end":508.539},{"n":96,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"셋째, 기초연금은 신청한 달부터 나옵니다.","start":508.989,"end":511.726},{"n":97,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"오늘 우리 집 공시가격과 국민연금으로, 소득인정액부터 계산해 보세요.","start":512.176,"end":516.725},{"n":98,"part":"정리, 숫자가 바뀌어도 그대로인 것","text":"시청해주셔서 감사합니다.","start":517.175,"end":518.756}],"subs":[[0.3,4.396,"집 한 채가 있고 국민연금까지 받고 계시다면, 이 숫자부터 보세요."],[4.846,7.379,"서울에 공시가격
