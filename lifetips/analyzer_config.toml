# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 생활꿀팁 (lifetips)
# VERSION: v1.0 — 2026-10-09 — 최초 작성: YouTube 자동완성으로 검색 수요를 확인한 검색어 48개
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 형식은 stock/analyzer_config.toml 과 같습니다.
# ▶ 실행:  python youtube_topic_analyzer.py --config lifetips/analyzer_config.toml
#          Windows 실행기: .\run_analyzer.ps1 -Folder lifetips
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#
# 📝 이 주제에서 검색어를 고른 기준
#   ⚠️ 생활꿀팁은 쇼츠가 대부분이다 ('생활꿀팁 쇼츠'가 자동완성 상위). 리포트의 '롱폼' 결과만 따로 본다.
#   '모르면 손해' 자동완성은 게임(메랜·발로란트), '하면 안되는'은 연애·장난, '생활 습관'은 유아 동요(뽀로로·베베핀)라 넣지 않았다.
#   계절: 지금(10월)은 난방비·가스비·결로·보일러 동파·전기장판 화재 검색이 늘 때라 1·2·6번에 넣었다. 여름에는 에어컨·제습으로 바꾼다.
# =====================================================================================================

[topic]
TOPIC = "생활꿀팁"                    # 분석 주제 (관련어가 비었을 때의 기본 관련어, 자동완성 씨앗)
PROJECT_FOLDER = "lifetips"             # 결과 폴더 → PC: output/lifetips/result/, GitHub: lifetips/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
# "curated" = 아래 KEYWORD_GROUPS만 검색. 이 주제는 단독 주제어의 자동완성에 무관한 것(채널·노래·게임)이 많아 curated로 둔다.
# "both"로 바꾸면 자동완성 상위 AUTOCOMPLETE_TOP_N개를 더 검색한다 → 그때는 EXCLUDE_KEYWORDS가 걸러 준다.
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = [
  "쇼츠", "shorts", "게임", "메랜", "발로란트", "동요", "동화", "뽀로로",
  "베베핀", "창업", "업체", "교육",
]   # (autocomplete/both 모드) 자동완성에서 뺄 단어 — 2026-10-09 자동완성에서 확인한 무관한 것
AUTOCOMPLETE_TOP_N = 10

# 🔎 카테고리별 검색어 6개 × 8개 = 48개. 모두 2026-10-09 YouTube 자동완성에 나온 표현이거나, 입력하면 자동완성이 이어지는(검색 수요가 있는) 검색어다.
# 💡 키워드 1개 = 검색 1회(100유닛). 하루 한도를 넘으면 다음 날 실행 때 이어서 수집한다 (검색 결과 7일 캐시).
[KEYWORD_GROUPS]
"1. 난방비·전기세·관리비 절약" = [
  "겨울 난방비 줄이는 법", "난방비 절약 꿀팁", "가스비 절약방법", "겨울 가스비 절약",
  "전기세 절약 방법", "에어컨 전기세 절약 방법", "관리비 줄이는 방법", "아파트 관리비 절약",
]
"2. 곰팡이·결로·냄새·배수구" = [
  "벽지 곰팡이 제거방법", "베란다 곰팡이 제거방법", "결로 곰팡이 제거", "결로현상 곰팡이 제거",
  "배수구 냄새 없애는 법", "하수구 막힘 뚫기", "세탁기 배수구 냄새", "냄새 제거 방법",
]
"3. 청소 (주방·가전·화장실)" = [
  "화장실 청소 꿀팁", "세탁기 청소 방법", "세탁기 청소 과탄산소다", "가스레인지 청소 베이킹소다",
  "에어프라이어 청소 방법", "에어컨 청소 셀프", "집 청소 꿀팁", "자취방 청소 꿀팁",
]
"4. 정리·수납·살림 노하우" = [
  "냉장고 정리 꿀팁", "옷 정리 꿀팁", "주방 정리 꿀팁", "정리 수납 방법",
  "50대 주부 살림 노하우", "살림 노하우", "생활꿀팁모음", "생활꿀팁10가지",
]
"5. 자취·이사" = [
  "첫 자취 꿀팁", "원룸 자취 꿀팁", "자취 꿀팁 요리", "이사 체크리스트",
  "아파트 이사 체크리스트", "원룸 이사 체크리스트", "셀프 이사 꿀팁", "자취 이사 꿀팁",
]
"6. 겨울 안전·생활 상식" = [
  "전기장판 화재 원인", "전기장판 화재예방", "보일러 동파방지", "보일러 동파 녹이기",
  "보일러 동파방지 외출", "결로 벽지 곰팡이 제거", "생활상식 모음", "생활 상식퀴즈",
]

[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞인 무관한 영상을 분석·성공사례에서 뺀다 (글자가 '포함'되면 맞는 것으로 봄)
# 판정: ① 제목·태그에 강한 관련어  ② 제목에 약한 관련어 + (설명란 강한 관련어 또는 제목 약한 관련어 2개)  ③ 설명란에 강한 관련어 2번 이상
RELEVANCE_TERMS = [
  "생활꿀팁", "생활 꿀팁", "살림", "청소", "세탁", "빨래", "수납", "곰팡이",
  "결로", "배수구", "하수구", "냄새 제거", "난방비", "가스비", "전기세", "전기요금",
  "관리비", "자취", "동파", "생활 상식", "생활상식", "과탄산소다", "베이킹소다", "구연산",
  "이사 꿀팁", "이사 체크리스트", "전기장판",
]
# 약한 관련어 (혼자서는 인정 안 함) — '꿀팁'은 게임·주식 등 모든 주제에 쓰이고, '이사'는 회사 임원(대표이사)에도 쓰여서 혼자서는 인정하지 않는다.
RELEVANCE_WEAK_TERMS = [
  "꿀팁", "팁", "절약", "정리", "주방", "이사", "화재", "상식", "방법", "다이소",
  "냉장고", "세탁기", "보일러", "에어컨", "가전", "주부",
]
# 관련어를 품고 있지만 무관한 표현 — 판정 전에 지운다
RELEVANCE_EXCLUDE = [
  "청소년", "대표이사", "이사회", "이사장", "사외이사", "게임 꿀팁",
]

[ads]
# 📢 광고로 조회수를 산 것으로 의심되는 영상 제외 (조회수 많은데 좋아요·댓글이 거의 없음). 값은 주식 데이터 기준 — 제품 홍보(제휴 링크) 영상이 많지만 대부분 실제 반응이 있어 광고 의심 필터와는 다르다. 기본값 그대로 둔다.
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# (선택) 기본값을 바꿀 때만 '#'을 지우고 고친다. 전체 목록은 stock/analyzer_config.toml [advanced] 참고
# ANALYSIS_DAYS = 365
# QUOTA_BUDGET = 9000
