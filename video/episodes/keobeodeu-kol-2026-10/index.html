// ---------- 동전이 흐르는 그림 (반복) ----------
function coinFlow(parent, x0, y0, x1, y1, at, until, n, size) {
  const cs = [];
  for (let i = 0; i < n; i++) cs.push(el(`<div class="a" style="left:${x0}px;top:${y0}px">${IC.coin(size || 60)}</div>`, parent));
  const per = 0.9, gap = 0.45, reps = Math.max(0, Math.floor((until - at - per) / (gap * n)));
  cs.forEach((c, i) => tl.fromTo(c, { x: 0, y: 0, opacity: 0 }, { x: x1 - x0, y: y1 - y0, opacity: 1, duration: per, ease: "power1.in", repeat: reps, repeatDelay: gap * n - per }, at + i * gap));
  return cs;
}
