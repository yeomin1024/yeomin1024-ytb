# 쇼핑(4050 여성) 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.0 — 2026-11-27 — 새로 (사용자 지시 2026-11-27 "쿠팡파트너스 상품 홍보 목적 유튜브 채널 …" → "소비가 많은 여성 나이대 타겟으로 할거야 계속 진행해").
#   꼴은 psychology/personas.toml v1.2 와 같다. 목적: 타깃(40~50대 여성 — guides/channel.md 1번)을 댓글이 스스로 밝힌 나이·처지로 다시 확인.
#   묶음(stage) = 댓글이 밝힌 처지 — 살림하는 주부 · 일하는 엄마 · 5060 · 4050 옷·외모 고민 · 혼자 사는 사람(타깃 밖 확인용).
#   처지(state) = 지금 쇼핑하는 상황 — 이미 샀음 · 사려고 망설임 · 사서 실패 · 링크/제품명 묻기 · 가격 민감.
#   ⚖️ 판단: 첫 판은 쇼핑 채널 댓글에 흔한 자기소개 꼴로 씀 — 분석 뒤 audit 로 무작위 댓글을 읽고 고친다.
#   나이는 자기소개 꼴만 (AGE_STRICT — 쇼핑 댓글의 나이는 '엄마 생신 선물(70대)' 같은 남의 나이가 많음).
# ※ 연구·교육용 — 구매 권유가 아니다.

[personas]
VERSION = "v1.0"
RECENT_DAYS = 180
TREND_DAYS = 28
LANGS = ["한국어"]
MIN_SHARE = 0.08
COVER = 0.80
MIN_PERSONAS = 2
MAX_PERSONAS = 6
MIN_N = 30
NEED_SELF = true
AGE_STRICT = true
AGE_SKIP_BEFORE = '엄마|아빠|어머니|아버지|시어머니|시아버지|친정|남편|아내|와이프|딸|아들|친구|언니|오빠|누나|형|동생|선물|그\s?분|걔'
STOP = ["영상", "제품", "정보", "감사합니다", "정말", "진짜", "너무", "그냥", "좋아요", "좋네요", "말씀", "구독"]

# ---------------------------------------------------------------- 묶음 (위에서부터 먼저)
