3,"end":77.165},{"n":20,"part":"항목 2","text":"이 초대에 어떻게 하시겠습니까?","start":77.615,"end":79.498},{"n":21,"part":"항목 2","text":"A번, 무조건 오른다는 말을 듣자마자 대화를 끝냅니다.","start":79.948,"end":83.591},{"n":22,"part":"항목 2","text":"B번, 회비를 내고 들어갑니다.","start":84.041,"end":86.023},{"n":23,"part":"항목 2","text":"C번, 무료 체험 기간에만 들어가 봅니다.","start":86.473,"end":89.059},{"n":24,"part":"항목 2","text":"A번은 10점, B번은 0점, C번은 5점입니다.","start":89.509,"end":92.798},{"n":25,"part":"항목 3","text":"세 번째 항목입니다.","start":93.798,"end":94.926},{"n":26,"part":"항목 3","text":"얼마 뒤, 내가 매수한 주식이 한 달 만에 50% 올랐습니다.","start":95.376,"end":99.321},{"n":27,"part":"항목 3","text":"주변에서는 주식 고수라는 말까지 듣습니다.","start":99.771,"end":102.409},{"n":28,"part":"항목 3","text":"가장 먼저 드는 생각은 무엇입니까?","start":102.859,"end":104.893},{"n":29,"part":"항목 3","text":"A번, 같은 기간 그 주식이 속한 시장의 대표 지수와 먼저 비교해 봅니다.","start":105.343,"end":109.892},{"n":30,"part":"항목 3","text":"B번, 이번에는 운이 좋았다고 생각합니다.","start":110.342,"end":113.079},{"n":31,"part":"항목 3","text":"C번, 나는 주식에 재능이 있다고 확신합니다.","start":113.529,"end":116.417},{"n":32,"part":"항목 3","text":"A번은 10점, B번은 5점, C번은 0점입니다.","start":116.867,"end":120.156},{"n":33,"part":"항목 4","text":"네 번째 항목입니다.","start":121.156,"end":122.284},{"n":34,"part":"항목 4","text":"이제 그 종목이라면, 앞으로도 오를 거라는 확신이 듭니다.","start":122.734,"end":126.377},{"n":35,"part":"항목 4","text":"주식 계좌 전체에서, 그 한 종목을 얼마나 보유하시겠습니까?","start":126.827,"end":130.621},{"n":36,"part":"항목 4","text":"A번, 계좌의 4분의 1에서 절반까지 보유합니다.","start":131.071,"end":134.412},{"n":37,"part":"항목 4","text":"B번, 다른 종목을 모두 매도하고, 계좌의 절반 넘게 보유합니다.","start":134.862,"end":139.057},{"n":38,"part":"항목 4","text":"C번, 계좌의 4분의 1보다 적게 보유하고, 나머지는 여러 종목에 나눕니다.","start":139.507,"end":144.457},{"n":39,"part":"항목 4","text":"A번은 5점, B번은 0점, C번은 10점입니다.","start":144.907,"end":148.196},{"n":40,"part":"항목 5","text":"다섯 번째 항목입니다.","start":149.196,"end":150.475},{"n":41,"part":"항목 5","text":"그 뒤로 주식 앱 알림이 하루에 수십 번 울립니다.","start":150.925,"end":153.714},{"n":42,"part":"항목 5","text":"주가가 1%만 움직여도 매매하고 싶어집니다.","start":154.164,"end":157.255},{"n":43,"part":"항목 5","text":"정해진 날 정기적으로 매수하는 것은 빼고, 평소 한 달에 몇 번 매매하십니까?","start":157.705,"end":162.405},{"n":44,"part":"항목 5","text":"A번, 한 달에 한두 번 이하로 매매합니다.","start":162.855,"end":165.592},{"n":45,"part":"항목 5","text":"B번, 거의 매일 하루에도 여러 번 매매합니다.","start":166.042,"end":168.93},{"n":46,"part":"항목 5","text":"C번, 일주일에 한두 번 매매합니다.","start":169.38,"end":171.664},{"n":47,"part":"항목 5","text":"A번은 10점, B번은 0점, C번은 5점입니다.","start":172.114,"end":175.403},{"n":48,"part":"항목 6","text":"여섯 번째 항목입니다.","start":176.403,"end":177.682},{"n":49,"part":"항목 6","text":"그러다 꼭 매수하고 싶은 종목이 생겨, 모아 둔 1,200만 원을 넣으려 합니다.","start":178.132,"end":183.082},{"n":50,"part":"항목 6","text":"매수와 매도를 언제 얼마씩 할지, 미리 정해 두셨습니까?","start":183.532,"end":187.024},{"n":51,"part":"항목 6","text":"A번, 매수는 몇 번에 나누지만, 매도는 그때 가서 정합니다.","start":187.474,"end":191.518},{"n":52,"part":"항목 6","text":"B번, 몇 번에 나눠 매수하고 매도할지, 가격과 금액을 미리 정해 두었습니다.","start":191.968,"end":196.918},{"n":53,"part":"항목 6","text":"C번, 느낌이 오는 날 한 번에 다 매수하고, 오르면 한 번에 다 매도합니다.","start":197.368,"end":202.016},{"n":54,"part":"항목 6","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":202.466,"end":205.755},{"n":55,"part":"항목 7","text":"일곱 번째 항목입니다.","start":206.755,"end":208.034},{"n":56,"part":"항목 7","text":"1,200만 원을 넣기 전에, 내 계좌 전체를 다시 들여다봅니다.","start":208.484,"end":212.528},{"n":57,"part":"항목 7","text":"현금은 하나도 없고, 보유 종목은 모두 한 업종입니다.","start":212.978,"end":216.319},{"n":58,"part":"항목 7","text":"투자한 나라의 지수가 오르내릴 때, 현금과 업종 비중을 어떻게 할지 정해 두셨습니까?","start":216.769,"end":222.073},{"n":59,"part":"항목 7","text":"A번, 현금 비중만 대충 정해 두었습니다.","start":222.523,"end":225.26},{"n":60,"part":"항목 7","text":"B번, 오를 때와 떨어질 때의 현금 비중과 업종 배분을 미리 정해 두었습니다.","start":225.71,"end":230.41},{"n":61,"part":"항목 7","text":"C번, 정해 둔 것 없이 그때그때 오르는 업종에 모두 넣습니다.","start":230.86,"end":234.654},{"n":62,"part":"항목 7","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":235.104,"end":238.393},{"n":63,"part":"항목 8","text":"여덟 번째 항목입니다.","start":239.393,"end":240.672},{"n":64,"part":"항목 8","text":"보유한 종목 하나가 매수 가격의 절반이 됐고, 회사 실적이 나빠졌다는 뉴스도 나옵니다.","start":241.122,"end":246.577},{"n":65,"part":"항목 8","text":"이 종목을 어떻게 하시겠습니까?","start":247.027,"end":248.91},{"n":66,"part":"항목 8","text":"A번, 처음 매수한 이유를 다시 확인해서, 맞으면 보유하고 틀렸으면 매도합니다.","start":249.36,"end":254.763},{"n":67,"part":"항목 8","text":"B번, 이유는 따져 보지 않고 절반만 매도합니다.","start":255.213,"end":258.252},{"n":68,"part":"항목 8","text":"C번, 이유는 따져 보지 않고, 매수 가격이 될 때까지 보유하거나 더 매수합니다.","start":258.702,"end":263.803},{"n":69,"part":"항목 8","text":"A번은 10점, B번은 5점, C번은 0점입니다.","start":264.253,"end":267.542},{"n":70,"part":"항목 9","text":"아홉 번째 항목입니다.","start":268.542,"end":269.821},{"n":71,"part":"항목 9","text":"얼마 뒤 내가 투자한 나라의 대표 지수가 크게 떨어지자, 바닥이라는 글이 쏟아집니다.","start":270.271,"end":275.575},{"n":72,"part":"항목 9","text":"증권사 앱에는 내 돈만큼 빌려서 두 배로 매수할 수 있다는 안내가 뜹니다.","start":276.025,"end":280.324},{"n":73,"part":"항목 9","text":"이때 어떻게 하시겠습니까?","start":280.774,"end":282.355},{"n":74,"part":"항목 9","text":"A번, 조금만 빌려서 매수합니다.","start":282.805,"end":285.089},{"n":75,"part":"항목 9","text":"B번, 빌리지 않고 내 돈으로만 매수합니다.","start":285.539,"end":288.276},{"n":76,"part":"항목 9","text":"C번, 내 돈만큼 빌려서 두 배로 매수합니다.","start":288.726,"end":291.463},{"n":77,"part":"항목 9","text":"A번은 5점, B번은 10점, C번은 0점입니다.","start":291.913,"end":295.202},{"n":78,"part":"항목 10","text":"마지막 열 번째 항목입니다.","start":296.202,"end":297.783},{"n":79,"part":"항목 10","text":"결국 큰 손실을 본 날, 레버리지 ETF로 손실을 한 달 만에 되찾았다는 영상이 보입니다.","start":298.233,"end":303.839},{"n":80,"part":"항목 10","text":"남은 돈을 어떻게 하시겠습니까?","start":304.289,"end":306.172},{"n":81,"part":"항목 10","text":"A번, 남은 돈을 모두, 하루에 주가의 두 배만큼 움직이는 레버리지 ETF에 넣습니다.","start":306.622,"end":312.478},{"n":82,"part":"항목 10","text":"B번, 남은 돈의 일부만 그 레버리지 ETF에 넣습니다.","start":312.928,"end":316.571},{"n":83,"part":"항목 10","text":"C번, 손실은 받아들이고, 남은 돈을 여러 곳에 나눠서 다시 시작합니다.","start":317.021,"end":321.669},{"n":84,"part":"항목 10","text":"A번은 0점, B번은 5점, C번은 10점입니다.","start":322.119,"end":325.408},{"n":85,"part":"통과 기준","text":"점수를 모두 더하셨다면, 이제 통과 기준을 알려 드리겠습니다.","start":326.408,"end":330.353},{"n":86,"part":"통과 기준","text":"먼저, 아홉 번째나 열 번째 항목이 0점이라면, 총점과 상관없이 불통과입니다.","start":330.803,"end":335.904},{"n":87,"part":"통과 기준","text":"빌린 돈과 레버리지 상품은, 한 번의 폭락으로 계좌 대부분을 잃게 할 수 있기 때문입니다.","start":336.354,"end":341.809},{"n":88,"part":"통과 기준","text":"이 두 항목에 0점이 없다면, 70점 이상은 통과입니다.","start":342.259,"end":345.751},{"n":89,"part":"통과 기준","text":"40점에서 65점은 주의, 35점 이하는 불통과입니다.","start":346.201,"end":350.146},{"n":90,"part":"통과 기준","text":"통과는, 남의 말이나 그날 기분이 아니라 내 계획대로 매수하고 매도하는 사람입니다.","start":350.596,"end":355.9},{"n":91,"part":"통과 기준","text":"주의는, 원칙은 있지만 흔들리는 순간에는 감정대로 움직이는 사람입니다.","start":356.35,"end":361.05},{"n":92,"part":"통과 기준","text":"0점과 5점을 받은 습관 몇 개만 고치면, 통과할 수 있습니다.","start":361.5,"end":365.294},{"n":93,"part":"통과 기준","text":"불통과는, 손실을 본 사람들과 같은 행동을 많이 하는 사람입니다.","start":365.744,"end":369.84},{"n":94,"part":"통과 기준","text":"그럼 0점인 항목들을 묶어서 살펴보겠습니다.","start":370.29,"end":373.079},{"n":95,"part":"해설","text":"첫 번째와 두 번째 항목에서, 동료 말만 듣고 매수했거나 회비를 냈다면 0점입니다.","start":374.079,"end":379.232},{"n":96,"part":"해설","text":"공통된 문제는, 종목을 직접 공부하지 않아 내 판단을 믿을 근거가 없다는 것입니다.","start":379.682,"end":384.835},{"n":97,"part":"해설","text":"그래서 남의 말보다, 그 회사가 무엇으로 돈을 버는지부터 알아봐야 합니다.","start":385.285,"end":389.985},{"n":98,"part":"해설","text":"세 번째부터 여섯 번째 항목에서, 재능을 확신했거나 한 종목에 몰았다면 0점입니다.","start":390.435,"end":395.739},{"n":99,"part":"해설","text":"거의 매일 매매했거나, 느낌이 오는 날 한 번에 다 매수했어도 0점입니다.","start":396.189,"end":400.738},{"n":100,"part":"해설","text":"공통된 문제는, 내 느낌과 실력을 믿고 틀릴 때를 대비하지 않았다는 것입니다.","start":401.188,"end":406.039},{"n":101,"part":"해설","text":"그래서 수익은 대표 지수와 비교해 보고, 돈은 여러 종목에 여러 번 나눠 넣어야 합니다.","start":406.489,"end":411.793},{"n":102,"part":"해설","text":"일곱 번째와 여덟 번째에서, 오르는 업종에 다 넣었거나 매수 가격만 기다렸다면 0점입니다.","start":412.243,"end":418},{"n":103,"part":"해설","text":"공통된 문제는, 미리 정한 기준 없이 그때그때 감정대로 결정했다는 것입니다.","start":418.45,"end":423.301},{"n":104,"part":"해설","text":"그래서 현금과 업종 비중은 미리 정하고, 보유와 매도는 처음 매수한 이유로 판단합니다.","   K.cut(E(101) - 0.1, "L-24 그래서");
}
/* L-25 7·8번 — 정한 기준 없이 감정대로 (문장 102~104) */
{
  groupHead(until(102), until(103), [7, 8], 102, [[7, W(102, "오르는")], [8, W(102, "매수 가격만")]]);
  K.cut(E(102) - 0.1, "L-25 7·8번 0점");
}
{ // 103 공통된 문제 — 기분 ▲·▼ 따라 계좌 상자가 이리저리 끌려감
  let HT;
  const { sc, st } = stage(until(103), until(104), "PAPER", s => { HT = act(s, "H_THINK", { h: 5.0, at: [-5.6, -0.3, 0.6] }).ro(4); });
  st.update = t => { HT.sway(t, 0.06, 1.4); };
  const mk = html => stick(st, el(`<div class="a w9 nw ts" style="font-size:110px;line-height:1;opacity:0">${html}</div>`, sc), () => (HT.op > 0.01 ? HT.top(0.25) : null));
  const up = mk(`<span class="G">▲</span>`), dn = mk(`<span class="R">▼</span>`);
  const box = el(`<div class="a w9 c" style="left:1000px;top:300px;width:400px;height:260px;border-radius:24px;background:#5B7DB8;border:6px solid #F2E6CF;font-size:76px;line-height:248px;color:#F2E6CF">MY</div>`, sc);
  pop(box, S(103) + 0.1);
  const t0 = S(103) + 0.5, n = Math.max(2, Math.floor((E(103) - t0) / 0.7));
  for (let i = 0; i < n; i++) {
    const u = i % 2 === 0, at = t0 + i * 0.7;
    tl.set(up, { opacity: u ? 1 : 0 }, at); tl.set(dn, { opacity: u ? 0 : 1 }, at);
    tl.to(box, { x: u ? 260 : -260, rotate: u ? 4 : -4, duration: 0.45, ease: "power2.inOut" }, at);
  }
  K.cut(E(103) - 0.1, "L-25 공통된 문제");
}
{ // 104 그래서 — 10점 7번 B · 8번 A
  groupSo(until(104), until(105), [7, 8], [W(104, "현금과"), W(104, "보유와")]);
  K.cut(E(104) - 0.1, "L-25 그래서");
}
/* L-26 9·10번 — 과락 (문장 105~109) */
{
  const h = groupHead(until(105), until(106), [9, 10], 105, [[9, W(105, "빚을")], [10, W(105, "레버리지")]]);
  stamp(h.sc, 1320, 120, `FAIL ✕`, R, W(105, "과락"), -8);
  K.cut(E(105) - 0.1, "L-26 9·10번 과락");
}
{ // 106 공통된 문제 — MY + LOAN·2X 로 두 배 → 손실 막대도 두 배
  const { sc } = stage(until(106), until(107), "PAPER", null);
  const my = el(`<div class="a w9 c" style="left:300px;top:300px;width:300px;height:220px;border-radius:20px;background:${G};font-size:68px;line-height:220px;color:#06231F">MY</div>`, sc);
  pop(my, S(106) + 0.1);
  const ln = el(`<div class="a w9 c" style="left:620px;top:300px;width:300px;height:220px;border-radius:20px;background:#C9D2E2;font-size:60px;line-height:220px;color:#0C1424">LOAN</div>`, sc);
  pop(ln, W(106, "크게"), { from: { x: 200, y: 0 } });
  ctag(sc, 520, 170, `2X`, W(106, "크게") + 0.2, R);
  const base = 740;
  const one = el(`<div class="a" style="left:1180px;top:${base - 200}px;width:220px;height:200px;border-radius:4px 4px 16px 16px;border:6px dashed rgba(255,255,255,.55)"></div>`, sc);
  pop(one, W(106, "손실까지") - 0.2);
  const two = el(`<div class="bar" style="left:1460px;top:${base - 400}px;width:220px;height:400px;background:${R}"></div>`, sc);
  tl.fromTo(two, { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power2.out" }, W(106, "두 배로") - 0.2);
  pop(T(sc, 1570, base - 400 - 110, `×2`, 90, "w9 R"), W(106, "두 배로") + 0.3);
  K.cut(E(106) - 0.1, "L-26 공통된 문제 ×2");
}
{ // 107 MY 1 + LOAN 1 → 주가 −20% → MY −40% (calc Q9)
  const { sc } = stage(until(107), until(108), "PAPER", null);
  const my = el(`<div class="a" style="left:500px;top:300px;width:360px;height:220px;border-radius:20px;background:${G};display:grid;place-items:center;font-weight:900;font-size:72px;color:#06231F">MY</div>`, sc);
  const ln = el(`<div class="a" style="left:500px;top:530px;width:360px;height:220px;border-radius:20px;background:#C9D2E2;display:grid;place-items:center;font-weight:900;font-size:72px;color:#0C1424">LOAN</div>`, sc);
  pop(my, S(107) + 0.1); pop(ln, W(107, "빌려") + 0.1);
  pop(T(sc, 1150, 300, `−20%`, 100, "w9 R"), W(107, "20%만"));
  tl.to(my, { height: 132, top: 388, backgroundColor: R, duration: 0.8 }, W(107, "40%") - 0.4);
  pop(T(sc, 1150, 520, `MY −40%`, 100, "w9 R"), W(107, "40%"));
  K.cut(E(107) - 0.1, "L-26 MY −40%");
}
{ // 108 더 떨어지면 MARGIN CALL → 다시 올라도 빈 계좌
  let GR;
  const { sc, st } = stage(until(108), until(109), "PAPER", s => { GR = act(s, "GRAB", { h: 3.6, anchor: [0.5, 0.5], at: [-2.4, 2.2, 0.6] }).ro(5); });
  const tG = W(108, "강제로");
  st.update = t => { const k = sm(lin(t, tG - 0.4, tG + 0.4)); GR.g.position.y = GR.home.y + 4 * (1 - k); GR.op = t < tG - 0.4 ? 0 : 1; };
  pathLine(sc, [[260, 240], [460, 380], [640, 520], [760, 640]], WH, S(108) + 0.05, 0.9, 9);
  stamp(sc, 820, 140, `MARGIN CALL`, R, tG, -6);
  pathLine(sc, [[760, 640], [980, 480], [1200, 340], [1420, 240]], G, W(108, "다시"), 0.9, 12);
  const box = el(`<div class="a" style="left:1480px;top:400px;width:300px;height:240px;border-radius:22px;border:7px dashed #8A93A6"></div>`, sc); pop(box, W(108, "되찾을") - 0.2);
  pop(T(sc, 1630, 470, `₩0`, 90, "w9 N"), W(108, "되찾을"));
  K.cut(E(108) - 0.1, "L-26 MARGIN CALL · 빈 계좌");
}
{ // 109 그래서 — 10점 9번 B · 10번 C
  groupSo(until(109), ch(partFirst("정리")), [9, 10], [W(109, "내 돈으로만"), W(109, "나눠서")]);
  K.cut(E(109) - 0.1, "L-26 그래서");
}

/* ═════════════ 정리 · 마무리 (문장 110~113) — 제작안 L-27 · L-29 ═════════════ */
{ // L-27 공식 시험 아님 · 최근 통계와 연구로 만든 점검표 → 클립보드에
  const a = ch(110), b = until(112);
  let HP;
  const { sc, st } = stage(a, b, "PAPER", s => { HP = act(s, "H_PLAN", { h: 5.0, at: [-7.6, -0.3, 0.6] }).ro(4); });
  st.update = t => { HP.pop(t, S(111) + 0.05, 0.5); idle(HP, t); };
  const sheet = el(`<div class="panel2" style="left:620px;top:110px;width:1180px;height:560px;background:#F2E6CF;border:10px solid #fff;color:#1B2440"></div>`, sc); pop(sheet, S(110) + 0.05);
  el(`<div class="a w9 nw" style="left:60px;top:36px;font-size:84px">TEST</div>`, sheet);
  const cells = [];
  for (let i = 0; i < 10; i++) cells.push(el(`<div class="a w9 c" style="left:${70 + (i % 5) * 210}px;top:${170 + Math.floor(i / 5) * 180}px;width:150px;height:150px;border-radius:50%;border:7px solid #1B2440;font-size:70px;line-height:136px">${i + 1}</div>`, sheet));
  tl.fromTo(cells, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.05, duration: 0.3 }, S(110) + 0.2);
  const qm = el(`<div class="a w9 c" style="left:420px;top:36px;width:96px;height:96px;border-radius:50%;background:${Y};color:#0C1424;font-size:66px;line-height:96px">?</div>`, sheet);
  pop(qm, W(110, "공식"), { from: { scale: 0.3, y: 0 } });
  [ICON.bars2(), ICON.paper()].forEach((ic, i) => { const n = el(`<div class="a" style="left:${760 + i * 150}px;top:20px">${ic}</div>`, sheet); pop(n, W(110, i ? "연구로" : "통계와")); });
  tl.to(sheet, { scale: 0.5, x: -360, y: 120, rotate: -4, transformOrigin: "0% 100%", duration: 0.7, ease: "power2.inOut" }, S(111) + 0.4);
  K.cut(E(110) - 0.1, "L-27 TEST ?"); K.cut(E(111) - 0.1, "L-27 클립보드");
}
{ // L-29 인사
  const a = until(112), b = K.D;
  let HB;
  const { st } = stage(a, b, "PAPER", s => { HB = act(s, "H_BOW", { h: 4.6, at: [0, -0.3, 0.6] }).ro(4); }, { keep: true });
  st.update = t => { HB.pop(t, S(112) + 0.1, 0.5); const k = sm(lin(t, S(113), S(113) + 0.6)); HB.g.rotation.z = 0.15 * Math.sin(k * Math.PI); };
  st.part(Puppet.floaters({ n: 80, x: [-11, 11], z: [-6, 4], hgt: 12, speed: [0.4, 1.0], size: 0.28, inner: "rgba(255,226,160,1)", outer: "rgba(255,180,90,0)" }));
  K.cut(E(113) - 0.1, "L-29 인사");
}
K.done();
})();
