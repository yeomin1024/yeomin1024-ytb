14},{"n":37,"part":"숫자로 본 등산 중 심정지","text":"그럼 도대체, 이런 사고가 많이 일어나는 이유는 뭘까요?","start":147.664,"end":151.156},{"n":38,"part":"등산 중 심장이 멈추는 이유","text":"등산 중에 심장이 멈추는 데는 이유가 있습니다.","start":152.156,"end":154.945},{"n":39,"part":"등산 중 심장이 멈추는 이유","text":"나이가 들수록, 심장에 피를 보내는 혈관은 조용히 좁아질 수 있습니다.","start":155.395,"end":159.793},{"n":40,"part":"등산 중 심장이 멈추는 이유","text":"아무 증상이 없어서, 겉으로는 건강해 보이는 사람도 많죠.","start":160.243,"end":163.886},{"n":41,"part":"등산 중 심장이 멈추는 이유","text":"고혈압과 당뇨, 높은 콜레스테롤, 담배는 이 혈관을 더 좁게 만듭니다.","start":164.336,"end":168.833},{"n":42,"part":"등산 중 심장이 멈추는 이유","text":"이런 심장에는, 완만한 숲길을 오래 걷는 것도 부담이 됩니다.","start":169.283,"end":173.077},{"n":43,"part":"등산 중 심장이 멈추는 이유","text":"산 중턱의 찬 공기는 혈관을 더 좁게 만들고요.","start":173.527,"end":176.165},{"n":44,"part":"등산 중 심장이 멈추는 이유","text":"땀을 흘려 몸에서 물이 빠지면, 피는 더 끈끈해집니다.","start":176.615,"end":179.956},{"n":45,"part":"등산 중 심장이 멈추는 이유","text":"그렇다면 심장이 멈추기 전에, 우리 몸은 아무 신호도 보내지 않을까요?","start":180.406,"end":184.804},{"n":46,"part":"심정지 전 몸이 보내는 신호","text":"심정지가 오기 전, 몸은 신호를 보내기도 합니다.","start":185.804,"end":188.843},{"n":47,"part":"심정지 전 몸이 보내는 신호","text":"가슴이 조이거나 답답해지고, 명치가 체한 것처럼 꽉 막힙니다.","start":189.293,"end":193.238},{"n":48,"part":"심정지 전 몸이 보내는 신호","text":"식은땀이 나거나, 숨이 평소보다 심하게 차기도 하죠.","start":193.688,"end":197.029},{"n":49,"part":"심정지 전 몸이 보내는 신호","text":"그 통증이 팔이나 턱, 등으로 번지기도 합니다.","start":197.479,"end":200.367},{"n":50,"part":"심정지 전 몸이 보내는 신호","text":"문제는 이 신호를, 조금 쉬면 괜찮아질 거라고 넘기기 쉽다는 겁니다.","start":200.817,"end":205.064},{"n":51,"part":"심정지 전 몸이 보내는 신호","text":"2016년 미국 오리건주의 연구팀이, 갑자기 심정지가 온 사람들을 살펴봤습니다.","start":205.514,"end":210.818},{"n":52,"part":"심정지 전 몸이 보내는 신호","text":"35세에서 65세 환자의 절반 정도는, 그 전 4주 안에 신호가 있었습니다.","start":211.268,"end":216.27},{"n":53,"part":"심정지 전 몸이 보내는 신호","text":"가장 많은 신호는 가슴 통증과 숨참이었죠.","start":216.72,"end":219.207},{"n":54,"part":"심정지 전 몸이 보내는 신호","text":"하지만 신호를 느끼고 구급차를 먼저 부른 사람은, 다섯 명 중 한 명도 안 됐습니다.","start":219.657,"end":224.659},{"n":55,"part":"심정지 전 몸이 보내는 신호","text":"김 씨가 느낀 것이 이런 신호였는지는 알 수 없습니다.","start":225.109,"end":228.2},{"n":56,"part":"심정지 전 몸이 보내는 신호","text":"그런데 이런 신호가 왔을 때, 혼자 먼저 내려가는 건 왜 위험할까요?","start":228.65,"end":232.746},{"n":57,"part":"혼자 먼저 내려가면 위험한 이유","text":"혼자 먼저 내려가면 위험한 이유는 두 가지입니다.","start":233.746,"end":236.686},{"n":58,"part":"혼자 먼저 내려가면 위험한 이유","text":"첫 번째, 신호가 와도 멈추지 않고 계속 걷게 됩니다.","start":237.136,"end":240.326},{"n":59,"part":"혼자 먼저 내려가면 위험한 이유","text":"걷는 동안에는 심장이 쉬지 못하죠.","start":240.776,"end":242.81},{"n":60,"part":"혼자 먼저 내려가면 위험한 이유","text":"두 번째, 혼자가 됩니다.","start":243.26,"end":244.789},{"n":61,"part":"혼자 먼저 내려가면 위험한 이유","text":"심정지가 오면, 쓰러진 사람은 스스로 119를 부를 수 없습니다.","start":245.239,"end":249.335},{"n":62,"part":"혼자 먼저 내려가면 위험한 이유","text":"심장이 멈추면 피가 뇌로 가지 못해, 곧바로 의식을 잃기 때문입니다.","start":249.785,"end":254.032},{"n":63,"part":"혼자 먼저 내려가면 위험한 이유","text":"그리고 4분이 지나면, 뇌가 손상되기 시작한다고 알려져 있습니다.","start":254.482,"end":258.729},{"n":64,"part":"혼자 먼저 내려가면 위험한 이유","text":"그래서 옆 사람이 바로 가슴을 눌러 주면, 살릴 기회가 커지죠.","start":259.179,"end":262.973},{"n":65,"part":"혼자 먼저 내려가면 위험한 이유","text":"질병관리청의 2024년 전국 조사를 보면, 이 차이가 숫자로 나옵니다.","start":263.423,"end":268.123},{"n":66,"part":"혼자 먼저 내려가면 위험한 이유","text":"옆 사람이 가슴을 눌러 준 환자는 14.4%가 살았습니다.","start":268.573,"end":272.419},{"n":67,"part":"혼자 먼저 내려가면 위험한 이유","text":"그러지 못한 환자는 6.1%로, 두 배 넘게 차이가 났습니다.","start":272.869,"end":276.965},{"n":68,"part":"혼자 먼저 내려가면 위험한 이유","text":"구조대가 오기까지 오래 걸리는 산에서는, 옆 사람이 누르는 시간이 더 중요하죠.","start":277.415,"end":282.417},{"n":69,"part":"혼자 먼저 내려가면 위험한 이유","text":"그런데 어디서 쓰러졌는지 몰라, 김 씨를 찾는 데만 1시간쯤 걸렸습니다.","start":282.867,"end":287.416},{"n":70,"part":"혼자 먼저 내려가면 위험한 이유","text":"살았을지는 알 수 없지만, 혼자 걷던 그 숲길에는 그 기회조차 없었던 겁니다.","start":287.866,"end":292.566},{"n":71,"part":"혼자 먼저 내려가면 위험한 이유","text":"그럼 이런 사고를 예방하는 방법은 뭘까요?","start":293.016,"end":295.503},{"n":72,"part":"산에 가기 전 점검 네 가지","text":"산에 가기 전 점검할 것은 네 가지입니다.","start":296.503,"end":298.839},{"n":73,"part":"산에 가기 전 점검 네 가지","text":"첫 번째는 내 심장입니다.","start":299.289,"end":300.719},{"n":74,"part":"산에 가기 전 점검 네 가지","text":"검진에서 혈압이나 혈당, 콜레스테롤이 높다는 말을 들었나요?","start":301.169,"end":305.114},{"n":75,"part":"산에 가기 전 점검 네 가지","text":"담배를 피우거나, 가족 중에 심장병을 앓은 사람이 있나요?","start":305.564,"end":309.207},{"n":76,"part":"산에 가기 전 점검 네 가지","text":"오르막에서 예전보다 가슴이 답답하거나 숨이 쉽게 차나요?","start":309.657,"end":313.201},{"n":77,"part":"산에 가기 전 점검 네 가지","text":"하나라도 그렇다면, 병원에서 심장 검사가 필요한지 먼저 물어보세요.","start":313.651,"end":318.049},{"n":78,"part":"산에 가기 전 점검 네 가지","text":"두 번째는 그날의 몸 상태입니다.","start":318.499,"end":320.382},{"n":79,"part":"산에 가기 전 점검 네 가지","text":"전날 술을 마셨거나 잠을 제대로 못 잤다면, 그날 산행은 미루는 게 좋습니다.","start":320.832,"end":325.532},{"n":80,"part":"산에 가기 전 점검 네 가지","text":"산에서 마시는 술도 피해야 하죠.","start":325.982,"end":327.865},{"n":81,"part":"산에 가기 전 점검 네 가지","text":"세 번째는 날씨입니다.","start":328.315,"end":329.594},{"n":82,"part":"산에 가기 전 점검 네 가지","text":"한파나 폭염, 강풍 특보가 내려진 날에는 산행을 미룹니다.","start":330.044,"end":333.687},{"n":83,"part":"산에 가기 전 점검 네 가지","text":"네 번째는 함께 갈 사람입니다.","start":334.137,"end":335.869},{"n":84,"part":"산에 가기 전 점검 네 가지","text":"일행에게 내 지병과 먹는 약을 미리 알려 두세요.","start":336.319,"end":339.108},{"n":85,"part":"산에 가기 전 점검 네 가지","text":"누가 아프면 적어도 한 사람은 곁에 남기로, 출발 전에 약속해 두는 것도 좋습니다.","start":339.558,"end":344.56},{"n":86,"part":"산에 가기 전 점검 네 가지","text":"그리고 산에서 몸이 안 좋아지면, 그 자리에 앉아서 일행에게 알립니다.","start":345.01,"end":349.408},{"n":87,"part":"산에 가기 전 점검 네 가지","text":"걸으면 심장이 더 힘들어지니, 신호가 하나라도 있다면 그 자리에서 119에 신고하세요.","start":349.858,"end":355.464},{"n":88,"part":"산에 가기 전 점검 네 가지","text":"숨이 차기만 할 때는, 앉아서 쉬어도 가라앉지 않으면 신호로 보면 됩니다.","start":355.914,"end":360.463},{"n":89,"part":"산에 가기 전 점검 네 가지","text":"이런 신호 없이 힘들기만 하다면, 일행과 함께 천천히 내려오면 됩니다.","start":360.913,"end":365.311},{"n":90,"part":"산에 가기 전 점검 네 가지","text":"신고할 때는 가까운 등산로 위치 표지판의 번호를 불러 주면, 구조대가 빨리 찾습니다.","start":365.761,"end":371.065},{"n":91,"part":"산에 가기 전 점검 네 가지","text":"옆 사람이 쓰러졌다면, 119 안내에 따라 가슴 한가운데를 세게 누르세요.","start":371.515,"end":376.215},{"n":92,"part":"산에 가기 전 점검 네 가지","text":"가까이에 자동심장충격기가 있다면, 다른 사람이 가져와 함께 쓰면 됩니다.","start":376.665,"end":381.365},{"n":93,"part":"산에 가기 전 점검 네 가지","text":"그런데 부득이하게 혼자 가야 한다면, 어떻게 해야 할까요?","start":381.815,"end":385.458},{"n":94,"part":"혼자 산에 가야 한다면","text":"혼자 산에 가야 한다면, 길을 잃거나 다쳤을 때 나를 찾아 줄 사람부터 정해 두세요.","start":386.458,"end":391.46},{"n":95,"part":"혼자 산에 가야 한다면","text":"출발 전에 가족에게, 어느 코스로 가서 몇 시에 내려올지 알려 두세요.","start":391.91,"end":396.157},{"n":96,"part":"혼자 산에 가야 한다면","text":"그리고 그 시각까지 연락이 없으면, 대신 119에 신고해 달라고 부탁해 둡니다.","start":396.607,"end":401.609},{"n":97,"part":"혼자 산에 가야 한다면","text":"휴대폰은 충분히 충전하고, 가족과 위치 공유를 켜 두면 좋죠.","start":402.059,"end":405.853},{"n":98,"part":"혼자 산에 가야 한다면","text":"다만 심정지는 몇 분을 다투는 일이라, 이것만으로는 부족합니다.","start":406.303,"end":410.399},{"n":99,"part":"혼자 산에 가야 한다면","text":"그래서 길은 사람이 자주 다니는 큰 등산로를 고릅니다.","start":410.849,"end":414.091},{"n":100,"part":"혼자 산에 가야 한다면","text":"걷다가 앞에서 말한 신호가 오면, 그 자리에 멈추고 바로 119에 신고하세요.","start":414.541,"end":419.392},{"n":101,"part":"혼자 산에 가야 한다면","text":"지나가는 등산객이 있다면, 몸이 안 좋다고 먼저 말을 거는 것도 방법입니다.","start":419.842,"end":424.542},{"n":102,"part":"혼자 산에 가야 한다면","text":"첫 번째 점검에 걸렸는데 아직 병원에서 확인하지 않았다면, 혼자 하는 산행은 피하세요.","start":424.992,"end":430.447},{"n":103,"part":"마무리","text":"산에서는 먼저 내려가기보다, 같이 쉬어 가는 게 서로를 지키는 길이라고 생각합니다.","start":431.447,"end":436.751},{"n":104,"part":"마무리","text":"시청해주셔서 감사합니다.","start":437.201,"end":438.782}],"subs":[[0.3,4.547,"일행과 함께 등산하다가, 몸 상태가 안 좋아진 경험 한 번쯤 있으시죠?"],[4.997,6.88,"그럴 때 당신은 어떻게 하시나요?"],[7.33,11.577,"만약 먼저 내려가겠다고 한다면, 당신은 사고를 당할 위험이 큽니다."],[12.027,16.425,"왜 그런지, 실제로 사망 사고가 있었던 한라산 사례로 알아보겠습니다."],[16.875,20.268,"그리고 등산 전에 조심해야 할 것도 같이 알아보겠습니다."],[21.268,25.968,"2023년 3월 26일 일요일, 한라산 둘레길에서 있었던 일입니다."],[26.418,30.816,"제주에 사는 54세 김 씨는, 일행과 함께 둘레길 산행에 나섰습니다."],[31.266,36.721,"한라산 둘레길은 정상으로 오르는 길이 아니라,\n해발 600에서 800미터 사이 숲길이죠."],[37.171,40.111,"그래서 가벼운 산책쯤으로 여기는 분이 많습니다."],[40.561,44.204,"그런데 걷던 중, 김 씨는 몸 상태가 좋지 않다고 느꼈습니다."],[44.654,46.537,"그리고 일행에게 이렇게 말했죠."],[46.987,48.87,"\"몸이 좋지 않아 먼저 내려가겠다.\""],[49.32,51.505,"김 씨는 혼자 왔던 길을 돌아갔습니다."],[51.955,53.536,"누구나 할 법한 결정입니다."],[53.986,56 할 때는 가까운 등산로 위치 표지판의 번호를 불러 주면,\n구조대가 빨리 찾습니다."],[371.515,376.215,"옆 사람이 쓰러졌다면,\n119 안내에 따라 가슴 한가운데를 세게 누르세요."],[376.665,381.365,"가까이에 자동심장충격기가 있다면,\n다른 사람이 가져와 함께 쓰면 됩니다."],[381.815,385.458,"그런데 부득이하게 혼자 가야 한다면, 어떻게 해야 할까요?"],[386.458,391.46,"혼자 산에 가야 한다면,\n길을 잃거나 다쳤을 때 나를 찾아 줄 사람부터 정해 두세요."],[391.91,396.157,"출발 전에 가족에게, 어느 코스로 가서 몇 시에 내려올지 알려 두세요."],[396.607,401.609,"그리고 그 시각까지 연락이 없으면,\n대신 119에 신고해 달라고 부탁해 둡니다."],[402.059,405.853,"휴대폰은 충분히 충전하고, 가족과 위치 공유를 켜 두면 좋죠."],[406.303,410.399,"다만 심정지는 몇 분을 다투는 일이라, 이것만으로는 부족합니다."],[410.849,414.091,"그래서 길은 사람이 자주 다니는 큰 등산로를 고릅니다."],[414.541,419.392,"걷다가 앞에서 말한 신호가 오면,\n그 자리에 멈추고 바로 119에 신고하세요."],[419.842,424.542,"지나가는 등산객이 있다면,\n몸이 안 좋다고 먼저 말을 거는 것도 방법입니다."],[424.992,430.447,"첫 번째 점검에 걸렸는데 아직 병원에서 확인하지 않았다면,\n혼자 하는 산행은 피하세요."],[431.447,436.751,"산에서는 먼저 내려가기보다,\n같이 쉬어 가는 게 서로를 지키는 길이라고 생각합니다."],[437.201,438.782,"시청해주셔서 감사합니다."]],"subs_estimated":true};/*EP-DATA:END*/</script>

<script>
(function () {
"use strict";
K.init(window.EP, { chip: false });
const { S, E, W } = K;
const tl = K.tl;
const IMG = "../../../crisis/source/hallasan-simjeongji-2026-11/images/";
const B = n => Math.max(0, S(n) - 0.3);          // 문장 n 바로 앞 (장면 바뀜)
const END = K.D;
const SP = window.SPRITES || { sheets: {}, med: {}, plates: [] };
const has = n => n.startsWith("PLT-") ? (SP.plates || []).includes(n) : n.startsWith("MED-S") ? !!(SP.med || {})[n] : !!(SP.sheets || {})[n];
const HAS = (...ns) => ns.every(has);
const MEDS = k => ((SP.med || {})["MED-S-STATES"] || [])[k - 1];

/* ───── 배치 표 [x, y, 가로, 세로] — 그림·실루엣·효과·말풍선은 BG/ACT/FX(화면 전체 · 카메라가 움직이면 밖으로도), 글 상자는 CARD 한 곳 · 자막 띠(y 870 아래)는 비움 ───── */
const LAY = window.LAYOUT = {
  BG: [0, 0, 1920, 1080], VIG: [0, 0, 1920, 1080],
  ACT: [-3000, -800, 8000, 2800], FX: [-3000, -800, 8000, 2800],
  MARK: [1650, 28, 240, 58], TAG: [70, 40, 1300, 80], STAMP: [70, 130, 1100, 80],
  CARD: [70, 170, 1080, 560],
};
window.LAYOUT_ALLOW = [];
for (const f of ["BG", "VIG", "ACT", "FX"]) for (const k of Object.keys(LAY)) if (k !== f) window.LAYOUT_ALLOW.push([f, k]);

const el = (html, parent) => K.el(html, parent);
const slotBox = (slot, cls, html) => { const [x, y, w, h] = LAY[slot]; return `<div class="${cls}" data-slot="${slot}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${html || ""}</div>`; };
const fadeIn = (n, at, d) => tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: d || 0.4, ease: "power2.out" }, at);
const fadeOut = (n, at, d) => tl.to(n, { opacity: 0, duration: d || 0.3, ease: "none" }, at);
const life = (n, a, b, pop) => {                     // a 에 나타나고 b 에 사라짐 (pop = 튀어나옴)
  if (pop) tl.fromTo(n, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, a);
  else fadeIn(n, a);
  if (b != null) fadeOut(n, b - 0.3);
  return n;
};

/* ───── 장면 = 배경 상자(흔들림 층 > 카메라 층 > 세계 층: 배경 그림·실루엣·말풍선) + 효과 층 ───── */
const FLAT = { "PLT-01-TRAIL-SIDE": 0.785, "PLT-02-ENTRANCE-SIDE": 0.80, "PLT-03-SEARCH-SIDE": 0.81, "PLT-06-CLEARING": 0.80, "PLT-07-CLINIC": 0.85, "PLT-08-LIVING": 0.85, "PLT-10-SIGNPOST": 0.80 };
const SLOPES = { "PLT-04-SLOPE-UP": [0.30, 0.76, 0.80, 0.38], "PLT-05-SLOPE-DOWN": [0.40, 0.72, 0.85, 0.40] };   // 그림에서 잰 길 선
const gy = name => Math.round((FLAT[name] || 0.785) * 1080);
const slopeFor = name => { const [x0, y0, x1, y1] = SLOPES[name]; return x => Math.round(1080 * (y0 + (y1 - y0) * (x / 1920 - x0) / (x1 - x0))); };
const TINT = { none: "none", gray: "grayscale(.9) contrast(1.05) brightness(.78)", late: "sepia(.3) saturate(.85) brightness(.8)", cold: "saturate(.6) hue-rotate(-14deg) brightness(.85)",
  warm: "sepia(.22) saturate(1.15) brightness(1.03)", dark: "brightness(.42) saturate(.6)", red: "sepia(.45) saturate(2.2) hue-rotate(-28deg) brightness(.7)" };
function shot(a, b, file, o) {
  o = o || {};
  const sc = K.scene(a, b, o.keep ? { keep: true } : undefined);
  const bx = el(slotBox("BG", "bgbox", ""), sc);
  const shk = el(`<div class="lay"></div>`, bx);
  const cam = el(`<div class="lay cam"></div>`, shk);
  const world = el(`<div class="lay wld"></div>`, cam);
  const img = file ? el(`<img class="bg" src="${IMG + file}.jpg" alt="">`, world) : null;
  if (img && o.tint) gsap.set(img, { filter: TINT[o.tint] });
  const drift = o.drift == null ? 0.035 : o.drift;
  if (drift) tl.fromTo(world, { scale: 1 }, { scale: 1 + drift, duration: Math.max(0.5, b - a), ease: "none" }, a);
  el(slotBox("VIG", "vig"), sc);
  if (o.mark !== false) life(el(slotBox("MARK", "mark" + (o.mark === "g" ? " g" : ""), `<i></i>${o.mark === "g" ? "그래픽" : "재연"}`), sc), a + 0.2, null);
  return { sc, bx, shk, cam, world, img, a, b };
}
// 카메라: 세계의 (fx, fy) 를 화면 가운데로, z 배 (z ≥ 1 — 가장자리가 비지 않게 잡음)
function focus(P, t, fx, fy, z, dur, ease) {
  const x = Math.min(0, Math.max(1920 - 1920 * z, 960 - fx * z)), y = Math.min(0, Math.max(1080 - 1080 * z, 540 - fy * z));
  tl.to(P.cam, { scale: z, x, y, duration: dur || 1.2, ease: ease || "power2.inOut" }, t);
}
const blurBg = (P, t, px, dur) => P.img && tl.to(P.img, { filter: `blur(${px}px) brightness(.8)`, duration: dur || 0.8 }, t);
const tintTo = (P, t, name, dur) => P.img && tl.to(P.img, { filter: TINT[name], duration: dur || 1 }, t);

/* 실루엣 배우 (세계 안) — segs: [{t0,t1,sheet,frames,fps,x,v,y|yAt,h,flip,ghost}] · 시트가 없으면 그 칸은 뺌 */
function actor(P, segs) {
  segs = segs.filter(s => has(s.sheet));
  if (!segs.length) return null;
  const n = el(`<div class="act" data-slot="ACT" style="left:0;top:0;width:10px;height:10px"></div>`, P.world);
  const t0 = segs[0].t0, t1 = segs[segs.length - 1].t1;
  const upd = t => {
    let g = segs[0];
    for (const s of segs) if (t >= s.t0) g = s;
    const m = SP.sheets[g.sheet], k = g.h / (m.fh - 24), w = m.fw * k, h = m.fh * k;
    const dt = Math.max(0, Math.min(t, g.t1) - g.t0);
    const fr = g.frames[g.fps ? Math.floor(dt * g.fps) % g.frames.length : 0];
    const x = g.x + (g.v || 0) * dt, y = g.yAt ? g.yAt(x) : g.y;
    n.style.left = `${(x - w / 2).toFixed(1)}px`; n.style.top = `${(y - m.feet * k).toFixed(1)}px`;
    n.style.width = `${w.toFixed(1)}px`; n.style.height = `${h.toFixed(1)}px`;
    n.style.backgroundImage = `url(${m.file})`; n.style.backgroundSize = `${(m.n * w).toFixed(1)}px ${h.toFixed(1)}px`;
    n.style.backgroundPosition = `${(-(fr - 1) * w).toFixed(1)}px 0px`; n.style.transform = g.flip ? "scaleX(-1)" : "none";
    n.style.opacity = g.ghost ? "0.4" : "";
  };

  K.cut(E(82) - 0.3, "6장 ③ 날씨");
}
{ // 83~85 — ④ 함께 갈 사람 (예시 장면 말풍선 — 김 씨가 아닌 등산객)
  const P = trail(B(83), B(86), { tint: "warm", drift: 0 });
  chtag(P, "④ 함께 갈 사람", S(83) - 0.1, null);
  const h = 330;
  actor(P, [{ t0: B(83), t1: B(86), sheet: "SIL-05-COMP-STATES", frames: [1], x: 1250, y: GY, h }]);
  actor(P, [{ t0: B(83), t1: B(86), sheet: "SIL-08-SIGNS", frames: [6], x: 640, y: GY, h }]);
  bubble(P, 660, GY - 350, "나 혈압약 먹어", S(84), S(85) + 0.3);
  bubble(P, 1280, GY - 360, "아프면 한 명은 곁에 남자", S(85) + 0.2, null);
  focus(P, S(84), 900, GY - 200, 1.15, 1.5);
  K.cut(S(84) + 1, "6장 ④ 약 알리기"); K.cut(S(85) + 2.5, "6장 ④ 곁에 남기");
}
{ // 86~89 — 산에서 몸이 안 좋을 때: 판단 상자 (자세한 설명이 필요한 곳 — 이 영상의 유일한 글 상자)
  const P = trail(B(86), B(90), { drift: 0 });
  actor(P, [{ t0: B(86), t1: B(90), sheet: "SIL-08-SIGNS", frames: [6], x: 1360, y: GY, h: 330 }]);
  actor(P, [{ t0: B(86), t1: S(87), sheet: "SIL-05-COMP-STATES", frames: [1], x: 1690, y: GY, h: 330 },
            { t0: S(87), t1: B(90), sheet: "SIL-05-COMP-STATES", frames: [3], x: 1690, y: GY, h: 330 }]);
  rings(P, 1770, GY - 290, S(87) + 0.3, B(90), "#FFD400", true);
  card(P, [["t", "✓", "앉아서 일행에게 알리기", S(86)],
           ["r", "!", "신호 하나라도 → <em>그 자리에서 119</em>", W(87, "신호가")],
           ["y", "?", "숨만 참 → 쉬어도 그대로면 신호", S(88)],
           ["t", "✓", "신호 없이 힘듦 → 같이 천천히", S(89)]], S(86) - 0.2, null);
  K.cut(S(87) + 2.5, "6장 판단 1"); K.cut(S(89) + 2, "6장 판단 2");
}
{ // 90 — 위치 표지판 번호 (빛 · 핀이 떨어지고 신호 고리)
  const T10 = "PLT-10-SIGNPOST", hasPost = HAS(T10);
  const P = shot(B(90), B(91), hasPost ? T10 : (HAS(T1) ? T1 : "DOC-03-FOREST"), { drift: 0 });
  const px = hasPost ? 1400 : 1300, py = hasPost ? 600 : 640;
  if (!hasPost) el(`<div data-slot="FX" style="position:absolute;left:${px - 9}px;top:${py - 120}px;width:18px;height:${GY - py + 120}px;background:#2B2F36;border-radius:4px"></div>`, P.world),
    el(`<div data-slot="FX" style="position:absolute;left:${px - 60}px;top:${py - 170}px;width:120px;height:70px;background:#3A404A;border:4px solid #8D96A6;border-radius:8px"></div>`, P.world);
  glow(P, px, py - 140, 130, "rgba(255,212,0,.85)", W(90, "위치") - 0.1, null, true);
  pin(P, px, py - 190, W(90, "위치"));
  rings(P, px, py - 240, W(90, "번호"), B(91), "#FFD400", true);
  lbl(P, "위치 표지판 번호", px, py + 60, W(90, "위치") + 0.2, null, "yl", true);
  focus(P, W(90, "위치") - 0.2, px - 100, py - 120, 1.35, 1.4);
  K.cut(E(90) - 0.3, "6장 위치 표지판");
}
{ // 91~92 — 가슴 압박 · 자동심장충격기
  const T6 = "PLT-06-CLEARING", useS = HAS(T6, "SIL-10-CPR");
  const P = shot(B(91), B(93), useS ? T6 : "DOC-23-SIT", { drift: 0.03 });
  if (useS) {
    actor(P, [{ t0: B(91), t1: S(92), sheet: "SIL-10-CPR", frames: [1, 2], fps: 3.7, x: 960, y: gy(T6), h: 300 },
              { t0: S(92), t1: B(93), sheet: "SIL-10-CPR", frames: [4], x: 960, y: gy(T6), h: 300 }]);
    rings(P, 900, gy(T6) - 90, S(91) + 0.4, S(92) + 0.3, "#2ED3BB", true);
    glow(P, 1180, gy(T6) - 150, 90, "rgba(46,211,187,.9)", W(92, "자동심장충격기") - 0.1, null, true);
  }
  lbl(P, "가슴 한가운데 · 세게", 960, 260, S(91) + 0.5, S(92), "tl");
  lbl(P, "자동심장충격기", 960, 260, W(92, "자동심장충격기"), null, "tl");
  K.cut(S(91) + 2, "6장 가슴 압박"); K.cut(S(92) + 2, "6장 자동심장충격기");
}
{ // 93 — 혼자 가야 한다면?
  const P = trail(B(93), B(94), { drift: 0.05 });
  actor(P, [soloSeg(3, { t0: B(93), t1: B(94), x: 900, v: pxs(330, 0.4), y: GY, h: 330 })]);
  big(P, "혼자라면?", 960, 300, S(93) + 0.6, null, 120, true);
  K.cut(E(93) - 0.3, "6장 혼자라면");
}

/* ═══════════ 7장 혼자 산에 가야 한다면 (94~102) ═══════════ */
{ // 94~97 — 출발 전: 찾아 줄 사람 · 코스와 시각 → 연락 없으면 대신 119 · 충전 · 위치 공유
  const T2 = "PLT-02-ENTRANCE-SIDE", gp = HAS(T2) ? gy(T2) : 860;
  const P = shot(B(94), B(98), HAS(T2) ? T2 : "DOC-02-ENTRANCE", { drift: 0.03 });
  chtag(P, "혼자 산에 가야 한다면", B(94) + 0.2, null);
  actor(P, [soloSeg(1, { t0: B(94), t1: B(98), x: 640, y: gp, h: 330 })]);
  rings(P, 700, gp - 240, S(94) + 0.4, S(96), "#2ED3BB", true);
  lbl(P, "어느 코스 · 몇 시에", 1380, 300, W(95, "코스") - 0.2, S(96));
  clock(P, 1380, 470, 120, 15 * 60, 17 * 60, S(96) - 0.1, S(96) + 0.2, W(96, "119"), S(97));
  lbl(P, "연락 없으면 → 대신 119", 1380, 660, W(96, "119") - 0.2, S(97), "yl");
  pin(P, 650, gp - 370, W(97, "위치"), "#2ED3BB");
  rings(P, 650, gp - 420, W(97, "위치") + 0.3, B(98), "#2ED3BB", true);
  lbl(P, "충전 · 위치 공유", 1380, 470, S(97) + 0.2, null, "tl");
  K.cut(S(95) + 2, "7장 코스·시각"); K.cut(S(96) + 2, "7장 대신 119"); K.cut(S(97) + 2, "7장 위치 공유");
}
{ // 98 — 하지만 심정지는 몇 분 싸움 (빨간 맥)
  const P = trail(B(98), B(99), { tint: "red", drift: 0.05 });
  redPulse(P, S(98), B(99), 0.55, 110);
  big(P, "몇 분", 960, 450, S(98) + 0.4, null, 170, true);
  K.cut(E(98) - 0.3, "7장 몇 분");
}
{ // 99~101 — 사람이 다니는 큰 길 · 신호가 오면 멈추고 119 · 지나가는 등산객에게 말 걸기
  const P = trail(B(99), B(102), { drift: 0 });
  const h = 330, v = pxs(h, 0.4), x0 = 420, xs = at(x0, v, B(99), S(100)), tIn = S(100) - 0.5, vp = -pxs(h * 0.9, 0.7);
  actor(P, [soloSeg(3, { t0: B(99), t1: S(100), x: x0, v, y: GY, h }), soloSeg(4, { t0: S(100), t1: W(100, "119") - 0.3, x: xs, y: GY, h }),
            soloSeg(5, { t0: W(100, "119") - 0.3, t1: S(101), x: xs, y: GY, h }), soloSeg(6, { t0: S(101), t1: B(102), x: xs, y: GY, h })]);
  const xp1 = Math.max(1350, at(2200, vp, tIn, S(101) + 0.8));
  actor(P, [{ t0: tIn, t1: S(101) + 0.8, sheet: "SIL-04-COMP-WALK", frames: [1, 2, 3, 4], fps: 2.6, x: 2200, v: (xp1 - 2200) / (S(101) + 0.8 - tIn), y: GY, h: h * 0.9, flip: true },
            { t0: S(101) + 0.8, t1: B(102), sheet: "SIL-04-COMP-WALK", frames: [2], x: xp1, y: GY, h: h * 0.9, flip: true }]);
  lbl(P, "사람이 다니는 큰 길", 1300, 260, S(99) + 0.2, S(100), "tl");
  glow(P, xs + 8, GY - 215, 70, "rgba(255,60,50,.9)", S(100) + 0.2, S(101), true);
  rings(P, xs + 60, GY - 300, W(100, "119") - 0.3, S(101), "#FF5A4E", true);
  lbl(P, "멈추고 바로 119", 1300, 260, S(100) + 0.3, S(101), "rd");
  bubble(P, xs + 40, GY - 360, "몸이 좀 안 좋아요", W(101, "말을") - 0.4, null);
  K.cut(S(99) + 1.5, "7장 큰 길"); K.cut(S(100) + 2, "7장 멈춰 119"); K.cut(S(101) + 2.5, "7장 말 걸기");
}
{ // 102 — 첫 번째 점검에 걸렸는데 확인 전이면 혼자 산행 ✕
  const P = trail(B(102), B(103), { tint: "gray", drift: 0.04 });
  actor(P, [soloSeg(3, { t0: B(102), t1: B(103), x: 900, v: pxs(330, 0.3), y: GY, h: 330 })]);
  icon(P, "heart", 860, 330, 200, S(102) + 0.3, null);
  big(P, "<span class='rd'>✕</span>", 1080, 330, W(102, "혼자") - 0.1, null, 150, true);
  K.cut(E(102) - 0.3, "7장 혼자 산행 ✕");
}

/* ═══════════ 마무리 (103~104) — 같이 쉬어 가는 길 ═══════════ */
{ const P = trail(B(103), S(104) - 0.2, { tint: "warm", drift: 0 });
  actor(P, [{ t0: B(103), t1: S(104), sheet: "SIL-08-SIGNS", frames: [6], x: 820, y: GY, h: 330 }]);
  actor(P, [{ t0: B(103), t1: S(104), sheet: "SIL-05-COMP-STATES", frames: [1], x: 1180, y: GY, h: 330 }]);
  const sun = fxl(P, "background:radial-gradient(circle at 75% 10%,rgba(255,210,120,.55),rgba(0,0,0,0) 55%);opacity:0");
  tl.to(sun, { opacity: 1, duration: 2 }, B(103));
  focus(P, B(103) + 0.5, 1000, GY - 150, 1.18, 5, "sine.inOut"); }
{ const P = shot(S(104) - 0.5, END, "DOC-24-END", { keep: true, drift: 0.05 });
  K.cut(S(103) + 2, "마무리 같이 쉬기"); K.cut(END - 1, "끝 화면"); }

K.done();
})();
