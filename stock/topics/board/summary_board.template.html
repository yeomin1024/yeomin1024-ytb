<title>대본 요약 평가판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 대본 요약 평가판 틀 v1.1 (2026-11-10 — 옛 판 피드백은 장 이름으로 맞춤) (tools/summary_board.py v1.1 가 DATA 자리를 채움 — 이 파일을 바로 올리지 않음).
     장마다 시작(첫 문장) · 흐름(Claude 요약) · 넘어가는 멘트(마지막 문장) + 장별 피드백.
     피드백 = 아티팩트 db 의 feedback 모음 {script, ver, chapter, part(start|flow|transition|all), quote, text, createdAt, updatedAt, status(new|done), reply}
     — Claude 가 ArtifactData 로 읽고 반영 뒤 status·reply 를 씀. 연구·교육용 — 투자 권유가 아닙니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 배치: 가운데 한 줄 — 장 카드가 세로 등뼈를 따라 내려가고, 카드 사이 이음줄 위에 '넘어가는 멘트'가 다리처럼 놓임 */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF1F5; --fg:#1B2230; --muted:#5E6A79; --line:#D9DFE7;
  --accent:#B86E00; --accent-soft:#FFF3DC; --done:#1E7F66; --done-soft:#DDF3EC; --new:#B8430C; --new-soft:#FDE8DD;
  --f-head:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif; --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#19202A; --sunk:#141A22; --fg:#E6EBF1; --muted:#98A3B2; --line:#2A3441;
  --accent:#F0B44A; --accent-soft:#3A2D14; --done:#45C29F; --done-soft:#14332B; --new:#F28E62; --new-soft:#3B2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#19202A; --sunk:#141A22; --fg:#E6EBF1; --muted:#98A3B2; --line:#2A3441;
  --accent:#F0B44A; --accent-soft:#3A2D14; --done:#45C29F; --done-soft:#14332B; --new:#F28E62; --new-soft:#3B2219; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-head);font-size:22px;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--done)} .status.bad .dot{background:var(--new)}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pick{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick .k{font-size:12px;letter-spacing:.04em;color:var(--muted)}
.pick .t{font-weight:700;font-size:14px;line-height:1.4}
.pick .n{font-size:12px;color:var(--muted)}
.pick .n b{color:var(--new);font-weight:700}
.head{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:14px}
.head .ttl{font-family:var(--f-head);font-size:19px;font-weight:700;text-wrap:balance}
.head .meta{font-size:13px;color:var(--muted)}
.spine{display:flex;flex-direction:column}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ch-no{font-family:var(--f-head);font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.ch-name{font-family:var(--f-head);font-size:17px;font-weight:700}
.ch-rng{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lab{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:2px}
.start{background:var(--sunk);border-radius:8px;padding:10px 12px}
.start p{margin:0}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.flow li{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start}
.flow li::before{content:"↓";color:var(--accent);font-weight:700;line-height:1.6;text-align:center}
.flow li:first-child::before{content:"•"}
.bridge{display:grid;grid-template-columns:2px 1fr;gap:14px;margin-left:26px;padding-block:6px}
.bridge .rail{background:var(--accent);border-radius:2px;min-height:100%}
.bridge .say{align-self:center;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;font-size:14px;min-width:0}
.bridge .say .lab{color:var(--accent)}
.bridge.end .rail{background:var(--line)} .bridge.end .say{background:transparent;border-color:var(--line)} .bridge.end .say .lab{color:var(--muted)}
.fbrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn:hover{border-color:var(--accent)} .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{border-color:var(--new);color:var(--new)}
.btn[disabled]{opacity:.5;cursor:default}
.count{font-size:12px;color:var(--muted)}
.composer{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts label{font-size:13px;display:flex;gap:4px;align-items:center;cursor:pointer}
textarea{width:100%;box-sizing:border-box;min-height:72px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fbs{display:flex;flex-direction:column;gap:8px}
.fb{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fb .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.chip.new{background:var(--new-soft);color:var(--new)} .chip.done{background:var(--done-soft);color:var(--done)}
.fb .txt{white-space:pre-wrap;word-break:break-word}
.fb .rep{font-size:13px;color:var(--done);white-space:pre-wrap;word-break:break-word}
.fb .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1>대본 요약 평가판</h1>
    <p class="lead">장마다 <b>시작 멘트</b> · <b>내용 흐름</b> · <b>다음 장으로 넘어가는 멘트</b>만 보여 줍니다. 장 카드의 ‘피드백’으로 남기면 Claude 가 읽고 대본에 반영합니다.</p>
    <div class="status" id="status"><span class="dot"></span><span id="status-t">저장소에 연결하는 중…</span></div>
  </div>
  <div class="picker" id="picker" role="group" aria-label="대본 고르기"></div>
  <div class="head" id="head"></div>
  <div class="spine" id="spine"></div>
  <p class="foot">연구·교육용 콘텐츠의 대본 요약입니다 — 투자 권유가 아닙니다. 흐름 줄은 Claude 가 대본을 줄여 쓴 것이고, 시작·넘어가는 멘트는 대본 문장 그대로입니다.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const DATA = /*DATA*/null/*DATA*/;
  const byKey = Object.fromEntries(DATA.items.map(s => [s.key, s]));
  const PART = { all: "장 전체", start: "시작 멘트", flow: "흐름", transition: "넘어가는 멘트" };
  const st = { key: DATA.items[0].key, db: null, canWrite: true, fb: [], open: null, part: "all", editing: null, delConfirm: null };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const when = iso => { try { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; } catch (e) { return ""; } };
  const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1800); };
  const setStatus = (k, m) => { $("status").className = "status " + (k || ""); $("status-t").textContent = m; };
  const fbOf = (key, ch) => { const s = byKey[key], c = ch == null ? null : s.chapters[ch];   // v1.1: 옛 판에 남긴 피드백은 장 이름으로 맞춤 (장이 빠지거나 순서가 바뀌어도)
    return st.fb.filter(f => f.script === key && (ch == null || (f.ver === s.ver ? f.chapter === ch : f.chapterName === c.name))); };
  const quoteOf = (c, part) => part === "start" ? c.start : part === "transition" ? c.transition : part === "flow" ? c.flow.join(" / ") : `${c.name}: ${c.start} … ${c.transition}`;

  function renderPicker() {
    $("picker").innerHTML = DATA.items.map(s => {
      const n = fbOf(s.key).filter(f => f.status !== "done").length;
      return `<button class="pick" type="button" data-key="${esc(s.key)}" aria-pressed="${s.key === st.key}">
        <span class="k">${esc(s.label)} · ${esc(s.ver)}</span><span class="t">${esc(s.title)}</span>
        <span class="n">장 ${s.chapters.length}개 · 문장 ${s.n}개${n ? ` · <b>새 피드백 ${n}</b>` : ""}</span></button>`;
    }).join("");
  }
  function renderHead() {
    const s = byKey[st.key];
    $("head").innerHTML = `<div class="ttl">${esc(s.title)}</div><div class="meta">${esc(s.label)} · ${esc(s.ver)} · 장 ${s.chapters.length}개 · 문장 ${s.n}개 · <span style="font-family:ui-monospace,monospace">${esc(s.file)}</span></div>`;
  }
  function fbList(s, i) {
    const items = fbOf(s.key, i).slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    if (!items.length) return "";
    return `<div class="fbs">${items.map(f => {
      const done = f.status === "done", ed = st.editing === f.id, del = st.delConfirm === f.id, old = f.ver !== s.ver;
      return `<div class="fb" data-id="${esc(f.id)}">
        <div class="top"><span class="chip ${done ? "done" : "new"}">${done ? "반영함" : "새 피드백"}</span><span>${esc(PART[f.part] || "장 전체")}</span>${old ? `<span>${esc(f.ver)}에 남김</span>` : ""}<span>${when(f.updatedAt || f.createdAt)}</span></div>
        ${ed ? `<textarea id="ed-${esc(f.id)}" aria-label="피드백 고치기">${esc(f.text)}</textarea>
          <div class="acts"><button class="btn primary" type="button" data-act="save-ed">저장</button><button class="btn" type="button" data-act="cancel-ed">취소</button></div>`
             : `<div class="txt">${esc(f.text)}</div>${f.reply ? `<div class="rep">Claude: ${esc(f.reply)}</div>` : ""}
          ${st.canWrite && st.db ? `<div class="acts">${del ? `<span class="count">이 피드백을 지울까요?</span><button class="btn danger" type="button" data-act="del-yes">삭제</button><button class="btn" type="button" data-act="del-no">취소</button>`
             : `<button class="btn" type="button" data-act="edit">고치기</button><button class="btn" type="button" data-act="del">삭제</button>`}</div>` : ""}`}
      </div>`;
    }).join("")}</div>`;
  }
  function renderSpine() {
    const s = byKey[st.key], last = s.chapters.length - 1;
    $("spine").innerHTML = s.chapters.map((c, i) => {
      const open = st.open === i, n = fbOf(s.key, i).length;
      const card = `<section class="ch" data-ch="${i}" aria-labelledby="chn-${i}">
        <div class="ch-top"><span class="ch-no">${String(i + 1).padStart(2, "0")}</span><span class="ch-name" id="chn-${i}">${esc(c.name)}</span><span class="ch-rng">문장 ${c.from}–${c.to}</span></div>
        <div class="start"><div class="lab">시작 멘트</div><p>${esc(c.start)}</p></div>
        <div><div class="lab">내용 흐름</div><ul class="flow">${c.flow.length ? c.flow.map(x => `<li><span>${esc(x)}</span></li>`).join("") : `<li><span class="empty">(흐름 요약 없음)</span></li>`}</ul></div>
        <div class="fbrow"><button class="btn${open ? " primary" : ""}" type="button" data-act="toggle">${open ? "닫기" : "피드백"}</button>${n ? `<span class="count">피드백 ${n}개</span>` : ""}</div>
        ${open ? `<div class="composer">
          <div class="parts" role="radiogroup" aria-label="어느 부분">${Object.entries(PART).map(([k, v]) => `<label><input type="radio" name="part-${i}" id="part-${i}-${k}" value="${k}"${st.part === k ? " checked" : ""}> ${v}</label>`).join("")}</div>
          <textarea id="tx-${i}" aria-label="${esc(c.name)} 피드백" placeholder="예) 넘어가는 멘트가 다음 장 내용과 안 이어져요"></textarea>
          <div class="fbrow"><button class="btn primary" type="button" data-act="add"${st.db && st.canWrite ? "" : " disabled"}>저장</button>${st.db ? "" : `<span class="count">저장소에 연결되지 않아 저장할 수 없습니다</span>`}</div></div>` : ""}
        ${fbList(s, i)}
      </section>`;
      const bridge = `<div class="bridge${i === last ? " end" : ""}"><span class="rail"></span><div class="say"><div class="lab">${i === last ? "마지막 멘트" : "넘어가는 멘트 → " + esc(s.chapters[i + 1].name)}</div>${esc(c.transition)}</div></div>`;
      return card + bridge;
    }).join("");
  }
  const renderAll = () => { renderPicker(); renderHead(); renderSpine(); };

  $("picker").addEventListener("click", e => {
    const b = e.target.closest(".pick"); if (!b) return;
    st.key = b.dataset.key; st.open = null; st.editing = null; st.delConfirm = null;
    try { history.replaceState(null, "", "#" + st.key); } catch (er) { location.hash = st.key; }
    renderAll();
  });
  $("spine").addEventListener("change", e => { if (e.target.name && e.target.name.startsWith("part-")) st.part = e.target.value; });
  $("spine").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const sec = b.closest(".ch"), i = sec ? +sec.dataset.ch : null, s = byKey[st.key], act = b.dataset.act;
    const fbEl = b.closest(".fb"), id = fbEl && fbEl.dataset.id;
    if (act === "toggle") { st.open = st.open === i ? null : i; st.part = "all"; renderSpine(); if (st.open === i) $("tx-" + i)?.focus(); return; }
    if (act === "add") {
      const text = ($("tx-" + i).value || "").trim(); if (!text) { toast("피드백을 적어 주세요"); return; }
      const c = s.chapters[i], now = new Date().toISOString(); b.disabled = true;
      try { await st.db.collection("feedback").add({ script: s.key, ver: s.ver, chapter: i, chapterName: c.name, part: st.part, quote: quoteOf(c, st.part), text, createdAt: now, updatedAt: now, status: "new", reply: "" }); st.open = null; toast("피드백을 저장했습니다"); }
      catch (er) { b.disabled = false; toast("저장하지 못했습니다 — 잠시 뒤 다시 눌러 주세요"); }
      return;
    }
    if (act === "edit") { st.editing = id; st.delConfirm = null; renderSpine(); $("ed-" + id)?.focus(); return; }
    if (act === "cancel-ed") { st.editing = null; renderSpine(); return; }
    if (act === "save-ed") {
      const v = ($("ed-" + id).value || "").trim(); if (!v) { toast("내용이 비었습니다"); return; }
      try { await st.db.doc("feedback/" + id).update({ text: v, status: "new", updatedAt: new Date().toISOString() }); st.editing = null; toast("고쳤습니다"); }
      catch (er) { toast("고치지 못했습니다"); }
      return;
    }
    if (act === "del") { st.delConfirm = id; renderSpine(); return; }
    if (act === "del-no") { st.delConfirm = null; renderSpine(); return; }
    if (act === "del-yes") { try { await st.db.doc("feedback/" + id).delete(); st.delConfirm = null; toast("피드백을 삭제했습니다"); } catch (er) { toast("삭제하지 못했습니다"); } }
  });

  const h = (location.hash || "").slice(1); if (byKey[h]) st.key = h;
  renderAll();
  window.addEventListener("hashchange", () => { const k = (location.hash || "").slice(1); if (byKey[k] && k !== st.key) { st.key = k; st.open = null; renderAll(); } });

  (async () => {
    const use = window.claude && window.claude.use ? n => window.claude.use(n) : () => Promise.resolve(null);
    let db = null, user = null;
    try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (e) { db = null; }
    if (!db) { setStatus("bad", "저장소에 연결하지 못했습니다 — 요약은 볼 수 있지만 피드백은 저장되지 않습니다."); renderSpine(); return; }
    st.db = db;
    try { if (user && user.can) { const c = await user.can("data.write"); if (c === false) st.canWrite = false; } } catch (e) { /* 모름 = 쓰기 칸 유지 */ }
    setStatus(st.canWrite ? "ok" : "", st.canWrite ? "저장소 연결됨 — 피드백은 바로 저장되고 Claude 가 읽을 수 있습니다." : "보기 전용 — 이 화면에서는 피드백을 저장할 수 없습니다.");
    renderSpine();
    db.collection("feedback").onSnapshot(snap => {
      st.fb = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(f => byKey[f.script] && Number.isInteger(f.chapter));
      if (st.editing && !st.fb.some(f => f.id === st.editing)) st.editing = null;
      renderPicker(); if (st.editing == null) renderSpine();
    }, () => setStatus("bad", "피드백을 불러오지 못했습니다 — 페이지를 새로 열어 주세요."));
  })();
})();
</script>
