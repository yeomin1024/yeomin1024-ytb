function planMap(k, part) {
  // must 를 놓고, min 문장마다 [그날, 그날 + 약 넉 달] 창을 둠 — 문장 끝의 차트 날짜가 창보다 이르면(미래를 먼저 말함) 또는 늦으면(한참 지난 뒤 말함)
  // 그 문장 끝을 창 끝으로 고정 → 다시 (가장 크게 벗어난 것부터, 최대 60번). 'Y:2018' = 그 방법의 2018년 마지막 판정 날 (없으면 그해 마지막 거래일).
  const p = PLAN[k], w = paceW(k), T = R(k).trades;
  const dateOf = d => {
    if (typeof d === "string" && d.startsWith("Y:")) {
      const ys = d.slice(2).split("-"), y1 = ys[0], y2 = ys[ys.length - 1];
      const hs = T.filter(t => t.h != null && AN.dates[t.h].slice(0, 4) >= y1 && AN.dates[t.h].slice(0, 4) <= y2).map(t => t.h);
      return hs.length ? Math.max(...hs) : idx(`${+y2 + 1}-01-01`) - 1;
    }
    return at(d);
  };
  const A = [[PS(part), 0], ...p.must.map(([x, d, wd]) => [wd ? W(x, wd) : E(x), at(d)])];   // v4.2 셋째 칸 = 그 낱말 시작에 그날 (결과 숫자를 말할 때 마지막 날)
  const mins = p.min.map(([x, d]) => { const i = dateOf(d); return [E(x), i, Math.min(N - 1, i + 85)]; });
  for (let it = 0; it < 60; it++) {
    const f = warp(A, w);
    let worst = null, gap = 0.5;
    for (const [t, lo, hi] of mins) {
      if (A.some(a => Math.abs(a[0] - t) < 1e-6)) continue;
      const v = f(t);
      if (lo - v > gap) { gap = lo - v; worst = [t, lo]; }
      if (v - hi > gap) { gap = v - hi; worst = [t, hi]; }
    }
    if (!worst) break;
    A.push(worst); A.sort((x, y) => x[0] - y[0]);
  }
  return { f: warp(A, w, k), anchors: A };
}
for (const k of VORDER) {
  const part = PARTS[k];

  const { f: fmap, anchors } = planMap(k, part);
  const rs = a - 0.1, re = next - 0.45;

  window.RACE_DBG[k] = EP.sent.filter(x => x.part === part).map(x => [x.text.slice(0, 26), AN.dates[Math.min(N - 1, Math.floor(fmap(x.end)))]]);
  const dtf = dayTimes(fmap, rs, re);
  const scr = K.scene(a - 0.1, next - 0.5);

  add3(rs, re, t => RACE.draw(k, fmap(t), c => upd(c, t), t, dtf));

  cut(next - 1.2, `${VNO(k)} 경주 — 끝`);
}
