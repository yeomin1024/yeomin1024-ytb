  s.update = t => { tint(s.BG, DARK); idle(HP, t); CR.rise(t, S(2) + 0.1, 0.6, 4); if (t > tB) CR.jitter(t, 0.012); };
  pop(T(sc, 170, `INDEX`, 60, "w7 N"), S(2) + 0.05);
  pathLine(sc, [[110, 300], [970, 300]], Y, S(2) + 0.15, 0, 7, "18 14");                  // 떨어지기 전 자리 (노란 점선 = 기준)
  pathLine(sc, [[110, 300], [260, 330], [400, 440], [540, 470], [690, 560], [830, 600], [970, 650]], R, S(2) + 0.25, 1.4, 14);
  ["BOTTOM ✓", "BOTTOM ✓", "BOTTOM ✓", "BOTTOM ✓"].forEach((s2, i) => {                       // 바닥이라는 글 — 무대 위로 쌓임
    const n = el(`<div class="post a" style="left:${560 + (i % 2) * 150}px;top:${740 + i * 92}px">${s2}</div>`, sc);
    pop(n, tB + i * 0.18, { from: { scale: 0.4, y: 30 } });
  });
  K.cut(tB - 0.2, "S-02 INDEX 급락");
  K.cut(E(2) - 0.1, "S-02 BOTTOM ✓ 쏟아짐");
}
/* S-03 증권사 앱 — LOAN ×2 · BUY ×2 (문장 3) */
{
  const a = until(3), b = until(4), tL = W(3, "빌려서");
  const sc = K.scene(a, b);
  let HP, CN;
  const s = ST.set(a, b, st => {
    bgOf(st, "HOME");
    HP = act(st, "H_PHONE", { h: 4.8, at: [-2.4, -0.3, 0.6] }).ro(4);
    CN = act(st, "CHAIN", { h: 1.9, anchor: [0.5, 0.5], at: [2.6, 0.6, 1.0] }).ro(5);
  });
  s.update = t => { tint(s.BG, DARK); idle(HP, t); showFrom(CN, t, tL); CN.pop(t, tL, 0.4); };
  const c = app(sc, 180, ["MY + LOAN", ""], `<span class="G">₩</span> + <span class="R">₩</span> = ×2`); pop(c, tL - 0.1);
  const bb = el(`<div class="btn buy a cx" style="left:540px;top:480px">BUY ×2</div>`, sc); pop(bb, W(3, "두 배"));
  tl.fromTo(bb, { boxShadow: "0 0 0 0 rgba(34,199,176,.8)" }, { boxShadow: "0 0 0 28px rgba(34,199,176,0)", duration: 0.7, repeat: 2 }, W(3, "두 배") + 0.2);
  K.cut(E(3) - 0.1, "S-03 LOAN ×2 · BUY ×2");
}
/* S-04 ~ S-09 보기 A·B·C → 3·2·1 → C 0점 FAIL → 다른 항목 모두 10점이어도 FAIL → A 5 · B 10 (문장 4~11) */
{
  const a = until(4), b = until(12), t9 = S(9), t10 = S(10), t11 = S(11);
  const sc = K.scene(a, b);
  let HT, HS, HL;
  const s = ST.set(a, b, st => {
    bgOf(st, "PAPER");
    HT = act(st, "H_THINK", { h: 4.8, at: [-2.6, -0.3, 0.6] }).ro(4);
    HS = act(st, "H_SHOCK", { h: 4.8, at: [-2.6, -0.3, 0.6] }).ro(4);
    HL = act(st, "H_PLAN", { h: 4.8, at: [-2.6, -0.3, 0.6] }).ro(4);
  });
  s.update = t => {
    showFrom(HT, t, a - 1, t9); showFrom(HS, t, t9, t11); showFrom(HL, t, t11);
    HT.rise(t, S(4) + 0.05, 0.5, 4); idle(HT, t); if (t < t10) HS.jitter(t, 0.014); else idle(HS, t); idle(HL, t, 1);
    tint(s.BG, t >= t10 && t < t11 ? DIM : WHITE);
  };
  over(s, sc, () => HT, "?", S(4) + 0.2, E(4) + 0.3);
  const q0 = T(sc, 300, `<span class="Y">A · B · C ?</span>`, 120); pop(q0, S(4) + 0.1); out(q0, S(5) - 0.05);   // 보기 전 위 칸
  over(s, sc, () => HT, "?", S(8) + 0.1, t9 - 0.1);
  const cards = [0, 1, 2].map(k => optCard(sc, k, 160 + k * 180, S(OPTS[k]) + 0.05));
  // 문장 8 — 마음속으로 하나를 고름: 3·2·1 + 카드가 차례로 들썩
  const span = Math.max(1.2, E(8) - S(8));
  ["3", "2", "1"].forEach((d, i) => {
    const n = el(`<div class="cnt a cx ts" style="left:810px;top:760px">${d}</div>`, sc), at = S(8) + i * span / 3;
    tl.fromTo(n, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, at);
    tl.to(n, { opacity: 0, duration: 0.15 }, at + span / 3 - 0.1);
    tl.fromTo(cards[i], { scale: 1 }, { scale: 1.04, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, at);
  });
  // 문장 9 — C 0점 · FAIL
  cards[2].reveal(W(9, "0점"));
  const f1 = stamp(sc, 820, `FAIL ✕`, R, W(9, "과락"), -6); out(f1, t10 - 0.05);
  // 문장 10 — 다른 아홉 항목이 모두 10점이어도: 시험지 9칸 10 · 9번 0 → FAIL
  const sh = el(`<div class="sheet a"></div>`, sc);
  tl.fromTo(sh, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t10);
  el(`<div class="a w9 nw" style="left:44px;top:30px;font-size:64px">TEST</div>`, sh);
  const cells = [];
  for (let i = 0; i < 10; i++) cells.push(el(`<div class="cell" style="left:${24 + i * 88}px;top:150px">${i + 1}</div>`, sh));                    // 10칸 한 줄 — 9번 0점 칸이 도장에 가리지 않게
  const t10a = W(10, "10점"), others = cells.filter((_, i) => i !== 8);
  tl.to(others, { backgroundColor: G, borderColor: G, duration: 0.25, stagger: 0.05 }, t10a - 0.2);
  others.forEach((c2, j) => tl.call(() => { c2.textContent = "10"; }, null, t10a - 0.2 + j * 0.05));
  others.forEach((c2, j) => tl.call(() => { c2.textContent = String(cells.indexOf(c2) + 1); }, null, t10a - 0.21 + j * 0.05));   // 되감기 때 번호로
  tl.to(cells[8], { backgroundColor: R, borderColor: R, color: "#fff", duration: 0.3 }, W(10, "총점") - 0.1);
  tl.call(() => { cells[8].textContent = "0"; }, null, W(10, "총점") - 0.1);
  tl.call(() => { cells[8].textContent = "9"; }, null, W(10, "총점") - 0.11);
  const tot = el(`<div class="a w9 nw" style="right:44px;top:24px;font-size:72px;color:#1B8F80">= 90</div>`, sh);
  pop(tot, W(10, "총점"));
  const strike = el(`<div class="a" style="right:30px;top:62px;width:240px;height:10px;border-radius:5px;background:${R};transform-origin:0 50%"></div>`, sh);
  tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, W(10, "불통과") - 0.2);
  const f2 = stamp(sc, 1030, `FAIL ✕`, R, W(10, "불통과"), -6); out(f2, t11 - 0.05);
  tl.to(sh, { opacity: 0, duration: 0.3 }, t11 - 0.35);
  // 문장 11 — A 5점 · B 10점
  cards[0].reveal(W(11, "A는")); cards[1].reveal(W(11, "B는"));
  tl.to(cards, { x: 120, opacity: 0, duration: 0.35, stagger: 0.05, ease: "power2.in" }, b - 0.45);
  K.cut(E(4) - 0.1, "S-04 어떻게? ?");
  K.cut(E(7) - 0.1, "S-05 보기 A·B·C");
  K.cut(S(8) + span / 3 + 0.1, "S-06 3·2·1");
  K.cut(E(9) - 0.1, "S-07 C 0점 FAIL");
  K.cut(E(10) - 0.15, "S-08 9칸 10점이어도 FAIL");
  K.cut(E(11) - 0.1, "S-09 A 5 · B 10");
}
/* S-10 10월 강제 매도 MARGIN CALL ₩391B (문장 12) */
{
  const a = until(12), b = until(13), tG = W(12, "강제로");
  const sc = K.scene(a, b);
  let GR;
  const s = ST.set(a, b, st => { bgOf(st, "PAPER"); GR = act(st, "GRAB", { h: 3.6, anchor: [0.5, 0.5], at: [0.2, 2.6, 0.6] }).ro(5); });
  s.update = t => { const k = sm(lin(t, tG - 0.3, tG + 0.6)); GR.g.position.x = GR.home.x + 6 * (1 - k); GR.g.position.y = GR.home.y + 2 * (1 - k); GR.op = t < tG - 0.3 ? 0 : 1; };
  if (Puppet.dust) s.part(Puppet.dust(tG + 0.4, [-0.6, 1.4, 0.8], { n: 16, rocks: 6 }));
  stamp(sc, 200, `MARGIN CALL`, R, tG, -4);
  pop(T(sc, 360, `<span class="R">₩391B</span>`, 160), W(12, "3,900억") - 0.1, { from: { scale: 1.3, y: 0 } });
  pop(T(sc, 560, `10/1 – 10/16`, 56, "w7 N"), W(12, "3,900억") + 0.3);
  K.cut(E(12) - 0.1, "S-10 MARGIN CALL ₩391B");
}
/* S-11 왜 이 문제 하나로 불통과? — C 0 = FAIL ? (문장 13) */
{
  const a = until(13), b = until(14);
  const sc = K.scene(a, b);
  let HT, CN;
  const s = ST.set(a, b, st => {
    bgOf(st, "PAPER");
    HT = act(st, "H_THINK", { h: 4.8, at: [-2.4, -0.3, 0.6] }).ro(4);

  over(s, sc, () => HT, "?", S(13) + 0.3);
  const c = el(`<div class="opt" ${DW} style="top:200px;border-color:${R}"><div class="L">C</div><div class="I">${ICONS[2]}</div><div class="T">${optText(OPTS[2])}</div><div class="P" style="opacity:1;background:${R};color:#fff">0</div></div>`, sc);
  pop(c, S(13) + 0.05, { from: { scale: 0.9, y: 0 } });
  pop(T(sc, 430, `<span class="R">FAIL</span> <span class="Y">?</span>`, 150), W(13, "불통과") - 0.2, { from: { scale: 1.4, y: 0 } });
  K.cut(E(13) - 0.1, "S-11 FAIL ?");
}
/* S-12 이유·나머지 9개 항목·통과 기준 → 롱폼 카드 ▶ · 관련 동영상 버튼 ↓ (문장 14 + 끝 화면) */
{
  const a = until(14), b = K.D;
  const sc2 = K.scene(a, b, { keep: true });
  let HL;
  const s = ST.set(a, b, st => { bgOf(st, "PAPER"); HL = act(st, "H_PLAN", { h: 4.8, at: [-2.4, -0.3, 0.6] }).ro(4); }, { fadeOut: 0 });
  s.update = t => { HL.pop(t, S(14) + 0.05, 0.4); idle(HL, t); };
  // 롱폼 카드: 롱폼 썸네일(LONG_THUMB)이 생기면 그 그림, 그 전에는 코드 시험지 (그림이 없는 파일을 부르면 점검이 깨짐)
  const LONG_THUMB = null;   // 롱폼 썸네일이 생기면 "../../../stock/source/simri-test-2026-10/thumbnails/thumbnail_1.jpg"
  const inner = LONG_THUMB ? `<img alt="" src="${LONG_THUMB}">`
    : `<div class="a w9 nw" style="left:40px;top:34px;font-size:64px;color:${WH}">TEST</div>` +
      Array.from({ length: 10 }, (_, i) => `<div class="a w9 c" style="left:${36 + i * 71}px;top:316px;width:64px;height:64px;border-radius:50%;border:5px solid ${i === 8 ? R : "#F2E6CF"};color:${i === 8 ? R : "#F2E6CF"};font-size:36px;line-height:54px">${i + 1}</div>`).join("");   // 10칸 한 줄 — ▶ 아래
  const card = el(`<div class="card a">${inner}<div class="play"><svg viewBox="0 0 60 60" width="70" height="70" aria-hidden="true"><path d="M18 10 L50 30 L18 50 Z" fill="#fff"/></svg></div><div class="prog"><i></i></div></div>`, sc2);
  pop(card, S(14) + 0.05, { from: { scale: 0.85, y: 0 } });
  tl.fromTo(card.querySelector(".prog i"), { width: "0%" }, { width: "100%", duration: K.D - S(14) - 0.2, ease: "none" }, S(14) + 0.2);
  K.related(sc2, { at: S(14) + 0.05, arrowAt: W(14, "아래"), hint: "" });
  K.cut(E(14) - 0.1, "S-12 롱폼 카드 ▶");
  K.cut(K.D - 0.3, "끝 화면 (관련 동영상 버튼 ↓)");
}
K.done();
})();
