[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞여 나오는 무관한 영상(예: 홈쇼핑 방송 사고)을 분석·성공사례에서 제외
# 판정: ① 제목이나 태그에 '강한 관련어'  ② 또는 제목에 '약한 관련어' + (설명란에 강한 관련어 또는 제목에 약한 관련어 2개)
#       ③ 또는 설명란에 강한 관련어가 2번 이상  → 하나라도 만족하면 주제 관련 영상
RELEVANCE_TERMS = [
  "주식", "주가", "증시", "증권", "코스피", "코스닥", "나스닥", "테마주", "급등주", "작전주", "동전주",
  "우량주", "배당주", "리딩방", "반대매매", "빚투", "신용거래", "공매도", "하한가", "상한가", "주가조작",
  "미공개정보", "투자자문", "증권사", "미국주식", "해외주식", "선물옵션", "상장폐지", "상폐", "깡통계좌", "ETF",
]
# 다른 뜻으로도 쓰여서 혼자서는 인정하지 않는 단어
RELEVANCE_WEAK_TERMS = [
  "종목", "개미", "상장", "물타기", "손절", "익절", "매수", "매도", "주주", "레버리지", "인버스",
  "깡통", "투자", "재테크", "노후자금", "퇴직금",
]
# 관련어처럼 보이지만 무관한 표현 — 먼저 지운 뒤 판정 ('주식회사' 때문에 홈쇼핑 영상이 주식 영상으로 잡히는 것 방지)
RELEVANCE_EXCLUDE = ["주식회사", "(주)", "㈜"]

[ads]
# 📢 광고(유료 홍보)로 조회수를 산 것으로 의심되는 영상 제외 — 조회수는 많은데 좋아요·댓글이 거의 없음 (두 조건 모두 만족 시)
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025       # 좋아요/조회수 < 0.25%  (2026-10 주식 데이터 중앙값 ≈ 1%)
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005   # 댓글/조회수 < 0.05/1,000 (중앙값 ≈ 1.2/1,000)

[advanced]
# (선택) 기본값을 바꾸고 싶을 때만 '#'을 지우고 값을 고치세요. 표시된 값이 현재 코드 기본값입니다.
# ANALYSIS_DAYS = 365               # 성과 분석 대상: 최근 N일 내 업로드
# QUOTA_BUDGET = 9000               # 이번 실행에서 쓸 최대 쿼터 (일일 한도 10,000) ⚠️ 비용 관련
# MAX_SEARCH_KEYWORDS = 150         # 한 번에 검색할 최대 키워드 수 (실제 개수는 쿼터 예산이 결정)
# SEARCH_ORDERS = ["relevance"]     # "viewCount" 추가 시 키워드당 비용 2배
# OUTLIER_MIN = 3.0                 # 채널 중앙값 대비 N배 이상 → 성공(아웃라이어)
# MIN_SUCCESS_VIEWS = 10000         # 성공으로 인정할 최소 조회수
# SMALL_CHANNEL_MAX_SUBS = 10000    # 소규모 채널 기준
# SUCCESS_CASE_COUNT = 8            # 저장할 성공사례 수 ⚠️
# DOWNLOAD_VIDEOS = true            # 성공사례 영상 파일 다운로드 ⚠️
# FETCH_COMMENTS_TOP_N = 30         # 시청자 질문 분석용 댓글 수집 영상 수
# SEARCH_CACHE_TTL_HOURS = 168      # 검색 결과 캐시 (다음 날 이어서 수집)
# LOG_LEVEL = "INFO"                # DEBUG / INFO / WARNING
