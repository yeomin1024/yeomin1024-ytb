:"선택 1","text":"물론 남들이 다 좋다고 하면, 그만한 이유가 있어 보입니다.","start":81.282,"end":84.925},{"n":20,"part":"선택 1","text":"하지만 모두가 좋다고 말할 때는, 이미 많이 오른 뒤인 경우가 많습니다.","start":85.375,"end":89.773},{"n":21,"part":"선택 1","text":"이 종목도 1년 만에 3배 오른 뒤였으니, 그만큼 크게 떨어질 위험까지 함께 산 셈이죠.","start":90.223,"end":95.527},{"n":22,"part":"선택 1","text":"그래서 옳은 선택은 남을 따라 사지 않는 것입니다.","start":95.977,"end":98.917},{"n":23,"part":"선택 2","text":"같은 날, 당신에게는 고민이 하나 더 있습니다.","start":99.917,"end":102.805},{"n":24,"part":"선택 2","text":"1억 원 가운데 얼마를 넣을지인데요.","start":103.255,"end":105.44},{"n":25,"part":"선택 2","text":"주변에선 현금으로 두면 손해라며, 있는 돈을 모두 넣었다는 사람이 많습니다.","start":105.89,"end":110.741},{"n":26,"part":"선택 2","text":"여기서 당신은 급할 때 쓸 현금은 남겨 두고, 나머지만 투자하시겠습니까?","start":111.191,"end":115.74},{"n":27,"part":"선택 2","text":"아니면 1억 원을 모두 투자하시겠습니까?","start":116.19,"end":118.677},{"n":28,"part":"선택 2","text":"이때는 급할 때 쓸 현금을 남겨 두는 것이 옳은 선택입니다.","start":119.127,"end":122.52},{"n":29,"part":"선택 2","text":"그날은 2023년 8월 1일로, 석 달도 안 돼 S&P 500 지수가 10% 빠졌습니다.","start":122.97,"end":128.727},{"n":30,"part":"선택 2","text":"김씨와 같이 모두 투자했다면, 지수에 넣었더라도 10% 가까이 손실을 봤을 것입니다.","start":129.177,"end":134.783},{"n":31,"part":"선택 2","text":"그때 갑자기 큰돈이 필요했다면, 떨어진 값에 주식을 팔아야 했을 겁니다.","start":135.233,"end":139.782},{"n":32,"part":"선택 2","text":"물론 현금으로 남긴 돈은, 오르는 동안 이자밖에 벌지 못합니다.","start":140.232,"end":144.177},{"n":33,"part":"선택 2","text":"하지만 일자리나 집 문제 같은 최악의 상황은, 하필 시장이 나쁠 때 함께 오기도 합니다.","start":144.627,"end":149.931},{"n":34,"part":"선택 2","text":"현금을 남겨 두면, 그때도 주식을 팔지 않고 버틸 수 있습니다.","start":150.381,"end":154.175},{"n":35,"part":"선택 2","text":"그래서 옳은 선택은 최악의 상황에 대비해, 현금을 남겨 두는 것입니다.","start":154.625,"end":159.023},{"n":36,"part":"선택 3","text":"1년 반쯤 뒤, 관세 걱정에 S&P 500 지수가 고점보다 10% 넘게 하락했는데요.","start":160.023,"end":165.478},{"n":37,"part":"선택 3","text":"뉴스는 더 떨어진다는 말과 지금이 바닥이라는 말로 엇갈립니다.","start":165.928,"end":169.774},{"n":38,"part":"선택 3","text":"커뮤니티에는 손실 인증 글이 가득합니다.","start":170.224,"end":172.711},{"n":39,"part":"선택 3","text":"여기서 당신은 그때그때 뉴스와 분위기를 보고, 사고팔지를 정하시겠습니까?","start":173.161,"end":178.012},{"n":40,"part":"선택 3","text":"아니면 기준대로 비중을 줄이고, 일정 비율로 떨어질 때마다 나눠서 다시 매수하시겠습니까?","start":178.462,"end":184.219},{"n":41,"part":"선택 3","text":"이때는 비중을 줄이고 떨어질 때마다 나눠 다시 매수하는 것이 옳은 선택입니다.","start":184.669,"end":189.421},{"n":42,"part":"선택 3","text":"그날은 2025년 3월 13일, S&P 500이 고점보다 10% 하락한 날이었습니다.","start":189.871,"end":195.779},{"n":43,"part":"선택 3","text":"김씨와 같이 분위기만 보다가, 4월 8일 가장 낮을 때 모두 매도했다면 어땠을까요?","start":196.229,"end":201.382},{"n":44,"part":"선택 3","text":"80일 뒤 최고가를 되찾고서야 다시 샀다면, 지금까지 16% 오르는 데 그쳤을 것입니다.","start":201.832,"end":207.74},{"n":45,"part":"선택 3","text":"기준의 수치는 사람마다 다를 수 있습니다.","start":208.19,"end":210.677},{"n":46,"part":"선택 3","text":"예를 들어 그날 절반을 팔고, 5% 떨어질 때마다 3분의 1씩 다시 산다고 하겠습니다.","start":211.127,"end":216.733},{"n":47,"part":"선택 3","text":"그러면 판 값보다 5%, 10% 떨어진 4월 4일에 3분의 2를 다시 사게 됩니다.","start":217.183,"end":222.638},{"n":48,"part":"선택 3","text":"남은 3분의 1은, 지수가 최고가를 되찾은 날 사는 거죠.","start":223.088,"end":226.58},{"n":49,"part":"선택 3","text":"이 기준대로 했다면, 그날부터 지금까지 46% 올랐을 것입니다.","start":227.03,"end":231.579},{"n":50,"part":"선택 3","text":"물론 기준대로 해도, 하락이 어디서 멈출지는 미리 알 수 없습니다.","start":232.029,"end":236.125},{"n":51,"part":"선택 3","text":"하지만 미리 기준을 정해 두면, 무서운 순간에도 같은 판단을 할 수 있습니다.","start":236.575,"end":241.275},{"n":52,"part":"선택 3","text":"그래서 옳은 선택은 위험할 때 비중을 줄이고, 떨어질 때마다 나눠 다시 사는 것입니다.","start":241.725,"end":247.029},{"n":53,"part":"선택 4","text":"석 달쯤 뒤, 당신은 지인 추천으로 계좌의 절반을 한 AI 관련 종목에 넣었는데요.","start":248.029,"end":253.333},{"n":54,"part":"선택 4","text":"한 달여 뒤, 그 회사는 예상보다 훨씬 적은 매출을 발표하고 실적 전망도 거둬들였습니다.","start":253.783,"end":259.238},{"n":55,"part":"선택 4","text":"회사의 기본 체력, 즉 펀더멘탈에 문제가 생긴 겁니다.","start":259.688,"end":263.029},{"n":56,"part":"선택 4","text":"주가는 하루 만에 25% 넘게 하락했습니다.","start":263.479,"end":266.57},{"n":57,"part":"선택 4","text":"여기서 당신은 회사의 기본에 문제가 생겼으니, 바로 매도하시겠습니까?","start":267.02,"end":271.569},{"n":58,"part":"선택 4","text":"아니면 원금을 되찾을 때까지 버티시겠습니까?","start":272.019,"end":274.808},{"n":59,"part":"선택 4","text":"이때는 회사에 문제가 생긴 그날 바로 매도하는 것이 옳은 선택입니다.","start":275.258,"end":279.406},{"n":60,"part":"선택 4","text":"그날은 2025년 8월 11일, 그 종목은 기업용 AI 프로그램을 파는 C3.ai였습니다.","start":279.856,"end":286.368},{"n":61,"part":"선택 4","text":"김씨와 같이 버텼다면, 53% 더 하락해서 지금까지도 그날보다 25% 아래일 것입니다.","start":286.818,"end":293.33},{"n":62,"part":"선택 4","text":"바로 매도했다면, 그 뒤의 53% 하락을 고스란히 피할 수 있었을 겁니다.","start":293.78,"end":298.782},{"n":63,"part":"선택 4","text":"물론 하루 만에 25% 넘게 떨어졌는데 팔면, 손실이 그대로 확정돼 아깝게 느껴집니다.","start":299.232,"end":305.14},{"n":64,"part":"선택 4","text":"하지만 내가 산 가격은, 그 종목이 앞으로 오를지와 아무 상관이 없습니다.","start":305.59,"end":310.139},{"n":65,"part":"선택 4","text":"주가를 받쳐 주던 실적이 무너졌다면, 버틸수록 손실은 더 커질 수 있습니다.","start":310.589,"end":315.289},{"n":66,"part":"선택 4","text":"미국 개인 투자자 1만 명의 거래를 살펴본 연구가 있는데요.","start":315.739,"end":319.283},{"n":67,"part":"선택 4","text":"그들이 판 이익 종목이, 버틴 손실 종목보다 다음 1년간 3%포인트 넘게 더 올랐습니다.","start":319.733,"end":325.49},{"n":68,"part":"선택 4","text":"실수를 인정하고 매도하면, 남은 돈으로 다시 시작할 수 있습니다.","start":325.94,"end":330.036},{"n":69,"part":"선택 4","text":"그래서 옳은 선택은 회사의 기본에 문제가 생기면, 바로 손절하는 것입니다.","start":330.486,"end":335.186},{"n":70,"part":"선택 5","text":"두 달 뒤, 양자 컴퓨터 종목들이 연일 사상 최고가를 기록하고 있는데요.","start":336.186,"end":340.584},{"n":71,"part":"선택 5","text":"그 가운데 한 종목은, 1년 만에 7배 넘게 올랐습니다.","start":341.034,"end":344.375},{"n":72,"part":"선택 5","text":"커뮤니티에선 계좌의 절반을 이 종목에 넣었다는 인증 글이 넘쳐 납니다.","start":344.825,"end":349.124},{"n":73,"part":"선택 5","text":"여기서 당신은 계좌의 절반을 이 종목에 넣으시겠습니까?","start":349.574,"end":352.967},{"n":74,"part":"선택 5","text":"아니면 한 종목은 계좌의 10%까지만 넣고, 나머지는 여러 업종에 나눠 두시겠습니까?","start":353.417,"end":359.023},{"n":75,"part":"선택 5","text":"이때는 한 종목은 10%까지만 넣고 나머지는 나눠 두는 것이 옳은 선택입니다.","start":359.473,"end":364.376},{"n":76,"part":"선택 5","text":"그날은 2025년 10월 13일, 그 종목은 양자 컴퓨터를 만드는 아이온큐였습니다.","start":364.826,"end":370.281},{"n":77,"part":"선택 5","text":"김씨와 같이 절반을 넣었다면, 계좌가 한때 36% 줄고 지금까지도 21% 손실일 것입니다.","start":370.731,"end":377.394},{"n":78,"part":"선택 5","text":"10%만 넣었다면, 가장 나쁠 때도 11%만 줄고 지금은 10% 올라 있을 겁니다.","start":377.844,"end":383.601},{"n":79,"part":"선택 5","text":"물론 많이 넣을수록, 그 종목이 오를 때 크게 법니다.","start":384.051,"end":387.241},{"n":80,"part":"선택 5","text":"하지만 그 하나가 틀리면, 계좌의 절반이 함께 무너집니다.","start":387.691,"end":391.334},{"n":81,"part":"선택 5","text":"한 종목의 비중을 미리 정해 두면, 하나가 무너져도 계좌는 버틸 수 있습니다.","start":391.784,"end":396.484},{"n":82,"part":"선택 5","text":"그래서 옳은 선택은 한 종목의 비중을 정해 두고, 여러 종목과 업종에 나눠 두는 것입니다.","start":396.934,"end":402.389},{"n":83,"part":"결과","text":"이 테스트에서 당신은 몇 개를 틀리셨나요?","start":403.389,"end":405.876},{"n":84,"part":"결과","text":"0개 틀렸다면 남의 말이 아니라 자기 기준으로 투자하는 사람으로, 통과입니다.","start":406.326,"end":411.328},{"n":85,"part":"결과","text":"1개나 2개 틀렸다면 알면서도 가끔 남의 말과 욕심에 흔들리는 사람으로, 주의입니다.","start":411.778,"end":417.233},{"n":86,"part":"결과","text":"3개 이상 틀렸다면 김씨처럼 주식 투자로 손실을 볼 확률이 높은 사람으로, 불통과입니다.","start":417.683,"end":423.289},{"n":87,"part":"정리","text":"이 테스트에서 알 수 있듯이, 급할수록 돌아가라는 말처럼 욕심을 버리고 천천히 오래가는 쪽이 주식으로 부자가 될 수 있는 유일한 길이라는 것을 알아두세요.","start":424.289,"end":433.972},{"n":88,"part":"정리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":434.422,"end":436.607},{"n":89,"part":"정리","text":"시청해주셔서 감사합니다.","start":437.057,"end":438.638}],"subs":[[0.3,6.359,"당신이 만약 이 테스트를 통과하지 못한다면,\n김씨처럼 주식 투자로 큰 손실을 볼 확률이 높습니다."],[6.809,11.207,"지난 3년여 동안, S&P 500 지수는 70% 넘게 올랐는데요."],[11.657,17.414,"같은 기간 김씨는 오히려 1억 원 가운데 74%를 잃고,\n2천6백만 원만 남았습니다."],[17.864,21.658,"도대체 김씨에게는 무슨 일이 있었고, 어떤 선택을 했을까요?"],[22.108,26.959,"김씨가 마주했던 다섯 번의 갈림길에서,\n당신이라면 어떻게 할지 골라 보세요."],[27.409,29.292,"틀린 개수만 세어 주시면 됩니다."],[29.742,32.229,"지금부터 당신이 김씨가 되어 보겠습니다."],[33.229,35.716,"당신에게는 모아 둔 돈 1억 원이 있습니다."],[36.166,39.257,"1년 만에 3배가 된 미국의 한 기술주가 화제인데요."],[39.707,44.558,"AI로 대출을 심사하는 회사인데, 올해 들어서만 5배 넘게 올랐습니다."],[45.008,50.614,"큰 투자사가 이 회사 대출을 대량으로 사기로 한 날엔,\n하루 만에 35% 뛰기도 했죠."],[51.064,54.707,"회사 동료도 친구도 이 종목을 샀다며, 수익을 자랑합니다."],[55.157,58.852,"유튜브에도 이 종목이 앞으로 더 오른다는 영상이 쏟아집니다."],[59.302,62.695,"여기서 당신은 남들처럼 이 기술주를 매수하시겠습니까?"],[63.145,65.783,"아니면   const c = optCard(sc, n, ITEM[n].right, "ROW1", a + 0.2);

}
