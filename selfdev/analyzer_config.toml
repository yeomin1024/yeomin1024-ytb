# =====================================================================================================
# YouTube 주제 분석기 설정 파일 — 주제: 자기계발 (selfdev)
# VERSION: v1.0 — 2026-10-09 — 최초 작성: YouTube 자동완성으로 검색 수요를 확인한 검색어 48개
#
# ✏️ 이 파일만 고치면 됩니다 (코드 수정 불필요). 형식은 stock/analyzer_config.toml 과 같습니다.
# ▶ 실행:  python youtube_topic_analyzer.py --config selfdev/analyzer_config.toml
#          Windows 실행기: .\run_analyzer.ps1 -Folder selfdev
# ▶ 여기 없는 설정은 youtube_topic_analyzer.py 위쪽 [설정 2]의 기본값을 씁니다.
#
# 📝 이 주제에서 검색어를 고른 기준
#   자기계발은 '실패·사기·중독' 같은 사연형 검색이 거의 없다 (자동완성: '자기계발 실패' 3개, '자기계발 사기' 0개, '미라클모닝 실패' 0개).
#   → 사람들이 실제로 찾는 '고민 → 극복' 검색어(무기력·번아웃·미루는 습관·도파민 중독)를 중심으로 골랐다.
#   '자기계발'·'동기부여' 단독 검색은 브이로그·노래·플레이리스트가 대부분이라 넣지 않았다.
# =====================================================================================================

[topic]
TOPIC = "자기계발"                    # 분석 주제 (관련어가 비었을 때의 기본 관련어, 자동완성 씨앗)
PROJECT_FOLDER = "selfdev"              # 결과 폴더 → PC: output/selfdev/result/, GitHub: selfdev/result/
RESULT_FOLDER = "result"

[github]
GITHUB_REPO = "yeomin1024/yeomin1024-ytb"
GITHUB_BRANCH = "main"

[search]
REGION_CODE = "KR"
LANGUAGE = "ko"

[keywords]
# "curated" = 아래 KEYWORD_GROUPS만 검색. 이 주제는 단독 주제어의 자동완성에 무관한 것(채널·노래·게임)이 많아 curated로 둔다.
# "both"로 바꾸면 자동완성 상위 AUTOCOMPLETE_TOP_N개를 더 검색한다 → 그때는 EXCLUDE_KEYWORDS가 걸러 준다.
KEYWORD_MODE = "curated"
EXTRA_KEYWORDS = []
EXCLUDE_KEYWORDS = [
  "노래", "플리", "플레이리스트", "팝송", "음악", "복면가왕", "시간관리자", "시간관리국",
]   # (autocomplete/both 모드) 자동완성에서 뺄 단어 — 2026-10-09 자동완성에서 확인한 무관한 것
AUTOCOMPLETE_TOP_N = 10

# 🔎 카테고리별 검색어 6개 × 8개 = 48개. 모두 2026-10-09 YouTube 자동완성에 나온 표현이거나, 입력하면 자동완성이 이어지는(검색 수요가 있는) 검색어다.
# 💡 키워드 1개 = 검색 1회(100유닛). 하루 한도를 넘으면 다음 날 실행 때 이어서 수집한다 (검색 결과 7일 캐시).
[KEYWORD_GROUPS]
"1. 무기력·번아웃 (고민)" = [
  "무기력 극복", "무기력 극복 방법", "번아웃 극복 방법", "번아웃 증상",
  "번아웃 퇴사", "게으름 극복 방법", "게으름 무기력 극복", "의지력이 약한 사람",
]
"2. 미루기·작심삼일·습관" = [
  "미루는 습관 고치기", "미루는 습관 극복", "미루는 습관 완벽주의", "작심삼일 극복",
  "나쁜 습관 고치는 방법", "좋은 습관 만들기", "독서 습관 만들기", "공부 습관 만들기",
]
"3. 스마트폰·도파민 중독" = [
  "스마트폰 중독 치료", "스마트폰 중독 뇌", "도파민 중독 증상", "도파민 중독 끊는법",
  "도파민 중독 치료", "도파민 디톡스 방법", "도파민 디톡스 후기", "도파민 디톡스 효과",
]
"4. 루틴·갓생 (실천과 현실)" = [
  "미라클모닝 부작용", "미라클모닝 방법", "갓생 현실", "갓생 사는 법",
  "아침 루틴 만들기", "하루 루틴 만들기", "직장인 자기계발 루틴", "시간관리 잘하는법",
]
"5. 나이대·직장인 고민" = [
  "30대 직장인 자기계발", "30대 후반 자기계발", "40대 여자 자기계발", "직장인 자기계발 추천",
  "직장인 공부 습관", "40대 인생 조언", "40대 인생설계", "40대 인생이 바뀌는 공부",
]
"6. 자존감·의지·성공 습관" = [
  "자존감 높이는 법", "자존감 떨어질때", "열등감 극복 방법", "의지력 키우는 방법",
  "목표 달성 실패 경험", "성공한 사람들의 7가지 습관", "성공한 사람들의 아침 습관", "인생 바꾸는 습관",
]

[relevance]
# 🎯 주제 관련성 필터 — 검색 결과에 섞인 무관한 영상을 분석·성공사례에서 뺀다 (글자가 '포함'되면 맞는 것으로 봄)
# 판정: ① 제목·태그에 강한 관련어  ② 제목에 약한 관련어 + (설명란 강한 관련어 또는 제목 약한 관련어 2개)  ③ 설명란에 강한 관련어 2번 이상
RELEVANCE_TERMS = [
  "자기계발", "자기개발", "자기관리", "미라클모닝", "갓생", "동기부여", "무기력", "번아웃",
  "작심삼일", "미루는 습관", "게으름", "의지력", "자존감", "열등감", "시간관리", "목표 달성",
  "습관 만들기", "습관 고치", "루틴 만들기", "도파민 중독", "도파민 디톡스", "스마트폰 중독", "자기계발서", "인생 조언",
  "인생설계",
]
# 약한 관련어 (혼자서는 인정 안 함) — '도파민'은 예능 자막 유행어('도파민 터지는')라 혼자서는 인정하지 않는다. '습관'·'루틴'은 피부·운동·다이어트에도 쓰인다.
RELEVANCE_WEAK_TERMS = [
  "습관", "루틴", "도파민", "성공", "인생", "독서", "공부", "중독", "후회", "집중력",
  "목표", "직장인", "멘탈", "마인드",
]
# 관련어를 품고 있지만 무관한 표현 — 판정 전에 지운다
RELEVANCE_EXCLUDE = [
  "스킨케어 루틴", "메이크업 루틴", "식습관", "골프 루틴", "갤럭시 루틴", "도파민 터지는", "도파민 폭발",
]

[ads]
# 📢 광고로 조회수를 산 것으로 의심되는 영상 제외 (조회수 많은데 좋아요·댓글이 거의 없음). 값은 주식 데이터 기준 — 강의·클래스 판매 영상이 많다. 첫 실행 뒤 리포트의 좋아요율·댓글률 중앙값을 보고 기준을 조정한다.
AD_SUSPECT_FILTER = true
AD_SUSPECT_MIN_VIEWS = 50000
AD_SUSPECT_MAX_LIKE_RATE = 0.0025
AD_SUSPECT_MAX_COMMENT_RATE = 0.00005

[advanced]
# (선택) 기본값을 바꿀 때만 '#'을 지우고 고친다. 전체 목록은 stock/analyzer_config.toml [advanced] 참고
# ANALYSIS_DAYS = 365
# QUOTA_BUDGET = 9000
