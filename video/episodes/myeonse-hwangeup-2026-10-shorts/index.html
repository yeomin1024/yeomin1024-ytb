  const sc = K.scene(a, b);
  let RG, Y1, KI, Y2;
  const s1 = ST.set(a, sw, st => { bgOf(st, "STORE"); RG = act(st, "REG", { h: 3.0, at: [2.0, 0, 0] }).ro(2); Y1 = act(st, "YOU_P", { h: 4.0, at: [-2.6, 0, 0.6] }).ro(4); }, { fadeOut: 0.3 });
  s1.update = t => idle(Y1, t);
  const s2 = ST.set(sw, b, st => { bgOf(st, "AIR"); KI = act(st, "KIOSK", { h: 4.2, at: [1.8, 0, 0] }).ro(2); Y2 = act(st, "YOU_W", { h: 4.2, at: [-0.6, 0, 0.6] }).ro(4); }, { fadeIn: 0.3 });
  s2.update = t => walk(Y2, t, sw, sw + 1.2, -6);
  pop(head(sc, 300, "차이는", "쇼핑할 때", Y, 96), S(8) + 0.05);
  pop(el(`<div class="a cx c w9 nw" style="left:540px;top:530px;font-size:72px">+ 공항 도착 <span class="Y">첫 1분</span></div>`, sc), sw + 0.1);
  K.cut(E(8) - 0.1, "쇼핑할 때 + 첫 1분");
}
/* S-09 그 방법은 아래 영상에서 → 관련 동영상 버튼 (문장 9) */
{
  const a = until(9), b = K.D;
  const sc = K.scene(a, b, { keep: true });
  let KI, YOU;
  const s = ST.set(a, b, st => { bgOf(st, "AIR"); KI = act(st, "KIOSK", { h: 4.2, at: [1.8, 0, 0] }).ro(2); YOU = act(st, "YOU_P", { h: 4.2, at: [-0.4, 0, 0.6] }).ro(4); }, { fadeOut: 0 });
  s.update = t => idle(YOU, t);
  signal(s, sc, () => KI, true, S(9) + 0.3);
  pop(el(`<div class="a cx c w9 nw" style="left:540px;top:200px;font-size:76px">가장 빠르게 <span class="Y">면세 받는 방법</span></div>`, sc), S(9) + 0.05);
  K.related(sc, { at: S(9) + 0.05, arrowAt: W(9, "아래") });
  K.cut(E(9) - 0.1, "그 방법은 아래 영상 · 관련 동영상 ↓");
  K.cut(K.D - 0.3, "끝 화면 (관련 동영상 버튼 ↓)");
}
K.done();
})();
