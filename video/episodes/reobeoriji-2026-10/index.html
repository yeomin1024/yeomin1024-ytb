// 실제 ETF (s96~s102): QQQ·QLD·TQQQ 실제 총수익으로 2010-03 부터 매달 $500
// =====================================================================================================================
{
  const a = PS("실제 ETF"), b = PE("실제 ETF"), RD_ = LV.real_daily, RE = LV.real, RS = LV.real_sim;
  const n = RD_.dates.length, ys = []; let p0 = RD_.dates[0].slice(0, 4);
  RD_.dates.forEach((d, i) => { if (d.slice(0, 4) !== p0) { p0 = d.slice(0, 4); ys.push([i, p0]); } });
  const ch = new R2.Chart({ x: 200, y: 220, w: 1100, h: 660, n, years: ys, yearGap: 120, mode: "log", min: 300, max: 10000000,
    series: [{ vals: RD_.x1, color: C1, width: 6 }, { vals: RD_.x2, color: C2, width: 6 }, { vals: RD_.x3, color: C3, width: 7 }, { vals: LV.real_sim3, color: "rgba(255,138,61,.55)", width: 4, noHead: true, hidden: true }],
    baselines: [{ v: i => RD_.paid[i], color: YE, dash: [18, 12], width: 4, step: 2 }] });
  const t97 = S("TQQQ가 생긴 다음 달"), t99 = W("QQQ 62만", "QQQ"), tS = S("같은 기간 계산한 3배는");
  const pace = R2.warp([[t97, 0], [t99, n - 1]], "실제 ETF", 600);
  add(a - 0.1, b + 0.5, t => {
    const al = clamp((t - a + 0.1) / 0.35, 0, 1) * clamp((b + 0.5 - t) / 0.35, 0, 1);
    ch.series[3].hidden = t < tS;
    ctx.save(); ctx.globalAlpha = al;
    if (t >= t97 - 0.3) ch.draw(ctx, pace(t));
    ctx.restore();
    const tp = [W("QQQ 62만", "QQQ"), W("QQQ 62만", "QLD"), W("TQQQ는 528만", "TQQQ는")];
    [1, 2, 3].forEach((L, j) => { if (t >= tp[j] - 0.2) R2.pin(ctx, ch.X(n - 1), ch.Y(RD_["x" + L][n - 1]), money(RE["x" + L]), COL[L], al * clamp((t - tp[j] + 0.2) / 0.3, 0, 1), L !== 1, 38, [60, 1320]); });
    if (t >= tS) R2.pin(ctx, ch.X(n - 1), ch.Y(LV.real_sim3[n - 1]), money(RS.x3), "rgba(255,138,61,.8)", al * clamp((t - tS) / 0.3, 0, 1), false, 34, [60, 1320]);
  });
  const sc = K.scene(a - 0.1, b + 0.5);
  const hd = el(`<div class="a row" style="left:60px;top:60px;gap:16px">${TK("QQQ", 48)}${TK("QLD", 48)}${TK("TQQQ", 48)}<span class="big tab" style="font-size:56px;margin-left:20px">2010.03 →</span><span class="row" style="gap:10px;margin-left:20px">${IC.cal(56)}<span class="big tab" style="font-size:56px">$500</span></span></div>`, sc);
  pop(hd, t97);
  const paid = el(`<div class="card2 solid" style="left:1350px;top:240px;width:520px;height:150px;display:flex;align-items:center;justify-content:center;gap:14px">${IC.coin(64)}<span class="big tab" style="font-size:64px;color:#FFE680">${money(RE.paid)}</span></div>`, sc);
  pop(paid, S("넣은 돈은 10만 달러입니다"));
  const dd = el(`<div class="card2 solid" style="left:1350px;top:660px;width:520px;height:200px;display:flex;align-items:center;justify-content:center;gap:16px">${TK("TQQQ", 40)}<span class="big tab" style="font-size:44px">2022</span><span class="big tab" style="font-size:54px;color:#FF6B78">${pc(LV.real_dd2022.x3.dd)}</span></div>`, sc);
  pop(dd, S("실제 TQQQ 계좌도 2022년에"));
  const dd2 = el(`<div class="card2 solid" style="left:1350px;top:440px;width:520px;height:180px;display:flex;align-items:center;justify-content:center;gap:16px">${TK("QLD", 40)}<span class="big tab" style="font-size:44px">2022</span><span class="big tab" style="font-size:54px;color:#FF6B78">${pc(LV.real_dd2022.x2.dd)}</span></div>`, sc);
  pop(dd2, S("실제 QLD 계좌는"));
  cut(W("TQQQ는 528만", "528만") + 0.8, "실제 ETF — 끝 값");
  cut(b - 0.2, "실제 ETF — 계산값 · 2022");
}

// =====================================================================================================================
// 정리 (s103~s109)
// =====================================================================================================================
{
  const a = PS("정리"), b = PS("한계"), RO = LV.rolling, LP = LV.lump;
  const sc = K.scene(a - 0.2, b - 0.4);
  const c = (x, y, w, h, html, at) => { const n = el(`<div class="card2" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:grid;align-content:center;justify-items:center;gap:22px">${html}</div>`, sc); pop(n, at); return n; };
  c(70, 110, 860, 360, `<span class="row" style="gap:14px">${IC.cal(64)}<span class="big tab" style="font-size:52px">$500 · 1999 →</span></span><span class="row" style="gap:16px">${LX(3, 56)}<span class="big" style="font-size:60px">÷</span>${LX(1, 56)}</span><span class="big tab" style="font-size:100px;color:#FFD400">×${f2(M.x3_over_x1)}</span>`, S("1999년부터 매달 모은 결과"));
  c(990, 110, 860, 360, `${LX(3, 56)}<span class="row" style="gap:20px"><span class="big tab" style="font-size:60px">2001</span><span class="big tab" style="font-size:72px;color:#FF6B78">${pc(F.dot.x3.vs_paid_low)}</span></span><span class="row tw" style="gap:20px"><span class="big tab" style="font-size:60px">2008</span><span class="big tab" style="font-size:72px;color:#FF6B78">${pc(F.gfc.x3.vs_paid_low)}</span></span>`, S("2001년에는 넣은 돈의"));
  c(70, 520, 560, 380, `<span class="row" style="gap:12px">${LX(3, 44)}<span class="big" style="font-size:48px">&gt;</span>${LX(1, 44)}</span><span class="big tab" style="font-size:80px">${F.x3_ahead_since.years_before.toFixed(1)}</span>${IC.cal(64)}`, S("계속 앞서기 시작한 건"));
  c(680, 520, 560, 380, `<span class="row" style="gap:12px">${IC.coin(56)}<span class="big tab" style="font-size:48px">× 1</span></span><span class="big tab" style="font-size:80px;color:#FF6B78">${pcu(LP.x3_over_x1)}</span>`, S("처음에 한 번에 넣었다면, 3배는"));
  c(1290, 520, 560, 380, `<span class="row" style="gap:12px">${IC.cal(56)}<span class="big tab" style="font-size:48px">+10</span></span><span class="big tab" style="font-size:72px;color:#FF6B78">${RO.x3_lt_paid}/${RO.windows}</span>`, S("211개 중 20개는"));
  cut(E("211개 중 20개는") - 0.2, "정리 — 카드 5개");
}
// =====================================================================================================================
// 한계 (s110~s114)
// =====================================================================================================================
{
  const a = PS("한계"), b = PS("마무리");
  const sc = K.scene(a - 0.2, b - 0.4);
  const c = (x, html, at) => { const n = el(`<div class="card2" style="left:${x}px;top:250px;width:400px;height:440px;display:grid;place-items:center;align-content:center;gap:28px">${html}</div>`, sc); pop(n, at); return n; };
  c(90, `${IC.up(130, MI)}<span class="big tab" style="font-size:52px">1999 → 2026</span>`, a);
  c(540, `<span class="row" style="gap:8px">${LX(2, 48)}${LX(3, 48)}</span>${IC.gear(110)}`, S("2배와 3배의 본 실험 값은"));
  c(990, `<span class="row" style="gap:12px">${IC.bank(100)}<span class="big tab" style="font-size:72px;color:#FFD400">%</span></span><span class="big tab" style="font-size:64px;color:#FFD400">0.95%</span>`, S("금리와 보수가 바뀌면"));
  c(1440, `<span class="row" style="gap:6px">${IC.ban(110, IC.receipt)}${IC.ban(110, IC.fx)}</span>`, S("세금과 환율은 넣지 않았어요"));
  cut(S("투자 권유가 아니라") + 1.2, "한계");
}
// =====================================================================================================================
// 마무리
// =====================================================================================================================
{
  const a = PS("마무리");
  const sc = K.scene(a - 0.2, EP.duration + 1, { keep: true });
  pop(el(`<div class="a flexc" style="left:0;width:1920px;top:330px;gap:40px">${IC.chat(220)}<span class="big" style="font-size:200px;color:#FFD400">?</span></div>`, sc), a);
  const end = el(`<div class="a flexc" style="left:0;width:1920px;top:690px;gap:30px">${LX(1, 64)}${LX(2, 64)}${LX(3, 64)}</div>`, sc);
  pop(end, S("시청해주셔서 감사합니다"));
  cut(S("시청해주셔서 감사합니다") + 0.8, "마무리");
}

CUTQ.sort((x, y) => x[0] - y[0]).forEach(([t, n]) => K.cut(t, n));
K.done();
})();
