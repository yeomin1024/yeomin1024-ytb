# 심리 시청자 페르소나 설정 — tools/personas.py 가 읽음 (분석이 끝날 때 저절로 personas.md 를 다시 만듦)
# VERSION: v1.0 — 2026-11-11 — 새로 (사용자 지시 2026-11-11 "…심리 주제로 분석 코드 돌려서 … 페르소나 구성해서 …" → 같은 날 "최근 트렌드도 파악해서
#   페르소나에 반영해야돼"). 주식·역사(stock/history personas.toml)와 같은 꼴 — 묶음(stage) = 보는 사람의 처지 · 처지(state) = 지금 겪는 관계·마음 문제 ·
#   know = 용어 사전 · like/dislike = 칭찬·비판 댓글 갈래. 한국어 댓글만.
#   ⚖️ 묶음 (Claude 판단 — 승인 251개 제목·댓글을 보고): 성공 사례 제목이 '나이 들수록·중년·60부터는 친구'(5070) · '번아웃·고기능 우울증'(직장인) ·
#   '나르 엄마·시댁'(가족) · '연애심리·애착 유형'(연애) 쪽으로 갈림. 우울·불안 치료 중인 사람은 따로 (말할 내용·주의가 다름 — 의료 권유 금지).
#   TREND_DAYS = 28 (personas.py v1.1): 댓글 단 날이 최근 28일 안인 댓글 vs 그 전 — 페르소나 몫·처지·묻는 말이 요즘 어떻게 바뀌는지 (사용자 지시 "최근 트렌드").
#   감사 2026-11-11 (`personas.py psychology audit stage:<키> --n 14` — 무작위 댓글을 Claude 가 읽고 o/x): 5070 12/14 · 가족 11/13 · 내향인 10/13 ·
#   연애 9/12 · 직장인 9/14 (나이만 맞고 직장 단서는 없는 것까지 12/14). 틀린 것 = 남의 나이·일반론·사회 평론('1020이 극우로…').
# ※ 연구·교육용 — 의료·심리 치료 권유가 아니다.

[personas]
VERSION = "v1.0"
RECENT_DAYS = 180
TREND_DAYS = 28
LANGS = ["한국어"]
MIN_SHARE = 0.08
COVER = 0.80
MIN_PERSONAS = 2
MAX_PERSONAS = 6
MIN_N = 30
NEED_SELF = true
