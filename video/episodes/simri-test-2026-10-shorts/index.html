{
  const a = until(3), b = until(5);
  const sc = K.scene(a, b);
  let CR, HT;
  const s = ST.set(a, b, st => {
    bgOf(st, "PAPER");
    CR = act(st, "W_CROWD", { h: 3.7, at: [2.4, -0.3, -0.4] }).ro(3);
    HT = act(st, "H_THINK", { h: 4.8, at: [-2.6, -0.3, 0.6] }).ro(4);
  });
  s.update = t => {
    CR.rise(t, S(3) + 0.05, 0.6, 4);
    const beat = Math.max(0, Math.sin((t - S(3)) * Math.PI * 2.2));       // 모두 같은 박자로 고개를 떨굼 (공통된 행동)
    CR.g.rotation.z = -0.03 * beat; CR.g.position.y = CR.home.y - 0.08 * beat;
    HT.op = t < S(4) - 0.1 ? 0 : 1; HT.rise(t, S(4) - 0.1, 0.5, 4); idle(HT, t);
  };
  const sh = el(`<div class="sheet a"></div>`, sc);
  tl.fromTo(sh, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, S(3) + 0.1);
  el(`<div class="a w9 nw" style="left:44px;top:28px;font-size:64px">TEST</div>`, sh);
  const cells = [];
  for (let i = 0; i < 10; i++) cells.push(el(`<div class="cell" style="left:${42 + (i % 5) * 166}px;top:${120 + Math.floor(i / 5) * 165}px">${i + 1}</div>`, sh));
  tl.fromTo(cells, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.06, duration: 0.3, ease: "back.out(2)" }, S(3) + 0.3);
  // 문장 4 '답을 골라 보세요' — A·B·C
  const abc = el(`<div class="a w9 nw" style="right:44px;top:22px;font-size:68px;letter-spacing:6px"><span style="color:#1B8F80">A</span> <span style="color:#B8871B">B</span> <span style="color:#C2382C">C</span></div>`, sh);
  pop(abc, S(4), { from: { scale: 1.6, y: 0 } });
  over(s, sc, () => HT, "?", S(4) + 0.2);
  tl.to(sh, { opacity: 0, duration: 0.3 }, until(5) - 0.3);
  K.cut(E(3) - 0.1, "S-03 공통된 습관 · TEST 10칸");
  K.cut(E(4) - 0.1, "S-04 답을 골라 보세요 A·B·C");
}

/* S-05 ~ S-14 10문항 몽타주 — 문항마다: 번호 · 진행 점 · 짧은 보기 A·B·C (점수 없음) · 상황 인형 하나 (문장 5~14) */
const LAB = [   // 롱폼 보기(대본 v1.6 항목 1~10)를 줄인 말 — 순서·뜻 그대로, 점수는 숨김
  ["오늘 바로 매수", "회사부터 알아봄", "조금만 매수"],
  ["바로 대화를 끝냄", "회비 내고 들어감", "무료 기간만 들어감"],
  ["지수와 먼저 견줌", "운이 좋았다", "나는 재능이 있다"],
  ["4분의 1에서 절반", "절반 넘게", "4분의 1 미만, 나눠 보유"],
  ["한 달 1~2번 이하", "거의 매일 여러 번", "일주일 1~2번"],
  ["매수만 나눌 생각", "매수·매도 계획 미리", "느낌 오는 날 한 번에"],
  ["현금 비중만 대충", "현금·업종 배분 미리", "오르는 업종에 모두"],
  ["매수 이유 다시 확인", "절반만 매도", "매수 가격까지 보유"],
  ["조금만 빌려서 매수", "내 돈으로만 매수", "내 돈만큼 빌려 2배"],
  ["남은 돈 모두 2배 ETF", "일부만 2배 ETF", "나눠서 다시 시작"],
];
// 문항마다 무대: [배경, [[인형, 높이, x]…], 꼬리표 html, 꼬리표 색, 꼬리표를 붙일 인형 순번, 어둡게]
const SCN = [
  ["OFF", [["W_COL", 4.3, 2.0], ["H_PHONE", 4.6, -2.4]], "+30%", G, 0],
  ["HOME", [["W_SCAM", 4.8, 2.2], ["TRAP", 1.8, -1.6]], "+300%", G, 0],
  ["OFF", [["H_PROUD", 4.8, 0]], "+50%", G, 0],
  ["HOME", [["H_PROUD", 4.8, -2.0], ["BASKET", 2.4, 2.4]], "?", Y, 1],
  ["OFF", [["H_PHONE", 4.8, -0.4]], "BUY · SELL", Y, 0],
  ["HOME", [["H_PHONE", 4.8, -2.0], ["CASH", 2.0, 2.2]], "₩12,000,000", WH, 1],
  ["HOME", [["H_THINK", 4.8, -0.4]], "CASH ₩0", R, 0],
  ["HOME", [["H_SHOCK", 4.8, -0.4]], "−50%", R, 0],
  ["HOME", [["H_PHONE", 4.8, -2.0], ["CHAIN", 1.9, 2.4]], "LOAN ×2", R, 0, true],
  ["HOME", [["H_DESP", 4.0, -0.6]], "2X ETF ▶", G, 0, true],
];
const LET = ["A", "B", "C"], LCOL = ["#1B8F80", "#B8871B", "#C2382C"];
const qa = until(Q0), qb = until(Q0 + 10);
const qsc = K.scene(qa, qb);                    // 몽타주 내내 남는 위 칸 (번호·진행 점)
const badge = el(`<div class="badge a">1</div>`, qsc);
const dots = el(`<div class="dots a">${Array.from({ length: 10 }, () => "<i></i>").join("")}</div>`, qsc);
for (let k = 0; k < 10; k++) {
  const n = Q0 + k, a = until(n), b = until(n + 1);
  tl.call(() => { badge.textContent = String(k + 1); }, null, a + 0.01);
  if (k) tl.call(() => { badge.textContent = String(k); }, null, a);                         // 되감기 때 앞 번호로
  tl.fromTo(badge, { scale: 1.35 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, a + 0.02);
  tl.set(dots.children, { attr: { class: j => (j < k ? "done" : j === k ? "on" : "") } }, a + 0.01);
  const sc = K.scene(a, b);
  const cards = LAB[k].map((txt, i) => el(`<div class="opt" ${DW} style="top:${300 + i * 130}px"><div class="L" style="background:${WH}">${LET[i]}</div><div class="T">${txt}</div></div>`, sc));
  tl.fromTo(cards, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.1, ease: "power3.out" }, S(n) + 0.05);
  const [bg, list, tagHtml, tagCol, tagOn, dark] = SCN[k];
  const A = [];
  const s = ST.set(a, b, st => {
    bgOf(st, bg);
    list.forEach(([key, h, x], i) => { const o = key === "CASH" ? { h, anchor: [0.5, 0.5], at: [x, 1.4, 0.4 + i * 0.3] } : { h, at: [x, -0.3, 0.4 + i * 0.3] };
      A.push(act(st, key, o).ro(3 + i)); });
  });
  s.update = t => {
    if (dark) tint(s.BG, true);
    A.forEach((x, i) => { x.pop(t, S(n) + 0.02 + i * 0.12, 0.35); idle(x, t, i); });
    if (k === 7 && t > S(n) + 0.4) A[0].jitter(t, 0.015);                               // 8번 반값 — 놀라 떪
  };
  overTag(s, sc, () => A[tagOn], tagHtml, tagCol, S(n) + 0.35, tagOn === 0 ? 0.25 : 0.15);
  K.cut(E(n) - 0.1, `S-${String(n).padStart(2, "0")} 문항 ${k + 1}`);
}

/* S-15 하나만 0점이어도 불통과인 문항이 두 개 — 10칸 '?' 가 훑어지고 0 → FAIL ✕ · ×2 (문장 15) */
{
  const a = until(15), b = until(16);
  const sc = K.scene(a, b);
  let HS;
  const s = ST.set(a, b, st => { bgOf(st, "PAPER"); HS = act(st, "H_SHOCK", { h: 4.8, at: [-0.4, -0.3, 0.6] }).ro(4); });
  s.update = t => { HS.pop(t, S(15) + 0.05, 0.35); if (t > W(15, "불통과")) HS.jitter(t, 0.012); else idle(HS, t); };
  const row = [];
  for (let i = 0; i < 10; i++) row.push(el(`<div class="a w9 c" style="left:${55 + i * 98}px;top:180px;width:82px;height:82px;border-radius:50%;border:6px solid ${WH};color:${WH};font-size:46px;line-height:70px">?</div>`, sc));
  tl.fromTo(row, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.04, duration: 0.25 }, S(15) + 0.05);
  row.forEach((c, i) => tl.fromTo(c, { borderColor: WH }, { borderColor: R, duration: 0.12, yoyo: true, repeat: 1, immediateRender: false }, W(15, "두") - 0.6 + i * 0.07));   // 어느 두 문항인지는 숨김
  pop(T(sc, 340, `<span class="R">0</span> → <span class="R">FAIL ✕</span>`, 110), W(15, "불통과") - 0.2, { from: { scale: 1.4, y: 0 } });
  pop(T(sc, 500, `<span class="Y">× 2 ?</span>`, 110), W(15, "두") - 0.1, { from: { scale: 1.4, y: 0 } });
  K.cut(E(15) - 0.1, "S-15 0 → FAIL ✕ × 2 ?");
}
/* S-16 내 점수·통과 기준 → 롱폼 카드 ▶ · 관련 동영상 버튼 ↓ (문장 16 + 끝 화면) */
{
  const a = until(16), b = K.D;
  const sc2 = K.scene(a, b, { keep: true });
  let HL;
  const s = ST.set(a, b, st => { bgOf(st, "PAPER"); HL = act(st, "H_PLAN", { h: 4.8, at: [-2.4, -0.3, 0.6] }).ro(4); }, { fadeOut: 0 });
  s.update = t => { HL.pop(t, S(16) + 0.05, 0.4); idle(HL, t); };
  // 롱폼 카드: 롱폼 썸네일(LONG_THUMB)이 생기면 그 그림, 그 전에는 코드 시험지 (그림이 없는 파일을 부르면 점검이 깨짐)
  const LONG_THUMB = null;   // 롱폼 썸네일이 생기면 "../../../stock/source/simri-test-2026-10/thumbnails/thumbnail_1.jpg"
  const inner = LONG_THUMB ? `<img alt="" src="${LONG_THUMB}">`
    : `<div class="a w9 nw" style="left:40px;top:34px;font-size:64px;color:${WH}">TEST</div>` +
      Array.from({ length: 10 }, (_, i) => `<div class="a w9 c" style="left:${36 + i * 71}px;top:316px;width:64px;height:64px;border-radius:50%;border:5px solid #F2E6CF;color:#F2E6CF;font-size:36px;line-height:54px">${i + 1}</div>`).join("");
  const card = el(`<div class="card a">${inner}<div class="play"><svg viewBox="0 0 60 60" width="56" height="56" aria-hidden="true"><path d="M18 10 L50 30 L18 50 Z" fill="#fff"/></svg></div><div class="prog"><i></i></div></div>`, sc2);
  pop(card, S(16) + 0.05, { from: { scale: 0.85, y: 0 } });
  tl.fromTo(card.querySelector(".prog i"), { width: "0%" }, { width: "100%", duration: K.D - S(16) - 0.2, ease: "none" }, S(16) + 0.2);
  K.related(sc2, { at: S(16) + 0.05, arrowAt: W(16, "아래"), hint: "" });
  K.cut(E(16) - 0.1, "S-16 롱폼 카드 ▶");
  K.cut(K.D - 0.3, "끝 화면 (관련 동영상 버튼 ↓)");
}
K.done();
})();
</script>
