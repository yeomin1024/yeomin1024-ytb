<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"ppalli-test-2026-11","topic":"stock","duration":492.2,"audio":"../../../stock/source/ppalli-test-2026-11/narration.mp3","thumb":null,"synced":"2026-11-03T09:56:30Z","tts":"2026-11-03T09:54:35","script_sha1":"c84a0df46cdb9d6d","sent":[{"n":1,"part":"도입","text":"당신이 만약 이 테스트를 통과하지 못한다면, 김씨처럼 주식 투자로 큰 손실을 볼 확률이 높습니다.","start":0.3,"end":6.168},{"n":2,"part":"도입","text":"지난 3년여 동안, S&P 500 지수는 70% 넘게 올랐는데요.","start":6.548,"end":10.708},{"n":3,"part":"도입","text":"같은 기간 김씨는 오히려 1억 원 가운데 74%를 잃고, 2천6백만 원만 남았습니다.","start":11.088,"end":16.888},{"n":4,"part":"도입","text":"도대체 김씨에게는 무슨 일이 있었고, 어떤 선택을 했을까요?","start":17.268,"end":21.18},{"n":5,"part":"도입","text":"김씨가 마주했던 다섯 번의 갈림길에서, 당신이라면 어떻게 할지 골라 보세요.","start":21.56,"end":26.26},{"n":6,"part":"도입","text":"틀린 개수만 세어 주시면 됩니다.","start":26.64,"end":28.381},{"n":7,"part":"도입","text":"지금부터 당신이 김씨가 되어 보겠습니다.","start":28.761,"end":30.985},{"n":8,"part":"선택 1","text":"당신에게는 모아 둔 돈 1억 원이 있습니다.","start":31.985,"end":34.513},{"n":9,"part":"선택 1","text":"1년 만에 3배가 된 미국의 한 기술주가 화제인데요.","start":34.893,"end":37.999},{"n":10,"part":"선택 1","text":"AI로 대출을 심사하는 회사인데, 올해 들어서만 5배 넘게 올랐습니다.","start":38.379,"end":43.136},{"n":11,"part":"선택 1","text":"큰 투자사가 이 회사 대출을 대량으로 사기로 한 날엔, 하루 만에 35% 뛰기도 했죠.","start":43.516,"end":48.996},{"n":12,"part":"선택 1","text":"회사 동료도 친구도 이 종목을 샀다며, 수익을 자랑합니다.","start":49.376,"end":53.216},{"n":13,"part":"선택 1","text":"유튜브에도 이 종목이 앞으로 더 오른다는 영상이 쏟아집니다.","start":53.596,"end":57.068},{"n":14,"part":"선택 1","text":"여기서 첫 번째 선택입니다.","start":57.448,"end":59.058},{"n":15,"part":"선택 1","text":"A, 남들처럼 이 기술주를 매수합니다.","start":59.438,"end":62.175},{"n":16,"part":"선택 1","text":"B, 이 종목은 매수하지 않습니다.","start":62.555,"end":64.88},{"n":17,"part":"선택 2","text":"같은 날, 당신에게는 고민이 하나 더 있습니다.","start":65.88,"end":68.885},{"n":18,"part":"선택 2","text":"1억 원 가운데 얼마를 넣을지인데요.","start":69.265,"end":71.323},{"n":19,"part":"선택 2","text":"주변에선 현금으로 두면 손해라며, 있는 돈을 모두 넣었다는 사람이 많습니다.","start":71.703,   st.update = t => { enter(HP, t, S(h) + 0.05); idle(HP, t); };
  const cards = ITEM[n].opts.map((_, k) => optCard(sc, n, k, `ROW${k + 1}`, S(h) + 0.05 + 0.15 * k));
  cards.forEach((c, k) => markCard(c, k === ITEM[n].ans, W(h, "정답은") + 0.3));
  if (tags) { const d = box(sc, "DATE", "", LEFT); tags.forEach(([html, at]) => pop(el(html, d), at)); }

}
function vsPanel(sc, slot, k, ok, head, at) {
