둘, 공제받은 돈은 연금으로","text":"하지만 공제받은 300만 원과 불어난 이익은 꺼낼 때 세금을 냅니다.","start":156.14,"end":160.31},{"n":36,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"55세가 넘어 연금으로 받으면 세금이 5.5%에서 3.3%이고, 한꺼번에 찾으면 16.5%예요.","start":160.76,"end":168.1},{"n":37,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"300만 원을 한꺼번에 찾으면 49만 5천 원을 내서, 돌려받은 39만 6천 원보다 많습니다.","start":168.55,"end":175.11},{"n":38,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"70세 전에 연금으로 받으면 16만 5천 원만 내서, 23만 1천 원이 남아요.","start":175.56,"end":180.58},{"n":39,"part":"원칙 둘, 공제받은 돈은 연금으로","text":"한마디로, 공제받은 돈은 연금으로 받아야 이득입니다.","start":181.03,"end":184.39},{"n":40,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"세 번째 원칙은, ISA는 해지하고 다시 열 때마다 비과세 한도가 새로 생긴다는 것입니다.","start":185.39,"end":191.36},{"n":41,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"ISA 이익은 비과세 기준 200만 원까지 세금이 없습니다.","start":191.81,"end":195.48},{"n":42,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"연봉 5,000만 원 이하 같은 서민형은 400만 원까지예요.","start":195.93,"end":199.21},{"n":43,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"넘는 이익에는 9.9%만 붙어서, 예금 이자에 붙는 15.4%보다 낮아요.","start":199.66,"end":205.66},{"n":44,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"두 사람도 첫 ISA 이익 800만 원 중, 200만 원을 넘는 600만 원에만 9.9%를 냈어요.","start":206.11,"end":212.5},{"n":45,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"세금 59만 4천 원을 빼고 손에 쥔 돈은 6,740만 원입니다.","start":212.95,"end":217.19},{"n":46,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"연장하면 비과세 기준 200만 원이 그대로입니다.","start":217.64,"end":220.36},{"n":47,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"3년마다 새로 열면, 세금 없는 바구니가 하나씩 더 생기는 셈이죠.","start":220.81,"end":225.94},{"n":48,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"다만 새 ISA에는 1년에 2,000만 원까지 넣을 수 있어요.","start":226.39,"end":229.95},{"n":49,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"그래서 B 씨는 남은 3,740만 원 중 2,000만 원은 지금, 나머지는 내년에 넣습니다.","start":230.4,"end":235.92},{"n":50,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"반대로 A 씨는 예금 6,740만 원에서 1년 이자가 236만 원 나옵니다.","start":236.37,"end":241.41},{"n":51,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"여기서 해마다 약 36만 원을 세금으로 냅니다.","start":241.86,"end":244.93},{"n":52,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"연장해서 계속 굴리는 게 낫다고 생각하시는 분도 계실 거예요.","start":245.38,"end":248.57},{"n":53,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"이 예에서는 연장만 할 때보다 B 씨가 3년 동안 세금이 약 57만 원 적어요.","start":249.02,"end":253.99},{"n":54,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"한마디로, ISA는 3년마다 새로 열고, 만기 돈은 예금에 두지 않습니다.","start":254.44,"end":259.72},{"n":55,"part":"원칙 셋, ISA는 다시 열면 한도가 새로","text":"그럼 이 세 가지 원칙으로 만기 때 할 일을 순서대로 정해 보겠습니다.","start":260.17,"end":263.99},{"n":56,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"1단계, 만기 한 달 전에 연금저축 계좌부터 확인합니다.","start":264.99,"end":268.51},{"n":57,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"이미 연금을 받기 시작한 계좌에는 돈을 더 넣을 수 없습니다.","start":268.96,"end":272.29},{"n":58,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"계좌가 없으면 새로 만들어도 되지만, 연금으로 받으려면 만든 지 5년이 지나야 합니다.","start":272.74,"end":277.9},{"n":59,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"2단계, 만기 뒤 60일 안에 3,000만 원을 연금저축으로 옮깁니다.","start":278.35,"end":282.91},{"n":60,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"1년 1,800만 원인 연금계좌 납입 기준과 따로라서, 한 번에 넣을 수 있어요.","start":283.36,"end":288.48},{"n":61,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"3단계, 같은 때 ISA를 새로 만들어 2,000만 원을 넣습니다.","start":288.93,"end":293.41},{"n":62,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"다음 해 연말정산에서 공제도 꼭 확인하세요.","start":293.86,"end":296.6},{"n":63,"part":"만기 때 할 일, 확인 → 연금저축 → 새 ISA","text":"이렇게 한 두 사람의 결과는 얼마나 달라졌을까요?","start":297.05,"end":299.83},{"n":64,"part":"두 사람의 결과","text":"3년 뒤 다음 만기까지 따져 보면, A 씨의 세금은 약 172만 원, B 씨는 약 76만 원입니다.","start":300.83,"end":308.17},{"n":65,"part":"두 사람의 결과","text":"두 사람 모두 첫 ISA에서 낸 59만 4천 원이 들어 있어요.","start":308.62,"end":312.78},{"n":66,"part":"두 사람의 결과","text":"A 씨는 여기에 3년 동안 예금 이자 세금 112만 원을 더 냈습니다.","start":313.23,"end":317.22},{"n":67,"part":"두 사람의 결과","text":"B 씨는 이 세금을 거의 내지 않았고, 공제로 39만 6천 원을 돌려받았어요.","start":317.67,"end":322.89},{"n":68,"part":"두 사람의 결과","text":"B 씨가 새 ISA와 연금저축에서 나중에 낼 세금 약 53만 원까지 넣은 숫자입니다.","start":323.34,"end":328.94},{"n":69,"part":"두 사람의 결과","
