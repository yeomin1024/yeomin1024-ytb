  const tag = later(`<div class="ttl" ${KO}><i style="background:${YL};box-shadow:0 0 14px ${YL}"></i>폭락 뒤 하루 3% 넘게 오른 날</div>`, cd);
  pop(tag, S(6) + 0.2);
  K.cut(E(6) - 0.1, "6 반등 20번");
}
// 7~8 — 대가의 기준: 반등 10% → 평단 −20%마다 직전의 1.5배 → 팔지 않음
{

}
// 9 — 진짜 반등 2025-04: 개미 · 대가 실시간 수익률
{

}
// 10~12 — 가짜 반등 2020-03: 25% 더 하락 → 개미 물타기·바닥 다음 날 SELL · 대가 평단 −20% 에서 한 번 더
{

  head(sc, "대가 · 더 싸게 한 번 더", `1년 뒤 ${pct(KEY.fake.master_ret)}`, TL, S(12) + 0.05);
  const cd = card(sc, CARD, a + 0.1);
  const c = chart(cd, { key, a, b, box: CARD, players: ["ant", "mas"], marks: true, avg: true });

  c.keys.push([a, 0], [W(10, "가짜"), c.preN - 1], [W(10, "가짜") + 0.5, c.preN], [E(10) - 0.1, bot], [S(11) + 0.1, bot], [E(11) - 0.4, c.sellI + 1], [S(12) + 0.2, c.sellI + 1], [E(12) - 0.2, c.n - 1]);
  c.zoom.push([S(12) + 0.1, bot + 12], [S(12) + 1.3, c.n - 1]);
  K.cut(E(10) - 0.15, "10 가짜 반등 바닥"); K.cut(E(11) - 0.2, "11 개미 SELL"); K.cut(E(12) - 0.1, "12 대가 1년 뒤");
}
// 13 — 반등 20번 · 1년 안에 가장 크게 줄어든 폭 (원금 −20% 아래 = 빨간 띠): 개미 · 대가
{
  const a = BEGIN(13), b = END(13);
  photo("BG-RESULT", a, b);
  const sc = scene(a, b);
  head(sc, "원금이 20% 넘게 줄어든 적", `개미 ${SUM.ant.loss20}번 · 대가 ${SUM.master.loss20}번`, "#F4F6FA", S(13) + 0.05);
  const cd = card(sc, WIDE, a + 0.1);
  const [, , w, h] = WIDE, X0 = 160, X1 = w - 40, Y0 = 130, Y1 = h - 80, VMIN = -30;
  const ys = v => Y0 + (v / VMIN) * (Y1 - Y0);
  const xs = i => X0 + (i + 0.5) / EV.length * (X1 - X0);
  const svg = K.el(`<svg class="a" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="left:0;top:0" aria-hidden="true">
    <rect x="${X0 - 10}" y="${ys(-20)}" width="${X1 - X0 + 20}" height="${ys(VMIN) - ys(-20) + 14}" rx="14" fill="${RD}" opacity=".13"/>
    <line x1="${X0 - 10}" x2="${X1 + 10}" y1="${ys(-20)}" y2="${ys(-20)}" stroke="${RD}" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="${X0 - 22}" y="${ys(-20) + 12}" text-anchor="end" font-family="Noto Sans KR" font-weight="900" font-size="36" fill="${RD}">−20%</text>
    <line x1="${X0 - 10}" x2="${X1 + 10}" y1="${ys(0)}" y2="${ys(0)}" stroke="#EEF1F6" stroke-opacity=".4" stroke-width="3"/>
    <text x="${X0 - 22}" y="${ys(0) + 12}" text-anchor="end" font-family="Noto Sans KR" font-weight="900" font-size="36" fill="#9AA6BF">0%</text>
    ${EV.map((e, i) => `<g class="p${i}" opacity="0">
      <line x1="${xs(i) - 9}" x2="${xs(i) - 9}" y1="${ys(0)}" y2="${ys(Math.max(VMIN, e[2]))}" stroke="${ANT}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${xs(i) - 9}" cy="${ys(Math.max(VMIN, e[2]))}" r="9" fill="${e[2] < -20 ? RD : ANT}" stroke="#0B0F1A" stroke-width="3"/>
      <line x1="${xs(i) + 9}" x2="${xs(i) + 9}" y1="${ys(0)}" y2="${ys(Math.max(VMIN, e[4]))}" stroke="${MAS}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${xs(i) + 9}" cy="${ys(Math.max(VMIN, e[4]))}" r="9" fill="${MAS}" stroke="#0B0F1A" stroke-width="3"/></g>`).join("")}
    ${[["2000", 0], ["2008", EV.findIndex(e => e[0] >= "2008")], ["2020", EV.findIndex(e => e[0] >= "2020")]].map(([y_, i]) => `<text x="${xs(i)}" y="${h - 26}" text-anchor="middle" font-family="Noto Sans KR" font-weight="700" font-size="36" fill="#9AA6BF">${y_}</text>`).join("")}
  </svg>`, cd);
  K.el(`<div class="ttl" ${KO} style="gap:30px"><span style="display:flex;align-items:center;gap:12px"><i style="background:${ANT}"></i>개미</span><span style="display:flex;align-items:center;gap:12px"><i style="background:${MAS}"></i>대가</span><span style="color:#9AA6BF;font-weight:500;font-size:36px">1년 안에 가장 크게 줄어든 폭</span></div>`, cd);
  const t0 = S(13) + 0.2, t1 = W(13, "개미") - 0.1;
  EV.forEach((_, i) => tl.fromTo(svg.querySelector(".p" + i), { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t0 + (t1 - t0) * i / EV.length));
  K.cut(E(13) - 0.1, "13 20% 넘게 줄어든 적");
}
