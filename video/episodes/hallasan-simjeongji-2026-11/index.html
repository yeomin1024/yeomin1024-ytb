<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"hallasan-simjeongji-2026-11","topic":"crisis","duration":494.13,"audio":"../../../crisis/source/hallasan-simjeongji-2026-11/narration.mp3","thumb":null,"synced":"2026-11-25T08:13:11Z","tts":"2026-11-25T07:17:23","script_sha1":"85691fe4732ffd7e","sent":[{"n":1,"part":"도입","text":"산을 걷다가 갑자기 숨이 차고, 가슴이 답답하거나 속이 메스꺼웠던 경험, 한 번쯤 있으실 겁니다.","start":0.3,"end":6.64},{"n":2,"part":"도입","text":"그럴 때 많은 사람이 일행에게 이렇게 말합니다.","start":7.02,"end":9.841},{"n":3,"part":"도입","text":"\"먼저 내려가서 쉬고 있을게.\"","start":10.222,"end":11.82},{"n":4,"part":"도입","text":"그런데 그 사소한 결정이, 당신의 목숨을 앗아갈 수 있습니다.","start":12.2,"end":15.976},{"n":5,"part":"도입","text":"어떻게 그럴 수 있을까요?","start":16.356,"end":17.8},{"n":6,"part":"도입","text":"2023년 3월, 한라산에서 있었던 사건으로 알아보겠습니다.","start":18.18,"end":22.119},{"n":7,"part":"산에 오르기 전","text":"2023년 3월 26일, 일요일.","start":23.119,"end":26.079},{"n":8,"part":"산에 오르기 전","text":"제주에 사는 54세 A씨가 일행과 함께 한라산 둘레길을 걸었습니다.","start":26.459,"end":30.641},{"n":9,"part":"산에 오르기 전","text":"A씨는 관광객이 아니라, 한라산을 늘 가까이 두고 사는 도민이었습니다.","start":31.021,"end":35.655},{"n":10,"part":"산에 오르기 전","text":"그리고 한라산 둘레길은 정상으로 오르는 길이 아닙니다.","start":36.035,"end":39.385},{"n":11,"part":"산에 오르기 전","text":"해발 600에서 800미터 사이 산 중턱 숲을 따라 걷는 길이라, 많은 사람이 가벼운 산책쯤으로 여깁니다.","start":39.765,"end":46.356},{"n":12,"part":"산에 오르기 전","text":"그렇다면 이 평범한 숲길에서, A씨에게 무슨 일이 일어났을까요?","start":46.736,"end":50.922},{"n":13,"part":"걷는 동안","text":"둘레길을 걷던 중, A씨는 몸 상태가 좋지 않다고 느꼈습니다.","start":51.922,"end":55.932},{"n":14,"part":"걷는 동안","text":"그래서 A씨는 일행에게 \"몸이 좋지 않아 먼저 내려가겠다\"고 말하고, 혼자 왔던 길을 돌아갔습니다.","start":56.312,"end":62.132},{"n":15,"part":"걷는 동안","text":"그렇다면 혼자 내려간 A씨는, 무사히 산 아래에 닿았을까요?","start":62.512,"end":66.181},{"n":16,"part":"보이지 않는 A씨","text":"하지만 먼저 내려갔다던 A씨의 모습은, 어디에서도 보이지 않았습니다.","start":67.181,"end":71.374},{"n":17,"part":"보이지 않는 A씨","text":"결국 일행은 오후 1시 48분쯤, 119에 A씨의 실종 신고를 했습니다.","start":71.754,"end":76.771},{"n":18,"part":"보이지 않는 A씨","text":"신고를 받은 119 구급대는 둘레길 주변을 수색했고, 약 1시간 만에 쓰러져 있는 A씨를 발견했습니다.","start":77.151,"end":83.695},{"n":19,"part":"보이지 않는 A씨","text":"그렇다면 발견됐을 때, A씨는 어떤 상태였을까요?","start":84.075,"end":87.446},{"n":20,"part":"1시간 뒤","text":"발견됐을 때, A씨의 심장은 이미 멈춰 있었습니다.","start":88.446,"end":91.956},{"n":21,"part":"1시간 뒤","text":"구급대는 A씨를 급히 가까운 병원으로 옮겼지만, A씨는 오후 3시 28분쯤 끝내 숨졌습니다.","start":92.335,"end":98.663},{"n":22,"part":"1시간 뒤","text":"신고하고 1시간 40분 뒤였습니다.","start":99.043,"end":101.293},{"n":23,"part":"1시간 뒤","text":"A씨가 언제 쓰러졌는지는 아무도 모릅니다.","start":101.673,"end":104.302},{"n":24,"part":"1시간 뒤","text":"쓰러지는 순간, A씨 옆에는 아무도 없었기 때문입니다.","start":104.682,"end":108.272},{"n":25,"part":"1시간 뒤","text":"가벼운 산책길에서, 몸이 좋지 않아 먼저 내려가겠다고 한 A씨는 왜 이렇게 됐을까요?","start":108.652,"end":113.928},{"n":26,"part":"1시간 뒤","text":"이제 그날로 다시 돌아가, 하나씩 짚어 보겠습니다.","start":114.308,"end":117.568},{"n":27,"part":"다시 그날로","text":"먼저 A씨가 걸은 둘레길은 정상으로 오르는 가파른 길이 아니었습니다.","start":118.568,"end":123.128},{"n":28,"part":"다시 그날로","text":"하지만 나이가 들수록, 심장에 피를 보내는 혈관은 아무 증상 없이 조용히 좁아질 수 있습니다.","start":123.508,"end":129.098},{"n":29,"part":"다시 그날로","text":"겉으로는 건강해 보이는 사람도 마찬가지입니다.","start":129.478,"end":132.048},{"n":30,"part":"다시 그날로","text":"혈관을 좁게 만드는 건 대부분 오래된 습관과 지병입니다.","start":132.428,"end":135.998},{"n":31,"part":"다시 그날로","text":"고혈압, 당뇨, 높은 콜레스테롤, 담배, 그리고 가족 중에 심장병을 앓은 사람이 있는 경우입니다.","start":136.378,"end":142.958},{"n":32,"part":"다시 그날로","text":"이렇게 좁아진 혈관을 가진 심장에는, 평탄한 숲길을 오래 걷는 것도 부담이 될 수 있습니다.","start":143.338,"end":148.746},{"n":33,"part":"다시 그날로","text":"산 중턱의 찬 공기와, 땀으로 빠져나간 물은 심장을 더 힘들게 합니다.","start":149.126,"end":153.472},{"n":34,"part":"다시 그날로","text":"그렇다면 A씨가 느낀 '몸이 좋지 않다'는 느낌은, 무엇이었을 수 있을까요?","start":153.852,"end":158.52},{"n":35,"part":"다시 그날로","text":"심장이 보내는 경고는, 이런 모습으로 오기도 합니다.","start":158.9,"end":162.258},{"n":36,"part":"다시 그날로","text":"가슴이 조이거나 답답하고, 명치가 체한 것처럼 꽉 막히고, 식은땀이 나거나, 숨이 평소보다 심하게 찹니다.","start":162.638,"end":169.648},{"n":37,"part":"다시 그날로","text":"팔이나 턱, 등까지 아프기도 합니다.","start":170.028,"end":172.289},{"n":38,"part":"다시 그날로","text":"문제는 이 신호가 \"조금 쉬면 괜찮겠지\" 하고 넘기기 쉽다는 겁니다.","start":172.669,"end":177.009},{"n":39,"part":"다시 그날로","text":"실제로 2016년 국제 학술지에 실린, 미국 오리건주 자료를 분석한 연구가 있습니다.","start":177.389,"end":183.238},{"n":40,"part":"다시 그날로","text":"갑자기 심장이 멈춘 35세에서 65세 환자의 절반 정도는, 그 전 4주 안에 가슴 통증이나 숨참 같은 신호가 있었습니다.","start":183.618,"end":191.528},{"n":41,"part":"다시 그날로","text":"하지만 그 신호를 느끼고 119에 먼저 연락한 사람은, 다섯 명 중 한 명도 되지 않았습니다.","start":191.908,"end":197.758},{"n":42,"part":"다시 그날로","text":"그렇다면 A씨의 '먼저 내려가겠다'는 결정에는, 어떤 위험이 숨어 있었을까요?","start":198.138,"end":203.254},{"n":43,"part":"다시 그날로","text":"누구나 할 법한 결정입니다.","start":203.634,"end":205.254},{"n":44,"part":"다시 그날로","text":"일행의 산행을 망치고 싶지 않고, 내려가서 쉬면 나아질 거라고 생각하니까요.","start":205.634,"end":210.146},{"n":45,"part":"다시 그날로","text":"하지만 이 결정에는 위험이 두 가지 숨어 있습니다.","start":210.526,"end":213.316},{"n":46,"part":"다시 그날로","text":"첫째, A씨는 몸이 보낸 신호를 안고 계속 걸었습니다.","start":213.696,"end":217.366},{"n":47,"part":"다시 그날로","text":"걷는 동안 심장은 쉬지 못합니다.","start":217.746,"end":219.606},{"n":48,"part":"다시 그날로","text":"둘째, A씨는 혼자가 됐습니다.","start":219.986,"end":222.363},{"n":49,"part":"다시 그날로","text":"심장이 멈추면, 쓰러진 사람은 스스로 119를 부를 수 없습니다.","start":222.743,"end":226.623},{"n":50,"part":"다시 그날로","text":"그렇다면 쓰러진 A씨에게, 발견되기까지의 1시간은 어떤 시간이었을까요?","start":227.003,"end":231.943},{"n":51,"part":"다시 그날로","text":"심장이 멈추면 피가 뇌로 가지 못합니다.","start":232.323,"end":234.653},{"n":52,"part":"다시 그날로","text":"사람은 곧바로 의식을 잃고, 숨이 멎거나 헐떡이는 숨만 남습니다.","start":235.033,"end":239.373},{"n":53,"part":"다시 그날로","text":"그리고 4분이 지나면, 뇌가 손상되기 시작한다고 알려져 있습니다.","start":239.753,"end":243.583},{"n":54,"part":"다시 그날로","text":"그래서 심정지는, 옆 사람이 얼마나 빨리 가슴을 눌러 주느냐가 생사를 가릅니다.","start":243.963,"end":248.932},{"n":55,"part":"다시 그날로","text":"질병관리청 조사에서, 병원에 오기 전 옆 사람이 심폐소생술을 했을 때 생존율은 14.4%였습니다.","start":249.312,"end":256.349},{"n":56,"part":"다시 그날로","text":"하지 않았을 때는 6.1%였습니다.","start":256.729,"end":259.275},{"n":57,"part":"다시 그날로","text":"하지만 A씨는, 신고 뒤 발견되기까지만 약 1시간이 걸렸습니다.","start":259.655,"end":263.905},{"n":58,"part":"다시 그날로","text":"A씨가 혼자 내려간 그 숲길에는, 가슴을 눌러 줄 사람이 없었습니다.","start":264.285,"end":268.593},{"n":59,"part":"다시 그날로","text":"그런데 이런 일은, A씨에게만 일어난 걸까요?","start":268.973,"end":271.853},{"n":60,"part":"이뿐만이 아닙니다","text":"2025년 3월 17일 아침 8시 12분쯤, 한라산 성판악 코스를 오르던 60대 관광객이 갑자기 쓰러졌습니다.","start":272.853,"end":280.531},{"n":61,"part":"이뿐만이 아닙니다","text":"탐방로 입구에서 약 5킬로미터, 해발 1,100미터쯤 되는 곳이었습니다.","start":280.911,"end":285.41},{"n":62,"part":"이뿐만이 아닙니다","text":"심정지였습니다.","start":285.79,"end":286.87},{"n":63,"part":"이뿐만이 아닙니다","text":"국립공원 직원과 구조대가 심폐소생술을 하고 산 아래로 옮겼지만, 낮 12시 4분쯤 사망 판정을 받았습니다.","start":287.25,"end":294.092},{"n":64,"part":"이뿐만이 아닙니다","text":"두 달 뒤인 2025년 5월에도, 같은 성판악 탐방로에서 50대 등산객이 심정지로 쓰러졌습니다.","start":294.472,"end":301.212},{"n":65,"part":"이뿐만이 아닙니다","text":"2026년 8월, 폭염경보가 내려진 경북 봉화 청량산에서는 아침 8시쯤 50대 등산객이 쓰러졌습니다.","start":301.592,"end":308.925},{"n":66,"part":"이뿐만이 아닙니다","text":"함께 간 지인이 발견했을 때, 이미 숨과 맥박이 없었습니다.","start":309.305,"end":313.121},{"n":67,"part":"이뿐만이 아닙니다","text":"같은 해 10월 11일, 경기도 가평 운악산에서는 70대 등산객이 등산하던 중 갑자기 쓰러졌습니다.","start":313.501,"end":320.031},{"n":68,"part":"이뿐만이 아닙니다","text":"병원으로 옮겨졌지만 숨졌습니다.","start":320.411,"end":322.431},{"n":69,"part":"이뿐만이 아닙니다","text":"그리고 보름 뒤인 10월 26일, 다시 한라산 성판악.","start":322.811,"end":326.319},{"n":70,"part":"이뿐만이 아닙니다","text":"이번에는 산을 내려오던 50대 관광객이 오전 11시 40분쯤 쓰러졌고, 병원으로 옮겨졌지만 숨졌습니다.","start":326.699,"end":333.692},{"n":71,"part":"이뿐만이 아닙니다","text":"평탄한 둘레길에서도, 오르막에서도, 내리막에서도 일어났습니다.","start":334.072,"end":338.332},{"n":72,"part":"이뿐만이 아닙니다","text":"성판악 한 곳에서만 1년 7개월 사이 세 번입니다.","start":338.712,"end":341.956},{"n":73,"part":"이뿐만이 아닙니다","text":"그렇다면 산에서 숨지는 사람은, 얼마나 많이 심정지 때문일까요?","start":342.336,"end":346.583},{"n":74,"part":"숫자로 본 등산 중 심정지","text":"국립공원공단이 지리산과 설악산, 북한산처럼 공단이 관리하는 국립공원의 사망 사고를 살펴봤습니다.","start":347.583,"end":354.433},{"n":75,"part":"숫자로 본 등산 중 심정지","text":"2014년부터 10년 동안 숨진 사람은 167명이었습니다.","start":354.813,"end":358.855},{"n":76,"part":"숫자로 본 등산 중 심정지","text":"그 가운데 84명, 절반이 심정지였습니다.","start":359.235,"end":362.241},{"n":77,"part":"숫자로 본 등산 중 심정지","text":"낙사한 54명보다 30명이 더 많습니다.","start":362.621,"end":365.361},{"n":78,"part":"숫자로 본 등산 중 심정지","text":"산에서 가장 무서운 건 절벽이 아니라, 내 심장이었던 겁니다.","start":365.741,"end":369.641},{"n":79,"part":"숫자로 본 등산 중 심정지","text":"한라산은 제주도가 따로 관리해, 오늘 본 한라산 사고들은 이 숫자에 들어 있지도 않습니다.","start":370.021,"end":375.501},{"n":80,"part":"숫자로 본 등산 중 심정지","text":"심정지는 산에서만 일어나는 일도 아닙니다.","start":375.881,"end":378.445},{"n":81,"part":"숫자로 본 등산 중 심정지","text":"질병관리청 조사로, 2024년 한 해 동안 119가 병원으로 옮긴 심정지 환자는 3만 3천여 명이었습니다.","start":378.825,"end":386.187},{"n":82,"part":"숫자로 본 등산 중 심정지","text":"열 명 중 일곱 명은 심장 자체의 문제 때문이었고, 남성이 여성보다 두 배 가까이 많았습니다.","start":386.567,"end":392.367},{"n":83,"part":"숫자로 본 등산 중 심정지","text":"그렇다면 산에 가기 전, 무엇을 점검해야 할까요?","start":392.747,"end":395.917},{"n":84,"part":"산에 가기 전, 이것만은 점검하세요","text":"첫째, 내 심장을 점검하세요.","start":396.917,"end":398.917},{"n":85,"part":"산에 가기 전, 이것만은 점검하세요","text":"혈압이나 혈당, 콜레스테롤 경고를 받고도 그냥 두고 있나요?","start":399.297,"end":403.226},{"n":86,"part":"산에 가기 전, 이것만은 점검하세요","text":"담배를 피우거나, 가족 중에 심장병을 앓은 사람이 있나요?","start":403.606,"end":407.312},{"n":87,"part":"산에 가기 전, 이것만은 점검하세요","text":"오르막에서 예전보다 가슴이 답답하거나 숨이 쉽게 차나요?","start":407.692,"end":411.457},{"n":88,"part":"산에 가기 전, 이것만은 점검하세요","text":"하나라도 그렇다면, 산에 가기 전에 진료부터 받아 보세요.","start":411.837,"end":415.326},{"n":89,"part":"산에 가기 전, 이것만은 점검하세요","text":"둘째, 오늘 컨디션을 점검하세요.","start":415.706,"end":418.046},{"n":90,"part":"산에 가기 전, 이것만은 점검하세요","text":"전날 술을 마셨거나, 잠을 제대로 못 잤거나, 몸이 무겁다면 그날은 무리하지 않습니다.","start":418.426,"end":424.106},{"n":91,"part":"산에 가기 전, 이것만은 점검하세요","text":"셋째, 코스와 날씨를 점검하세요.","start":424.486,"end":426.793},{"n":92,"part":"산에 가기 전, 이것만은 점검하세요","text":"내 체력에 맞는 길을 고르고, 몹시 춥거나 덥거나 바람이 거센 날은 다음으로 미뤄도 됩니다.","start":427.173,"end":433.098},{"n":93,"part":"산에 가기 전, 이것만은 점검하세요","text":"둘레길처럼 평탄한 길이라도, 방심하지 않습니다.","start":433.478,"end":436.668},{"n":94,"part":"산에 가기 전, 이것만은 점검하세요","text":"넷째, 함께 갈 사람을 점검하세요.","start":437.048,"end":439.222},{"n":95,"part":"산에 가기 전, 이것만은 점검하세요","text":"혼자 가지 말고, 함께 가는 사람에게 내 지병과 먹는 약을 미리 알려 두세요.","start":439.602,"end":444.435},{"n":96,"part":"산에 가기 전, 이것만은 점검하세요","text":"그리고 산에서 몸이 좋지 않다면, 그 자리에 멈춰 앉고, 일행에게 알리세요.","start":444.815,"end":449.655},{"n":97,"part":"산에 가기 전, 이것만은 점검하세요","text":"가슴이 조이거나 식은땀이 난다면, 체한 거라고 넘기지 말고 119에 신고합니다.","start":450.035,"end":455.226},{"n":98,"part":"산에 가기 전, 이것만은 점검하세요","text":"무엇보다, 혼자 먼저 내려가지 않습니다.","start":455.606,"end":458.286},{"n":99,"part":"산에 가기 전, 이것만은 점검하세요","text":"일행이 먼저 내려가겠다고 하면, 같이 멈추거나 같이 내려가 주세요.","start":458.666,"end":462.859},{"n":100,"part":"산에 가기 전, 이것만은 점검하세요","text":"만약 옆 사람이 쓰러졌다면, 119에 신고하고 안내에 따라 가슴 한가운데를 세게, 빠르게 눌러 주세요.","start":463.239,"end":469.806},{"n":101,"part":"산에 가기 전, 이것만은 점검하세요","text":"그렇다면 그날 둘레길이, 우리에게 남긴 건 무엇일까요?","start":470.186,"end":473.797},{"n":102,"part":"마무리","text":"\"몸이 좋지 않아, 먼저 내려가겠다.\"","start":474.797,"end":477.215},{"n":103,"part":"마무리","text":"누구나 한 번쯤 해 본 말입니다.","start":477.595,"end":479.315},{"n":104,"part":"마무리","text":"하지만 심장이 보내는 신호 앞에서는, 그 사소한 결정이 생사를 가를 수 있습니다.","start":479.695,"end":484.505},{"n":105,"part":"마무리","text":"산에서 몸이 이상하면, 멈추고, 알리고, 혼자가 되지 마세요.","start":484.885,"end":489.323},{"n":106,"part":"마무리","text":"시청해주셔서 감사합니다.","start":489.703,"end":491.233}],"subs":[[0.2,7.02,"산을 걷다가 갑자기 숨이 차고,\n가슴이 답답하거나 속이 메스꺼웠던 경험, 한 번쯤 있으실 겁니다."],[7.02,10.222,"그럴 때 많은 사람이 일행에게 이렇게 말합니다."],[10.222,12.2,"\"먼저 내려가서 쉬고 있을게.\""],[12.2,16.356,"그런데 그 사소한 결정이, 당신의 목숨을 앗아갈 수 있습니다."],[16.356,18.18,"어떻게 그럴 수 있을까요?"],[18.18,23.119,"2023년 3월, 한라산에서 있었던 사건으로 알아보겠습니다."],[23.119,26.459,"2023년 3월 26일, 일요일."],[26.459,31.021,"제주에 사는 54세 A씨가 일행과 함께 한라산 둘레길을 걸었습니다."],[31.021,36.035,"A씨는 관광객이 아니라,\n한라산을 늘 가까이 두고 사는 도민이었습니다."],[36.035,39.765,"그리고 한라산 둘레길은 정상으로 오르는 길이 아닙니다."],[39.765,46.736,"해발 600에서 800미터 사이 산 중턱 숲을 따라 걷는 길이라,\n많은 사람이 가벼운 산책쯤으로 여깁니다."],[46.736,51.922,"그렇다면 이 평범한 숲길에서, A씨에게 무슨 일이 일어났을까요?"],[51.922,56.312,"둘레길을 걷던 중, A씨는 몸 상태가 좋지 않다고 느꼈습니다."],[56.312,62.512,"그래서 A씨는 일행에게 \"몸이 좋지 않아 먼저 내려가겠다\"고 말하고,\n혼자 왔던 길을 돌아갔습니다."],[62.512,67.181,"그렇다면 혼자 내려간 A씨는, 무사히 산 아래에 닿았을까요?"],[67.181,71.754,"하지만 먼저 내려갔다던 A씨의 모습은, 어디에서도 보이지 않았습니다."],[71.754,77.151,"결국 일행은 오후 1시 48분쯤, 119에 A씨의 실종 신고를 했습니다."],[77.151,84.075,"신고를 받은 119 구급대는 둘레길 주변을 수색했고,\n약 1시간 만에 쓰러져 있는 A씨를 발견했습니다."],[84.075,88.446,"그렇다면 발견됐을 때, A씨는 어떤 상태였을까요?"],[88.446,92.335,"발견됐을 때, A씨의 심장은 이미 멈춰 있었습니다."],[92.335,99.043,"구급대는 A씨를 급히 가까운 병원으로 옮겼지만,\nA씨는 오후 3시 28분쯤 끝내 숨졌습니다."],[99.043,101.673,"신고하고 1시간 40분 뒤였습니다."],[101.673,104.682,"A씨가 언제 쓰러졌는지는 아무도 모릅니다."],[104.682,108.652,"쓰러지는 순간, A씨 옆에는 아무도 없었기 때문입니다."],[108.652,114.308,"가벼운 산책길에서,\n몸이 좋지 않아 먼저 내려가겠다고 한 A씨는 왜 이렇게 됐을까요?"],[114.308,118.568,"이제 그날로 다시 돌아가, 하나씩 짚어 보겠습니다."],[118.568,123.508,"먼저 A씨가 걸은 둘레길은 정상으로 오르는 가파른 길이 아니었습니다."],[123.508,129.478,"하지만 나이가 들수록,\n심장에 피를 보내는 혈관은 아무 증상 없이 조용히 좁아질 수 있습니다."],[129.478,132.428,"겉으로는 건강해 보이는 사람도 마찬가지입니다."],[132.428,136.378,"혈관을 좁게 만드는 건 대부분 오래된 습관과 지병입니다."],[136.378,143.338,"고혈압, 당뇨, 높은 콜레스테롤, 담배,\n그리고 가족 중에 심장병을 앓은 사람이 있는 경우입니다."],[143.338,149.126,"이렇게 좁아진 혈관을 가진 심장에는,\n평탄한 숲길을 오래 걷는 것도 부담이 될 수 있습니다."],[149.126,153.852,"산 중턱의 찬 공기와, 땀으로 빠져나간 물은 심장을 더 힘들게 합니다."],[153.852,158.9,"그렇다면 A씨가 느낀 '몸이 좋지 않다'는 느낌은,\n무엇이었을 수 있을까요?"],[158.9,162.638,"심장이 보내는 경고는, 이런 모습으로 오기도 합니다."],[162.638,170.028,"가슴이 조이거나 답답하고, 명치가 체한 것처럼 꽉 막히고,\n식은땀이 나거나, 숨이 평소보다 심하게 찹니다."],[170.028,172.669,"팔이나 턱, 등까지 아프기도 합니다."],[172.669,177.389,"문제는 이 신호가 \"조금 쉬면 괜찮겠지\" 하고 넘기기 쉽다는 겁니다."],[177.389,183.618,"실제로 2016년 국제 학술지에 실린,\n미국 오리건주 자료를 분석한 연구가 있습니다."],[183.618,191.908,"갑자기 심장이 멈춘 35세에서 65세 환자의 절반 정도는,\n그 전 4주 안에 가슴 통증이나 숨참 같은 신호가 있었습니다."],[191.908,198.138,"하지만 그 신호를 느끼고 119에 먼저 연락한 사람은,\n다섯 명 중 한 명도 되지 않았습니다."],[198.138,203.634,"그렇다면 A씨의 '먼저 내려가겠다'는 결정에는,\n어떤 위험이 숨어 있었을까요?"],[203.634,205.634,"누구나 할 법한 결정입니다."],[205.634,210.526,"일행의 산행을 망치고 싶지 않고,\n내려가서 쉬면 나아질 거라고 생각하니까요."],[210.526,213.696,"하지만 이 결정에는 위험이 두 가지 숨어 있습니다."],[213.696,217.746,"첫째, A씨는 몸이 보낸 신호를 안고 계속 걸었습니다."],[217.746,219.986,"걷는 동안 심장은 쉬지 못합니다."],[219.986,222.743,"둘째, A씨는 혼자가 됐습니다."],[222.743,227.003,"심장이 멈추면, 쓰러진 사람은 스스로 119를 부를 수 없습니다."],[227.003,232.323,"그렇다면 쓰러진 A씨에게,\n발견되기까지의 1시간은 어떤 시간이었을까요?"],[232.323,235.033,"심장이 멈추면 피가 뇌로 가지 못합니다."],[235.033,239.753,"사람은 곧바로 의식을 잃고, 숨이 멎거나 헐떡이는 숨만 남습니다."],[239.753,243.963,"그리고 4분이 지나면, 뇌가 손상되기 시작한다고 알려져 있습니다."],[243.963,249.312,"그래서 심정지는,\n옆 사람이 얼마나 빨리 가슴을 눌러 주느냐가 생사를 가릅니다."],[249.312,256.729,"질병관리청 조사에서, 병원에 오기 전 옆 사람이\n심폐소생술을 했을 때 생존율은 14.4%였습니다."],[256.729,259.655,"하지 않았을 때는 6.1%였습니다."],[259.655,264.285,"하지만 A씨는, 신고 뒤 발견되기까지만 약 1시간이 걸렸습니다."],[264.285,268.973,"A씨가 혼자 내려간 그 숲길에는, 가슴을 눌러 줄 사람이 없었습니다."],[268.973,272.853,"그런데 이런 일은, A씨에게만 일어난 걸까요?"],[272.853,280.911,"2025년 3월 17일 아침 8시 12분쯤,\n한라산 성판악 코스를 오르던 60대 관광객이 갑자기 쓰러졌습니다."],[280.911,285.79,"탐방로 입구에서 약 5킬로미터, 해발 1,100미터쯤 되는 곳이었습니다."],[285.79,287.25,"심정지였습니다."],[287.25,294.472,"국립공원 직원과 구조대가 심폐소생술을 하고 산 아래로 옮겼지만,\n낮 12시 4분쯤 사망 판정을 받았습니다."],[294.472,301.592,"두 달 뒤인 2025년 5월에도,\n같은 성판악 탐방로에서 50대 등산객이 심정지로 쓰러졌습니다."],[301.592,309.305,"2026년 8월, 폭염경보가 내려진 경북 봉화 청량산에서는\n아침 8시쯤 50대 등산객이 쓰러졌습니다."],[309.305,313.501,"함께 간 지인이 발견했을 때, 이미 숨과 맥박이 없었습니다."],[313.501,320.411,"같은 해 10월 11일, 경기도 가평 운악산에서는\n70대 등산객이 등산하던 중 갑자기 쓰러졌습니다."],[320.411,322.811,"병원으로 옮겨졌지만 숨졌습니다."],[322.811,326.699,"그리고 보름 뒤인 10월 26일, 다시 한라산 성판악."],[326.699,334.072,"이번에는 산을 내려오던 50대 관광객이 오전 11시 40분쯤 쓰러졌고,\n병원으로 옮겨졌지만 숨졌습니다."],[334.072,338.712,"평탄한 둘레길에서도, 오르막에서도, 내리막에서도 일어났습니다."],[338.712,342.336,"성판악 한 곳에서만 1년 7개월 사이 세 번입니다."],[342.336,347.583,"그렇다면 산에서 숨지는 사람은, 얼마나 많이 심정지 때문일까요?"],[347.583,354.813,"국립공원공단이 지리산과 설악산,\n북한산처럼 공단이 관리하는 국립공원의 사망 사고를 살펴봤습니다."],[354.813,359.235,"2014년부터 10년 동안 숨진 사람은 167명이었습니다."],[359.235,362.621,"그 가운데 84명, 절반이 심정지였습니다."],[362.621,365.741,"낙사한 54명보다 30명이 더 많습니다."],[365.741,370.021,"산에서 가장 무서운 건 절벽이 아니라, 내 심장이었던 겁니다."],[370.021,375.881,"한라산은 제주도가 따로 관리해,\n오늘 본 한라산 사고들은 이 숫자에 들어 있지도 않습니다."],[375.881,378.825,"심정지는 산에서만 일어나는 일도 아닙니다."],[378.825,386.567,"질병관리청 조사로, 2024년 한 해 동안 119가\n병원으로 옮긴 심정지 환자는 3만 3천여 명이었습니다."],[386.567,392.747,"열 명 중 일곱 명은 심장 자체의 문제 때문이었고,\n남성이 여성보다 두 배
