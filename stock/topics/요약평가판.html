body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}

  window.addEventListener("hashchange", () => { const k = (location.hash || "").slice(1); if (byKey[k] && k !== st.key) { st.key = k; st.open = null; renderAll(); } });

  (async () => {
    const use = window.claude && window.claude.use ? n => window.claude.use(n) : () => Promise.resolve(null);
    let db = null, user = null;
    try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (e) { db = null; }
    if (!db) { setStatus("bad", "저장소에 연결하지 못했습니다 — 요약은 볼 수 있지만 피드백은 저장되지 않습니다."); renderSpine(); return; }
    st.db = db;
    try { if (user && user.can) { const c = await user.can("data.write"); if (c === false) st.canWrite = false; } } catch (e) { /* 모름 = 쓰기 칸 유지 */ }
    setStatus(st.canWrite ? "ok" : "", st.canWrite ? "저장소 연결됨 — 피드백은 바로 저장되고 Claude 가 읽을 수 있습니다." : "보기 전용 — 이 화면에서는 피드백을 저장할 수 없습니다.");
    renderSpine();
    db.collection("feedback").onSnapshot(snap => {
      st.fb = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(f => byKey[f.script] && Number.isInteger(f.chapter));
      if (st.editing && !st.fb.some(f => f.id === st.editing)) st.editing = null;
      renderPicker(); if (st.editing == null) renderSpine();
    }, () => setStatus("bad", "피드백을 불러오지 못했습니다 — 페이지를 새로 열어 주세요."));
  })();
})();
</script>
