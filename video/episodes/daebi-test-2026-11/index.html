       ③ 정답 표시 = 옳은 말풍선 청록 테두리 + ✓ 배지, 이씨가 고른 말풍선 진홍 테두리 + 'LEE' 꼬리표 (1편 ✓·✕ 동그라미 대신).
       ④ 이야기 장면 = 화면 가득한 무대 · 주인공 오른쪽 가운데 · 소품은 머리 옆 작은 생각 말풍선 안 · 큰 숫자는 왼쪽 위 손글씨 느낌 메모지(명조 굵은 글꼴) · 작은 그래프는 메모 수첩 카드 — 1편 오른쪽 어두운 카드(CARD) 대신.

<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"daebi-test-2026-11","topic":"stock","duration":487.86,"audio":"../../../stock/source/daebi-test-2026-11/narration.mp3","thumb":null,"synced":"2026-11-04T13:57:11Z","tts":"2026-11-04T12:14:30","script_sha1":"1833dc7785d5cdbb","sent":[{"n":1,"part":"도입","text":"주식이 오를 때 드는 생각 하나가, 다음 폭락에서 계좌를 무너뜨릴 수 있습니다.","start":0.3,"end":4.786},{"n":2,"part":"도입","text":"이씨는 한 종목으로 계좌를 1억 원까지 불려, 주변에서 고수로 불리던 사람인데요.","start":5.166,"end":10.225},{"n":3,"part":"도입","text":"그 1억 원은 4년 뒤, 3천2백만 원이 됐습니다.","start":10.605,"end":13.785},{"n":4,"part":"도입","text":"그사이 S&P 500 지수는 50% 넘게 올랐는데도 말이죠.","start":14.165,"end":17.852},{"n":5,"part":"도입","text":"이씨를 무너뜨린 건 폭락 자체가 아니라, 오를 때마다 했던 생각들이었습니다.","start":18.232,"end":22.677},{"n":6,"part":"도입","text":"이씨에게 찾아온 다섯 가지 생각 앞에서, 당신이라면 어떻게 할지 골라 보세요.","start":23.056,"end":27.831},{"n":7,"part":"도입","text":"고를 때마다, 이씨와 같은 생각을 했는지 세어 보시면 됩니다.","start":28.211,"end":31.944},{"n":8,"part":"도입","text":"고수로 불리던 이씨의 자리에서, 첫 번째 생각부터 당신이 골라 보겠습니다.","start":32.324,"end":36.825},{"n":9,"part":"선택 1","text":"당신은 1년 전, 모아 둔 돈을 모두 한 종목에 넣었습니다.","start":37.825,"end":41.471},{"n":10,"part":"선택 1","text":"그 종목이 1년 만에 5배 가까이 오르면서, 계좌는 1억 원이 됐는데요.","start":41.851,"end":46.161},{"n":11,"part":"선택 1","text":"코로나로 재택근무와 원격 수업이 늘자, 화상 회의 회사 주가가 뛰었기 때문입니다.","start":46.541,"end":51.921},{"n":12,"part":"선택 1","text":"같은 해 S&P 500 지수는 16% 올랐습니다.","start":52.301,"end":55.581},{"n":13,"part":"선택 1","text":"주변에선 당신을 주식 고수라 부르며, 다음 종목을 물어봅니다.","start":55.961,"end":59.795},{"n":14,"part":"선택 1","text":"그럼 당신은 내가 잘 골라서 번 거라며, 이 종목을 그대로 두시겠습니까?","start":60.175,"end":64.825},{"n":15,"part":"선택 1","text":"아니면 분위기 덕에 운이 좋았을 뿐이라며, 일부를 매도해 번 돈을 확정하시겠습니까?","start":65.205,"end":70.077},{"n":16,"part":"선택 1","text":"선택해 보세요.","start":70.457,"end":71.397},{"n":17,"part":"선택 1","text":"3, 2, 1.","start":71.777,"end":73.957},{"n":18,"part":"선택 1","text":"이럴 때는 운이 좋았다고 보고, 일부를 매도해 번 돈을 확정하는 것이 옳은 선택입니다.","start":74.337,"end":79.721},{"n":19,"part":"선택 1","text":"때는 2020년 12월 31일, 그 종목은 화상 회의 회사 줌이었습니다.","start":80.101,"end":85.101},{"n":20,"part":"선택 1","text":"이씨가 그랬듯 실력이라 믿고 그대로 뒀다면, 줌은 그 뒤 84%까지 하락했을 것입니다.","start":85.481,"end":91.356},{"n":21,"part":"선택 1","text":"4년 뒤까지도 76% 손실일 것입니다.","start":91.736,"end":94.635},{"n":22,"part":"선택 1","text":"물론 정말 실력이 좋아서 번 사람도 있습니다.","start":95.015,"end":97.625},{"n":23,"part":"선택 1","text":"하지만 실력인지 운인지는, 오를 때가 아니라 떨어질 때 드러납니다.","start":98.005,"end":101.955},{"n":24,"part":"선택 1","text":"지금 S&P 500에 속한 회사 가운데, 2020년에 2배 넘게 오른 곳은 14개였습니다.","start":102.335,"end":107.954},{"n":25,"part":"선택 1","text":"그 가운데 9개는, 2년 안에 주가가 반 토막이 났죠.","start":108.334,"end":111.838},{"n":26,"part":"선택 1","text":"운을 실력으로 믿으면, 한 종목에 더 크게 걸게 됩니다.","start":112.218,"end":115.718},{"n":27,"part":"선택 1","text":"결국 옳은 선택은 큰 수익을 운으로 보고, 오른 종목의 일부를 매도해 확정하는 것입니다.","start":116.098,"end":121.553},{"n":28,"part":"선택 2","text":"6주 뒤, 그 종목이 또 올라 당신의 계좌는 28% 더 늘었습니다.","start":122.553,"end":127.231},{"n":29,"part":"선택 2","text":"당신은 그사이 번 2천8백만 원을 어디에 둘지 고민합니다.","start":127.611,"end":131.423},{"n":30,"part":"선택 2","text":"눈여겨본 곳은, 1년 만에 주가가 5배 넘게 오른 운동 기구 회사인데요.","start":131.803,"end":136.463},{"n":31,"part":"선택 2","text":"집에서 하는 운동이 유행하면서, 실내 자전거가 불티나게 팔렸습니다.","start":136.843,"end":141},{"n":32,"part":"선택 2","text":"인터넷엔 번 돈으로 이런 종목을 사서, 또 몇 배를 벌었다는 글이 넘쳐 납니다.","start":141.38,"end":145.92},{"n":33,"part":"선택 2","text":"그럼 당신은 번 돈도 원금처럼 아껴, 이 운동 기구 회사는 매수하지 않으시겠습니까?","start":146.3,"end":151.799},{"n":34,"part":"선택 2","text":"아니면 번 돈은 잃어도 괜찮다며, 그 돈으로 이 회사를 매수하시겠습니까?","start":152.179,"end":156.512},{"n":35,"part":"선택 2","text":"선택해 보세요.","start":156.892,"end":157.832},{"n":36,"part":"선택 2","text":"3, 2, 1.","start":158.212,"end":160.392},{"n":37,"part":"선택 2","text":"이럴 때는 번 돈도 원금처럼 아껴, 이 회사는 매수하지 않는 것이 옳은 선택입니다.","start":160.772,"end":166.102},{"n":38,"part":"선택 2","text":"때는 2021년 2월 12일, 그 운동 기구 회사는 펠로톤이었습니다.","start":166.482,"end":171.306},{"n":39,"part":"선택 2","text":"이씨가 그랬듯 번 돈으로 펠로톤을 매수했다면, 2022년 말엔 95%가 사라졌을 것입니다.","start":171.686,"end":178.241},{"n":40,"part":"선택 2","text":"2024년 말까지도 94% 손실일 것입니다.","start":178.621,"end":181.992},{"n":41,"part":"선택 2","text":"물론 번 돈은 처음부터 없던 돈 같아서, 잃어도 덜 아프게 느껴집니다.","start":182.372,"end":186.635},{"n":42,"part":"선택 2","text":"하지만 계좌에 찍힌 돈은 번 돈이든 원금이든, 똑같은 내 돈입니다.","start":187.015,"end":191.355},{"n":43,"part":"선택 2","text":"94%를 잃은 돈이 원래대로 돌아가려면, 18배 가까이 올라야 합니다.","start":191.735,"end":196.851},{"n":44,"part":"선택 2","text":"결국 옳은 선택은 번 돈도 원금처럼 여기고, 유행하는 종목에 걸지 않는 것입니다.","start":197.231,"end":202.311},{"n":45,"part":"선택 3","text":"일곱 달 뒤, 당신의 그 종목은 최고가보다 54% 하락해 있습니다.","start":203.311,"end":208.152},{"n":46,"part":"선택 3","text":"당신은 이 종목을 모두 매도하고, 그 돈을 누구나 아는 큰 회사로 옮길까 고민합니다.","start":208.532,"end":214.04},{"n":47,"part":"선택 3","text":"그 회사 주가는 1년 반 만에 2배 가까이 올랐는데요.","start":214.42,"end":217.85},{"n":48,"part":"선택 3","text":"새로 시작한 영상 서비스 가입자도 빠르게 늘고 있습니다.","start":218.23,"end":221.63},{"n":49,"part":"선택 3","text":"주변에선 이런 회사는 망할 일이 없으니, 한 곳에 넣어도 안전하다고들 합니다.","start":222.01,"end":226.716},{"n":50,"part":"선택 3","text":"그럼 당신은 큰 회사도 반 토막 날 수 있다며, 판 돈을 여러 회사에 나눠 두시겠습니까?","start":227.096,"end":232.596},{"n":51,"part":"선택 3","text":"아니면 누구나 아는 큰 회사라 안전하다며, 판 돈을 모두 이 회사에 넣으시겠습니까?","start":232.976,"end":238.038},{"n":52,"part":"선택 3","text":"선택해 보세요.","start":238.418,"end":239.358},{"n":53,"part":"선택 3","text":"3, 2, 1.","start":239.738,"end":241.918},{"n":54,"part":"선택 3","text":"이럴 때는 큰 회사도 반 토막 날 수 있다고 보고, 나눠 두는 것이 옳은 선택입니다.","start":242.298,"end":247.378},{"n":55,"part":"선택 3","text":"때는 2021년 9월 30일, 그 회사는 디즈니였습니다.","start":247.758,"end":251.762},{"n":56,"part":"선택 3","text":"이씨가 그랬듯 줌을 판 돈을 모두 디즈니에 넣었다면, 그 뒤 53%까지 하락했을 것입니다.","start":252.142,"end":258.143},{"n":57,"part":"선택 3","text":"2024년 말까지도 33% 손실일 것입니다.","start":258.523,"end":261.828},{"n":58,"part":"선택 3","text":"물론 큰 회사는 작은 회사보다 쉽게 망하지 않습니다.","start":262.208,"end":265.653},{"n":59,"part":"선택 3","text":"하지만 회사가 망하지 않는 것과, 주가가 떨어지지 않는 것은 다른 이야기입니다.","start":266.033,"end":270.783},{"n":60,"part":"선택 3","text":"이듬해인 2022년엔 메타가 74%, 아마존도 51%까지 하락했습니다.","start":271.163,"end":276.956},{"n":61,"part":"선택 3","text":"이름이 알려졌다고 해서, 한 회사에 몰아 둘 만큼 안전한 건 아니죠.","start":277.336,"end":281.429},{"n":62,"part":"선택 3","text":"결국 옳은 선택은 큰 회사도 크게 떨어질 수 있다고 보고, 한 곳에 몰지 않는 것입니다.","start":281.809,"end":286.999},{"n":63,"part":"선택 4","text":"석 달 뒤 연말, S&P 500 지수는 한 해 동안 최고가를 70번 새로 썼는데요.","start":287.999,"end":293.161},{"n":64,"part":"선택 4","text":"뉴스에선 시중에 돈이 넘쳐 나, 내년에도 오른다는 전망이 이어집니다.","start":293.541,"end":297.961},{"n":65,"part":"선택 4","text":"당신은 마이너스 통장으로 2천만 원을 빌려, 지수를 더 살까 고민합니다.","start":298.341,"end":303.18},{"n":66,"part":"선택 4","text":"대출 이자보다 지수가 더 많이 오를 거라는 계산입니다.","start":303.56,"end":306.8},{"n":67,"part":"선택 4","text":"그럼 당신은 당분간 크게 떨어지지 않을 거라며, 돈을 빌려 지수를 더 매수하시겠습니까?","start":307.18,"end":312.498},{"n":68,"part":"선택 4","text":"아니면 오른 만큼 언제든 크게 떨어질 수 있다며, 돈을 빌리지 않으시겠습니까?","start":312.878,"end":317.388},{"n":69,"part":"선택 4","text":"선택해 보세요.","start":317.768,"end":318.708},{"n":70,"part":"선택 4","text":"3, 2, 1.","start":319.088,"end":321.268},{"n":71,"part":"선택 4","text":"이럴 때는 언제든 크게 떨어질 수 있다고 보고, 돈을 빌리지 않는 것이 옳은 선택입니다.","start":321.648,"end":326.576},{"n":72,"part":"선택 4","text":"때는 2021년 12월 31일, 지수는 사흘 뒤 최고가를 찍고 내려가기 시작했습니다.","start":326.956,"end":332.762},{"n":73,"part":"선택 4","text":"이씨가 그랬듯 빌려서 지수를 더 샀다면, 그 돈은 이듬해 10월엔 24% 줄었을 것입니다.","start":333.142,"end":339.032},{"n":74,"part":"선택 4","text":"원래대로 돌아오기까지 2년 가까이 걸렸을 것이고, 그동안 이자는 꼬박꼬박 나갔을 겁니다.","start":339.412,"end":345.022},{"n":75,"part":"선택 4","text":"빚이 없었다면, 하락은 견디기만 하면 되는 일이었습니다.","start":345.402,"end":348.847},{"n":76,"part":"선택 4","text":"물론 지수는 결국 다시 올랐으니, 빌려서 산 것도 괜찮아 보입니다.","start":349.227,"end":353.363},{"n":77,"part":"선택 4","text":"하지만 빌린 돈은 이자와 갚을 날이 있어서, 떨어질 때 버티기가 훨씬 어렵습니다.","start":353.743,"end":358.689},{"n":78,"part":"선택 4","text":"1990년 이후 S&P 500이 최고가를 쓴 716번을 살펴봤습니다.","start":359.069,"end":364.165},{"n":79,"part":"선택 4","text":"셋 중 한 번은, 2년 안에 그날보다 10% 넘게 하락했습니다.","start":364.545,"end":368.714},{"n":80,"part":"선택 4","text":"최고가가 이어질수록, 크게 떨어질 때를 미리 생각해 둬야 합니다.","start":369.094,"end":372.734},{"n":81,"part":"선택 4","text":"결국 옳은 선택은 오를 때도 떨어질 수 있다고 보고, 빚을 지지 않는 것입니다.","start":373.114,"end":377.557},{"n":82,"part":"선택 5","text":"한 달 뒤, 당신이 넉 달 전에 팔았던 그 종목은 최고가의 4분의 1 남짓이 됐습니다.","start":378.557,"end":383.902},{"n":83,"part":"선택 5","text":"커뮤니티엔 최고가를 생각하면, 지금이 바겐세일이라는 글이 많습니다.","start":384.282,"end":388.496},{"n":84,"part":"선택 5","text":"당신은 지수에 넣어 둔 2천만 원을 빼서, 이 종목을 다시 살까 고민합니다.","start":388.876,"end":393.696},{"n":85,"part":"선택 5","text":"그럼 당신은 최고가는 한때의 분위기가 만든 값이라며, 다시 매수하지 않으시겠습니까?","start":394.076,"end":399.192},{"n":86,"part":"선택 5","text":"아니면 최고가가 원래 값어치라며, 지수에서 뺀 돈으로 다시 매수하시겠습니까?","start":399.572,"end":404.54},{"n":87,"part":"선택 5","text":"선택해 보세요.","start":404.92,"end":405.86},{"n":88,"part":"선택 5","text":"3, 2, 1.","start":406.24,"end":408.42},{"n":89,"part":"선택 5","text":"이럴 때는 최고가를 한때의 분위기로 보고, 다시 매수하지 않는 것이 옳은 선택입니다.","start":408.8,"end":413.922},{"n":90,"part":"선택 5","text":"때는 2022년 1월 31일, 그 종목은 다시 줌이었습니다.","start":414.302,"end":418.309},{"n":91,"part":"선택 5","text":"이씨가 그랬듯 싸 보여서 다시 샀다면, 그 뒤 64%까지 하락했을 것입니다.","start":418.689,"end":423.713},{"n":92,"part":"선택 5","text":"2024년 말까지도 47% 손실일 것입니다.","start":424.093,"end":427.523},{"n":93,"part":"선택 5","text":"물론 최고가보다 크게 떨어진 종목은, 싸 보일 수밖에 없습니다.","start":427.903,"end":432.077},{"n":94,"part":"선택 5","text":"하지만 그 최고가는, 사람들이 몰려든 때의 분위기가 만든 값일 수 있습니다.","start":432.457,"end":436.935},{"n":95,"part":"선택 5","text":"최고가의 4분의 1에서 다시 최고가로 가려면, 3.7배가 올라야 합니다.","start":437.315,"end":442.015},{"n":96,"part":"선택 5","text":"줌은 지금도 최고가의 6분의 1 남짓입니다.","start":442.395,"end":445.402},{"n":97,"part":"선택 5","text":"결국 옳은 선택은 최고가를 싼지 비싼지의 기준으로 삼지 않는 것입니다.","start":445.782,"end":449.902},{"n":98,"part":"결과","text":"이 테스트에서 당신은 이씨와 같은 생각을 몇 번 하셨나요?","start":450.902,"end":454.312},{"n":99,"part":"결과","text":"한 번도 없었다면 오를 때도 들뜨지 않고 폭락에 미리 대비하는 사람으로, 통과입니다.","start":454.692,"end":460.008},{"n":100,"part":"결과","text":"한두 번이었다면 대비는 알지만 수익이 날 때 생각이 흔들리는 사람으로, 주의입니다.","start":460.388,"end":465.618},{"n":101,"part":"결과","text":"세 번 이상이면 이씨처럼 수익이 나도 결국 손실을 볼 확률이 높은 사람으로, 불통과입니다.","start":465.998,"end":471.23},{"n":102,"part":"정리","text":"이 테스트에서 알 수 있듯이, 유비무환이라는 말처럼 오를 때일수록 폭락을 미리 대비하는 쪽이 주식으로 부자가 되는 길이라는 것을 알아두세요.","start":472.23,"end":480.458},{"n":103,"part":"정리","text":"그럼 모두 성공 투자 하시기 바랍니다.","start":480.838,"end":483.048},{"n":104,"part":"정리","text":"시청해주셔서 감사합니다.","start":483.428,"end":484.958}],"subs":[[0.2,5.166,"주식이 오를 때 드는 생각 하나가,\n다음 폭락에서 계좌를 무너뜨릴 수 있습니다."],[5.166,10.605,"이씨는 한 종목으로 계좌를 1억 원까지 불려,\n주변에서 고수로 불리던 사람인데요."],[10.605,14.165,"그 1억 원은 4년 뒤, 3천2백만 원이 됐습니다."],[14.165,18.232,"그사이 S&P 500 지수는 50% 넘게 올랐는데도 말이죠."],[18.232,23.056,"이씨를 무너뜨린 건 폭락 자체가 아니라,\n오를 때마다 했던 생각들이었습니다."],[23.056,28.211,"이씨에게 찾아온 다섯 가지 생각 앞에서,\n당신이라면 어떻게 할지 골라 보세요."],[28.211,32.324,"고를 때마다, 이씨와 같은 생각을 했는지 세어 보시면 됩니다."],[32.324,37.825,"고수로 불리던 이씨의 자리에서,\n첫 번째 생각부터 당신이 골라 보겠습니다."],[37.825,41.851,"당신은 1년 전, 모아 둔 돈을 모두 한 종목에 넣었습니다."],[41.851,46.541,"그 종목이 1년 만에 5배 가까이 오르면서, 계좌는 1억 원이 됐는데요."],[46.541,52.301,"코로나로 재택근무와 원격 수업이 늘자,\n화상 회의 회사 주가가 뛰었기 때문입니다."],[52.301,55.961,"같은 해 S&P 500 지수는 16% 올랐습니다."],[55.961,60.175,"주변에선 당신을 주식 고수라 부르며, 다음 종목을 물어봅니다."],[60.175,65.205,"그럼 당신은 내가 잘 골라서 번 거라며,\n이 종목을 그대로 두시겠습니까?"],[65.205,70.457,"아니면 분위기 덕에 운이 좋았을 뿐이라며,\n일부를 매도해 번 돈을 확정하시겠습니까?"],[70.457,71.777,"선택해 보세요."],[71.777,74.337,"3, 2, 1."],[74.337,80.101,"이럴 때는 운이 좋았다고 보고,\n일부를 매도해 번 돈을 확정하는 것이 옳은 선택입니다."],[80.101,85.481,"때는 2020년 12월 31일, 그 종목은 화상 회의 회사 줌이었습니다."],[85.481,91.736,"이씨가 그랬듯 실력이라 믿고 그대로 뒀다면,\n줌은 그 뒤 84%까지 하락했을 것입니다."],[91.736,95.015,"4년 뒤까지도 76% 손실일 것입니다."],[95.015,98.005,"물론 정말 실력이 좋아서 번 사람도 있습니다."],[98.005,102.335,"하지만 실력인지 운인지는, 오를 때가 아니라 떨어질 때 드러납니다."],[102.335,108.334,"지금 S&P 500에 속한 회사 가운데,\n2020년에 2배 넘게 오른 곳은 14개였습니다."],[108.334,112.218,"그 가운데 9개는, 2년 안에 주가가 반 토막이 났죠."],[112.218,116.098,"운을 실력으로 믿으면, 한 종목에 더 크게 걸게 됩니다."],[116.098,122.553,"결국 옳은 선택은 큰 수익을 운으로 보고,\n오른 종목의 일부를 매도해 확정하는 것입니다."],[122.553,127.611,"6주 뒤, 그 종목이 또 올라 당신의 계좌는 28% 더 늘었습니다."],[127.611,131.803,"당신은 그사이 번 2천8백만 원을 어디에 둘지 고민합니다."],[131.803,136.843,"눈여겨본 곳은, 1년 만에 주가가 5배 넘게 오른 운동 기구 회사인데요."],[136.843,141.38,"집에서 하는 운동이 유행하면서, 실내 자전거가 불티나게 팔렸습니다."],[141.38,146.3,"인터넷엔 번 돈으로 이런 종목을 사서,\n또 몇 배를 벌었다는 글이 넘쳐 납니다."],[146.3,152.179,"그럼 당신은 번 돈도 원금처럼 아껴,\n이 운동 기구 회사는 매수하지 않으시겠습니까?"],[152.179,156.892,"아니면 번 돈은 잃어도 괜찮다며,\n그 돈으로 이 회사를 매수하시겠습니까?"],[156.892,158.212,"선택해 보세요."],[158.212,160.772,"3, 2, 1."],[160.772,166.482,"이럴 때는 번 돈도 원금처럼 아껴,\n이 회사는 매수하지 않는 것이 옳은 선택입니다."],[166.482,171.686,"때는 2021년 2월 12일, 그 운동 기구 회사는 펠로톤이었습니다."],[171.686,178.621,"이씨가 그랬듯 번 돈으로 펠로톤을 매수했다면,\n2022년 말엔 95%가 사라졌을 것입니다."],[178.621,182.372,"2024년 말까지도 94% 손실일 것입니다."],[182.372,187.015,"물론 번 돈은 처음부터 없던 돈 같아서, 잃어도 덜 아프게 느껴집니다."],[187.015,191.735,"하지만 계좌에 찍힌 돈은 번 돈이든 원금이든, 똑같은 내 돈입니다."],[191.735,197.231,"94%를 잃은 돈이 원래대로 돌아가려면, 18배 가까이 올라야 합니다."],[197.231,203.311,"결국 옳은 선택은 번 돈도 원금처럼 여기고,\n유행하는 종목에 걸지 않는 것입니다."],[203.311,208.532,"일곱 달 뒤, 당신의 그 종목은 최고가보다 54% 하락해 있습니다."],[208.532,214.42,"당신은 이 종목을 모두 매도하고,\n그 돈을 누구나 아는 큰 회사로 옮길까 고민합니다."],[214.42,218.23,"그 회사 주가는 1년 반 만에 2배 가까이 올랐는데요."],[218.23,222.01,"새로 시작한 영상 서비스 가입자도 빠르게 늘고 있습니다."],[222.01,227.096,"주변에선 이런 회사는 망할 일이 없으니,\n한 곳에 넣어도 안전하다고들 합니다."],[227.096,232.976,"그럼 당신은 큰 회사도 반 토막 날 수 있다며,\n판 돈을 여러 회사에 나눠 두시겠습니까?"],[232.976,238.418,"아니면 누구나 아는 큰 회사라 안전하다며,\n판 돈을 모두 이 회사에 넣으시겠습니까?"],[238.418,239.738,"선택해 보세요."],[239.738,242.298,"3, 2, 1."],[242.298,247.758,"이럴 때는 큰 회사도 반 토막 날 수 있다고 보고,\n나눠 두는 것이 옳은 선택입니다."],[247.758,252.142,"때는 2021년 9월 30일, 그 회사는 디즈니였습니다."],[252.142,258.523,"이씨가 그랬듯 줌을 판 돈을 모두 디즈니에 넣었다면,\n그 뒤 53%까지 하락했을 것입니다."],[258.523,262.208,"2024년 말까지도 33% 손실일 것입니다."],[262.208,266.033,"물론 큰 회사는 작은 회사보다 쉽게 망하지 않습니다."],[266.033,271.163,"하지만 회사가 망하지 않는 것과,\n주가가 떨어지지 않는 것은 다른 이야기입니다."],[271.163,277.336,"이듬해인 2022년엔 메타가 74%, 아마존도 51%까지 하락했습니다."],[277.336,281.809,"이름이 알려졌다고 해서, 한 회사에 몰아 둘 만큼 안전한 건 아니죠."],[281.809,287.999,"결국 옳은 선택은 큰 회사도 크게 떨어질 수   const [x, y, w, h] = area, n = arr.length, X = o.X || ((d, i) => x + w * i / (n - 1));
  const yv = v => y + h * (1 - (v - lo) / (hi - lo));
  const pts = arr.map(([d, v], i) => [X(d, i), yv(v)]);
  const ox = p._x, oy = p._y, f1 = v => v.toFixed(1);
  const P = pts.map((q, i) => `${i ? "L" : "M"}${f1(q[0] - ox)} ${f1(q[1] - oy)}`).join(" ");
  const id = `clp${++CID}`, by = yv(o.base == null ? 1 : o.base) - oy;
  let A = "";
  if (o.fill === "loss") A = `<clipPath id="${id}b"><rect x="-10" y="${f1(by)}" width="${p._w + 20}" height="${p._h + 400}"/></clipPath><path clip-path="url(#${id}b)" d="${P} L${f1(pts[n - 1][0] - ox)} ${f1(by)} L${f1(pts[0][0] - ox)} ${f1(by)} Z" fill="rgba(179,32,42,.16)"/>`;
  else if (o.fill === "under") A = `<path d="${P} L${f1(pts[n - 1][0] - ox)} ${f1(y + h - oy)} L${f1(pts[0][0] - ox)} ${f1(y + h - oy)} Z" fill="${o.fillCol || "rgba(34,199,176,.14)"}"/>`;
  const s = el(`<svg class="a" width="${p._w}" height="${p._h}" viewBox="0 0 ${p._w} ${p._h}" style="left:0;top:0;overflow:visible" aria-hidden="true"><defs><clipPath id="${id}"><rect x="${f1(x - ox - 24)}" y="-300" width="0" height="${p._h + 600}"/></clipPath></defs><g clip-path="url(#${id})">${A}<path d="${P}" fill="none" stroke="${o.col}" stroke-width="${o.w || 8}" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`, p);
  tl.fromTo(s.querySelector(`#${id} rect`), { attr: { width: 0 } }, { attr: { width: w + 48 }, duration: o.dur || 1.4, ease: "power1.inOut" }, o.at);
  return { pts, yv, s, X };
}
function seg(p, A, B, c, w, dash, at) {
  const s = el(`<svg class="a" width="${p._w}" height="${p._h}" style="left:0;top:0;overflow:visible" aria-hidden="true"><line x1="${A[0] - p._x}" y1="${A[1] - p._y}" x2="${B[0] - p._x}" y2="${B[1] - p._y}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/></svg>`, p);
  fadeIn(s, at); return s;
}
const baseLine = (p, area, yv, at, v) => seg(p, [area[0], yv(v == null ? 1 : v)], [area[0] + area[2], yv(v == null ? 1 : v)], GO, 5, "16 11", at);
function dotAt(p, x, y, c, at) { const n = el(`<div class="dotc" style="left:${(x - p._x - 17).toFixed(1)}px;top:${(y - p._y - 17).toFixed(1)}px;background:${c}"></div>`, p); popIn(n, at, { s0: 0.3 }); return n; }
const ANC = { ul: ["-100%,-100%", -18, -24], ur: ["0,-100%", 18, -24], dl: ["-100%,0", -18, 24], dr: ["0,0", 18, 24], r: ["0,-50%", 30, 0], l: ["-100%,-50%", -30, 0], u: ["-50%,-100%", 0, -28], d: ["-50%,0", 0, 28], c: ["-50%,-50%", 0, 0] };
function noteAt(p, html, cls, x, y, at, pos, css) {
  const [tf, dx, dy] = ANC[pos || "c"];
  const n = el(`<div class="note ${cls}" style="left:${(x - p._x + dx).toFixed(1)}px;top:${(y - p._y + dy).toFixed(1)}px;transform:translate(${tf});${css || ""}">${html}</div>`, p);

}
function axLab(p, txt, x, y, at, right, c) { const n = el(`<div class="ax" style="left:${x - p._x}px;top:${y - p._y}px;${right ? "transform:translateX(-100%);" : ""}${c ? `color:${c};` : ""}">${txt}</div>`, p); fadeIn(n, at); return n; }
function dateAxis(area, d0, d1) { const t = d => Date.parse(d), [x, , w] = area; return d => +(x + w * (t(d) - t(d0)) / (t(d1) - t(d0))).toFixed(1); }

const COUNT_HTML = d => `<div class="w9 nw" style="width:150px;height:150px;border-radius:50%;border:8px solid #FFD400;color:#FFD400;background:rgba(10,16,30,.92);font-size:100px;line-height:134px;text-align:center;box-sizing:border-box;box-shadow:0 18px 40px -14px rgba(0,0,0,.8)">${d}</div>`;

const brk = t => t.replace(/^([^,]+,)\s*/, "$1<br>");     // 쉼표 뒤에서 줄을 바꿈 (보기 글은 '…라며, …하시겠습니까?' 꼴)

const emW = t => Array.from(t).reduce((a, ch) => a + (/[가-힣]/.test(ch) ? 0.92 : ch === " " ? 0.27 : ch === "," ? 0.35 : ch === "?" ? 0.53 : 0.6), 0);

  const hn = hs.map(([h, at]) => { const n = el(`<div>${h}</div>`, hdr); popIn(n, at); return n; });
  const area = [nb._x + 130, nb._y + 220, nb._w - 470, nb._h - 330];
  const X = dateAxis(area, sp.arr[0][0], sp.arr[sp.arr.length - 1][0]);

  baseLine(nb, area, L.yv, a + 0.35);

  const P = dd => [X(dd), L.yv(valOn(sp.arr, dd))];
  for (const m of sp.marks) { const [x, y] = P(m.d); dotAt(nb, x, y, m.col || CR, m.at); noteAt(nb, m.lab, m.cls || "r", x, y, m.at, m.pos); }
  if (sp.extra) sp.extra(nb, area, L, P, hn);

  const c = C[4], a = ch(c.first), b = until(c.qa), n = i => c.first + i;
  let P, cur;
  const { sc, st } = stage(a, b, "YEND", s => { P = [act(s, "H_PHONE", "HERO_S", 5.2).ro(5), act(s, "H_THINK", "HERO_S", 5.2).ro(5), act(s, "H_EAGER", "HERO_S", 5.2).ro(5)]; });
  st.update = t => { cur = heroRun(P, t, a, [[0, 0], [S(n(2)), 1], [S(n(3)), 2]]); };
  const t70 = W(n(0), "70번");
  const m = mini(sc, S(n(0)), S(n(2)) - 0.2, { lo: 0.95, hi: 1.33, right: "2021", big0: sn(NUM.c4_rec21, GOD, 84) + ss("HIGH", GOD, 44),
    lines: [{ arr: SR.c4_spx2021, col: TE, at: S(n(0)) + 0.15, dur: Math.max(1.4, t70 - S(n(0)) + 0.4) }] });
  gsap.set(m.d.firstElementChild, { opacity: 0 }); fadeIn(m.d.firstElementChild, t70);
  { const L = m.L[0], X = L.X;   // 그해 최고가를 새로 쓴 날마다 금색 점
    const svg = el(`<svg class="a" width="${m.d._w}" height="${m.d._h}" style="left:0;top:0;overflow:visible" aria-hidden="true">${SR.c4_records.map(d => `<circle cx="${(X(d) - m.d._x).toFixed(1)}" cy="${(L.yv(valOn(SR.c4_spx2021, d)) - m.d._y).toFixed(1)}" r="6" fill="${GO}" stroke="${INK}" stroke-width="2"/>`).join("")}</svg>`, m.d);
    tl.fromTo(svg.querySelectorAll("circle"), { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.012 }, t70 - 0.5); }
  tagSeq(sc, "TAG1", [[W(n(2), "2천만"), stk(ss("LOAN", CR, 56) + sn(NUM.c4_loan, INK, 58), { v: true, rot: -2 })]]);
  pbSeq(sc, [[S(n(1)) + 0.05, col(prop("P-TV", 120, 200), ss("2022 ▲", TED, 52))], [S(n(2)) + 0.05, col(prop("P-BANKBOOK", 120, 220), ss("LOAN", CR, 52))], [S(n(3)) + 0.05, col(ss("S&amp;P 500 ▲", TED, 50), ss("&gt;", INK, 50), ss("LOAN %", CR, 50))]]);
  headMark(st, sc, "HEAD_S", () => cur, HM("?", GOD), S(n(2)) + 0.3, S(n(3)) - 0.1);
  K.cut(E(n(0)) - 0.1, "선택 4 2021 HIGH 70"); K.cut(E(n(1)) - 0.1, "선택 4 뉴스 2022 ▲"); K.cut(E(n(2)) - 0.1, "선택 4 LOAN ₩20,000,000"); K.cut(E(n(3)) - 0.1, "선택 4 S&P 500 > LOAN %");
}
question(C[4], "YEND", 0);
wrongNote(C[4], "YEND", 0, { arr: SR.c4_wrong, lo: 0.6, hi: 1.4, d0: "2021.12.31", yearWord: "2021년", tick: "S&amp;P 500", tickWord: "지수는", act: "LOAN", worstWord: "24%",
  marks: [{ d: DT.spx_peak, lab: "HIGH", cls: "y", col: GO, at: W(C[4].date, "사흘"), pos: "ur" }, { d: DT.c4_low, lab: NUM.c4_worst, at: W(C[4].wrong, "24%"), pos: "dr" }],
  extra: (nb, area, L, P, hn) => {
    const c = C[4], [x0] = P(DT.d4), [x1, yb] = P(DT.c4_back), y = L.yv(1) - 160, tY = W(c.wrong + 1, "2년"), tI = W(c.wrong + 1, "이자");   // 괄호 = 기준선 위 160px (HIGH 꼬리표·선과 안 겹침)
    seg(nb, [x0, y], [x1, y], CR, 6, "14 10", tY); seg(nb, [x0, y - 18], [x0, y + 18], CR, 6, null, tY); seg(nb, [x1, y - 18], [x1, y + 18], CR, 6, null, tY);
    dotAt(nb, x1, yb, GO, tY);
    noteAt(nb, `${NUM.c4_years}Y`, "k", (x0 + x1) / 2, y, tY, "u");
    for (let i = 0; i < 6; i++) { const xi = x0 + (x1 - x0) * (i + 0.5) / 6, nd = el(`<div class="a sb" style="left:${(xi - nb._x - 22).toFixed(1)}px;top:${(y - nb._y + 12).toFixed(1)}px;width:44px;height:44px;border-radius:50%;background:${CR};color:#FFF7E6;font-size:36px;display:grid;place-items:center">%</div>`, nb); popIn(nd, tI + 0.12 * i, { s0: 0.3 }); }
    const t75 = S(c.wrong + 2);
    tl.to(hn[2], { opacity: 0.35, duration: 0.3 }, t75);
    noteAt(nb, "HOLD ✓", "g", x1, yb, t75 + 0.1, "dr");
  } });
rebut(C[4], "YEND", 0, [
  [S(C[4].but0) + 0.2, "", (nd, at) => { miniIn(nd, SR.c4_wrong, 0.6, 1.4, TE, at + 0.1, 1.2, { base: 1, w: 860, h: 400, top: 60 }); }],
  [S(C[4].but) + 0.1, row(ss("LOAN", CR, 120), ss("=", INK, 110), ss("% + DAY", CR, 120))],
  [S(C[4].but + 1) + 0.05, col(row(ss("1990", INK, 70), ss("→", INK, 70), ss("HIGH", GOD, 70)), sn(NUM.c4_days, INK, 190))],
  [S(C[4].but + 2) + 0.05, col(row(`<div style="width:150px;height:150px;border-radius:50%;background:${CR};border:6px solid ${INK};display:grid;place-items:center">${ss("−10%", "#FFF7E6", 46)}</div>`, dotGrid(2, 2, 150, "#E9E3D6")), sn(`${NUM.c4_fell10} / ${NUM.c4_days}`, CR, 110))],
  [S(C[4].but + 3) + 0.05, row(ss("HIGH ▲", GOD, 110), ss("→", INK, 100), ss("PLAN ▼", TED, 110))],
]);
concl(C[4], "YEND", 0);

/* ── 선택 5: 최고가가 제값? · 2022-01-31 다시 줌 ── */
{
  const c = C[5], a = ch(c.first), b = until(c.qa), n = i => c.first + i;
  let P, CW, cur;
  const { sc, st } = stage(a, b, "YEND", s => { P = [act(s, "H_PHONE", "HERO_S", 5.2).ro(5), act(s, "H_THINK", "HERO_S", 5.2).ro(5)]; CW = act(s, "W_CROWD", "CROWD_S", 3.3).ro(3); }, { bgx: 1.8 });
  st.update = t => { cur = heroRun(P, t, a, [[0, 0], [S(n(1)), 1]]); enter(CW, t, S(n(1)) + 0.05); if (t > S(n(1)) + 0.4) CW.bob(t, 0.08, 2.2); };
  mini(sc, S(n(0)), S(n(2)) - 0.2, { lo: 0.1, hi: 1.12, base: 1, right: "HIGH", big0: sn(NUM.c5_zm, CR, 84),
    lines: [{ arr: SR.c5_zm_fall, col: CR, at: S(n(0)) + 0.15, dur: Math.max(1.2, W(n(0), "4분의 1") - S(n(0))), fill: "loss" }] });
  // '지수에 넣어 둔 2천만 원' — 그날(2022-01-31) 실제 값은 2천만 원보다 적음(약 ₩18,970,000) → 금액은 화면에 쓰지 않고 '지수 매도'만 (보고서에 적음)
  tagSeq(sc, "TAG1", [[W(n(2), "2천만"), stk(ss("S&amp;P 500", INK, 54) + ss("SELL ?", CR, 60), { v: true, rot: -2 })]]);
  pbSeq(sc, [[S(n(0)) + 0.1, prop("P-VIDEOCALL", 150, 250) + ss("▼", CR, 84)], [S(n(1)) + 0.05, prop("P-SALETAG", 160, 150) + ss("SALE", CR, 60)], [S(n(2)) + 0.05, col(ss("S&amp;P 500", INK, 44), row(ss("→", INK, 56), prop("P-VIDEOCALL", 110, 160)))]]);
  headMark(st, sc, "HEAD_S", () => cur, HM("?", GOD), S(n(2)) + 0.3);
  K.cut(E(n(0)) - 0.1, "선택 5 HIGH 27%"); K.cut(E(n(1)) - 0.1, "선택 5 SALE 무리"); K.cut(E(n(2)) - 0.1, "선택 5 S&P 500 → ?");
}
question(C[5], "YEND", 1.8);
wrongNote(C[5], "YEND", 1.8, { arr: SR.c5_wrong, lo: 0.1, hi: 1.2, d0: "2022.01.31", yearWord: "2022년", tick: "ZM", tickWord: "다시 줌", act: "BUY", worstWord: "64%",
  marks: [{ d: DT.c5_low, lab: NUM.c5_worst, at: W(C[5].wrong, "64%"), pos: "dl" }, { d: DT.end, lab: NUM.c5_end, at: W(C[5].wrong + 1, "47%"), pos: "r" }] });
rebut(C[5], "YEND", 1.8, [
  [S(C[5].but0) + 0.2, row(prop("P-SALETAG", 260, 280), ss("SALE ?", GOD, 120))],
  [S(C[5].but) + 0.1, row(prop("W-CROWD", 230, 420), ss("=", INK, 110), ss("HIGH", CR, 120))],
  [S(C[5].but + 1) + 0.05, row(barPair(SR.c5_zm_fall[SR.c5_zm_fall.length - 1][1], CR, ss(NUM.c5_zm, CR, 70), "HIGH"), ss("→", INK, 110), sn(NUM.c5_need, GOD, 150))],
  [S(C[5].but + 2) + 0.05, "", (nd, at) => {
    const q = miniIn(nd, SR.c5_zm_now, 0, 1.12, CR, at + 0.1, 1.3, { base: 1, w: 900, h: 420, top: 70, fill: "loss", rightPad: 200 });
    const e = q.L.pts[q.L.pts.length - 1];
    axLab(q.card, "HIGH", q.area[0], q.L.yv(1) - 50, at + 0.1, false, GOD);
    dotAt(q.card, e[0], e[1], CR, W(C[5].but + 2, "6분의 1")); noteAt(q.card, `NOW ${NUM.c5_now}`, "r", e[0], e[1], W(C[5].but + 2, "6분의 1"), "r");
  }],
]);
concl(C[5], "YEND", 1.8);

/* ═════════════ 결과 (문장 98~101) — 생각 말풍선 셋: 이씨와 같은 생각 0 · 1~2 · 3+ ═════════════ */
{
  const r0 = firstOf("결과"), a = ch(r0), b = ch(firstOf("정리"));
  let P, cur;
  const { sc, st } = stage(a, b, "WFH", s => { P = [act(s, "H_THINK", "HERO_R", 5.2).ro(5), act(s, "H_PLAN", "HERO_R", 5.2).ro(5), act(s, "H_DESP", "HERO_R", 4.2).ro(5)]; }, { tint: DIM, bgx: 1.2 });
  st.update = t => { cur = heroRun(P, t, a, [[0, 0], [S(r0 + 1), 1], [S(r0 + 2), 0], [S(r0 + 3), 2]]); };
  headMark(st, sc, "HEAD_R", () => cur, HM("?", GOD), S(r0) + 0.2, S(r0 + 1) - 0.1);
  const RES = [["RA", "0", "PASS", TE, TED], ["RB", "1–2", "CAUTION", GO, GOD], ["RC", "3+", "FAIL", CR, CR]];
  RES.forEach(([slot, cnt, word, c, ct], i) => {
    const d = bubble(sc, slot, { body: [6, 6, 1288, 218], pad: [80, 26], at: S(r0 + 1 + i) + 0.05, stroke: INK,
      html: `<div style="display:flex;align-items:center;gap:18px">${ss("LEE", CR, 56)}${sn("× " + cnt, INK, 96)}</div><div style="flex:1"></div>${ss(word, ct, 96)}` , css: "justify-content:space-between" });
    olTo(d, c, S(r0 + 1 + i) + 0.3);
    K.cut(E(r0 + 1 + i) - 0.1, `결과 ${word}`);
  });
}

/* ═════════════ 정리 (문장 102) — 유비무환: 이씨 길(진홍) · 미리 대비한 길(청록) ═════════════ */
{
  const n = firstOf("정리"), a = ch(n), b = until(n + 1), prep = W(n, "대비하는");
  const { sc } = stage(a, b, "WFH", null, { tint: DARK });
  const nb = notebook(sc, "NOTE", a + 0.1);
  const hdr = el(`<div class="a" style="left:60px;top:66px;display:flex;align-items:center;gap:30px"></div>`, nb);
  popIn(el(`<div>${stk(ss("LEE", CR, 52), { rot: -2, bg: "#F8D2CC" })}</div>`, hdr), S(n) + 0.3);
  popIn(el(`<div>${stk(ss("PLAN ✓", TED, 52), { rot: 2, bg: "#CBEFE7" })}</div>`, hdr), prep);
  const area = [nb._x + 130, nb._y + 220, nb._w - 520, nb._h - 330], lo = 0.0, hi = 1.75;
  const X = dateAxis(area, DT.d1, DT.end);
  const L1 = lineChart(nb, area, SR.end_lee, lo, hi, { col: CR, w: 9, at: S(n) + 0.4, dur: 2.2, fill: "loss", X });
  baseLine(nb, area, L1.yv, a + 0.35);
  axLab(nb, NUM.acc0, area[0] + area[2] - 8, L1.yv(1) + 16, a + 0.4, true, GOD);     // 기준선 오른쪽 끝 아래 (선과 안 겹침)
  axLab(nb, "2020.12", area[0], area[1] + area[3] + 26, a + 0.35); axLab(nb, "2024.12", area[0] + area[2], area[1] + area[3] + 26, a + 0.35, true);
  const e1 = L1.pts[L1.pts.length - 1]; noteAt(nb, NUM.lee_end, "r", e1[0], e1[1], S(n) + 2.6, "r");
  const L2 = lineChart(nb, area, SR.end_right, lo, hi, { col: TE, w: 10, at: prep, dur: Math.max(1.6, E(n) - prep - 1.2), X });
  const e2 = L2.pts[L2.pts.length - 1]; noteAt(nb, "✓", "g", e2[0], e2[1], E(n) - 1.0, "r");
  K.cut(prep - 0.2, "정리 LEE ₩31,860,000"); K.cut(E(n) - 0.1, "정리 PLAN ✓");
}
{ // 인사 — 눈 내리는 연말 거리 · HERO_C
  const n = firstOf("정리") + 1, a = until(n), b = K.D;
  let HB;
  const { st } = stage(a, b, "YEND", s => { HB = act(s, "H_BOW", "HERO_C", 5.2).ro(4); }, { keep: true });
  st.update = t => { enter(HB, t, S(n) + 0.1); const k = sm(lin(t, S(n + 1), S(n + 1) + 0.6)); HB.g.rotation.z = 0.15 * Math.sin(k * Math.PI); };
  const snow = st.part(Puppet.floaters({ n: 140, x: [-13, 13], z: [-8, 5], hgt: 12, speed: [-0.9, -0.35], size: 0.2, inner: "rgba(255,255,255,1)", outer: "rgba(255,255,255,0)", opacity: 0.85 }));
  snow.obj.position.y = 12;                       // 내려오는 눈 (speed 음수 → y 가 0 ~ −12 를 돌므로 12 만큼 올림)
  K.cut(E(n + 1) - 0.1, "인사");
}
K.done();
})();
</script>
