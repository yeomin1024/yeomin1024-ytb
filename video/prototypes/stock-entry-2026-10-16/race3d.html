<!-- VERSION: v1.0 — 2026-10-16 — 주식 1번 v2 '시험 장면' 시안 (한 장 확인용). 사용자 지시 2026-10-16 "buy and hold랑 비교하지말고 주가 차트에서
     매수/매도 지점을 표시하는 걸로 하자 buy, sell 문구 붙여서 표시하고 오른쪽 A,B 박스 밑에 있는 박스 3개는 뭔 내용인지 모르겠어 그리고 설명할 때
     영상이 왤케 부실해 아니 좀 입체적으로 표현 하는 도구 없어? … 일단 이미지만 1개만 나한테 보여줘봐 테스트 영상 부분만".

     연구·교육용 — 투자 권유 아님. -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entry test 3D</title>
<style>
@font-face{font-family:"Noto Sans KR";font-weight:500;src:url(../../public/fonts/NotoSansKR-500.ttf) format("truetype")}
@font-face{font-family:"Noto Sans KR";font-weight:700;src:url(../../public/fonts/NotoSansKR-700.ttf) format("truetype")}
@font-face{font-family:"Noto Sans KR";font-weight:900;src:url(../../public/fonts/NotoSansKR-900.ttf) format("truetype")}
:root{--Y:#FFD400;--G:#2BE0A0;--G2:#16A87A;--O:#FF8A3D;--R:#FF4D5E;--N:#93A0B8;--C:#EAF0F8}
html,body{margin:0;background:#05080F}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--C);font-family:"Noto Sans KR",sans-serif;line-height:1.15;
  background:radial-gradient(1400px 900px at 36% 30%,#18284A 0%,#0B1428 55%,#050913 100%)}
#stage *{box-sizing:border-box}
.nw{white-space:nowrap}.tab{font-variant-numeric:tabular-nums}
#gl{position:absolute;left:0;top:118px;width:1330px;height:950px}
#ov{position:absolute;left:0;top:118px;width:1330px;height:950px;pointer-events:none}
/* 머리 */
#hd{position:absolute;left:36px;top:26px;display:flex;gap:18px;align-items:center}
.no{width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,#FFE24D,#E8B800);color:#1A1300;font:900 44px/72px "Noto Sans KR";text-align:center;
  box-shadow:0 10px 26px rgba(255,212,0,.25),inset 0 -5px 0 rgba(0,0,0,.18)}
.rule{display:flex;align-items:center;gap:14px;height:72px;padding:0 26px;border-radius:22px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);font:900 40px/1 "Noto Sans KR"}
.tag{display:inline-block;font:900 30px/1 "Noto Sans KR";padding:10px 16px 9px;border-radius:12px;letter-spacing:.5px}
.tag.b{background:var(--G);color:#03231A}.tag.s{background:var(--O);color:#2A1100}
.sellrule{display:flex;align-items:center;gap:12px;height:72px;padding:0 22px;border-radius:22px;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.16);font:700 30px/1 "Noto Sans KR";color:var(--N)}
#date{position:absolute;left:1352px;top:22px;width:540px;text-align:right;font:900 76px/1 "Noto Sans KR";letter-spacing:1px;text-shadow:0 6px 30px rgba(0,0,0,.5)}
#date small{display:block;font:700 26px/1.4 "Noto Sans KR";color:var(--N);letter-spacing:0}
/* 차트 위 글자 */
.lab{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
.pin{display:flex;flex-direction:column;align-items:center;gap:5px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.pin .tag{font-size:24px;padding:8px 12px 7px;border-radius:10px}
.pin .v{font:900 26px/1 "Noto Sans KR";padding:6px 10px;border-radius:9px;background:rgba(5,10,22,.82);border:1.5px solid rgba(255,255,255,.14)}
.pin .v.up{color:var(--G)}.pin .v.dn{color:var(--R)}.pin .v.px{color:#DDE5F2;font-size:22px}
.ax{font:700 22px/1 "Noto Sans KR";color:#7F8BA3}
.axy{font:700 21px/1 "Noto Sans KR";color:#6F7C95;transform:translate(-50%,-50%)}
.legend{position:absolute;font:700 22px/1 "Noto Sans KR";display:flex;align-items:center;gap:10px;color:#C9D2E2}
.sw{display:inline-block;width:34px;height:16px;border-radius:5px}
.cur{position:absolute;transform:translate(-50%,-100%);font:900 30px/1 "Noto Sans KR";color:#fff;padding:9px 14px;border-radius:12px;background:rgba(255,212,0,.16);border:2px solid rgba(255,212,0,.65);white-space:nowrap}
.thr{position:absolute;transform:translate(0,-50%);font:900 24px/1 "Noto Sans KR";color:var(--Y);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.8)}
/* 오른쪽 카드 */
#side{position:absolute;left:1352px;top:120px;width:540px;display:flex;flex-direction:column;gap:22px;perspective:1600px}
.card{position:relative;border-radius:26px;padding:24px 28px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1.5px solid rgba(255,255,255,.13);box-shadow:0 24px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);transform:rotateY(-7deg);transform-origin:left center}
.ch{display:flex;align-items:center;gap:12px;font:700 24px/1 "Noto Sans KR";color:var(--N);margin-bottom:14px}
.ic{width:40px;height:40px;flex:0 0 40px}
.big{font:900 64px/1 "Noto Sans KR";letter-spacing:-.5px}
.mid{font:900 34px/1 "Noto Sans KR"}
.sm{font:700 24px/1 "Noto Sans KR";color:var(--N)}
.row{display:flex;align-items:center;justify-content:space-between}
.up{color:var(--G)}.dn{color:var(--R)}
.bar{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:16px 0 10px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#16A87A,#2BE0A0)}
.tr{display:grid;grid-template-columns:34px 1fr 26px 1fr 112px;align-items:center;gap:8px;font:700 21px/1 "Noto Sans KR";padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}
.tr:first-of-type{border-top:0}
.tr .k{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);font:900 17px/30px "Noto Sans KR";text-align:center;color:var(--N)}
.tr .d b{font:900 16px/1 "Noto Sans KR";padding:4px 6px 3px;border-radius:6px;margin-right:6px;vertical-align:2px}
.tr .d b.b{background:var(--G);color:#03231A}.tr .d b.s{background:var(--O);color:#2A1100}
.tr .r{text-align:right;font:900 25px/1 "Noto Sans KR"}

</style></head>
<body><div id="stage">
  <canvas id="gl" width="1330" height="950"></canvas>
  <div id="ov"></div>
  <div id="hd"></div>
  <div id="date"></div>
  <div id="side"></div>
</div>
<script src="../../render/node_modules/three/build/three.min.js"></script>
<script src="../../../stock/source/eonje-maesu-2026-10/backtest/anim.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const RULE = Q.get("rule") || "dip10", DATE = Q.get("date") || "2023-09-29";
const R = AN.rules[RULE], N = AN.dates.length;
const NO = AN.order.indexOf(RULE) + 1;
let cur = AN.dates.findIndex(d => d >= DATE); if (cur < 0) cur = N - 1;

// ---------- 3D ----------
const W = 1330, H = 950;
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setPixelRatio(1); ren.setSize(W, H, false);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(27, W / H, 0.1, 200);
cam.position.set(2.0, 7.4, 27.5); cam.lookAt(0.15, 4.0, 0); cam.updateMatrixWorld(); cam.updateProjectionMatrix();   // 투영 전에 행렬을 갱신 (안 하면 글자 자리가 틀림)
const P0 = 1500, P1 = 7400, XW = 15.6, YH = 9.0, HZ = 0.7;          // 바닥 값·위 값·너비·높이·두께(반)
const X = i => -XW / 2 - 0.55 + XW * i / (N - 1), Y = p => (p - P0) / (P1 - P0) * YH;
const held = i => R.holding[i] === "1";

// 가격 벽: 앞면(아래 어둡게 → 위 밝게) + 지붕(두께가 보이게). 보유 = 초록, 현금 = 회색
function wall() {
  const fp = [], fc = [], rp = [], rc = [];
  const cG = [new THREE.Color("#0B3D33"), new THREE.Color("#22C79A")], cN = [new THREE.Color("#1A2336"), new THREE.Color("#4A5875")];
  const rG = new THREE.Color("#B9FFE8"), rN = new THREE.Color("#C9D3E6");
  for (let i = 0; i < N - 1; i++) {
    const x0 = X(i), x1 = X(i + 1), y0 = Y(AN.close[i]), y1 = Y(AN.close[i + 1]);
    const c = held(i + 1) ? cG : cN, r = held(i + 1) ? rG : rN;
    const tb = y => c[0].clone().lerp(c[1], Math.min(1, y / YH * 1.25));
    // 앞면 두 삼각형
    fp.push(x0, 0, HZ, x0, y0, HZ, x1, y1, HZ, x0, 0, HZ, x1, y1, HZ, x1, 0, HZ);
    [c[0], tb(y0), tb(y1), c[0], tb(y1), c[0]].forEach(k => fc.push(k.r, k.g, k.b));
    // 지붕
    rp.push(x0, y0, HZ, x0, y0, -HZ, x1, y1, -HZ, x0, y0, HZ, x1, y1, -HZ, x1, y1, HZ);
    const rr = r.clone().multiplyScalar(0.92), rb = r.clone().multiplyScalar(0.62);
    [rr, rb, rb, rr, rb, rr].forEach(k => rc.push(k.r, k.g, k.b));
  }
  const mk = (pos, col, op) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: op < 1, opacity: op, side: THREE.DoubleSide }));
    scene.add(m); return m;
  };
  return [mk(fp, fc, 0.93), mk(rp, rc, 1)];
}
// 굵은 선 (y 방향 폭) — 점선 가능
function ribbon(pts, w, color, z, dash, op) {
  const pos = [];
  let acc = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const [ax, ay] = pts[k], [bx, by] = pts[k + 1];
    const len = Math.hypot(bx - ax, by - ay);
    const on = !dash || Math.floor(acc / dash) % 2 === 0;
    acc += len;
    if (!on) continue;
    pos.push(ax, ay - w / 2, z, ax, ay + w / 2, z, bx, by + w / 2, z, ax, ay - w / 2, z, bx, by + w / 2, z, bx, by - w / 2, z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op ?? 1, side: THREE.DoubleSide, depthWrite: false }));
  scene.add(m); return m;
}
// 바닥·뒷벽 격자
function grid() {
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(XW + 2.4, 4), new THREE.MeshBasicMaterial({ color: "#0E1A31", transparent: true, opacity: .85 }));
  fl.rotation.x = -Math.PI / 2; fl.position.set(0, -0.01, 1.0); scene.add(fl);
  for (let y = 2000; y <= 7000; y += 1000) ribbon([[-XW / 2 - .6, Y(y)], [XW / 2 + .2, Y(y)]], 0.022, "#3B4C6E", -HZ - 0.02, 0, .8);
  AN.dates.forEach((d, i) => {                                       // 해마다 첫 거래일에 바닥 선
    if (i && d.slice(0, 4) !== AN.dates[i - 1].slice(0, 4)) {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(X(i), 0, -HZ), new THREE.Vector3(X(i), 0, 2.6)]);
      scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: "#2A3958", transparent: true, opacity: .9 })));
    }
  });
}
function sphere(x, y, z, r, color) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshBasicMaterial({ color }));
  m.position.set(x, y, z); scene.add(m);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(r * 2.1, 24, 16), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .18, depthWrite: false }));
  halo.position.copy(m.position); scene.add(halo);
  return m;
}
function stem(x, y0, y1, z, color) {
  const g = new THREE.CylinderGeometry(0.022, 0.022, Math.abs(y1 - y0), 8);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .9 }));
  m.position.set(x, (y0 + y1) / 2, z); scene.add(m);
}
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };

grid();
const [front, roof] = wall();
front.geometry.setDrawRange(0, cur * 6); roof.geometry.setDrawRange(0, cur * 6);
{ const m = new THREE.Mesh(front.geometry, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: .13, depthWrite: false, side: THREE.DoubleSide }));
  m.scale.y = -0.32; m.position.y = -0.02; scene.add(m); }
// 앞 모서리 밝은 선 (가격)
const edge = []; for (let i = 0; i <= cur; i++) edge.push([X(i), Y(AN.close[i])]);
ribbon(edge, 0.045, "#FFFFFF", HZ + 0.01, 0, .95);

const ov = document.getElementById("ov");
const lab = (html, x, y, z, cls, dx, dy) => { const [sx, sy] = proj(x, y, z); const e = document.createElement("div"); e.className = cls || "lab"; e.innerHTML = html;
  e.style.left = (sx + (dx || 0)) + "px"; e.style.top = (sy + (dy || 0)) + "px"; ov.appendChild(e); return e; };
const f0 = n => Math.round(n).toLocaleString("en-US"), f2 = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc = (r, d = 1) => (r >= 0 ? "+" : "−") + Math.abs(r * 100).toFixed(d) + "%";

// 규칙이 보는 선: 고점(★)과 고점 × 0.9 (노란 점선) — dip10 / dip20
if (RULE === "dip10" || RULE === "dip20") {
  const k = RULE === "dip10" ? 0.9 : 0.8, ath = [], thr = [];
  for (let i = 0; i <= cur; i++) { ath.push([X(i), Y(AN.lines.ath[i])]); thr.push([X(i), Y(AN.lines.ath[i] * k)]); }
  ribbon(ath, 0.03, "#FFD400", HZ + 0.03, 0, .55);
  ribbon(thr, 0.04, "#FFD400", HZ + 0.03, 0.22, .95);
  lab(`★ −${RULE === "dip10" ? 10 : 20}%`, X(cur) + 0.15, Y(AN.lines.ath[cur] * k), HZ, "thr", 10, 0);
}
// 거래 핀: BUY 는 선 아래, SELL 은 선 위 (붙어 있어도 겹치지 않게)
R.trades.forEach((t, n) => {
  if (t.b > cur) return;
  const xb = X(t.b), yb = Y(t.bp);
  sphere(xb, yb, HZ + 0.06, 0.12, "#2BE0A0");
  const low = yb - 1.25 < 1.25;                               // 바닥(연도 글자) 가까이면 위로
  const ly = low ? yb + 1.05 : yb - 1.25;
  stem(xb, low ? yb + 0.12 : yb - 0.12, ly, HZ + 0.06, "#2BE0A0");
  lab(`<div class="pin">${low ? "" : ""}<span class="tag b">BUY</span><span class="v px tab">${f0(t.bp)}</span></div>`, xb, ly, HZ + 0.06, "lab", 0, low ? -34 : 34);
  if (t.s <= cur && !(t.open && t.s >= cur)) {
    const xs = X(t.s), ys = Y(t.sp);
    sphere(xs, ys, HZ + 0.06, 0.12, "#FF8A3D");
    stem(xs, ys + 0.12, ys + 1.25, HZ + 0.06, "#FF8A3D");
    lab(`<div class="pin"><span class="v ${t.r >= 0 ? "up" : "dn"} tab">${pc(t.r)}</span><span class="tag s">SELL</span></div>`, xs, ys + 1.25, HZ + 0.06, "lab", 0, -34);
  }
});
// 지금 날짜: 노란 세로 막 + 점
{
  const xc = X(cur), yc = Y(AN.close[cur]);
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(0.05, YH + 0.6), new THREE.MeshBasicMaterial({ color: "#FFD400", transparent: true, opacity: .45, depthWrite: false }));
  pl.position.set(xc, (YH + 0.6) / 2, HZ + 0.02); scene.add(pl);
  sphere(xc, yc, HZ + 0.08, 0.16, "#FFFFFF");
  lab(`<span class="tab">${f2(AN.close[cur])}</span>`, xc, YH + 0.6, HZ + 0.02, "cur", 0, -4);
}
// 축 글자
for (let y = 2000; y <= 7000; y += 1000) lab(f0(y), XW / 2 + 0.25, Y(y), -HZ, "lab axy", 62, 0);
AN.dates.forEach((d, i) => { if (i && d.slice(0, 4) !== AN.dates[i - 1].slice(0, 4)) lab(d.slice(0, 4), X(i), 0, 2.2, "lab ax", 30, 0); });
lab(`<span style="font:900 26px/1 'Noto Sans KR';color:#AFC0DA">S&amp;P 500</span>`, XW / 2 - 0.4, Y(7000) + 0.55, -HZ, "lab");
// 범례: 초록 = BUY~SELL 사이 (주식), 회색 = 현금 ($)
{
  const lg = document.createElement("div"); lg.className = "legend"; lg.style.left = "48px"; lg.style.top = "898px";
  lg.innerHTML = `<span class="sw" style="background:linear-gradient(180deg,#22C79A,#0B3D33)"></span><span class="tag b" style="font-size:19px;padding:6px 9px">BUY</span><span>~</span><span class="tag s" style="font-size:19px;padding:6px 9px">SELL</span>
    <span class="sw" style="margin-left:30px;background:linear-gradient(180deg,#4A5875,#1A2336)"></span><span style="font:900 26px/1 'Noto Sans KR'">$</span>`;
  ov.appendChild(lg);
}
ren.render(scene, cam);

// ---------- 머리 ----------
const ICON = {
  dip: `<svg viewBox="0 0 48 48" width="46" height="46"><path d="M4 30 L16 12 L28 30 L34 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 4 l2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z" fill="#FFD400"/><path d="M30 36 l6 8 6-8z" fill="#2BE0A0"/></svg>`,
  cal: `<svg viewBox="0 0 48 48" width="40" height="40"><rect x="6" y="10" width="36" height="32" rx="6" fill="none" stroke="#93A0B8" stroke-width="4"/><path d="M6 20h36M16 6v8M32 6v8" stroke="#93A0B8" stroke-width="4" stroke-linecap="round"/></svg>`,
  wallet: `<svg class="ic" viewBox="0 0 48 48"><rect x="4" y="12" width="40" height="28" rx="7" fill="#22324F" stroke="#9FB1CF" stroke-width="3"/><path d="M8 12 L32 5 L35 12" fill="none" stroke="#9FB1CF" stroke-width="3" stroke-linejoin="round"/><rect x="30" y="21" width="14" height="10" rx="4" fill="#FFD400"/></svg>`,
  now: `<svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="#9FB1CF" stroke-width="3.5"/><path d="M24 13v12l8 5" fill="none" stroke="#FFD400" stroke-width="4" stroke-linecap="round"/></svg>`,
  log: `<svg class="ic" viewBox="0 0 48 48"><rect x="8" y="5" width="32" height="38" rx="6" fill="none" stroke="#9FB1CF" stroke-width="3.5"/><path d="M15 16h18M15 24h18M15 32h11" stroke="#9FB1CF" stroke-width="3.5" stroke-linecap="round"/></svg>`,
};
document.getElementById("hd").innerHTML = `<div class="no">${NO}</div>
  <div class="rule">${ICON.dip}<span>★</span><span style="color:var(--Y)">−10%</span><span style="color:var(--N)">→</span><span class="tag b">BUY</span></div>
  <div class="sellrule"><span class="tag b" style="font-size:22px;padding:7px 10px">BUY</span>${ICON.cal}<span style="color:#DDE5F2">1Y</span><span>→</span><span class="tag s" style="font-size:22px;padding:7px 10px">SELL</span></div>`;
const D = AN.dates[cur];
document.getElementById("date").innerHTML = `${D.slice(0, 4)}.${D.slice(5, 7)}.${D.slice(8, 10)}`;

// ---------- 오른쪽 카드 ----------
const v = R.value[cur], tot = v / AN.capital - 1;
const spark = (() => {                                       // 계좌 가치 작은 그래프 (그날까지)
  const w = 480, h = 92, lo = Math.min(...R.value.slice(0, cur + 1)), hi = Math.max(...R.value.slice(0, cur + 1));
  const sx = i => i / Math.max(1, N - 1) * w, sy = y => h - 6 - (y - lo) / Math.max(1, hi - lo) * (h - 12);
  let d = ""; for (let i = 0; i <= cur; i += 3) d += (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(R.value[i]).toFixed(1);
  d += "L" + sx(cur).toFixed(1) + " " + sy(R.value[cur]).toFixed(1);
  const base = sy(AN.capital);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:14px">
    <line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="#FFD400" stroke-dasharray="7 7" stroke-width="2" opacity=".6"/>
    <path d="${d}" fill="none" stroke="#2BE0A0" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="${sx(cur)}" cy="${sy(R.value[cur])}" r="7" fill="#fff"/></svg>`;
})();
const open = R.trades.find(t => t.b <= cur && (t.s > cur || (t.open && t.s >= cur)));
let state;
if (open) {
  const dd = cur - open.b, ur = (AN.close[cur] / open.bp) * (1 - 0.001) - 1;   // 그날 종가로 평가 (산 비용 포함)
  state = `<div class="row"><span class="tag b" style="font-size:34px;padding:12px 18px">BUY</span>
      <span class="mid tab" style="color:#DDE5F2">${f0(open.bp)} <span style="color:var(--N)">→</span> ${f0(AN.close[cur])}</span></div>
    <div class="bar"><i style="width:${(dd / AN.hold_days * 100).toFixed(1)}%"></i></div>
    <div class="row"><span class="sm tab" style="display:flex;align-items:center;gap:8px">${ICON.cal}${dd} / ${AN.hold_days}</span><span class="mid tab ${ur >= 0 ? "up" : "dn"}">${pc(ur)}</span>
      <span class="tag s" style="font-size:22px;padding:7px 10px;opacity:.55">SELL</span></div>`;
} else {
  state = `<div class="row"><span class="mid" style="color:var(--N)">$ ⌛</span><span class="sm">★ −10% ?</span></div>`;
}
const done = R.trades.filter(t => t.b <= cur);
const rows = done.slice(-4).map((t, k) => {
  const n = done.length - Math.min(4, done.length) + k + 1, isOpen = t.s > cur || (t.open && t.s >= cur);
  const bd = AN.dates[t.b].slice(2).replace(/-/g, "."), sd = isOpen ? "…" : AN.dates[t.s].slice(2).replace(/-/g, ".");
  const r = isOpen ? (AN.close[cur] / t.bp) * (1 - 0.001) - 1 : t.r;
  return `<div class="tr ${isOpen ? "open" : ""}"><span class="k">${n}</span><span class="d tab"><b class="b">BUY</b>${bd}</span><span style="color:var(--N)">→</span>
    <span class="d tab">${isOpen ? `<b class="s" style="opacity:.45">SELL</b>…` : `<b class="s">SELL</b>${sd}`}</span><span class="r tab ${r >= 0 ? "up" : "dn"}">${pc(r)}</span></div>`;
}).join("");
const closed = done.filter(t => !(t.s > cur || (t.open && t.s >= cur)));
const wins = closed.filter(t => t.r > 0).length;
document.getElementById("side").innerHTML = `
  <div class="card"><div class="ch">${ICON.wallet}<span class="tab">$${f0(AN.capital)}</span><span>→</span></div>
    <div class="row"><span class="big tab">$${f0(v)}</span><span class="mid tab ${tot >= 0 ? "up" : "dn"}">${pc(tot)}</span></div>${spark}</div>
  <div class="card"><div class="ch">${ICON.now}</div>${state}</div>
  <div class="card"><div class="ch">${ICON.log}<span class="tab">${done.length}</span></div>${rows}
    <div class="foot tab"><span class="up">▲ ${wins}</span><span class="dn">▼ ${closed.length - wins}</span></div></div>`;
window.READY = true;
</script></body></html>
