<script id="ep-data">/*EP-DATA:BEGIN*/window.EP={"id":"myeonse-hwangeup-2026-10","topic":"test","duration":438.66,"audio":null,"thumb":null,"estimated":true,"est_model":{"perSyl":0.151,"comma":0.25,"base":-0.08,"min":0.8,"lead":0.3,"gap":0.45,"part":1,"tail":0.8},"synced":"2026-10-24T06:38:59Z","sent":[{"n":1,"part":"도입","text":"11월 1일부터 일본 면세는, 출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다.","start":0.3,"end":6.057},{"n":2,"part":"도입","text":"방법을 모르고 가면, 붐비는 날엔 공항에서 면세 때문에만 1시간 반 넘게 쓸 수 있습니다.","start":6.507,"end":11.962},{"n":3,"part":"도입","text":"최악의 경우엔 2시간 반 넘게 걸릴 수도 있어요.","start":12.412,"end":15.201},{"n":4,"part":"도입","text":"알고 가면, 줄을 거의 서지 않고 최소 약 2분 만에 끝낼 수 있습니다.","start":15.651,"end":19.747},{"n":5,"part":"도입","text":"그럼 어떻게 해야 가장 빠르게 면세 받을 수 있을까요?","start":20.197,"end":23.288},{"n":6,"part":"도입","text":"만약 11월 이후 일본에서 직접 면세를 받는다고 가정해 보겠습니다.","start":23.738,"end":27.886},{"n":7,"part":"첫째, 출국 전","text":"당신은 11월에 도쿄로 3박 4일 여행을 갈 예정입니다.","start":28.886,"end":32.279},{"n":8,"part":"첫째, 출국 전","text":"비지트 재팬 웹은 입국 심사와 세관 신고에도 쓰는 일본 정부의 웹 서비스입니다.","start":32.729,"end":37.481},{"n":9,"part":"첫째, 출국 전","text":"그런데 출국 전에 이걸 설정하지 않으면, 공항에서 빠르게 면세 수속을 할 수 없습니다.","start":37.931,"end":43.235},{"n":10,"part":"첫째, 출국 전","text":"일곱 개 공항에서는 비지트 재팬 웹으로 휴대전화 면세 수속을 할 수 있기 때문입니다.","start":43.685,"end":48.739},{"n":11,"part":"첫째, 출국 전","text":"나리타, 하네다, 간사이, 주부, 후쿠오카, 신치토세, 나하 공항입니다.","start":49.189,"end":54.535},{"n":12,"part":"첫째, 출국 전","text":"출국 전에 미리 설정해 두지 않으면, 공항에서 휴대전화 수속을 쓸 수 없습니다.","start":54.985,"end":59.836},{"n":13,"part":"첫째, 출국 전","text":"주의할 점도 있습니다.","start":60.286,"end":61.565},{"n":14,"part":"첫째, 출국 전","text":"휴대전화 수속은 공항 밖에서는 할 수 없습니다.","start":62.015,"end":64.804},{"n":15,"part":"첫째, 출국 전","text":"공항 출발 로비에서, 보안 검사장에 들어가기 전의 전용 와이파이에 연결해야만 됩니다.","start":65.254,"end":70.709},{"n":16,"part":"첫째, 출국 전","text":"그래서 첫 번째는, 출국 전에 비지트 재팬 웹을 설정해 둬야 한다는 것입니다.","start":71.159,"end":75.859},{"n":17,"part":"둘째, 쇼핑할 때","text":"일본에 도착한 첫날, 돈키호테에서 과자와 화장품을 한 번에 계산했습니다.","start":76.859,"end":81.559},{"n":18,"part":"둘째, 쇼핑할 때","text":"여기서 과자 한 봉지를 먹으면, 같이 산 화장품도 면세를 받을 수 없게 됩니다.","start":82.009,"end":86.709},{"n":19,"part":"둘째, 쇼핑할 때","text":"일본에서 먹을 과자와 화장품을 한 영수증으로 계산한 것이 실수였죠.","start":87.159,"end":91.307},{"n":20,"part":"둘째, 쇼핑할 때","text":"면세 수속 때 세관 확인은 영수증 단위로 합니다.","start":91.757,"end":94.546},{"n":21,"part":"둘째, 쇼핑할 때","text":"한 영수증에 든 물건 가운데 하나라도 없으면, 그 영수증 전체가 환급되지 않는 거죠.","start":94.996,"end":100.149},{"n":22,"part":"둘째, 쇼핑할 때","text":"과자 한 봉지 때문에, 같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다.","start":100.599,"end":105.299},{"n":23,"part":"둘째, 쇼핑할 때","text":"게다가 먹어서 없어진 물건이 있으면, 단말기로는 확인을 받을 수 없습니다.","start":105.749,"end":110.449},{"n":24,"part":"둘째, 쇼핑할 때","text":"그래서 공항에 가면 세관 창구를 찾아가, 먹은 물건이 있다고 직접 신고해야 합니다.","start":110.899,"end":116.052},{"n":25,"part":"둘째, 쇼핑할 때","text":"그래서 두 번째는, 일본에서 먹거나 쓸 물건은 면세품과 따로 계산해야 한다는 것입니다.","start":116.502,"end":121.957},{"n":26,"part":"둘째, 쇼핑할 때","text":"그러면 과자를 먹어도, 화장품 영수증은 그대로 환급받을 수 있습니다.","start":122.407,"end":126.805},{"n":27,"part":"둘째, 쇼핑할 때","text":"둘째 날에는 세금 포함 3만 3천 엔인 옷을 샀습니다.","start":127.255,"end":130.346},{"n":28,"part":"둘째, 쇼핑할 때","text":"면세를 받으면, 그중 3천 엔이 나중에 돌려받을 소비세인데요.","start":130.796,"end":134.741},{"n":29,"part":"둘째, 쇼핑할 때","text":"여기서 세 번째 실수는 돌려받는 방법입니다.","start":135.191,"end":137.829},{"n":30,"part":"둘째, 쇼핑할 때","text":"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다.","start":138.279,"end":142.224},{"n":31,"part":"둘째, 쇼핑할 때","text":"업계 발표로는 공항 현금 환급 단말기가 하네다, 나리타, 나하의 다섯 곳에 생깁니다.","start":142.674,"end":148.077},{"n":32,"part":"둘째, 쇼핑할 때","text":"현금으로 받으려면, 출국하는 날 그 단말기 앞에 줄을 서야 합니다.","start":148.527,"end":152.623},{"n":33,"part":"둘째, 쇼핑할 때","text":"또 환급 업체 수수료는 법으로 정해져 있지 않아서, 매장마다 다를 수 있습니다.","start":153.073,"end":157.924},{"n":34,"part":"둘째, 쇼핑할 때","text":"그래서 세 번째는, 살 때 돌려받는 방법을 카드로 등록하고 수수료를 물어보는 것입니다.","start":158.374,"end":163.829},{"n":35,"part":"둘째, 쇼핑할 때","text":"카드로 받으면 공항에서 줄을 설 필요가 없습니다.","start":164.279,"end":167.219},{"n":36,"part":"둘째, 쇼핑할 때","text":"다만 카드로 며칠 만에 들어오는지는, 아직 공식 설명이 없습니다.","start":167.669,"end":171.765},{"n":37,"part":"셋째, 공항에서","text":"이제 여행을 마치고, 오후 6시에 출발하는 비행기를 타러 갑니다.","start":172.765,"end":176.861},{"n":38,"part":"셋째, 공항에서","text":"당신은 출발 2시간 반 전인 오후 3시 반에 나리타 공항에 도착합니다.","start":177.311,"end":181.459},{"n":39,"part":"셋째, 공항에서","text":"공항은 출발하는 사람이 몰리는 저녁 시간대라고 정하겠습니다.","start":181.909,"end":185.755},{"n":40,"part":"셋째, 공항에서","text":"여기부터 나오는 시간은 실제로 잰 것이 아니라, 모의실험으로 계산한 값입니다.","start":186.205,"end":191.207},{"n":41,"part":"셋째, 공항에서","text":"단말기 수처럼 공개되지 않은 숫자는 가정했기 때문에, 실제와는 다를 수 있습니다.","start":191.657,"end":196.81},{"n":42,"part":"셋째, 공항에서","text":"세관 확인은 짐을 맡기기 전, 출발 로비의 면세 수속 단말기에서 합니다.","start":197.26,"end":201.658},{"n":43,"part":"셋째, 공항에서","text":"하지만 과자를 먹은 당신은, 먼저 세관 창구로 가야 합니다.","start":202.108,"end":205.751},{"n":44,"part":"셋째, 공항에서","text":"붐비는 시간이라 창구 줄이 길어서, 세관 신고를 마치면 오후 4시 22분입니다.","start":206.201,"end":211.354},{"n":45,"part":"셋째, 공항에서","text":"걷고, 줄 서고, 신고하는 데만 약 52분이 걸린 겁니다.","start":211.804,"end":215.546},{"n":46,"part":"셋째, 공항에서","text":"이제야 체크인을 합니다.","start":215.996,"end":217.426},{"n":47,"part":"셋째, 공항에서","text":"나리타의 현금 환급 단말기는 출국 심사 전 구역에 있어서, 보안 검사 전에 들러야 합니다.","start":217.876,"end":223.331},{"n":48,"part":"셋째, 공항에서","text":"그런데 현금으로 받으려는 사람이 몰려, 여기서도 약 46분이 걸립니다.","start":223.781,"end":228.481},{"n":49,"part":"셋째, 공항에서","text":"체크인을 빼고도, 면세에만 약 1시간 38분을 쓴 셈입니다.","start":228.931,"end":232.876},{"n":50,"part":"셋째, 공항에서","text":"2시간 반 일찍 왔는데, 그중 1시간 반 넘게를 줄과 창구에서 보낸 거죠.","start":233.326,"end":237.724},{"n":51,"part":"셋째, 공항에서","text":"이보다 더 나쁜 실수도 있습니다.","start":238.174,"end":240.057},{"n":52,"part":"셋째, 공항에서","text":"일본에서 산 물건을 캐리어에 넣고, 체크인 카운터에서 짐부터 맡기는 겁니다.","start":240.507,"end":245.358},{"n":53,"part":"셋째, 공항에서","text":"세관 확인은 짐을 맡기기 전에 받아야 하고, 한 번 맡긴 짐은 되찾아 올 수 없습니다.","start":245.808,"end":250.81},{"n":54,"part":"셋째, 공항에서","text":"그러면 캐리어에 든 물건의 세금은, 한 푼도 돌려받지 못합니다.","start":251.26,"end":255.205},{"n":55,"part":"셋째, 공항에서","text":"그래서 네 번째는, 공항에 도착하면 체크인보다 먼저 면세 수속부터 하는 것입니다.","start":255.655,"end":260.808},{"n":56,"part":"셋째, 공항에서","text":"면세품은 가방 하나에 모아 두고, 수속이 끝날 때까지 맡기지 마세요.","start":261.258,"end":265.505},{"n":57,"part":"셋째, 공항에서","text":"빨간색이 떠서 검사를 받게 되면, 그 가방만 열어 보여 주면 되니까요.","start":265.955,"end":270.202},{"n":58,"part":"셋째, 공항에서","text":"단말기 앞 줄이 길 때, 그냥 줄만 서 있는 것도 실수입니다.","start":270.652,"end":274.144},{"n":59,"part":"셋째, 공항에서","text":"단말기가 모자란 공항이라고 가정하면, 단말기 줄만 선 사람은 약 94분이 걸렸습니다.","start":274.594,"end":280.2},{"n":60,"part":"셋째, 공항에서","text":"줄을 보고 휴대전화로 바꾼 사람은, 약 3분 반이면 끝났고요.","start":280.65,"end":284.444},{"n":61,"part":"셋째, 공항에서","text":"그래서 다섯 번째는, 단말기 줄을 보고 수속 방법을 고르는 것입니다.","start":284.894,"end":289.141},{"n":62,"part":"셋째, 공항에서","text":"줄이 짧으면 단말기에 여권을 대고, 길면 전용 와이파이 구역에서 휴대전화로 수속합니다.","start":289.591,"end":295.197},{"n":63,"part":"셋째, 공항에서","text":"휴대전화로 잘 안 되면, 그때는 단말기로 하면 됩니다.","start":295.647,"end":298.988},{"n":64,"part":"넷째, 다 지킨 당신","text":"그럼 이 방법을 다 지킨 당신은 어땠을까요?","start":299.988,"end":302.475},{"n":65,"part":"넷째, 다 지킨 당신","text":"같은 날 오후 3시 반, 당신은 나리타 공항에 도착합니다.","start":302.925,"end":306.417},{"n":66,"part":"넷째, 다 지킨 당신","text":"체크인보다 먼저, 줄을 보고 단말기나 휴대전화로 수속합니다.","start":306.867,"end":310.812},{"n":67,"part":"넷째, 다 지킨 당신","text":"화면에 초록색이 뜨면, 그걸로 세관 확인은 끝입니다.","start":311.262,"end":314.603},{"n":68,"part":"넷째, 다 지킨 당신","text":"걸린 시간은 약 2분, 시계는 오후 3시 32분입니다.","start":315.053,"end":318.545},{"n":69,"part":"넷째, 다 지킨 당신","text":"이제 면세품 가방도 맡기고, 바로 체크인하면 됩니다.","start":318.995,"end":322.336},{"n":70,"part":"넷째, 다 지킨 당신","text":"돈은 카드로 들어오니, 현금 단말기 줄을 설 필요도 없습니다.","start":322.786,"end":326.58},{"n":71,"part":"넷째, 다 지킨 당신","text":"그럼 운 나쁘게 빨간색이 뜨면 어떻게 될까요?","start":327.03,"end":329.668},{"n":72,"part":"넷째, 다 지킨 당신","text":"빨간색은 세관이 검사가 필요하다고 본 경우로, 기준은 공개되지 않았습니다.","start":330.118,"end":334.969},{"n":73,"part":"넷째, 다 지킨 당신","text":"휴대전화로 수속해도 빨간색은 똑같이 뜰 수 있어요.","start":335.419,"end":338.51},{"n":74,"part":"넷째, 다 지킨 당신","text":"이때는 세관 검사장에 가서 산 물건을 직접 보여 줘야 합니다.","start":338.96,"end":342.504},{"n":75,"part":"넷째, 다 지킨 당신","text":"붐비는 시간이라 줄이 길어서, 검사가 끝나면 오후 4시 20분입니다.","start":342.954,"end":347.352},{"n":76,"part":"넷째, 다 지킨 당신","text":"약 50분이 걸렸지만, 출발까지는 아직 1시간 40분이 남습니다.","start":347.802,"end":352.049},{"n":77,"part":"넷째, 다 지킨 당신","text":"그래서 여섯 번째는, 휴대전화로 수속하더라도 공항에는 시간 여유를 두고 가는 것입니다.","start":352.499,"end":358.105},{"n":78,"part":"넷째, 다 지킨 당신","text":"관광청도 시간에 여유를 두고 공항에 오라고 안내합니다.","start":358.555,"end":361.948},{"n":79,"part":"넷째, 다 지킨 당신","text":"시간이 모자라 비행기를 놓쳐도, 항공사나 세관은 보상하지 않습니다.","start":362.398,"end":366.796},{"n":80,"part":"다섯째, 차이를 만든 것","text":"그럼 실수를 하나씩 고치면, 시간은 얼마나 달라질까요?","start":367.796,"end":371.288},{"n":81,"part":"다섯째, 차이를 만든 것","text":"빨간색이 뜨는 경우까지 넣어 평균으로 따지면, 모르고 간 당신은 약 1시간 38분입니다.","start":371.738,"end":377.495},{"n":82,"part":"다섯째, 차이를 만든 것","text":"과자만 따로 계산해도, 세관 창구에 갈 일이 없어 약 49분으로 줄어듭니다.","start":377.945,"end":382.796},{"n":83,"part":"다섯째, 차이를 만든 것","text":"같은 조건에서 현금 대신 카드로만 바꿔도, 약 40분이 줄었습니다.","start":383.246,"end":387.493},{"n":84,"part":"다섯째, 차이를 만든 것","text":"여섯 가지 방법을 다 지키면, 평균 약 8분이 됩니다.","start":387.943,"end":391.133},{"n":85,"part":"다섯째, 차이를 만든 것","text":"반대로 공항이 한산하면, 실수를 해도 약 12분이면 끝났습니다.","start":391.583,"end":395.679},{"n":86,"part":"다섯째, 차이를 만든 것","text":"결국 붐비는 시간일수록, 방법을 아느냐 모르느냐가 1시간 넘는 차이를 만듭니다.","start":396.129,"end":401.282},{"n":87,"part":"정리","text":"마지막으로, 가장 빠르게 면세 받는 방법을 정리하겠습니다.","start":402.282,"end":406.076},{"n":88,"part":"정리","text":"하나, 출국 전에 비지트 재팬 웹을 설정해 두세요.","start":406.526,"end":409.565},{"n":89,"part":"정리","text":"둘, 일본에서 먹거나 쓸 물건은 따로 계산하세요.","start":410.015,"end":413.054},{"n":90,"part":"정리","text":"셋, 살 때 환급 방법은 카드로 등록하고, 수수료를 물어보세요.","start":413.504,"end":417.548},{"n":91,"part":"정리","text":"넷, 공항에서는 체크인보다 먼저, 면세품 가방을 맡기기 전에 수속하세요.","start":417.998,"end":422.797},{"n":92,"part":"정리","text":"다섯, 단말기 줄을 보고 단말기나 휴대전화로 수속하세요.","start":423.247,"end":426.89},{"n":93,"part":"정리","text":"여섯, 빨간색이 뜰 수 있으니, 공항에는 시간 여유를 두고 가세요.","start":427.34,"end":431.535},{"n":94,"part":"정리","text":"그리고 산 날부터 90일 안에 출국해야 한다는 것도 잊지 마세요.","start":431.985,"end":435.831},{"n":95,"part":"정리","text":"시청해주셔서 감사합니다.","start":436.281,"end":437.862}],"subs":[[0.3,6.057,"11월 1일부터 일본 면세는,\n출국하는 공항에서 세관 확인을 받아야 세금을 돌려받습니다."],[6.507,11.962,"방법을 모르고 가면, 붐비는 날엔 공항에서\n면세 때문에만 1시간 반 넘게 쓸 수 있습니다."],[12.412,15.201,"최악의 경우엔 2시간 반 넘게 걸릴 수도 있어요."],[15.651,19.747,"알고 가면, 줄을 거의 서지 않고 최소 약 2분 만에 끝낼 수 있습니다."],[20.197,23.288,"그럼 어떻게 해야 가장 빠르게 면세 받을 수 있을까요?"],[23.738,27.886,"만약 11월 이후 일본에서 직접 면세를 받는다고 가정해 보겠습니다."],[28.886,32.279,"당신은 11월에 도쿄로 3박 4일 여행을 갈 예정입니다."],[32.729,37.481,"비지트 재팬 웹은 입국 심사와 세관 신고에도\n쓰는 일본 정부의 웹 서비스입니다."],[37.931,43.235,"그런데 출국 전에 이걸 설정하지 않으면,\n공항에서 빠르게 면세 수속을 할 수 없습니다."],[43.685,48.739,"일곱 개 공항에서는 비지트 재팬 웹으로\n휴대전화 면세 수속을 할 수 있기 때문입니다."],[49.189,54.535,"나리타, 하네다, 간사이, 주부, 후쿠오카, 신치토세, 나하 공항입니다."],[54.985,59.836,"출국 전에 미리 설정해 두지 않으면,\n공항에서 휴대전화 수속을 쓸 수 없습니다."],[60.286,61.565,"주의할 점도 있습니다."],[62.015,64.804,"휴대전화 수속은 공항 밖에서는 할 수 없습니다."],[65.254,70.709,"공항 출발 로비에서,\n보안 검사장에 들어가기 전의 전용 와이파이에 연결해야만 됩니다."],[71.159,75.859,"그래서 첫 번째는,\n출국 전에 비지트 재팬 웹을 설정해 둬야 한다는 것입니다."],[76.859,81.559,"일본에 도착한 첫날,\n돈키호테에서 과자와 화장품을 한 번에 계산했습니다."],[82.009,86.709,"여기서 과자 한 봉지를 먹으면,\n같이 산 화장품도 면세를 받을 수 없게 됩니다."],[87.159,91.307,"일본에서 먹을 과자와 화장품을 한 영수증으로 계산한 것이 실수였죠."],[91.757,94.546,"면세 수속 때 세관 확인은 영수증 단위로 합니다."],[94.996,100.149,"한 영수증에 든 물건 가운데 하나라도 없으면,\n그 영수증 전체가 환급되지 않는 거죠."],[100.599,105.299,"과자 한 봉지 때문에,\n같이 산 화장품의 세금까지 돌려받지 못하게 된 겁니다."],[105.749,110.449,"게다가 먹어서 없어진 물건이 있으면,\n단말기로는 확인을 받을 수 없습니다."],[110.899,116.052,"그래서 공항에 가면 세관 창구를 찾아가,\n먹은 물건이 있다고 직접 신고해야 합니다."],[116.502,121.957,"그래서 두 번째는,\n일본에서 먹거나 쓸 물건은 면세품과 따로 계산해야 한다는 것입니다."],[122.407,126.805,"그러면 과자를 먹어도, 화장품 영수증은 그대로 환급받을 수 있습니다."],[127.255,130.346,"둘째 날에는 세금 포함 3만 3천 엔인 옷을 샀습니다."],[130.796,134.741,"면세를 받으면, 그중 3천 엔이 나중에 돌려받을 소비세인데요."],[135.191,137.829,"여기서 세 번째 실수는 돌려받는 방법입니다."],[138.279,142.224,"살 때 아무것도 묻지 않고, 공항에서 현금으로 받기로 했습니다."],[142.674,148.077,"업계 발표로는 공항 현금 환급 단말기가 하네다,\n나리타, 나하의 다섯 곳에 생깁니다."],[148.527,152.623,"현금으로 받으려면, 출국하는 날 그 단말기 앞에 줄을 서야 합니다."],[153.073,157.924,"또 환급
